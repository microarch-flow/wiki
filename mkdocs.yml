site_name: 技术笔记
site_description: 从基础原理到工程实践的技术文章
site_url: https://microarch-flow.github.io/wiki/
repo_url: https://github.com/microarch-flow/wiki
repo_name: microarch-flow/wiki
docs_dir: .site-build/docs
site_dir: .site-build/site
not_in_nav: |
  /reviews/
hooks:
  - website/hooks.py
  - website/inference_math.py
theme:
  name: material
  language: zh
  font: false
  logo: assets/images/series-mark.svg
  favicon: assets/images/series-mark.svg
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    primary: custom
    accent: custom
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/stylesheets/site.css
  - assets/vendor/katex/katex.min.css
  - assets/stylesheets/inference-math.css
extra_javascript:
  - assets/javascripts/navigation.js
  - assets/javascripts/visuals.js
  - assets/javascripts/sram.js
  - assets/javascripts/ram-overview.js
  - assets/vendor/katex/katex.min.js
  - assets/javascripts/inference-math.js
extra:
  generator: false
