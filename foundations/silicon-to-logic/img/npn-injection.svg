<svg xmlns="http://www.w3.org/2000/svg" width="520" height="266" viewBox="0 0 520 266" role="img" aria-labelledby="title desc">
  <title id="title">NPN 的正向放大区</title>
  <desc id="desc">N 型发射区向 P 型基区注入电子。大部分电子穿过薄基区，被集电结收集。发射结为正偏，集电结为反偏。</desc>
  <rect x="1" y="1" width="518" height="264" rx="15" fill="#eef3e9" stroke="#cddccd"/>
  <rect x="32" y="88" width="154" height="105" fill="#c5dfcf"/>
  <rect x="186" y="88" width="106" height="105" fill="#f0dfc3"/>
  <rect x="292" y="88" width="196" height="105" fill="#dceadc"/>
  <rect x="32" y="88" width="456" height="105" fill="none" stroke="#6d8677" stroke-width="2"/>
  <path d="M186 88V193 M292 88V193" stroke="#6d8677" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M109 62V88 M239 62V88 M390 62V88" fill="none" stroke="#173d35" stroke-width="2.5"/>
  <path d="M100 158H431 M431 158l-13-8 M431 158l-13 8" fill="none" stroke="#2f6f62" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186 194V209l-24 16 M292 194V209l24 16" fill="none" stroke="#6d8677" stroke-width="1.8"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#173d35" font-size="21">
    <g font-weight="600">
      <text x="109" y="48">发射极 E</text><text x="239" y="48">基极 B</text><text x="390" y="48">集电极 C</text>
      <text x="109" y="122">N⁺</text><text x="239" y="122">P</text><text x="390" y="122">N</text>
    </g>
    <text x="79" y="166" fill="#2f6f62">e⁻</text>
    <text x="109" y="243" font-size="20">发射结正偏</text>
    <text x="390" y="243" font-size="20">集电结反偏</text>
  </g>
</svg>
