<div class="sram-demo" data-sram-demo="__MODE__" data-phase="idle">
  <div class="sram-demo-header"><h3>__TITLE__</h3></div>
  <p class="sram-demo-intro">__INTRO__</p>
  <div class="sram-canvas" id="sram-arrow-__MODE__">
    __CIRCUIT__
    <dl class="sram-signals" aria-label="当前阶段的信号和节点电平">
