<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">存储系统的数据路径</title>
  <desc id="desc">请求从计算单元经过 cache 和控制器，访问 DRAM；数据沿路径返回。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d6e6da"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cfe9a5"/></marker>
  </defs>
  <rect width="760" height="520" rx="24" fill="#e8f0e8"/>
  <rect x="20" y="20" width="720" height="480" rx="18" fill="url(#grid)"/>
  <text x="74" y="72" fill="#557b6a" font-family="sans-serif" font-size="15" letter-spacing="2">STORAGE / DATA PATH</text>
  <rect x="64" y="112" width="632" height="302" rx="22" fill="#123d35"/>
  <rect x="77" y="125" width="606" height="276" rx="15" fill="#174b40" stroke="#8db3a1" stroke-opacity=".5"/>
  <path d="M224 204H286M438 204H500M575 252V278H463" fill="none" stroke="#cfe9a5" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M284 222H226M498 222H440M464 329H548V270" fill="none" stroke="#8bb9a5" stroke-width="2" stroke-dasharray="5 7"/>
  <rect x="96" y="165" width="128" height="86" rx="9" fill="#d6efa1"/>
  <path d="M112 183h96M112 198h96M112 213h96M136 177v49M160 177v49M184 177v49" fill="none" stroke="#99bc70"/>
  <text x="160" y="238" text-anchor="middle" fill="#173e34" font-family="sans-serif" font-size="19" font-weight="700" letter-spacing="1.3">COMPUTE</text>
  <rect x="286" y="165" width="152" height="86" rx="9" fill="#8bb9a5"/>
  <g fill="#427968"><rect x="302" y="181" width="23" height="14" rx="2"/><rect x="330" y="181" width="23" height="14" rx="2"/><rect x="358" y="181" width="23" height="14" rx="2"/><rect x="386" y="181" width="23" height="14" rx="2"/><rect x="302" y="201" width="23" height="14" rx="2"/><rect x="330" y="201" width="23" height="14" rx="2"/><rect x="358" y="201" width="23" height="14" rx="2"/><rect x="386" y="201" width="23" height="14" rx="2"/></g>
  <text x="362" y="238" text-anchor="middle" fill="#173e34" font-family="sans-serif" font-size="19" font-weight="700" letter-spacing="1.3">CACHE</text>
  <rect x="500" y="165" width="150" height="86" rx="9" fill="#377665"/>
  <path d="M521 186h108M521 200h69M521 214h89" fill="none" stroke="#a9d0b5" stroke-width="3" stroke-linecap="round"/>
  <text x="575" y="238" text-anchor="middle" fill="#e7f1df" font-family="sans-serif" font-size="19" font-weight="700" letter-spacing="1.2">CONTROLLER</text>
  <rect x="282" y="282" width="182" height="78" rx="8" fill="#e2bd90"/>
  <g fill="#bc946b"><rect x="299" y="296" width="27" height="18" rx="2"/><rect x="333" y="296" width="27" height="18" rx="2"/><rect x="367" y="296" width="27" height="18" rx="2"/><rect x="401" y="296" width="27" height="18" rx="2"/></g>
  <text x="373" y="345" text-anchor="middle" fill="#403b2e" font-family="sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">DRAM</text>
  <text x="76" y="468" fill="#557b6a" font-family="sans-serif" font-size="19" letter-spacing="1.2">REQUEST · STORAGE · RETURN</text>
  <circle cx="655" cy="462" r="7" fill="#db9d77"/><circle cx="678" cy="462" r="7" fill="#b3ca9d"/>
</svg>
