<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">推理请求的执行过程</title>
  <desc id="desc">请求经过调度、预填充和解码；执行过程中使用并更新 KV cache。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d6e6da"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d6efa1"/></marker>
  </defs>
  <rect width="760" height="520" rx="24" fill="#e8f0e8"/>
  <rect x="20" y="20" width="720" height="480" rx="18" fill="url(#grid)"/>
  <text x="74" y="72" fill="#557b6a" font-family="sans-serif" font-size="15" letter-spacing="2">INFERENCE / SERVING PATH</text>
  <rect x="64" y="112" width="632" height="302" rx="22" fill="#123d35"/>
  <rect x="77" y="125" width="606" height="276" rx="15" fill="#174b40" stroke="#8db3a1" stroke-opacity=".5"/>
  <rect x="99" y="170" width="111" height="108" rx="9" fill="#d6efa1"/>
  <path d="M116 189h77M116 205h57M116 221h68M116 237h47" stroke="#96ba70" stroke-width="4" stroke-linecap="round"/>
  <text x="154" y="263" text-anchor="middle" fill="#173e34" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1.3">REQUESTS</text>
  <rect x="270" y="170" width="111" height="108" rx="9" fill="#8bb9a5"/>
  <path d="M287 189h23v13h-23zM316 189h23v13h-23zM345 189h19v13h-19zM287 208h77M287 225h55" fill="#427968" stroke="#427968" stroke-width="3" stroke-linecap="round"/>
  <text x="325" y="263" text-anchor="middle" fill="#173e34" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1">SCHEDULE</text>
  <rect x="441" y="170" width="105" height="108" rx="9" fill="#387666"/>
  <path d="M458 193h71M458 210h48M458 227h61" stroke="#a9d0b5" stroke-width="4" stroke-linecap="round"/>
  <text x="493" y="263" text-anchor="middle" fill="#e7f1df" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">PREFILL</text>
  <rect x="574" y="170" width="91" height="108" rx="9" fill="#e2bd90"/>
  <path d="M590 193h58M590 210h43M590 227h51" stroke="#ba936c" stroke-width="4" stroke-linecap="round"/>
  <text x="619" y="263" text-anchor="middle" fill="#403b2e" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">DECODE</text>
  <path d="M210 224H264M381 224H435M546 224H568" fill="none" stroke="#d6efa1" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="440" y="319" width="225" height="44" rx="7" fill="#7faf98"/>
  <g fill="#417967"><rect x="455" y="330" width="20" height="14" rx="2"/><rect x="481" y="330" width="20" height="14" rx="2"/><rect x="507" y="330" width="20" height="14" rx="2"/></g>
  <text x="585" y="347" text-anchor="middle" fill="#173e34" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">KV CACHE</text>
  <path d="M493 278v41M619 278v41" fill="none" stroke="#a9d0b5" stroke-width="2.5"/>
  <text x="76" y="468" fill="#557b6a" font-family="sans-serif" font-size="19" letter-spacing="1.2">REQUEST · EXECUTION · CACHE</text>
  <circle cx="655" cy="462" r="7" fill="#db9d77"/><circle cx="678" cy="462" r="7" fill="#b3ca9d"/>
</svg>
