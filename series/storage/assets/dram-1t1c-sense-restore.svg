<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438" role="img" aria-labelledby="title desc">
  <title id="title">一个 DRAM 单元怎样接到差分感测放大器</title>
  <desc id="desc">字线 WL 控制访问晶体管，将电容的存储节点接到位线 BL。开行前两根位线预充到约半电源电压。释放预充并选中单元后，BL 上出现小偏移，另一根位线先作比较参考。感测放大器驱动这对位线，在字线仍导通时把电容恢复到原数据对应的电平。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #21493f }
    .caption { fill: #3d6258; font-size: 18px }
    .name { font-size: 19px; font-weight: 650 }
    .wire { fill: none; stroke: #315e54; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round }
    .control { fill: none; stroke: #8b536a; stroke-width: 3; stroke-linecap: round }
  </style>
  <rect x="1" y="1" width="478" height="436" rx="16" fill="#f5f8f3" stroke="#d1dfd4"/>
  <text x="24" y="40" font-size="25" font-weight="700">一个单元，两根位线</text>

  <!-- Each bitline terminates at a separate port of each peripheral block. -->
  <rect x="56" y="63" width="368" height="43" rx="8" fill="#e5eee5" stroke="#b6cbbc"/>
  <text x="240" y="91" text-anchor="middle" class="name">开行前：两线预充并均衡至约 VDD/2</text>
  <path class="wire" d="M82 106V316 M398 106V316"/>
  <text x="68" y="149" text-anchor="end" class="name">BL</text>
  <text x="384" y="149" text-anchor="end" class="name">参考侧位线</text>

  <!-- One access nMOS. Its insulated gate and electrical channel are separate. -->
  <path class="wire" d="M82 204H159 M201 204H263V236"/>
  <path d="M159 204H201" stroke="#315e54" stroke-width="7" stroke-linecap="square"/>
  <path class="control" d="M158 194H202 M180 194V164H161"/>
  <text x="153" y="170" text-anchor="end" class="name" style="fill:#80475f">WL</text>
  <text x="180" y="235" text-anchor="middle" class="caption">访问管</text>
  <circle cx="82" cy="204" r="4.5" fill="#315e54"/>
  <circle cx="263" cy="204" r="5" fill="#af632e"/>
  <text x="253" y="189" class="name" style="fill:#8f532f">存储节点</text>
  <!-- Capacitor between the storage node and the cell plate. -->
  <path class="wire" d="M240 236H286 M240 246H286 M263 246V267"/>
  <text x="297" y="251" class="name">电容</text>
  <text x="263" y="290" text-anchor="middle" class="caption">公共极板电位</text>

  <rect x="56" y="316" width="368" height="48" rx="8" fill="#d9eadf" stroke="#83aa95" stroke-width="1.5"/>
  <text x="240" y="347" text-anchor="middle" font-size="21" font-weight="700">感测放大器</text>
  <text x="24" y="395" class="caption">放大器判别微小压差，将两线一拉高、一拉低。</text>
  <text x="24" y="421" class="caption">WL 保持高电平，电容经访问管恢复原数据电平。</text>
</svg>
