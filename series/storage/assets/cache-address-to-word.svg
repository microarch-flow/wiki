<svg xmlns="http://www.w3.org/2000/svg" width="460" height="520" viewBox="0 0 460 520" role="img" aria-labelledby="title desc">
  <title id="title">从物理地址 0x00001004 找到 A[1] 的四个字节</title>
  <desc id="desc">32 位物理字节地址按位拆分。位 31 至 12 为 tag，值为 1；位 11 至 6 选择第 0 组；位 5 至 0 给出行内偏移 4。这里有 64 组，每组两路，每行 64 字节。A[0] 已将包含它的行填入第 0 组的 way 0；该路有效且 tag 等于 1，way 1 无效。读取 A[1] 命中 way 0，从这行偏移 4 至 7 取四个字节。</desc>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #203c37 }
    .note { font-size: 18px; fill: #445c54 }
    .section { font-size: 21px; font-weight: 650 }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace }
    .tag { fill: #824224 }
    .index { fill: #075a70 }
    .offset { fill: #23644e }
    .label { font-size: 17px; font-weight: 620 }
    .value { font-size: 20px; font-weight: 650 }
  </style>
  <rect x="1" y="1" width="458" height="518" rx="15" fill="#f7f6ef" stroke="#d3dacf"/>
  <text x="20" y="36" font-size="24" font-weight="680">A[1] 的四个字节在哪里？</text>
  <text x="20" y="69" class="note">32 位物理字节地址</text>
  <text x="198" y="69" class="mono value">0x00001004</text>

  <!-- Field boxes are sized for labels; the ranges give the actual bit widths. -->
  <g text-anchor="middle">
    <rect x="20" y="88" width="155" height="68" rx="6" fill="#f2e5d5" stroke="#cdae95"/>
    <rect x="177" y="88" width="126" height="68" rx="6" fill="#e0edf1" stroke="#9dbcc3"/>
    <rect x="305" y="88" width="135" height="68" rx="6" fill="#e1ede2" stroke="#adc8b1"/>
    <g class="mono label">
      <text x="97" y="113" class="tag">[31:12]</text>
      <text x="240" y="113" class="index">[11:6]</text>
      <text x="372" y="113" class="offset">[5:0]</text>
    </g>
    <g class="value">
      <text x="97" y="143" class="tag">tag = 1</text>
      <text x="240" y="143" class="index">组索引 = 0</text>
      <text x="372" y="143" class="offset">偏移 = 4</text>
    </g>
  </g>

  <text x="20" y="200" class="section index">第 0 组</text>
  <text x="102" y="200" class="note">共 64 组，每组两路</text>
  <text x="20" y="229" class="note">A[0] 的行已填入 way 0，此时两路如下。</text>
  <rect x="20" y="245" width="420" height="85" rx="7" fill="#edf1eb" stroke="#bacabf"/>
  <path d="M20 287h420" stroke="#bacabf"/>
  <g font-size="19">
    <text x="35" y="273" font-weight="650">way 0</text>
    <text x="122" y="273">有效</text>
    <text x="194" y="273" class="tag" font-weight="650">tag = 1</text>
    <text x="325" y="273" class="offset" font-weight="700">命中</text>
    <text x="35" y="315">way 1</text>
    <text x="122" y="315">无效</text>
    <text x="194" y="315" class="note">忽略 tag</text>
  </g>

  <text x="20" y="373" class="section">way 0 的 64 B 数据行</text>
  <text x="20" y="405" class="note">行内字节偏移</text>
  <g text-anchor="middle" font-size="19">
    <rect x="20" y="416" width="72" height="43" rx="5" fill="#e7eae2" stroke="#b8c3b9"/>
    <rect x="96" y="416" width="210" height="43" rx="5" fill="#d7e9dc" stroke="#5b8b72" stroke-width="1.8"/>
    <path d="M148.5 416v43m52.5-43v43m52.5-43v43" fill="none" stroke="#7ba08b"/>
    <rect x="310" y="416" width="130" height="43" rx="5" fill="#e7eae2" stroke="#b8c3b9"/>
    <text x="56" y="444">0–3</text>
    <g class="mono offset" font-weight="650">
      <text x="122" y="445">4</text><text x="175" y="445">5</text>
      <text x="227" y="445">6</text><text x="280" y="445">7</text>
    </g>
    <text x="375" y="444">8–63</text>
  </g>
  <path d="M97 465v7h208v-7 M201 472v7" stroke="#44765b" stroke-width="1.8" fill="none"/>
  <text x="201" y="502" class="value offset" text-anchor="middle">读 A[1] 返回这 4 B</text>
</svg>
