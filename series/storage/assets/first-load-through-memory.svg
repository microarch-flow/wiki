<svg xmlns="http://www.w3.org/2000/svg" width="460" height="779" viewBox="0 0 460 779" role="img" aria-labelledby="title desc">
  <title id="title">一次 4 B 读取可以在哪里得到数据？</title>
  <desc id="desc">本例中，CPU 读取 A[0]，虚拟地址为 0x00403000。按 4 KiB 页将虚拟页号 0x403 翻译为物理页号 0x1，保留页内偏移 0，得到物理地址 0x1000。L1 有 64 组、每组两路、每行 64 B，检查第 0 组的 tag 1。如果命中，直接返回行内偏移 0 至 3 的四个字节。L1 未命中时，在下层缓存或其他来源找到数据也能返回。仅在这些来源均未满足请求时访问 DRAM。本例的 64 B 块号为 64，映射到通道 0、bank 0、行 0、段号 2。该 bank 初始已预充且没有打开的行。开行使八颗 x8 芯片各打开 1 KiB，合计 8 KiB；所选段从接口传输 64 B，L1 给 CPU 所需的 4 B。</desc>
  <defs>
    <marker id="down" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7.8" refY="5" orient="auto">
      <path d="M1 1 8.5 5 1 9" fill="none" stroke="#65796d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="return" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7.8" refY="5" orient="auto">
      <path d="M1 1 8.5 5 1 9" fill="none" stroke="#23634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #203c37 }
    .head { font-size: 21px; font-weight: 660 }
    .body { font-size: 18px }
    .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-weight: 650 }
    .note { fill: #486056; font-size: 17px }
    .stop { fill: #1e5846 }
    .box { fill: #ecf0e9; stroke: #bdc9bd; stroke-width: 1.3 }
    .answer { fill: #e1ede3; stroke: #96b5a0; stroke-width: 1.3 }
    .flow { stroke: #65796d; stroke-width: 2.3; fill: none; marker-end: url(#down) }
    .exit { stroke: #23634e; stroke-width: 2.3; fill: none; marker-end: url(#return) }
    .qty { font-size: 20px; font-weight: 680; text-anchor: end }
  </style>
  <rect x="1" y="1" width="458" height="777" rx="15" fill="#f7f6ef" stroke="#d3dacf"/>
  <text x="19" y="37" font-size="25" font-weight="680">CPU 读取 A[0] 的 4 B</text>

  <rect x="19" y="56" width="422" height="130" rx="8" fill="#e8f0ee" stroke="#b2c8c0"/>
  <text x="31" y="87" class="head">地址翻译</text>
  <text x="160" y="87" class="body">4 KiB 页，本次页内偏移为 0</text>
  <text x="31" y="122" class="body">虚拟地址</text>
  <text x="126" y="122" class="mono body">0x00403000</text>
  <text x="276" y="122" class="body">页号 0x403</text>
  <path class="flow" d="M144 131v12"/>
  <path class="flow" d="M295 131v12"/>
  <text x="31" y="170" class="body">物理地址</text>
  <text x="126" y="170" class="mono body">0x1000</text>
  <text x="276" y="170" class="body">页号 0x1</text>

  <path class="flow" d="M134 186v20"/>
  <rect x="19" y="210" width="230" height="96" rx="8" class="box"/>
  <text x="31" y="238" class="head">查 L1 的第 0 组</text>
  <text x="31" y="266" class="body">64 组，两路，64 B/行</text>
  <text x="31" y="292" class="body">tag = 1，行内偏移 = 0</text>
  <path class="exit" d="M249 258h32"/>
  <rect x="286" y="211" width="155" height="94" rx="8" class="answer"/>
  <text x="299" y="240" class="head stop">L1 命中</text>
  <text x="299" y="267" class="body stop">取偏移 0–3</text>
  <text x="299" y="292" class="body stop">向 CPU 返回 4 B</text>

  <path class="flow" d="M134 306v42"/>
  <text x="148" y="335" class="note">L1 未命中</text>
  <rect x="19" y="353" width="230" height="67" rx="8" class="box"/>
  <text x="31" y="382" class="head">再找其他副本</text>
  <text x="31" y="406" class="body">检查下层缓存等来源</text>
  <path class="exit" d="M249 386h32"/>
  <rect x="286" y="353" width="155" height="67" rx="8" class="answer"/>
  <text x="299" y="382" class="head stop">找到副本</text>
  <text x="299" y="406" class="body stop">用它返回数据</text>

  <path class="flow" d="M134 420v42"/>
  <text x="148" y="449" class="note">各级未命中，也无其他来源</text>
  <rect x="19" y="467" width="422" height="97" rx="8" fill="#f2e8da" stroke="#cfb99f"/>
  <text x="31" y="496" class="head" style="fill:#73442c">映射到 DRAM</text>
  <text x="31" y="524" class="body">64 B 块号 = 0x1000 ÷ 64 = 64</text>
  <text x="31" y="550" class="body">通道 0，bank 0，行 0，行内段号 2</text>

  <path class="flow" d="M134 564v19"/>
  <text x="31" y="608" class="head">目标 bank 已预充，初始没有打开的行</text>
  <g>
    <rect x="19" y="624" width="422" height="133" rx="8" fill="#ecf0e9" stroke="#bdc9bd"/>
    <path d="M19 669h422 M19 713h422" stroke="#c4d0c4"/>
    <text x="31" y="654" class="body">开行：8 颗 x8 芯片各打开 1 KiB</text>
    <text x="426" y="654" class="qty">8 KiB</text>
    <text x="31" y="698" class="body">传输：DRAM 接口送出段号 2 的数据</text>
    <text x="426" y="698" class="qty">64 B</text>
    <text x="31" y="743" class="body">取数：L1 向 CPU 返回偏移 0–3</text>
    <text x="426" y="743" class="qty">4 B</text>
  </g>
</svg>
