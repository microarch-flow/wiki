<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" role="img" aria-labelledby="title desc">
  <title id="title">处理器读取和 DMA 搬运的示例路径</title>
  <desc id="desc">处理器的读取请求经 cache 和内存控制器到 DRAM，数据沿反方向返回。DMA 分别发起读取和写入请求；数据从 DRAM 经内存控制器和片上互连到 scratchpad，再供计算单元使用。</desc>
  <defs>
    <marker id="request" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#478368"/></marker>
    <marker id="data" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bb7854"/></marker>
  </defs>
  <rect width="980" height="730" rx="22" fill="#f2f7ef"/>
  <g font-family="sans-serif">
    <text x="38" y="48" fill="#789582" font-size="15" font-weight="700" letter-spacing="2">MEMORY SYSTEM / EXAMPLES</text>
    <text x="38" y="88" fill="#254c3c" font-size="23" font-weight="700">01　处理器读取：cache miss</text>
    <text x="38" y="117" fill="#5b7766" font-size="17">虚线向右：读取请求　　实线向左：返回数据</text>
    <g text-anchor="middle">
      <rect x="36" y="138" width="185" height="85" rx="12" fill="#d9efa8"/><text x="128" y="174" fill="#254c3c" font-size="21" font-weight="700">处理器</text><text x="128" y="201" fill="#5d7c69" font-size="16">发出读取 / 使用数据</text>
      <rect x="267" y="138" width="185" height="85" rx="12" fill="#fbfdf9" stroke="#cbdccc" stroke-width="2"/><text x="359" y="174" fill="#254c3c" font-size="21" font-weight="700">Cache</text><text x="359" y="201" fill="#5d7c69" font-size="16">查找与回填</text>
      <rect x="498" y="138" width="195" height="85" rx="12" fill="#fbfdf9" stroke="#cbdccc" stroke-width="2"/><text x="595" y="174" fill="#254c3c" font-size="21" font-weight="700">内存控制器</text><text x="595" y="201" fill="#5d7c69" font-size="16">接收与调度</text>
      <rect x="739" y="138" width="205" height="85" rx="12" fill="#d0e4d4"/><text x="841" y="174" fill="#254c3c" font-size="21" font-weight="700">DRAM</text><text x="841" y="201" fill="#5d7c69" font-size="16">服务读取</text>
    </g>
    <g fill="none" stroke="#478368" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#request)"><path d="M223 159H261"/><path d="M454 159H492"/><path d="M695 159H733"/></g>
    <g fill="none" stroke="#bb7854" stroke-width="3.5" marker-end="url(#data)"><path d="M265 202H227"/><path d="M496 202H458"/><path d="M737 202H699"/></g>
    <text x="38" y="263" fill="#607e6b" font-size="17">数据返回后可供计算使用，仍有效的副本可服务后续访问。</text>
    <path d="M38 292H942" stroke="#d7e5d5" stroke-width="2"/>
    <text x="38" y="337" fill="#254c3c" font-size="23" font-weight="700">02　加速器搬运：显式填充 scratchpad</text>
    <rect x="360" y="365" width="260" height="70" rx="12" fill="#d9efa8"/><text x="490" y="396" text-anchor="middle" fill="#254c3c" font-size="21" font-weight="700">DMA</text><text x="490" y="420" text-anchor="middle" fill="#5d7c69" font-size="16">发起读取和写入请求</text>
    <g fill="none" stroke="#478368" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#request)"><path d="M421 438L289 505"/><path d="M559 438L676 505"/></g>
    <text x="273" y="466" fill="#477860" font-size="16">读取请求</text><text x="634" y="466" fill="#477860" font-size="16">写入请求</text>
    <g text-anchor="middle">
      <rect x="28" y="514" width="150" height="86" rx="12" fill="#d0e4d4"/><text x="103" y="551" fill="#254c3c" font-size="20" font-weight="700">DRAM</text><text x="103" y="579" fill="#5d7c69" font-size="16">源数据</text>
      <rect x="214" y="514" width="150" height="86" rx="12" fill="#fbfdf9" stroke="#cbdccc" stroke-width="2"/><text x="289" y="551" fill="#254c3c" font-size="19" font-weight="700">内存控制器</text><text x="289" y="579" fill="#5d7c69" font-size="16">服务读取</text>
      <rect x="400" y="514" width="160" height="86" rx="12" fill="#fbfdf9" stroke="#cbdccc" stroke-width="2"/><text x="480" y="551" fill="#254c3c" font-size="19" font-weight="700">片上互连</text><text x="480" y="579" fill="#5d7c69" font-size="16">传递数据</text>
      <rect x="596" y="514" width="160" height="86" rx="12" fill="#fbfdf9" stroke="#cbdccc" stroke-width="2"/><text x="676" y="551" fill="#254c3c" font-size="18" font-weight="700">Scratchpad</text><text x="676" y="579" fill="#5d7c69" font-size="16">保存数据</text>
      <rect x="792" y="514" width="160" height="86" rx="12" fill="#d9efa8"/><text x="872" y="551" fill="#254c3c" font-size="19" font-weight="700">计算单元</text><text x="872" y="579" fill="#5d7c69" font-size="16">读取并使用</text>
    </g>
    <g fill="none" stroke="#bb7854" stroke-width="3.5" marker-end="url(#data)"><path d="M180 557H208"/><path d="M366 557H394"/><path d="M562 557H590"/><path d="M758 557H786"/></g>
    <text x="38" y="650" fill="#607e6b" font-size="17">虚线：DMA 发起的请求　　实线：数据传递</text>
    <text x="38" y="681" fill="#607e6b" font-size="17">数据可用后计算单元才能读取；图中省略中间缓冲与同步细节。</text>
  </g>
</svg>
