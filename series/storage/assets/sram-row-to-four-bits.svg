<svg xmlns="http://www.w3.org/2000/svg" width="460" height="579" viewBox="0 0 460 579" role="img" aria-labelledby="title desc">
  <title id="title">SRAM 一根字线接通 16 个单元，四个列选择器各取一对位线</title>
  <desc id="desc">示例有 64 行、16 列，只画相邻三行。WL5 接通第 5 行的 16 个单元，每个单元连到本列的差分位线。每四个连续物理列为一组。四个四选一多路选择器共用组选 g，各从所在输出路的四对候选位线中选一对。g 为 2 时，第 0 路从 C0、C4、C8、C12 中选 C8；第 1 路选 C9；第 2 路选 C10；第 3 路选 C11。四个读出放大器分别判出 1、1、0、1，送到 DQ0 至 DQ3。按 DQ3 至 DQ0 排列，结果为 1011。</desc>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #203c37 }
    .head { font-size: 20px; font-weight: 660 }
    .note { font-size: 17px; fill: #435e52 }
    .col { font-size: 17px; font-weight: 550; text-anchor: middle }
    .active { fill: #704024; font-weight: 700 }
    .label { font-size: 17px; font-weight: 650 }
    .output { font-size: 18px; font-weight: 660; fill: #225640 }
  </style>
  <defs>
    <!-- Physical columns continue vertically through the three displayed rows. -->
    <pattern id="cell-grid" x="82" y="109" width="22" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 30V0H22" fill="none" stroke="#849f8d" stroke-width="1.6"/>
    </pattern>
    <g id="read-lane">
      <!-- Each outlined block encloses all four inputs to one differential mux. -->
      <path d="M16 0H222L236 18L222 36H16Z" fill="#ebeee5" stroke="#aebfaf"/>
      <rect x="121" y="3" width="46" height="30" rx="4" fill="#f0dec6" stroke="#b88b66"/>
      <path d="M236 18H259 M321 18H340m-6-4 6 4-6 4" fill="none" stroke="#50735f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="259" y="1" width="62" height="34" rx="5" fill="#dfece2" stroke="#9cbaa5"/>
    </g>
  </defs>
  <rect x="1" y="1" width="458" height="577" rx="15" fill="#f7f6ef" stroke="#d3dacf"/>
  <text x="18" y="35" font-size="23.5" font-weight="680">选中一行 16 个单元，怎样读出 4 bit？</text>
  <text x="18" y="67" class="note">64 行中只画三行。每个小格是一个存储单元。</text>

  <g class="col">
    <text x="126" y="99">C0–C3</text><text x="214" y="99">C4–C7</text>
    <text x="302" y="99" class="active">C8–C11</text><text x="390" y="99">C12–C15</text>
  </g>
  <rect x="82" y="109" width="352" height="90" fill="#edf0e9"/>
  <rect x="82" y="139" width="352" height="30" fill="#d7e6d9"/>
  <rect x="258" y="139" width="88" height="30" fill="#f0dec6"/>
  <rect x="82" y="109" width="352" height="90" fill="url(#cell-grid)" stroke="#8ea594"/>
  <path d="M170 109v90 M258 109v90 M346 109v90" stroke="#688977" stroke-width="2"/>
  <g class="label">
    <text x="20" y="131" fill="#52675a">WL4</text>
    <text x="20" y="161" fill="#25553f">WL5</text>
    <text x="20" y="191" fill="#52675a">WL6</text>
  </g>
  <path d="M61 154H79m-5-4 5 4-5 4" stroke="#38654b" fill="none" stroke-width="2"/>
  <g text-anchor="middle" class="active" font-size="17">
    <text x="269" y="160">1</text><text x="291" y="160">1</text>
    <text x="313" y="160">0</text><text x="335" y="160">1</text>
  </g>
  <path d="M83 204v6h350v-6" fill="none" stroke="#6f927a" stroke-width="1.6"/>
  <text x="258" y="234" text-anchor="middle" class="note">WL5 使这 16 个单元各自接到本列位线对</text>

  <text x="18" y="276" class="head">组选 g = 2，同时控制四个选择器</text>
  <text x="18" y="304" class="note">每个框选一对位线，送给右侧的读出放大器。</text>
  <g class="col">
    <text x="42" y="338">g=0</text><text x="92" y="338">g=1</text>
    <text x="144" y="338" class="active">g=2</text><text x="198" y="338">g=3</text>
  </g>
  <g transform="translate(0 348)">
    <use href="#read-lane"/>
    <g class="col"><text x="42" y="24">C0</text><text x="92" y="24">C4</text><text x="144" y="24" class="active">C8</text><text x="198" y="24">C12</text></g>
    <text x="290" y="24" text-anchor="middle" class="label">SA0</text><text x="348" y="24" class="output">DQ0 = 1</text>
  </g>
  <g transform="translate(0 392)">
    <use href="#read-lane"/>
    <g class="col"><text x="42" y="24">C1</text><text x="92" y="24">C5</text><text x="144" y="24" class="active">C9</text><text x="198" y="24">C13</text></g>
    <text x="290" y="24" text-anchor="middle" class="label">SA1</text><text x="348" y="24" class="output">DQ1 = 1</text>
  </g>
  <g transform="translate(0 436)">
    <use href="#read-lane"/>
    <g class="col"><text x="42" y="24">C2</text><text x="92" y="24">C6</text><text x="144" y="24" class="active">C10</text><text x="198" y="24">C14</text></g>
    <text x="290" y="24" text-anchor="middle" class="label">SA2</text><text x="348" y="24" class="output">DQ2 = 0</text>
  </g>
  <g transform="translate(0 480)">
    <use href="#read-lane"/>
    <g class="col"><text x="42" y="24">C3</text><text x="92" y="24">C7</text><text x="144" y="24" class="active">C11</text><text x="198" y="24">C15</text></g>
    <text x="290" y="24" text-anchor="middle" class="label">SA3</text><text x="348" y="24" class="output">DQ3 = 1</text>
  </g>
  <rect x="16" y="532" width="426" height="34" rx="6" fill="#e1ebe1"/>
  <text x="229" y="556" text-anchor="middle" class="head">从高位到低位读，DQ[3:0] = 1011</text>
</svg>
