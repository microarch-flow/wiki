<svg xmlns="http://www.w3.org/2000/svg" width="460" height="540" viewBox="0 0 460 540" role="img" aria-labelledby="title desc">
  <title id="title">同一个 DRAM bank 的三次读取，共用同一把 CK 尺</title>
  <desc id="desc">每行从本次请求到达开始绘制，横向每 CK 等长，刻度是连续的绝对时钟计数。A 在 CK 0 到达，ACT 0 打开 R 行，RD 11，首数据 22，DQ 窗口从 22 到 26，不含 26。B 在 CK 26 到达并对同一行另一列发 RD，首数据 37，窗口从 37 到 41，不含 41。C 在 CK 41 到达，PRE 41 关闭 R 行，ACT 52 打开 S 行，RD 63，首数据 74，窗口从 74 到 78，不含 78。三笔到首数据分别等待 22、11、33 CK，命令在采样沿发出，而每笔的 DQ 传输持续 4 CK。</desc>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #203c37 }
    .note { font-size: 17.5px; fill: #40594f }
    .row-head { font-size: 20px; font-weight: 650 }
    .wait { font-size: 18px; fill: #834927; font-weight: 650; text-anchor: end }
    .cmd { font-family: ui-monospace, "DejaVu Sans Mono", monospace; fill: #234f65; text-anchor: middle; font-size: 18px; font-weight: 650 }
    .dq-label { fill: #225c46; font-size: 17px; font-weight: 630; text-anchor: end }
    .axis { stroke: #73867b; stroke-width: 1.6 }
    .tick { stroke: #65796b; stroke-width: 1.6 }
    .ck { font-family: ui-monospace, "DejaVu Sans Mono", monospace; fill: #304c41; text-anchor: middle; font-size: 17px }
    .panel { fill: #f2f3ec; stroke: #c9d2c6 }
  </style>
  <defs>
    <pattern id="ticks" x="39" width="10.5" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="6" fill="#93a295"/>
    </pattern>
    <path id="edge" d="M-5-9H5L0 0Z" fill="#315f75"/>
    <!-- One burst spans four ticks (42 units), with eight half-clock data beats. -->
    <g id="burst">
      <rect width="42" height="11" fill="#498269"/>
      <path d="M5.25 0v11 M10.5 0v11 M15.75 0v11 M21 0v11 M26.25 0v11 M31.5 0v11 M36.75 0v11" fill="none" stroke="#d4e6da"/>
    </g>
  </defs>
  <rect x="1" y="1" width="458" height="538" rx="15" fill="#f7f6ef" stroke="#d3dacf"/>
  <text x="19" y="35" font-size="24" font-weight="680">同一 bank 连读三次</text>
  <text x="19" y="66" class="note">每行从请求到达处起画，刻度均为绝对 CK。</text>
  <use href="#edge" x="27" y="94"/>
  <text x="42" y="96" class="note">命令采样沿</text>
  <use href="#burst" x="182" y="83"/>
  <text x="232" y="96" class="note">DQ 数据传输窗口</text>

  <!-- All timelines begin at x=39 and use the same 10.5 units per CK. -->
  <g transform="translate(0 112)">
    <rect x="13" y="0" width="434" height="112" rx="8" class="panel"/>
    <text x="23" y="27" class="row-head">A　初始没有开行，读 R 行</text>
    <text x="434" y="27" class="wait">等待 22 CK</text>
    <text x="39" y="61" class="cmd">ACT</text>
    <text x="154.5" y="61" class="cmd">RD</text>
    <text x="312" y="61" class="dq-label">DQ [22, 26)</text>
    <path d="M39 78H312" class="axis"/>
    <rect x="39" y="78" width="273" height="5" fill="url(#ticks)"/>
    <use href="#edge" x="39" y="78"/><use href="#edge" x="154.5" y="78"/>
    <use href="#burst" x="270" y="68"/>
    <path d="M39 78v9 M154.5 78v9 M270 78v9 M312 78v9" class="tick"/>
    <g class="ck"><text x="39" y="104">0</text><text x="154.5" y="104">11</text><text x="270" y="104">22</text><text x="312" y="104">26</text></g>
  </g>

  <g transform="translate(0 234)">
    <rect x="13" y="0" width="434" height="112" rx="8" class="panel"/>
    <text x="23" y="27" class="row-head">B　R 行仍开，读另一列</text>
    <text x="434" y="27" class="wait">等待 11 CK</text>
    <text x="39" y="61" class="cmd">RD</text>
    <text x="196.5" y="61" class="dq-label">DQ [37, 41)</text>
    <path d="M39 78H196.5" class="axis"/>
    <rect x="39" y="78" width="157.5" height="5" fill="url(#ticks)"/>
    <use href="#edge" x="39" y="78"/>
    <use href="#burst" x="154.5" y="68"/>
    <path d="M39 78v9 M154.5 78v9 M196.5 78v9" class="tick"/>
    <g class="ck"><text x="39" y="104">26</text><text x="154.5" y="104">37</text><text x="196.5" y="104">41</text></g>
  </g>

  <g transform="translate(0 356)">
    <rect x="13" y="0" width="434" height="112" rx="8" class="panel"/>
    <text x="23" y="27" class="row-head">C　R 行仍开，改读 S 行</text>
    <text x="434" y="27" class="wait">等待 33 CK</text>
    <text x="39" y="61" class="cmd">PRE</text>
    <text x="154.5" y="61" class="cmd">ACT</text>
    <text x="270" y="61" class="cmd">RD</text>
    <text x="427.5" y="61" class="dq-label">DQ [74, 78)</text>
    <path d="M39 78H427.5" class="axis"/>
    <rect x="39" y="78" width="388.5" height="5" fill="url(#ticks)"/>
    <use href="#edge" x="39" y="78"/><use href="#edge" x="154.5" y="78"/><use href="#edge" x="270" y="78"/>
    <use href="#burst" x="385.5" y="68"/>
    <path d="M39 78v9 M154.5 78v9 M270 78v9 M385.5 78v9 M427.5 78v9" class="tick"/>
    <g class="ck"><text x="39" y="104">41</text><text x="154.5" y="104">52</text><text x="270" y="104">63</text><text x="385.5" y="104">74</text><text x="427.5" y="104">78</text></g>
  </g>
  <text x="19" y="496" class="note">等待算到首数据。DQ 窗口含左端、不含右端。</text>
  <text x="19" y="522" class="note">8 颗 x8 共 64 bit，BL8 用 4 CK 传完 64 B。</text>
</svg>
