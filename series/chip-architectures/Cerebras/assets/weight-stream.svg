<svg xmlns="http://www.w3.org/2000/svg" width="360" height="324" viewBox="0 0 360 324" role="img" aria-labelledby="title description">
  <title id="title">权重与梯度在 Cerebras 训练系统中的路径</title>
  <desc id="description">MemoryX 向 SwarmX 提供权重。SwarmX 将权重广播给各 CS 系统内的 WSE。梯度沿相反方向传输，经 SwarmX 归约后返回 MemoryX。</desc>
  <defs>
    <marker id="down" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#397d6a"/>
    </marker>
    <marker id="up" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#a36837"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="322" rx="12" fill="#eef3e8" stroke="#c4d2bd"/>
  <g fill="#dcecd9" stroke="#5f8770">
    <rect x="24" y="20" width="312" height="56" rx="7"/>
    <rect x="24" y="134" width="312" height="56" rx="7"/>
    <rect x="24" y="248" width="312" height="56" rx="7"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#193c34" text-anchor="middle">
    <text x="180" y="54">MemoryX 存放和更新权重</text>
    <text x="180" y="168">SwarmX 跨系统广播和归约</text>
    <text x="180" y="282">CS 内的 WSE 执行计算</text>
  </g>
  <g fill="none" stroke-width="2.4">
    <path d="M73 78V130" stroke="#397d6a" marker-end="url(#down)"/>
    <path d="M73 192V244" stroke="#397d6a" marker-end="url(#down)"/>
    <path d="M287 132V80" stroke="#a36837" marker-end="url(#up)"/>
    <path d="M287 246V194" stroke="#a36837" marker-end="url(#up)"/>
  </g>
  <g font-family="sans-serif" font-size="14">
    <text x="87" y="110" fill="#245749">权重</text>
    <text x="87" y="224" fill="#245749">广播权重</text>
    <text x="273" y="110" fill="#694222" text-anchor="end">归约梯度</text>
    <text x="273" y="224" fill="#694222" text-anchor="end">梯度</text>
  </g>
</svg>
