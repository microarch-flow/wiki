<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 344" role="img" aria-labelledby="title desc">
  <title id="title">两个乘法器并行，四个输入同时到达</title>
  <desc id="desc">时间向下。t=0 时 M0 的两个输入已分别接到 2 和 4，M1 的两个输入已分别接到 3 和 5。t=1 时 P0 和 P1 同时装入 8 和 15。t=2 时 S 装入 23。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#497061" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; fill: #183e33; }
    .heading { font-size: 20px; font-weight: 700; text-anchor: start; }
    .edge { font-size: 17px; font-weight: 700; }
    .input { fill: #f6eedf; stroke: #bf9d69; }
    .op { fill: #235642; }
    .state { fill: #e1eedf; stroke: #69917c; }
    .value { font-size: 19px; font-weight: 650; }
    .operation { font-size: 18px; font-weight: 600; fill: #fff; }
    .grid { fill: none; stroke: #d1ddd2; stroke-dasharray: 3 5; }
    .flow { fill: none; stroke: #497061; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="500" height="344" rx="14" fill="#f1f5ed"/>
  <text class="heading" x="17" y="32">两个乘法器 M0、M1，两个周期</text>
  <path class="grid" d="M62 77H488 M62 175H488 M62 301H488"/>
  <g class="edge">
    <text x="34" y="83">t = 0</text><text x="34" y="181">t = 1</text><text x="34" y="307">t = 2</text>
  </g>
  <g>
    <rect class="input" x="77" y="59" width="72" height="36" rx="7"/>
    <rect class="input" x="176" y="59" width="72" height="36" rx="7"/>
    <rect class="input" x="298" y="59" width="72" height="36" rx="7"/>
    <rect class="input" x="397" y="59" width="72" height="36" rx="7"/>
    <text class="value" x="113" y="84">2</text><text class="value" x="212" y="84">4</text>
    <text class="value" x="334" y="84">3</text><text class="value" x="433" y="84">5</text>
    <path class="flow" d="M113 95L135 108"/>
    <path class="flow" d="M212 95L190 108"/>
    <path class="flow" d="M334 95L356 108"/>
    <path class="flow" d="M433 95L411 108"/>
    <rect class="op" x="80" y="110" width="166" height="35" rx="17"/>
    <rect class="op" x="301" y="110" width="166" height="35" rx="17"/>
    <text class="operation" x="163" y="134">M0 算 2 × 4</text>
    <text class="operation" x="384" y="134">M1 算 3 × 5</text>
    <path class="flow" d="M163 145V155"/>
    <path class="flow" d="M384 145V155"/>
  </g>
  <g>
    <rect class="state" x="85" y="157" width="156" height="36" rx="7"/>
    <text class="value" x="163" y="182">P0 ← 8</text>
    <rect class="state" x="306" y="157" width="156" height="36" rx="7"/>
    <text class="value" x="384" y="182">P1 ← 15</text>
    <path class="flow" d="M163 193V210L213 228"/>
    <path class="flow" d="M384 193V210L334 228"/>
    <rect class="op" x="179" y="230" width="188" height="35" rx="17"/>
    <text class="operation" x="273" y="254">加法器算 8 + 15</text>
    <path class="flow" d="M273 265V280"/>
    <rect class="state" x="195" y="283" width="156" height="36" rx="7"/>
    <text class="value" x="273" y="308">S ← 23</text>
  </g>
</svg>
