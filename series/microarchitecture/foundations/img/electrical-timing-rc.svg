  <text x="104" y="39" fill="#214d3c" font-family="Arial, sans-serif" font-size="24" font-weight="700">理想 RC 充电：节点电压随时间变化</text>
  <text x="623" y="39" fill="#537967" font-family="Arial, sans-serif" font-size="22">τ = 100 ps</text>
