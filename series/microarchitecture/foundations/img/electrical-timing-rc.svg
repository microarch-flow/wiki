    <text x="85" y="193" text-anchor="end">0.4</text>
    <text x="85" y="306" text-anchor="end">0</text>
    <text x="104" y="331" text-anchor="middle">0</text>
    <text x="308" y="331" text-anchor="middle">100</text>
    <text x="512" y="331" text-anchor="middle">200</text>
    <text x="716" y="331" text-anchor="middle">300</text>
    <text x="104" y="63">电压（V）</text>
