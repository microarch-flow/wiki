<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img" aria-labelledby="title desc">
  <title id="title">理想 RC 充电曲线</title>
  <desc id="desc">一个时间常数为 100 皮秒的电路从 0 伏充至 0.8 伏。节点在约 69.3 皮秒时达到 0.4 伏，随后继续上升并逐渐接近 0.8 伏。</desc>
