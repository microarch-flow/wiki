<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 514" role="img" aria-labelledby="title desc">
  <title id="title">第二行只多一段一千欧的线路电阻，列电流便降低</title>
  <desc id="desc">第一行仍是 40 毫伏驱动 40 微西门子的单元，电流 1.600 微安。第二行驱动 60 毫伏，新增的一千欧电阻串在二十千欧单元之前。列端由读出电路维持于理想 0 伏。串联电流约 2.857 微安，线阻分去约 2.86 毫伏，单元两端只有约 57.14 毫伏。总列电流从理想的 4.600 微安降至约 4.457 微安。</desc>
  <defs><marker id="arrow" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4.5L1 8" stroke="#38694e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    text{font-family:system-ui,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#173c32}
    .title{font-size:24px;font-weight:680}.heading{font-size:21px;font-weight:660}
    .label{font-size:19px;font-weight:630}.copy{font-size:18px;fill:#3b5c4f}.mid{text-anchor:middle}.accent{fill:#825134}
    .wire{stroke:#658572;fill:none;stroke-width:2.5;stroke-linejoin:round}.dir{fill:none;stroke:#38694e;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="700" height="514" rx="14" fill="#f2f5ed"/>
  <text x="18" y="34" class="title">驱动端仍给 60 mV，第二个单元能分到多少？</text>
  <text x="18" y="64" class="copy">只在第二行串入 1 kΩ。两只单元的电导、两行驱动电压和列端虚地都保持原值。</text>

  <rect x="16" y="81" width="668" height="277" rx="9" fill="#fafbf6" stroke="#afc2b1"/>
  <text x="32" y="110" class="label">行驱动端</text><text x="342" y="110" class="label mid">ReRAM 单元</text>
  <text x="552" y="110" class="label mid">同一列</text>
  <path d="M38 155H283 M402 155H552 M38 236H109 M196 236H283 M402 236H552 M552 155V302" class="wire"/>
  <path d="M429 155h52" class="dir"/><path d="M429 236h52" class="dir"/><path d="M552 249v27" class="dir"/>
  <g fill="#fafbf6" stroke="#658572" stroke-width="2.5"><circle cx="38" cy="155" r="4.5"/><circle cx="38" cy="236" r="4.5"/></g>
  <g fill="#38694e"><circle cx="552" cy="155" r="4"/><circle cx="552" cy="236" r="4"/></g>
  <g fill="#e3ede0" stroke="#8fa78e"><rect x="283" y="139" width="119" height="32"/><rect x="283" y="220" width="119" height="32"/></g>
  <rect x="109" y="220" width="87" height="32" fill="#f4e7d7" stroke="#b58e66" stroke-width="1.5"/>
  <circle cx="238" cy="236" r="4.5" fill="#986342"/>
  <text x="32" y="140" class="copy">40 mV</text><text x="32" y="221" class="copy">60 mV</text>
  <text x="342" y="162" class="label mid">40 µS</text><text x="342" y="243" class="label mid">20 kΩ</text>
  <text x="451" y="139" class="label mid">1.600 µA</text><text x="451" y="220" class="label mid">2.857 µA</text>
  <text x="152" y="206" class="copy mid accent">新增线阻</text><text x="152" y="243" class="label mid accent">1 kΩ</text>
  <text x="346" y="206" class="copy mid">50 µS</text>
  <text x="238" y="277" class="label mid accent">约 57.14 mV</text>
  <text x="570" y="278" class="label">4.457 µA</text>
  <rect x="360" y="302" width="307" height="43" rx="6" fill="#e5eee3" stroke="#a4b9a6"/>
  <text x="513" y="330" class="label mid">列读出电路将列端维持在 0 V</text>

  <text x="18" y="395" class="heading">第二支路电流 = 60 mV ÷ (1 kΩ + 20 kΩ) ≈ 2.857 µA</text>
  <text x="18" y="429" class="copy">线阻分去约 2.86 mV，其余约 57.14 mV 落在单元上。第一支路仍为 1.600 µA。</text>
  <text x="18" y="471" class="heading">列电流从 4.600 µA 降到约 4.457 µA，少了约 0.143 µA。</text>
</svg>
