<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 492" role="img" aria-labelledby="title desc">
  <title id="title">两条 ReRAM 支路怎样在一列算出二十三</title>
  <desc id="desc">两行分别由 40 和 60 毫伏驱动，电导分别为 40 和 50 微西门子。两条独立支路只在同一列相连，列端由读出电路维持虚地，理想按 0 伏计算。第一支路 1.6 微安，第二支路 3.0 微安，列端流入 4.6 微安。按给定编码比例每个点积单位 0.20 微安，理想换算值为 23。</desc>
  <defs><marker id="arrow" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4.5L1 8" stroke="#38694e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    text{font-family:system-ui,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#173c32}
    .title{font-size:24px;font-weight:680}.heading{font-size:21px;font-weight:660}
    .label{font-size:19px;font-weight:630}.copy{font-size:18px;fill:#3b5c4f}.mid{text-anchor:middle}
    .wire{stroke:#658572;fill:none;stroke-width:2.5;stroke-linejoin:round}.dir{fill:none;stroke:#38694e;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="700" height="492" rx="14" fill="#f2f5ed"/>
  <text x="18" y="34" class="title">两行怎样在一列算出 2 × 4 + 3 × 5？</text>
  <text x="18" y="64" class="copy">理想读出时，列端保持在 0 V。两行各自驱动，单元在读压内按线性电导计算。</text>

  <rect x="16" y="81" width="668" height="278" rx="9" fill="#fafbf6" stroke="#afc2b1"/>
  <text x="32" y="111" class="label">行驱动端</text>
  <text x="291" y="111" class="label mid">ReRAM 单元</text>
  <text x="553" y="111" class="label mid">同一列</text>
  <path d="M38 164H216 M366 164H553 M38 242H216 M366 242H553 M553 164V297" class="wire"/>
  <path d="M402 164h53" class="dir"/><path d="M402 242h53" class="dir"/>
  <path d="M553 253v25" class="dir"/>
  <g fill="#fafbf6" stroke="#658572" stroke-width="2.5"><circle cx="38" cy="164" r="4.5"/><circle cx="38" cy="242" r="4.5"/></g>
  <g fill="#38694e"><circle cx="553" cy="164" r="4"/><circle cx="553" cy="242" r="4"/></g>
  <g fill="#e3ede0" stroke="#8fa78e">
    <rect x="216" y="148" width="150" height="32"/><rect x="216" y="226" width="150" height="32"/>
  </g>
  <text x="32" y="150" class="copy">输入 2 → 40 mV</text><text x="32" y="228" class="copy">输入 3 → 60 mV</text>
  <text x="291" y="171" class="label mid">权重 4 · 40 µS</text><text x="291" y="249" class="label mid">权重 5 · 50 µS</text>
  <text x="431" y="148" class="label mid">1.6 µA</text><text x="431" y="226" class="label mid">3.0 µA</text>
  <text x="570" y="277" class="label">4.6 µA</text>
  <rect x="349" y="297" width="318" height="48" rx="6" fill="#e5eee3" stroke="#a4b9a6"/>
  <text x="508" y="328" class="label mid">列读出电路维持虚地并测量电流</text>

  <text x="18" y="398" class="heading">1.6 µA + 3.0 µA = 4.6 µA</text>
  <text x="18" y="430" class="copy">输入每单位用 20 mV，权重每单位用 10 µS，每个点积单位对应 0.20 µA。</text>
  <text x="18" y="466" class="heading">按此比例换算，4.6 ÷ 0.20 = 23。</text>
</svg>
