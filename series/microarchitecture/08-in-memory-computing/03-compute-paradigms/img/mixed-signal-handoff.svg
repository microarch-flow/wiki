<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 569" role="img" aria-labelledby="title desc">
  <title id="title">两列同时保持模拟样本，依次转换，在数字寄存器里求和</title>
  <desc id="desc">教学例中，两个子阵列分别计算点积的一项，各有独立的 1 皮法积分电容。从参考电压复位，同开十纳秒读窗，窗末同时保持。A 的四十毫伏乘四十微西门子产生 1.6 微安，积出十六飞库仑，电压相对参考增加十六毫伏。B 的六十毫伏乘五十微西门子产生三微安，积出三十飞库仑，电压增加三十毫伏。模拟多路选择器先选 A，再选 B，送入同一个步长每码二毫伏的理想四位无符号模数转换器。它先输出整数码八，再输出十五。两个码权重相同，五位数字累加寄存器初值零，先存八，再存二十三。两次转换表示先后次序，没有规定时钟周期数。</desc>
  <defs><marker id="arrow" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4.5L1 8" stroke="#52775e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    text{font-family:system-ui,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#173c32}
    .title{font-size:24px;font-weight:680}.heading{font-size:21px;font-weight:660}
    .label{font-size:19px;font-weight:630}.copy{font-size:18px;fill:#3b5c4f}.mid{text-anchor:middle}
    .wire{fill:none;stroke:#52775e;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
  <rect width="700" height="569" rx="14" fill="#f2f5ed"/>
  <text x="18" y="34" class="title">16 mV 和 30 mV 在哪一步变成 8 和 15？</text>
  <text x="18" y="65" class="copy">两个子阵列各用一只 1 pF 电容，从参考电压复位，同窗积分 10 ns，窗末同时保持。</text>

  <rect x="16" y="82" width="326" height="141" rx="9" fill="#fafbf6" stroke="#afc2b1"/>
  <rect x="358" y="82" width="326" height="141" rx="9" fill="#fafbf6" stroke="#afc2b1"/>
  <text x="32" y="112" class="heading">子阵列 A · 计算 2 × 4</text>
  <text x="374" y="112" class="heading">子阵列 B · 计算 3 × 5</text>
  <text x="32" y="143" class="copy">40 mV × 40 µS = 1.6 µA</text>
  <text x="374" y="143" class="copy">60 mV × 50 µS = 3.0 µA</text>
  <text x="32" y="174" class="copy">电荷 16 fC</text><text x="374" y="174" class="copy">电荷 30 fC</text>
  <rect x="31" y="184" width="296" height="30" rx="4" fill="#f2e8d9"/>
  <rect x="373" y="184" width="296" height="30" rx="4" fill="#f2e8d9"/>
  <text x="179" y="206" class="label mid">保持电压增量 ΔV = 16 mV</text>
  <text x="521" y="206" class="label mid">保持电压增量 ΔV = 30 mV</text>
  <path d="M179 223V237H251V251" class="wire"/>
  <path d="M521 223V237H449V251" class="wire"/>
  <rect x="122" y="252" width="456" height="40" rx="7" fill="#fafbf6" stroke="#abbfac"/>
  <text x="350" y="278" class="label mid">模拟多路选择器每次接通一个保持端</text>
  <path d="M350 293v17" class="wire"/>

  <rect x="16" y="312" width="668" height="169" rx="9" fill="#fafbf6" stroke="#afc2b1"/>
  <text x="30" y="343" class="heading">共用一个 4 位无符号 ADC，步长 2 mV/码</text>
  <rect x="27" y="356" width="264" height="35" rx="4" fill="#f2e8d9"/>
  <rect x="300" y="356" width="373" height="35" rx="4" fill="#e2ecdf"/>
  <g class="label mid">
    <text x="84" y="381">选择顺序</text><text x="219" y="381">模拟输入 ΔV</text>
    <text x="386" y="381">ADC 数字码</text><text x="564" y="381">5 位累加寄存器</text>
  </g>
  <path d="M296 356V471" fill="none" stroke="#9d7957" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M27 434H673" fill="none" stroke="#d2dbcf"/>
  <g class="copy mid">
    <text x="84" y="421">先选 A</text><text x="219" y="421">16 mV</text><text x="386" y="421">8 (1000₂)</text><text x="564" y="421">0 + 8 = 8</text>
    <text x="84" y="463">再选 B</text><text x="219" y="463">30 mV</text><text x="386" y="463">15 (1111₂)</text><text x="564" y="463" class="label">8 + 15 = 23</text>
  </g>
  <text x="18" y="515" class="copy">两个局部码采用同一点积单位，直接相加。23 以二进制 10111 保存在寄存器里。</text>
  <text x="18" y="545" class="copy">表中两行给出转换先后。单次转换所需的时钟数取决于 ADC。</text>
</svg>
