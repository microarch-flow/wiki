  <text x="638" y="258" class="count">0</text>
  <text x="32" y="321" class="head">W₀ · 1</text>
  <rect x="117" y="297" width="31" height="35" rx="4" fill="#f6f8f1" stroke="#809b85"/>
  <text x="132.5" y="322" class="bit">0</text>
  <rect x="152" y="297" width="31" height="35" rx="4" fill="#cfe1cd" stroke="#809b85"/>
  <text x="167.5" y="322" class="bit">1</text>
