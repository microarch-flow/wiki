<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 464" role="img" aria-labelledby="title desc">
  <title id="title">两对无符号数逐位相与，按位权合成 23</title>
  <desc id="desc">两项输入为 2 和 3，权重为 4 和 5。输入低位平面为 0、1，高位平面为 1、1。分别同三个权重位平面逐项相与，得到的掩码按两元素数 1。低位对应三个计数 1、0、1，按权重相加为 5。高位对应 2、0、1，按权重相加为 9。考虑输入位权，5 加 2 乘 9 等于 23。阵列按列独立求 AND，数 1 和移位相加是教学模型另设的数字外围。</desc>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #173b32; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 17px; fill: #3b5b4f; }
    .head { font-size: 18px; font-weight: 650; }
    .group { font-size: 17px; text-anchor: middle; }
    .bit { font-size: 21px; text-anchor: middle; font-weight: 650; }
    .count { font-size: 20px; text-anchor: middle; font-weight: 680; fill: #71451f; }
    .math { font-size: 18px; text-anchor: middle; font-weight: 650; }
    .result { font-size: 24px; font-weight: 680; text-anchor: middle; }
  </style>
  <rect width="720" height="464" rx="14" fill="#f2f5ed"/>
  <text x="19" y="36" class="title">两个输入位平面，分别与三个权重位平面做 AND</text>
  <text x="19" y="66" class="sub">每对小格从左到右对应元素 0、1。每一行只取权重的同一个二进制位。</text>
  <rect x="15" y="88" width="187" height="267" rx="9" fill="#e9eee4" stroke="#b2c5b5"/>
  <rect x="210" y="88" width="242" height="267" rx="9" fill="#f9fbf5" stroke="#a9bead"/>
  <rect x="461" y="88" width="243" height="267" rx="9" fill="#f9fbf5" stroke="#a9bead"/>
  <text x="29" y="118" class="head">权重 W = (4, 5)</text>
  <text x="331" y="118" class="head" text-anchor="middle">输入低位 X₀ = (0, 1)</text>
  <text x="582" y="118" class="head" text-anchor="middle">输入高位 X₁ = (1, 1)</text>
  <text x="107" y="149" class="group">位权　　存储位</text>
  <text x="271" y="149" class="group">相与结果</text><text x="387" y="149" class="group">数 1</text>
  <text x="522" y="149" class="group">相与结果</text><text x="638" y="149" class="group">数 1</text>
  <text x="32" y="193" class="head">W₂ · 4</text>
