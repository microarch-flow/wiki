  <circle cx="387" cy="187" r="17" fill="#f4e5cc" stroke="#ad8e61"/>
  <text x="387" y="194" class="count">1</text>
  <rect x="490" y="169" width="31" height="35" rx="4" fill="#cfe1cd" stroke="#809b85"/>
  <text x="505.5" y="194" class="bit">1</text>
