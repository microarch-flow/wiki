  <rect x="525" y="297" width="31" height="35" rx="4" fill="#cfe1cd" stroke="#809b85"/>
  <text x="540.5" y="322" class="bit">1</text>
  <path d="M570 315h24m-6-5 6 5-6 5" fill="none" stroke="#697871" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="638" cy="315" r="17" fill="#f4e5cc" stroke="#ad8e61"/>
  <text x="638" y="322" class="count">1</text>
  <text x="29" y="385" class="head">按权重位权合并</text>
  <text x="331" y="385" class="math">1×4 + 0×2 + 1×1 = 5</text>
  <text x="582" y="385" class="math">2×4 + 0×2 + 1×1 = 9</text>
  <rect x="15" y="405" width="689" height="46" rx="7" fill="#dfead9"/>
  <text x="360" y="436" class="result">按输入位权合并　 5 × 1 + 9 × 2 = 23</text>
</svg>
