<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 579" role="img" aria-labelledby="title desc">
  <title id="title">一次计算宏命令的原始样本、转换码与响应寄存器</title>
  <desc id="desc">教学时序。E0 接收命令，E0 至 E1 复位并建立偏置，E1 至 E2 的有效积分窗为十纳秒。E2 同时保持 A、B 的十六、三十毫伏。A 必须保持到 E3 取到码八，B 必须保持到 E4 取到码十五。码八从 E3、码十五从 E4 保存到 E5，此时已将和二十三装入数字响应寄存器，valid 拉高。E6 边沿前 valid 为一、ready 为零，数据保持，停顿一次。E7 边沿前二者都为一，交付二十三。按本例控制器约定，E7 后清除 valid 并重新允许接受命令，下一条最早在 E8 接收。图中的边沿与保持区间是教学假设。</desc>
  <style>
    text{font-family:system-ui,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#173c32}
    .title{font-size:24px;font-weight:680}.heading{font-size:21px;font-weight:660}
    .label{font-size:19px;font-weight:630}.copy{font-size:18px;fill:#3b5c4f}
    .mid{text-anchor:middle}.value{font-size:19px;font-weight:630;text-anchor:middle}
    .sample{fill:#f1e6d6;stroke:#bda382}.code{fill:#e1ebde;stroke:#9ab09b}
  </style>
  <rect width="700" height="579" rx="14" fill="#f2f5ed"/>
  <text x="18" y="34" class="title">码 8 已经存好，哪一份电压还要继续保持？</text>
  <text x="18" y="64" class="copy">E0 接命令后先复位、建立偏置。E1 至 E2 的有效积分窗为 10 ns，E2 同时采样。</text>

  <rect x="16" y="81" width="668" height="247" rx="9" fill="#fafbf6" stroke="#afc2b1"/>
  <text x="30" y="112" class="label">边沿</text>
  <g class="label mid"><text x="142" y="112">E2</text><text x="245" y="112">E3</text><text x="348" y="112">E4</text><text x="451" y="112">E5</text><text x="554" y="112">E6</text><text x="657" y="112">E7</text></g>
  <path d="M142 123H657" stroke="#819885" fill="none" stroke-width="1.6"/>
  <path d="M142 120V316 M245 120V316 M348 120V316 M451 120V316 M554 120V316 M657 120V316" fill="none" stroke="#bccabb" stroke-dasharray="3 4"/>
  <g class="copy">
    <text x="30" y="155">模拟样本 A</text><text x="30" y="193">模拟样本 B</text>
    <text x="30" y="231">数字码 A</text><text x="30" y="269">数字码 B</text>
    <text x="30" y="307">响应寄存器</text>
  </g>
  <rect x="142" y="131" width="103" height="33" rx="4" class="sample"/>
  <rect x="142" y="169" width="206" height="33" rx="4" class="sample"/>
  <rect x="245" y="207" width="206" height="33" rx="4" class="code"/>
  <rect x="348" y="245" width="103" height="33" rx="4" class="code"/>
  <rect x="451" y="283" width="206" height="33" rx="4" fill="#d3e4d1" stroke="#829f83"/>
  <g class="value">
    <text x="194" y="155">16 mV</text><text x="245" y="193">30 mV</text>
    <text x="348" y="231">8</text><text x="400" y="269">15</text><text x="554" y="307">23，valid = 1</text>
  </g>
  <text x="18" y="359" class="copy">色带表示本次命令必须保留该值的区间。E3 转完 A，E4 转完 B，E5 存入两码之和。</text>

  <text x="18" y="396" class="heading">结果到了寄存器，还要等哪一次握手？</text>
  <rect x="16" y="411" width="326" height="82" rx="7" fill="#fafbf6" stroke="#abbfac"/>
  <rect x="358" y="411" width="326" height="82" rx="7" fill="#e2ecdf" stroke="#abbfac"/>
  <text x="32" y="440" class="label">E6 前　valid = 1，ready = 0</text>
  <text x="374" y="440" class="label">E7 前　valid = 1，ready = 1</text>
  <text x="32" y="474" class="copy">此沿停顿，继续保持数据 23。</text>
  <text x="374" y="474" class="copy">此沿交付，接收端取走 23。</text>
  <text x="18" y="527" class="copy">本例 E7 后清除 valid 并再次允许接命令。下一条最早在 E8 接收。</text>
  <text x="18" y="559" class="copy">图中电压都是相对各自复位参考的增量。边沿编号与握手时刻均为教学设定。</text>
</svg>
