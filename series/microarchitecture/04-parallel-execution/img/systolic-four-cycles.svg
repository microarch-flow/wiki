<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 412" role="img" aria-labelledby="title desc">
  <title id="title">同一个 2×2 阵列的四拍</title>
  <desc id="desc">四幅快照按第 0 到第 3 拍排列。深色格内是本拍乘加式，浅色格表示部分和保持。每拍有效的单元个数依次为 1、3、3、1。最终左上为 19、右上为 22、左下为 43、右下为 50。</desc>
  <style>
    text { font: 16px system-ui, 'Noto Sans CJK SC', sans-serif; }
    .phase { fill: #203f2e; font-weight: 700; font-size: 19px; }
    .count { fill: #3d5847; text-anchor: end; }
    .working rect { fill: #245641; stroke: #1d4836; }
    .working text { fill: #fff; text-anchor: middle; }
    .holding rect { fill: #e9eee5; stroke: #b3c2b2; }
    .holding text { fill: #3d5042; text-anchor: middle; }
    .name { font-size: 15px; font-weight: 650; }
  </style>
  <g transform="translate(10 8)">
    <rect width="292" height="194" rx="9" fill="#f5f6ef" stroke="#c4d4c4"/>
    <text x="13" y="30" class="phase">第 0 拍</text><text x="276" y="30" class="count">1 次乘加</text>
    <g transform="translate(8 50)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE00</text>
      <text x="67.5" y="48">0 + 1×5 = 5</text>
    </g>
    <g transform="translate(149 50)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE01</text>
      <text x="67.5" y="48">保持 0</text>
    </g>
    <g transform="translate(8 120)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE10</text>
      <text x="67.5" y="48">保持 0</text>
    </g>
    <g transform="translate(149 120)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE11</text>
      <text x="67.5" y="48">保持 0</text>
    </g>
  </g>
  <g transform="translate(306 8)">
    <rect width="292" height="194" rx="9" fill="#f5f6ef" stroke="#c4d4c4"/>
    <text x="13" y="30" class="phase">第 1 拍</text><text x="276" y="30" class="count">3 次乘加</text>
    <g transform="translate(8 50)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE00</text>
      <text x="67.5" y="48">5 + 2×7 = 19</text>
    </g>
    <g transform="translate(149 50)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE01</text>
      <text x="67.5" y="48">0 + 1×6 = 6</text>
    </g>
    <g transform="translate(8 120)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE10</text>
      <text x="67.5" y="48">0 + 3×5 = 15</text>
    </g>
    <g transform="translate(149 120)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE11</text>
      <text x="67.5" y="48">保持 0</text>
    </g>
  </g>
  <g transform="translate(10 210)">
    <rect width="292" height="194" rx="9" fill="#f5f6ef" stroke="#c4d4c4"/>
    <text x="13" y="30" class="phase">第 2 拍</text><text x="276" y="30" class="count">3 次乘加</text>
    <g transform="translate(8 50)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE00</text>
      <text x="67.5" y="48">保持 19</text>
    </g>
    <g transform="translate(149 50)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE01</text>
      <text x="67.5" y="48">6 + 2×8 = 22</text>
    </g>
    <g transform="translate(8 120)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE10</text>
      <text x="67.5" y="48">15 + 4×7 = 43</text>
    </g>
    <g transform="translate(149 120)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE11</text>
      <text x="67.5" y="48">0 + 3×6 = 18</text>
    </g>
  </g>
  <g transform="translate(306 210)">
    <rect width="292" height="194" rx="9" fill="#f5f6ef" stroke="#c4d4c4"/>
    <text x="13" y="30" class="phase">第 3 拍</text><text x="276" y="30" class="count">1 次乘加</text>
    <g transform="translate(8 50)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE00</text>
      <text x="67.5" y="48">保持 19</text>
    </g>
    <g transform="translate(149 50)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE01</text>
      <text x="67.5" y="48">保持 22</text>
    </g>
    <g transform="translate(8 120)" class="holding">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE10</text>
      <text x="67.5" y="48">保持 43</text>
    </g>
    <g transform="translate(149 120)" class="working">
      <rect width="135" height="63" rx="6"/>
      <text x="67.5" y="24" class="name">PE11</text>
      <text x="67.5" y="48">18 + 4×8 = 50</text>
    </g>
  </g>
</svg>
