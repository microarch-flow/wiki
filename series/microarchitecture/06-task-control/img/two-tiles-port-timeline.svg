<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" role="img" aria-labelledby="title desc">
  <title id="title">两个块在并行端口和单端口上的搬入、计算与写回</title>
  <desc id="desc">上半图，搬入分别占用 0 至 2、2 至 4，计算 2 至 5、5 至 8，写回 5 至 7、8 至 10。下半图，搬入 0 至 2、5 至 7，计算 2 至 5、7 至 10，写回 5 至 7、10 至 12。</desc>
  <style>text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; fill: #23453e; }
.heading { font-size: 18px; font-weight: 700; }
.axis { font-size: 14px; fill: #49645c; }
.lane { font-size: 16px; font-weight: 600; }
.label { font-size: 15px; font-weight: 600; }
.grid { stroke: #cad8cb; stroke-width: 1; }</style>
  <rect x="1" y="1" width="758" height="413" rx="13" fill="#f6f7f0" stroke="#ccd9cd" />
  <g>
    <text x="20" y="34" class="heading">输入 SRAM 可同时读写</text>
    <text x="20" y="64" class="axis">时钟边沿 t</text>
    <text x="109" y="64" text-anchor="middle" class="axis">0</text>
    <path d="M109 70v120" class="grid" />
    <text x="160" y="64" text-anchor="middle" class="axis">1</text>
    <path d="M160 70v120" class="grid" />
    <text x="211" y="64" text-anchor="middle" class="axis">2</text>
    <path d="M211 70v120" class="grid" />
    <text x="262" y="64" text-anchor="middle" class="axis">3</text>
    <path d="M262 70v120" class="grid" />
    <text x="313" y="64" text-anchor="middle" class="axis">4</text>
    <path d="M313 70v120" class="grid" />
    <text x="364" y="64" text-anchor="middle" class="axis">5</text>
    <path d="M364 70v120" class="grid" />
    <text x="415" y="64" text-anchor="middle" class="axis">6</text>
    <path d="M415 70v120" class="grid" />
    <text x="466" y="64" text-anchor="middle" class="axis">7</text>
    <path d="M466 70v120" class="grid" />
    <text x="517" y="64" text-anchor="middle" class="axis">8</text>
    <path d="M517 70v120" class="grid" />
    <text x="568" y="64" text-anchor="middle" class="axis">9</text>
    <path d="M568 70v120" class="grid" />
    <text x="619" y="64" text-anchor="middle" class="axis">10</text>
    <path d="M619 70v120" class="grid" />
    <text x="670" y="64" text-anchor="middle" class="axis">11</text>
    <path d="M670 70v120" class="grid" />
    <text x="721" y="64" text-anchor="middle" class="axis">12</text>
    <path d="M721 70v120" class="grid" />
    <text x="20" y="97" class="lane">搬入</text>
    <rect x="109" y="76" width="102" height="30" rx="3" fill="#cee4d4" stroke="#6d9c7e" />
    <text x="160.0" y="97" class="label" text-anchor="middle">写 I0</text>
    <rect x="211" y="76" width="102" height="30" rx="3" fill="#f5d9c7" stroke="#b87f5f" />
    <text x="262.0" y="97" class="label" text-anchor="middle">写 I1</text>
    <text x="20" y="137" class="lane">计算</text>
    <rect x="211" y="116" width="153" height="30" rx="3" fill="#cee4d4" stroke="#6d9c7e" />
    <text x="287.5" y="137" class="label" text-anchor="middle">I0 → O0</text>
    <rect x="364" y="116" width="153" height="30" rx="3" fill="#f5d9c7" stroke="#b87f5f" />
    <text x="440.5" y="137" class="label" text-anchor="middle">I1 → O1</text>
    <text x="20" y="177" class="lane">写回</text>
    <rect x="364" y="156" width="102" height="30" rx="3" fill="#cee4d4" stroke="#6d9c7e" />
    <text x="415.0" y="177" class="label" text-anchor="middle">读 O0</text>
    <rect x="517" y="156" width="102" height="30" rx="3" fill="#f5d9c7" stroke="#b87f5f" />
    <text x="568.0" y="177" class="label" text-anchor="middle">读 O1</text>
  </g>
  <g>
    <text x="20" y="235" class="heading">搬入和计算共用一个输入端口</text>
    <text x="20" y="265" class="axis">时钟边沿 t</text>
    <text x="109" y="265" text-anchor="middle" class="axis">0</text>
    <path d="M109 271v120" class="grid" />
    <text x="160" y="265" text-anchor="middle" class="axis">1</text>
    <path d="M160 271v120" class="grid" />
    <text x="211" y="265" text-anchor="middle" class="axis">2</text>
    <path d="M211 271v120" class="grid" />
    <text x="262" y="265" text-anchor="middle" class="axis">3</text>
    <path d="M262 271v120" class="grid" />
    <text x="313" y="265" text-anchor="middle" class="axis">4</text>
    <path d="M313 271v120" class="grid" />
    <text x="364" y="265" text-anchor="middle" class="axis">5</text>
    <path d="M364 271v120" class="grid" />
    <text x="415" y="265" text-anchor="middle" class="axis">6</text>
    <path d="M415 271v120" class="grid" />
    <text x="466" y="265" text-anchor="middle" class="axis">7</text>
    <path d="M466 271v120" class="grid" />
    <text x="517" y="265" text-anchor="middle" class="axis">8</text>
    <path d="M517 271v120" class="grid" />
    <text x="568" y="265" text-anchor="middle" class="axis">9</text>
    <path d="M568 271v120" class="grid" />
    <text x="619" y="265" text-anchor="middle" class="axis">10</text>
    <path d="M619 271v120" class="grid" />
    <text x="670" y="265" text-anchor="middle" class="axis">11</text>
    <path d="M670 271v120" class="grid" />
    <text x="721" y="265" text-anchor="middle" class="axis">12</text>
    <path d="M721 271v120" class="grid" />
    <text x="20" y="298" class="lane">搬入</text>
    <rect x="109" y="277" width="102" height="30" rx="3" fill="#cee4d4" stroke="#6d9c7e" />
    <text x="160.0" y="298" class="label" text-anchor="middle">写 I0</text>
    <rect x="364" y="277" width="102" height="30" rx="3" fill="#f5d9c7" stroke="#b87f5f" />
    <text x="415.0" y="298" class="label" text-anchor="middle">写 I1</text>
    <text x="20" y="338" class="lane">计算</text>
    <rect x="211" y="317" width="153" height="30" rx="3" fill="#cee4d4" stroke="#6d9c7e" />
    <text x="287.5" y="338" class="label" text-anchor="middle">I0 → O0</text>
    <rect x="466" y="317" width="153" height="30" rx="3" fill="#f5d9c7" stroke="#b87f5f" />
    <text x="542.5" y="338" class="label" text-anchor="middle">I1 → O1</text>
    <text x="20" y="378" class="lane">写回</text>
    <rect x="364" y="357" width="102" height="30" rx="3" fill="#cee4d4" stroke="#6d9c7e" />
    <text x="415.0" y="378" class="label" text-anchor="middle">读 O0</text>
    <rect x="619" y="357" width="102" height="30" rx="3" fill="#f5d9c7" stroke="#b87f5f" />
    <text x="670.0" y="378" class="label" text-anchor="middle">读 O1</text>
  </g>
  <path d="M20 206H740" stroke="#b5c9b8" />
</svg>
