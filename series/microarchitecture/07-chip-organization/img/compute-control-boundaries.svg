<svg xmlns="http://www.w3.org/2000/svg" width="480" height="399" viewBox="0 0 480 399" role="img" aria-labelledby="map-title map-desc" lang="zh-CN">
  <title id="map-title">CPU 核心、GPU 的 SM 和 TPU 矩阵阵列各包含哪些资源</title>
  <desc id="map-desc">框的嵌套只表示包含关系，未按面积绘制。BOOM 核心内有控制、寄存器和整数算术单元。A100 内有多个 SM，SM 内有 warp 调度器、寄存器、共享内存及包括 Tensor Core 的执行通路。第一代 TPU 芯片内有矩阵单元 MXU，它包含多个乘加位置，统一缓冲区和累加存储位于矩阵单元之外。</desc>
  <style>
    text {font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183b34}
    .outer {fill:#eef3eb;stroke:#93aa9d;stroke-width:1.3}
    .group {fill:#dfeade;stroke:#638474;stroke-width:1.3}
    .block {fill:#fffdf6;stroke:#9caa96;stroke-width:1.1}
    .math {fill:#f6e7d1;stroke:#af8252;stroke-width:1.3}
    .title {font-size:17px;font-weight:650}
    .label {font-size:15px;font-weight:600}
    .text {font-size:14px}
  </style>
  <rect class="outer" x="4" y="4" width="472" height="84" rx="12"/>
  <text class="title" x="16" y="29">BOOM：一个 CPU 核心</text>
  <rect class="block" x="16" y="39" width="137" height="34" rx="6"/>
  <rect class="block" x="163" y="39" width="137" height="34" rx="6"/>
  <rect class="math" x="310" y="39" width="150" height="34" rx="6"/>
  <g class="text" text-anchor="middle">
    <text x="84" y="61">取指、译码、发射</text>
    <text x="231" y="61">物理寄存器文件</text>
    <text x="385" y="61">整数执行单元</text>
  </g>
  <rect class="outer" x="4" y="97" width="472" height="143" rx="12"/>
  <text class="title" x="16" y="122">A100：一颗 GPU 芯片内有多个 SM</text>
  <rect class="group" x="16" y="131" width="448" height="97" rx="8"/>
  <text class="label" x="28" y="154">放大其中一个 SM</text>
  <text class="text" x="28" y="178">warp 调度器、寄存器文件、共享内存</text>
  <rect class="math" x="28" y="187" width="190" height="29" rx="5"/>
  <rect class="math" x="228" y="187" width="222" height="29" rx="5"/>
  <g class="text" text-anchor="middle">
    <text x="123" y="207">通用算术通路</text>
    <text x="339" y="207">执行矩阵运算的 Tensor Core</text>
  </g>
  <rect class="outer" x="4" y="249" width="472" height="146" rx="12"/>
  <text class="title" x="16" y="274">第一代 TPU：一颗推理加速器芯片</text>
  <rect class="group" x="16" y="283" width="231" height="99" rx="8"/>
  <text class="label" x="26" y="307">矩阵单元 MXU</text>
  <rect class="math" x="26" y="318" width="79" height="50" rx="6"/>
  <text class="text" x="65" y="348" text-anchor="middle">一个 PE</text>
  <text class="text" x="116" y="348">其他乘加位置…</text>
  <rect class="block" x="256" y="283" width="207" height="99" rx="8"/>
  <g class="text">
    <text x="270" y="307">指令缓冲与控制</text>
    <text x="270" y="334">统一缓冲区、权重队列</text>
    <text x="270" y="361">累加存储、激活单元</text>
  </g>
</svg>
