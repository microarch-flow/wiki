<svg xmlns="http://www.w3.org/2000/svg" width="368" height="278" viewBox="0 0 368 278" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">共封装缩短 ASIC 电接口到光引擎的高速电段</title>
  <desc id="desc">对照两个发送端示意。可插拔模块布局的转换点在前面板附近，发送信号经过封装、板级电通道才进入光引擎。共封装时转换点移进 ASIC 封装，光纤从封装内引向面板再去 B。电段用棕色实线，光段用绿色虚线。示意不按比例。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" markerWidth="5" markerHeight="5" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#207763"/></marker>
  </defs>
  <style>
    text { font: 16px system-ui,"Noto Sans CJK SC",sans-serif; fill: #24443d; }
    .head { font-size: 17px; font-weight: 650; } .tag { text-anchor: middle; }
    .pkg { fill: #e9eee4; stroke: #afbbac; }
    .electric { fill: none; stroke: #9c6032; stroke-width: 4; }
    .optic { fill: none; stroke: #207763; stroke-width: 3; stroke-dasharray: 6 4; marker-end: url(#arr); }
    .eport { fill: #9c6032; } .switch { fill: #f9f8ef; stroke: #526852; stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="366" height="276" rx="11" fill="#f8f9f4" stroke="#c5cfc3"/>
  <text class="head" x="17" y="28">A 的发送方向</text>
  <text x="17" y="58">前面板可插拔</text>
  <rect class="pkg" x="16" y="67" width="113" height="67" rx="6"/>
  <text x="25" y="89">ASIC 封装</text>
  <path class="electric" d="M39 110H295"/><circle class="eport" cx="39" cy="110" r="4"/>
  <path class="optic" d="M300 110H347"/><rect class="switch" x="288" y="103" width="14" height="14" rx="2"/>
  <text class="tag" x="296" y="91">板边光引擎</text>
  <text x="17" y="163">共封装光学</text>
  <rect class="pkg" x="16" y="171" width="113" height="61" rx="6"/>
  <text x="24" y="194">共封装边界</text>
  <path class="electric" d="M39 212h64"/><circle class="eport" cx="39" cy="212" r="4"/>
  <path class="optic" d="M105 212H347"/><rect class="switch" x="96" y="205" width="14" height="14" rx="2"/>
  <text class="tag" x="207" y="194">光纤引到面板</text>
  <line x1="17" y1="254" x2="43" y2="254" class="electric"/><text x="49" y="260">高速电段</text>
  <line x1="147" y1="254" x2="173" y2="254" stroke="#207763" stroke-width="3" stroke-dasharray="5 3"/><text x="180" y="260">光段</text>
  <rect class="switch" x="244" y="247" width="13" height="13"/><text x="265" y="260">光引擎</text>
</svg>
