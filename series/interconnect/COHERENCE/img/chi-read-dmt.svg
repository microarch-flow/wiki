<svg xmlns="http://www.w3.org/2000/svg" width="420" height="526" viewBox="0 0 420 526" role="img" aria-labelledby="title desc"><title id="title">CHI DMT 读取流程</title><desc id="desc">请求经 HN-F 到 SN-F，数据直接返回 RN-F，RN-F 向 HN-F 发完成确认。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#386251"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#233f35;font-size:16px}.box{fill:#e8eee3;stroke:#63806c;stroke-width:1.5}.line{stroke:#386251;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.note{font-size:14px;fill:#4a6155}.life{stroke:#a0b0a1;stroke-width:1.3;stroke-dasharray:5 5}</style><text x="210" y="28" text-anchor="middle">CHI 读取：控制路径与数据路径</text><rect class="box" x="15" y="50" width="100" height="64" rx="9"/><text x="65.0" y="75.5" text-anchor="middle">RN-F</text><text x="65.0" y="98.5" text-anchor="middle">请求者</text><path class="life" d="M65,114 L65,446"/><rect class="box" x="160" y="50" width="100" height="64" rx="9"/><text x="210.0" y="75.5" text-anchor="middle">HN-F</text><text x="210.0" y="98.5" text-anchor="middle">归属节点</text><path class="life" d="M210,114 L210,446"/><rect class="box" x="305" y="50" width="100" height="64" rx="9"/><text x="355.0" y="75.5" text-anchor="middle">SN-F</text><text x="355.0" y="98.5" text-anchor="middle">内存侧</text><path class="life" d="M355,114 L355,446"/><text x="137.5" y="143" text-anchor="middle">ReadShared</text><text x="137.5" y="162" text-anchor="middle" class="note">REQ</text><path class="line" d="M65,170 L210,170"/><text x="282.5" y="218" text-anchor="middle">ReadNoSnp</text><text x="282.5" y="237" text-anchor="middle" class="note">REQ</text><path class="line" d="M210,245 L355,245"/><text x="210.0" y="293" text-anchor="middle">CompData · UC</text><text x="210.0" y="312" text-anchor="middle" class="note">DAT</text><path class="line" d="M355,320 L65,320"/><text x="137.5" y="368" text-anchor="middle">CompAck</text><text x="137.5" y="387" text-anchor="middle" class="note">RSP</text><path class="line" d="M65,395 L210,395"/><text x="210" y="476" text-anchor="middle" class="note">前提：无需探查，数据来自内存。</text><text x="210" y="501" text-anchor="middle" class="note">逻辑次序示意；不表示逐周期延迟。</text></svg>
