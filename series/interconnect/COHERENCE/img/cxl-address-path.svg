<svg xmlns="http://www.w3.org/2000/svg" width="420" height="630" viewBox="0 0 420 630" role="img" aria-labelledby="title desc"><title id="title">CXL Type 3 地址访问路径</title><desc id="desc">CPU 请求经主机与交换路由到端点，端点把 HPA 转为 DPA，然后访问设备内存。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#386251"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#233f35;font-size:16px}.box{fill:#e8eee3;stroke:#63806c;stroke-width:1.5}.line{stroke:#386251;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.note{font-size:14px;fill:#4a6155}.life{stroke:#a0b0a1;stroke-width:1.3;stroke-dasharray:5 5}</style><text x="210" y="28" text-anchor="middle">Type 3：需要访问设备内存时</text><rect class="box" x="25" y="50" width="370" height="66" rx="9"/><text x="210.0" y="88.0" text-anchor="middle">CPU：地址转换与缓存查找</text><path class="line" d="M210,116 L210,137"/><rect class="box" x="25" y="141" width="370" height="66" rx="9"/><text x="210.0" y="179.0" text-anchor="middle">未由缓存满足的设备内存请求</text><path class="line" d="M210,207 L210,228"/><rect class="box" x="25" y="232" width="370" height="66" rx="9"/><text x="210.0" y="258.5" text-anchor="middle">主机物理地址 HPA</text><text x="210.0" y="281.5" text-anchor="middle">选择窗口与下游路由</text><path class="line" d="M210,298 L210,319"/><rect class="box" x="25" y="323" width="370" height="66" rx="9"/><text x="210.0" y="349.5" text-anchor="middle">主机桥 / 交换结构</text><text x="210.0" y="372.5" text-anchor="middle">按配置选择目标</text><path class="line" d="M210,389 L210,410"/><rect class="box" x="25" y="414" width="370" height="66" rx="9"/><text x="210.0" y="440.5" text-anchor="middle">端点 HDM Decoder</text><text x="210.0" y="463.5" text-anchor="middle">将 HPA 转换为 DPA</text><path class="line" d="M210,480 L210,501"/><rect class="box" x="25" y="505" width="370" height="66" rx="9"/><text x="210.0" y="531.5" text-anchor="middle">设备内存控制器与介质</text><text x="210.0" y="554.5" text-anchor="middle">返回数据，满足主机请求</text><text x="210" y="602" text-anchor="middle" class="note">逻辑路径；已假设地址与资源配置有效。</text></svg>
