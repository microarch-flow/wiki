<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img" aria-labelledby="title desc"><title id="title">Linux CXL 内存接入</title><desc id="desc">固件和设备信息建立 CXL region，经 DAX 提供直接映射，或经 kmem 接入并上线为 System RAM。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#386251"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#233f35;font-size:16px}.box{fill:#e8eee3;stroke:#63806c;stroke-width:1.5}.line{stroke:#386251;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.note{font-size:14px;fill:#4a6155}.life{stroke:#a0b0a1;stroke-width:1.3;stroke-dasharray:5 5}</style><text x="210" y="28" text-anchor="middle">Linux 6.16：配置对象与使用路径</text><rect class="box" x="15" y="50" width="190" height="72" rx="9"/><text x="110.0" y="79.5" text-anchor="middle">固件窗口与拓扑</text><text x="110.0" y="102.5" text-anchor="middle">Decoder 配置</text><rect class="box" x="220" y="50" width="185" height="72" rx="9"/><text x="312.5" y="79.5" text-anchor="middle">Memdev</text><text x="312.5" y="102.5" text-anchor="middle">容量与管理</text><path class="line" d="M110,122 L110,154 L210,154 L210,180"/><path class="line" d="M312,122 L312,154 L210,154"/><rect class="box" x="35" y="185" width="350" height="72" rx="9"/><text x="210.0" y="214.5" text-anchor="middle">CXL Region</text><text x="210.0" y="237.5" text-anchor="middle">地址范围、交织目标与配置</text><path class="line" d="M210,257 L210,289"/><rect class="box" x="35" y="295" width="350" height="72" rx="9"/><text x="210.0" y="324.5" text-anchor="middle">DAX Region / DAX Device</text><text x="210.0" y="347.5" text-anchor="middle">选择使用方式</text><path class="line" d="M210,367 L210,399 L108,399 L108,427"/><path class="line" d="M210,399 L312,399 L312,427"/><rect class="box" x="15" y="433" width="185" height="72" rx="9"/><text x="107.5" y="462.5" text-anchor="middle">Device DAX</text><text x="107.5" y="485.5" text-anchor="middle">应用直接映射</text><rect class="box" x="220" y="433" width="185" height="72" rx="9"/><text x="312.5" y="462.5" text-anchor="middle">DAX kmem</text><text x="312.5" y="485.5" text-anchor="middle">接入 System RAM</text><path class="line" d="M312,505 L312,537"/><rect class="box" x="220" y="543" width="185" height="72" rx="9"/><text x="312.5" y="572.5" text-anchor="middle">内存块上线</text><text x="312.5" y="595.5" text-anchor="middle">交给页分配器</text><text x="210" y="652" text-anchor="middle" class="note">配置关系，不是每次 load 的执行链。</text></svg>
