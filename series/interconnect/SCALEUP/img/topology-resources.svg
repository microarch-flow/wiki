<svg xmlns="http://www.w3.org/2000/svg" width="560" height="730" viewBox="0 0 560 730" role="img" aria-labelledby="title desc"><title id="title">直连与交换的资源位置</title><desc id="desc">教学示意；具体条件见相邻正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:22px}.small{font-size:20px}.line{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{stroke:#376b9a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}</style><rect width="560" height="730" rx="16" fill="#f4f7fa"/><text x="280" y="38" text-anchor="middle" class="">连接可达，还要计算共享容量</text><text x="280" y="90" text-anchor="middle" class="">四端点直连：每对独立连接</text><path d="M100 145 L460 145" class="line"/><path d="M100 145 L100 300" class="line"/><path d="M100 145 L460 300" class="line"/><path d="M460 145 L100 300" class="line"/><path d="M460 145 L460 300" class="line"/><path d="M100 300 L460 300" class="line"/><rect x="65" y="121" width="70" height="48" rx="9" class="box"/><text x="100.0" y="153.0" text-anchor="middle" class="">A</text><rect x="425" y="121" width="70" height="48" rx="9" class="box"/><text x="460.0" y="153.0" text-anchor="middle" class="">B</text><rect x="65" y="276" width="70" height="48" rx="9" class="box"/><text x="100.0" y="308.0" text-anchor="middle" class="">C</text><rect x="425" y="276" width="70" height="48" rx="9" class="box"/><text x="460.0" y="308.0" text-anchor="middle" class="">D</text><text x="280" y="350" text-anchor="middle" class="small">真实端口数随端点数量增长</text><text x="280" y="415" text-anchor="middle" class="">交换结构：出口可能被共享</text><path d="M100 470 L280 540" class="line"/><path d="M460 470 L280 540" class="line"/><path d="M280 540 L100 625" class="arrow"/><path d="M280 540 L460 625" class="arrow"/><rect x="65" y="446" width="70" height="48" rx="9" class="box"/><text x="100.0" y="478.0" text-anchor="middle" class="">A</text><rect x="425" y="446" width="70" height="48" rx="9" class="box"/><text x="460.0" y="478.0" text-anchor="middle" class="">B</text><rect x="205" y="516" width="150" height="48" rx="9" class="box"/><text x="280.0" y="548.0" text-anchor="middle" class="">交换节点</text><rect x="65" y="601" width="70" height="48" rx="9" class="box"/><text x="100.0" y="633.0" text-anchor="middle" class="">C</text><rect x="425" y="601" width="70" height="48" rx="9" class="box"/><text x="460.0" y="633.0" text-anchor="middle" class="">D</text><text x="280" y="700" text-anchor="middle" class="small">A、B 同发 C 时竞争 C 的出口</text></svg>