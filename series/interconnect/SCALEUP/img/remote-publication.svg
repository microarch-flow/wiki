<svg xmlns="http://www.w3.org/2000/svg" width="560" height="610" viewBox="0 0 560 610" role="img" aria-labelledby="title desc"><title id="title">远端数据发布与同步时序</title><desc id="desc">教学示意；具体条件见相邻正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:22px}.small{font-size:20px}.line{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{stroke:#376b9a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}</style><rect width="560" height="610" rx="16" fill="#f4f7fa"/><text x="280" y="38" text-anchor="middle" class="">数据与通知：完成边界分开看</text><rect x="30" y="65" width="200" height="48" rx="9" class="box"/><text x="130.0" y="97.0" text-anchor="middle" class="">发起端 A</text><rect x="330" y="65" width="200" height="48" rx="9" class="box"/><text x="430.0" y="97.0" text-anchor="middle" class="">目标端 B</text><path d="M130 125 L130 540" class="line"/><path d="M430 125 L430 540" class="line"/><rect x="40" y="140" width="180" height="44" rx="9" class="box"/><text x="130.0" y="170.0" text-anchor="middle" class="">生产数据</text><text x="280" y="217" text-anchor="middle" class="">传输本轮数据</text><path d="M130 232 L430 232" class="arrow"/><text x="280" y="285" text-anchor="middle" class="small">按接口建立交付顺序</text><text x="280" y="330" text-anchor="middle" class="">发布本轮通知</text><path d="M130 345 L430 345" class="arrow"/><rect x="335" y="385" width="190" height="44" rx="9" class="box"/><text x="430.0" y="415.0" text-anchor="middle" class="">等待通知成立</text><rect x="335" y="460" width="190" height="44" rx="9" class="box"/><text x="430.0" y="490.0" text-anchor="middle" class="">消费对应数据</text><text x="280" y="580" text-anchor="middle" class="small">源缓冲复用另查接口完成规则</text></svg>