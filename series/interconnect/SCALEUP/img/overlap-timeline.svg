<svg xmlns="http://www.w3.org/2000/svg" width="560" height="705" viewBox="0 0 560 705" role="img" aria-labelledby="title desc"><title id="title">通信计算的串行与重叠时间线</title><desc id="desc">教学示意；具体条件见相邻正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:22px}.small{font-size:20px}.line{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{stroke:#376b9a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}</style><rect width="560" height="705" rx="16" fill="#f4f7fa"/><text x="280" y="38" text-anchor="middle" class="">重叠收益取决于依赖与资源</text><text x="280" y="90" text-anchor="middle" class="">串行：160 μs</text><rect x="55" y="114" width="250" height="40" rx="5" fill="#bdd8e9"/><text x="180.0" y="142" text-anchor="middle" class="">计算</text><rect x="305" y="166" width="150" height="40" rx="5" fill="#c8ddca"/><text x="380.0" y="194" text-anchor="middle" class="">通信</text><text x="280" y="241" text-anchor="middle" class="small">100 + 60</text><text x="280" y="270" text-anchor="middle" class="">独立重叠：100 μs</text><rect x="55" y="294" width="250" height="40" rx="5" fill="#bdd8e9"/><text x="180.0" y="322" text-anchor="middle" class="">计算</text><rect x="55" y="346" width="150" height="40" rx="5" fill="#c8ddca"/><text x="130.0" y="374" text-anchor="middle" class="">通信</text><text x="280" y="421" text-anchor="middle" class="small">max(100, 60)</text><text x="280" y="470" text-anchor="middle" class="">争用后：140 μs</text><rect x="55" y="494" width="350" height="40" rx="5" fill="#bdd8e9"/><text x="230.0" y="522" text-anchor="middle" class="">计算</text><rect x="55" y="546" width="225" height="40" rx="5" fill="#c8ddca"/><text x="167.5" y="574" text-anchor="middle" class="">通信</text><text x="280" y="621" text-anchor="middle" class="small">max(140, 90)</text><text x="280" y="670" text-anchor="middle" class="small">构造例子；不含启动与排空时间</text></svg>