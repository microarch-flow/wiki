<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" role="img" aria-labelledby="title desc"><title id="title">逐跳暂停与端到端拥塞反馈</title><desc id="desc">PFC 在相邻链路暂停特定优先级，ECN 经接收端形成 CNP 反馈，源端按具体算法调速。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:23px}.small{font-size:20px}.line,.arrow{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}.green{fill:#dfeee3;stroke:#699477;stroke-width:1.5}.dash{stroke-dasharray:6 5}</style><rect width="520" height="700" rx="16" fill="#f4f7fa"/><text x="260" y="38" text-anchor="middle" class="">PFC：相邻链路按优先级暂停</text><rect x="25" y="80" width="190" height="50" rx="9" class="box"/><text x="120.0" y="113.0" text-anchor="middle" class="">上游设备</text><rect x="305" y="80" width="190" height="50" rx="9" class="box"/><text x="400.0" y="113.0" text-anchor="middle" class="">拥塞设备</text><path d="M215 165 L305 165" class="arrow "/><text x="260" y="198" text-anchor="middle" class="small">数据到达</text><path d="M305 240 L215 240" class="arrow "/><text x="260" y="278" text-anchor="middle" class="small">PFC 暂停</text><text x="260" y="320" text-anchor="middle" class="small">反馈生效前仍有在途数据</text><text x="260" y="390" text-anchor="middle" class="">ECN / CNP：端到端反馈</text><rect x="25" y="430" width="130" height="50" rx="9" class="box"/><text x="90.0" y="463.0" text-anchor="middle" class="">源 NIC</text><rect x="195" y="430" width="130" height="50" rx="9" class="box"/><text x="260.0" y="463.0" text-anchor="middle" class="">交换机</text><rect x="365" y="430" width="130" height="50" rx="9" class="box"/><text x="430.0" y="463.0" text-anchor="middle" class="">目标 NIC</text><path d="M155 455 L195 455" class="arrow "/><path d="M325 455 L365 455" class="arrow "/><text x="260" y="525" text-anchor="middle" class="small">队列拥塞 → ECN 标记</text><path d="M430 480 L430 575 L90 575 L90 480" class="arrow"/><text x="260" y="620" text-anchor="middle" class="small">目标反馈 CNP，源端调速</text><text x="260" y="670" text-anchor="middle" class="small">两种控制范围不同，可配合使用</text></svg>