<svg xmlns="http://www.w3.org/2000/svg" width="520" height="750" viewBox="0 0 520 750" role="img" aria-labelledby="title desc"><title id="title">主机、NIC 与接收应用的职责</title><desc id="desc">普通 socket 与硬件 RDMA 具有不同提交路径，两者都经过网络并需要接收方正确消费。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:23px}.small{font-size:20px}.line,.arrow{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}.green{fill:#dfeee3;stroke:#699477;stroke-width:1.5}.dash{stroke-dasharray:6 5}</style><rect width="520" height="750" rx="16" fill="#f4f7fa"/><text x="260" y="38" text-anchor="middle" class="">端点职责：两种提交路径</text><text x="135" y="84" text-anchor="middle" class="">普通 socket</text><text x="385" y="84" text-anchor="middle" class="">硬件 RDMA</text><rect x="25" y="110" width="220" height="52" rx="9" class="box"/><text x="135.0" y="144.0" text-anchor="middle" class="">应用缓冲区</text><path d="M135 162 L135 202" class="arrow "/><rect x="25" y="210" width="220" height="52" rx="9" class="box"/><text x="135.0" y="244.0" text-anchor="middle" class="">协议栈与驱动</text><path d="M135 262 L135 302" class="arrow "/><rect x="25" y="310" width="220" height="52" rx="9" class="box"/><text x="135.0" y="344.0" text-anchor="middle" class="">NIC 收发队列</text><rect x="275" y="110" width="220" height="52" rx="9" class="box"/><text x="385.0" y="144.0" text-anchor="middle" class="">授权与资源准备</text><path d="M385 162 L385 202" class="arrow "/><rect x="275" y="210" width="220" height="52" rx="9" class="box"/><text x="385.0" y="244.0" text-anchor="middle" class="">工作请求与 CQ</text><path d="M385 262 L385 302" class="arrow "/><rect x="275" y="310" width="220" height="52" rx="9" class="box"/><text x="385.0" y="344.0" text-anchor="middle" class="">NIC 传输引擎</text><path d="M135 362 L135 410" class="arrow "/><path d="M385 362 L385 410" class="arrow "/><rect x="25" y="420" width="470" height="54" rx="9" class="green"/><text x="260.0" y="455.0" text-anchor="middle" class="">交换网络：转发、排队与拥塞</text><path d="M260 474 L260 515" class="arrow "/><rect x="25" y="525" width="470" height="54" rx="9" class="box"/><text x="260.0" y="560.0" text-anchor="middle" class="">目标端：放置数据并交付相应状态</text><path d="M260 579 L260 620" class="arrow "/><rect x="25" y="630" width="470" height="54" rx="9" class="green"/><text x="260.0" y="665.0" text-anchor="middle" class="">应用：同步、消费、回收缓冲</text><text x="260" y="724" text-anchor="middle" class="small">逻辑路径；不固定复制次数</text></svg>