<svg xmlns="http://www.w3.org/2000/svg" width="520" height="735" viewBox="0 0 520 735" role="img" aria-labelledby="title desc"><title id="title">Clos 多路径与目标出口瓶颈</title><desc id="desc">两个 spine 提供候选路径，A 和 B 发往 C 的流量仍共享 C 的出口；不表示所有 Clos 均为此规模。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:23px}.small{font-size:20px}.line,.arrow{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}.green{fill:#dfeee3;stroke:#699477;stroke-width:1.5}.dash{stroke-dasharray:6 5}</style><rect width="520" height="735" rx="16" fill="#f4f7fa"/><text x="260" y="38" text-anchor="middle" class="">两条路径，共享一个目标出口</text><rect x="40" y="85" width="160" height="50" rx="9" class="box"/><text x="120.0" y="118.0" text-anchor="middle" class="">源 A</text><rect x="320" y="85" width="160" height="50" rx="9" class="box"/><text x="400.0" y="118.0" text-anchor="middle" class="">源 B</text><path d="M120 135 L260 185" class="arrow "/><path d="M400 135 L260 185" class="arrow "/><rect x="160" y="195" width="200" height="50" rx="9" class="box"/><text x="260.0" y="228.0" text-anchor="middle" class="">源 Leaf</text><path d="M230 245 L120 300" class="arrow "/><path d="M290 245 L400 300" class="arrow "/><rect x="30" y="310" width="180" height="50" rx="9" class="box"/><text x="120.0" y="343.0" text-anchor="middle" class="">Spine 1</text><rect x="310" y="310" width="180" height="50" rx="9" class="box"/><text x="400.0" y="343.0" text-anchor="middle" class="">Spine 2</text><path d="M120 360 L230 425" class="arrow "/><path d="M400 360 L290 425" class="arrow "/><rect x="160" y="435" width="200" height="50" rx="9" class="box"/><text x="260.0" y="468.0" text-anchor="middle" class="">目标 Leaf</text><path d="M260 485 L260 555" class="arrow "/><text x="375" y="530" text-anchor="middle" class="small">共享出口</text><rect x="160" y="565" width="200" height="50" rx="9" class="green"/><text x="260.0" y="598.0" text-anchor="middle" class="">目标 C</text><text x="260" y="665" text-anchor="middle" class="small">ECMP 决定流落在哪条路径</text><text x="260" y="703" text-anchor="middle" class="small">C 的端口仍限制汇聚吞吐</text></svg>