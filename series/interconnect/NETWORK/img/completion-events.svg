<svg xmlns="http://www.w3.org/2000/svg" width="520" height="750" viewBox="0 0 520 750" role="img" aria-labelledby="title desc"><title id="title">提交、传输、完成与消费</title><desc id="desc">RC Write with Immediate 在合法资源下写入目标并生成对应通知；源端完成和远端消费者执行不能等同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#376b9a"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203a50;font-size:23px}.small{font-size:20px}.line,.arrow{stroke:#376b9a;stroke-width:2.5;fill:none}.arrow{marker-end:url(#arrow)}.box{fill:#e7f0f6;stroke:#7496b2;stroke-width:1.5}.green{fill:#dfeee3;stroke:#699477;stroke-width:1.5}.dash{stroke-dasharray:6 5}</style><rect width="520" height="750" rx="16" fill="#f4f7fa"/><text x="260" y="38" text-anchor="middle" class="">RC 带立即数写入的完成边界</text><rect x="25" y="70" width="205" height="50" rx="9" class="box"/><text x="127.5" y="103.0" text-anchor="middle" class="">发起端 A</text><rect x="290" y="70" width="205" height="50" rx="9" class="box"/><text x="392.5" y="103.0" text-anchor="middle" class="">目标端 B</text><path d="M128 125 L128 605" class="line dash"/><path d="M393 125 L393 605" class="line dash"/><rect x="25" y="150" width="205" height="48" rx="9" class="box"/><text x="127.5" y="182.0" text-anchor="middle" class="">提交工作请求</text><text x="260" y="234" text-anchor="middle" class="">数据 + 立即数</text><path d="M128 250 L393 250" class="arrow "/><rect x="290" y="280" width="205" height="48" rx="9" class="box"/><text x="392.5" y="312.0" text-anchor="middle" class="">校验与数据放置</text><text x="260" y="365" text-anchor="middle" class="">传输确认</text><path d="M393 380 L128 380" class="arrow "/><rect x="25" y="420" width="205" height="48" rx="9" class="box"/><text x="127.5" y="452.0" text-anchor="middle" class="">读取成功完成</text><rect x="290" y="420" width="205" height="48" rx="9" class="box"/><text x="392.5" y="452.0" text-anchor="middle" class="">读取接收完成</text><text x="128" y="505" text-anchor="middle" class="small">允许源缓冲复用</text><rect x="290" y="515" width="205" height="48" rx="9" class="green"/><text x="392.5" y="547.0" text-anchor="middle" class="">建立消费依赖</text><rect x="290" y="590" width="205" height="48" rx="9" class="green"/><text x="392.5" y="622.0" text-anchor="middle" class="">消费者读取</text><text x="260" y="685" text-anchor="middle" class="small">两端软件观察完成的先后不固定</text><text x="260" y="720" text-anchor="middle" class="small">A 的完成不证明 B 已消费</text></svg>