<svg xmlns="http://www.w3.org/2000/svg" width="360" height="576" viewBox="0 0 360 576" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">带立即数的 RDMA 写：源缓冲区和目标槽分别何时可以复用</title>
  <desc id="desc">第 17 轮。使用可靠连接 RC 和非内联写，请求发送完成。B 已授权目标槽并预贴接收请求。A 提交后，A 的网卡读取源缓冲，把 4 KiB 写入远端地址和 rkey 指定的目标范围。B 的网卡在接收完成中提供立即数 17。A 取到对应的成功发送完成，可以复用源缓冲。B 取到本轮成功接收完成后，由轮询的同一 CPU 线程读取目标槽。两端软件观察这两项完成没有固定先后。B 处理完并归还目标槽后，A 才可提交下一次对同一目标槽的覆盖。</desc>
  <defs>
    <marker id="send-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" viewBox="0 0 6 6" orient="auto">
      <path d="M0 0 6 3 0 6Z" fill="#305c86"/>
    </marker>
    <marker id="return-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" viewBox="0 0 6 6" orient="auto">
      <path d="M0 0 6 3 0 6Z" fill="#27705b"/>
    </marker>
  </defs>
  <style>
    text { font: 16px system-ui, "Noto Sans CJK SC", sans-serif; text-anchor: middle; fill: #21394a; }
    .heading { font-weight: 650; font-size: 18px; }
    .strong { font-weight: 650; }
    .send { fill: #244f78; }
    .receive { fill: #185b48; }
    .arrow { fill: none; stroke-linecap: round; stroke-width: 2.4; }
    .lane { stroke: #a6b2b0; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .a-box { fill: #eef3f8; stroke: #8da9c1; }
    .b-box { fill: #eef5f1; stroke: #89aba0; }
  </style>

  <rect x="1" y="1" width="358" height="574" rx="12" fill="#fafbf8" stroke="#cad1cd"/>
  <text class="heading" x="180" y="29">第 17 轮：带立即数写入 4 KiB</text>
  <text x="180" y="53">RC 连接，非内联，申请发送完成</text>
  <path d="M14 68H346" stroke="#cad1cd"/>

  <rect x="12" y="82" width="158" height="35" rx="6" fill="#e3edf4"/>
  <rect x="190" y="82" width="158" height="35" rx="6" fill="#e3eeea"/>
  <text class="heading" x="91" y="105">A · 源缓冲区</text>
  <text class="heading" x="269" y="105">B · 目标槽</text>
  <path class="lane" d="M91 118V491 M269 118V445"/>

  <rect class="a-box" x="12" y="130" width="158" height="58" rx="6"/>
  <text x="91" y="153">提交工作请求</text>
  <text x="91" y="176">网卡读取源数据</text>
  <rect class="b-box" x="190" y="130" width="158" height="58" rx="6"/>
  <text x="269" y="153">已授权目标槽</text>
  <text x="269" y="176">已提交接收请求</text>

  <rect x="64" y="197" width="232" height="25" rx="3" fill="#fafbf8"/>
  <text class="send strong" x="180" y="216">数据 4 KiB，立即数 17</text>
  <circle cx="91" cy="228" r="3" fill="#305c86"/>
  <path class="arrow" d="M91 228H267" stroke="#305c86" marker-end="url(#send-arrow)"/>

  <rect class="b-box" x="190" y="243" width="158" height="59" rx="6"/>
  <text x="269" y="266">校验地址与 rkey</text>
  <text x="269" y="289">将数据写入目标槽</text>

  <rect x="35" y="270" width="114" height="27" rx="3" fill="#fafbf8"/>
  <text x="92" y="289">RC 传输确认</text>
  <path class="arrow" d="M269 307H93" stroke="#27705b" marker-end="url(#return-arrow)"/>

  <rect class="a-box" x="12" y="318" width="158" height="78" rx="6"/>
  <text class="send strong" x="91" y="341">取到本次发送 CQE</text>
  <text x="91" y="363">核对成功状态</text>
  <text x="91" y="385">可改写源缓冲区</text>
  <rect class="b-box" x="190" y="318" width="158" height="78" rx="6"/>
  <text class="receive strong" x="269" y="341">取到成功接收 CQE</text>
  <text x="269" y="363">核对轮次 17</text>
  <text x="269" y="385">可读取目标槽</text>

  <rect x="64" y="412" width="232" height="26" rx="3" fill="#fafbf8"/>
  <text class="receive strong" x="180" y="431">B 消费完，向 A 归还目标槽</text>
  <circle cx="269" cy="445" r="3" fill="#27705b"/>
  <path class="arrow" d="M269 445H93" stroke="#27705b" marker-end="url(#return-arrow)"/>
  <rect class="a-box" x="12" y="461" width="158" height="58" rx="6"/>
  <text x="91" y="484">收到槽归还通知</text>
  <text x="91" y="507">可再次写同一目标槽</text>

  <path d="M14 531H346" stroke="#cad1cd"/>
  <text x="180" y="558">A、B 轮询到各自 CQE 的先后可变</text>
</svg>
