<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">单向 SerDes 链路</title><desc id="desc">并行数据依次经过 TX、通道和 RX；发送时钟和 CDR 提供时序，配置及校准可以调整发送端和接收端。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#31587e"/></marker></defs>
<rect x="0" y="0" width="1000" height="300" rx="18" fill="#edf4f8"/>
<g font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#17334d" text-anchor="middle">
<g fill="#fff" stroke="#8cacc2" stroke-width="2"><rect x="35" y="66" width="150" height="84" rx="12"/><rect x="250" y="66" width="150" height="84" rx="12"/><rect x="465" y="66" width="150" height="84" rx="12"/><rect x="680" y="66" width="150" height="84" rx="12"/><rect x="865" y="66" width="100" height="84" rx="12"/></g>
<g font-size="21" font-weight="600"><text x="110" y="101">并行输入</text><text x="325" y="101">TX</text><text x="540" y="101">通道</text><text x="755" y="101">RX</text><text x="915" y="101">输出</text></g>
<g font-size="15"><text x="110" y="129">数据 / 控制</text><text x="325" y="129">串行化 / 驱动</text><text x="540" y="129">封装 / 走线</text><text x="755" y="129">均衡 / 判决</text><text x="915" y="129">并行字</text></g>
<g stroke="#31587e" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M185 108 H246"/><path d="M400 108 H461"/><path d="M615 108 H676"/><path d="M830 108 H861"/><path d="M325 224 V156"/><path d="M755 224 V156"/></g>
<g stroke="#668a9e" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"><path d="M465 246 H430 V133 H405"/><path d="M615 246 H645 V133 H675"/></g>
<g fill="#d9e8f3" stroke="#8cacc2"><rect x="250" y="225" width="150" height="42" rx="10"/><rect x="465" y="225" width="150" height="42" rx="10"/><rect x="680" y="225" width="150" height="42" rx="10"/></g><g font-size="16"><text x="325" y="251">发送时钟</text><text x="540" y="251">配置 / 校准</text><text x="755" y="251">CDR / 采样时序</text></g>
<text x="500" y="28" font-size="17">数据路径：TX → 通道 → RX</text><text x="500" y="287" font-size="14">功能示意：具体时钟和控制结构依实现而定</text>
</g></svg>
