<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 310" role="img" aria-labelledby="title desc">
<title id="title">训练时的数据方向和可选反馈方向</title>
<desc id="desc">设备 A 发送训练序列经过通道到设备 B 的接收端。B 可在本地观察和调整接收参数；协议支持时，B 可向 A 请求调整发送参数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1050" height="310" rx="18" fill="#edf4f8"/>
<g font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#17334d" text-anchor="middle">
<text x="525" y="30" font-size="20" font-weight="600">示意：A → B 的数据路径与可能存在的控制反馈</text>
<rect x="55" y="70" width="225" height="94" rx="12" fill="#d9e9f1" stroke="#54809d" stroke-width="2"/>
<rect x="412" y="70" width="225" height="94" rx="12" fill="#e2ece8" stroke="#6e9488" stroke-width="2"/>
<rect x="770" y="70" width="225" height="94" rx="12" fill="#d9e9f1" stroke="#54809d" stroke-width="2"/>
<g font-size="19" font-weight="600"><text x="167" y="105">设备 A：TX</text><text x="524" y="105">通道</text><text x="882" y="105">设备 B：RX</text></g>
<g font-size="16"><text x="167" y="137">发送序列，可调整 TX</text><text x="524" y="137">改变信号波形</text><text x="882" y="137">观察并调整本地 RX</text></g>
<g fill="none" stroke="#17618b" stroke-width="4" marker-end="url(#arrow)"><path d="M285 117 H405"/><path d="M642 117 H763"/></g>
<path d="M882 170 V240 H167 V171" fill="none" stroke="#ad5b35" stroke-width="4" marker-end="url(#arrow)"/>
<text x="525" y="225" font-size="17" fill="#914323">反向请求 A 调整 TX：仅在协议与配置支持时</text>
<text x="525" y="280" font-size="15">具体训练序列、反馈信道和先后顺序以对应协议为准</text>
</g></svg>
