<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img" aria-labelledby="title description">
  <title id="title">UCIe-3D 单向连接的功能示意</title>
  <desc id="description">上方芯粒的逻辑经发送 PHY，通过垂直连接界面将数据和随路时钟送到下方芯粒的接收 PHY，再交给本地逻辑。</desc>
  <defs>
    <marker id="arrow-data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#416c54"/></marker>
    <marker id="arrow-clock" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66f36"/></marker>
  </defs>
  <rect x="34" y="20" width="572" height="206" rx="14" fill="#f2f5ed" stroke="#c4d2bd" stroke-width="2"/>
  <text x="58" y="58" font-family="sans-serif" font-size="25" fill="#38574a">芯粒 A</text>
  <text x="320" y="98" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">上层逻辑 / NoC</text>
  <path d="M320 112 V132" fill="none" stroke="#416c54" stroke-width="3" marker-end="url(#arrow-data)"/>
  <rect x="176" y="140" width="288" height="62" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="320" y="180" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#203e35">发送 PHY</text>
  <rect x="34" y="324" width="572" height="206" rx="14" fill="#f2f5ed" stroke="#c4d2bd" stroke-width="2"/>
  <text x="58" y="365" font-family="sans-serif" font-size="25" fill="#38574a">芯粒 B</text>
  <rect x="176" y="348" width="288" height="62" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="320" y="388" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#203e35">接收 PHY</text>
  <path d="M320 410 V430" fill="none" stroke="#416c54" stroke-width="3" marker-end="url(#arrow-data)"/>
  <text x="320" y="473" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">上层逻辑 / NoC</text>
  <path d="M60 250 H580 M60 298 H580" fill="none" stroke="#9aaea0" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M256 202 V340" fill="none" stroke="#416c54" stroke-width="5" marker-end="url(#arrow-data)"/>
  <path d="M384 202 V340" fill="none" stroke="#a66f36" stroke-width="5" marker-end="url(#arrow-clock)"/>
  <circle cx="256" cy="250" r="6" fill="#416c54"/>
  <circle cx="256" cy="298" r="6" fill="#416c54"/>
  <circle cx="384" cy="250" r="6" fill="#a66f36"/>
  <circle cx="384" cy="298" r="6" fill="#a66f36"/>
  <text x="175" y="280" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#203e35">数据</text>
  <text x="472" y="280" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#573c2e">随路时钟</text>
  <text x="145" y="320" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#38574a">堆叠连接界面</text>
  <text x="320" y="516" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#38574a">单向功能示意，非实际凸点图</text>
</svg>
