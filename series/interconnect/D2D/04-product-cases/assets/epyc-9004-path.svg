<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" role="img" aria-labelledby="title description">
  <title id="title">EPYC 计算芯粒、I/O die 和 DDR5 的连接示意</title>
  <desc id="description">同一封装内的两颗 CCD 分别通过 GMI 连接 I/O die。I/O die 包含内存控制器，并连接封装外的 DDR5。图仅表示功能关系。</desc>
  <rect x="28" y="20" width="584" height="390" rx="14" fill="#f2f5ed" stroke="#c4d2bd" stroke-width="2"/>
  <text x="54" y="55" font-family="sans-serif" font-size="25" fill="#38574a">同一处理器封装内</text>
  <rect x="76" y="75" width="210" height="76" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <rect x="354" y="75" width="210" height="76" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="181" y="123" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#203e35">CCD A</text>
  <text x="459" y="123" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#203e35">CCD B</text>
  <path d="M181 151 V255 M459 151 V255" fill="none" stroke="#416c54" stroke-width="5"/>
  <rect x="229" y="176" width="182" height="44" rx="8" fill="#f2f5ed"/>
  <text x="320" y="207" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#38574a">各自的 GMI</text>
  <rect x="76" y="255" width="488" height="103" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="320" y="294" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#203e35">I/O die（IOD）</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#203e35">互连与 DDR5 内存控制器</text>
  <path d="M320 358 V444" fill="none" stroke="#a84e36" stroke-width="5"/>
  <rect x="103" y="444" width="434" height="72" rx="9" fill="#f5e8d7" stroke="#a66f36" stroke-width="3"/>
  <text x="320" y="489" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#573c2e">封装外 DDR5 内存</text>
  <text x="320" y="554" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#38574a">仅画两颗 CCD，非实际布局</text>
</svg>
