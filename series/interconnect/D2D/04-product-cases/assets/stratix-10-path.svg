<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 585" role="img" aria-labelledby="title description">
  <title id="title">Stratix 10 FPGA 和收发器 tile 的功能路径</title>
  <desc id="description">示意封装内的 FPGA 核心和收发器 tile 通过两端 AIB 接口及 EMIB 通道连接。收发器另有封装外高速链路连接对端。图不表示实际布局。</desc>
  <rect x="28" y="20" width="584" height="406" rx="14" fill="#f2f5ed" stroke="#c4d2bd" stroke-width="2"/>
  <text x="54" y="55" font-family="sans-serif" font-size="25" fill="#38574a">同一封装内</text>
  <rect x="103" y="74" width="434" height="80" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="320" y="123" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#203e35">FPGA 核心逻辑</text>
  <path d="M320 154 V186 M320 266 V298" fill="none" stroke="#416c54" stroke-width="5"/>
  <rect x="103" y="186" width="434" height="80" rx="9" fill="#e2e9dd" stroke="#648170" stroke-width="3"/>
  <text x="320" y="218" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">两端 AIB 接口</text>
  <text x="320" y="249" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">EMIB 封装连接</text>
  <rect x="103" y="298" width="434" height="80" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="320" y="347" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#203e35">收发器 tile</text>
  <path d="M320 378 V460" fill="none" stroke="#a84e36" stroke-width="5"/>
  <rect x="103" y="460" width="434" height="72" rx="9" fill="#f5e8d7" stroke="#a66f36" stroke-width="3"/>
  <text x="320" y="504" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#573c2e">封装外链路与对端</text>
  <text x="320" y="568" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#38574a">功能示意，非实际布局</text>
</svg>
