<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title description">
  <title id="title">MI300A 的 CPU、GPU 与共享内存功能示意</title>
  <desc id="description">同一封装内，三个 CPU 芯粒和六个 GPU XCD 通过封装内互连和共享缓存使用八个 HBM3 堆栈。图中连接仅表示功能关系。</desc>
  <rect x="28" y="20" width="584" height="452" rx="14" fill="#f2f5ed" stroke="#c4d2bd" stroke-width="2"/>
  <text x="54" y="55" font-family="sans-serif" font-size="25" fill="#38574a">同一 MI300A 封装内</text>
  <rect x="66" y="80" width="232" height="96" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="182" y="119" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">CPU 芯粒 × 3</text>
  <text x="182" y="153" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#203e35">共 24 个核心</text>
  <rect x="342" y="80" width="232" height="96" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="458" y="119" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">GPU XCD × 6</text>
  <text x="458" y="153" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#203e35">加速计算</text>
  <path d="M182 176 V220 M458 176 V220" fill="none" stroke="#416c54" stroke-width="5"/>
  <rect x="66" y="220" width="508" height="87" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="320" y="257" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">封装内互连与共享缓存</text>
  <text x="320" y="286" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#38574a">连接计算与内存体系</text>
  <path d="M320 307 V348" fill="none" stroke="#416c54" stroke-width="5"/>
  <rect x="109" y="348" width="422" height="82" rx="9" fill="#f5e8d7" stroke="#a66f36" stroke-width="3"/>
  <text x="320" y="382" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#573c2e">HBM3 × 8 个堆栈</text>
  <text x="320" y="412" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#573c2e">共 128 GB</text>
  <text x="320" y="503" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#38574a">功能示意，非实际布局或逐跳路由</text>
</svg>
