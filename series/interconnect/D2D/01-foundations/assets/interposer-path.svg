<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title description">
  <title id="title">并排芯粒经过中介层的连接示意</title>
  <desc id="description">芯粒 A 和 B 并排放置。信号从 A 经过凸点进入硅中介层的布线，再经过凸点进入 B。中介层位于封装基板上方。</desc>
  <rect x="28" y="24" width="584" height="340" rx="14" fill="#f2f5ed" stroke="#c4d2bd" stroke-width="2"/>
  <rect x="55" y="42" width="210" height="76" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <rect x="375" y="42" width="210" height="76" rx="9" fill="#d6e8d5" stroke="#416c54" stroke-width="3"/>
  <text x="160" y="88" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#203e35">芯粒 A</text>
  <text x="480" y="88" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#203e35">芯粒 B</text>
  <g fill="#a66f36" stroke="#80572e" stroke-width="2">
    <circle cx="100" cy="128" r="9"/><circle cx="160" cy="128" r="9"/><circle cx="220" cy="128" r="9"/>
    <circle cx="420" cy="128" r="9"/><circle cx="480" cy="128" r="9"/><circle cx="540" cy="128" r="9"/>
  </g>
  <rect x="45" y="139" width="550" height="104" rx="7" fill="#e2e9dd" stroke="#648170" stroke-width="3"/>
  <text x="320" y="174" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#203e35">硅中介层（内部布线）</text>
  <path d="M160 130 V209 H480 V139" fill="none" stroke="#a84e36" stroke-width="7" stroke-linejoin="round"/>
  <path d="M470 149 L480 134 L490 149" fill="none" stroke="#a84e36" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#a66f36" stroke="#80572e" stroke-width="2">
    <circle cx="105" cy="252" r="8"/><circle cx="210" cy="252" r="8"/><circle cx="320" cy="252" r="8"/>
    <circle cx="430" cy="252" r="8"/><circle cx="535" cy="252" r="8"/>
  </g>
  <rect x="45" y="261" width="550" height="52" rx="7" fill="#cbdcc7" stroke="#648170" stroke-width="3"/>
  <text x="320" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#203e35">封装基板</text>
  <text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#38574a">红线：一条从 A 到 B 的示例信号路径</text>
</svg>
