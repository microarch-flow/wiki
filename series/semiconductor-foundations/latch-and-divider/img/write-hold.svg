    <text x="96" y="537" font-size="16" text-anchor="middle" fill="#66786f">W 断</text>
    <path d="M161 510 H194" stroke="#203c37" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <path d="M194 493 L228 510 L194 527 Z" stroke="#203c37" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="#e8ede4"/>
    <circle cx="232.5" cy="510" r="4.5" fill="#f7f6ef" stroke="#203c37" stroke-width="2.2"/>
    <path d="M237 510 H313" stroke="#203c37" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
