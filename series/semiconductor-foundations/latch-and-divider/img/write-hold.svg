    <path d="M246 556 L283 556" stroke="#09677b" stroke-width="3.1" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <circle cx="246" cy="556" r="3.1" fill="#f7f6ef" stroke="#09677b" stroke-width="2.4"/>
    <circle cx="283" cy="556" r="3.1" fill="#f7f6ef" stroke="#09677b" stroke-width="2.4"/>
    <path d="M246 556 H161 V510" stroke="#09677b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <text x="265" y="577" font-size="16" text-anchor="middle" fill="#09677b">F 通</text>
    <circle cx="161" cy="510" r="3.7" fill="#203c37" stroke="none" stroke-width="2"/>
    <circle cx="419" cy="510" r="3.7" fill="#203c37" stroke="none" stroke-width="2"/>
    <text x="20" y="604" font-size="17" text-anchor="start" fill="#203c37">D 变成 1 时，Q 仍通过反馈维持 X 为 0。</text>
  </g>
</svg>
