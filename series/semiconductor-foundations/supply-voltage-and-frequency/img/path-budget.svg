<svg xmlns="http://www.w3.org/2000/svg" width="480" height="488" viewBox="0 0 480 488" role="img" aria-labelledby="title description">
  <title id="title">把同一条寄存器路径的时间需求与相邻时钟沿比较</title>
  <desc id="description">三个示例工作点共用时间轴，发射沿都在零时刻。横条从零开始，终点是已计入建立时间和预留量的路径总需求。0.8 V、1 GHz 时，1.00 ns 的周期比 0.86 ns 的需求多 0.14 ns。0.7 V、1 GHz 时，1.08 ns 的需求超过周期 0.08 ns。保持 0.7 V 并降至 900 MHz，下一捕获沿移到约 1.1111 ns，剩余约 0.0311 ns。</desc>
  <rect x="1" y="1" width="478" height="486" rx="15" fill="#f7f6ef" stroke="#c4d0c4"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#203c37">
    <text x="20" y="34" font-size="23" font-weight="700">下一拍的捕获沿留够时间了吗？</text>
    <text x="20" y="63" font-size="17" fill="#526861">从同一发射沿起算。三行的 0 ns 对齐。</text>
    <path d="M21 91H47" stroke="#086a7e" stroke-width="8"/>
    <text x="56" y="97" font-size="17">路径总时间需求</text>
    <path d="M245 82l5 6 5-6z M250 87v15" fill="#203c37" stroke="#203c37" stroke-width="1.6"/>
    <text x="263" y="97" font-size="17">下一捕获沿</text>
    <g stroke="#c4d0c4" stroke-dasharray="3 4" fill="none">
      <path d="M46 153v31 M216 153v31 M386 153v31 M454 153v31"/>
      <path d="M46 249v31 M216 249v31 M386 249v31 M454 249v31"/>
      <path d="M46 345v31 M216 345v31 M386 345v31 M454 345v31"/>
    </g>
    <g stroke="#9caea1" fill="none">
      <path d="M46 168H454 M46 264H454 M46 360H454"/>
    </g>
    <text x="20" y="138" font-size="20" font-weight="650">0.8 V · 1 GHz</text>
    <text x="458" y="138" font-size="18" font-weight="650" text-anchor="end" fill="#356046">富余 0.14 ns</text>
    <path d="M46 168H338.4" stroke="#086a7e" stroke-width="9"/>
    <path d="M338.4 177v4H386v-4" fill="none" stroke="#356046" stroke-width="1.8"/>
    <path d="M381 150l5 6 5-6z M386 156v18" fill="#203c37" stroke="#203c37" stroke-width="1.8"/>
    <text x="46" y="201" font-size="17" fill="#526861">路径需要 0.86 ns，周期为 1.00 ns。</text>

    <text x="20" y="234" font-size="20" font-weight="650">0.7 V · 1 GHz</text>
    <text x="458" y="234" font-size="18" font-weight="650" text-anchor="end" fill="#a54a22">缺少 0.08 ns</text>
    <path d="M46 264H413.2" stroke="#086a7e" stroke-width="9"/>
    <path d="M386 273v4h27.2v-4" fill="none" stroke="#a54a22" stroke-width="1.8"/>
    <path d="M381 246l5 6 5-6z M386 252v18" fill="#203c37" stroke="#203c37" stroke-width="1.8"/>
    <text x="46" y="297" font-size="17" fill="#526861">路径需要 1.08 ns，周期仍为 1.00 ns。</text>

    <text x="20" y="330" font-size="20" font-weight="650">0.7 V · 900 MHz</text>
    <text x="458" y="330" font-size="18" font-weight="650" text-anchor="end" fill="#356046">富余约 0.0311 ns</text>
    <path d="M46 360H413.2" stroke="#086a7e" stroke-width="9"/>
    <path d="M413.2 369v4h10.578v-4" fill="none" stroke="#356046" stroke-width="1.8"/>
    <path d="M418.778 342l5 6 5-6z M423.778 348v18" fill="#203c37" stroke="#203c37" stroke-width="1.8"/>
    <text x="46" y="393" font-size="17" fill="#526861">路径仍需 1.08 ns，周期延长至约 1.1111 ns。</text>

    <path d="M46 407H454 M46 403v8 M216 403v8 M386 403v8 M454 403v8" fill="none" stroke="#526861" stroke-width="1.2"/>
    <g text-anchor="middle" font-size="16" fill="#526861">
      <text x="46" y="431">0 ns</text><text x="216" y="431">0.5 ns</text>
      <text x="386" y="431">1.0 ns</text><text x="454" y="431">1.2 ns</text>
    </g>
    <path d="M20 445H460" stroke="#c4d0c4"/>
    <text x="20" y="471" font-size="16" fill="#526861">路径需求已计入时钟到输出、逻辑、建立时间和预留量。</text>
  </g>
</svg>
