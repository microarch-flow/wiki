<svg xmlns="http://www.w3.org/2000/svg" width="480" height="475" viewBox="0 0 480 475" role="img" aria-labelledby="title desc">
  <title id="title">同一个 50 fF 节点降压后，到半高用时为什么增加？</title>
  <desc id="desc">从零充到各自供电的一半。0.8 V 时要送入 20 fC，0.7 V 时要送入 17.5 fC。假设两段充电的平均电流分别为 0.40 mA 和 0.28 mA。所需时间等于电荷除以该段平均电流，分别为 50 ps 和 62.5 ps。每组条形在自己的单位下从零起算。</desc>
  <style>
    text {font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#203c37}
    .title {font-size:23px;font-weight:700}.head {font-size:20px;font-weight:650}
    .small {font-size:17px;fill:#4d645a}.value {font-size:18px;font-weight:650;text-anchor:end}
    .v {font-size:17px;font-weight:650}.hi {fill:#09677b}.lo {fill:#9b4c28}
    .sep {stroke:#c4d0c4;stroke-width:1}
  </style>
  <rect x="1" y="1" width="478" height="473" rx="15" fill="#f7f6ef" stroke="#c4d0c4"/>
  <text x="20" y="36" class="title">所需电荷变少了，为什么反而更慢？</text>
  <text x="20" y="65" class="small">同一个 50 fF 节点，从零充到各自供电的一半。</text>

  <text x="20" y="106" class="head">到半高所需的电荷</text>
  <text x="460" y="106" text-anchor="end" class="small">ΔQ = C × ΔV</text>
  <text x="20" y="136" class="v hi">0.8 V</text><rect x="89" y="123" width="256" height="14" rx="2" class="hi"/><text x="460" y="136" class="value">20 fC</text>
  <text x="20" y="165" class="v lo">0.7 V</text><rect x="89" y="152" width="224" height="14" rx="2" class="lo"/><text x="460" y="165" class="value">17.5 fC</text>
  <text x="20" y="193" class="small">半高从 0.40 V 降至 0.35 V，所需电荷减少 12.5%。</text>
  <path d="M20 208H460" class="sep"/>

  <text x="20" y="237" class="head">这段时间内的平均充电电流</text>
  <text x="460" y="237" text-anchor="end" class="small">教学给定值</text>
  <text x="20" y="268" class="v hi">0.8 V</text><rect x="89" y="255" width="256" height="14" rx="2" class="hi"/><text x="460" y="268" class="value">0.40 mA</text>
  <text x="20" y="297" class="v lo">0.7 V</text><rect x="89" y="284" width="179.2" height="14" rx="2" class="lo"/><text x="460" y="297" class="value">0.28 mA</text>
  <text x="20" y="326" class="small">低压档在这段时间的平均电流减少 30%。</text>
  <path d="M20 341H460" class="sep"/>

  <text x="20" y="370" class="head">从零到半高的时间</text>
  <text x="460" y="370" text-anchor="end" class="small">用时 = ΔQ / 平均电流</text>
  <text x="20" y="401" class="v hi">0.8 V</text><rect x="89" y="388" width="204.8" height="14" rx="2" class="hi"/><text x="460" y="401" class="value">50 ps</text>
  <text x="20" y="430" class="v lo">0.7 V</text><rect x="89" y="417" width="256" height="14" rx="2" class="lo"/><text x="460" y="430" class="value">62.5 ps</text>
  <text x="20" y="458" class="small">电流降幅更大，本例到达半高多花 12.5 ps。</text>
</svg>
