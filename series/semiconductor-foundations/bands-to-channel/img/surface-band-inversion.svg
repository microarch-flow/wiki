  <text x="14" y="377" font-size="16" font-weight="400" fill="#597069" text-anchor="start">E</text>
  <text x="466" y="464" font-size="17" font-weight="650" fill="#09677b" text-anchor="start">E꜀</text>
  <text x="466" y="443" font-size="17" font-weight="650" fill="#a65029" text-anchor="start">Eꜰ</text>
  <text x="466" y="541" font-size="17" font-weight="650" fill="#706394" text-anchor="start">Eᵥ</text>
  <path d="M58 549H457" stroke="#597069" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M148 549v5M368 549v5" stroke="#597069" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="102" y="570" font-size="16" font-weight="600" fill="#203c37" text-anchor="middle">n⁺ 源区</text>
  <text x="258" y="570" font-size="16" font-weight="600" fill="#203c37" text-anchor="middle">栅下 p 区</text>
  <text x="413" y="570" font-size="16" font-weight="600" fill="#203c37" text-anchor="middle">n⁺ 漏区</text>
  <circle cx="81" cy="428" r="6.5" fill="#09677b"/><path d="M78 428h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="106" cy="416" r="6.5" fill="#09677b"/><path d="M103 416h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="432" cy="428" r="6.5" fill="#09677b"/><path d="M429 428h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="407" cy="416" r="6.5" fill="#09677b"/><path d="M404 416h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="213" cy="428" r="6.5" fill="#09677b"/><path d="M210 428h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="258" cy="428" r="6.5" fill="#09677b"/><path d="M255 428h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="302" cy="428" r="6.5" fill="#09677b"/><path d="M299 428h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
