  <text x="258" y="310" font-size="16" font-weight="600" fill="#203c37" text-anchor="middle">栅下 p 区</text>
  <text x="413" y="310" font-size="16" font-weight="600" fill="#203c37" text-anchor="middle">n⁺ 漏区</text>
