  <path d="M397 428H318" stroke="#09677b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#electron-arrow)"/>
  <text x="258" y="411" font-size="16" font-weight="650" fill="#09677b" text-anchor="middle">升压时两侧补入导带电子</text>
  <text x="258" y="482" font-size="17" font-weight="600" fill="#597069" text-anchor="middle">硅的禁带并没有缩小</text>
  <path d="M22 323H498" stroke="#c9d3c7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="260" y="601" font-size="16" font-weight="400" fill="#597069" text-anchor="middle">E꜀：导带底　Eᵥ：价带顶　Eꜰ：费米能级</text>
  <text x="260" y="624" font-size="16" font-weight="400" fill="#597069" text-anchor="middle">箭头表示升压时的电荷重排；不是稳态净电流。</text>
  <text x="260" y="645" font-size="15" font-weight="400" fill="#597069" text-anchor="middle">能量与位置均为示意，带间距保持不变。</text>
