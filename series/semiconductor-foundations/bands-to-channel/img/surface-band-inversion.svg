  <text x="260" y="55" font-size="16" font-weight="400" fill="#597069" text-anchor="middle">源、漏、体均接 0 V；沿硅表面从源向漏观察</text>
  <text x="23" y="92" font-size="20" font-weight="650" fill="#203c37" text-anchor="start">1 · 栅压低，电子难以经过栅下表面</text>
