  <text x="258" y="148" font-size="17" font-weight="600" fill="#597069" text-anchor="middle">导带势垒高</text>
  <text x="258" y="170" font-size="16" font-weight="400" fill="#597069" text-anchor="middle">电子不易进入</text>
  <text x="23" y="352" font-size="20" font-weight="650" fill="#203c37" text-anchor="start">2 · 栅压足够高，表面容易获得电子</text>
  <path d="M58 459H108C141 459 151 443 203 443H312C364 443 374 459 407 459H457V368H58Z" stroke="none" stroke-width="0" fill="#e2eeee" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 536H108C141 536 151 520 203 520H312C364 520 374 536 407 536H457V549H58Z" stroke="none" stroke-width="0" fill="#e8e1ef" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 459H108C141 459 151 443 203 443H312C364 443 374 459 407 459H457" stroke="#09677b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 536H108C141 536 151 520 203 520H312C364 520 374 536 407 536H457" stroke="#706394" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 452H457" stroke="#a65029" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
