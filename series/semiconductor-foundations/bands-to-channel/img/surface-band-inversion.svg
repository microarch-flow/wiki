  <text x="14" y="117" font-size="16" font-weight="400" fill="#597069" text-anchor="start">E</text>
  <text x="466" y="204" font-size="17" font-weight="650" fill="#09677b" text-anchor="start">E꜀</text>
  <text x="466" y="183" font-size="17" font-weight="650" fill="#a65029" text-anchor="start">Eꜰ</text>
  <text x="466" y="281" font-size="17" font-weight="650" fill="#706394" text-anchor="start">Eᵥ</text>
  <path d="M58 289H457" stroke="#597069" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M148 289v5M368 289v5" stroke="#597069" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
