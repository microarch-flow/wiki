  <circle cx="219" cy="219" r="6.5" fill="#f7f6ef" stroke="#a65029" stroke-width="1.8"/><path d="M216.2 219h5.6M219 216.2v5.6" stroke="#a65029" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="258" cy="219" r="6.5" fill="#f7f6ef" stroke="#a65029" stroke-width="1.8"/><path d="M255.2 219h5.6M258 216.2v5.6" stroke="#a65029" stroke-width="1.2" stroke-linecap="round"/>
