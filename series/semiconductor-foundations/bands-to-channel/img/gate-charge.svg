<svg xmlns="http://www.w3.org/2000/svg" width="480" height="601" viewBox="0 0 480 601" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">栅压升高时的硅表面电荷重排</title>
<desc id="desc">源、漏、体接地。三幅图中的负受主保持原来的晶格位置。平带附近示意多数空穴补偿负受主；升高栅压后空穴退向体内，留下未补偿的负受主；进一步升压时两侧n+源漏沿硅供给电子，在表面建立反型层。蓝色横向箭头仅表示调栅压重排电荷的过程，不是稳态净电流。各区尺寸与符号数量为示意。</desc>
