<svg xmlns="http://www.w3.org/2000/svg" width="520" height="565" viewBox="0 0 520 565" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">两种 MOS 管怎样改变输出节点的电压</title>
  <desc id="desc">两幅独立的导通开关等效电路。NMOS 的源极接地、漏极接 Y、栅极维持 VDD。输出电容的 Y 侧得到电子，电压下降。PMOS 的源极接 VDD、漏极接 Y、栅极接零，输出电容的 Y 侧失去电子，电压升高。两图均表示充放电期间，稳定后净电流趋于零。</desc>
  <defs>
    <marker id="electron" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#09677b"/></marker>
    <marker id="current" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#a65029"/></marker>
    <g id="ground" stroke="#53675b" stroke-width="2" fill="none"><path d="M0 -8V0M-11 0H11M-7 4H7M-3 8H3"/></g>
    <g id="cap" stroke="#53675b" stroke-width="2.2" fill="none"><path d="M0 -26V-8M-18 -8H18M-18 8H18M0 8V26"/></g>
  </defs>
  <rect x="1" y="1" width="518" height="563" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#203c37" font-size="17.5">
    <text x="20" y="33" font-size="23" font-weight="700">用 MOS 管给输出充放电</text>
    <text x="20" y="60" fill="#526861">以导通开关等效表示，两幅电路独立观察。</text>
    <rect x="16" y="78" width="488" height="210" rx="9" fill="#fffdf7" stroke="#d3dacf"/>
    <text x="30" y="105" font-size="20" font-weight="700">① NMOS：高电平导通 · 下拉</text>
    <g stroke="#53675b" stroke-width="2.4" fill="none" stroke-linejoin="round">
      <path d="M245 133H426V150M245 133V157M245 202V224M426 202V224"/>
      <rect x="206" y="157" width="78" height="45" rx="5" fill="#e0ece7" stroke="#587a72"/>

      <path d="M114 179H191" stroke-dasharray="4 3"/>
      <path d="M191 169V189" stroke="#53675b"/>
    </g>
    <text x="34" y="172" fill="#203c37">栅 = VDD</text><text x="34" y="196" fill="#526861">S = 0 V</text>
    <text x="245" y="185" font-size="16" font-weight="700" text-anchor="middle">NMOS</text>
    <circle cx="245" cy="133" r="4" fill="#203c37"/><text x="385" y="126" font-weight="700">Y ↓</text>
    <use href="#cap" x="426" y="176"/><text x="452" y="180" font-weight="600">C</text>
    <use href="#ground" x="245" y="232"/><use href="#ground" x="426" y="232"/>
    <path d="M302 221V136" stroke="#09677b" stroke-width="2.6" fill="none" marker-end="url(#electron)"/>
    <path d="M347 133V216" stroke="#a65029" stroke-width="2.6" fill="none" marker-end="url(#current)"/>
    <text x="38" y="252" fill="#09677b" font-weight="600">Y 侧得到电子</text>
    <text x="256" y="266" font-weight="600">净正电荷减少，电压下降</text>
    <rect x="16" y="302" width="488" height="210" rx="9" fill="#fffdf7" stroke="#d3dacf"/>
    <text x="30" y="329" font-size="20" font-weight="700">② PMOS：低电平导通 · 上拉</text>
    <g stroke="#53675b" stroke-width="2.4" fill="none" stroke-linejoin="round">
      <path d="M245 358V375M245 420V438H426V444M426 488V496"/>
      <path d="M222 358H268" stroke-width="3"/>
      <rect x="206" y="375" width="78" height="45" rx="5" fill="#f5e8df" stroke="#ab7455"/>

      <path d="M114 397H183" stroke-dasharray="4 3"/>
      <circle cx="187" cy="397" r="4" fill="#f7f6ef"/>
      <path d="M191 387V407"/>
    </g>
    <text x="245" y="352" text-anchor="middle" font-weight="600">VDD</text>
    <text x="34" y="390">栅 = 0 V</text><text x="34" y="414" fill="#526861">S = VDD</text>
    <text x="245" y="403" font-size="16" font-weight="700" text-anchor="middle">PMOS</text>
    <circle cx="245" cy="438" r="4" fill="#203c37"/><text x="385" y="431" font-weight="700">Y ↑</text>
    <use href="#cap" x="426" y="462"/><text x="452" y="466" font-weight="600">C</text>
    <use href="#ground" x="426" y="496"/>
    <path d="M302 439V354" stroke="#09677b" stroke-width="2.6" fill="none" marker-end="url(#electron)"/>
    <path d="M347 356V436" stroke="#a65029" stroke-width="2.6" fill="none" marker-end="url(#current)"/>
    <text x="38" y="469" fill="#09677b" font-weight="600">Y 侧失去电子</text>
    <text x="38" y="494" font-weight="600">净正电荷增加，电压上升</text>
    <path d="M26 537H59" stroke="#09677b" stroke-width="2.6" marker-end="url(#electron)"/><text x="72" y="543">电子净转移</text>
    <path d="M287 537H320" stroke="#a65029" stroke-width="2.6" marker-end="url(#current)"/><text x="334" y="543">常规电流</text>
  </g>
</svg>
