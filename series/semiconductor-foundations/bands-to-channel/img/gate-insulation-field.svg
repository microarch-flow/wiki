  <text x="240" y="58" font-size="17" font-weight="400" fill="#597069" text-anchor="middle">用两块金属极板夹住二氧化硅来观察</text>
  <rect x="133" y="77" width="319" height="48" rx="3" fill="#61776d" stroke="#50675e"/>
