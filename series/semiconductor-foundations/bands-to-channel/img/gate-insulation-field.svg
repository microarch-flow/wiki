  <circle cx="34" cy="331" r="6.5" fill="#09677b"/><path d="M31 331h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M47 331H68" stroke="#09677b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#electron-arrow)"/>
  <text x="82" y="337" font-size="17" font-weight="400" fill="#203c37" text-anchor="start">充电时，电子沿外部导线转移</text>
  <text x="240" y="362" font-size="17" font-weight="400" fill="#597069" text-anchor="middle">电压稳定后，绝缘层不需有持续导电电流，</text>
  <text x="240" y="385" font-size="17" font-weight="400" fill="#597069" text-anchor="middle">电场仍然存在。</text>
</g>
