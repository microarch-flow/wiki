<svg xmlns="http://www.w3.org/2000/svg" width="480" height="412" viewBox="0 0 480 412" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">固定栅压时的长沟道 NMOS 理想输出特性</title>
<desc id="desc">长沟道教学模型，k 为 200 微安每平方伏，栅过驱动 0.5 伏。漏压在 0、0.1、0.5 和 0.8 伏时电流分别为 0、9、25、25 微安。饱和段取定值，忽略沟道长度调制和速度饱和等效应。</desc>
