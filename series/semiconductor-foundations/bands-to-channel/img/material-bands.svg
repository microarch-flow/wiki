<svg xmlns="http://www.w3.org/2000/svg" width="540" height="450" viewBox="0 0 540 450" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">金属、本征硅与二氧化硅的能带占据对比</title>
<desc id="desc">各栏分别取其材料自身能量的示意。金属有部分占据的能带，室温本征硅的价带和导带之间约有1.12 eV的带隙且有少量热产生的载流子，二氧化硅的带隙约9 eV、正常弱场下载流子极少。图中各带边、态数及状态占据比例不按实际尺度绘制。</desc>
<defs>
  <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#597069"/></marker>
  <marker id="electron-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#09677b"/></marker>
  <marker id="field-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a65029"/></marker>
</defs>
