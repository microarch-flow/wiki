<svg xmlns="http://www.w3.org/2000/svg" width="480" height="473" viewBox="0 0 480 473" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">长沟道 NMOS 中沿沟道的电位与过驱动</title>
<desc id="desc">固定迁移率、固定阈值的渐变沟道模型；源在左，漏在右，两图横轴均为沟道位置。蓝色实线为漏压 0.1 伏，红色虚线为漏压 0.5 伏。漏端过驱动分别为 0.4 和 0 伏，后一条件是漏端强反型开始夹断。临近夹断的实际局部电场超出此近似。</desc>
