<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1102" viewBox="0 0 560 1102" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">固定栅压后的四种 NMOS 漏压与沟道状态</title>
  <desc id="desc">理想长沟道增强型 NMOS，源和体固定 0 伏、栅固定 0.8 伏、阈值取 0.3 伏。漏压 0 伏时反型电子面密度近似均匀而没有净源漏电流；漏压 0.1 伏时，局部过驱动由源端 0.5 伏降至漏端 0.4 伏，电子净向漏端移动；漏压 0.5 伏时末端的强反型近似到零，达到夹断起点；漏压 0.8 伏时，额外漏压主要落在漏侧高场区，沟道输运的电子继续被扫进漏极。电子符号的密度示意反型电荷变化，并非反型层物理厚度；画中的几何尺度及粒子数都不是定量分布。</desc>
  <defs><g id="ce"><circle r="6.8" fill="#09677b"/><path d="M-3.2 0H3.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></g><g id="h"><circle r="6.8" fill="#fff8ee" stroke="#a65029" stroke-width="1.7"/><path d="M-3 0H3M0 -3V3" stroke="#a65029" stroke-width="1.6" stroke-linecap="round"/></g><g id="donor"><rect x="-12.4" y="-9.5" width="24.8" height="19" rx="3.5" fill="#f1dddf" stroke="#9a6068"/><text x="0" y="4.5" font-size="13.5" fill="#703940" font-weight="700" text-anchor="middle">P⁺</text></g><marker id="e-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#09677b"/></marker><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#a65029"/></marker><marker id="v-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#706394"/></marker><marker id="i-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#203c37"/></marker></defs>
  <rect x="1" y="1" width="558" height="1100" rx="15" fill="#f7f6ef" stroke="#c9d3c7" />
  <g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="20" y="35" font-size="23" text-anchor="start" fill="#203c37" font-weight="700">栅压固定后，漏压怎样改变沟道？</text>
<text x="20" y="63" font-size="18" text-anchor="start" fill="#526861" font-weight="400">源和体均为 0 V；栅 0.8 V，阈值 0.3 V。</text>
<text x="20" y="89" font-size="18" text-anchor="start" fill="#203c37" font-weight="500">强反型区的局部过驱动 = 0.8 V − V(x) − 0.3 V</text>
<g transform="translate(0 104)">
<text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="700">①  漏源等电压：沟道已建立</text>
<text x="85" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">源 0 V</text>
<text x="280" y="48" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">栅 0.8 V</text>
<text x="475" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">漏 0 V</text>
<rect x="146" y="56" width="268" height="25" rx="3" fill="#61776d" stroke="none" />
<text x="280" y="76" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="600">+      +      +      +      +</text>
