<text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="700">③  漏压升到 0.5 V：强反型开始夹断</text>
<text x="85" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">源 0 V</text>
<text x="280" y="48" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">栅 0.8 V</text>
<text x="475" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">漏 0.5 V</text>
