<text x="280" y="151" font-size="17" text-anchor="middle" fill="#526861" font-weight="400">p 型体区（0 V）</text>
<text x="280" y="184" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="600">过驱动：源端 0.5 V → 漏端 0.4 V</text>
<text x="90" y="213" font-size="17" text-anchor="start" fill="#09677b" font-weight="600">电子净移动</text>
