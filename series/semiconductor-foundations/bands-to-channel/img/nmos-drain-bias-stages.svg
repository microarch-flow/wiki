<text x="280" y="185" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="600">源漏两端过驱动都是 0.5 V</text>
<text x="280" y="212" font-size="17.5" text-anchor="middle" fill="#526861" font-weight="400">左右电子通量相抵，稳态净电流为零。</text>
</g>
