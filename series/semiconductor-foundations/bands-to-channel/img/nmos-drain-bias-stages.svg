<text x="280" y="184" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="600">过驱动：源端 0.5 V → 漏端 0 V</text>
<text x="90" y="213" font-size="17" text-anchor="start" fill="#09677b" font-weight="600">电子仍净移动</text>
