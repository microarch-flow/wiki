<text x="280" y="155" font-size="17" text-anchor="middle" fill="#526861" font-weight="500">n 型阱（1.2 V）</text>
<text x="280" y="186" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="500">栅极与源极同电位，VSG = 0 V。</text>
<text x="280" y="211" font-size="17" text-anchor="middle" fill="#526861" font-weight="400">多数载流子为导带电子；没有贯通源漏的空穴沟道。</text>
</g>
<path d="M20 305H540" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"  />
<g transform="translate(0 314)">
<text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="700">②  栅极降为 0 V：空穴沟道建立</text>
<text x="85" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">源 1.2 V</text>
<text x="280" y="48" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">栅 0 V</text>
<text x="475" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">漏 1.2 V</text>
<rect x="146" y="56" width="268" height="25" rx="3" fill="#61776d" stroke="none" />
