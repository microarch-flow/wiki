<text x="280" y="155" font-size="17" text-anchor="middle" fill="#526861" font-weight="500">n 型阱（1.2 V）</text>
<text x="280" y="184" font-size="17" text-anchor="middle" fill="#203c37" font-weight="500">VSG = 1.2 V：表面多数电子退开，留下正施主。</text>
<text x="280" y="209" font-size="17" text-anchor="middle" fill="#526861" font-weight="400">降栅压时，两侧 p⁺ 区提供空穴；稳态净电流为零。</text>
</g>
<path d="M20 538H540" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"  />
<g transform="translate(0 547)">
<text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="700">③  漏极降为 0.8 V：形成净输运</text>
<text x="85" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">源 1.2 V</text>
<text x="280" y="48" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">栅 0 V</text>
<text x="475" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">漏 0.8 V</text>
<rect x="146" y="56" width="268" height="25" rx="3" fill="#61776d" stroke="none" />
