<text x="280" y="183" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="600">VSG = 1.2 V，VSD = 0.4 V</text>
<text x="72" y="210" font-size="17.5" text-anchor="start" fill="#a65029" font-weight="600">空穴净移动</text>
