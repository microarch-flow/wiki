<svg xmlns="http://www.w3.org/2000/svg" width="560" height="896" viewBox="0 0 560 896" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">从栅压到漏压的 PMOS 三个阶段</title>
  <desc id="desc">增强型 PMOS 源和体端固定 1.2 伏，p+ 源漏在 n 型阱中。初始栅漏均为 1.2 伏，没有空穴反型沟道。栅极降为零伏后，相对源为负 1.2 伏，表面导带电子退开，显露出固定正施主； p+ 源漏补充价带空穴，形成反型层。此时源漏等电位，稳定之后净源漏电流为零；图中朝内的空穴箭头表示建立沟道的暂态补充。漏极降到 0.8 伏，空穴与常规电流从源到漏，价带电子的净转移方向相反。图中电子、空穴和离子并非定量计数，最后一步假定未发生夹断。</desc>
  <defs><g id="ce"><circle r="6.8" fill="#09677b"/><path d="M-3.2 0H3.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></g><g id="h"><circle r="6.8" fill="#fff8ee" stroke="#a65029" stroke-width="1.7"/><path d="M-3 0H3M0 -3V3" stroke="#a65029" stroke-width="1.6" stroke-linecap="round"/></g><g id="donor"><rect x="-12.4" y="-9.5" width="24.8" height="19" rx="3.5" fill="#f1dddf" stroke="#9a6068"/><text x="0" y="4.5" font-size="13.5" fill="#703940" font-weight="700" text-anchor="middle">P⁺</text></g><marker id="e-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#09677b"/></marker><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#a65029"/></marker><marker id="v-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#706394"/></marker><marker id="i-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0 0L9.5 5 0 10Z" fill="#203c37"/></marker></defs>
  <rect x="1" y="1" width="558" height="894" rx="15" fill="#f7f6ef" stroke="#c9d3c7" />
  <g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="20" y="35" font-size="23" text-anchor="start" fill="#203c37" font-weight="700">PMOS：降低栅电压，再降低漏电压</text>
<text x="20" y="63" font-size="18" text-anchor="start" fill="#526861" font-weight="400">源和体固定 1.2 V；增强型 PMOS。</text>
<g transform="translate(0 81)">
<text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="700">①  栅极与源极同电压：关断</text>
<text x="85" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">源 1.2 V</text>
<text x="280" y="48" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">栅 1.2 V</text>
<text x="475" y="55" font-size="18" text-anchor="middle" fill="#203c37" font-weight="500">漏 1.2 V</text>
<rect x="146" y="56" width="268" height="25" rx="3" fill="#61776d" stroke="none" />
<text x="280" y="76" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="600">栅极</text>
<rect x="146" y="81" width="268" height="10" rx="0" fill="#f5e1a5" stroke="#cabd9d" />
<rect x="24" y="91" width="512" height="72" rx="2" fill="#e0e9ec" stroke="#85948c" />
<rect x="24" y="91" width="122" height="43" rx="0" fill="#f3e9d9" stroke="#85948c" />
<rect x="414" y="91" width="122" height="43" rx="0" fill="#f3e9d9" stroke="#85948c" />
<text x="85" y="127" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="500">p⁺ 源区</text>
<text x="475" y="127" font-size="17.5" text-anchor="middle" fill="#203c37" font-weight="500">p⁺ 漏区</text>
