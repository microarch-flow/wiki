<svg xmlns="http://www.w3.org/2000/svg" width="480" height="488" viewBox="0 0 480 488" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">相同源漏画法下两种 MOS 管的电压和输运方向</title>
<desc id="desc">两种管子均以源在左、漏在右的方式绘制。取阈值绝对值均为 0.4 伏，两者均在线性区。NMOS 源端 0 伏、栅端 1.2 伏、漏端 0.1 伏，电子向右而常规电流向左。PMOS 源端和体端 1.2 伏、栅端 0 伏、漏端 0.8 伏，空穴净移动与常规电流都向右，价带电子的净转移向左。体端分别接源端。</desc>
<defs><marker id="aE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.3" markerHeight="3.3" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#09677b" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.3" markerHeight="3.3" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#9b4c28" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.3" markerHeight="3.3" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#203c37" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><g id="e"><circle cx="0" cy="0" r="6.2" fill="#09677b" stroke="none" stroke-width="2.4"/><path d="M-2.8 0H2.8" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><g id="h"><circle cx="0" cy="0" r="6" fill="#f7f6ef" stroke="#9b4c28" stroke-width="2.4"/><path d="M-2.7 0h5.4M0 -2.7v5.4" fill="none" stroke="#9b4c28" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><g id="accept"><rect x="-5.8" y="-5.8" width="11.6" height="11.6" rx="1" fill="#ede8dc" stroke="#6a7467"/><path d="M-3.1 0h6.2" fill="none" stroke="#203c37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g></defs>
<rect x="1" y="1" width="478" height="486" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
<g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="20" y="35" font-size="23" text-anchor="start" fill="#203c37" font-weight="700">NMOS 与 PMOS：沿源到漏看</text>
<text x="20" y="69" font-size="20" text-anchor="start" fill="#203c37" font-weight="700">NMOS</text>
<text x="455" y="69" font-size="18" text-anchor="end" fill="#526861">体端接源端</text>
<text x="240" y="98" font-size="18" text-anchor="middle" fill="#203c37">栅 1.2 V</text>
<text x="75" y="114" font-size="18" text-anchor="middle" fill="#203c37">源 0 V</text>
<text x="405" y="114" font-size="18" text-anchor="middle" fill="#203c37">漏 0.1 V</text>
<rect x="130" y="106" width="220" height="12" rx="2" fill="#61776d" stroke="none"/>
<rect x="130" y="118" width="220" height="8" rx="0" fill="#f5e1a5" stroke="#cabd9d"/>
<rect x="26" y="127" width="428" height="51" rx="0" fill="#eddfcf" stroke="#a8b7aa"/>
<rect x="26" y="127" width="104" height="28" rx="0" fill="#d9e9e6" stroke="#a8b7aa"/>
<rect x="350" y="127" width="104" height="28" rx="0" fill="#d9e9e6" stroke="#a8b7aa"/>
<text x="77" y="148" font-size="18" text-anchor="middle" fill="#203c37">n⁺</text>
<text x="402" y="148" font-size="18" text-anchor="middle" fill="#203c37">n⁺</text>
<path d="M130 130H350" fill="none" stroke="#09677b" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="168" font-size="18" text-anchor="middle" fill="#203c37">p 型体区</text>
<text x="59" y="207" font-size="18" text-anchor="start" fill="#09677b">电子净移动</text>
<path d="M190 201L389 201" fill="none" stroke="#09677b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aE)"/>
<text x="59" y="236" font-size="18" text-anchor="start" fill="#203c37">常规电流</text>
<path d="M389 230L190 230" fill="none" stroke="#203c37" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aI)"/>
<path d="M20 242H460" fill="none" stroke="#cdd6cb" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="269" font-size="20" text-anchor="start" fill="#203c37" font-weight="700">PMOS</text>
<text x="455" y="269" font-size="18" text-anchor="end" fill="#526861">体端接源端</text>
<text x="240" y="298" font-size="18" text-anchor="middle" fill="#203c37">栅 0 V</text>
<text x="75" y="314" font-size="18" text-anchor="middle" fill="#203c37">源 1.2 V</text>
<text x="405" y="314" font-size="18" text-anchor="middle" fill="#203c37">漏 0.8 V</text>
<rect x="130" y="306" width="220" height="12" rx="2" fill="#61776d" stroke="none"/>
<rect x="130" y="318" width="220" height="8" rx="0" fill="#f5e1a5" stroke="#cabd9d"/>
<rect x="26" y="327" width="428" height="51" rx="0" fill="#d9e9e6" stroke="#a8b7aa"/>
<rect x="26" y="327" width="104" height="28" rx="0" fill="#eddfcf" stroke="#a8b7aa"/>
<rect x="350" y="327" width="104" height="28" rx="0" fill="#eddfcf" stroke="#a8b7aa"/>
<text x="77" y="348" font-size="18" text-anchor="middle" fill="#203c37">p⁺</text>
<text x="402" y="348" font-size="18" text-anchor="middle" fill="#203c37">p⁺</text>
<path d="M130 330H350" fill="none" stroke="#9b4c28" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="368" font-size="18" text-anchor="middle" fill="#203c37">n 型阱</text>
<text x="59" y="407" font-size="18" text-anchor="start" fill="#9b4c28">空穴净移动</text>
<path d="M190 401L389 401" fill="none" stroke="#9b4c28" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aH)"/>
<text x="59" y="436" font-size="18" text-anchor="start" fill="#203c37">常规电流</text>
<path d="M190 430L389 430" fill="none" stroke="#203c37" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aI)"/>
<text x="59" y="467" font-size="18" fill="#09677b">价带电子净转移</text>
<path d="M389 461L197 461" fill="none" stroke="#09677b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aE)"/>
</g>
</svg>
