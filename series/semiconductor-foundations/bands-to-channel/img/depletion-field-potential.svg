<svg xmlns="http://www.w3.org/2000/svg" width="560" height="845" viewBox="0 0 560 845" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">耗尽区扩展如何提高硅表面电势</title>
<desc id="desc">两幅同一 NMOS 的剖面，源、漏、体端口均接零伏。较低栅压时耗尽深度 W1，较高时 W2，固定受主离子的空间位置和均匀密度不变，空穴被排开，阴影区域内未补偿负受主增多。只沿中央栅下向深处的 y 方向作一维耗尽近似，未画源漏结边缘电场。两张曲线图用同一深度尺度：耗尽区内硅的垂直净电场指向体内并随深度线性减小，在耗尽边缘为零；相对远处中性体区的静电势由电场积分求得，在耗尽区内随深度二次下降。高栅压下耗尽宽度和表面场增强，因而表面相对于体内的静电势更高。两状态尚未进入强反型，数目和尺度仅表示相对趋势。</desc>
