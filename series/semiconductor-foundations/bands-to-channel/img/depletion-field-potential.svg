     <g id="hole"><circle r="5.5" fill="#fff8ee" stroke="#a65029" stroke-width="1.5"/><path d="M-2.5 0H2.5M0 -2.5V2.5" stroke="#a65029" stroke-width="1.25" stroke-linecap="round"/></g>
     <marker id="field" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.9" markerHeight="4.9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24724d"/></marker>
     <marker id="axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#597069"/></marker>
