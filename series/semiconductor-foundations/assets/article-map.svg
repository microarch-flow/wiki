<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">半导体与电路基础：十篇文章的知识关系</title>
  <desc id="desc">从电子与二极管，到 MOS 管，再到逻辑门。逻辑门向下分出三条线：晶体管放大、石英振荡器、PLL 倍频；锁存器与触发器；门延迟与翻转能量、本地供电与频率、建立与保持。锁存器与触发器另有虚线连到 PLL 倍频和建立与保持，表示分频、采样的相关知识。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#396b55"/>
    </marker>
    <marker id="cross-arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#637a6f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="598" height="498" rx="15" fill="#f5f6ef" stroke="#c4d0c4"/>

  <!-- Shared foundations and three conceptual branches. -->
  <g fill="none" stroke="#396b55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 60V80" marker-end="url(#arrow)"/>
    <path d="M300 126V146" marker-end="url(#arrow)"/>
    <path d="M300 192V218 M101 218H499"/>
    <path d="M101 218V246" marker-end="url(#arrow)"/>
    <path d="M300 218V246" marker-end="url(#arrow)"/>
    <path d="M499 218V246" marker-end="url(#arrow)"/>
    <circle cx="300" cy="218" r="4" fill="#396b55" stroke="none"/>
    <path d="M101 304V334" marker-end="url(#arrow)"/>
    <path d="M101 392V422" marker-end="url(#arrow)"/>
    <path d="M499 304V334" marker-end="url(#arrow)"/>
    <path d="M499 392V422" marker-end="url(#arrow)"/>
  </g>

  <!-- Frequency division and sampling connect the state branch to the other two. -->
  <g fill="none" stroke="#637a6f" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M215 275H201V451H186" marker-end="url(#cross-arrow)"/>
    <path d="M385 275H399V451H414" marker-end="url(#cross-arrow)"/>
  </g>

  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" font-weight="650">
    <g fill="#173d35" stroke="#173d35" stroke-width="1.5">
      <rect x="203" y="14" width="194" height="46" rx="9"/>
      <rect x="203" y="80" width="194" height="46" rx="9"/>
      <rect x="203" y="146" width="194" height="46" rx="9"/>
    </g>
    <g fill="#ffffff" font-size="22">
      <text x="300" y="44">1 电子与二极管</text>
      <text x="300" y="110">2 MOS 管</text>
      <text x="300" y="176">3 CMOS 逻辑门</text>
    </g>

    <g fill="#e0ebe3" stroke="#82a18e" stroke-width="1.5">
      <rect x="16" y="246" width="170" height="58" rx="9"/>
      <rect x="16" y="334" width="170" height="58" rx="9"/>
      <rect x="16" y="422" width="170" height="58" rx="9"/>
    </g>
    <rect x="215" y="246" width="170" height="58" rx="9" fill="#e8f0e5" stroke="#6d9c7c" stroke-width="1.5"/>
    <g fill="#edf1df" stroke="#93aa75" stroke-width="1.5">
      <rect x="414" y="246" width="170" height="58" rx="9"/>
      <rect x="414" y="334" width="170" height="58" rx="9"/>
      <rect x="414" y="422" width="170" height="58" rx="9"/>
    </g>

    <g fill="#173d35" font-size="21">
      <text x="101" y="282">5 小信号放大</text>
      <text x="101" y="370">6 石英振荡器</text>
      <text x="101" y="458">7 PLL 倍频</text>
      <text x="300" y="269">4 锁存器</text>
      <text x="300" y="293">与触发器</text>
      <text x="499" y="269">8 门延迟</text>
      <text x="499" y="293">与翻转能量</text>
      <text x="499" y="357">9 本地供电</text>
      <text x="499" y="381">与频率</text>
      <text x="499" y="458">10 建立与保持</text>
    </g>
  </g>
</svg>
