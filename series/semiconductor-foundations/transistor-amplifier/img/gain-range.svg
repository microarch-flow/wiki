<svg xmlns="http://www.w3.org/2000/svg" width="480" height="463" viewBox="0 0 480 463" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">电阻负载共源级的整条稳态传输曲线</title>
  <desc id="desc">在长沟道教学模型中，栅压从零升至 0.4 V，NMOS 截止，输出维持 1.2 V。随后管子进入饱和区。工作点是栅压 0.60 V、输出 0.70 V，局部切线斜率为负五。栅压超过约 0.672 V，管子进入线性区。蓝色曲线由负载电流与漏电流相等算出。</desc>
