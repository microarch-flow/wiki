<svg xmlns="http://www.w3.org/2000/svg" width="480" height="424" viewBox="0 0 480 424" role="img" aria-labelledby="title description">
  <title id="title">静止时，哪一个漏极电压能让两路电流相等？</title>
  <desc id="description">漏极电压从 0 到 1.2 V。电阻从电源送入输出节点的电流由 240 µA 线性降至零。栅压固定 0.60 V 时，理想长沟道 NMOS 的漏电流先上升，到漏压 0.20 V 后保持 100 µA。两条线在 0.70 V、100 µA 相交。</desc>
  <rect x="1" y="1" width="478" height="422" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="20" y="36" font-size="23" text-anchor="start" fill="#203c37" font-weight="700">漏极静止在哪一个电压？</text>
    <text x="20" y="65" font-size="18" text-anchor="start" fill="#526861" font-weight="400">栅压 0.60 V，电源 1.20 V，漏极电阻 5 kΩ。</text>
    <path d="M22 99H51" fill="none" stroke="#9b4c28" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="60" y="105" font-size="18" text-anchor="start" fill="#9b4c28" font-weight="600">电阻送入 Y</text>
    <path d="M239 99H269" fill="none" stroke="#09677b" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 4"/>
    <text x="279" y="105" font-size="18" text-anchor="start" fill="#09677b" font-weight="600">NMOS 从 Y 取走</text>
    <text x="20" y="144" font-size="17" text-anchor="start" fill="#526861" font-weight="400">电流（µA）</text>
    <path d="M64 159V320H448" fill="none" stroke="#526861" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M64 257.5H123" fill="none" stroke="#c9d3c7" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M128 257.5V320 M288 257.5V320" fill="none" stroke="#c9d3c7" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M64 170L448 320" fill="none" stroke="#9b4c28" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M64 320Q96 257.5 128 257.5H448" fill="none" stroke="#09677b" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 4"/>
    <circle cx="288" cy="257.5" r="6" fill="#203c37"/>
    <path d="M293 252L309 223" fill="none" stroke="#203c37" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="310" y="216" font-size="19" text-anchor="start" fill="#203c37" font-weight="650">工作点</text>
    <text x="54" y="176" font-size="17" text-anchor="end" fill="#526861" font-weight="400">240</text>
    <text x="54" y="263" font-size="17" text-anchor="end" fill="#526861" font-weight="400">100</text>
    <text x="54" y="324" font-size="17" text-anchor="end" fill="#526861" font-weight="400">0</text>
    <text x="64" y="346" font-size="17" text-anchor="middle" fill="#526861" font-weight="400">0</text>
    <text x="128" y="346" font-size="17" text-anchor="middle" fill="#526861" font-weight="400">0.20</text>
    <text x="288" y="346" font-size="18" text-anchor="middle" fill="#203c37" font-weight="650">0.70</text>
    <text x="448" y="346" font-size="17" text-anchor="middle" fill="#526861" font-weight="400">1.20</text>
    <text x="447" y="376" font-size="17" text-anchor="end" fill="#526861" font-weight="400">漏极电压（V）</text>
    <path d="M20 386H460" fill="none" stroke="#c9d3c7" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="20" y="413" font-size="18" text-anchor="start" fill="#203c37" font-weight="600">Y = 0.70 V 时，两路电流恰好都是 100 µA。</text>
  </g>
</svg>
