    <circle cx="147.38324625039508" cy="361.0" r="4.7" fill="#09677b"/>
    <text x="165" y="348" font-size="17" text-anchor="start" fill="#09677b" font-weight="650">降到半程</text>
    <text x="85" y="429" font-size="16" text-anchor="middle" fill="#526861" font-weight="400">0</text>
    <text x="147.38" y="429" font-size="17" text-anchor="middle" fill="#09677b" font-weight="650">34.7</text>
    <text x="265" y="429" font-size="16" text-anchor="middle" fill="#526861" font-weight="400">100</text>
    <text x="445" y="429" font-size="16" text-anchor="middle" fill="#526861" font-weight="400">200</text>
    <text x="448" y="456" font-size="16" text-anchor="end" fill="#526861" font-weight="400">时间（ps）</text>
    <path d="M20 467H460" fill="none" stroke="#c9d3c7" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="20" y="494" font-size="18" text-anchor="start" fill="#203c37" font-weight="600">最终电阻供电增至约 105 µA，电容停止放电。</text>
  </g>
</svg>
