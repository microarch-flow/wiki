<svg xmlns="http://www.w3.org/2000/svg" width="480" height="508" viewBox="0 0 480 508" role="img" aria-labelledby="title description">
  <title id="title">刚抬高栅压，多出的电流先由谁提供？</title>
  <desc id="description">栅压从 0.600 V 跳到 0.605 V。输出电容 10 fF 在最初一瞬间保持 0.700 V。电阻仍向节点送入 100 µA，NMOS 抽走约 105 µA，电容放电补足约 5 µA。随后输出电压向约 0.675 V 下降，一半变化用时约 34.7 ps。最终电阻供电增加到与 NMOS 漏电流相等。</desc>
  <rect x="1" y="1" width="478" height="506" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="20" y="36" font-size="23" text-anchor="start" fill="#203c37" font-weight="700">栅压刚升高，多出的电流从哪来？</text>
    <text x="20" y="65" font-size="18" text-anchor="start" fill="#526861" font-weight="400">栅压从 0.600 V 跳到 0.605 V。</text>
    <text x="20" y="100" font-size="20" text-anchor="start" fill="#203c37" font-weight="650">刚跳变时</text>
    <text x="20" y="131" font-size="17" text-anchor="start" fill="#526861" font-weight="400">电源经电阻</text>
    <text x="20" y="160" font-size="20" text-anchor="start" fill="#9b4c28" font-weight="650">100 µA</text>
    <path d="M25 183H154" fill="none" stroke="#9b4c28" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="154,183 144,178 144,188" fill="#9b4c28"/>
    <circle cx="161" cy="183" r="5.3" fill="#203c37"/>
    <text x="161" y="165" font-size="20" text-anchor="middle" fill="#203c37" font-weight="650">Y</text>
    <path d="M166 183H248" fill="none" stroke="#09677b" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="166,183 176,178 176,188" fill="#09677b"/>
    <text x="262" y="160" font-size="17" text-anchor="start" fill="#526861" font-weight="400">电容放电</text>
    <text x="262" y="188" font-size="20" text-anchor="start" fill="#09677b" font-weight="650">约 5 µA</text>
    <path d="M161 189V232" fill="none" stroke="#203c37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="161,234 156,224 166,224" fill="#203c37"/>
    <text x="175" y="218" font-size="19" text-anchor="start" fill="#203c37" font-weight="650">约 105 µA</text>
    <text x="161" y="258" font-size="18" text-anchor="middle" fill="#203c37" font-weight="550">流入 NMOS</text>
    <path d="M20 274H460" fill="none" stroke="#c9d3c7" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="20" y="304" font-size="20" text-anchor="start" fill="#203c37" font-weight="650">接着读输出电压（V）</text>
    <path d="M85 320V403H445" fill="none" stroke="#526861" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M85 394H445" fill="none" stroke="#c9d3c7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/>
    <text x="77" y="334" font-size="17" text-anchor="end" fill="#526861" font-weight="400">0.700</text>
    <text x="77" y="399" font-size="16" text-anchor="end" fill="#526861" font-weight="400">≈0.675</text>
