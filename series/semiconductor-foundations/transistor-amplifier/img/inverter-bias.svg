<svg xmlns="http://www.w3.org/2000/svg" width="480" height="584" viewBox="0 0 480 584" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">反馈电阻怎样给未缓冲 CMOS 反相器设定直流工作点</title>
  <desc id="desc">PMOS 在上，NMOS 在下，两管的公共栅节点 G 与公共漏节点 Y 通过大电阻 Rf 相连。直流栅电流近似为零、输入无其他直流驱动时，电阻压降近似为零。反相器的传输曲线与 Y 和 G 电压相等的虚线相交，交点给出偏置。曲线和交点只示意 CMOS 反相器的典型形状。</desc>
