<svg xmlns="http://www.w3.org/2000/svg" width="480" height="403" viewBox="0 0 480 403" role="img" aria-labelledby="title description">
  <title id="title">来自同一扰动的两条振幅包络</title>
  <desc id="description">横轴是示意时间，纵轴是石英振幅相对有源回路稳态振幅的比例。无补能时振幅衰减。有源回路中，选中模式在小振幅时每周期从放大级得到的能量大于损耗，振幅逐渐增加。限幅后补能与损耗平衡。曲线未标定真实器件的起振时间。</desc>
  <rect x="1" y="1" width="478" height="401" rx="15" fill="#f7f6ef" stroke="#c4d0c4"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="20" y="35" font-size="23" fill="#203c37" font-weight="700" text-anchor="start">同一微小扰动，振幅会怎样变化？</text>
    <text x="20" y="64" font-size="18" fill="#526861" font-weight="400" text-anchor="start">每条曲线都沿着一串振动峰值画出。</text>
    <path d="M22 92H53" stroke="#09677b" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="98" font-size="18" fill="#09677b" font-weight="600" text-anchor="start">接入有源反馈</text>
    <path d="M254 92H282" stroke="#9b4c28" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
    <text x="293" y="98" font-size="18" fill="#9b4c28" font-weight="600" text-anchor="start">无外部补能</text>
    <text x="20" y="143" font-size="18" fill="#526861" font-weight="400" text-anchor="start">振幅（以稳态振幅为 1）</text>
    <path d="M60 160V273H444" stroke="#526861" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 173H444" stroke="#c4d0c4" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
    <text x="49" y="179" font-size="17" fill="#526861" font-weight="400" text-anchor="end">1</text>
    <text x="49" y="279" font-size="17" fill="#526861" font-weight="400" text-anchor="end">0</text>
