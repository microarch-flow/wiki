    <path d="M65 257L79 225" stroke="#203c37" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="218" font-size="17" fill="#203c37" font-weight="550" text-anchor="start">相同初值</text>
    <text x="446" y="301" font-size="17" fill="#526861" font-weight="400" text-anchor="end">时间（示意）</text>
    <path d="M20 316H460" stroke="#c4d0c4" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="348" font-size="19" fill="#203c37" font-weight="600" text-anchor="start">起振时，每周期补入的能量大于损耗。</text>
    <text x="20" y="380" font-size="19" fill="#203c37" font-weight="600" text-anchor="start">稳幅后，每周期补入的能量等于损耗。</text>
