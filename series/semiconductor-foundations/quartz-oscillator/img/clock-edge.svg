<svg xmlns="http://www.w3.org/2000/svg" width="480" height="465" viewBox="0 0 480 465" role="img" aria-labelledby="title description">
  <title id="title">非反相缓冲器怎样将 25 MHz 模拟振荡整形成时钟</title>
  <desc id="description">上下波形共用时间轴。模拟输入以 25 MHz 振荡，棕色虚线为门限。两个相邻向上交越点相隔 40 ns。非反相缓冲器经过示意的固定延迟输出高电平，两个相邻输出上升沿仍相隔 40 ns。图中交越到输出的距离只用于表示延迟。</desc>
