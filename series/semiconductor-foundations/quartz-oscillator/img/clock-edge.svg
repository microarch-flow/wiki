    <text x="20" y="35" font-size="23" fill="#203c37" font-weight="700" text-anchor="start">模拟振动怎样变成数字时钟边沿？</text>
    <text x="20" y="64" font-size="18" fill="#526861" font-weight="400" text-anchor="start">取非反相缓冲器，两排波形共用时间轴。</text>
    <text x="20" y="96" font-size="20" fill="#203c37" font-weight="650" text-anchor="start">25 MHz 模拟输入</text>
    <text x="176.5" y="124" font-size="18" fill="#09677b" font-weight="600" text-anchor="middle">40 ns</text>
