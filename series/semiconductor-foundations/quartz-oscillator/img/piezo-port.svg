<svg xmlns="http://www.w3.org/2000/svg" width="480" height="549" viewBox="0 0 480 549" role="img" aria-labelledby="title desc">
  <title id="title">从同一对电极看压电振动</title>
  <desc id="desc">一块石英的上下表面分别有电极 a 与 b，两面沿相反方向横移。加在这对端子上的电压能够激励剪切振动，剪切形变也在同一对电极上引起电荷变化。等效电路由 a 到 b 有两条并联路径。一条是静态电容 C0，另一条是串联的运动电阻 Rm、运动电感 Lm、运动电容 Cm，分别对应损耗、惯性和弹性储能。</desc>
  <rect x="1" y="1" width="478" height="547" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="20" y="36" font-size="23" text-anchor="start" fill="#203c37" font-weight="700">从同一对电极，怎样看到机械振动？</text>
    <text x="20" y="64" font-size="18" text-anchor="start" fill="#50675e" font-weight="450">橙色箭头标出此刻两表面的位移方向。</text>
    <path d="M87 131H204C204 154 177 178 177 200H60C60 178 87 154 87 131Z" fill="#e3e9dc" stroke="#82998c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M87 130H204 M60 201H177" fill="none" stroke="#09677b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 99H144V128 M36 228H118V204" fill="none" stroke="#203c37" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36.00" cy="99.00" r="4.1" fill="#f7f6ef" stroke="#203c37" stroke-width="1.5"/>
    <circle cx="36.00" cy="228.00" r="4.1" fill="#f7f6ef" stroke="#203c37" stroke-width="1.5"/>
    <text x="18" y="105" font-size="18" text-anchor="start" fill="#203c37" font-weight="600">a</text>
    <text x="18" y="234" font-size="18" text-anchor="start" fill="#203c37" font-weight="600">b</text>
    <text x="131" y="171" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">石英</text>
    <path d="M164.00 112h34.00m-6 -4l6 4l-6 4" fill="none" stroke="#994725" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104.00 218h-34.00m6 -4l-6 4l6 4" fill="none" stroke="#994725" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="230" y="112" font-size="19" text-anchor="start" fill="#203c37" font-weight="650">电压激励形变</text>
    <text x="230" y="138" font-size="17" text-anchor="start" fill="#50675e" font-weight="450">在 a、b 间加交流电压，</text>
    <text x="230" y="162" font-size="17" text-anchor="start" fill="#50675e" font-weight="450">晶格产生交变剪切形变。</text>
    <text x="230" y="198" font-size="19" text-anchor="start" fill="#203c37" font-weight="650">形变改变电荷</text>
    <text x="230" y="224" font-size="17" text-anchor="start" fill="#50675e" font-weight="450">晶格振动时，同一对电极</text>
    <text x="230" y="248" font-size="17" text-anchor="start" fill="#50675e" font-weight="450">上的电荷也随之变化。</text>
    <path d="M20 264H460" fill="none" stroke="#c9d3c7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="294" font-size="20" text-anchor="start" fill="#203c37" font-weight="680">从 a、b 看进去的等效电路</text>
    <path d="M47 381H79V342H218 M238 342H403V381H434" fill="none" stroke="#203c37" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M221 328V356 M235 328V356" fill="none" stroke="#09677b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M218 342H221 M235 342H238" fill="none" stroke="#203c37" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="322" font-size="19" text-anchor="middle" fill="#09677b" font-weight="680">C₀</text>
    <path d="M79 381V415H109 M155 415H195 M251 415H319 M336 415H403V381" fill="none" stroke="#203c37" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M109 408H155V422H109Z" fill="#f7f6ef" stroke="#994725" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M195 415a7 9 0 0 1 14 0a7 9 0 0 1 14 0a7 9 0 0 1 14 0a7 9 0 0 1 14 0" fill="none" stroke="#994725" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M319 403V427 M336 403V427" fill="none" stroke="#994725" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="395" font-size="19" text-anchor="middle" fill="#994725" font-weight="650">Rₘ</text>
    <text x="223" y="395" font-size="19" text-anchor="middle" fill="#994725" font-weight="650">Lₘ</text>
    <text x="327" y="395" font-size="19" text-anchor="middle" fill="#994725" font-weight="650">Cₘ</text>
    <circle cx="47.00" cy="381.00" r="4.1" fill="#f7f6ef" stroke="#203c37" stroke-width="1.5"/>
    <circle cx="434.00" cy="381.00" r="4.1" fill="#f7f6ef" stroke="#203c37" stroke-width="1.5"/>
    <circle cx="79.00" cy="381.00" r="3.0" fill="#203c37" stroke="#203c37" stroke-width="1.5"/>
    <circle cx="403.00" cy="381.00" r="3.0" fill="#203c37" stroke="#203c37" stroke-width="1.5"/>
    <text x="29" y="387" font-size="19" text-anchor="start" fill="#203c37" font-weight="620">a</text>
    <text x="444" y="387" font-size="19" text-anchor="start" fill="#203c37" font-weight="620">b</text>
    <text x="20" y="464" font-size="18" text-anchor="start" fill="#09677b" font-weight="510">C₀ 表示两电极间的静态电容。</text>
    <text x="20" y="494" font-size="18" text-anchor="start" fill="#203c37" font-weight="510">运动支路对应选定的机械模式。</text>
    <text x="20" y="523" font-size="18" text-anchor="start" fill="#994725" font-weight="510">Rₘ 对应损耗，Lₘ 对应惯性，Cₘ 对应弹性。</text>
  </g>
</svg>
