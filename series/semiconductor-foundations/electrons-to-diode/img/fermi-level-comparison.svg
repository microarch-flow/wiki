<svg xmlns="http://www.w3.org/2000/svg" width="540" height="281" viewBox="0 0 540 281" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">用费米能级比较尚未接触的 P 型硅与 N 型硅</title>
  <desc id="desc">两幅示意图分别把独立硅块自身的价带顶对齐。P 型硅的费米能级在禁带中更靠近价带顶，空穴较多；N 型硅的费米能级更靠近导带底，导带电子较多。图中只表示相对位置，费米能级虚线不是允许的电子态，也不是实际接触后的能带分布。</desc>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#476c58"/></marker>
  </defs>
  <rect x="1" y="1" width="538" height="279" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui,'Noto Sans CJK SC',sans-serif" fill="#203c37" font-size="16">
    <text x="270" y="26" text-anchor="middle" font-size="20" font-weight="650">还没有接触的两块硅</text>
    <path d="M34 203V57" stroke="#476c58" stroke-width="1.5" marker-end="url(#axis)"/><text x="34" y="48" text-anchor="middle" font-size="14">能量</text>
    <g>
      <text x="163" y="53" text-anchor="middle" font-size="17" font-weight="650">P 型硅</text>
      <rect x="65" y="65" width="196" height="32" rx="3" fill="#e2eeee" stroke="#96b5b6"/>
      <text x="163" y="85" text-anchor="middle" fill="#285c72">导带</text>
      <rect x="65" y="168" width="196" height="32" rx="3" fill="#efdfcf" stroke="#c6a58e"/>
      <text x="163" y="188" text-anchor="middle" fill="#74402d">价带</text>
      <path d="M65 152 H261" stroke="#9b4c28" stroke-width="2.4" stroke-dasharray="7 4"/>
      <text x="163" y="144" text-anchor="middle" font-size="15" fill="#9b4c28">费米能级 E<tspan baseline-shift="sub" font-size="11">F</tspan></text>
      <text x="163" y="223" text-anchor="middle" font-size="16" font-weight="600">价带空穴较多</text>
    </g>
    <g>
      <text x="394" y="53" text-anchor="middle" font-size="17" font-weight="650">N 型硅</text>
      <rect x="296" y="65" width="196" height="32" rx="3" fill="#e2eeee" stroke="#96b5b6"/>
      <text x="394" y="85" text-anchor="middle" fill="#285c72">导带</text>
      <rect x="296" y="168" width="196" height="32" rx="3" fill="#efdfcf" stroke="#c6a58e"/>
      <text x="394" y="188" text-anchor="middle" fill="#74402d">价带</text>
      <path d="M296 113 H492" stroke="#9b4c28" stroke-width="2.4" stroke-dasharray="7 4"/>
      <text x="394" y="135" text-anchor="middle" font-size="15" fill="#9b4c28">费米能级 E<tspan baseline-shift="sub" font-size="11">F</tspan></text>
      <text x="394" y="223" text-anchor="middle" font-size="16" font-weight="600">导带电子较多</text>
    </g>
    <text x="270" y="251" text-anchor="middle" fill="#597069" font-size="14">各自的带边对齐，仅比较相对位置（示意，非定量）。</text>
    <text x="270" y="269" text-anchor="middle" fill="#597069" font-size="14">虚线是统计参数，不是禁带中可供电子占据的状态。</text>
  </g>
</svg>
