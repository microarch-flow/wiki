<svg xmlns="http://www.w3.org/2000/svg" width="460" height="299" viewBox="0 0 460 299" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">状态二：电源右端为正</title><desc id="desc">电源右端为正，左端为负。绿色路径由正输入端经上方二极管到达用电器上端，从上向下流过用电器，再经另一侧下方二极管返回负输入端。灰色的另两只二极管反向截止。</desc>
