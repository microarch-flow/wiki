<svg xmlns="http://www.w3.org/2000/svg" width="560" height="839" viewBox="0 0 560 839" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">反向漏电：两侧热激发怎样供应载流子</title><desc id="desc">P 区在左接负极，N 区在右接正极；上图 P 区热激发产生一对电子与空穴，若导带电子到达耗尽区，它被扫向 N 区并由正端收集，负端补充价带电子；下图 N 区热激发产生一对电子与空穴，若空穴到达耗尽区，它被扫向 P 区，等效价带电子向右净移动，N 端收集导带电子。两条路径分别展示一次产生的电子空穴对被收集的情形，并非每对均被收集。常规电流向左。室温也有热激发。</desc><defs>
      <g id="ce"><circle r="9" fill="#09677b"/><path d="M-4 0H4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="ve"><circle r="9" fill="#706394"/><path d="M-4 0H4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="h"><circle r="9" fill="#fff8ee" stroke="#a65029" stroke-width="2"/><path d="M-4 0H4M0-4V4" stroke="#a65029" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="ce0"><circle r="9" fill="#f7f6ef" stroke="#6f8985" stroke-width="1.5" stroke-dasharray="2.7 2.1"/></g>
      <marker id="c-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#09677b"/></marker>
      <marker id="v-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#706394"/></marker>
      <marker id="t-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#203c37"/></marker>
    </defs>
<rect x="1" y="1" width="558" height="837" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="280" y="28" font-size="21" text-anchor="middle" fill="#203c37" font-weight="650">反向漏电：两侧热激发怎样供应载流子</text>
<use href="#ce" x="28" y="54"/>
<text x="45" y="60" font-size="16" text-anchor="start" fill="#203c37" font-weight="400">导带电子</text>
<use href="#ve" x="205" y="54"/>
<text x="222" y="60" font-size="16" text-anchor="start" fill="#203c37" font-weight="400">价带电子</text>
<use href="#h" x="391" y="54"/>
<text x="408" y="60" font-size="16" text-anchor="start" fill="#203c37" font-weight="400">价带空穴</text>
<g transform="translate(0 75)"><text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="650">① P 区热激发：导带电子跨结</text><text x="38" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">负极</text><text x="38" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">−</text><text x="522" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">正极</text><text x="522" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">+</text><text x="183" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">P 区</text><text x="377" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">N 区</text><rect x="66" y="77" width="214" height="123" rx="0" fill="#f3e9d9" stroke="none"/><rect x="280" y="77" width="214" height="123" rx="0" fill="#e0e9ec" stroke="none"/><rect x="229" y="77" width="51" height="123" rx="0" fill="#e5c9ad" stroke="none"/><rect x="280" y="77" width="51" height="123" rx="0" fill="#c2d8c8" stroke="none"/><rect x="66" y="77" width="428" height="123" rx="0" fill="none" stroke="#85948c"/><rect x="46" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><rect x="494" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><path d="M280 77V200" stroke="#5d776c" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M66 139H494" stroke="#8f9c96" opacity=".55"/><text x="82" y="95" font-size="15" text-anchor="start" fill="#597069" font-weight="650">导带</text><text x="82" y="158" font-size="15" text-anchor="start" fill="#597069" font-weight="650">价带</text><path d="M35 169L176 169" fill="none" stroke="#706394" stroke-width="2.6" marker-end="url(#v-arrow)"/><use href="#h" x="190" y="169"/><path d="M190 157L190 124" fill="none" stroke="#203c37" stroke-width="2.3" marker-end="url(#t-arrow)" stroke-dasharray="4 3"/><use href="#ce" x="190" y="112"/><path d="M204 112L525 112" fill="none" stroke="#09677b" stroke-width="2.6" marker-end="url(#c-arrow)"/><use href="#ve" x="112.5" y="169"/><text x="357.5" y="102" font-size="15" text-anchor="middle" fill="#09677b" font-weight="650">导带电子净向右</text><text x="201" y="136" font-size="15" text-anchor="start" fill="#203c37" font-weight="650">热激发</text><text x="201" y="153" font-size="14" text-anchor="start" fill="#597069" font-weight="400">获得能量</text><text x="122.5" y="194" font-size="15" text-anchor="middle" fill="#706394" font-weight="650">价带电子净向右</text><text x="280" y="224" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">若新产生的导带电子到达结区，就会被扫向 N。</text><text x="280" y="247" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">P 区留下的价带空态由负极补来的电子补偿。</text></g>
<path d="M20 336H540" stroke="#c9d3c7"/>
<g transform="translate(0 348)"><text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="650">② N 区热激发：价带电子净跨结</text><text x="38" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">负极</text><text x="38" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">−</text><text x="522" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">正极</text><text x="522" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">+</text><text x="183" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">P 区</text><text x="377" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">N 区</text><rect x="66" y="77" width="214" height="123" rx="0" fill="#f3e9d9" stroke="none"/><rect x="280" y="77" width="214" height="123" rx="0" fill="#e0e9ec" stroke="none"/><rect x="229" y="77" width="51" height="123" rx="0" fill="#e5c9ad" stroke="none"/><rect x="280" y="77" width="51" height="123" rx="0" fill="#c2d8c8" stroke="none"/><rect x="66" y="77" width="428" height="123" rx="0" fill="none" stroke="#85948c"/><rect x="46" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><rect x="494" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><path d="M280 77V200" stroke="#5d776c" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M66 139H494" stroke="#8f9c96" opacity=".55"/><text x="82" y="95" font-size="15" text-anchor="start" fill="#597069" font-weight="650">导带</text><text x="82" y="158" font-size="15" text-anchor="start" fill="#597069" font-weight="650">价带</text><path d="M35 169L356 169" fill="none" stroke="#706394" stroke-width="2.6" marker-end="url(#v-arrow)"/><use href="#h" x="370" y="169"/><path d="M370 157L370 124" fill="none" stroke="#203c37" stroke-width="2.3" marker-end="url(#t-arrow)" stroke-dasharray="4 3"/><use href="#ce" x="370" y="112"/><path d="M384 112L525 112" fill="none" stroke="#09677b" stroke-width="2.6" marker-end="url(#c-arrow)"/><use href="#ve" x="202.5" y="169"/><text x="447.5" y="102" font-size="15" text-anchor="middle" fill="#09677b" font-weight="650">导带电子净向右</text><text x="381" y="136" font-size="15" text-anchor="start" fill="#203c37" font-weight="650">热激发</text><text x="381" y="153" font-size="14" text-anchor="start" fill="#597069" font-weight="400">获得能量</text><text x="212.5" y="194" font-size="15" text-anchor="middle" fill="#706394" font-weight="650">价带电子净向右</text><text x="280" y="224" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">若产生的空穴到达结区，就会被扫向 P。</text><text x="280" y="247" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">等效于价带电子从 P 区净向 N 区输运。</text></g>
<path d="M20 610H540" stroke="#c9d3c7"/>
<rect x="20" y="621" width="520" height="66" rx="8" fill="#f0eee4" stroke="#c9d3c7"/>
<text x="34" y="650" font-size="17" text-anchor="start" fill="#203c37" font-weight="650">热激发</text>
<use href="#ce0" x="126" y="645"/>
<text x="145" y="651" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">+</text>
<use href="#ve" x="167" y="645"/>
<path d="M185 645L240 645" fill="none" stroke="#203c37" stroke-width="2" marker-end="url(#t-arrow)"/>
<use href="#ce" x="265" y="645"/>
<text x="286" y="651" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">+</text>
<use href="#h" x="309" y="645"/>
<text x="332" y="651" font-size="16" text-anchor="start" fill="#597069" font-weight="400">产生电子与空穴</text>
<text x="280" y="677" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">价带电子获得能量跃迁到导带</text>
<text x="20" y="711" font-size="17" text-anchor="start" fill="#203c37" font-weight="650">常规电流</text>
<path d="M515 704L141 704" fill="none" stroke="#203c37" stroke-width="2.7" marker-end="url(#t-arrow)"/>
<path d="M20 722H540" stroke="#c9d3c7"/>
<text x="280" y="745" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">室温也有热激发；加热通常会增加载流子供应。</text>
<text x="280" y="767" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">并非每次产生的少数载流子都能到达结区。</text>
<text x="280" y="789" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">箭头表示净输运；每幅图示意一对载流子被收集。</text>
<text x="280" y="811" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">每收集一对，在外电路只记一次元电荷 q。</text>
</g>
</svg>
