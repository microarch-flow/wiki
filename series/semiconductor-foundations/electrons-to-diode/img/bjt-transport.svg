<svg xmlns="http://www.w3.org/2000/svg" width="560" height="434" viewBox="0 0 560 434" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id='title'>NPN 三极管：正偏注入、薄基区扩散和反偏收集</title><desc id='desc'>在正向放大区，左侧 N 型发射区通过正偏发射结向 P 型基区注入导带电子；少部分电子在薄基区与空穴复合，多数扩散到集电结并被其电场收集。基极补充空穴，集电极常规电流从外部进入集电端。示意非实际电子个数及几何尺寸。</desc>
