<svg xmlns="http://www.w3.org/2000/svg" width="460" height="270" viewBox="0 0 460 270" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">填满的能带中，相反速度的电子态贡献相抵</title>
  <desc id="desc">选取一个满带中的三对代表性电子态。每对中两态的速度大小相同、方向相反，全部被占据时其电流贡献两两抵消。横向排列用于比较相反的速度方向，不表示电子的实际位置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#706394"/></marker>
    <g id="electron"><circle r="9" fill="#706394"/><path d="M-4 0H4" stroke="#fff" stroke-width="1.8"/></g>
  </defs>
  <rect x="1" y="1" width="458" height="268" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui,'Noto Sans CJK SC',sans-serif" fill="#203c37">
    <text x="230" y="30" font-size="22" font-weight="650" text-anchor="middle">满带中的电子态</text>
    <text x="128" y="58" font-size="17" text-anchor="middle">向左运动的态</text>
    <text x="332" y="58" font-size="17" text-anchor="middle">向右运动的态</text>
    <rect x="20" y="69" width="420" height="120" rx="7" fill="#f0f2e9" stroke="#c9d3c7"/>
    <g stroke="#bdc8bd" stroke-width="1.25" stroke-dasharray="3 4"><path d="M150 89H310M150 128H310M150 167H310"/></g>
    <g stroke="#706394" stroke-width="2.3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M117 89H82"/><path d="M343 89H378"/>
      <path d="M117 128H67"/><path d="M343 128H393"/>
      <path d="M117 167H52"/><path d="M343 167H408"/>
    </g>
    <use href="#electron" x="132" y="89"/><use href="#electron" x="328" y="89"/>
    <use href="#electron" x="132" y="128"/><use href="#electron" x="328" y="128"/>
    <use href="#electron" x="132" y="167"/><use href="#electron" x="328" y="167"/>
    <text x="230" y="216" font-size="20" text-anchor="middle" font-weight="650">每对贡献相抵 → 净电流为零</text>
    <text x="230" y="238" font-size="15" fill="#597069" text-anchor="middle">每行两态速度大小相同、方向相反</text>
    <text x="230" y="257" font-size="14" fill="#597069" text-anchor="middle">横向排列不表示电子的实际位置</text>
  </g>
</svg>
