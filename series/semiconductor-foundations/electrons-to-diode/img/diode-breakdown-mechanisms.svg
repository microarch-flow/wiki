<circle cx="206" cy="191" r="9" fill="#706394" stroke="#706394" stroke-width="1.7"/>
<path d="M202 191L210 191" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="361" cy="142" r="9" fill="#09677b" stroke="#09677b" stroke-width="1.7"/>
<path d="M357 142L365 142" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="475" cy="142" r="9" fill="#09677b" stroke="#09677b" stroke-width="1.7"/>
<path d="M471 142L479 142" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="361" cy="191" r="9" fill="#706394" stroke="#706394" stroke-width="1.7"/>
<path d="M357 191L365 191" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="475" cy="191" r="9" fill="#fff8ee" stroke="#a65029" stroke-width="1.7"/>
<path d="M471 191L479 191" fill="none" stroke="#a65029" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M475 187L475 195" fill="none" stroke="#a65029" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M126 142L185 142" fill="none" stroke="#09677b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M205 177L205 156" fill="none" stroke="#a65029" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange)"/>
<path d="M275 168L309 168" fill="none" stroke="#203c37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<text x="171" y="242" font-size="17" fill="#09677b" text-anchor="middle">1 个导带电子</text>
<text x="417" y="242" font-size="16" fill="#09677b" text-anchor="middle" font-weight="650">2 个导带电子 + 1 个空穴</text>
<text x="280" y="268" font-size="16" fill="#203c37" text-anchor="middle">新载流子继续加速并电离，反向电流迅速增大。</text>
<path d="M20 284L540 284" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="315" font-size="22" fill="#203c37" text-anchor="start" font-weight="650">② 齐纳击穿：带间隧穿</text>
<path d="M56 501L56 350" fill="none" stroke="#597069" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<path d="M56 501L531 501" fill="none" stroke="#597069" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
<text x="20" y="342" font-size="14" fill="#203c37" text-anchor="start">能量</text>
<text x="503" y="519" font-size="14" fill="#203c37" text-anchor="start">位置 x</text>
<text x="130" y="343" font-size="16" fill="#203c37" text-anchor="middle" font-weight="650">P 区</text>
<text x="447" y="343" font-size="16" fill="#203c37" text-anchor="middle" font-weight="650">N 区</text>
<path d="M67 351H165L380 421H531" fill="none" stroke="#09677b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M67 421H165L380 491H531" fill="none" stroke="#706394" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="71" y="373" font-size="15" fill="#09677b" text-anchor="start">导带底</text>
<text x="71" y="445" font-size="15" fill="#706394" text-anchor="start">价带顶</text>
<text x="531" y="385" font-size="15" fill="#597069" text-anchor="end">带边弯曲</text>
<path d="M275 350L275 500" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<circle cx="152" cy="421" r="9" fill="#706394" stroke="#706394" stroke-width="1.7"/>
<path d="M148 421L156 421" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="402" cy="421" r="9" fill="#f7f6ef" stroke="#6f8985" stroke-width="1.5" stroke-dasharray="2.7 2.1"/>
<path d="M165 421L390 421" fill="none" stroke="#706394" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#purple)"/>
<text x="278" y="410" font-size="15" fill="#706394" text-anchor="middle" font-weight="650">隧穿 →</text>
<circle cx="106" cy="550" r="9" fill="#fff8ee" stroke="#a65029" stroke-width="1.7"/>
<path d="M102 550L110 550" fill="none" stroke="#a65029" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M106 546L106 554" fill="none" stroke="#a65029" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="555" font-size="16" fill="#203c37" text-anchor="start">P 区留下空穴</text>
<circle cx="331" cy="550" r="9" fill="#09677b" stroke="#09677b" stroke-width="1.7"/>
<path d="M327 550L335 550" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="345" y="555" font-size="16" fill="#203c37" text-anchor="start">N 区获得电子</text>
<text x="280" y="583" font-size="14" fill="#597069" text-anchor="middle">上图只做状态记账；下图横轴为位置、纵轴为能量。</text>
<text x="280" y="603" font-size="14" fill="#597069" text-anchor="middle">带边与距离均为定性示意。</text>
</g></svg>
