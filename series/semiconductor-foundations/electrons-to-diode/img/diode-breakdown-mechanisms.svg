<svg xmlns="http://www.w3.org/2000/svg" width="560" height="612" viewBox="0 0 560 612" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id='title'>反向击穿的两种载流子产生机制</title><desc id='desc'>上半部分：碰撞电离前一个导带电子、一个价带电子，碰撞电离后两个导带电子和一个价带空穴；下半部分能量和空间示意，P 侧价带占据态到 N 侧导带空态有隧穿概率，留下空穴并形成导带电子。硅的实际间接带隙跃迁可涉及声子。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#09677b"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#706394"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#a65029"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#2f6f62"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#203c37"/></marker>
</defs>
<rect x="1" y="1" width="558" height="610" rx="14" fill="#f7f6ef" stroke="#c9d3c7" opacity="1"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#203c37">
<circle cx="26" cy="27" r="8" fill="#09677b" stroke="#09677b" stroke-width="1.7"/>
<path d="M22 27L30 27" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38" y="32" font-size="15" fill="#203c37" text-anchor="start">导带电子</text>
<circle cx="156" cy="27" r="8" fill="#706394" stroke="#706394" stroke-width="1.7"/>
<path d="M152 27L160 27" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="168" y="32" font-size="15" fill="#203c37" text-anchor="start">价带电子</text>
<circle cx="288" cy="27" r="8" fill="#fff8ee" stroke="#a65029" stroke-width="1.7"/>
<path d="M284 27L292 27" fill="none" stroke="#a65029" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M288 23L288 31" fill="none" stroke="#a65029" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="32" font-size="15" fill="#203c37" text-anchor="start">价带空穴</text>
<circle cx="416" cy="27" r="8" fill="#f7f6ef" stroke="#6f8985" stroke-width="1.5" stroke-dasharray="2.7 2.1"/>
<text x="428" y="32" font-size="15" fill="#203c37" text-anchor="start">导带空态</text>
<path d="M20 45L540 45" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="76" font-size="22" fill="#203c37" text-anchor="start" font-weight="650">① 雪崩倍增：碰撞激发出一对载流子</text>
<text x="171" y="105" font-size="17" fill="#203c37" text-anchor="middle" font-weight="650">碰撞前</text>
<text x="417" y="105" font-size="17" fill="#203c37" text-anchor="middle" font-weight="650">碰撞后</text>
<rect x="72" y="117" width="198" height="100" rx="4" fill="#e0e9ec" stroke="#c9d3c7" opacity="1"/>
<path d="M72 166L270 166" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="315" y="117" width="218" height="100" rx="4" fill="#e0e9ec" stroke="#c9d3c7" opacity="1"/>
<path d="M315 166L533 166" fill="none" stroke="#c9d3c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="145" font-size="17" fill="#203c37" text-anchor="start">导带</text>
<text x="20" y="195" font-size="17" fill="#203c37" text-anchor="start">价带</text>
<circle cx="112" cy="142" r="9" fill="#09677b" stroke="#09677b" stroke-width="1.7"/>
<path d="M108 142L116 142" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
