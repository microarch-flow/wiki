<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">在同一段时间内，数穿过截面的电子</title>
  <desc id="desc">虚线表示观察截面。第一种情况向右穿过四个、向左穿过四个，净电流为零。第二种情况向右穿过六个、向左穿过两个，相当于四个电子净向右穿过，约定的电流方向向左。箭头表示电子穿过截面的方向，数字表示同一段时间内的计数。</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#09677b"/></marker>
    <marker id="current-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#9b4c28"/></marker>
  </defs>
  <rect x="1" y="1" width="458" height="328" rx="14" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui,'Noto Sans CJK SC',sans-serif" font-size="18" fill="#203c37">
    <text x="20" y="28" font-size="20" font-weight="650">同一段时间，数穿过截面的电子</text>
    <text x="230" y="49" text-anchor="middle" font-size="16" fill="#597069">观察截面（虚线）</text>
    <rect x="15" y="57" width="430" height="121" rx="7" fill="#edf2e9" stroke="#c9d3c7"/>
    <text x="28" y="78" font-size="17" font-weight="600">① 双向穿过的数量相同</text>
    <path d="M230 84V149" stroke="#84988c" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="83" y="105" text-anchor="end" fill="#09677b">4 个</text>
    <text x="377" y="134" fill="#09677b">4 个</text>
    <g stroke="#09677b" stroke-width="3" fill="none" marker-end="url(#electron-arrow)"><path d="M96 99H365"/><path d="M365 128H96"/></g>
    <text x="230" y="166" font-weight="600" text-anchor="middle">抵消 → 净电流为零</text>

    <rect x="15" y="189" width="430" height="125" rx="7" fill="#edf2e9" stroke="#c9d3c7"/>
    <text x="28" y="210" font-size="17" font-weight="600">② 向右穿过的电子更多</text>
    <path d="M230 216V279" stroke="#84988c" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="83" y="238" text-anchor="end" fill="#09677b">6 个</text>
    <text x="377" y="267" fill="#09677b">2 个</text>
    <path d="M96 232H365" stroke="#09677b" stroke-width="4" fill="none" marker-end="url(#electron-arrow)"/>
    <path d="M365 261H96" stroke="#09677b" stroke-width="2" fill="none" marker-end="url(#electron-arrow)"/>
    <path d="M83 296H43" stroke="#9b4c28" stroke-width="3" fill="none" marker-end="url(#current-arrow)"/>
    <text x="100" y="302" fill="#854020" font-weight="600">净电流向左（净 4 个电子向右）</text>
  </g>
</svg>
