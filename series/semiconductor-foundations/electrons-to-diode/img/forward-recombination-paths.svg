<svg xmlns="http://www.w3.org/2000/svg" width="560" height="795" viewBox="0 0 560 795" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">正向导通：两条跨结输运与复合路径</title><desc id="desc">P 区在左接正极，N 区在右接负极；上图中导带电子由 N 端补入，跨结进入 P 区，在 P 区填补价带空穴；下图价带电子由 N 区净向 P 区跨结，N 区留下的空穴与补入的导带电子复合。价带电子的净流出由正极接收。复合释放能量，常规电流指向右。注入的少数载流子也可能到达接触处被收集。各箭头表示净输运而非单电子完整轨迹。</desc><defs>
      <g id="ce"><circle r="9" fill="#09677b"/><path d="M-4 0H4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="ve"><circle r="9" fill="#706394"/><path d="M-4 0H4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="h"><circle r="9" fill="#fff8ee" stroke="#a65029" stroke-width="2"/><path d="M-4 0H4M0-4V4" stroke="#a65029" stroke-width="1.8" stroke-linecap="round"/></g>
      <g id="ce0"><circle r="9" fill="#f7f6ef" stroke="#6f8985" stroke-width="1.5" stroke-dasharray="2.7 2.1"/></g>
      <marker id="c-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#09677b"/></marker>
      <marker id="v-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#706394"/></marker>
      <marker id="t-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#203c37"/></marker>
    </defs>
<rect x="1" y="1" width="558" height="793" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="280" y="28" font-size="21" text-anchor="middle" fill="#203c37" font-weight="650">正向导通：两条跨结输运与复合路径</text>
<use href="#ce" x="28" y="54"/>
<text x="45" y="60" font-size="16" text-anchor="start" fill="#203c37" font-weight="400">导带电子</text>
<use href="#ve" x="205" y="54"/>
<text x="222" y="60" font-size="16" text-anchor="start" fill="#203c37" font-weight="400">价带电子</text>
<use href="#h" x="391" y="54"/>
<text x="408" y="60" font-size="16" text-anchor="start" fill="#203c37" font-weight="400">价带空穴</text>
<g transform="translate(0 75)"><text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="650">① 导带电子跨结，在 P 区复合</text><text x="38" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">正极</text><text x="38" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">+</text><text x="522" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">负极</text><text x="522" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">−</text><text x="183" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">P 区</text><text x="377" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">N 区</text><rect x="66" y="77" width="214" height="123" rx="0" fill="#f3e9d9" stroke="none"/><rect x="280" y="77" width="214" height="123" rx="0" fill="#e0e9ec" stroke="none"/><rect x="246" y="77" width="34" height="123" rx="0" fill="#e5c9ad" stroke="none"/><rect x="280" y="77" width="34" height="123" rx="0" fill="#c2d8c8" stroke="none"/><rect x="66" y="77" width="428" height="123" rx="0" fill="none" stroke="#85948c"/><rect x="46" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><rect x="494" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><path d="M280 77V200" stroke="#5d776c" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M66 139H494" stroke="#8f9c96" opacity=".55"/><text x="82" y="95" font-size="15" text-anchor="start" fill="#597069" font-weight="650">导带</text><text x="82" y="158" font-size="15" text-anchor="start" fill="#597069" font-weight="650">价带</text><path d="M525 112L204 112" fill="none" stroke="#09677b" stroke-width="2.6" marker-end="url(#c-arrow)"/><use href="#ce" x="190" y="112"/><path d="M190 124L190 158" fill="none" stroke="#203c37" stroke-width="2.3" marker-end="url(#t-arrow)" stroke-dasharray="4 3"/><use href="#h" x="190" y="169"/><path d="M176 169L35 169" fill="none" stroke="#706394" stroke-width="2.6" marker-end="url(#v-arrow)"/><use href="#ve" x="112.5" y="169"/><text x="357.5" y="102" font-size="15" text-anchor="middle" fill="#09677b" font-weight="650">导带电子净向左</text><text x="201" y="136" font-size="15" text-anchor="start" fill="#203c37" font-weight="650">复合</text><text x="201" y="153" font-size="14" text-anchor="start" fill="#597069" font-weight="400">释放能量</text><text x="122.5" y="194" font-size="15" text-anchor="middle" fill="#706394" font-weight="650">价带电子净向左</text><text x="280" y="224" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">N 端补充导带电子；跨结后在 P 区填补空穴。</text><text x="280" y="247" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">P 端持续取走价带电子。</text></g>
<path d="M20 336H540" stroke="#c9d3c7"/>
<g transform="translate(0 348)"><text x="20" y="24" font-size="21" text-anchor="start" fill="#203c37" font-weight="650">② 价带电子跨结，在 N 区复合</text><text x="38" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">正极</text><text x="38" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">+</text><text x="522" y="60" font-size="17" text-anchor="middle" fill="#203c37" font-weight="650">负极</text><text x="522" y="80" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">−</text><text x="183" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">P 区</text><text x="377" y="64" font-size="19" text-anchor="middle" fill="#203c37" font-weight="650">N 区</text><rect x="66" y="77" width="214" height="123" rx="0" fill="#f3e9d9" stroke="none"/><rect x="280" y="77" width="214" height="123" rx="0" fill="#e0e9ec" stroke="none"/><rect x="246" y="77" width="34" height="123" rx="0" fill="#e5c9ad" stroke="none"/><rect x="280" y="77" width="34" height="123" rx="0" fill="#c2d8c8" stroke="none"/><rect x="66" y="77" width="428" height="123" rx="0" fill="none" stroke="#85948c"/><rect x="46" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><rect x="494" y="77" width="20" height="123" rx="0" fill="#d8ded5" stroke="#85948c"/><path d="M280 77V200" stroke="#5d776c" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M66 139H494" stroke="#8f9c96" opacity=".55"/><text x="82" y="95" font-size="15" text-anchor="start" fill="#597069" font-weight="650">导带</text><text x="82" y="158" font-size="15" text-anchor="start" fill="#597069" font-weight="650">价带</text><path d="M525 112L384 112" fill="none" stroke="#09677b" stroke-width="2.6" marker-end="url(#c-arrow)"/><use href="#ce" x="370" y="112"/><path d="M370 124L370 158" fill="none" stroke="#203c37" stroke-width="2.3" marker-end="url(#t-arrow)" stroke-dasharray="4 3"/><use href="#h" x="370" y="169"/><path d="M356 169L35 169" fill="none" stroke="#706394" stroke-width="2.6" marker-end="url(#v-arrow)"/><use href="#ve" x="202.5" y="169"/><text x="447.5" y="102" font-size="15" text-anchor="middle" fill="#09677b" font-weight="650">导带电子净向左</text><text x="381" y="136" font-size="15" text-anchor="start" fill="#203c37" font-weight="650">复合</text><text x="381" y="153" font-size="14" text-anchor="start" fill="#597069" font-weight="400">释放能量</text><text x="212.5" y="194" font-size="15" text-anchor="middle" fill="#706394" font-weight="650">价带电子净向左</text><text x="280" y="224" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">N 区留下的价带空态，可由导带电子填补。</text><text x="280" y="247" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">价带电子净跨结向左，等效为空穴由 P 进入 N。</text></g>
<path d="M20 610H540" stroke="#c9d3c7"/>
<rect x="20" y="621" width="520" height="66" rx="8" fill="#f0eee4" stroke="#c9d3c7"/>
<text x="34" y="650" font-size="17" text-anchor="start" fill="#203c37" font-weight="650">复合</text>
<use href="#ce" x="126" y="645"/>
<text x="145" y="651" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">+</text>
<use href="#h" x="167" y="645"/>
<path d="M185 645L240 645" fill="none" stroke="#203c37" stroke-width="2" marker-end="url(#t-arrow)"/>
<use href="#ce0" x="265" y="645"/>
<text x="286" y="651" font-size="17" text-anchor="middle" fill="#203c37" font-weight="400">+</text>
<use href="#ve" x="309" y="645"/>
<text x="332" y="651" font-size="16" text-anchor="start" fill="#597069" font-weight="400">释放能量</text>
<text x="280" y="677" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">导带电子填补价带空态</text>
<text x="20" y="711" font-size="17" text-anchor="start" fill="#203c37" font-weight="650">常规电流</text>
<path d="M141 704L515 704" fill="none" stroke="#203c37" stroke-width="2.7" marker-end="url(#t-arrow)"/>
<path d="M20 722H540" stroke="#c9d3c7"/>
<text x="280" y="745" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">箭头表示统计净输运，不是单电子完整轨迹。</text>
<text x="280" y="767" font-size="15.5" text-anchor="middle" fill="#597069" font-weight="400">注入的少子也可在接触处收集；复合位置为示意。</text>
</g>
</svg>
