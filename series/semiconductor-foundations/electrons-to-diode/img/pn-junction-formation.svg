<svg xmlns="http://www.w3.org/2000/svg" width="560" height="755" viewBox="0 0 560 755" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">P 型硅与 N 型硅相邻后，为什么会形成内建电场？</title>
  <desc id="desc">三个阶段的定性示意。第一步，左侧 P 区与右侧 N 区各自近似电中性，固定负受主与移动空穴的电荷互相补偿，固定正施主与移动导带电子的电荷互相补偿。第二步，允许载流子跨过结面后，导带电子净扩散向左，空穴净扩散向右，靠近结面的多数载流子减少，固定离子的电荷不再被充分补偿。第三步，结区形成内建电场，由右侧 N 区的正空间电荷指向左侧 P 区的负空间电荷，电子受力向右；热平衡时，每种载流子的漂移通量和扩散通量分别相抵，微观运动仍在继续。方框表示固定离子，圆表示可移动载流子。图中省略少数载流子，符号数目及空间尺度不是实际比例；虚线表示结面的位置，不是物理屏障。</desc>
  <defs>
    <g id="acceptor">
      <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#e9e9dc" stroke="#597069" stroke-width="2"/>
      <path d="M-5 0H5" stroke="#203c37" stroke-width="2.2"/>
    </g>
    <g id="donor">
      <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#e9e9dc" stroke="#597069" stroke-width="2"/>
      <path d="M-5 0H5M0-5V5" stroke="#203c37" stroke-width="2.2"/>
    </g>
    <g id="electron">
      <circle r="10" fill="#09677b"/><path d="M-4.5 0H4.5" stroke="#fff" stroke-width="2"/>
    </g>
    <g id="hole">
      <circle r="10" fill="#f7f6ef" stroke="#9b4c28" stroke-width="2.3"/>
      <path d="M-4.5 0H4.5M0-4.5V4.5" stroke="#9b4c28" stroke-width="2"/>
    </g>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#09677b"/>
    </marker>
    <marker id="hole-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#9b4c28"/>
    </marker>
    <marker id="field-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#2f6f62"/>
    </marker>
    <g id="region-background">
      <rect x="24" y="58" width="256" height="88" fill="#f2e5d1"/>
      <rect x="280" y="58" width="256" height="88" fill="#dceadc"/>
      <text x="152" y="50" font-size="19" font-weight="700" text-anchor="middle">P 型硅</text>
      <text x="408" y="50" font-size="19" font-weight="700" text-anchor="middle">N 型硅</text>
    </g>
    <g id="region-edge">
      <rect x="24" y="58" width="512" height="88" fill="none" stroke="#6d8677" stroke-width="1.6"/>
      <path d="M280 58V146" fill="none" stroke="#597069" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <g id="ions">
      <use href="#acceptor" x="62" y="83"/><use href="#acceptor" x="120" y="83"/>
      <use href="#acceptor" x="178" y="83"/><use href="#acceptor" x="236" y="83"/>
      <use href="#donor" x="324" y="83"/><use href="#donor" x="382" y="83"/>
      <use href="#donor" x="440" y="83"/><use href="#donor" x="498" y="83"/>
    </g>
    <g id="neutral-carriers">
      <use href="#hole" x="62" y="122"/><use href="#hole" x="120" y="122"/>
      <use href="#hole" x="178" y="122"/><use href="#hole" x="236" y="122"/>
      <use href="#electron" x="324" y="122"/><use href="#electron" x="382" y="122"/>
      <use href="#electron" x="440" y="122"/><use href="#electron" x="498" y="122"/>
    </g>
    <g id="initial-depletion">
      <rect x="207" y="58" width="73" height="88" fill="#e6ccae"/>
      <rect x="280" y="58" width="73" height="88" fill="#bddbc9"/>
      <use href="#hole" x="62" y="122"/><use href="#hole" x="120" y="122"/><use href="#hole" x="178" y="122"/>
      <use href="#electron" x="382" y="122"/><use href="#electron" x="440" y="122"/><use href="#electron" x="498" y="122"/>
    </g>
    <g id="near-junction-depleted">
      <rect x="148" y="58" width="132" height="88" fill="#e6ccae"/>
      <rect x="280" y="58" width="132" height="88" fill="#bddbc9"/>
      <use href="#hole" x="62" y="122"/><use href="#hole" x="120" y="122"/>
      <use href="#electron" x="440" y="122"/><use href="#electron" x="498" y="122"/>
      <text x="210" y="128" font-size="17" fill="#6c4933" text-anchor="middle">负空间电荷</text>
      <text x="350" y="128" font-size="17" fill="#315c46" text-anchor="middle">正空间电荷</text>
    </g>
  </defs>
  <rect x="1" y="1" width="558" height="753" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', sans-serif" fill="#203c37">
    <g>
      <text x="22" y="28" font-size="22" font-weight="700">① 初始：两侧均近似电中性</text>
      <use href="#region-background"/><use href="#neutral-carriers"/><use href="#ions"/><use href="#region-edge"/>
      <text x="280" y="174" text-anchor="middle" font-size="19">固定离子的电荷被多数载流子补偿。</text>
    </g>
    <path d="M20 190H540" stroke="#c9d3c7"/>
    <g transform="translate(0 194)">
      <text x="22" y="28" font-size="22" font-weight="700">② 形成 PN 结：载流子开始净扩散</text>
      <use href="#region-background"/><use href="#initial-depletion"/><use href="#ions"/><use href="#region-edge"/>
      <text x="25" y="172" font-size="19" fill="#09677b">导带电子净扩散</text>
      <path d="M360 166H202" fill="none" stroke="#09677b" stroke-width="3" marker-end="url(#electron-arrow)"/>
      <text x="25" y="199" font-size="19" fill="#9b4c28">空穴净扩散</text>
      <path d="M202 193H360" fill="none" stroke="#9b4c28" stroke-width="3" marker-end="url(#hole-arrow)"/>
      <text x="280" y="228" text-anchor="middle" font-size="19">失去载流子补偿，电荷分离开始建立电场。</text>
    </g>
    <path d="M20 435H540" stroke="#c9d3c7"/>
    <g transform="translate(0 439)">
      <text x="22" y="28" font-size="22" font-weight="700">③ 热平衡：内建电场与耗尽区</text>
      <use href="#region-background"/><use href="#near-junction-depleted"/><use href="#ions"/><use href="#region-edge"/>
      <text x="25" y="172" font-size="19" fill="#2f6f62">内建电场方向</text>
      <path d="M360 166H202" fill="none" stroke="#2f6f62" stroke-width="3" marker-end="url(#field-arrow)"/>
      <text x="25" y="199" font-size="19" fill="#09677b">电子受力方向</text>
      <path d="M202 193H360" fill="none" stroke="#09677b" stroke-width="3" marker-end="url(#electron-arrow)"/>
      <text x="280" y="224" text-anchor="middle" font-size="19" font-weight="650">电子和空穴各自的漂移与扩散相抵</text>
      <text x="280" y="247" text-anchor="middle" font-size="18">净通量为零，但微观运动仍在继续。</text>
    </g>
    <path d="M20 697H540" stroke="#c9d3c7"/>
    <g font-size="17">
      <use href="#acceptor" x="31" y="718"/><text x="46" y="724">固定受主</text>
      <use href="#donor" x="161" y="718"/><text x="176" y="724">固定施主</text>
      <use href="#hole" x="291" y="718"/><text x="306" y="724">空穴</text>
      <use href="#electron" x="421" y="718"/><text x="436" y="724">导带电子</text>
    </g>
    <text x="280" y="744" text-anchor="middle" font-size="15.5" fill="#597069">省略少数载流子；数量与尺度仅示意。虚线是结面位置。</text>
  </g>
</svg>
