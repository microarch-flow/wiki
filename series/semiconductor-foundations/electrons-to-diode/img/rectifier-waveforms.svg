  <title id="title">同一时间轴上，负载只得到正的半个周期</title>
  <desc id="desc">上方输入是正负二伏的正弦波，下方输出是电阻两端电压。正半周两条波形完全相同，负半周输出停在零伏。横坐标共用，每周期用 T 表示。此图对应一只串联理想二极管与一千欧纯电阻，没有滤波电容。</desc>
