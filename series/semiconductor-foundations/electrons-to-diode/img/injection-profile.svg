<svg xmlns="http://www.w3.org/2000/svg" width="460" height="395" viewBox="0 0 460 395" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">P 侧准中性区结边电子浓度与偏置的关系</title>
<desc id="description">长 P 区位于图的左边，右端是 P 区的耗尽边界。横轴是向左进入 P 区的距离，以电子扩散长度为单位。纵轴为导带电子浓度除以平衡值，使用对数刻度。三个偏压下按长基区的稳态扩散解绘制。结边的归一化浓度分别约为 10.2、1、0.021，远处均趋近 1。</desc>
<style>
  text {font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#203c37}
  .title {font-size:24px;font-weight:700}
  .muted {fill:#526861}
  .ink {font-weight:650}
  .axis {fill:none;stroke:#62766d;stroke-width:1.6}
  .grid {fill:none;stroke:#c6cfc3;stroke-width:1;stroke-dasharray:4 5}
</style>
