<svg xmlns="http://www.w3.org/2000/svg" width="540" height="592" viewBox="0 0 540 592" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">一到四解复用器的门级实现</title>
<desc id="desc">选择输入 i₁i₀=10，2到4译码器产生使能 e0、e1、e2、e3=0、0、1、0。四个与门分别将同一数据输入D和使能ej相与。当D=1时，Y0、Y1、Y2、Y3=0、0、1、0；D=0时四个输出全为0，未选路保持0而非高阻悬空。</desc>
<rect x="1" y="1" width="538" height="590" rx="15" fill="#f7f6ef" stroke="#c6cec2" stroke-width="1.2"/>
<g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="20" y="35" font-size="24" fill="#213c36" font-weight="700" text-anchor="start">1→4 解复用器：数据送到指定输出</text>
<text x="20" y="64" font-size="18" fill="#526861" font-weight="400" text-anchor="start">示例：i₁i₀ = 10（选择编号 2），D = 1</text>
<rect x="16" y="80" width="508" height="311" rx="9" fill="#fffdf7" stroke="#d3dacf" stroke-width="1.2"/>
<rect x="65" y="110" width="130" height="248" rx="10" fill="#f1f2e9" stroke="#91a39b" stroke-width="1.2"/>
<text x="130" y="204" font-size="23" fill="#213c36" font-weight="700" text-anchor="middle">2→4</text>
<text x="130" y="234" font-size="20" fill="#213c36" font-weight="650" text-anchor="middle">译码器</text>
<path d="M27 234H65" fill="none" stroke="#526861" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="220" font-size="19" fill="#213c36" font-weight="650" text-anchor="middle">10</text>
<path d="M195 128H307" fill="none" stroke="#8b9a91" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="121" font-size="17" fill="#8b9a91" font-weight="650" text-anchor="start">e₀ = 0</text>
<path d="M268 150H307" fill="none" stroke="#09677b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="155" font-size="17" fill="#09677b" font-weight="650" text-anchor="end">D = 1</text>
<path d="M307 117H340a22 22 0 0 1 0 44H307Z" fill="#eeeee8" stroke="#526861" stroke-width="2" stroke-linejoin="round"/>
<path d="M362 139H416" fill="none" stroke="#8b9a91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="423" y="145" font-size="20" fill="#526861" font-weight="700" text-anchor="start">Y₀ = 0</text>
<path d="M195 190H307" fill="none" stroke="#8b9a91" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="183" font-size="17" fill="#8b9a91" font-weight="650" text-anchor="start">e₁ = 0</text>
<path d="M268 212H307" fill="none" stroke="#09677b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="217" font-size="17" fill="#09677b" font-weight="650" text-anchor="end">D = 1</text>
<path d="M307 179H340a22 22 0 0 1 0 44H307Z" fill="#eeeee8" stroke="#526861" stroke-width="2" stroke-linejoin="round"/>
<path d="M362 201H416" fill="none" stroke="#8b9a91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="423" y="207" font-size="20" fill="#526861" font-weight="700" text-anchor="start">Y₁ = 0</text>
<path d="M195 252H307" fill="none" stroke="#09677b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="245" font-size="17" fill="#09677b" font-weight="650" text-anchor="start">e₂ = 1</text>
<path d="M268 274H307" fill="none" stroke="#09677b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="279" font-size="17" fill="#09677b" font-weight="650" text-anchor="end">D = 1</text>
<path d="M307 241H340a22 22 0 0 1 0 44H307Z" fill="#dbece7" stroke="#09677b" stroke-width="2" stroke-linejoin="round"/>
<path d="M362 263H416" fill="none" stroke="#09677b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="423" y="269" font-size="20" fill="#09677b" font-weight="700" text-anchor="start">Y₂ = 1</text>
<path d="M195 314H307" fill="none" stroke="#8b9a91" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="307" font-size="17" fill="#8b9a91" font-weight="650" text-anchor="start">e₃ = 0</text>
<path d="M268 336H307" fill="none" stroke="#09677b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="341" font-size="17" fill="#09677b" font-weight="650" text-anchor="end">D = 1</text>
<path d="M307 303H340a22 22 0 0 1 0 44H307Z" fill="#eeeee8" stroke="#526861" stroke-width="2" stroke-linejoin="round"/>
<path d="M362 325H416" fill="none" stroke="#8b9a91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="423" y="331" font-size="20" fill="#526861" font-weight="700" text-anchor="start">Y₃ = 0</text>
<text x="29" y="380" font-size="17" fill="#526861" font-weight="400" text-anchor="start">同名 D 端接到同一数据输入。</text>
<rect x="16" y="405" width="508" height="125" rx="9" fill="#fffdf7" stroke="#d3dacf" stroke-width="1.2"/>
<text x="29" y="429" font-size="18" fill="#213c36" font-weight="650" text-anchor="start">选择不变时，数据 D 决定选中输出。</text>
<text x="34" y="472" font-size="19" fill="#213c36" font-weight="650" text-anchor="start">D = 1</text>
<text x="156" y="472" font-size="18" fill="#526861" font-weight="400" text-anchor="start">输出：</text>
<rect x="227" y="449" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="254" y="470" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<rect x="293" y="449" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="320" y="470" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<rect x="359" y="449" width="55" height="27" rx="5" fill="#dbece7" stroke="#bdd5ca" stroke-width="1.2"/>
<text x="386" y="470" font-size="19" fill="#09677b" font-weight="700" text-anchor="middle">1</text>
<rect x="425" y="449" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="452" y="470" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<text x="34" y="507" font-size="19" fill="#213c36" font-weight="650" text-anchor="start">D = 0</text>
<text x="156" y="507" font-size="18" fill="#526861" font-weight="400" text-anchor="start">输出：</text>
<rect x="227" y="484" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="254" y="505" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<rect x="293" y="484" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="320" y="505" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<rect x="359" y="484" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="386" y="505" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<rect x="425" y="484" width="55" height="27" rx="5" fill="#eeeee8" stroke="#d3dacf" stroke-width="1.2"/>
<text x="452" y="505" font-size="19" fill="#526861" font-weight="700" text-anchor="middle">0</text>
<text x="20" y="554" font-size="19" fill="#09677b" font-weight="700" text-anchor="start">未选中的输出为 0，不是悬空。</text>
<text x="20" y="578" font-size="17" fill="#526861" font-weight="400" text-anchor="start">输出顺序：Y₀、Y₁、Y₂、Y₃；青色为 1。</text>
</g>
</svg>
