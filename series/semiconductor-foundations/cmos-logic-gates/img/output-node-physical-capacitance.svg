<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">输出金属线连接下一只 MOS 管的栅极，沿途有哪些电容？</title>
  <desc id="desc">简化剖面示意。驱动 NMOS 的源区 S 与体端 B 接地，其栅极接输入 A；驱动 NMOS 的 n 型漏区 D 经青色金属线 Y 连接接收 NMOS 的栅电极。Y 上的电荷变化与三个位置有关：漏区和 p 型体区的 PN 结耗尽层、金属线和邻近导体之间的绝缘介质、下一级栅电极和硅之间的栅介质。这些是器件和互连本身存在的电容，而非另外接入三只电容。各部分尺寸为示意；省略其余端子的连接。</desc>
  <defs>
    <g id="ground" fill="none" stroke="#53675b" stroke-width="2.2" stroke-linecap="round"><path d="M0 -8V0M-11 0H11M-7 4H7M-3 8H3"/></g>
  </defs>
  <rect x="1" y="1" width="518" height="558" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#203c37" stroke-linecap="round" stroke-linejoin="round">
    <text x="20" y="34" font-size="23" font-weight="700">输出节点 Y 为什么带有电容？</text>
    <text x="20" y="61" font-size="17" fill="#526861">沿着青色的 Y，从漏区走到下一只管子的栅极。</text>
    <rect x="16" y="80" width="488" height="280" rx="10" fill="#fffdf7" stroke="#d3dacf"/>

    <!-- Both devices are illustrated in a common p-type body. -->
    <rect x="26" y="244" width="468" height="85" rx="2" fill="#ecdfcf" stroke="#b9c6b7"/>
    <rect x="38" y="244" width="26" height="29" fill="#f1cfc4" stroke="#bca291"/>
    <rect x="78" y="244" width="40" height="29" fill="#d9e9e6" stroke="#a4bbb3"/>
    <rect x="188" y="244" width="41" height="29" fill="#d9e9e6" stroke="#09677b" stroke-width="1.9"/>
    <rect x="310" y="244" width="40" height="29" fill="#d9e9e6" stroke="#a4bbb3"/>
    <rect x="420" y="244" width="40" height="29" fill="#d9e9e6" stroke="#a4bbb3"/>
    <rect x="130" y="211" width="47" height="23" rx="2" fill="#61776d"/>
    <rect x="130" y="234" width="47" height="10" fill="#f5e1a5" stroke="#cbb98c"/>
    <rect x="362" y="211" width="47" height="23" rx="2" fill="#09677b"/>
    <rect x="362" y="234" width="47" height="10" fill="#f5e1a5" stroke="#cbb98c"/>
    <text x="51" y="264" font-size="15" font-weight="600" text-anchor="middle">p⁺</text>
    <text x="98" y="264" font-size="16" font-weight="600" text-anchor="middle">n⁺</text>
    <text x="208.5" y="264" font-size="16" font-weight="700" text-anchor="middle" fill="#09677b">n⁺</text>
    <text x="330" y="264" font-size="16" font-weight="600" text-anchor="middle">n⁺</text>
    <text x="440" y="264" font-size="16" font-weight="600" text-anchor="middle">n⁺</text>
    <!-- B and S contacts connected to ground, input gate A is a separate conductor. -->
    <path d="M51 244V194H98V244M51 194H31V209" stroke="#53675b" stroke-width="2.8" fill="none"/>
    <use href="#ground" x="31" y="217"/>
    <circle cx="51" cy="194" r="3" fill="#53675b"/>
    <text x="51" y="184" font-size="17" font-weight="600" text-anchor="middle">B</text>
    <text x="98" y="184" font-size="17" font-weight="600" text-anchor="middle">S</text>
    <path d="M153.5 211V157H114" stroke="#53675b" stroke-width="2.8" fill="none"/>
    <text x="113" y="147" font-size="18" font-weight="700">A</text>
    <!-- All conductive portions connected to node Y are teal. -->
    <rect x="267" y="116" width="70" height="30" fill="#f4e9cf" opacity=".85"/>
    <rect x="267" y="104" width="70" height="12" rx="2" fill="#aab8ae" stroke="#53675b"/>
    <text x="302" y="98" font-size="16" font-weight="600" text-anchor="middle">邻近导体</text>
    <path d="M208.5 244V151H385.5V211" stroke="#09677b" stroke-width="6" fill="none"/>
    <rect x="267" y="146" width="70" height="11" rx="2" fill="#09677b"/>
    <text x="241" y="142" font-size="17" font-weight="700" fill="#09677b" text-anchor="middle">Y</text>
    <text x="195" y="229" font-size="17" font-weight="700" fill="#09677b" text-anchor="end">D</text>
    <text x="386" y="201" font-size="17" font-weight="700" fill="#09677b" text-anchor="middle">G</text>
    <!-- Physical capacitor sites, not inserted discrete capacitors. -->
    <path d="M178 244V270Q178 285 193 285H224Q239 285 239 270V244H229V273H188V244Z" fill="#f0ce9c" fill-opacity=".7" stroke="#a65029" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M250 289L234 275" fill="none" stroke="#a65029" stroke-width="1.8"/>
    <circle cx="256" cy="294" r="11" fill="#f7e4ce" stroke="#a65029"/>
    <text x="256" y="300" font-size="16" font-weight="700" fill="#a65029" text-anchor="middle">1</text>
    <path d="M281 122V141M302 122V141M323 122V141" fill="none" stroke="#a65029" stroke-width="1.4" stroke-dasharray="3 3"/>
    <path d="M347 130H339" stroke="#a65029" stroke-width="1.8"/>
    <circle cx="359" cy="130" r="11" fill="#f7e4ce" stroke="#a65029"/>
    <text x="359" y="136" font-size="16" font-weight="700" fill="#a65029" text-anchor="middle">2</text>
    <path d="M425 220L403 238" fill="none" stroke="#a65029" stroke-width="1.8"/>
    <circle cx="436" cy="214" r="11" fill="#f7e4ce" stroke="#a65029"/>
    <text x="436" y="220" font-size="16" font-weight="700" fill="#a65029" text-anchor="middle">3</text>
    <text x="111" y="316" font-size="17.5" font-weight="650" text-anchor="middle">驱动 NMOS</text>
    <text x="393" y="316" font-size="17.5" font-weight="650" text-anchor="middle">接收 NMOS</text>
    <text x="260" y="319" font-size="15.5" fill="#526861" text-anchor="middle">p 型体区</text>
    <text x="28" y="349" font-size="16" fill="#526861">简化剖面；Y 青色；省略无关端子的连接。</text>

    <circle cx="33" cy="385" r="11" fill="#f7e4ce" stroke="#a65029"/>
    <text x="33" y="391" font-size="16" font-weight="700" fill="#a65029" text-anchor="middle">1</text>
    <text x="54" y="389" font-size="18" font-weight="700">漏端结电容 C<tspan baseline-shift="sub" font-size="13">d</tspan></text>
    <text x="54" y="412" font-size="17" fill="#526861">漏区与体区之间有 PN 结耗尽层。</text>
    <path d="M25 423H495" stroke="#d3dacf" stroke-width="1"/>
    <circle cx="33" cy="444" r="11" fill="#f7e4ce" stroke="#a65029"/>
    <text x="33" y="450" font-size="16" font-weight="700" fill="#a65029" text-anchor="middle">2</text>
    <text x="54" y="448" font-size="18" font-weight="700">金属互连电容 C<tspan baseline-shift="sub" font-size="13">w</tspan></text>
    <text x="54" y="471" font-size="17" fill="#526861">Y 与邻近导体之间有绝缘介质。</text>
    <path d="M25 482H495" stroke="#d3dacf" stroke-width="1"/>
    <circle cx="33" cy="503" r="11" fill="#f7e4ce" stroke="#a65029"/>
    <text x="33" y="509" font-size="16" font-weight="700" fill="#a65029" text-anchor="middle">3</text>
    <text x="54" y="507" font-size="18" font-weight="700">下一级栅电容 C<tspan baseline-shift="sub" font-size="13">g</tspan></text>
    <text x="54" y="530" font-size="17" fill="#526861">栅极与下方硅之间有栅介质。</text>
    <text x="20" y="552" font-size="15" fill="#526861">以上是器件和互连本身的电容，而非额外接入的电容器。</text>
  </g>
</svg>
