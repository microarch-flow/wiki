<svg xmlns="http://www.w3.org/2000/svg" width="540" height="652" viewBox="0 0 540 652" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">在规定条件下保证的输出电压与输入识别范围</title>
<desc id="desc">教学假设电源0.8 V。发出门保证低输出不高于0.10 V、高输出不低于0.70 V。接收门保证低输入不高于0.25 V、高输入不低于0.55 V。两者有0.15 V直流噪声余量，接收端中间电压不保证判为低或高，不是第三种逻辑值。高输出0.70 V下降0.08 V后为0.62 V，仍被接收为1。</desc>
<defs><marker id="ink" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#213c36"/></marker><marker id="muted" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#526860"/></marker><marker id="teal" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#09677b"/></marker><marker id="rust" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#a65029"/></marker></defs>
<rect x="1" y="1" width="538" height="650" rx="15" fill="#f7f6ef" stroke="#c6cec2" stroke-width="1.2"/>
<g font-family="system-ui, &#x27;Noto Sans CJK SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif">
<text x="21" y="35" font-size="24" fill="#213c36" font-weight="700" text-anchor="start">逻辑电平在电路之间怎样传递？</text>
<text x="21" y="63" font-size="17" fill="#526860" font-weight="400" text-anchor="start">教学示例：VDD = 0.8 V；在规定条件下保证</text>
<text x="160" y="94" font-size="19" fill="#213c36" font-weight="700" text-anchor="middle">发出端</text>
<text x="160" y="117" font-size="17" fill="#526860" font-weight="400" text-anchor="middle">保证输出</text>
<text x="378" y="94" font-size="19" fill="#213c36" font-weight="700" text-anchor="middle">接收端</text>
<text x="378" y="117" font-size="17" fill="#526860" font-weight="400" text-anchor="middle">保证识别</text>
<text x="22" y="129" font-size="15" fill="#526860" font-weight="400" text-anchor="start">电压（V）</text>
<rect x="100" y="162.0" width="120" height="45.5" rx="0" fill="#f4e5d7" stroke="#bb8d72" stroke-width="1.2"/>
<rect x="100" y="207.5" width="120" height="273.0" rx="0" fill="#e7eae3" stroke="#c6cec2" stroke-width="1.2"/>
<rect x="100" y="480.5" width="120" height="45.5" rx="0" fill="#dbece7" stroke="#88aa9f" stroke-width="1.2"/>
<rect x="318" y="162.0" width="120" height="113.75" rx="0" fill="#f4e5d7" stroke="#bb8d72" stroke-width="1.2"/>
<rect x="318" y="275.75" width="120" height="136.5" rx="0" fill="#e7eae3" stroke="#c6cec2" stroke-width="1.2"/>
<rect x="318" y="412.25" width="120" height="113.75" rx="0" fill="#dbece7" stroke="#88aa9f" stroke-width="1.2"/>
<path d="M83 526V161.0" stroke="#536860" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M76 162.0H88" stroke="#536860" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="167.0" font-size="16" fill="#526860" font-weight="400" text-anchor="end">0.80</text>
<path d="M76 207.5H88" stroke="#536860" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="212.5" font-size="16" fill="#526860" font-weight="400" text-anchor="end">0.70</text>
<path d="M76 275.75H88" stroke="#536860" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="280.75" font-size="16" fill="#526860" font-weight="400" text-anchor="end">0.55</text>
<path d="M76 412.25H88" stroke="#536860" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="417.25" font-size="16" fill="#526860" font-weight="400" text-anchor="end">0.25</text>
<path d="M76 480.5H88" stroke="#536860" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="485.5" font-size="16" fill="#526860" font-weight="400" text-anchor="end">0.10</text>
<path d="M76 526H88" stroke="#536860" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="531" font-size="16" fill="#526860" font-weight="400" text-anchor="end">0</text>
<text x="160" y="190.75" font-size="18" fill="#a65029" font-weight="700" text-anchor="middle">保证为 1</text>
<text x="160" y="509.25" font-size="18" fill="#09677b" font-weight="700" text-anchor="middle">保证为 0</text>
<text x="160" y="332.0" font-size="17" fill="#526860" font-weight="400" text-anchor="middle">不属于</text>
<text x="160" y="356.0" font-size="17" fill="#526860" font-weight="400" text-anchor="middle">保证范围</text>
<text x="378" y="224.875" font-size="19" fill="#a65029" font-weight="700" text-anchor="middle">读作 1</text>
<text x="378" y="475.125" font-size="19" fill="#09677b" font-weight="700" text-anchor="middle">读作 0</text>
<text x="378" y="333.0" font-size="17" fill="#526860" font-weight="700" text-anchor="middle">不保证</text>
<text x="378" y="357.0" font-size="16" fill="#526860" font-weight="400" text-anchor="middle">判为哪一电平</text>
<path d="M220 207.5H318" stroke="#a65029" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M220 275.75H318" stroke="#a65029" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M235 207.5H228V275.75H235" stroke="#a65029" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="275" y="238.625" font-size="15" fill="#a65029" font-weight="700" text-anchor="middle">高电平余量</text>
<text x="275" y="261.625" font-size="17" fill="#a65029" font-weight="700" text-anchor="middle">0.15 V</text>
<path d="M220 480.5H318" stroke="#09677b" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M220 412.25H318" stroke="#09677b" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<path d="M235 412.25H228V480.5H235" stroke="#09677b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="275" y="443.375" font-size="15" fill="#09677b" font-weight="700" text-anchor="middle">低电平余量</text>
<text x="275" y="466.375" font-size="17" fill="#09677b" font-weight="700" text-anchor="middle">0.15 V</text>
<rect x="20" y="544" width="500" height="89" rx="9" fill="#fbfaf4" stroke="#c6cec2" stroke-width="1.2"/>
<text x="31" y="568" font-size="17" fill="#213c36" font-weight="650" text-anchor="start">例如：0.70 V − 0.08 V = 0.62 V，仍 ≥ 0.55 V。</text>
<text x="31" y="592" font-size="16" fill="#526860" font-weight="400" text-anchor="start">接收端仍读作 1；若为反相器，其输出仍会拉低。</text>
<text x="31" y="616" font-size="16" fill="#526860" font-weight="400" text-anchor="start">中间区域不是第三种逻辑值。</text>
</g>
</svg>
