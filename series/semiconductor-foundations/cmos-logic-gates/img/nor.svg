<svg xmlns="http://www.w3.org/2000/svg" width="480" height="433" viewBox="0 0 480 433" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">两输入或非门的串联上拉与并联下拉</title>
  <desc id="desc">标有 A 的两只管共享同一输入，标有 B 的两只管共享另一个输入。上半是 PMOS，下半是 NMOS。A 为高、B 为低时，输出经并联支路中 A 控制的 NMOS 接地，串联上拉被 A 控制的 PMOS 切断。箭头标出导通路径。</desc>
  <defs><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#09677b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#9b4c28"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#536860"/></marker></defs>
  <rect x="1" y="1" width="478" height="431" rx="14" fill="#f7f6ef" stroke="#c6cec2"/>
