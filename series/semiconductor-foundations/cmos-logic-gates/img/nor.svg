    <text x="24" y="384" text-anchor="start" font-size="19" fill="#09677b" font-weight="650">A 控制的 NMOS 接通下拉，Y = 0。</text>
    <text x="24" y="413" text-anchor="start" font-size="18" fill="#203c37" font-weight="400">串联上拉在 A 控制的 PMOS 处断开。</text>
