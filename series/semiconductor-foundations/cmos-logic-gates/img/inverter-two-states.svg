<svg xmlns="http://www.w3.org/2000/svg" width="550" height="950" viewBox="0 0 550 950" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">CMOS 反相器两种翻转的四端电路与电子运动</title>
<desc id="desc">两幅四端 CMOS 反相器电路符号。源和体端分别接 VDD 或 VSS，G 同接 A，D 同接 Y。输入 A 从 0.8 V 降至 0 V 后，PMOS 导通，NMOS 关断，电子从 Y 向 VDD 净转移，常规电流反向，输出趋向 0.8 V。输入 A 从 0 V 升至 0.8 V 后，PMOS 关断，NMOS 导通，电子自 VSS 向 Y 净转移，常规电流反向，输出趋向 0 V。箭头仅表示翻转期净输运，并不是稳态电流。</desc>
<defs>
 <marker id="electron" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#09677b"/></marker>
 <marker id="current" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#a65029"/></marker>
 <marker id="muted" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#526861"/></marker>
</defs>
