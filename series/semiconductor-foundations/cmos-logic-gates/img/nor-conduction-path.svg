<svg xmlns="http://www.w3.org/2000/svg" width="540" height="552" viewBox="0 0 540 552" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">NOR 或非门的互补导通路径</title>
<desc id="desc">两输入或非门的四只MOS管串并联拓扑，四只管采用理想开关等效表示。A为高电平，B为低电平，A控制的PMOS关断、NMOS导通，B控制的PMOS导通、NMOS关断。由于PMOS串联、NMOS并联，完整下拉路径将Y维持为0。粗色线路只标示输出与供电轨间的完整导通路径，不表示持续电流。</desc>
<defs><marker id="ink" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#213c36"/></marker><marker id="muted" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#526860"/></marker><marker id="teal" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#09677b"/></marker><marker id="rust" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3.5L0 7Z" fill="#a65029"/></marker></defs>
