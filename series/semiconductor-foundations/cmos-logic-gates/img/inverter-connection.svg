<svg xmlns="http://www.w3.org/2000/svg" width="550" height="642" viewBox="0 0 550 642" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">CMOS 反相器的四端连接与逻辑抽象</title>
<desc id="desc">两只增强型 MOS 管的完整四端电路符号。PMOS 源端、体端接高电源轨 VDD，NMOS 源端、体端接低电源轨 VSS。输入 A 接两个栅极，输出 Y 接两个漏极和等效负载电容。相同的 VDD、VSS 电源标记表示同一个电路节点。体端箭头表示体区极性，不是电流方向。下方抽象为 NOT 门符号。</desc>
<defs>
 <marker id="electron" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#09677b"/></marker>
 <marker id="current" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#a65029"/></marker>
 <marker id="muted" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#526861"/></marker>
</defs>
<rect x="1" y="1" width="548" height="640" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
<g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#203c37">
<text x="20" y="34" font-size="23" fill="#203c37" font-weight="700" text-anchor="start">两只 MOS 管，共用一个输入和输出</text>
<text x="20" y="62" font-size="18" fill="#526861" font-weight="400" text-anchor="start">保留四个端子：G 栅、D 漏、S 源、B 体。</text>
<rect x="15" y="77" width="520" height="370" rx="10" fill="#fffdf7" stroke="#d3dacf" stroke-width="1.2"/>
<text x="30" y="105" font-size="20" fill="#203c37" font-weight="700" text-anchor="start">CMOS 反相器的电路连接</text>
<path d="M233 131H277" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="255" y="122" font-size="17" fill="#526861" font-weight="650" text-anchor="middle">VDD = 0.8 V</text>
<path d="M255 131V140" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M255 226V254" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M255 254V282" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M255 368V385" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M255 385V393M241 393H269M246 398H264M251 403H259" fill="none" stroke="#53675b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="278" y="400" font-size="17" fill="#526861" font-weight="650" text-anchor="start">VSS = 0 V</text>
<path d="M185 183V325M185 254H65" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="185" cy="254" r="3.4" fill="#53675b" stroke="#53675b" stroke-width="1.6"/>
<text x="63" y="244" font-size="18" fill="#203c37" font-weight="650" text-anchor="start">输入 A</text>
<path d="M185 183H235M235 158V208" fill="none" stroke="#53675b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
<text x="212" y="174" font-size="16" fill="#203c37" font-weight="650" text-anchor="middle">G</text>
<path d="M255 140V172M255 194V226" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M255 180V186" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="265" y="151" font-size="16" fill="#203c37" font-weight="650" text-anchor="start">S</text>
<text x="265" y="222" font-size="16" fill="#203c37" font-weight="650" text-anchor="start">D</text>
<path d="M255 183H306" fill="none" stroke="#76568c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
<path d="M275 179L284 183L275 187Z" fill="#76568c" stroke="#76568c" stroke-width="1"/>
<circle cx="306" cy="183" r="2.6" fill="#fffdf7" stroke="#76568c" stroke-width="1.6"/>
<text x="288" y="175" font-size="16" fill="#76568c" font-weight="650" text-anchor="middle">B</text>
<text x="314" y="189" font-size="16" fill="#76568c" font-weight="650" text-anchor="start">VDD</text>
<text x="310" y="161" font-size="18" fill="#a65029" font-weight="700" text-anchor="start">PMOS</text>
<path d="M185 325H235M235 300V350" fill="none" stroke="#53675b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
<text x="212" y="316" font-size="16" fill="#203c37" font-weight="650" text-anchor="middle">G</text>
<path d="M255 282V314M255 336V368" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M255 322V328" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="265" y="293" font-size="16" fill="#203c37" font-weight="650" text-anchor="start">D</text>
<text x="265" y="364" font-size="16" fill="#203c37" font-weight="650" text-anchor="start">S</text>
<path d="M255 325H306" fill="none" stroke="#76568c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
<path d="M279 321L270 325L279 329Z" fill="#76568c" stroke="#76568c" stroke-width="1"/>
<circle cx="306" cy="325" r="2.6" fill="#fffdf7" stroke="#76568c" stroke-width="1.6"/>
<text x="288" y="317" font-size="16" fill="#76568c" font-weight="650" text-anchor="middle">B</text>
<text x="314" y="331" font-size="16" fill="#76568c" font-weight="650" text-anchor="start">VSS</text>
<text x="310" y="303" font-size="18" fill="#09677b" font-weight="700" text-anchor="start">NMOS</text>
<path d="M255 254H454" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="255" cy="254" r="3.4" fill="#53675b" stroke="#53675b" stroke-width="1.6"/>
<circle cx="439" cy="254" r="3.4" fill="#53675b" stroke="#53675b" stroke-width="1.6"/>
<circle cx="454" cy="254" r="3" fill="#fffdf7" stroke="#53675b" stroke-width="1.6"/>
<text x="454" y="244" font-size="18" fill="#346c59" font-weight="650" text-anchor="end">输出 Y</text>
<path d="M439 254V312.5M422 312.5H456M422 326.5H456M439 326.5V385" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="462" y="324.5" font-size="17" fill="#526861" font-weight="650" text-anchor="start">Cₗ</text>
<path d="M439 385V393M425 393H453M430 398H448M435 403H443" fill="none" stroke="#53675b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="30" y="434" font-size="17" fill="#526861" font-weight="400" text-anchor="start">同名电源标记相连；B 为体端，Cₗ 为等效负载。</text>
<path d="M275 457V481" fill="none" stroke="#526861" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/>
<rect x="15" y="494" width="520" height="134" rx="10" fill="#fffdf7" stroke="#d3dacf" stroke-width="1.2"/>
<text x="30" y="525" font-size="20" fill="#203c37" font-weight="700" text-anchor="start">抽象为逻辑门符号（NOT）</text>
<path d="M91 575H201M320 575H448" fill="none" stroke="#53675b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M201 542V608L300 575Z" fill="#e0ece7" stroke="#53675b" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="310" cy="575" r="9" fill="#fffdf7" stroke="#53675b" stroke-width="1.6"/>
<text x="70" y="581" font-size="18" fill="#203c37" font-weight="650" text-anchor="start">A</text>
<text x="462" y="581" font-size="18" fill="#203c37" font-weight="650" text-anchor="start">Y</text>
<text x="275" y="621" font-size="17" fill="#346c59" font-weight="650" text-anchor="middle">Y 与 A 的逻辑值相反</text>
</g>
</svg>
