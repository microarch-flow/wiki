<svg xmlns="http://www.w3.org/2000/svg" width="550" height="1212" viewBox="0 0 550 1212" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">NAND 门的四端晶体管和导通路径</title>
<desc id="desc">同一两输入NAND门的两个状态，固定A=1，B从0变为1。第一状态B控制的PMOS独立接通上拉而串联下拉断开，输出1。第二状态两只NMOS串联接通下拉，输出0。保留每只MOS四端：PMOS体端始终接VDD，NMOS体端始终接VSS。X指串联中间节点，不是固定电压。相同的输入和体端电源名称表示同一电路节点；粗色线仅标示完整导通路径而非持续电流。</desc>
<defs>
