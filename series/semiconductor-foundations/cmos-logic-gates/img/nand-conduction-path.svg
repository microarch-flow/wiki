<svg xmlns="http://www.w3.org/2000/svg" width="540" height="963" viewBox="0 0 540 963" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">NAND 与非门：改变一个输入</title>
<desc id="desc">同一两输入与非门的两个状态，A始终为1，B从0变为1。第一状态中并联的B控制PMOS形成上拉路径、输出1；第二状态中串联的NMOS均导通形成下拉路径、输出0。粗色线路只标示输出与供电轨间的完整导通路径，不表示持续电流。理想开关等效；同名输入相连；省略体端和负载。</desc>
