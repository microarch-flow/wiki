<svg xmlns="http://www.w3.org/2000/svg" width="480" height="399" viewBox="0 0 480 399" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">CMOS 反相器输出充、放电路径</title>
  <desc id="desc">每幅图中上管 PMOS 接电源，下管 NMOS 接地，共漏端 Y 接负载电容。两个栅极同接 A。输入变低时 PMOS 向电容充电；输入变高时 NMOS 将已充电的输出向地放电。</desc>
