    <text x="176" y="314" text-anchor="end" font-size="19" fill="#203c37" font-weight="400">B</text>
    <line x1="231" y1="264" x2="231" y2="287" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="231" y1="329" x2="231" y2="345" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="219" y1="345" x2="243" y2="345" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="223" y1="350" x2="239" y2="350" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="228" y1="355" x2="234" y2="355" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M342 111L342 150" stroke="#9b4c28" stroke-width="3" fill="none" marker-end="url(#rust)"/>
    <text x="24" y="384" text-anchor="start" font-size="19" fill="#9b4c28" font-weight="650">B 控制的 PMOS 接通上拉，Y = 1。</text>
    <text x="24" y="413" text-anchor="start" font-size="18" fill="#203c37" font-weight="400">串联下拉在 B 控制的 NMOS 处断开。</text>
    <circle cx="231" cy="208" r="4.5" fill="#203c37" stroke="none" stroke-width="2"/>
    <line x1="231" y1="208" x2="387" y2="208" stroke="#9b4c28" stroke-width="2.6" stroke-linecap="round"/>
    <text x="398" y="214" text-anchor="start" font-size="20" fill="#203c37" font-weight="650">Y</text>
