    <line x1="330" y1="151" x2="330" y2="179" stroke="#9b4c28" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="134" y1="179" x2="330" y2="179" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="231" y1="179" x2="231" y2="208" stroke="#9b4c28" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="231" cy="179" r="3.5" fill="#203c37" stroke="none" stroke-width="2"/>
    <line x1="231" y1="208" x2="231" y2="222" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
