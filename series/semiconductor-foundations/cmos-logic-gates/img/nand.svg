<svg xmlns="http://www.w3.org/2000/svg" width="480" height="433" viewBox="0 0 480 433" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">两输入与非门的并联上拉与串联下拉</title>
  <desc id="desc">标有 A 的两只管共享同一输入，标有 B 的两只管共享另一个输入。上半是 PMOS，下半是 NMOS。A 为高、B 为低时，电源经并联支路中 B 控制的 PMOS 接到 Y，串联下拉被 B 控制的 NMOS 切断。箭头标出导通路径。</desc>
  <defs><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#09677b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#9b4c28"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#536860"/></marker></defs>
  <rect x="1" y="1" width="478" height="431" rx="14" fill="#f7f6ef" stroke="#c6cec2"/>
  <g font-family="system-ui, &apos;Noto Sans CJK SC&apos;, sans-serif">
    <text x="22" y="34" text-anchor="start" font-size="22" fill="#203c37" font-weight="650">NAND 与非门 · 取 A = 1，B = 0</text>
    <text x="231" y="68" text-anchor="middle" font-size="19" fill="#203c37" font-weight="400">VDD</text>
    <line x1="219" y1="76" x2="243" y2="76" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="231" y1="76" x2="231" y2="91" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="134" y1="91" x2="330" y2="91" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="231" cy="91" r="3" fill="#203c37" stroke="none" stroke-width="2"/>
    <line x1="134" y1="91" x2="134" y2="109" stroke="#536860" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="330" y1="91" x2="330" y2="109" stroke="#9b4c28" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M134 109h-12v42h12" fill="none" stroke="#536860" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="115" y1="114" x2="115" y2="146" stroke="#203c37" stroke-width="2.7" stroke-linecap="round"/><line x1="85" y1="130" x2="104" y2="130" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><circle cx="109" cy="130" r="5" fill="#f7f6ef" stroke="#203c37" stroke-width="2"/><line x1="114" y1="130" x2="115" y2="130" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <text x="79" y="136" text-anchor="end" font-size="19" fill="#203c37" font-weight="400">A</text>
    <path d="M330 109h-12v42h12" fill="none" stroke="#9b4c28" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="311" y1="114" x2="311" y2="146" stroke="#203c37" stroke-width="2.7" stroke-linecap="round"/><line x1="281" y1="130" x2="300" y2="130" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><circle cx="305" cy="130" r="5" fill="#f7f6ef" stroke="#203c37" stroke-width="2"/><line x1="310" y1="130" x2="311" y2="130" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
