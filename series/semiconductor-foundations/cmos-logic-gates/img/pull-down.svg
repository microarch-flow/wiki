<svg xmlns="http://www.w3.org/2000/svg" width="480" height="345" viewBox="0 0 480 345" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">一只 NMOS 的放电与浮置状态</title>
  <desc id="desc">左图中已预充电容的输出极板经 NMOS 向地放电。右图为同一电路，关闭 NMOS 后输出既没有主动上拉也没有主动下拉，电压受残余电荷与漏电影响。箭头表示常规电流。</desc>
  <defs><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#09677b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#9b4c28"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#536860"/></marker></defs>
  <rect x="1" y="1" width="478" height="343" rx="14" fill="#f7f6ef" stroke="#c6cec2"/>
  <g font-family="system-ui, &apos;Noto Sans CJK SC&apos;, sans-serif">
    <text x="22" y="34" text-anchor="start" font-size="22" fill="#203c37" font-weight="650">只有下拉管，关断后谁给 Y 充电？</text>
    <text x="23" y="63" text-anchor="start" font-size="18" fill="#536860" font-weight="400">起点：输出电容已预充，外部充电支路已移开。</text>
    <line x1="240" y1="79" x2="240" y2="300" stroke="#c6cec2" stroke-width="1.3" stroke-linecap="round"/>
    <text x="25" y="104" text-anchor="start" font-size="20" fill="#203c37" font-weight="650">A 高 · NMOS 导通</text>
    <line x1="111" y1="131" x2="187" y2="131" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="111" y1="131" x2="111" y2="162" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M111 162h-12v42h12" fill="none" stroke="#09677b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="92" y1="167" x2="92" y2="199" stroke="#203c37" stroke-width="2.7" stroke-linecap="round"/><line x1="62" y1="183" x2="92" y2="183" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="111" y1="204" x2="111" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="99" y1="231" x2="123" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="103" y1="236" x2="119" y2="236" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="108" y1="241" x2="114" y2="241" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="187" y1="131" x2="187" y2="176" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="173" y1="176" x2="201" y2="176" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="173" y1="186" x2="201" y2="186" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="187" y1="186" x2="187" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="175" y1="231" x2="199" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="179" y1="236" x2="195" y2="236" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="184" y1="241" x2="190" y2="241" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="111" cy="131" r="3.5" fill="#203c37" stroke="none" stroke-width="2"/>
    <text x="100" y="140" text-anchor="end" font-size="19" fill="#203c37" font-weight="400">Y</text>
    <text x="59" y="189" text-anchor="end" font-size="19" fill="#203c37" font-weight="400">A</text>
    <text x="206" y="200" text-anchor="start" font-size="18" fill="#203c37" font-weight="400">C<tspan dy="4" font-size="15">L</tspan></text>
    <path d="M180 143L123 143" stroke="#09677b" stroke-width="3" fill="none" marker-end="url(#teal)"/>
    <text x="25" y="274" text-anchor="start" font-size="18" fill="#09677b" font-weight="400">电荷经下拉管流向地</text>
    <text x="259" y="104" text-anchor="start" font-size="20" fill="#203c37" font-weight="650">A 低 · NMOS 关断</text>
    <line x1="345" y1="131" x2="421" y2="131" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="345" y1="131" x2="345" y2="162" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M345 162h-12v42h12" fill="none" stroke="#536860" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="326" y1="167" x2="326" y2="199" stroke="#203c37" stroke-width="2.7" stroke-linecap="round"/><line x1="296" y1="183" x2="326" y2="183" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="345" y1="204" x2="345" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="333" y1="231" x2="357" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="337" y1="236" x2="353" y2="236" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="342" y1="241" x2="348" y2="241" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="421" y1="131" x2="421" y2="176" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="407" y1="176" x2="435" y2="176" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="407" y1="186" x2="435" y2="186" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="421" y1="186" x2="421" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="409" y1="231" x2="433" y2="231" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="413" y1="236" x2="429" y2="236" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/><line x1="418" y1="241" x2="424" y2="241" stroke="#203c37" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="345" cy="131" r="3.5" fill="#203c37" stroke="none" stroke-width="2"/>
    <text x="334" y="140" text-anchor="end" font-size="19" fill="#203c37" font-weight="400">Y</text>
    <text x="293" y="189" text-anchor="end" font-size="19" fill="#203c37" font-weight="400">A</text>
    <text x="440" y="200" text-anchor="start" font-size="18" fill="#203c37" font-weight="400">C<tspan dy="4" font-size="15">L</tspan></text>
    <text x="259" y="274" text-anchor="start" font-size="18" fill="#536860" font-weight="400">Y 暂时浮置</text>
    <line x1="22" y1="298" x2="458" y2="298" stroke="#c6cec2" stroke-width="1.3" stroke-linecap="round"/>
    <text x="23" y="327" text-anchor="start" font-size="18" fill="#203c37" font-weight="400">关断后没有上拉通路，漏电会缓慢改变节点电压。</text>
  </g>
</svg>
