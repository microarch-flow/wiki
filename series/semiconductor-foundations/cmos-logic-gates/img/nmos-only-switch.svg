<svg xmlns="http://www.w3.org/2000/svg" width="520" height="292" viewBox="0 0 520 292" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">只有一只 NMOS 时能把输出接到哪里？</title>
  <desc id="desc">同一只增强型 NMOS 的两种输入状态，栅极接 A、漏极接输出 Y，源极和体端接 0 V。在理想开关等效图中，A 为 0.8 V 时下拉开关闭合，Y 与地导通；A 为 0 V 时开关断开，Y 无下拉也无上拉通路，不能主动建立高电平。粗线代表导通路径，不代表持续电流。</desc>
  <defs>
    <g id="ground" fill="none" stroke="#53675b" stroke-width="2.1" stroke-linecap="round"><path d="M0 -8V0M-11 0H11M-7 4H7M-3 8H3"/></g>
  </defs>
  <rect x="1" y="1" width="518" height="290" rx="15" fill="#f7f6ef" stroke="#c9d3c7"/>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#203c37">
    <text x="20" y="33" font-size="23" font-weight="700">只有 NMOS，能把 Y 接到哪里？</text>
    <text x="20" y="60" font-size="17" fill="#526861">同一器件的开关等效；源极与体端均接地。</text>
    <rect x="16" y="78" width="237" height="183" rx="9" fill="#fffdf7" stroke="#d3dacf"/>
    <rect x="267" y="78" width="237" height="183" rx="9" fill="#fffdf7" stroke="#d3dacf"/>
    <text x="29" y="104" font-size="19" font-weight="700">① A = 1（0.8 V）</text>
    <text x="280" y="104" font-size="19" font-weight="700">② A = 0（0 V）</text>
    <g stroke="#53675b" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M143 135H225M143 135V155M143 193V212"/>
      <path d="M37 174H124" stroke-dasharray="4 4"/>
      <path d="M394 135H476M394 135V155M394 193V212"/>
      <path d="M288 174H375" stroke-dasharray="4 4"/>
      <path d="M394 193L373 160"/>
    </g>
    <path d="M225 135H143V213" fill="none" stroke="#09677b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fffdf7" stroke="#09677b" stroke-width="2"><circle cx="143" cy="155" r="3.5"/><circle cx="143" cy="193" r="3.5"/></g>
    <g fill="#fffdf7" stroke="#53675b" stroke-width="2"><circle cx="394" cy="155" r="3.5"/><circle cx="394" cy="193" r="3.5"/></g>
    <circle cx="143" cy="135" r="3.3" fill="#09677b"/><circle cx="394" cy="135" r="3.3" fill="#53675b"/>
    <use href="#ground" x="143" y="220"/><use href="#ground" x="394" y="220"/>
    <text x="225" y="128" font-size="19" font-weight="650" text-anchor="end">Y</text><text x="476" y="128" font-size="19" font-weight="650" text-anchor="end">Y</text>
    <text x="37" y="166" font-size="17" fill="#526861">栅极 A</text><text x="288" y="166" font-size="17" fill="#526861">栅极 A</text>
    <text x="156" y="170" font-size="17" font-weight="650" fill="#09677b">导通</text><text x="408" y="170" font-size="17" fill="#526861">关断</text>
    <text x="29" y="252" font-size="18" font-weight="700" fill="#09677b">Y 接向地，可下拉</text>
    <text x="280" y="252" font-size="18" font-weight="700">Y 没有上拉通路</text>
    <text x="20" y="281" font-size="16.5" fill="#526861">粗线表示完整导通路径，不表示持续电流。</text>
  </g>
</svg>
