<svg xmlns="http://www.w3.org/2000/svg" width="480" height="406" viewBox="0 0 480 406" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">以等效电阻和电容估算反相器输出的上升波形</title>
  <desc id="desc">0.8 伏供电、上拉等效电阻 10 千欧、负载 10 飞法。理想输入阶跃后，时间常数为 100 皮秒，指数上升的输出达到 0.4 伏约需 69 皮秒。</desc>
