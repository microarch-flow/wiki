<svg xmlns="http://www.w3.org/2000/svg" width="480" height="527" viewBox="0 0 480 527" role="img" aria-labelledby="title description">
  <title id="title">两节点 RC 模型中，线两端先后越过 0.4 V</title>
  <desc id="description">驱动等效电阻为 1 kΩ，导线电阻为 0.5 kΩ。驱动输出和远端分别有 6 fF 和 16 fF 对地电容。上拉在零时刻导通，供电一直为 0.8 V。两节点的充电曲线由线性电路方程计算得到。近端在 11.98 ps 时升到 0.4 V，远端在 21.37 ps 时达到同样的电压。</desc>
