<svg xmlns="http://www.w3.org/2000/svg" width="480" height="484" viewBox="0 0 480 484" role="img" aria-labelledby="title description">
  <title id="title">一阶 RC 模型中两种扇出的输出上升曲线</title>
  <desc id="description">输出起始为零伏，电源零点八伏。两条充电曲线按 V(t)=0.8×(1−exp(−t/RC)) 绘制，R 等于一千欧。一个输入、总计八飞法的曲线在约五点五皮秒越过零点四伏；八个输入、总计二十二飞法的曲线在约十五点二皮秒越过同一电压。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #203c37; }
    .heading { font-size: 23px; font-weight: 700; }
    .body { font-size: 18px; } .note { font-size: 17px; fill: #526861; }
    .label { font-size: 18px; font-weight: 650; } .tick { font-size: 16px; }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .teal { fill: #09677b; } .rust { fill: #9b4c28; }
    .wire,.charge,.grid,.axis,.curve { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire { stroke: #36574e; stroke-width: 2.4; }
    .charge { stroke: #09677b; stroke-width: 2.8; }
    .axis { stroke: #687e70; stroke-width: 1.5; }
    .grid { stroke: #c1cec2; stroke-width: 1.1; stroke-dasharray: 3 5; }
    .curve { stroke-width: 3.1; }
  </style>
  <rect x="1" y="1" width="478" height="482" rx="15" fill="#f7f6ef" stroke="#c4d0c4"/>
  <text x="20" y="36" class="heading">相同的上拉电阻，哪条曲线先到 0.4 V？</text>
  <text x="20" y="66" class="note">电源恒定在 0.8 V，上拉等效电阻为 1 kΩ。</text>
  <path d="M23 98H50" class="curve" stroke="#09677b"/>
  <text x="59" y="104" class="label teal">1 个输入 · 8 fF</text>
  <path d="M238 98H265" class="curve" stroke="#9b4c28"/>
  <text x="274" y="104" class="label rust">8 个输入 · 22 fF</text>
  <text x="21" y="124" class="tick">输出电压（V）</text>
  <text x="45" y="344" class="tick end">0</text>
