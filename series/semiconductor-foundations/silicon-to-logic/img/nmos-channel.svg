<svg xmlns="http://www.w3.org/2000/svg" width="520" height="489" viewBox="0 0 520 489" role="img" aria-labelledby="title desc">
  <title id="title">平面增强型 NMOS 的低栅压和强反型状态</title>
  <desc id="desc">栅极与 P 型体区之间有栅介质。低栅压时源区和漏区之间缺少强反型沟道。高栅压和小漏源压差下，栅介质下方形成反型沟道，电子从源区移向漏区。</desc>
  <defs>
    <g id="cross-section">
      <rect x="40" y="130" width="440" height="83" rx="4" fill="#f0dfc3" stroke="#8b765c" stroke-width="1.6"/>
      <path d="M60 130H169V159H60Z M351 130H460V159H351Z" fill="#c5dfcf" stroke="#476c58" stroke-width="1.6"/>
      <rect x="166" y="120" width="188" height="10" fill="#dce8ea" stroke="#597783" stroke-width="1.6"/>
      <rect x="174" y="86" width="172" height="34" rx="3" fill="#dbe6d6" stroke="#476c58" stroke-width="1.6"/>
      <path d="M114 95V130 M405 95V130" fill="none" stroke="#173d35" stroke-width="2.5"/>
      <g text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#173d35">
        <text x="114" y="83">源极 S</text><text x="405" y="83">漏极 D</text>
        <text x="114" y="152" font-weight="600">N⁺</text><text x="405" y="152" font-weight="600">N⁺</text>
        <text x="260" y="110" font-weight="600">栅极 G</text>
        <text x="92" y="194">P 型体区</text>
      </g>
    </g>
  </defs>
  <rect x="1" y="1" width="518" height="487" rx="15" fill="#eef3e9" stroke="#cddccd"/>
  <path d="M25 240H495" stroke="#c4d5c5" stroke-width="1.8"/>
  <use href="#cross-section"/>
  <use href="#cross-section" transform="translate(0 240)"/>
  <rect x="168" y="370" width="184" height="12" fill="#84bc9e"/>
  <path d="M185 376H335 M335 376l-10-4 M335 376l-10 4" fill="none" stroke="#173d35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M273 143V127" stroke="#597783" stroke-width="1.7"/>
  <g font-family="system-ui, sans-serif" fill="#173d35">
    <text x="40" y="39" font-size="22" font-weight="600">低栅压</text>
    <text x="40" y="279" font-size="22" font-weight="600">高栅压，形成反型沟道</text>
    <text x="273" y="165" text-anchor="middle" font-size="19">栅介质</text>
    <text x="260" y="422" text-anchor="middle" font-size="19">电子沿沟道移动</text>
  </g>
</svg>
