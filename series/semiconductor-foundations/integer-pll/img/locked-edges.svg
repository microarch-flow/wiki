<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title description">
  <title id="title">锁定后在同一时间轴上观察参考、输出与二分频反馈</title>
  <desc id="description">在理想锁定示意中，参考时钟在 0、40、80 ns 上升。VCO 输出在 0、20、40、60、80 ns 上升。反馈触发器在每个输出上升沿翻转一次，取反馈在 0 ns 上升，则其上升沿也在 0、40、80 ns。输出在参考的一个周期里走完两个周期。图中省略传播延迟及抖动。</desc>
  <defs>
    <style>
      text { font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#203c37; }
      .title { font-size:23px; font-weight:700; }
      .heading { font-size:20px; font-weight:650; }
      .note { font-size:17px; fill:#526861; }
      .axis { font-size:16px; }
      .wave { fill:none; stroke-width:3; stroke-linejoin:round; }
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="488" rx="15" fill="#f7f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="title">参考相邻两次上升，输出走了几周？</text>
  <text x="20" y="64" class="note">取上升沿对齐的理想情形，省略传播延迟和抖动。</text>
  <text x="20" y="101" class="heading">参考时钟 · 25 MHz</text>
  <g stroke="#b9c9bd" stroke-width="1.3" stroke-dasharray="3 4" fill="none">
    <path d="M72 111 V161 M72 206 V252 M72 299 V349"/>
    <path d="M240 111 V161 M240 206 V252 M240 299 V349"/>
    <path d="M408 111 V161 M408 206 V252 M408 299 V349"/>
  </g>
  <g stroke="#dad9ca" stroke-width="1.1" stroke-dasharray="2 4" fill="none">
    <path d="M156 111 V161 M156 206 V252 M156 299 V349 M324 111 V161 M324 206 V252 M324 299 V349"/>
  </g>
  <path class="wave" stroke="#09677b" d="M44 154 H72 V123 H156 V154 H240 V123 H324 V154 H408 V123 H445"/>
  <g fill="#09677b">
    <circle cx="72" cy="138.5" r="4"/><circle cx="240" cy="138.5" r="4"/><circle cx="408" cy="138.5" r="4"/>
  </g>
  <text x="20" y="194" class="heading">VCO 输出 · 50 MHz</text>
  <path class="wave" stroke="#964626" d="M44 247 H72 V216 H114 V247 H156 V216 H198 V247 H240 V216 H282 V247 H324 V216 H366 V247 H408 V216 H445"/>
  <g fill="#964626">
    <circle cx="72" cy="231.5" r="4"/><circle cx="156" cy="231.5" r="4"/><circle cx="240" cy="231.5" r="4"/><circle cx="324" cy="231.5" r="4"/><circle cx="408" cy="231.5" r="4"/>
  </g>
  <text x="20" y="287" class="heading">二分频反馈 · 25 MHz</text>
  <path class="wave" stroke="#465a50" d="M44 340 H72 V309 H156 V340 H240 V309 H324 V340 H408 V309 H445"/>
  <g fill="#465a50">
    <circle cx="72" cy="324.5" r="4"/><circle cx="240" cy="324.5" r="4"/><circle cx="408" cy="324.5" r="4"/>
  </g>
  <path d="M44 355 H446 M441 352 L446 355 L441 358 M72 352 V359 M156 352 V359 M240 352 V359 M324 352 V359 M408 352 V359" fill="none" stroke="#526861" stroke-width="1.2"/>
  <g text-anchor="middle" class="axis">
    <text x="72" y="381">0</text><text x="156" y="381">20</text><text x="240" y="381">40</text><text x="324" y="381">60</text><text x="408" y="381">80</text>
  </g>
  <text x="444" y="403" text-anchor="end" class="note">时间（ns）</text>
  <path d="M20 416 H460" stroke="#c4d0c4"/>
  <text x="20" y="446" class="heading">0 到 40 ns，参考走一周，输出走两周。</text>
  <text x="20" y="474" class="note">圆点标出上升沿。反馈在每个输出上升沿翻转。</text>
</svg>
