<svg xmlns="http://www.w3.org/2000/svg" width="480" height="356" viewBox="0 0 480 356" role="img" aria-labelledby="title description">
  <title id="title">暂时固定 VCO 频率时，同序的反馈沿每轮又晚 10 ns</title>
  <desc id="description">固定 VCO 为 40 MHz，二分频反馈为 20 MHz。上下两排共用从左到右的时间刻度。参考上升沿发生在 0、40、80、120 ns，反馈上升沿发生在 0、50、100、150 ns。从同时到达的一对沿算起，按序号分别相减，反馈比参考晚 0、10、20、30 ns。闭环调频生效后，反馈周期间隔会改变。</desc>
  <style>
    text { font-family: system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #203c37; }
    .heading { font-size: 23px; font-weight: 700; }
    .note { font-size: 17px; fill: #526861; }
    .row { font-size: 19px; font-weight: 650; }
    .ref { fill: #09677b; } .fb { fill: #9b4c28; }
    .tick, .delta { text-anchor: middle; font-size: 17px; }
    .delta { font-weight: 650; paint-order: stroke fill; stroke: #f7f6ef; stroke-width: 7px; stroke-linejoin: round; }
    .pair { stroke: #758c7e; stroke-width: 1.6; stroke-dasharray: 4 4; fill: none; }
    .axis { fill: none; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <rect x="1" y="1" width="478" height="354" rx="15" fill="#f7f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="heading">如果让 VCO 一直以 40 MHz 跑下去</text>
  <text x="20" y="64" class="note">固定控制电压，从两路上升沿同时到达开始。</text>
  <text x="20" y="103" class="row ref">参考上升沿 · 每 40 ns 一次</text>

  <!-- Same horizontal time scale on both rows: x = 52 + 2.48 * t_ns. -->
  <g class="tick ref">
    <text x="52" y="134" class="ref">0 ns</text><text x="151.2" y="134" class="ref">40 ns</text>
    <text x="250.4" y="134" class="ref">80 ns</text><text x="349.6" y="134" class="ref">120 ns</text>
  </g>
  <path class="pair" d="M52 148V224 M151.2 148L176 224 M250.4 148L300 224 M349.6 148L424 224"/>
  <path class="axis" d="M29 148H444L437 144 M444 148L437 152" stroke="#09677b"/>
  <g class="ref"><circle cx="52" cy="148" r="4.3"/><circle cx="151.2" cy="148" r="4.3"/><circle cx="250.4" cy="148" r="4.3"/><circle cx="349.6" cy="148" r="4.3"/></g>
  <g class="delta">
    <text x="52" y="192">0 ns</text><text x="163.6" y="192">+10 ns</text>
    <text x="275.2" y="192">+20 ns</text><text x="386.8" y="192">+30 ns</text>
  </g>
  <path class="axis" d="M29 224H444L437 220 M444 224L437 228" stroke="#9b4c28"/>
  <g class="fb"><rect x="48" y="220" width="8" height="8"/><rect x="172" y="220" width="8" height="8"/><rect x="296" y="220" width="8" height="8"/><rect x="420" y="220" width="8" height="8"/></g>
  <g class="tick">
    <text x="52" y="253" class="fb">0 ns</text><text x="176" y="253" class="fb">50 ns</text>
    <text x="300" y="253" class="fb">100 ns</text><text x="424" y="253" class="fb">150 ns</text>
  </g>
  <text x="20" y="286" class="row fb">二分频反馈上升沿 · 每 50 ns 一次</text>
  <path d="M20 308H460" stroke="#c4d0c4" fill="none"/>
  <text x="20" y="336" class="note">虚线连接同序的上升沿，线上数字为反馈晚到的时间。</text>
</svg>
