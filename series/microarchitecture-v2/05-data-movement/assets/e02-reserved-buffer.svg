  <rect x="289" y="143" width="43" height="23" rx="3" class="reserve"/>
  <text x="310.5" y="159" class="tiny muted" text-anchor="middle">—</text>
  <rect x="360" y="118" width="214" height="55" rx="5" class="reserve"/>
