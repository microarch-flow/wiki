  <text x="637" y="228" class="label" text-anchor="middle">8 B</text>
  <text x="744" y="228" class="label" text-anchor="middle">4 B</text>
  <rect x="19" y="262" width="782" height="67" rx="6" class="panel"/>
  <text x="56" y="290" class="label" text-anchor="middle">E7</text>
  <text x="56" y="310" class="tiny muted" text-anchor="middle">沿后</text>
  <rect x="134" y="268" width="214" height="55" rx="5" class="block"/>
  <text x="145" y="287" class="tiny label" text-anchor="start">R0 · 可写</text>
  <rect x="145" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="166.5" y="309" class="tiny label" text-anchor="middle">1</text>
  <rect x="193" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="214.5" y="309" class="tiny label" text-anchor="middle">2</text>
  <rect x="241" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="262.5" y="309" class="tiny label" text-anchor="middle">3</text>
  <rect x="289" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="310.5" y="309" class="tiny label" text-anchor="middle">4</text>
  <rect x="360" y="268" width="214" height="55" rx="5" class="block"/>
  <text x="371" y="287" class="tiny label" text-anchor="start">R1 · 写入中*</text>
  <rect x="371" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="392.5" y="309" class="tiny label" text-anchor="middle">5</text>
  <rect x="419" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="440.5" y="309" class="tiny label" text-anchor="middle">6</text>
  <rect x="467" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="488.5" y="309" class="tiny label" text-anchor="middle">7</text>
  <rect x="515" y="293" width="43" height="23" rx="3" class="slot"/>
  <text x="536.5" y="309" class="tiny label" text-anchor="middle">8</text>
  <text x="637" y="303" class="label" text-anchor="middle">8 B</text>
  <text x="744" y="303" class="label" text-anchor="middle">8 B</text>
  <rect x="19" y="337" width="782" height="67" rx="6" class="panel"/>
  <text x="56" y="365" class="label" text-anchor="middle">E9</text>
  <text x="56" y="385" class="tiny muted" text-anchor="middle">沿后</text>
  <rect x="134" y="343" width="214" height="55" rx="5" class="block"/>
  <text x="145" y="362" class="tiny label" text-anchor="start">R0 · 可写</text>
  <rect x="145" y="368" width="43" height="23" rx="3" class="slot"/>
