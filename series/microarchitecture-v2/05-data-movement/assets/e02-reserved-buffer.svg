  <text x="214.5" y="384" class="tiny label" text-anchor="middle">2</text>
  <rect x="241" y="368" width="43" height="23" rx="3" class="slot"/>
  <text x="262.5" y="384" class="tiny label" text-anchor="middle">3</text>
  <rect x="289" y="368" width="43" height="23" rx="3" class="slot"/>
  <text x="310.5" y="384" class="tiny label" text-anchor="middle">4</text>
  <rect x="360" y="343" width="214" height="55" rx="5" class="empty"/>
  <text x="371" y="362" class="tiny label" text-anchor="start">空闲</text>
  <rect x="371" y="368" width="43" height="23" rx="3" class="empty"/>
  <text x="392.5" y="384" class="tiny muted" text-anchor="middle">—</text>
  <rect x="419" y="368" width="43" height="23" rx="3" class="empty"/>
  <text x="440.5" y="384" class="tiny muted" text-anchor="middle">—</text>
  <rect x="467" y="368" width="43" height="23" rx="3" class="empty"/>
  <text x="488.5" y="384" class="tiny muted" text-anchor="middle">—</text>
  <rect x="515" y="368" width="43" height="23" rx="3" class="empty"/>
  <text x="536.5" y="384" class="tiny muted" text-anchor="middle">—</text>
  <text x="637" y="378" class="label" text-anchor="middle">4 B</text>
  <text x="744" y="378" class="label" text-anchor="middle">4 B</text>
  <rect x="21" y="420" width="24" height="21" rx="4" class="reserve"/>
  <text x="55" y="436" class="small" text-anchor="start">已保留、无有效数据</text>
  <rect x="293" y="420" width="24" height="21" rx="4" class="block"/>
  <text x="327" y="436" class="small" text-anchor="start">已有有效数据</text>
  <rect x="533" y="420" width="24" height="21" rx="4" class="empty"/>
  <text x="567" y="436" class="small" text-anchor="start">空闲、可分配</text>
  <text x="20" y="468" class="tiny muted" text-anchor="start">* 本模型发送写数据后仍保留整槽，直至成功写应答。</text>
  <text x="20" y="494" class="small accent label" text-anchor="start">R2 到 E9 沿前仍没有可分配的槽；S1 释放后，最早在 E10 接纳 R2。</text>
</svg>
