  <rect x="371" y="143" width="43" height="23" rx="3" class="reserve"/>
  <text x="392.5" y="159" class="tiny muted" text-anchor="middle">—</text>
  <rect x="419" y="143" width="43" height="23" rx="3" class="reserve"/>
  <text x="440.5" y="159" class="tiny muted" text-anchor="middle">—</text>
  <rect x="467" y="143" width="43" height="23" rx="3" class="reserve"/>
  <text x="488.5" y="159" class="tiny muted" text-anchor="middle">—</text>
  <rect x="515" y="143" width="43" height="23" rx="3" class="reserve"/>
  <text x="536.5" y="159" class="tiny muted" text-anchor="middle">—</text>
  <text x="637" y="153" class="label" text-anchor="middle">8 B</text>
  <text x="744" y="153" class="label" text-anchor="middle">0 B</text>
  <rect x="19" y="187" width="782" height="67" rx="6" class="panel"/>
  <text x="56" y="215" class="label" text-anchor="middle">E5</text>
  <text x="56" y="235" class="tiny muted" text-anchor="middle">沿后</text>
  <rect x="134" y="193" width="214" height="55" rx="5" class="reserve"/>
  <text x="145" y="212" class="tiny label" text-anchor="start">R0 · 等待读返回</text>
  <rect x="145" y="218" width="43" height="23" rx="3" class="reserve"/>
  <text x="166.5" y="234" class="tiny muted" text-anchor="middle">—</text>
  <rect x="193" y="218" width="43" height="23" rx="3" class="reserve"/>
  <text x="214.5" y="234" class="tiny muted" text-anchor="middle">—</text>
  <rect x="241" y="218" width="43" height="23" rx="3" class="reserve"/>
  <text x="262.5" y="234" class="tiny muted" text-anchor="middle">—</text>
  <rect x="289" y="218" width="43" height="23" rx="3" class="reserve"/>
  <text x="310.5" y="234" class="tiny muted" text-anchor="middle">—</text>
  <rect x="360" y="193" width="214" height="55" rx="5" class="block"/>
  <text x="371" y="212" class="tiny label" text-anchor="start">R1 · 可写</text>
  <rect x="371" y="218" width="43" height="23" rx="3" class="slot"/>
  <text x="392.5" y="234" class="tiny label" text-anchor="middle">5</text>
  <rect x="419" y="218" width="43" height="23" rx="3" class="slot"/>
