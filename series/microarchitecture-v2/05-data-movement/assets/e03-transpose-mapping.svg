<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="title desc">
  <title id="title">转置前后的元素坐标与地址对应</title>
  <desc id="desc">源矩阵 M 为三行四列，每个元素 1 B，行距 8 B，行首 0x1000、0x1008、0x1010。目标矩阵为四行三列的转置矩阵，行距 3 B，行首 0x2000、0x2003、0x2006、0x2009。源的 (r,c) 对应目标的 (c,r)，地址分别为 0x1000+8r+c 和 0x2000+3c+r。源矩阵值 2 在 (0,1) 的 0x1001，转置后位于 (1,0) 的 0x2003；源值 5 在 (1,0) 的 0x1008，转置后位于 (0,1) 的 0x2001。所有 12 个元素的数值不变，仅改变目标地址。未绘制源行间的 4 B 空隙。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:23px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.muted{fill:#58736a}.accent{fill:#8a5d1c}.teal{fill:#205b64}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.slot{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.amber{fill:#f3ebdb;stroke:#b88a46;stroke-width:1.8}.ocean{fill:#d9ecee;stroke:#5e9098;stroke-width:1.8}
      .control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.pair{fill:#fafbf8;stroke:#92ad9d;stroke-width:1.1}
      .data{stroke:#376650;stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="818" height="458" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="heading" text-anchor="start">转置改变元素的目标位置，不改变元素的值</text>
  <text x="20" y="61" class="small muted" text-anchor="start">每格 1 B；源行间的 4 B 空隙不参与搬运，图中省略。</text>
  <rect x="17" y="80" width="365" height="256" rx="8" class="panel"/>
  <rect x="491" y="80" width="312" height="256" rx="8" class="panel"/>
  <text x="34" y="108" class="label" text-anchor="start">源矩阵（3 行 × 4 列，行距 8 B）</text>
  <text x="507" y="108" class="label" text-anchor="start">目标转置矩阵（4 行 × 3 列）</text>
  <text x="138" y="136" class="tiny muted" text-anchor="end">行首地址</text>
  <text x="610" y="136" class="tiny muted" text-anchor="end">行首地址</text>
  <text x="170" y="136" class="tiny muted" text-anchor="middle">c=0</text>
  <text x="224" y="136" class="tiny muted" text-anchor="middle">c=1</text>
  <text x="278" y="136" class="tiny muted" text-anchor="middle">c=2</text>
  <text x="332" y="136" class="tiny muted" text-anchor="middle">c=3</text>
  <text x="31" y="172" class="small label" text-anchor="start">r=0</text>
  <text x="138" y="172" class="small" text-anchor="end">0x1000</text>
  <rect x="146" y="147" width="48" height="44" rx="4" class="slot"/>
  <text x="170.0" y="175.0" class="label" text-anchor="middle">1</text>
  <rect x="200" y="147" width="48" height="44" rx="4" class="amber"/>
  <text x="224.0" y="175.0" class="label" text-anchor="middle">2</text>
  <rect x="254" y="147" width="48" height="44" rx="4" class="slot"/>
  <text x="278.0" y="175.0" class="label" text-anchor="middle">3</text>
  <rect x="308" y="147" width="48" height="44" rx="4" class="slot"/>
  <text x="332.0" y="175.0" class="label" text-anchor="middle">4</text>
  <text x="31" y="233" class="small label" text-anchor="start">r=1</text>
  <text x="138" y="233" class="small" text-anchor="end">0x1008</text>
  <rect x="146" y="208" width="48" height="44" rx="4" class="ocean"/>
  <text x="170.0" y="236.0" class="label" text-anchor="middle">5</text>
  <rect x="200" y="208" width="48" height="44" rx="4" class="slot"/>
  <text x="224.0" y="236.0" class="label" text-anchor="middle">6</text>
  <rect x="254" y="208" width="48" height="44" rx="4" class="slot"/>
  <text x="278.0" y="236.0" class="label" text-anchor="middle">7</text>
  <rect x="308" y="208" width="48" height="44" rx="4" class="slot"/>
  <text x="332.0" y="236.0" class="label" text-anchor="middle">8</text>
  <text x="31" y="294" class="small label" text-anchor="start">r=2</text>
  <text x="138" y="294" class="small" text-anchor="end">0x1010</text>
  <rect x="146" y="269" width="48" height="44" rx="4" class="slot"/>
  <text x="170.0" y="297.0" class="label" text-anchor="middle">9</text>
  <rect x="200" y="269" width="48" height="44" rx="4" class="slot"/>
  <text x="224.0" y="297.0" class="label" text-anchor="middle">10</text>
  <rect x="254" y="269" width="48" height="44" rx="4" class="slot"/>
  <text x="278.0" y="297.0" class="label" text-anchor="middle">11</text>
  <rect x="308" y="269" width="48" height="44" rx="4" class="slot"/>
  <text x="332.0" y="297.0" class="label" text-anchor="middle">12</text>
  <text x="642" y="136" class="tiny muted" text-anchor="middle">列0</text>
  <text x="696" y="136" class="tiny muted" text-anchor="middle">列1</text>
  <text x="750" y="136" class="tiny muted" text-anchor="middle">列2</text>
  <text x="507" y="171" class="small label" text-anchor="start">行0</text>
  <text x="610" y="171" class="small" text-anchor="end">0x2000</text>
  <rect x="618" y="147" width="48" height="36" rx="4" class="slot"/>
  <text x="642.0" y="171.0" class="label" text-anchor="middle">1</text>
  <rect x="672" y="147" width="48" height="36" rx="4" class="ocean"/>
  <text x="696.0" y="171.0" class="label" text-anchor="middle">5</text>
  <rect x="726" y="147" width="48" height="36" rx="4" class="slot"/>
  <text x="750.0" y="171.0" class="label" text-anchor="middle">9</text>
  <text x="507" y="215" class="small label" text-anchor="start">行1</text>
  <text x="610" y="215" class="small" text-anchor="end">0x2003</text>
  <rect x="618" y="191" width="48" height="36" rx="4" class="amber"/>
  <text x="642.0" y="215.0" class="label" text-anchor="middle">2</text>
  <rect x="672" y="191" width="48" height="36" rx="4" class="slot"/>
  <text x="696.0" y="215.0" class="label" text-anchor="middle">6</text>
  <rect x="726" y="191" width="48" height="36" rx="4" class="slot"/>
  <text x="750.0" y="215.0" class="label" text-anchor="middle">10</text>
  <text x="507" y="259" class="small label" text-anchor="start">行2</text>
  <text x="610" y="259" class="small" text-anchor="end">0x2006</text>
  <rect x="618" y="235" width="48" height="36" rx="4" class="slot"/>
  <text x="642.0" y="259.0" class="label" text-anchor="middle">3</text>
  <rect x="672" y="235" width="48" height="36" rx="4" class="slot"/>
  <text x="696.0" y="259.0" class="label" text-anchor="middle">7</text>
  <rect x="726" y="235" width="48" height="36" rx="4" class="slot"/>
  <text x="750.0" y="259.0" class="label" text-anchor="middle">11</text>
  <text x="507" y="303" class="small label" text-anchor="start">行3</text>
  <text x="610" y="303" class="small" text-anchor="end">0x2009</text>
  <rect x="618" y="279" width="48" height="36" rx="4" class="slot"/>
  <text x="642.0" y="303.0" class="label" text-anchor="middle">4</text>
  <rect x="672" y="279" width="48" height="36" rx="4" class="slot"/>
  <text x="696.0" y="303.0" class="label" text-anchor="middle">8</text>
  <rect x="726" y="279" width="48" height="36" rx="4" class="slot"/>
  <text x="750.0" y="303.0" class="label" text-anchor="middle">12</text>
  <text x="199" y="327" class="small label" text-anchor="middle">源地址 = 0x1000 + 8r + c</text>
  <text x="646" y="330" class="small label" text-anchor="middle">目标地址 = 0x2000 + 3c + r</text>
  <text x="436" y="183" class="label" text-anchor="middle">转置</text>
  <text x="436" y="210" class="small" text-anchor="middle">(r,c)</text>
  <path d="M401 224H479" class="data"/>
  <text x="436" y="249" class="small" text-anchor="middle">(c,r)</text>
  <text x="436" y="277" class="tiny muted" text-anchor="middle">行列互换</text>
  <rect x="18" y="351" width="383" height="75" rx="8" class="amber"/>
  <rect x="419" y="351" width="383" height="75" rx="8" class="ocean"/>
  <text x="36" y="376" class="small label" text-anchor="start">值 2：源 (0,1) → 目标 (1,0)</text>
  <text x="36" y="401" class="label accent" text-anchor="start">0x1001</text>
  <path d="M135 395H208" class="data"/>
  <text x="226" y="401" class="label accent" text-anchor="start">0x2003</text>
  <text x="437" y="376" class="small label" text-anchor="start">值 5：源 (1,0) → 目标 (0,1)</text>
  <text x="437" y="401" class="label teal" text-anchor="start">0x1008</text>
  <path d="M536 395H609" class="data"/>
  <text x="627" y="401" class="label teal" text-anchor="start">0x2001</text>
  <text x="20" y="448" class="tiny muted" text-anchor="start">目标每行连续 3 B，整个转置结果仍是 12 B 有效数据。</text>
</svg>
