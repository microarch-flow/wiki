  <rect x="678" y="426" width="106" height="63" rx="5" class="pair"/>
  <text x="731" y="442" class="tiny muted" text-anchor="middle">第 6 拍</text>
  <rect x="685" y="449" width="44" height="31" rx="4" class="slot"/>
  <text x="707.0" y="470.5" class="label" text-anchor="middle">8</text>
  <rect x="732" y="449" width="44" height="31" rx="4" class="slot"/>
  <text x="754.0" y="470.5" class="label" text-anchor="middle">12</text>
  <rect x="18" y="530" width="383" height="76" rx="8" class="control"/>
  <rect x="419" y="530" width="383" height="76" rx="8" class="block"/>
  <text x="36" y="556" class="small label" text-anchor="start">逐元素直接散写（1 B 窄写）</text>
  <text x="36" y="583" class="label accent" text-anchor="start">12 笔写请求 · 12 个数据拍</text>
  <text x="437" y="556" class="small label" text-anchor="start">转置缓冲后连续写</text>
  <text x="437" y="583" class="label" text-anchor="start">3 笔写请求 · 6 个数据拍</text>
  <text x="20" y="628" class="tiny muted" text-anchor="start">假设散写支持 1 B 合法写入；仅比较写侧数据拍与事务数，不是整项任务的耗时。</text>
</svg>
