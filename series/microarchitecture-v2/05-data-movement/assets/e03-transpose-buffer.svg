  <rect x="291" y="234" width="35" height="37" rx="4" class="slot"/>
  <text x="308.5" y="258.5" class="label" text-anchor="middle">12</text>
  <text x="496" y="253" class="small label" text-anchor="start">r=2</text>
  <rect x="535" y="234" width="50" height="37" rx="4" class="slot"/>
  <text x="560.0" y="258.5" class="label" text-anchor="middle">9</text>
  <rect x="591" y="234" width="50" height="37" rx="4" class="slot"/>
  <text x="616.0" y="258.5" class="label" text-anchor="middle">10</text>
  <rect x="647" y="234" width="50" height="37" rx="4" class="slot"/>
  <text x="672.0" y="258.5" class="label" text-anchor="middle">11</text>
  <rect x="703" y="234" width="50" height="37" rx="4" class="slot"/>
  <text x="728.0" y="258.5" class="label" text-anchor="middle">12</text>
  <path d="M352 253H475" class="data"/>
  <text x="181" y="297" class="small muted" text-anchor="middle">用读响应的身份找到源行</text>
  <text x="638" y="297" class="tiny muted" text-anchor="middle">读事务可结束，tile 数据仍保留</text>
  <path d="M638 307V337" class="data"/>
  <text x="620" y="332" class="small label" text-anchor="end">收齐后按目标偏移递增读出</text>
  <rect x="18" y="345" width="784" height="170" rx="8" class="panel"/>
  <text x="36" y="375" class="label" text-anchor="start">目标连续地址流（每格 1 B，两个元素组成一拍）</text>
  <rect x="33" y="389" width="242" height="113" rx="8" class="block"/>
  <text x="154" y="415" class="small label" text-anchor="middle">写 burst · 0x2000（4 B）</text>
  <rect x="44" y="426" width="106" height="63" rx="5" class="pair"/>
  <text x="97" y="442" class="tiny muted" text-anchor="middle">第 1 拍</text>
  <rect x="51" y="449" width="44" height="31" rx="4" class="slot"/>
