  <rect x="291" y="134" width="35" height="37" rx="4" class="slot"/>
  <text x="308.5" y="158.5" class="label" text-anchor="middle">4</text>
  <text x="496" y="153" class="small label" text-anchor="start">r=0</text>
  <rect x="535" y="134" width="50" height="37" rx="4" class="slot"/>
  <text x="560.0" y="158.5" class="label" text-anchor="middle">1</text>
  <rect x="591" y="134" width="50" height="37" rx="4" class="slot"/>
  <text x="616.0" y="158.5" class="label" text-anchor="middle">2</text>
  <rect x="647" y="134" width="50" height="37" rx="4" class="slot"/>
  <text x="672.0" y="158.5" class="label" text-anchor="middle">3</text>
  <rect x="703" y="134" width="50" height="37" rx="4" class="slot"/>
  <text x="728.0" y="158.5" class="label" text-anchor="middle">4</text>
  <path d="M352 153H475" class="data"/>
  <text x="35" y="203" class="small label" text-anchor="start">R1 · 0x1008</text>
  <rect x="171" y="184" width="35" height="37" rx="4" class="slot"/>
