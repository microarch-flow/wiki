  <rect x="304" y="426" width="106" height="63" rx="5" class="pair"/>
  <text x="357" y="442" class="tiny muted" text-anchor="middle">第 3 拍</text>
  <rect x="311" y="449" width="44" height="31" rx="4" class="slot"/>
  <text x="333.0" y="470.5" class="label" text-anchor="middle">6</text>
  <rect x="358" y="449" width="44" height="31" rx="4" class="slot"/>
  <text x="380.0" y="470.5" class="label" text-anchor="middle">10</text>
  <rect x="418" y="426" width="106" height="63" rx="5" class="pair"/>
  <text x="471" y="442" class="tiny muted" text-anchor="middle">第 4 拍</text>
  <rect x="425" y="449" width="44" height="31" rx="4" class="slot"/>
  <text x="447.0" y="470.5" class="label" text-anchor="middle">3</text>
  <rect x="472" y="449" width="44" height="31" rx="4" class="slot"/>
