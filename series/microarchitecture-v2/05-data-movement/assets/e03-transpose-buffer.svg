<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 639" width="820" height="639" role="img" aria-labelledby="title desc">
  <title id="title">片内暂存矩阵后合并转置写事务</title>
  <desc id="desc">图示一个 12 B 可按原矩阵坐标寻址的片内 tile 缓冲。读事务 R0、R1、R2 分别从 0x1000、0x1008、0x1010 取得 4 B，不要求按顺序返回；每笔数据按源行号写入 tile。数据接收完成后可以结束独立的读事务状态，而 tile 数据保留至写完。缓冲收齐后按目标字节偏移递增读取：六个 2 B 数据拍依次为 [1,5]、[9,2]、[6,10]、[3,7]、[11,4]、[8,12]。每两个数据拍组成一笔 4 B 写 burst，起点依次为 0x2000、0x2004、0x2008。相对每元素单独散写的 12 笔 1 B 事务和 12 个数据拍，使用缓冲可组织为 3 笔 4 B 写事务和 6 个数据拍；有效写数据仍是 12 B。散写假设目标支持 1 B 窄写，对照不计地址交接和写应答等等待。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:23px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.muted{fill:#58736a}.accent{fill:#8a5d1c}.teal{fill:#205b64}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.slot{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.amber{fill:#f3ebdb;stroke:#b88a46;stroke-width:1.8}.ocean{fill:#d9ecee;stroke:#5e9098;stroke-width:1.8}
      .control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.pair{fill:#fafbf8;stroke:#92ad9d;stroke-width:1.1}
      .data{stroke:#376650;stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="818" height="637" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="heading" text-anchor="start">先把数据暂存在片内，再按目标顺序组成写事务</text>
  <text x="20" y="62" class="small muted" text-anchor="start">同样的 12 B 有效数据；读接口和写接口均为 2 B/拍。</text>
  <rect x="18" y="80" width="334" height="227" rx="8" class="panel"/>
  <rect x="475" y="80" width="327" height="227" rx="8" class="panel"/>
  <text x="35" y="109" class="label" text-anchor="start">源端读取（3 笔，各 4 B）</text>
  <text x="492" y="109" class="label" text-anchor="start">12 B tile 缓冲（按 r,c 寻址）</text>
  <text x="560" y="127" class="tiny muted" text-anchor="middle">c=0</text>
  <text x="616" y="127" class="tiny muted" text-anchor="middle">c=1</text>
  <text x="672" y="127" class="tiny muted" text-anchor="middle">c=2</text>
  <text x="728" y="127" class="tiny muted" text-anchor="middle">c=3</text>
  <text x="35" y="153" class="small label" text-anchor="start">R0 · 0x1000</text>
  <rect x="171" y="134" width="35" height="37" rx="4" class="slot"/>
  <text x="188.5" y="158.5" class="label" text-anchor="middle">1</text>
  <rect x="211" y="134" width="35" height="37" rx="4" class="slot"/>
  <text x="228.5" y="158.5" class="label" text-anchor="middle">2</text>
