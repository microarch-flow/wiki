  <rect x="291" y="184" width="35" height="37" rx="4" class="slot"/>
  <text x="308.5" y="208.5" class="label" text-anchor="middle">8</text>
  <text x="496" y="203" class="small label" text-anchor="start">r=1</text>
  <rect x="535" y="184" width="50" height="37" rx="4" class="slot"/>
  <text x="560.0" y="208.5" class="label" text-anchor="middle">5</text>
  <rect x="591" y="184" width="50" height="37" rx="4" class="slot"/>
  <text x="616.0" y="208.5" class="label" text-anchor="middle">6</text>
  <rect x="647" y="184" width="50" height="37" rx="4" class="slot"/>
  <text x="672.0" y="208.5" class="label" text-anchor="middle">7</text>
  <rect x="703" y="184" width="50" height="37" rx="4" class="slot"/>
  <text x="728.0" y="208.5" class="label" text-anchor="middle">8</text>
  <path d="M352 203H475" class="data"/>
  <text x="35" y="253" class="small label" text-anchor="start">R2 · 0x1010</text>
  <rect x="171" y="234" width="35" height="37" rx="4" class="slot"/>
  <text x="188.5" y="258.5" class="label" text-anchor="middle">9</text>
  <rect x="211" y="234" width="35" height="37" rx="4" class="slot"/>
