  <rect x="553" y="389" width="242" height="113" rx="8" class="block"/>
  <text x="674" y="415" class="small label" text-anchor="middle">写 burst · 0x2008（4 B）</text>
  <rect x="564" y="426" width="106" height="63" rx="5" class="pair"/>
  <text x="617" y="442" class="tiny muted" text-anchor="middle">第 5 拍</text>
  <rect x="571" y="449" width="44" height="31" rx="4" class="slot"/>
