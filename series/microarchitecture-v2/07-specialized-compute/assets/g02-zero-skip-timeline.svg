<text x="446.0" y="219" class="small label" text-anchor="middle">+8</text>
<rect x="490" y="184" width="74" height="43" rx="7" class="sfu"/>
<text x="527.0" y="201" class="small muted" text-anchor="middle">k4</text>
<text x="527.0" y="219" class="small muted" text-anchor="middle">+0</text>
<rect x="571" y="184" width="74" height="43" rx="7" class="block"/>
<text x="608.0" y="201" class="small" text-anchor="middle">k5</text>
<text x="608.0" y="219" class="small label" text-anchor="middle">+18</text>
<rect x="652" y="184" width="74" height="43" rx="7" class="sfu"/>
<text x="689.0" y="201" class="small muted" text-anchor="middle">k6</text>
<text x="689.0" y="219" class="small muted" text-anchor="middle">+0</text>
<rect x="733" y="184" width="74" height="43" rx="7" class="block"/>
<text x="770.0" y="201" class="small" text-anchor="middle">k7</text>
<text x="770.0" y="219" class="small label" text-anchor="middle">+32</text>
<rect x="22" y="248" width="816" height="138" rx="7" class="panel"/>
<text x="35" y="273" class="label" text-anchor="start">② 零门控：零值占用原来的时隙</text>
<text x="822" y="273" class="small note" text-anchor="end">8 项有效乘加；任务仍需 8 拍</text>
<text x="35" y="309" class="small label" text-anchor="start">MAC0（y0）</text>
<rect x="166" y="284" width="74" height="43" rx="7" class="block"/>
<text x="203.0" y="301" class="small" text-anchor="middle">k0</text>
<text x="203.0" y="319" class="small label" text-anchor="middle">+2</text>
<rect x="247" y="284" width="74" height="43" rx="7" class="idle"/>
<text x="284.0" y="301" class="small muted" text-anchor="middle">k1</text>
<text x="284.0" y="319" class="small muted" text-anchor="middle">门控</text>
<rect x="328" y="284" width="74" height="43" rx="7" class="block"/>
<text x="365.0" y="301" class="small" text-anchor="middle">k2</text>
<text x="365.0" y="319" class="small label" text-anchor="middle">+9</text>
<rect x="409" y="284" width="74" height="43" rx="7" class="idle"/>
<text x="446.0" y="301" class="small muted" text-anchor="middle">k3</text>
