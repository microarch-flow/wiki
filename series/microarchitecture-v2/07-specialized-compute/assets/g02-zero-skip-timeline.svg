<text x="527.0" y="301" class="small" text-anchor="middle">k4</text>
<text x="527.0" y="319" class="small label" text-anchor="middle">+20</text>
<rect x="571" y="284" width="74" height="43" rx="7" class="idle"/>
<text x="608.0" y="301" class="small muted" text-anchor="middle">k5</text>
<text x="608.0" y="319" class="small muted" text-anchor="middle">门控</text>
<rect x="652" y="284" width="74" height="43" rx="7" class="block"/>
<text x="689.0" y="301" class="small" text-anchor="middle">k6</text>
<text x="689.0" y="319" class="small label" text-anchor="middle">+35</text>
<rect x="733" y="284" width="74" height="43" rx="7" class="idle"/>
<text x="770.0" y="301" class="small muted" text-anchor="middle">k7</text>
<text x="770.0" y="319" class="small muted" text-anchor="middle">门控</text>
<text x="35" y="356" class="small label" text-anchor="start">MAC1（y1）</text>
<rect x="166" y="331" width="74" height="43" rx="7" class="idle"/>
<text x="203.0" y="348" class="small muted" text-anchor="middle">k0</text>
<text x="203.0" y="366" class="small muted" text-anchor="middle">门控</text>
<rect x="247" y="331" width="74" height="43" rx="7" class="block"/>
<text x="284.0" y="348" class="small" text-anchor="middle">k1</text>
<text x="284.0" y="366" class="small label" text-anchor="middle">+2</text>
<rect x="328" y="331" width="74" height="43" rx="7" class="idle"/>
<text x="365.0" y="348" class="small muted" text-anchor="middle">k2</text>
<text x="365.0" y="366" class="small muted" text-anchor="middle">门控</text>
<rect x="409" y="331" width="74" height="43" rx="7" class="block"/>
<text x="446.0" y="348" class="small" text-anchor="middle">k3</text>
<text x="446.0" y="366" class="small label" text-anchor="middle">+8</text>
<rect x="490" y="331" width="74" height="43" rx="7" class="idle"/>
<text x="527.0" y="348" class="small muted" text-anchor="middle">k4</text>
<text x="527.0" y="366" class="small muted" text-anchor="middle">门控</text>
<rect x="571" y="331" width="74" height="43" rx="7" class="block"/>
<text x="608.0" y="348" class="small" text-anchor="middle">k5</text>
<text x="608.0" y="366" class="small label" text-anchor="middle">+18</text>
<rect x="652" y="331" width="74" height="43" rx="7" class="idle"/>
<text x="689.0" y="348" class="small muted" text-anchor="middle">k6</text>
<text x="689.0" y="366" class="small muted" text-anchor="middle">门控</text>
<rect x="733" y="331" width="74" height="43" rx="7" class="block"/>
<text x="770.0" y="348" class="small" text-anchor="middle">k7</text>
<text x="770.0" y="366" class="small label" text-anchor="middle">+32</text>
<rect x="22" y="395" width="816" height="138" rx="7" class="panel"/>
<text x="35" y="420" class="label" text-anchor="start">③ 压紧：每行只发送自己的非零操作</text>
<text x="822" y="420" class="small note" text-anchor="end">8 项有效乘加；理想情况下仅 4 拍</text>
<text x="35" y="456" class="small label" text-anchor="start">MAC0（y0）</text>
<rect x="166" y="431" width="74" height="43" rx="7" class="block"/>
<text x="203.0" y="448" class="small" text-anchor="middle">k0</text>
<text x="203.0" y="466" class="small label" text-anchor="middle">+2</text>
<rect x="247" y="431" width="74" height="43" rx="7" class="block"/>
<text x="284.0" y="448" class="small" text-anchor="middle">k2</text>
<text x="284.0" y="466" class="small label" text-anchor="middle">+9</text>
<rect x="328" y="431" width="74" height="43" rx="7" class="block"/>
<text x="365.0" y="448" class="small" text-anchor="middle">k4</text>
<text x="365.0" y="466" class="small label" text-anchor="middle">+20</text>
<rect x="409" y="431" width="74" height="43" rx="7" class="block"/>
<text x="446.0" y="448" class="small" text-anchor="middle">k6</text>
<text x="446.0" y="466" class="small label" text-anchor="middle">+35</text>
<rect x="490" y="431" width="317" height="43" rx="7" class="idle"/>
<text x="649" y="457" class="small muted" text-anchor="middle">该行已完成，不需占用这些拍</text>
<text x="35" y="503" class="small label" text-anchor="start">MAC1（y1）</text>
<rect x="166" y="478" width="74" height="43" rx="7" class="block"/>
<text x="203.0" y="495" class="small" text-anchor="middle">k1</text>
<text x="203.0" y="513" class="small label" text-anchor="middle">+2</text>
<rect x="247" y="478" width="74" height="43" rx="7" class="block"/>
<text x="284.0" y="495" class="small" text-anchor="middle">k3</text>
<text x="284.0" y="513" class="small label" text-anchor="middle">+8</text>
<rect x="328" y="478" width="74" height="43" rx="7" class="block"/>
<text x="365.0" y="495" class="small" text-anchor="middle">k5</text>
<text x="365.0" y="513" class="small label" text-anchor="middle">+18</text>
<rect x="409" y="478" width="74" height="43" rx="7" class="block"/>
<text x="446.0" y="495" class="small" text-anchor="middle">k7</text>
<text x="446.0" y="513" class="small label" text-anchor="middle">+32</text>
<rect x="490" y="478" width="317" height="43" rx="7" class="idle"/>
<text x="649" y="504" class="small muted" text-anchor="middle">该行已完成，不需占用这些拍</text>
<text x="22" y="563" class="label" text-anchor="start">三种方式的结果相同：y0 = 66，y1 = 60。</text>
<text x="22" y="589" class="small note" text-anchor="start">绿色：非零有效乘加；蓝色：接受零值；虚线：受门控或不需要的时隙。</text>
<text x="22" y="612" class="small accent" text-anchor="start">压紧需要按行解析索引，并独立提供不同 k 的 x；未计额外处理与供数停顿。</text>
</svg>
