<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 680" width="1008" height="680" role="img" aria-labelledby="title desc">
  <title id="title">完全串行、单输入槽与双输入槽的三块数据执行时序</title>
  <desc id="desc">相同的三块数据依次经历搬入 L（2 拍）、计算 C（3 拍）和写回 W（2 拍）。完全串行的最后写回在 t=21 结束；单输入槽但有两个输出槽时，搬入与上一块写回可以并行，最后写回在 t=17 结束；双输入槽与双输出槽时，下一块搬入可以与当前块计算重叠，并在 t=13 结束。区间为左闭右开的时钟边沿区间，颜色与编号表示数据块，空白表示引擎未执行本例的任务。</desc>
