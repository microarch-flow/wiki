    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;fill:#173d35}
    .heading{font-size:22px;font-weight:700}.panel-title{font-size:18px;font-weight:700}
    .sub{font-size:16px;fill:#47665b}.legend{font-size:15px;font-weight:600}
    .axis{font-size:14px;fill:#47665b}.lane{font-size:18px;font-weight:600}
    .bar-label{font-size:16px;font-weight:700}.end{font-size:17px;font-weight:700;fill:#935c2b}
