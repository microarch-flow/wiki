    .grid{stroke:#cbd7cc;stroke-width:0.9}.finish{stroke:#935c2b;stroke-width:1.6;stroke-dasharray:4 3}
    .tile0{fill:#cee4d4;stroke:#6d9c7e}.tile1{fill:#f5d9c7;stroke:#b87f5f}.tile2{fill:#dce6f4;stroke:#7892b5}
  </style></defs>
