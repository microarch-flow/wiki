<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" role="img" aria-labelledby="f02-deadlock-title f02-deadlock-desc">
  <title id="f02-deadlock-title">不必要的全体完成条件造成输出槽死锁</title>
  <desc id="f02-deadlock-desc">沿用 F01 的两个输出缓冲槽，但规定写回引擎 W 必须等三块全部算完才开始。在时刻 E8，A2 已就绪而 C2 无法获得输出槽，O0 和 O1 分别保存 Y0 和 Y1。空槽等待 W 写回并释放，而 W 又在等待 C2 完成，形成循环等待。允许 W 按块写回就绪的结果可以解除本例的循环等待。</desc>
  <defs>
    <marker id="f02-wait-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c5d3c"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.strong{font-size:19px;font-weight:700}.note{font-size:16px;fill:#4f695a}.wait-label{font-size:16px;fill:#875237}
      .engine{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.6}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.4}
      .slot{fill:#f2e8d3;stroke:#b6a073;stroke-width:1.4}
      .wait{fill:none;stroke:#9c5d3c;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#f02-wait-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="364" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="34" class="head">E₈：三块尚未全部算完，谁也不能推进</text>
  <text x="22" y="59" class="note">错误规则：W 必须等三块全部算完才开始写回。</text>

  <rect x="22" y="88" width="192" height="142" rx="9" class="engine"/>
  <text x="118" y="116" text-anchor="middle" class="strong">计算工作 C₂</text>
  <rect x="36" y="130" width="164" height="34" rx="5" fill="#edf1df" stroke="#82a18e" stroke-width="1.4"/>
  <text x="118" y="153" text-anchor="middle">A₂ 已就绪</text>
  <text x="118" y="188" text-anchor="middle">需要一个空输出槽</text>
  <text x="118" y="212" text-anchor="middle" class="wait-label">尚未开始</text>

  <path d="M214 159H281" class="wait"/>
  <text x="248" y="146" class="wait-label" text-anchor="middle">等待</text>

  <rect x="285" y="88" width="190" height="142" rx="9" class="panel"/>
  <text x="380" y="116" text-anchor="middle" class="strong">空输出槽</text>
  <rect x="298" y="130" width="77" height="64" rx="5" class="slot"/>
  <rect x="385" y="130" width="77" height="64" rx="5" class="slot"/>
  <g text-anchor="middle">
    <text x="336.5" y="153" class="strong">O0</text><text x="336.5" y="178">Y₀</text>
    <text x="423.5" y="153" class="strong">O1</text><text x="423.5" y="178">Y₁</text>
  </g>
  <text x="380" y="214" class="wait-label" text-anchor="middle">两个槽都被占用</text>

  <path d="M475 159H542" class="wait"/>
  <text x="509" y="146" class="wait-label" text-anchor="middle">等待</text>

  <rect x="546" y="88" width="192" height="142" rx="9" class="engine"/>
  <text x="642" y="116" text-anchor="middle" class="strong">写回引擎 W</text>
  <text x="642" y="147" text-anchor="middle">Y₀、Y₁ 均可读</text>
  <text x="642" y="176" text-anchor="middle">却要等 C₂ 完成</text>
  <text x="642" y="212" text-anchor="middle" class="wait-label">尚未开始</text>

  <path d="M642 230V267Q642 276 633 276H127Q118 276 118 267V234" class="wait"/>
  <rect x="254" y="259" width="252" height="33" rx="5" fill="#f5f6ef"/>
  <text x="380" y="281" class="wait-label" text-anchor="middle">等待 C₂ 完成：闭合等待环</text>

  <path d="M22 309H738" stroke="#c4d0c4"/>
  <text x="22" y="333" class="note">箭头表示等待关系，不表示数据流。允许 W 按块写回，</text>
  <text x="22" y="353" class="note">即可打破本例的等待环。</text>
</svg>
