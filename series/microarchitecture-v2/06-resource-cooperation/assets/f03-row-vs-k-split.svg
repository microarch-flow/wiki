<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 732" width="980" height="732" role="img" aria-labelledby="title desc">
<title id="title">同一矩阵乘法的按输出行切分与按求和维切分</title>
<desc id="desc">A₀ 是两行 [1,2] 和 [3,4]，B 是两行 [5,6] 和 [7,8]。按输出行切分时，P0 和 P1 分别读取 A₀ 的一行和完整 B，独立得到第一、第二行结果 [19,22] 和 [43,50]，写入 Y 的不同位置。按求和维 K 切分时，P0 使用 A₀ 第一列及 B 第一行，得到部分和 [[5,6],[15,18]]；P1 使用 A₀ 第二列及 B 第二行，得到部分和 [[14,16],[28,32]]。P1 把四个部分和元素发给 P0，P0 逐元素相加，得到 [[19,22],[43,50]]。箭头仅表示逻辑数据交付。</desc>
<defs><style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;fill:#173d35}
.heading{font-size:23px;font-weight:700}.subtitle{font-size:17px;fill:#47665b}.panel-title{font-size:20px;font-weight:700}.panel-desc{font-size:16px;fill:#47665b}
.unit{font-size:19px;font-weight:700}.label{font-size:15px;fill:#47665b}.number{font-size:18px;font-weight:600}.op{font-size:23px;font-weight:600}.result-head{font-size:18px;font-weight:700}.note{font-size:15px;fill:#47665b}.warn{font-size:15px;font-weight:600;fill:#935c2b}
.frame{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1.2}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.2}.lane0{fill:#f1f6f0;stroke:#bfd2c3;stroke-width:1.2}.lane1{fill:#f0f4f9;stroke:#c3cfdf;stroke-width:1.2}
.r0{fill:#cee4d4;stroke:#6d9c7e;stroke-width:1.4}.r1{fill:#dce6f4;stroke:#7892b5;stroke-width:1.4}.weight{fill:#f7e9d4;stroke:#bb8c55;stroke-width:1.2}.final{fill:#e5eee5;stroke:#7c9d87;stroke-width:1.4}.total-box{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1.2}.cell-line{fill:none;stroke:#91a49a;stroke-width:0.9}.arrow{fill:none;stroke:#477666;stroke-width:1.6}.transfer{fill:none;stroke:#477666;stroke-width:1.8;stroke-dasharray:5 3}
</style><marker id="arrowhead" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#477666"/></marker></defs>
<rect x="1" y="1" width="978" height="730" rx="13" class="frame"/>
<text x="19" y="31" class="heading" text-anchor="start">两个计算单元怎样完成同一块矩阵乘法？</text>
<text x="19" y="58" class="subtitle" text-anchor="start">同一个 A₀ × B：改变跨单元分工，结果不变，但数据交付方式不同。</text>
<rect x="22" y="72" width="24" height="19" rx="3" class="r0"/>
<text x="53" y="87" class="label" text-anchor="start">P0 数据／结果</text>
<rect x="210" y="72" width="24" height="19" rx="3" class="r1"/>
<text x="241" y="87" class="label" text-anchor="start">P1 数据／结果</text>
<rect x="398" y="72" width="24" height="19" rx="3" class="weight"/>
<text x="429" y="87" class="label" text-anchor="start">权重 B（送入本地）</text>
<rect x="15" y="105" width="950" height="267" rx="10" class="panel"/>
<text x="29" y="132" class="panel-title" text-anchor="start">A · 按输出行分工</text>
<text x="29" y="154" class="panel-desc" text-anchor="start">各单元计算不同输出行；两者需要完整 B。</text>
<rect x="29" y="165" width="573" height="87" rx="7" class="lane0"/>
<text x="42" y="190" class="unit" text-anchor="start">P0</text>
<text x="117" y="187" class="label" text-anchor="middle">A₀ 行</text>
<rect x="82" y="207" width="70" height="31" rx="3" class="r0"/>
<path d="M117 207 v31" class="cell-line"/>
<text x="99.5" y="228.39" class="number" text-anchor="middle">1</text>
<text x="134.5" y="228.39" class="number" text-anchor="middle">2</text>
<text x="179" y="229" class="op" text-anchor="middle">×</text>
<text x="260" y="185" class="label" text-anchor="middle">完整 B</text>
<rect x="225" y="189" width="70" height="54" rx="3" class="weight"/>
<path d="M260 189 v54" class="cell-line"/>
<path d="M225 216 h70" class="cell-line"/>
<text x="242.5" y="207.63" class="number" text-anchor="middle">5</text>
<text x="277.5" y="207.63" class="number" text-anchor="middle">6</text>
<text x="242.5" y="234.63" class="number" text-anchor="middle">7</text>
<text x="277.5" y="234.63" class="number" text-anchor="middle">8</text>
<text x="334" y="229" class="op" text-anchor="middle">=</text>
<text x="415" y="187" class="label" text-anchor="middle">输出行</text>
<rect x="371" y="207" width="88" height="31" rx="3" class="r0"/>
<path d="M415 207 v31" class="cell-line"/>
<text x="393.0" y="228.39" class="number" text-anchor="middle">19</text>
<text x="437.0" y="228.39" class="number" text-anchor="middle">22</text>
<text x="529" y="230" class="note" text-anchor="middle">独立写入</text>
<rect x="29" y="258" width="573" height="87" rx="7" class="lane1"/>
<text x="42" y="283" class="unit" text-anchor="start">P1</text>
<text x="117" y="280" class="label" text-anchor="middle">A₀ 行</text>
<rect x="82" y="300" width="70" height="31" rx="3" class="r1"/>
<path d="M117 300 v31" class="cell-line"/>
<text x="99.5" y="321.39" class="number" text-anchor="middle">3</text>
<text x="134.5" y="321.39" class="number" text-anchor="middle">4</text>
<text x="179" y="322" class="op" text-anchor="middle">×</text>
<text x="260" y="278" class="label" text-anchor="middle">完整 B</text>
<rect x="225" y="282" width="70" height="54" rx="3" class="weight"/>
<path d="M260 282 v54" class="cell-line"/>
<path d="M225 309 h70" class="cell-line"/>
<text x="242.5" y="300.63" class="number" text-anchor="middle">5</text>
<text x="277.5" y="300.63" class="number" text-anchor="middle">6</text>
<text x="242.5" y="327.63" class="number" text-anchor="middle">7</text>
<text x="277.5" y="327.63" class="number" text-anchor="middle">8</text>
<text x="334" y="322" class="op" text-anchor="middle">=</text>
<text x="415" y="280" class="label" text-anchor="middle">输出行</text>
<rect x="371" y="300" width="88" height="31" rx="3" class="r1"/>
<path d="M415 300 v31" class="cell-line"/>
<text x="393.0" y="321.39" class="number" text-anchor="middle">43</text>
<text x="437.0" y="321.39" class="number" text-anchor="middle">50</text>
<text x="529" y="323" class="note" text-anchor="middle">独立写入</text>
<rect x="750" y="161" width="199" height="188" rx="7" class="total-box"/>
<text x="849" y="186" class="result-head" text-anchor="middle">最终 Y</text>
<rect x="798" y="203" width="100" height="37" rx="3" class="r0"/>
<path d="M848 203 v37" class="cell-line"/>
<text x="823.0" y="228.53" class="number" text-anchor="middle">19</text>
<text x="873.0" y="228.53" class="number" text-anchor="middle">22</text>
<rect x="798" y="258" width="100" height="37" rx="3" class="r1"/>
<path d="M848 258 v37" class="cell-line"/>
<text x="823.0" y="283.53" class="number" text-anchor="middle">43</text>
<text x="873.0" y="283.53" class="number" text-anchor="middle">50</text>
<text x="849" y="325" class="note" text-anchor="middle">无部分和归约</text>
<path d="M 604 222 H 795" class="arrow" marker-end="url(#arrowhead)"/>
<path d="M 604 313 H 690 V 276 H 795" class="arrow" marker-end="url(#arrowhead)"/>
<text x="675" y="213" class="label" text-anchor="middle">填第 0 行</text>
<text x="668" y="336" class="label" text-anchor="middle">填第 1 行</text>
<rect x="15" y="383" width="950" height="323" rx="10" class="panel"/>
<text x="29" y="411" class="panel-title" text-anchor="start">B · 按求和维 K 分工</text>
<text x="29" y="434" class="panel-desc" text-anchor="start">各单元负责一个 k 的乘积，所得矩阵覆盖同样的输出位置，必须逐元素相加。</text>
<rect x="29" y="445" width="573" height="103" rx="7" class="lane0"/>
<text x="42" y="470" class="unit" text-anchor="start">P0</text>
<text x="117" y="466" class="label" text-anchor="middle">A₀ 列</text>
<rect x="98" y="474" width="38" height="64" rx="3" class="r0"/>
<path d="M98 506 h38" class="cell-line"/>
<text x="117.0" y="496.08" class="number" text-anchor="middle">1</text>
<text x="117.0" y="528.08" class="number" text-anchor="middle">3</text>
<text x="179" y="512" class="op" text-anchor="middle">×</text>
<text x="260" y="466" class="label" text-anchor="middle">B 行</text>
<rect x="225" y="491" width="70" height="31" rx="3" class="weight"/>
<path d="M260 491 v31" class="cell-line"/>
<text x="242.5" y="512.39" class="number" text-anchor="middle">5</text>
<text x="277.5" y="512.39" class="number" text-anchor="middle">6</text>
<text x="334" y="512" class="op" text-anchor="middle">=</text>
<text x="415" y="466" class="label" text-anchor="middle">部分和</text>
<rect x="371" y="474" width="88" height="64" rx="3" class="r0"/>
<path d="M415 474 v64" class="cell-line"/>
<path d="M371 506 h88" class="cell-line"/>
<text x="393.0" y="496.08" class="number" text-anchor="middle">5</text>
<text x="437.0" y="496.08" class="number" text-anchor="middle">6</text>
<text x="393.0" y="528.08" class="number" text-anchor="middle">15</text>
<text x="437.0" y="528.08" class="number" text-anchor="middle">18</text>
<text x="528" y="511" class="note" text-anchor="middle">k = 0</text>
<rect x="29" y="557" width="573" height="103" rx="7" class="lane1"/>
<text x="42" y="582" class="unit" text-anchor="start">P1</text>
<text x="117" y="578" class="label" text-anchor="middle">A₀ 列</text>
<rect x="98" y="586" width="38" height="64" rx="3" class="r1"/>
<path d="M98 618 h38" class="cell-line"/>
<text x="117.0" y="608.08" class="number" text-anchor="middle">2</text>
<text x="117.0" y="640.08" class="number" text-anchor="middle">4</text>
<text x="179" y="624" class="op" text-anchor="middle">×</text>
<text x="260" y="578" class="label" text-anchor="middle">B 行</text>
<rect x="225" y="603" width="70" height="31" rx="3" class="weight"/>
<path d="M260 603 v31" class="cell-line"/>
<text x="242.5" y="624.39" class="number" text-anchor="middle">7</text>
<text x="277.5" y="624.39" class="number" text-anchor="middle">8</text>
<text x="334" y="624" class="op" text-anchor="middle">=</text>
<text x="415" y="578" class="label" text-anchor="middle">部分和</text>
<rect x="371" y="586" width="88" height="64" rx="3" class="r1"/>
<path d="M415 586 v64" class="cell-line"/>
<path d="M371 618 h88" class="cell-line"/>
<text x="393.0" y="608.08" class="number" text-anchor="middle">14</text>
<text x="437.0" y="608.08" class="number" text-anchor="middle">16</text>
<text x="393.0" y="640.08" class="number" text-anchor="middle">28</text>
<text x="437.0" y="640.08" class="number" text-anchor="middle">32</text>
<text x="528" y="623" class="note" text-anchor="middle">k = 1</text>
<rect x="750" y="456" width="199" height="198" rx="7" class="total-box"/>
<text x="849" y="481" class="result-head" text-anchor="middle">P0 归约</text>
<text x="849" y="505" class="label" text-anchor="middle">本地 + 接收</text>
<rect x="798" y="517" width="100" height="76" rx="3" class="final"/>
<path d="M848 517 v76" class="cell-line"/>
<path d="M798 555 h100" class="cell-line"/>
<text x="823.0" y="543.22" class="number" text-anchor="middle">19</text>
<text x="873.0" y="543.22" class="number" text-anchor="middle">22</text>
<text x="823.0" y="581.22" class="number" text-anchor="middle">43</text>
<text x="873.0" y="581.22" class="number" text-anchor="middle">50</text>
<text x="849" y="620" class="result-head" text-anchor="middle">最终 Y</text>
<path d="M 604 501 H 747" class="arrow" marker-end="url(#arrowhead)"/>
<text x="675" y="489" class="label" text-anchor="middle">本地部分和</text>
<path d="M 604 610 H 693 V 583 H 747" class="transfer" marker-end="url(#arrowhead)"/>
<text x="675" y="640" class="warn" text-anchor="middle">P1 → P0</text>
<text x="675" y="660" class="warn" text-anchor="middle">发送 4 个元素</text>
<text x="29" y="688" class="note" text-anchor="start">接收条件：P0 必须取得 P1 对应的部分结果，才能得到完整的 Y。</text>
<text x="19" y="724" class="subtitle" text-anchor="start">箭头表示逻辑数据交付；具体通信路径、端口及归约实现由硬件决定。</text>
</svg>
