<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-labelledby="f01-engine-title f01-engine-desc">
  <title id="f01-engine-title">三个执行引擎通过片上缓冲槽交付数据</title>
  <desc id="f01-engine-desc">外部内存中的输入块 A0、A1、A2 经搬入引擎 L 写入片上输入槽 I0 或可增设的 I1。计算引擎 C 从输入槽读取相应输入块，与已经驻留的权重矩阵 B 相乘，将得到的结果块写入输出槽 O0 或 O1。写回引擎 W 读取输出槽，将 Y0、Y1、Y2 传回外部内存。三个引擎可以各自推进自己的工作，但图中的箭头仅表示逻辑数据路径，实际存储和通信资源可能共享；能否同时访问由硬件条件决定。</desc>
  <defs>
    <marker id="f01-data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.strong{font-size:19px;font-weight:700}.note{font-size:16px;fill:#4f695a}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.4}
      .engine{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.6}
      .slot{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}
      .optional{fill:#f2e8d3;stroke:#b6a073;stroke-dasharray:5 4;stroke-width:1.4}
      .weight{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .data{fill:none;stroke:#376a55;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#f01-data-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="508" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="34" class="head">沿着一个矩阵分块追踪搬入、计算与写回</text>
  <text x="22" y="59" class="note">每个输入块 Aᵢ 与同一权重 B 相乘，得到结果块 Yᵢ。</text>

  <rect x="22" y="82" width="174" height="106" rx="9" class="panel"/>
  <text x="109" y="109" class="strong" text-anchor="middle">外部内存</text>
  <text x="109" y="129" class="note" text-anchor="middle">输入区</text>
  <g text-anchor="middle">
    <rect x="32" y="143" width="47" height="32" rx="4" class="slot"/><text x="55.5" y="165">A0</text>
    <rect x="86" y="143" width="47" height="32" rx="4" class="slot"/><text x="109.5" y="165">A1</text>
    <rect x="140" y="143" width="46" height="32" rx="4" class="slot"/><text x="163" y="165">A2</text>
  </g>
  <path d="M196 135H225" class="data"/>

  <rect x="229" y="82" width="151" height="106" rx="9" class="engine"/>
  <text x="304.5" y="124" class="strong" text-anchor="middle">搬入引擎 L</text>
  <text x="304.5" y="153" class="note" text-anchor="middle">写入输入槽</text>
  <path d="M380 135H410" class="data"/>

  <rect x="414" y="82" width="324" height="106" rx="9" class="panel"/>
  <text x="576" y="109" class="strong" text-anchor="middle">片上输入缓冲区</text>
  <rect x="428" y="125" width="141" height="50" rx="6" class="slot"/>
  <text x="498.5" y="147" class="strong" text-anchor="middle">I0</text>
  <text x="498.5" y="166" class="note" text-anchor="middle">一个数据块</text>
  <rect x="583" y="125" width="141" height="50" rx="6" class="optional"/>
  <text x="653.5" y="147" class="strong" text-anchor="middle">I1</text>
  <text x="653.5" y="166" class="note" text-anchor="middle">可增设第二槽</text>
  <path d="M576 188V223" class="data"/>
  <text x="594" y="211" class="note">读取 Aᵢ</text>

  <rect x="229" y="227" width="184" height="78" rx="8" class="weight"/>
  <text x="321" y="257" class="strong" text-anchor="middle">权重 B</text>
  <text x="321" y="282" class="note" text-anchor="middle">已预先驻留</text>
  <path d="M413 266H468" class="data"/>
  <rect x="472" y="227" width="208" height="78" rx="9" class="engine"/>
  <text x="576" y="257" class="strong" text-anchor="middle">计算引擎 C</text>
  <text x="576" y="282" class="note" text-anchor="middle">Yᵢ = Aᵢ × B</text>
  <path d="M576 305V340" class="data"/>
  <text x="594" y="328" class="note">写入 Yᵢ</text>

  <rect x="414" y="344" width="324" height="106" rx="9" class="panel"/>
  <text x="576" y="371" text-anchor="middle" class="strong">片上输出缓冲区</text>
  <rect x="428" y="387" width="141" height="50" rx="6" class="slot"/>
  <text x="498.5" y="409" text-anchor="middle" class="strong">O0</text>
  <text x="498.5" y="428" text-anchor="middle" class="note">一个结果块</text>
  <rect x="583" y="387" width="141" height="50" rx="6" class="slot"/>
  <text x="653.5" y="409" text-anchor="middle" class="strong">O1</text>
  <text x="653.5" y="428" text-anchor="middle" class="note">一个结果块</text>
  <path d="M414 397H384" class="data"/>

  <rect x="229" y="344" width="151" height="106" rx="9" class="engine"/>
  <text x="304.5" y="386" text-anchor="middle" class="strong">写回引擎 W</text>
  <text x="304.5" y="415" text-anchor="middle" class="note">读出结果块</text>
  <path d="M229 397H200" class="data"/>

  <rect x="22" y="344" width="174" height="106" rx="9" class="panel"/>
  <text x="109" y="371" text-anchor="middle" class="strong">外部内存</text>
  <text x="109" y="391" text-anchor="middle" class="note">结果区</text>
  <g text-anchor="middle">
    <rect x="32" y="405" width="47" height="32" rx="4" class="slot"/><text x="55.5" y="427">Y0</text>
    <rect x="86" y="405" width="47" height="32" rx="4" class="slot"/><text x="109.5" y="427">Y1</text>
    <rect x="140" y="405" width="46" height="32" rx="4" class="slot"/><text x="163" y="427">Y2</text>
  </g>

  <path d="M22 468H738" stroke="#c4d0c4"/>
  <text x="22" y="490" class="note">箭头表示逻辑数据路径，不表示各路径拥有独立的物理端口。</text>
</svg>
