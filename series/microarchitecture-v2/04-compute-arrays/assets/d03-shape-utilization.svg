<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" role="img" aria-labelledby="title desc">
<title id="title">阵列更大，不代表逻辑输出更多</title>
<desc id="desc">固定 Y 为 2×2，K=4，采用广播 OS，每个有效 PE 负责一个 Y[i,j]。2×2、2×4、4×4 阵列都只使用左上四个 PE，理想供数下均需4个计算拍、16次有效MAC；对应峰值4、8、16 MAC/拍，槽位利用率100%、50%、25%。</desc>
<defs><style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.heading{font-size:22px;font-weight:700}.label{font-weight:700}.sub{font-size:16px}.tiny{font-size:14px}.micro{font-size:12px}.accent{fill:#815718}.muted{fill:#58736a}.partial{fill:#355679}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}
.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.weight{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
.psum{fill:#e4edf5;stroke:#8ba6c0;stroke-width:1.4}.off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
.line{stroke:#c7d3c7;stroke-width:1.1}
</style></defs>
<rect x="1" y="1" width="758" height="436" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="22" y="34" class="heading" text-anchor="start">同一个 2×2 的 Y，放到三种物理阵列里</text>
<text x="22" y="60" class="sub" text-anchor="start">每个有效 PE 负责一个输出位置；K = 4，广播 OS、供数充足。</text>
<rect x="22" y="80" width="232" height="296" rx="7" class="panel"/>
<text x="138" y="106" class="label" text-anchor="middle">2×2 物理阵列</text>
<rect x="51" y="126" width="40" height="40" rx="5" class="block"/>
<text x="71" y="151" class="tiny label" text-anchor="middle">Y00</text>
<rect x="95" y="126" width="40" height="40" rx="5" class="block"/>
<text x="115" y="151" class="tiny label" text-anchor="middle">Y01</text>
<rect x="51" y="170" width="40" height="40" rx="5" class="block"/>
<text x="71" y="195" class="tiny label" text-anchor="middle">Y10</text>
<rect x="95" y="170" width="40" height="40" rx="5" class="block"/>
<text x="115" y="195" class="tiny label" text-anchor="middle">Y11</text>
<text x="138" y="323" class="sub" text-anchor="middle">峰值 4 MAC/拍</text>
<text x="138" y="347" class="sub label" text-anchor="middle">有效 4 MAC/拍</text>
<text x="138" y="368" class="sub label partial" text-anchor="middle">槽位利用率 100%</text>
<rect x="264" y="80" width="232" height="296" rx="7" class="panel"/>
<text x="380" y="106" class="label" text-anchor="middle">2×4 物理阵列</text>
<rect x="293" y="126" width="40" height="40" rx="5" class="block"/>
<text x="313" y="151" class="tiny label" text-anchor="middle">Y00</text>
<rect x="337" y="126" width="40" height="40" rx="5" class="block"/>
<text x="357" y="151" class="tiny label" text-anchor="middle">Y01</text>
<rect x="381" y="126" width="40" height="40" rx="5" class="off"/>
<text x="401" y="151" class="tiny muted" text-anchor="middle">—</text>
<rect x="425" y="126" width="40" height="40" rx="5" class="off"/>
<text x="445" y="151" class="tiny muted" text-anchor="middle">—</text>
<rect x="293" y="170" width="40" height="40" rx="5" class="block"/>
<text x="313" y="195" class="tiny label" text-anchor="middle">Y10</text>
<rect x="337" y="170" width="40" height="40" rx="5" class="block"/>
<text x="357" y="195" class="tiny label" text-anchor="middle">Y11</text>
<rect x="381" y="170" width="40" height="40" rx="5" class="off"/>
<text x="401" y="195" class="tiny muted" text-anchor="middle">—</text>
<rect x="425" y="170" width="40" height="40" rx="5" class="off"/>
<text x="445" y="195" class="tiny muted" text-anchor="middle">—</text>
<text x="380" y="323" class="sub" text-anchor="middle">峰值 8 MAC/拍</text>
<text x="380" y="347" class="sub label" text-anchor="middle">有效 4 MAC/拍</text>
<text x="380" y="368" class="sub label partial" text-anchor="middle">槽位利用率 50%</text>
<rect x="506" y="80" width="232" height="296" rx="7" class="panel"/>
<text x="622" y="106" class="label" text-anchor="middle">4×4 物理阵列</text>
<rect x="535" y="126" width="40" height="40" rx="5" class="block"/>
<text x="555" y="151" class="tiny label" text-anchor="middle">Y00</text>
<rect x="579" y="126" width="40" height="40" rx="5" class="block"/>
<text x="599" y="151" class="tiny label" text-anchor="middle">Y01</text>
<rect x="623" y="126" width="40" height="40" rx="5" class="off"/>
<text x="643" y="151" class="tiny muted" text-anchor="middle">—</text>
<rect x="667" y="126" width="40" height="40" rx="5" class="off"/>
<text x="687" y="151" class="tiny muted" text-anchor="middle">—</text>
<rect x="535" y="170" width="40" height="40" rx="5" class="block"/>
<text x="555" y="195" class="tiny label" text-anchor="middle">Y10</text>
<rect x="579" y="170" width="40" height="40" rx="5" class="block"/>
<text x="599" y="195" class="tiny label" text-anchor="middle">Y11</text>
<rect x="623" y="170" width="40" height="40" rx="5" class="off"/>
<text x="643" y="195" class="tiny muted" text-anchor="middle">—</text>
<rect x="667" y="170" width="40" height="40" rx="5" class="off"/>
<text x="687" y="195" class="tiny muted" text-anchor="middle">—</text>
<rect x="535" y="214" width="40" height="40" rx="5" class="off"/>
<text x="555" y="239" class="tiny muted" text-anchor="middle">—</text>
<rect x="579" y="214" width="40" height="40" rx="5" class="off"/>
<text x="599" y="239" class="tiny muted" text-anchor="middle">—</text>
<rect x="623" y="214" width="40" height="40" rx="5" class="off"/>
<text x="643" y="239" class="tiny muted" text-anchor="middle">—</text>
<rect x="667" y="214" width="40" height="40" rx="5" class="off"/>
<text x="687" y="239" class="tiny muted" text-anchor="middle">—</text>
<rect x="535" y="258" width="40" height="40" rx="5" class="off"/>
<text x="555" y="283" class="tiny muted" text-anchor="middle">—</text>
<rect x="579" y="258" width="40" height="40" rx="5" class="off"/>
<text x="599" y="283" class="tiny muted" text-anchor="middle">—</text>
<rect x="623" y="258" width="40" height="40" rx="5" class="off"/>
<text x="643" y="283" class="tiny muted" text-anchor="middle">—</text>
<rect x="667" y="258" width="40" height="40" rx="5" class="off"/>
<text x="687" y="283" class="tiny muted" text-anchor="middle">—</text>
<text x="622" y="323" class="sub" text-anchor="middle">峰值 16 MAC/拍</text>
<text x="622" y="347" class="sub label" text-anchor="middle">有效 4 MAC/拍</text>
<text x="622" y="368" class="sub label partial" text-anchor="middle">槽位利用率 25%</text>
<rect x="22" y="390" width="18" height="18" rx="4" class="block"/>
<text x="48" y="404" class="tiny" text-anchor="start">有效输出位置</text>
<rect x="208" y="390" width="18" height="18" rx="4" class="off"/>
<text x="234" y="404" class="tiny" text-anchor="start">无有效工作</text>
<text x="738" y="420" class="sub label" text-anchor="end">三种均为 16 次有效 MAC · 4 个计算拍</text>
</svg>
