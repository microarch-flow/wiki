<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 637" width="760" height="637" role="img" aria-labelledby="title desc">
<title id="title">相邻 PE 通过输入寄存器逐拍传递操作数</title>
<desc id="desc">X 从左进入、每拍向右移一格，W 从上进入、每拍向下移一格。行 0 和列 0 在第 1 拍开始输入，行 1 和列 1 从第 2 拍开始。各 PE 在当前拍使用本地寄存器的 X、W 执行 MAC，同时后一邻居在拍末接收旧值；新的邻居值在下一拍参与运算。每个 PE 的部分和留在本地 ACC。</desc>
<defs>
<marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
<marker id="weight-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.heading{font-size:22px;font-weight:700}.sub{font-size:16px}.tiny{font-size:14px}.label{font-weight:700}
.accent{fill:#815718}.muted{fill:#58736a}.label.accent{fill:#815718}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}
.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
.data,.weight{stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.data{stroke:#376650;marker-end:url(#data-arrow)}.weight{stroke:#9b6c27;marker-end:url(#weight-arrow)}
.bus{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.wbus{stroke:#9b6c27;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.divider{stroke:#c7d3c7;stroke-width:1.1}.off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
</style>
</defs>
<rect x="1" y="1" width="758" height="635" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="22" y="34" class="heading" text-anchor="start">相邻传递：每条局部连线让数据移动一格</text>
<text x="22" y="60" class="sub" text-anchor="start">入口按顺序送入元素，相邻行或列的入口错开一拍。</text>
<rect x="184" y="79" width="220" height="62" rx="7" class="control"/>
<text x="294" y="100" class="sub label accent" text-anchor="middle">W[:,0] · 第 1 拍起</text>
<text x="294" y="125" class="sub accent" text-anchor="middle">3, 5, 2, 1</text>
<path d="M294 141V166" class="weight"/>
<rect x="494" y="79" width="220" height="62" rx="7" class="control"/>
<text x="604" y="100" class="sub label accent" text-anchor="middle">W[:,1] · 第 2 拍起</text>
<text x="604" y="125" class="sub accent" text-anchor="middle">1, 2, 3, 4</text>
<path d="M604 141V166" class="weight"/>
<rect x="18" y="191" width="130" height="66" rx="7" class="reg"/>
<text x="83" y="213" class="tiny label" text-anchor="middle">X[0,:] · 第 1 拍起</text>
<text x="83" y="237" class="sub" text-anchor="middle">2, 1, 3, 4</text>
<path d="M148 221H180" class="data"/>
<rect x="18" y="419" width="130" height="66" rx="7" class="reg"/>
<text x="83" y="441" class="tiny label" text-anchor="middle">X[1,:] · 第 2 拍起</text>
<text x="83" y="465" class="sub" text-anchor="middle">1, 2, 1, 2</text>
<path d="M148 449H180" class="data"/>
<rect x="180" y="166" width="228" height="160" rx="7" class="panel"/>
<text x="294" y="193" class="label" text-anchor="middle">PE(0,0) → Y[0,0]</text>
<rect x="196" y="205" width="90" height="32" rx="7" class="reg"/>
<text x="241" y="226" class="tiny label" text-anchor="middle">X 寄存器</text>
<rect x="302" y="205" width="90" height="32" rx="7" class="control"/>
<text x="347" y="226" class="tiny label accent" text-anchor="middle">W 寄存器</text>
<path d="M241 237V252H275" class="data"/>
<path d="M347 237V252H313" class="weight"/>
<rect x="243" y="252" width="102" height="26" rx="7" class="block"/>
<text x="294" y="271" class="tiny label" text-anchor="middle">MAC</text>
<path d="M294 278V288" class="data"/>
<rect x="196" y="288" width="196" height="28" rx="7" class="reg"/>
<text x="294" y="307" class="tiny label" text-anchor="middle">本地 ACC 保存部分和</text>
<rect x="490" y="166" width="228" height="160" rx="7" class="panel"/>
<text x="604" y="193" class="label" text-anchor="middle">PE(0,1) → Y[0,1]</text>
<rect x="506" y="205" width="90" height="32" rx="7" class="reg"/>
<text x="551" y="226" class="tiny label" text-anchor="middle">X 寄存器</text>
<rect x="612" y="205" width="90" height="32" rx="7" class="control"/>
<text x="657" y="226" class="tiny label accent" text-anchor="middle">W 寄存器</text>
<path d="M551 237V252H585" class="data"/>
<path d="M657 237V252H623" class="weight"/>
<rect x="553" y="252" width="102" height="26" rx="7" class="block"/>
<text x="604" y="271" class="tiny label" text-anchor="middle">MAC</text>
<path d="M604 278V288" class="data"/>
<rect x="506" y="288" width="196" height="28" rx="7" class="reg"/>
<text x="604" y="307" class="tiny label" text-anchor="middle">本地 ACC 保存部分和</text>
<rect x="180" y="394" width="228" height="160" rx="7" class="panel"/>
<text x="294" y="421" class="label" text-anchor="middle">PE(1,0) → Y[1,0]</text>
<rect x="196" y="433" width="90" height="32" rx="7" class="reg"/>
<text x="241" y="454" class="tiny label" text-anchor="middle">X 寄存器</text>
<rect x="302" y="433" width="90" height="32" rx="7" class="control"/>
<text x="347" y="454" class="tiny label accent" text-anchor="middle">W 寄存器</text>
<path d="M241 465V480H275" class="data"/>
<path d="M347 465V480H313" class="weight"/>
<rect x="243" y="480" width="102" height="26" rx="7" class="block"/>
<text x="294" y="499" class="tiny label" text-anchor="middle">MAC</text>
<path d="M294 506V516" class="data"/>
<rect x="196" y="516" width="196" height="28" rx="7" class="reg"/>
<text x="294" y="535" class="tiny label" text-anchor="middle">本地 ACC 保存部分和</text>
<rect x="490" y="394" width="228" height="160" rx="7" class="panel"/>
<text x="604" y="421" class="label" text-anchor="middle">PE(1,1) → Y[1,1]</text>
<rect x="506" y="433" width="90" height="32" rx="7" class="reg"/>
<text x="551" y="454" class="tiny label" text-anchor="middle">X 寄存器</text>
<rect x="612" y="433" width="90" height="32" rx="7" class="control"/>
<text x="657" y="454" class="tiny label accent" text-anchor="middle">W 寄存器</text>
<path d="M551 465V480H585" class="data"/>
<path d="M657 465V480H623" class="weight"/>
<rect x="553" y="480" width="102" height="26" rx="7" class="block"/>
<text x="604" y="499" class="tiny label" text-anchor="middle">MAC</text>
<path d="M604 506V516" class="data"/>
<rect x="506" y="516" width="196" height="28" rx="7" class="reg"/>
<text x="604" y="535" class="tiny label" text-anchor="middle">本地 ACC 保存部分和</text>
<path d="M408 221H490" class="data"/>
<text x="449" y="210" class="tiny label" text-anchor="middle">X</text>
<text x="449" y="240" class="tiny muted" text-anchor="middle">下一拍</text>
<path d="M408 449H490" class="data"/>
<text x="449" y="438" class="tiny label" text-anchor="middle">X</text>
<text x="449" y="468" class="tiny muted" text-anchor="middle">下一拍</text>
<path d="M294 326V394" class="weight"/>
<text x="305" y="352" class="tiny label accent" text-anchor="start">W</text>
<text x="305" y="374" class="tiny accent" text-anchor="start">下一拍</text>
<path d="M604 326V394" class="weight"/>
<text x="615" y="352" class="tiny label accent" text-anchor="start">W</text>
<text x="615" y="374" class="tiny accent" text-anchor="start">下一拍</text>
<rect x="18" y="570" width="720" height="48" rx="7" class="control"/>
<text x="378" y="589" class="tiny label" text-anchor="middle">箭头：本拍寄存器的旧 Q → 邻居寄存器 D，拍末采样。</text>
<text x="378" y="608" class="tiny accent" text-anchor="middle">邻居下一拍才使用这一值；图中省略 PE 内转发线与 ACC 反馈线。</text>
</svg>
