<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" width="760" height="455" role="img" aria-labelledby="title desc">
<title id="title">结果写出也占用时间，计算结束并不等于交付结束</title>
<desc id="desc">2×2 OS，结果数值为21、29、17、16。每项10 bit，输出独立端口每拍只能交付一项，等所有ACC完成后按行优先排出。4元素输入源每拍时 MAC t2..5，E5计算结束，t6..9输出，E9全部交付；2元素每拍时 MAC t3,5,7,9，E9计算结束，t10..13输出，E13交付。</desc>
