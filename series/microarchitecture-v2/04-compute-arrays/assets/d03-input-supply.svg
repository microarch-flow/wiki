<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" role="img" aria-labelledby="title desc">
<title id="title">输入源每拍能送多少元素，决定计算节奏</title>
<desc id="desc">2×2 OS，每个 k 需要两个 X 和两个 W，各 4 bit。输入暂存四项。本拍末捕获源数据，MAC 使用拍初已完整的旧组。4元素/拍时t1..4装k0..k3，t2..5 MAC。2元素/拍时Xk和Wk分两拍装入，t1..8送数，t3,5,7,9 MAC。</desc>
<defs><style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.heading{font-size:22px;font-weight:700}.label{font-weight:700}.sub{font-size:16px}.tiny{font-size:14px}.micro{font-size:12px}.accent{fill:#815718}.muted{fill:#58736a}.partial{fill:#355679}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}
.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.weight{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
.psum{fill:#e4edf5;stroke:#8ba6c0;stroke-width:1.4}.off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
.line{stroke:#c7d3c7;stroke-width:1.1}
</style></defs>
<rect x="1" y="1" width="758" height="482" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="22" y="34" class="heading" text-anchor="start">暂存数据要等到下一拍才能被计算使用</text>
<text x="22" y="60" class="sub" text-anchor="start">2×2 广播 OS · 每个 k 需要 2 个 X + 2 个 W，共 16 bit。</text>
<rect x="22" y="79" width="716" height="76" rx="7" class="panel"/>
<text x="41" y="103" class="sub label" text-anchor="start">输入暂存槽</text>
<text x="41" y="130" class="tiny muted" text-anchor="start">每项 4 bit</text>
<rect x="182" y="97" width="120" height="38" rx="6" class="reg"/>
<text x="242" y="122" class="sub label" text-anchor="middle">X[0,k]</text>
<rect x="315" y="97" width="120" height="38" rx="6" class="reg"/>
<text x="375" y="122" class="sub label" text-anchor="middle">X[1,k]</text>
<rect x="448" y="97" width="120" height="38" rx="6" class="weight"/>
<text x="508" y="122" class="sub label" text-anchor="middle">W[k,0]</text>
<rect x="581" y="97" width="120" height="38" rx="6" class="weight"/>
<text x="641" y="122" class="sub label" text-anchor="middle">W[k,1]</text>
<rect x="22" y="168" width="716" height="124" rx="7" class="panel"/>
<text x="38" y="191" class="sub label" text-anchor="start">输入源 16 bit/拍（4 元素/拍）</text>
<text x="86" y="217" class="tiny" text-anchor="middle">拍 t</text>
<text x="182.0" y="217" class="tiny label" text-anchor="middle">1</text>
<text x="245.0" y="217" class="tiny label" text-anchor="middle">2</text>
<text x="308.0" y="217" class="tiny label" text-anchor="middle">3</text>
<text x="371.0" y="217" class="tiny label" text-anchor="middle">4</text>
<text x="434.0" y="217" class="tiny label" text-anchor="middle">5</text>
<text x="497.0" y="217" class="tiny label" text-anchor="middle">6</text>
<text x="560.0" y="217" class="tiny label" text-anchor="middle">7</text>
<text x="623.0" y="217" class="tiny label" text-anchor="middle">8</text>
<text x="686.0" y="217" class="tiny label" text-anchor="middle">9</text>
<text x="86" y="242" class="tiny" text-anchor="middle">送数 → 暂存</text>
<rect x="153" y="224" width="58" height="28" rx="5" class="weight"/>
<text x="182.0" y="243" class="tiny label" text-anchor="middle">k0</text>
<rect x="216" y="224" width="58" height="28" rx="5" class="weight"/>
<text x="245.0" y="243" class="tiny label" text-anchor="middle">k1</text>
<rect x="279" y="224" width="58" height="28" rx="5" class="weight"/>
<text x="308.0" y="243" class="tiny label" text-anchor="middle">k2</text>
<rect x="342" y="224" width="58" height="28" rx="5" class="weight"/>
<text x="371.0" y="243" class="tiny label" text-anchor="middle">k3</text>
<rect x="405" y="224" width="58" height="28" rx="5" class="off"/>
<text x="434.0" y="243" class="tiny muted" text-anchor="middle">—</text>
<rect x="468" y="224" width="58" height="28" rx="5" class="off"/>
<text x="497.0" y="243" class="tiny muted" text-anchor="middle">—</text>
<rect x="531" y="224" width="58" height="28" rx="5" class="off"/>
<text x="560.0" y="243" class="tiny muted" text-anchor="middle">—</text>
<rect x="594" y="224" width="58" height="28" rx="5" class="off"/>
<text x="623.0" y="243" class="tiny muted" text-anchor="middle">—</text>
<rect x="657" y="224" width="58" height="28" rx="5" class="off"/>
<text x="686.0" y="243" class="tiny muted" text-anchor="middle">—</text>
<text x="86" y="274" class="tiny" text-anchor="middle">有效 MAC</text>
<rect x="153" y="256" width="58" height="28" rx="5" class="off"/>
<text x="182.0" y="275" class="tiny muted" text-anchor="middle">—</text>
<rect x="216" y="256" width="58" height="28" rx="5" class="block"/>
<text x="245.0" y="275" class="tiny label" text-anchor="middle">k0 ×4</text>
<rect x="279" y="256" width="58" height="28" rx="5" class="block"/>
<text x="308.0" y="275" class="tiny label" text-anchor="middle">k1 ×4</text>
<rect x="342" y="256" width="58" height="28" rx="5" class="block"/>
<text x="371.0" y="275" class="tiny label" text-anchor="middle">k2 ×4</text>
<rect x="405" y="256" width="58" height="28" rx="5" class="block"/>
<text x="434.0" y="275" class="tiny label" text-anchor="middle">k3 ×4</text>
<rect x="468" y="256" width="58" height="28" rx="5" class="off"/>
<text x="497.0" y="275" class="tiny muted" text-anchor="middle">—</text>
<rect x="531" y="256" width="58" height="28" rx="5" class="off"/>
<text x="560.0" y="275" class="tiny muted" text-anchor="middle">—</text>
<rect x="594" y="256" width="58" height="28" rx="5" class="off"/>
<text x="623.0" y="275" class="tiny muted" text-anchor="middle">—</text>
<rect x="657" y="256" width="58" height="28" rx="5" class="off"/>
<text x="686.0" y="275" class="tiny muted" text-anchor="middle">—</text>
<rect x="22" y="304" width="716" height="124" rx="7" class="panel"/>
<text x="38" y="327" class="sub label" text-anchor="start">输入源 8 bit/拍（2 元素/拍）</text>
<text x="86" y="353" class="tiny" text-anchor="middle">拍 t</text>
<text x="182.0" y="353" class="tiny label" text-anchor="middle">1</text>
<text x="245.0" y="353" class="tiny label" text-anchor="middle">2</text>
<text x="308.0" y="353" class="tiny label" text-anchor="middle">3</text>
<text x="371.0" y="353" class="tiny label" text-anchor="middle">4</text>
<text x="434.0" y="353" class="tiny label" text-anchor="middle">5</text>
<text x="497.0" y="353" class="tiny label" text-anchor="middle">6</text>
<text x="560.0" y="353" class="tiny label" text-anchor="middle">7</text>
<text x="623.0" y="353" class="tiny label" text-anchor="middle">8</text>
<text x="686.0" y="353" class="tiny label" text-anchor="middle">9</text>
<text x="86" y="378" class="tiny" text-anchor="middle">送数 → 暂存</text>
<rect x="153" y="360" width="58" height="28" rx="5" class="reg"/>
<text x="182.0" y="379" class="tiny label" text-anchor="middle">X · k0</text>
<rect x="216" y="360" width="58" height="28" rx="5" class="weight"/>
<text x="245.0" y="379" class="tiny label" text-anchor="middle">W · k0</text>
<rect x="279" y="360" width="58" height="28" rx="5" class="reg"/>
<text x="308.0" y="379" class="tiny label" text-anchor="middle">X · k1</text>
<rect x="342" y="360" width="58" height="28" rx="5" class="weight"/>
<text x="371.0" y="379" class="tiny label" text-anchor="middle">W · k1</text>
<rect x="405" y="360" width="58" height="28" rx="5" class="reg"/>
<text x="434.0" y="379" class="tiny label" text-anchor="middle">X · k2</text>
<rect x="468" y="360" width="58" height="28" rx="5" class="weight"/>
<text x="497.0" y="379" class="tiny label" text-anchor="middle">W · k2</text>
<rect x="531" y="360" width="58" height="28" rx="5" class="reg"/>
<text x="560.0" y="379" class="tiny label" text-anchor="middle">X · k3</text>
<rect x="594" y="360" width="58" height="28" rx="5" class="weight"/>
<text x="623.0" y="379" class="tiny label" text-anchor="middle">W · k3</text>
<rect x="657" y="360" width="58" height="28" rx="5" class="off"/>
<text x="686.0" y="379" class="tiny muted" text-anchor="middle">—</text>
<text x="86" y="410" class="tiny" text-anchor="middle">有效 MAC</text>
<rect x="153" y="392" width="58" height="28" rx="5" class="off"/>
<text x="182.0" y="411" class="tiny muted" text-anchor="middle">—</text>
<rect x="216" y="392" width="58" height="28" rx="5" class="off"/>
<text x="245.0" y="411" class="tiny muted" text-anchor="middle">—</text>
<rect x="279" y="392" width="58" height="28" rx="5" class="block"/>
<text x="308.0" y="411" class="tiny label" text-anchor="middle">k0 ×4</text>
<rect x="342" y="392" width="58" height="28" rx="5" class="off"/>
<text x="371.0" y="411" class="tiny muted" text-anchor="middle">—</text>
<rect x="405" y="392" width="58" height="28" rx="5" class="block"/>
<text x="434.0" y="411" class="tiny label" text-anchor="middle">k1 ×4</text>
<rect x="468" y="392" width="58" height="28" rx="5" class="off"/>
<text x="497.0" y="411" class="tiny muted" text-anchor="middle">—</text>
<rect x="531" y="392" width="58" height="28" rx="5" class="block"/>
<text x="560.0" y="411" class="tiny label" text-anchor="middle">k2 ×4</text>
<rect x="594" y="392" width="58" height="28" rx="5" class="off"/>
<text x="623.0" y="411" class="tiny muted" text-anchor="middle">—</text>
<rect x="657" y="392" width="58" height="28" rx="5" class="block"/>
<text x="686.0" y="411" class="tiny label" text-anchor="middle">k3 ×4</text>
<text x="22" y="451" class="tiny muted" text-anchor="start">送数和 MAC 可以发生在同一拍：旧 Q 本拍供 MAC，新输入在 Eₜ 才采入。</text>
<text x="22" y="472" class="tiny muted" text-anchor="start">X · k / W · k 表示该 k 的两个 X / W；每个非空 MAC 格执行 4 次有效 MAC。</text>
</svg>
