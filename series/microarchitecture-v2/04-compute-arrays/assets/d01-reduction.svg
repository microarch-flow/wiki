<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="title desc">
<title id="title">四个 PE 分摊同一输出的四项乘积，再合并中间结果</title>
<desc id="desc">PE0 至 PE3 分别计算 k=0,1,2,3 的乘积 6、5、6、4；两个加法器分别合并为 11 和 10，再由第三个加法器产生 21。示意逻辑归约层次，并不规定各层周期数。</desc>
<defs>
<marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
<marker id="weight-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.heading{font-size:22px;font-weight:700}.sub{font-size:16px}.tiny{font-size:14px}.label{font-weight:700}
.accent{fill:#815718}.muted{fill:#58736a}.label.accent{fill:#815718}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}
.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
.data,.weight{stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.data{stroke:#376650;marker-end:url(#data-arrow)}.weight{stroke:#9b6c27;marker-end:url(#weight-arrow)}
.bus{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.wbus{stroke:#9b6c27;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.divider{stroke:#c7d3c7;stroke-width:1.1}.off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
</style>
</defs>
<rect x="1" y="1" width="758" height="488" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="22" y="35" class="heading" text-anchor="start">将同一个输出 Y[0,0] 沿 k 拆给四个 PE</text>
<text x="22" y="63" class="sub" text-anchor="start">四个 PE 并行执行；另需三处加法路径合并结果。</text>
<rect x="36" y="88" width="136" height="96" rx="7" class="block"/>
<text x="104" y="113" class="label" text-anchor="middle">PE0 · k=0</text>
<text x="104" y="142" class="label" text-anchor="middle">2 × 3 = 6</text>
<text x="104" y="168" class="sub" text-anchor="middle">部分和 6</text>
<rect x="220" y="88" width="136" height="96" rx="7" class="block"/>
<text x="288" y="113" class="label" text-anchor="middle">PE1 · k=1</text>
<text x="288" y="142" class="label" text-anchor="middle">1 × 5 = 5</text>
<text x="288" y="168" class="sub" text-anchor="middle">部分和 5</text>
<rect x="404" y="88" width="136" height="96" rx="7" class="block"/>
<text x="472" y="113" class="label" text-anchor="middle">PE2 · k=2</text>
<text x="472" y="142" class="label" text-anchor="middle">3 × 2 = 6</text>
<text x="472" y="168" class="sub" text-anchor="middle">部分和 6</text>
<rect x="588" y="88" width="136" height="96" rx="7" class="block"/>
<text x="656" y="113" class="label" text-anchor="middle">PE3 · k=3</text>
<text x="656" y="142" class="label" text-anchor="middle">4 × 1 = 4</text>
<text x="656" y="168" class="sub" text-anchor="middle">部分和 4</text>
<path d="M104 184V211H154V234" class="data"/>
<text x="104" y="205" class="tiny" text-anchor="start">6</text>
<path d="M288 184V211H238V234" class="data"/>
<text x="288" y="205" class="tiny" text-anchor="start">5</text>
<path d="M472 184V211H522V234" class="data"/>
<text x="472" y="205" class="tiny" text-anchor="start">6</text>
<path d="M656 184V211H606V234" class="data"/>
<text x="656" y="205" class="tiny" text-anchor="start">4</text>
<rect x="119" y="234" width="154" height="63" rx="7" class="control"/>
<text x="196" y="257" class="sub" text-anchor="middle">归约加法器</text>
<text x="196" y="282" class="label" text-anchor="middle">6 + 5 = 11</text>
<rect x="487" y="234" width="154" height="63" rx="7" class="control"/>
<text x="564" y="257" class="sub" text-anchor="middle">归约加法器</text>
<text x="564" y="282" class="label" text-anchor="middle">6 + 4 = 10</text>
<path d="M196 297V324H338V348" class="data"/>
<path d="M564 297V324H422V348" class="data"/>
<rect x="303" y="348" width="154" height="63" rx="7" class="control"/>
<text x="380" y="371" class="sub" text-anchor="middle">归约加法器</text>
<text x="380" y="396" class="label" text-anchor="middle">11 + 10 = 21</text>
<path d="M380 411V428" class="data"/>
<rect x="298" y="428" width="164" height="36" rx="7" class="reg"/>
<text x="380" y="452" class="label" text-anchor="middle">Y[0,0] = 21</text>
<text x="22" y="227" class="tiny accent" text-anchor="start">两层加法依赖</text>
<text x="738" y="227" class="tiny accent" text-anchor="end">不等价于固定两拍</text>
</svg>
