<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="title desc">
  <title id="title">十项加法在四条物理通道上的三拍执行</title>
  <desc id="desc">假设教学执行通路能每拍读入至多四组操作数，并在下一个上升沿写回所有有效结果；不考虑额外访存、流水级或端口冲突。E0 到 E1，lane 0 至 3 执行元素 0 至 3，得到 11、22、33、44，E1 写回；E1 到 E2 执行元素 4 至 7，得到 55、66、77、88，E2 写回；E2 到 E3，只有 lane 0、1 处理元素 8、9，得到 99、110，另外两条通道本批不更新结果。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.label{font-weight:700}
      .accent{fill:#8a5d1c}.muted{fill:#58736a}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
      .ctrl{stroke:#9b6c27;stroke-width:1.8;stroke-dasharray:5 4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#ctrl-arrow)}
      .ctrl-bus{stroke:#9b6c27;stroke-width:1.8;stroke-dasharray:5 4;fill:none;stroke-linejoin:round}
      .divider{stroke:#c7d3c7;stroke-width:1.1}
      .slot{fill:#e0ebe3;stroke:#92ad9d;stroke-width:1.1}
      .off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
      .edge{stroke:#376650;stroke-width:1.25;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="488" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">同一组物理通道，分三拍执行十项加法</text>
  <text x="20" y="61" class="small">每拍接收一批就绪操作数；该拍右端的时钟沿写回有效结果。</text>
  <rect x="18" y="77" width="724" height="330" rx="10" class="panel"/>
  <rect x="29" y="160" width="79" height="43" rx="5" class="reg"/>
  <text x="68.5" y="186" class="small label" text-anchor="middle">lane 0</text>
  <rect x="29" y="212" width="79" height="43" rx="5" class="reg"/>
  <text x="68.5" y="238" class="small label" text-anchor="middle">lane 1</text>
  <rect x="29" y="264" width="79" height="43" rx="5" class="reg"/>
  <text x="68.5" y="290" class="small label" text-anchor="middle">lane 2</text>
  <rect x="29" y="316" width="79" height="43" rx="5" class="reg"/>
  <text x="68.5" y="342" class="small label" text-anchor="middle">lane 3</text>
  <text x="120" y="101" class="small label" text-anchor="middle">E0</text>
  <path d="M120 109V372" class="edge"/>
  <text x="322" y="101" class="small label" text-anchor="middle">E1</text>
  <path d="M322 109V372" class="edge"/>
  <text x="524" y="101" class="small label" text-anchor="middle">E2</text>
  <path d="M524 109V372" class="edge"/>
  <text x="726" y="101" class="small label" text-anchor="middle">E3</text>
  <path d="M726 109V372" class="edge"/>
  <text x="221.0" y="125" class="label" text-anchor="middle">第 1 批</text>
  <text x="221.0" y="146" class="tiny accent" text-anchor="middle">m = (1,1,1,1)</text>
  <rect x="128" y="160" width="186" height="43" rx="5" class="slot"/>
  <text x="221.0" y="177" class="tiny" text-anchor="middle">元素 0</text>
  <text x="221.0" y="197" class="small label" text-anchor="middle">1 + 10 = 11</text>
  <path d="M308 181H320" class="data"/>
  <rect x="128" y="212" width="186" height="43" rx="5" class="slot"/>
  <text x="221.0" y="229" class="tiny" text-anchor="middle">元素 1</text>
  <text x="221.0" y="249" class="small label" text-anchor="middle">2 + 20 = 22</text>
  <path d="M308 233H320" class="data"/>
  <rect x="128" y="264" width="186" height="43" rx="5" class="slot"/>
  <text x="221.0" y="281" class="tiny" text-anchor="middle">元素 2</text>
  <text x="221.0" y="301" class="small label" text-anchor="middle">3 + 30 = 33</text>
  <path d="M308 285H320" class="data"/>
  <rect x="128" y="316" width="186" height="43" rx="5" class="slot"/>
  <text x="221.0" y="333" class="tiny" text-anchor="middle">元素 3</text>
  <text x="221.0" y="353" class="small label" text-anchor="middle">4 + 40 = 44</text>
  <path d="M308 337H320" class="data"/>
  <text x="221.0" y="386" class="small label" text-anchor="middle">右端 E1：写回 Y[0…3]</text>
  <text x="423.0" y="125" class="label" text-anchor="middle">第 2 批</text>
  <text x="423.0" y="146" class="tiny accent" text-anchor="middle">m = (1,1,1,1)</text>
  <rect x="330" y="160" width="186" height="43" rx="5" class="slot"/>
  <text x="423.0" y="177" class="tiny" text-anchor="middle">元素 4</text>
  <text x="423.0" y="197" class="small label" text-anchor="middle">5 + 50 = 55</text>
  <path d="M510 181H522" class="data"/>
  <rect x="330" y="212" width="186" height="43" rx="5" class="slot"/>
  <text x="423.0" y="229" class="tiny" text-anchor="middle">元素 5</text>
  <text x="423.0" y="249" class="small label" text-anchor="middle">6 + 60 = 66</text>
  <path d="M510 233H522" class="data"/>
  <rect x="330" y="264" width="186" height="43" rx="5" class="slot"/>
  <text x="423.0" y="281" class="tiny" text-anchor="middle">元素 6</text>
  <text x="423.0" y="301" class="small label" text-anchor="middle">7 + 70 = 77</text>
  <path d="M510 285H522" class="data"/>
  <rect x="330" y="316" width="186" height="43" rx="5" class="slot"/>
  <text x="423.0" y="333" class="tiny" text-anchor="middle">元素 7</text>
  <text x="423.0" y="353" class="small label" text-anchor="middle">8 + 80 = 88</text>
  <path d="M510 337H522" class="data"/>
  <text x="423.0" y="386" class="small label" text-anchor="middle">右端 E2：写回 Y[4…7]</text>
  <text x="625.0" y="125" class="label" text-anchor="middle">第 3 批</text>
  <text x="625.0" y="146" class="tiny accent" text-anchor="middle">m = (1,1,0,0)</text>
  <rect x="532" y="160" width="186" height="43" rx="5" class="slot"/>
  <text x="625.0" y="177" class="tiny" text-anchor="middle">元素 8</text>
  <text x="625.0" y="197" class="small label" text-anchor="middle">9 + 90 = 99</text>
  <path d="M712 181H724" class="data"/>
  <rect x="532" y="212" width="186" height="43" rx="5" class="slot"/>
  <text x="625.0" y="229" class="tiny" text-anchor="middle">元素 9</text>
  <text x="625.0" y="249" class="small label" text-anchor="middle">10 + 100 = 110</text>
  <path d="M712 233H724" class="data"/>
  <rect x="532" y="264" width="186" height="43" rx="5" class="off"/>
  <text x="625.0" y="281" class="tiny accent" text-anchor="middle">无有效元素</text>
  <text x="625.0" y="299" class="small accent" text-anchor="middle">不写回</text>
  <rect x="532" y="316" width="186" height="43" rx="5" class="off"/>
  <text x="625.0" y="333" class="tiny accent" text-anchor="middle">无有效元素</text>
  <text x="625.0" y="351" class="small accent" text-anchor="middle">不写回</text>
  <text x="625.0" y="386" class="small label" text-anchor="middle">右端 E3：写回 Y[8…9]</text>
  <rect x="18" y="418" width="355" height="51" rx="7" class="slot"/>
  <rect x="386" y="418" width="356" height="51" rx="7" class="off"/>
  <text x="195.5" y="441" class="label" text-anchor="middle">有效元素：10 个</text>
  <text x="195.5" y="460" class="tiny" text-anchor="middle">绿色单元表示本拍有有效运算</text>
  <text x="564" y="441" class="label accent" text-anchor="middle">空闲位置：2 个</text>
  <text x="564" y="460" class="tiny accent" text-anchor="middle">虚线单元表示本拍无有效运算</text>
</svg>
