<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" width="760" height="704" role="img" aria-labelledby="title desc">
  <title id="title">十个逻辑线程如何共用四条物理执行通道</title>
  <desc id="desc">教学模型中 T0 到 T9 每个逻辑线程拥有自己的程序位置 P0、寄存器 rX、rW 和尚未写入的 rY。G0 包含 T0 到 T3，G1 包含 T4 到 T7，G2 包含 T8、T9 和两个不存在的槽位。调度器选择 G1 的 P0 ADD，一份运算控制传给四条物理通道，四个独立的加法得出 55、66、77、88，分别写入 T4 到 T7 的 rY。图中逻辑状态不是物理寄存器布局，也不表示线程独占物理执行通道。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.label{font-weight:700}
      .accent{fill:#8a5d1c}.muted{fill:#58736a}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
      .ctrl{stroke:#9b6c27;stroke-width:1.8;stroke-dasharray:5 4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#ctrl-arrow)}
      .ctrl-bus{stroke:#9b6c27;stroke-width:1.8;stroke-dasharray:5 4;fill:none;stroke-linejoin:round}
      .divider{stroke:#c7d3c7;stroke-width:1.1}
      .slot{fill:#e0ebe3;stroke:#92ad9d;stroke-width:1.1}
      .off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
      .edge{stroke:#376650;stroke-width:1.25;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="702" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">十个逻辑线程，如何共用四条物理通道？</text>
  <text x="20" y="61" class="small">每格表示独立的逻辑状态，并非独立的物理 PC 或 RF 电路。</text>
  <rect x="18" y="77" width="724" height="311" rx="10" class="panel"/>
  <text x="32" y="104" class="small label">组内槽位</text>
  <text x="174" y="104" class="small label" text-anchor="middle">0</text>
  <text x="322" y="104" class="small label" text-anchor="middle">1</text>
  <text x="470" y="104" class="small label" text-anchor="middle">2</text>
  <text x="618" y="104" class="small label" text-anchor="middle">3</text>
  <rect x="33" y="129" width="62" height="57" rx="6" class="reg"/>
  <text x="64" y="151" class="label" text-anchor="middle">G0</text>
  <text x="64" y="171" class="tiny" text-anchor="middle">候选</text>
  <rect x="107" y="119" width="134" height="77" rx="6" class="reg"/>
  <text x="174" y="139" class="label" text-anchor="middle">T0 · P0</text>
  <text x="174" y="159" class="tiny" text-anchor="middle">rX=1, rW=10</text>
  <text x="174" y="180" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="255" y="119" width="134" height="77" rx="6" class="reg"/>
  <text x="322" y="139" class="label" text-anchor="middle">T1 · P0</text>
  <text x="322" y="159" class="tiny" text-anchor="middle">rX=2, rW=20</text>
  <text x="322" y="180" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="403" y="119" width="134" height="77" rx="6" class="reg"/>
  <text x="470" y="139" class="label" text-anchor="middle">T2 · P0</text>
  <text x="470" y="159" class="tiny" text-anchor="middle">rX=3, rW=30</text>
  <text x="470" y="180" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="551" y="119" width="134" height="77" rx="6" class="reg"/>
  <text x="618" y="139" class="label" text-anchor="middle">T3 · P0</text>
  <text x="618" y="159" class="tiny" text-anchor="middle">rX=4, rW=40</text>
  <text x="618" y="180" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="25" y="203" width="704" height="83" rx="8" class="slot"/>
  <rect x="33" y="216" width="62" height="57" rx="6" class="control"/>
  <text x="64" y="238" class="label" text-anchor="middle">G1</text>
  <text x="64" y="258" class="tiny accent" text-anchor="middle">选中</text>
  <rect x="107" y="206" width="134" height="77" rx="6" class="block"/>
  <text x="174" y="226" class="label" text-anchor="middle">T4 · P0</text>
  <text x="174" y="246" class="tiny" text-anchor="middle">rX=5, rW=50</text>
  <text x="174" y="267" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="255" y="206" width="134" height="77" rx="6" class="block"/>
  <text x="322" y="226" class="label" text-anchor="middle">T5 · P0</text>
  <text x="322" y="246" class="tiny" text-anchor="middle">rX=6, rW=60</text>
  <text x="322" y="267" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="403" y="206" width="134" height="77" rx="6" class="block"/>
  <text x="470" y="226" class="label" text-anchor="middle">T6 · P0</text>
  <text x="470" y="246" class="tiny" text-anchor="middle">rX=7, rW=70</text>
  <text x="470" y="267" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="551" y="206" width="134" height="77" rx="6" class="block"/>
  <text x="618" y="226" class="label" text-anchor="middle">T7 · P0</text>
  <text x="618" y="246" class="tiny" text-anchor="middle">rX=8, rW=80</text>
  <text x="618" y="267" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="33" y="303" width="62" height="57" rx="6" class="reg"/>
  <text x="64" y="325" class="label" text-anchor="middle">G2</text>
  <text x="64" y="345" class="tiny" text-anchor="middle">候选</text>
  <rect x="107" y="293" width="134" height="77" rx="6" class="reg"/>
  <text x="174" y="313" class="label" text-anchor="middle">T8 · P0</text>
  <text x="174" y="333" class="tiny" text-anchor="middle">rX=9, rW=90</text>
  <text x="174" y="354" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="255" y="293" width="134" height="77" rx="6" class="reg"/>
  <text x="322" y="313" class="label" text-anchor="middle">T9 · P0</text>
  <text x="322" y="333" class="tiny" text-anchor="middle">rX=10, rW=100</text>
  <text x="322" y="354" class="tiny muted" text-anchor="middle">rY 未写入</text>
  <rect x="403" y="293" width="134" height="77" rx="6" class="off"/>
  <text x="470" y="336" class="small accent" text-anchor="middle">无此线程</text>
  <rect x="551" y="293" width="134" height="77" rx="6" class="off"/>
  <text x="618" y="336" class="small accent" text-anchor="middle">无此线程</text>
  <path d="M729 242H746V436H704" class="ctrl"/>
  <rect x="54" y="406" width="650" height="65" rx="9" class="control"/>
  <text x="379" y="432" class="label" text-anchor="middle">调度选择：G1，执行 P0 ADD</text>
  <text x="379" y="454" class="small accent" text-anchor="middle">一份 ADD 控制，四个有效线程槽位</text>
  <path d="M379 471V484M174 484H618" class="ctrl-bus"/>
  <path d="M174 484V498" class="ctrl"/>
  <rect x="107" y="498" width="134" height="81" rx="6" class="block"/>
  <text x="174" y="520" class="small label" text-anchor="middle">物理 lane 0</text>
  <text x="174" y="542" class="tiny" text-anchor="middle">来自 T4</text>
  <text x="174" y="566" class="label" text-anchor="middle">5 + 50 = 55</text>
  <path d="M174 579V600" class="data"/>
  <rect x="107" y="600" width="134" height="53" rx="6" class="reg"/>
  <text x="174" y="622" class="small label" text-anchor="middle">写回 T4</text>
  <text x="174" y="643" class="small" text-anchor="middle">rY ← 55</text>
  <path d="M322 484V498" class="ctrl"/>
  <rect x="255" y="498" width="134" height="81" rx="6" class="block"/>
  <text x="322" y="520" class="small label" text-anchor="middle">物理 lane 1</text>
  <text x="322" y="542" class="tiny" text-anchor="middle">来自 T5</text>
  <text x="322" y="566" class="label" text-anchor="middle">6 + 60 = 66</text>
  <path d="M322 579V600" class="data"/>
  <rect x="255" y="600" width="134" height="53" rx="6" class="reg"/>
  <text x="322" y="622" class="small label" text-anchor="middle">写回 T5</text>
  <text x="322" y="643" class="small" text-anchor="middle">rY ← 66</text>
  <path d="M470 484V498" class="ctrl"/>
  <rect x="403" y="498" width="134" height="81" rx="6" class="block"/>
  <text x="470" y="520" class="small label" text-anchor="middle">物理 lane 2</text>
  <text x="470" y="542" class="tiny" text-anchor="middle">来自 T6</text>
  <text x="470" y="566" class="label" text-anchor="middle">7 + 70 = 77</text>
  <path d="M470 579V600" class="data"/>
  <rect x="403" y="600" width="134" height="53" rx="6" class="reg"/>
  <text x="470" y="622" class="small label" text-anchor="middle">写回 T6</text>
  <text x="470" y="643" class="small" text-anchor="middle">rY ← 77</text>
  <path d="M618 484V498" class="ctrl"/>
  <rect x="551" y="498" width="134" height="81" rx="6" class="block"/>
  <text x="618" y="520" class="small label" text-anchor="middle">物理 lane 3</text>
  <text x="618" y="542" class="tiny" text-anchor="middle">来自 T7</text>
  <text x="618" y="566" class="label" text-anchor="middle">8 + 80 = 88</text>
  <path d="M618 579V600" class="data"/>
  <rect x="551" y="600" width="134" height="53" rx="6" class="reg"/>
  <text x="618" y="622" class="small label" text-anchor="middle">写回 T7</text>
  <text x="618" y="643" class="small" text-anchor="middle">rY ← 88</text>
  <text x="380" y="684" class="small" text-anchor="middle">G0、G2 的状态保留；下一批仍可使用同一组物理 lane。</text>
</svg>
