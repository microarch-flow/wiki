<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 778" width="760" height="778" role="img" aria-labelledby="title desc">
  <title id="title">相同的四个线程访问不同地址时的存储服务量</title>
  <desc id="desc">四个线程各访问一个 4 B 字，值依次为 10、20、30、40。观察一：全局存储请求按对齐的 16 B 段计服务量，忽略缓存与复用。连续地址 0、4、8、12 位于同一段，请求的 16 B 数据对应 16 B 段覆盖；分散地址 0、16、32、48 位于四段，16 B 有效数据对应 64 B 段覆盖。观察二：共享存储有四个 bank，每字 4 B，bank 编号为地址除以四取模四，每 bank 每周期可接收一个字。连续地址分别落在四个 bank 上，需要一批。分散地址均在 bank 0 中但字地址不同，需要四批。两个观察独立，各自采用简化服务模型，不表示实际 DRAM 事务或性能。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.label{font-weight:700}
      .accent{fill:#8a5d1c}.muted{fill:#58736a}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .control{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
      .ctrl{stroke:#9b6c27;stroke-width:1.8;stroke-dasharray:5 4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#ctrl-arrow)}
      .ctrl-bus{stroke:#9b6c27;stroke-width:1.8;stroke-dasharray:5 4;fill:none;stroke-linejoin:round}
      .divider{stroke:#c7d3c7;stroke-width:1.1}
      .slot{fill:#e0ebe3;stroke:#92ad9d;stroke-width:1.1}
      .off{fill:#f3eee3;stroke:#c9b89c;stroke-width:1.1;stroke-dasharray:4 3}
      .edge{stroke:#376650;stroke-width:1.25;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="776" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">同样读取 4 个字，为什么服务量不同？</text>
  <text x="20" y="61" class="small">W0～W3 各读 4 B，值分别为 10、20、30、40（两组独立观察）。</text>
  <rect x="18" y="77" width="724" height="306" rx="9" class="panel"/>
  <text x="32" y="104" class="label">一 · 全局存储：以对齐的 16 B 段统计覆盖</text>
  <rect x="18" y="399" width="724" height="317" rx="9" class="panel"/>
  <text x="32" y="426" class="label">二 · 共享存储：4 banks，每 bank 每拍接纳 1 字</text>
  <text x="204" y="139" class="small label" text-anchor="middle">连续地址</text>
  <rect x="35" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="74.5" y="172" class="tiny label" text-anchor="middle">W0 = 10</text>
  <text x="74.5" y="190" class="tiny" text-anchor="middle">A = 0</text>
  <path d="M74.5 199V217" class="data"/>
  <rect x="120" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="159.5" y="172" class="tiny label" text-anchor="middle">W1 = 20</text>
  <text x="159.5" y="190" class="tiny" text-anchor="middle">A = 4</text>
  <path d="M159.5 199V217" class="data"/>
  <rect x="205" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="244.5" y="172" class="tiny label" text-anchor="middle">W2 = 30</text>
  <text x="244.5" y="190" class="tiny" text-anchor="middle">A = 8</text>
  <path d="M244.5 199V217" class="data"/>
  <rect x="290" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="329.5" y="172" class="tiny label" text-anchor="middle">W3 = 40</text>
  <text x="329.5" y="190" class="tiny" text-anchor="middle">A = 12</text>
  <path d="M329.5 199V217" class="data"/>
  <rect x="35" y="217" width="334" height="73" rx="6" class="panel"/>
  <text x="202.0" y="239" class="tiny label" text-anchor="middle">段 0–15</text>
  <rect x="39.0" y="250" width="78.5" height="25" rx="3" class="slot"/>
  <rect x="119.5" y="250" width="78.5" height="25" rx="3" class="slot"/>
  <rect x="200.0" y="250" width="78.5" height="25" rx="3" class="slot"/>
  <rect x="280.5" y="250" width="78.5" height="25" rx="3" class="slot"/>
  <text x="204" y="319" class="label" text-anchor="middle">1 个段；16 B / 16 B</text>
  <text x="560" y="139" class="small label" text-anchor="middle">分散地址</text>
  <rect x="391" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="430.5" y="172" class="tiny label" text-anchor="middle">W0 = 10</text>
  <text x="430.5" y="190" class="tiny" text-anchor="middle">A = 0</text>
  <path d="M430.5 199V217" class="data"/>
  <rect x="476" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="515.5" y="172" class="tiny label" text-anchor="middle">W1 = 20</text>
  <text x="515.5" y="190" class="tiny" text-anchor="middle">A = 16</text>
  <path d="M515.5 199V217" class="data"/>
  <rect x="561" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="600.5" y="172" class="tiny label" text-anchor="middle">W2 = 30</text>
  <text x="600.5" y="190" class="tiny" text-anchor="middle">A = 32</text>
  <path d="M600.5 199V217" class="data"/>
  <rect x="646" y="152" width="79" height="47" rx="6" class="reg"/>
  <text x="685.5" y="172" class="tiny label" text-anchor="middle">W3 = 40</text>
  <text x="685.5" y="190" class="tiny" text-anchor="middle">A = 48</text>
  <path d="M685.5 199V217" class="data"/>
  <rect x="391" y="217" width="79" height="73" rx="6" class="panel"/>
  <text x="430.5" y="239" class="tiny label" text-anchor="middle">段 0–15</text>
  <rect x="395.0" y="250" width="14.75" height="25" rx="3" class="slot"/>
  <rect x="411.75" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="428.5" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="445.25" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="476" y="217" width="79" height="73" rx="6" class="panel"/>
  <text x="515.5" y="239" class="tiny label" text-anchor="middle">段 16–31</text>
  <rect x="480.0" y="250" width="14.75" height="25" rx="3" class="slot"/>
  <rect x="496.75" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="513.5" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="530.25" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="561" y="217" width="79" height="73" rx="6" class="panel"/>
  <text x="600.5" y="239" class="tiny label" text-anchor="middle">段 32–47</text>
  <rect x="565.0" y="250" width="14.75" height="25" rx="3" class="slot"/>
  <rect x="581.75" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="598.5" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="615.25" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="646" y="217" width="79" height="73" rx="6" class="panel"/>
  <text x="685.5" y="239" class="tiny label" text-anchor="middle">段 48–63</text>
  <rect x="650.0" y="250" width="14.75" height="25" rx="3" class="slot"/>
  <rect x="666.75" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="683.5" y="250" width="14.75" height="25" rx="3" class="off"/>
  <rect x="700.25" y="250" width="14.75" height="25" rx="3" class="off"/>
  <text x="560" y="319" class="label" text-anchor="middle">4 个段；16 B / 64 B</text>
  <text x="380" y="342" class="tiny" text-anchor="middle">每格 4 B；绿色为请求字，虚线为未请求字（段框宽度不按比例）</text>
  <text x="380" y="369" class="tiny accent" text-anchor="middle">此处统计段覆盖；忽略缓存、复用，不等于 DRAM 事务。</text>
  <text x="204" y="449" class="small label" text-anchor="middle">连续地址</text>
  <rect x="35" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="74.5" y="481" class="tiny label" text-anchor="middle">W0 = 10</text>
  <text x="74.5" y="499" class="tiny" text-anchor="middle">A = 0</text>
  <path d="M74.5 506V519H74.5V551" class="data"/>
  <rect x="120" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="159.5" y="481" class="tiny label" text-anchor="middle">W1 = 20</text>
  <text x="159.5" y="499" class="tiny" text-anchor="middle">A = 4</text>
  <path d="M159.5 506V525H159.5V551" class="data"/>
  <rect x="205" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="244.5" y="481" class="tiny label" text-anchor="middle">W2 = 30</text>
  <text x="244.5" y="499" class="tiny" text-anchor="middle">A = 8</text>
  <path d="M244.5 506V531H244.5V551" class="data"/>
  <rect x="290" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="329.5" y="481" class="tiny label" text-anchor="middle">W3 = 40</text>
  <text x="329.5" y="499" class="tiny" text-anchor="middle">A = 12</text>
  <path d="M329.5 506V537H329.5V551" class="data"/>
  <rect x="35" y="551" width="79" height="48" rx="6" class="block"/>
  <text x="74.5" y="572" class="tiny label" text-anchor="middle">bank 0</text>
  <text x="74.5" y="590" class="tiny" text-anchor="middle">1 字</text>
  <rect x="120" y="551" width="79" height="48" rx="6" class="block"/>
  <text x="159.5" y="572" class="tiny label" text-anchor="middle">bank 1</text>
  <text x="159.5" y="590" class="tiny" text-anchor="middle">1 字</text>
  <rect x="205" y="551" width="79" height="48" rx="6" class="block"/>
  <text x="244.5" y="572" class="tiny label" text-anchor="middle">bank 2</text>
  <text x="244.5" y="590" class="tiny" text-anchor="middle">1 字</text>
  <rect x="290" y="551" width="79" height="48" rx="6" class="block"/>
  <text x="329.5" y="572" class="tiny label" text-anchor="middle">bank 3</text>
  <text x="329.5" y="590" class="tiny" text-anchor="middle">1 字</text>
  <text x="204" y="631" class="label" text-anchor="middle">需要 1 批服务</text>
  <text x="204" y="654" class="tiny" text-anchor="middle">4 个 bank 可同批接收</text>
  <text x="560" y="449" class="small label" text-anchor="middle">分散地址</text>
  <rect x="391" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="430.5" y="481" class="tiny label" text-anchor="middle">W0 = 10</text>
  <text x="430.5" y="499" class="tiny" text-anchor="middle">A = 0</text>
  <path d="M430.5 506V519H430.5V551" class="data"/>
  <rect x="476" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="515.5" y="481" class="tiny label" text-anchor="middle">W1 = 20</text>
  <text x="515.5" y="499" class="tiny" text-anchor="middle">A = 16</text>
  <path d="M515.5 506V525H430.5V551" class="data"/>
  <rect x="561" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="600.5" y="481" class="tiny label" text-anchor="middle">W2 = 30</text>
  <text x="600.5" y="499" class="tiny" text-anchor="middle">A = 32</text>
  <path d="M600.5 506V531H430.5V551" class="data"/>
  <rect x="646" y="462" width="79" height="44" rx="6" class="reg"/>
  <text x="685.5" y="481" class="tiny label" text-anchor="middle">W3 = 40</text>
  <text x="685.5" y="499" class="tiny" text-anchor="middle">A = 48</text>
  <path d="M685.5 506V537H430.5V551" class="data"/>
  <rect x="391" y="551" width="79" height="48" rx="6" class="block"/>
  <text x="430.5" y="572" class="tiny label" text-anchor="middle">bank 0</text>
  <text x="430.5" y="590" class="tiny" text-anchor="middle">4 字</text>
  <rect x="476" y="551" width="79" height="48" rx="6" class="off"/>
  <text x="515.5" y="572" class="tiny label" text-anchor="middle">bank 1</text>
  <text x="515.5" y="590" class="tiny" text-anchor="middle">0 字</text>
  <rect x="561" y="551" width="79" height="48" rx="6" class="off"/>
  <text x="600.5" y="572" class="tiny label" text-anchor="middle">bank 2</text>
  <text x="600.5" y="590" class="tiny" text-anchor="middle">0 字</text>
  <rect x="646" y="551" width="79" height="48" rx="6" class="off"/>
  <text x="685.5" y="572" class="tiny label" text-anchor="middle">bank 3</text>
  <text x="685.5" y="590" class="tiny" text-anchor="middle">0 字</text>
  <text x="560" y="631" class="label" text-anchor="middle">需要 4 批服务</text>
  <text x="560" y="654" class="tiny" text-anchor="middle">一种顺序：W0、W1、W2、W3</text>
  <text x="380" y="697" class="tiny accent" text-anchor="middle">bank = (A / 4) mod 4；右侧 4 次访问是同 bank 的不同字。</text>
  <text x="380" y="749" class="small label" text-anchor="middle">两个观察采用各自的简化服务模型，不是实际 GPU 的时延测量。</text>
</svg>
