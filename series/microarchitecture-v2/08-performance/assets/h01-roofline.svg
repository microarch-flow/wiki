<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-labelledby="title desc">
  <title id="title">相同算术强度与带宽下，增加 MAC 通路后 Roofline 上限的变化</title>
  <desc id="desc">横轴为外部存储接口的算术强度，单位op/B，线性坐标；纵轴有效计算吞吐量，单位GOP/s，线性坐标。8 GB/s 带宽线由原点出发、斜率8。4条MAC通路的峰值8 GOP/s，拐点1 op/B；8条通路的峰值16 GOP/s，拐点2 op/B。此任务计算强度1.6 op/B，两个Roofline上限为8和12.8 GOP/s；对应执行轨迹模型估计的实际有效吞吐量为7.42和11.91 GOP/s。</desc>
  <defs><style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:16px}
    .heading{font-size:23px;font-weight:700}.small{font-size:15px}.tiny{font-size:14px}.muted{fill:#58736a}.label{font-weight:700}
    .axis{stroke:#45675b;stroke-width:1.6;fill:none}.grid{stroke:#d1dad0;stroke-width:1;stroke-dasharray:4 4}
    .p4{stroke:#376650;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.p8{stroke:#355679;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
    .bandwidth{stroke:#9b6c27;stroke-width:2;fill:none;stroke-dasharray:6 5}.guide{stroke:#8a5d1c;stroke-width:1.6;fill:none;stroke-dasharray:3 4}
    .leader4{stroke:#376650;stroke-width:1.1;fill:none}.leader8{stroke:#355679;stroke-width:1.1;fill:none}
    .text4{fill:#376650}.text8{fill:#355679}.bwtext{fill:#8a5d1c}
  </style></defs>
  <rect x="1" y="1" width="758" height="492" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="24" y="35" class="heading">性能上限并不一定等于计算峰值</text>
  <text x="24" y="60" class="small muted">外部存储带宽固定为 8 GB/s · 1 MAC 计为 2 op</text>
  <rect x="23" y="79" width="714" height="350" rx="8" fill="#fafbf8" stroke="#c7d3c7" stroke-width="1.3"/>
  <!-- linear axes: origin (100,380), x factor 195 px/(op/B), y factor 15 px/(GOP/s) -->
  <path d="M100 320H685 M100 260H685 M100 200H685 M100 140H685 M295 380V110 M490 380V110 M685 380V110" class="grid"/>
  <path d="M100 108V380H702" class="axis"/>
  <text x="39" y="105" class="small">有效吞吐量（GOP/s）</text>
  <g class="tiny" text-anchor="end"><text x="91" y="385">0</text><text x="91" y="325">4</text><text x="91" y="265">8</text><text x="91" y="205">12</text><text x="91" y="145">16</text></g>
  <g class="tiny" text-anchor="middle"><text x="100" y="401">0</text><text x="295" y="401">1</text><text x="490" y="401">2</text><text x="685" y="401">3</text></g>
  <text x="702" y="419" text-anchor="end" class="small">计算强度（op/B）</text>
  <path d="M100 380L538.75 110" class="bandwidth"/>
  <path d="M100 380L490 140H685" class="p8"/>
  <path d="M100 380L295 260H685" class="p4"/>
  <!-- overlapping slope: show common bandwidth line before smaller knee -->
  <path d="M100 380L295 260" class="bandwidth"/>
  <path d="M412 380V106" class="guide"/>
  <text x="412" y="401" text-anchor="middle" class="tiny bwtext label">1.6</text>
  <text x="554" y="130" class="small text8 label">8 通路：16</text>
  <text x="554" y="250" class="small text4 label">4 通路：8</text>
  <text x="172" y="302" class="small bwtext" transform="rotate(-31 172 302)">8 GB/s × 强度</text>

  <circle cx="412" cy="188" r="4.4" fill="#355679"/>
  <path d="M408 184L383 161H280" class="leader8"/>
  <text x="278" y="156" class="small text8 label">上限 12.8</text>
  <circle cx="412" cy="201.35" r="4.8" fill="#fafbf8" stroke="#355679" stroke-width="2"/>
  <path d="M417 201.35H437L454 217H548" class="leader8"/>
  <text x="549" y="222" class="small text8">模型 11.91</text>

  <circle cx="412" cy="260" r="4.4" fill="#376650"/>
  <path d="M416 256L430 242" class="leader4"/>
  <text x="433" y="242" class="small text4 label">上限 8</text>
  <circle cx="412" cy="268.7" r="4.8" fill="#fafbf8" stroke="#376650" stroke-width="2"/>
  <path d="M417 268.7L447 296H548" class="leader4"/>
  <text x="549" y="301" class="small text4">模型 7.42</text>

  <circle cx="40" cy="452" r="4.5" fill="#376650"/>
  <text x="52" y="457" class="small">理论上限</text>
  <circle cx="167" cy="452" r="4.8" fill="#fafbf8" stroke="#376650" stroke-width="2"/>
  <text x="180" y="457" class="small">轨迹模型估算</text>
  <text x="24" y="480" class="small muted">教学算例的线性坐标示意；空心点是模型估算，不是实测结果。</text>
</svg>
