  text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:16px;fill:#173d35}
  .heading{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px}.tiny{font-size:13px}.muted{fill:#58736a}
  .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.grid{stroke:#d1dad0;stroke-width:1;stroke-dasharray:4 4}
  .lane{fill:#f0f1eb;stroke:#c7d3c7;stroke-width:1}.read{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.write{fill:#d9e8f7;stroke:#8ba6c0;stroke-width:1.3}.compute{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.3}
  .end{stroke:#355679;stroke-width:1.8;stroke-dasharray:4 3;fill:none}
  </style></defs>
