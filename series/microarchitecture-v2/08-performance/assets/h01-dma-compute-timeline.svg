<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 437" width="960" height="437" role="img" aria-labelledby="title desc">
  <title id="title">计算单元翻倍后的 DMA 与 MAC 阵列执行轨迹</title>
  <desc id="desc">相同8个 tile，使用两个驻留槽，共用DMA。在4条MAC通路时，DMA先读 L0 0到32拍、L1 32到64拍，槽占满后等待计算；C0 32到96拍，W0 96到104拍，L2 104到136拍。依次持续至C7 480到544拍、W7 544到552拍。增加到8条MAC通路后，C0 32到64拍，W0 64到72拍，C1 64到96拍，L2 72到104拍，W1 104到112拍，C2 104到136拍；最后C7 304到336拍、W7 336到344拍。两图使用相同线性时间轴，读取、写回不能同时进行。完成时间从552拍缩短到344拍。</desc>
