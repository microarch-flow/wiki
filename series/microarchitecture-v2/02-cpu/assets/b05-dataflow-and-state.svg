<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 855" width="800" height="855" role="img" aria-labelledby="title desc">
  <title id="title">寄存器重命名：物理寄存器保存数值，提交逻辑更新架构映射</title>
  <desc id="desc">译码后按程序顺序重命名：从当前重命名表 RMT 读取各源及旧目标物理编号，从空闲表取得新目的物理编号，并将源、架构目标 rd、新旧物理编号一起登记到 ROB；这与 RMT 的目的映射更新作为同一个接纳动作。发射选择器检查候选指令源物理编号对应的就绪状态，从 PRF 读出数值，执行单元返回结果时写入新目的物理寄存器、设置就绪位，并标记 ROB 相应条目正常完成。只有 ROB 队首允许提交时，提交逻辑才将 CMT 中的 rd 映射改成新物理编号，并归还该指令记录的旧目的物理编号到空闲表。提交不搬运数值。图中只画普通写整数寄存器的指令。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="control-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#8a5d1c"/></marker>
    <marker id="result-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#5b7680"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.tiny{font-size:14.5px}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .arch{fill:#d2e6d7;stroke:#376650;stroke-width:1.7}.result{fill:#e0eaed;stroke:#72929b;stroke-width:1.55}
      .resource{fill:#f2e7d1;stroke:#bd9857;stroke-width:1.5}.dim{fill:#6e8079}.accent{fill:#8a5d1c}.ftext{fill:#496872}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .control{stroke:#8a5d1c;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 4;marker-end:url(#control-arrow)}
      .feedback{stroke:#5b7680;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 4;marker-end:url(#result-arrow)}
      .plain{stroke:#376650;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="853" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="34" class="heading">重命名、发射、完成与提交</text>
  <text x="22" y="61" class="small">重命名和提交按程序顺序；发射和结果返回则可以改变顺序。</text>

  <!-- Ordered rename/allocate. -->
  <rect x="18" y="79" width="764" height="221" rx="10" class="panel"/>
  <text x="35" y="107" class="label">ID · 译码和重命名</text>
  <rect x="35" y="120" width="340" height="65" rx="8" class="block"/>
  <text x="51" y="145" class="label">RMT · 当前重命名表</text>
  <text x="51" y="169" class="small">按架构编号查找源及旧目标编号</text>
  <rect x="425" y="120" width="340" height="65" rx="8" class="resource"/>
  <text x="441" y="145" class="label accent">空闲表 · Free List</text>
  <text x="441" y="169" class="small">取出一个可分配的新目的编号</text>
  <path d="M205 185V196H319V207" class="data"/>
  <path d="M595 185V196H481V207" class="data"/>
  <rect x="104" y="207" width="592" height="77" rx="8" class="block"/>
  <text x="400" y="231" class="label" text-anchor="middle">成功登记：固定源物理编号，并分配新目标</text>
  <text x="400" y="255" class="small" text-anchor="middle">同一边沿更新 RMT[rd]，清零新目标 ready 位</text>
  <text x="400" y="275" class="tiny dim" text-anchor="middle">若 ROB 或物理寄存器无空间，整个接纳动作等待</text>
  <path d="M104 239H72V185" class="control"/>
  <path d="M400 284V316" class="data"/>

  <!-- Combined issue window and program-order completion state. -->
  <rect x="75" y="317" width="650" height="113" rx="9" class="block"/>
  <text x="94" y="345" class="label">ROB · 未提交指令记录（含等待窗口）</text>
  <rect x="92" y="356" width="616" height="33" rx="5" fill="#fafbf8" stroke="#c7d3c7"/>
  <text x="400" y="378" class="small" text-anchor="middle">PC、源物理编号、rd、新 / 旧目的编号、状态</text>
  <text x="400" y="414" class="tiny dim" text-anchor="middle">按序登记；未发射项可竞争执行；完成后仍保留到提交</text>

  <!-- Split: issue/execute vs commit. -->
  <rect x="18" y="449" width="369" height="333" rx="10" class="panel"/>
  <rect x="414" y="449" width="368" height="333" rx="10" class="panel"/>
  <path d="M234 430V463" class="data"/>
  <path d="M565 430V463" class="data"/>

  <rect x="36" y="463" width="327" height="63" rx="8" class="block"/>
  <text x="52" y="488" class="label">发射选择 · 检查源编号</text>
  <text x="52" y="511" class="small">检查 ready 位和执行资源</text>
  <path d="M199 526V551" class="data"/>
  <rect x="36" y="552" width="327" height="70" rx="8" class="result"/>
  <text x="52" y="578" class="label ftext">PRF · 物理寄存器文件</text>
  <text x="52" y="601" class="small">按选中指令的源物理编号读数</text>
  <path d="M199 622V650" class="data"/>
  <rect x="36" y="651" width="327" height="84" rx="8" class="result"/>
  <text x="52" y="679" class="label ftext">执行、结果写回</text>
  <text x="52" y="701" class="small">向 PRF[新目的] 写数值</text>
  <text x="52" y="722" class="small">置 ready = 1、记录完成</text>
  <path d="M36 693H26V587H36" class="feedback"/>
  <path d="M363 681H400V430" class="feedback"/>
  <rect x="135" y="747" width="193" height="23" rx="5" fill="#e0eaed"/>
  <text x="231" y="764" text-anchor="middle" class="tiny ftext">结果可乱序写入 PRF</text>

  <rect x="431" y="463" width="334" height="63" rx="8" class="block"/>
  <text x="447" y="488" class="label">提交选择 · 只看 ROB 队首</text>
  <text x="447" y="511" class="small">已完成、无异常且允许提交</text>
  <path d="M598 526V551" class="data"/>
  <rect x="431" y="552" width="334" height="70" rx="8" class="arch"/>
  <text x="447" y="578" class="label">CMT · 已提交映射表</text>
  <text x="447" y="601" class="small">CMT[rd] ← 新目的物理编号</text>
  <path d="M598 622V650" class="control"/>
  <rect x="431" y="651" width="334" height="84" rx="8" class="resource"/>
  <text x="447" y="679" class="label accent">回收旧目的编号</text>
  <text x="447" y="701" class="small">归还 ROB 记录的旧目的到空闲表</text>
  <text x="447" y="722" class="tiny accent">不是回收本条指令的新目的</text>
  <rect x="491" y="747" width="218" height="23" rx="5" fill="#d2e6d7"/>
  <text x="600" y="764" text-anchor="middle" class="tiny label">提交不搬运 PRF 的数据</text>

  <text x="22" y="805" class="tiny dim">绿线：编号 / 数据处理进度；棕虚线：映射或资源更新；蓝虚线：执行结果及完成记录返回。</text>
  <text x="22" y="829" class="tiny dim">只绘写整数寄存器的普通指令；实际电路还需要取消、异常以及其他指令类型的处理。</text>
</svg>
