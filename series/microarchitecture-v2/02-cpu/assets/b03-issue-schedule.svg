<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 602" width="800" height="602" role="img" aria-labelledby="title desc">
  <title id="title">同一前缀 I0–I4 的严格顺序发射与就绪指令中程序顺序较早者优先时序</title>
  <desc id="desc">每列 Cn 是 E(n−1) 到 En 的周期；空心圆标登记边沿，实心菱形标发射边沿。两种方式在 E2 到 E6 依次登记 I0 至 I4，I0 E3 发射、C4 执行、E5 写回；I1 E4 发射、C5 算址、C6 至 C9 访存、E10 写回；I2 等待 I1，E11 发射、E13 写回。顺序发射中 I3 E12 发射、E14 写回，I4 E13 发射、E15 写回；从就绪指令中选择时 I3 E6 发射、E8 写回，I4 等到 I2 读取 x5 后于 E12 发射、E14 写回。比较仅覆盖 I0 至 I4，不是整段程序。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:16px}
      .heading{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:15px;fill:#4f695a}.tiny{font-size:13.5px}
      .rowlabel{font-size:14px;font-weight:700}.cell{font-size:14px;font-weight:700}.waittext{font-size:14px;fill:#8a5d1c}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.grid{stroke:#e3e9df;stroke-width:1}
      .wait{fill:#f2e7d1;stroke:#bca16d;stroke-width:1.2}.exec{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.1}
      .mem{fill:#e1e9eb;stroke:#809ca4;stroke-width:1.2}.wb{fill:#d2e6d7;stroke:#376650;stroke-width:1.2}
      .admit{fill:#fafbf8;stroke:#8a5d1c;stroke-width:1.5}.issue{fill:#376650;stroke:#fafbf8;stroke-width:0.7}
      .fmark{stroke:#376650;stroke-width:1.8;stroke-dasharray:5 4}.muted{fill:#6e8079}.accent{fill:#8a5d1c}
      .finish{fill:#376650;font-weight:700;font-size:15px}.highlight{fill:#d2e6d7}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="600" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="20" y="34" class="heading">同一前缀 I0–I4，只改变发射选择方式</text>
  <text x="20" y="60" class="note">每格是 Cn（E(n−1) 到 En），WB 在该周期末的边沿更新 RF。</text>
