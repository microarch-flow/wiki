  <rect x="14" y="306" width="772" height="222" rx="10" class="panel"/>
  <text x="28" y="331" class="label" text-anchor="start">就绪指令中程序顺序较早者优先</text>
  <text x="28" y="353" class="tiny" text-anchor="start">I0 → I1 → I3 → I2 → I4</text>
