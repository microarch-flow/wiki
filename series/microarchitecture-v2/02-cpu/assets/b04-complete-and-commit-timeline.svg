<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" width="800" height="458" role="img" aria-labelledby="title desc">
  <title id="title">I0 至 I4 的结果接收与按程序顺序提交</title>
  <desc id="desc">横轴标注 E2 至 E17 上升沿，相邻边沿为一个周期。I0 在 E2 登记、E3 发射、E5 写入 ROB、E6 提交；I1 在 E3 登记、E4 发射、E10 写入 ROB、E11 提交；I2 在 E4 登记、E12 发射、E14 写入 ROB、E15 提交；I3 在 E5 登记、E6 发射、E8 写入 ROB、E16 提交；I4 在 E6 登记、E13 发射、E15 写入 ROB、E17 提交。I3 在 E8 就完成，但结果 9 保存于 ROB 中，必须等 I1、I2 提交后才写入架构寄存器 x8。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:16px}
      .heading{font-size:22px;font-weight:700}.note{font-size:15px;fill:#4f695a}.label{font-size:15px;font-weight:700}.small{font-size:14px}.tiny{font-size:13px}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.grid{stroke:#dde5dc;stroke-width:1}
      .wait{fill:#f2e7d1;stroke:#bca16d;stroke-width:1.1}.exec{fill:#e1e9eb;stroke:#809ca4;stroke-width:1.1}
      .rob{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.1}.robhero{fill:#d2e6d7;stroke:#376650;stroke-width:1.6}
      .admit{fill:#fafbf8;stroke:#8a5d1c;stroke-width:1.5}.issue{fill:#376650;stroke:#fafbf8;stroke-width:0.8}
      .complete{fill:#5b7680;stroke:#fafbf8;stroke-width:0.8}.commit{fill:#245f47;stroke:#fafbf8;stroke-width:1}
      .muted{fill:#6e8079}.accent{fill:#8a5d1c}.ftext{fill:#496872}.green{fill:#245f47}.highlight{fill:#d2e6d7}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="456" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="20" y="33" class="heading">结果可以乱序到达 ROB，但只能按序提交</text>
  <text x="20" y="59" class="note">横轴为上升沿 Eₙ；周期 Cₙ 位于 Eₙ₋₁ 与 Eₙ 之间（仅比较 I0–I4）。</text>
  <rect x="14" y="74" width="772" height="252" rx="10" class="panel"/>
  <text x="30" y="99" class="small">指令</text>
  <text x="104" y="99" class="tiny" text-anchor="middle">E2</text>
  <path d="M104 106V315" class="grid"/>
  <text x="148" y="99" class="tiny" text-anchor="middle">E3</text>
  <path d="M148 106V315" class="grid"/>
  <text x="192" y="99" class="tiny" text-anchor="middle">E4</text>
  <path d="M192 106V315" class="grid"/>
  <text x="236" y="99" class="tiny" text-anchor="middle">E5</text>
  <path d="M236 106V315" class="grid"/>
  <text x="280" y="99" class="tiny" text-anchor="middle">E6</text>
  <path d="M280 106V315" class="grid"/>
  <text x="324" y="99" class="tiny" text-anchor="middle">E7</text>
  <path d="M324 106V315" class="grid"/>
  <text x="368" y="99" class="tiny" text-anchor="middle">E8</text>
  <path d="M368 106V315" class="grid"/>
  <text x="412" y="99" class="tiny" text-anchor="middle">E9</text>
  <path d="M412 106V315" class="grid"/>
  <text x="456" y="99" class="tiny" text-anchor="middle">E10</text>
  <path d="M456 106V315" class="grid"/>
  <text x="500" y="99" class="tiny" text-anchor="middle">E11</text>
  <path d="M500 106V315" class="grid"/>
  <text x="544" y="99" class="tiny" text-anchor="middle">E12</text>
  <path d="M544 106V315" class="grid"/>
  <text x="588" y="99" class="tiny" text-anchor="middle">E13</text>
  <path d="M588 106V315" class="grid"/>
  <text x="632" y="99" class="tiny" text-anchor="middle">E14</text>
  <path d="M632 106V315" class="grid"/>
  <text x="676" y="99" class="tiny" text-anchor="middle">E15</text>
  <path d="M676 106V315" class="grid"/>
  <text x="720" y="99" class="tiny" text-anchor="middle">E16</text>
  <path d="M720 106V315" class="grid"/>
  <text x="764" y="99" class="tiny" text-anchor="middle">E17</text>
  <path d="M764 106V315" class="grid"/>
  <!-- I0 ADD: 2, 3, 5, 6 -->
  <text x="28" y="124" class="label">I0 ADD</text>
  <text x="28" y="141" class="tiny muted">x6 = 5</text>
  <rect x="104" y="114" width="44" height="24" rx="5" class="wait"/>
  <text x="126.0" y="131" class="small accent" text-anchor="middle">等</text>
  <rect x="148" y="114" width="88" height="24" rx="5" class="exec"/>
  <text x="192.0" y="131" class="small ftext" text-anchor="middle">执行</text>
  <rect x="236" y="114" width="44" height="24" rx="5" class="rob"/>
  <text x="258.0" y="131" class="small green" text-anchor="middle">待</text>
  <circle cx="104" cy="126" r="5.2" class="admit"/>
  <path d="M148 120l6 6l-6 6l-6 -6z" class="issue"/>
  <rect x="231" y="121" width="10" height="10" rx="1.8" class="complete"/>
  <circle cx="280" cy="126" r="6" class="commit"/>
  <!-- I1 LW: 3, 4, 10, 11 -->
  <text x="28" y="167" class="label">I1 LW</text>
  <text x="28" y="184" class="tiny muted">x5 = 6</text>
  <rect x="148" y="157" width="44" height="24" rx="5" class="wait"/>
  <text x="170.0" y="174" class="small accent" text-anchor="middle">等</text>
  <rect x="192" y="157" width="264" height="24" rx="5" class="exec"/>
  <text x="324.0" y="174" class="small ftext" text-anchor="middle">算址、访存 4 拍、结果接收</text>
  <rect x="456" y="157" width="44" height="24" rx="5" class="rob"/>
  <text x="478.0" y="174" class="small green" text-anchor="middle">待</text>
  <circle cx="148" cy="169" r="5.2" class="admit"/>
  <path d="M192 163l6 6l-6 6l-6 -6z" class="issue"/>
  <rect x="451" y="164" width="10" height="10" rx="1.8" class="complete"/>
  <circle cx="500" cy="169" r="6" class="commit"/>
  <!-- I2 ADD: 4, 12, 14, 15 -->
  <text x="28" y="210" class="label">I2 ADD</text>
  <text x="28" y="227" class="tiny muted">x7 = 7</text>
  <rect x="192" y="200" width="352" height="24" rx="5" class="wait"/>
  <text x="368.0" y="217" class="small accent" text-anchor="middle">等待发射</text>
  <rect x="544" y="200" width="88" height="24" rx="5" class="exec"/>
  <text x="588.0" y="217" class="small ftext" text-anchor="middle">执行</text>
  <rect x="632" y="200" width="44" height="24" rx="5" class="rob"/>
  <text x="654.0" y="217" class="small green" text-anchor="middle">待</text>
  <circle cx="192" cy="212" r="5.2" class="admit"/>
  <path d="M544 206l6 6l-6 6l-6 -6z" class="issue"/>
  <rect x="627" y="207" width="10" height="10" rx="1.8" class="complete"/>
  <circle cx="676" cy="212" r="6" class="commit"/>
  <rect x="21" y="236" width="71" height="38" rx="6" class="highlight"/>
  <!-- I3 ADD: 5, 6, 8, 16 -->
  <text x="28" y="253" class="label">I3 ADD</text>
  <text x="28" y="270" class="tiny muted">x8 = 9</text>
  <rect x="236" y="243" width="44" height="24" rx="5" class="wait"/>
  <text x="258.0" y="260" class="small accent" text-anchor="middle">等</text>
  <rect x="280" y="243" width="88" height="24" rx="5" class="exec"/>
  <text x="324.0" y="260" class="small ftext" text-anchor="middle">执行</text>
  <rect x="368" y="243" width="352" height="24" rx="5" class="robhero"/>
  <text x="544.0" y="260" class="small green" text-anchor="middle">结果 9 保存在 ROB，等待 I1、I2 先提交</text>
  <circle cx="236" cy="255" r="5.2" class="admit"/>
  <path d="M280 249l6 6l-6 6l-6 -6z" class="issue"/>
  <rect x="363" y="250" width="10" height="10" rx="1.8" class="complete"/>
  <circle cx="720" cy="255" r="6" class="commit"/>
  <!-- I4 ADD: 6, 13, 15, 17 -->
  <text x="28" y="296" class="label">I4 ADD</text>
  <text x="28" y="313" class="tiny muted">x5 = 7</text>
  <rect x="280" y="286" width="308" height="24" rx="5" class="wait"/>
  <text x="434.0" y="303" class="small accent" text-anchor="middle">等待发射</text>
  <rect x="588" y="286" width="88" height="24" rx="5" class="exec"/>
  <text x="632.0" y="303" class="small ftext" text-anchor="middle">执行</text>
  <rect x="676" y="286" width="88" height="24" rx="5" class="rob"/>
  <text x="720.0" y="303" class="small green" text-anchor="middle">待提交</text>
  <circle cx="280" cy="298" r="5.2" class="admit"/>
  <path d="M588 292l6 6l-6 6l-6 -6z" class="issue"/>
  <rect x="671" y="293" width="10" height="10" rx="1.8" class="complete"/>
  <circle cx="764" cy="298" r="6" class="commit"/>
  <!-- Order of the events, independently of row order. -->
  <rect x="14" y="337" width="772" height="77" rx="10" class="panel"/>
  <text x="28" y="359" class="label ftext">结果接收</text>
  <text x="136" y="359" class="small">I0(E5) → I3(E8) → I1(E10) → I2(E14) → I4(E15)</text>
  <path d="M26 368H774" class="grid"/>
  <text x="28" y="392" class="label green">按序提交</text>
  <text x="136" y="392" class="small">I0(E6) → I1(E11) → I2(E15) → I3(E16) → I4(E17)</text>
  <circle cx="40" cy="435" r="5.2" class="admit"/>
  <text x="53" y="440" class="small">登记</text>
  <path d="M209 429l6 6l-6 6l-6 -6z" class="issue"/>
  <text x="222" y="440" class="small">发射</text>
  <rect x="350" y="430" width="10" height="10" rx="1.8" class="complete"/>
  <text x="368" y="440" class="small">结果写入 ROB</text>
  <circle cx="548" cy="435" r="6" class="commit"/>
  <text x="563" y="440" class="small">提交，更新架构 RF</text>
</svg>
