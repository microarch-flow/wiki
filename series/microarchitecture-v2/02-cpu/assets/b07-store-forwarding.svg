<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533" role="img" aria-labelledby="title desc">
  <title id="title">Load 从已提交但仍未对内存可见的 Store 数据取得正确的值</title>
  <desc id="desc">E18 沿后 I7 已提交，已提交 Store Buffer 保存地址0x204及值7，抽象内存中该地址仍为0。I8 的 LQ 保存地址0x204。在 E19，Store 的写请求已被接口接收，同时 Load 经匹配到 Store Buffer 中的 I7 记录并取得7。E20 将7写入 p37。E21，I8 提交，x11 等于7；抽象内存该地址仍为0。E23，I7 的 Store 数据才到达抽象的可见端点，该地址变为7。因此本核的 Load 可以在 Store 到达该端点之前取得 Store 的值。插图中的 E 时序只是教学模型，不代表真实处理器固定的 Store Buffer 时延。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376650"/></marker>
    <marker id="forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7680"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:17px}
      .heading{font-size:22px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.note{font-size:15px;fill:#4f695a}
      .accent{fill:#8a5d1c}.ftext{fill:#496872}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.ready{fill:#d2e6d7;stroke:#376650;stroke-width:1.5}.queue{fill:#e0eaed;stroke:#72929b;stroke-width:1.4}
      .wait{fill:#f2e7d1;stroke:#bd9857;stroke-width:1.3}.header{fill:#e0ebe3}
      .data{stroke:#376650;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .fwd{stroke:#5b7680;stroke-width:2.2;fill:none;stroke-linejoin:round;marker-end:url(#forward)}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="531" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="20" y="34" class="heading">I8 已经读到 7，内存为什么仍然是 0？</text>
  <text x="20" y="59" class="note">沿用 I7 Store 与 I8 Load，访问地址均为 0x204；这里只观察相关状态。</text>

  <rect x="15" y="73" width="770" height="211" rx="10" class="panel"/>
  <text x="31" y="99" class="small label">E18 沿后：Store 已提交，仍停留在 SB 中</text>
  <rect x="31" y="118" width="230" height="70" rx="7" class="ready"/>
  <text x="146" y="140" class="small label" text-anchor="middle">已提交 SB · I7</text>
  <text x="146" y="162" class="small" text-anchor="middle">0x204 ← 7</text><text x="146" y="180" class="tiny" text-anchor="middle">写入仍在等待</text>
  <path d="M261 153H294" class="fwd"/>
  <rect x="294" y="118" width="233" height="70" rx="7" class="queue"/>
  <text x="410.5" y="140" class="small label" text-anchor="middle">LQ · I8</text>
  <text x="410.5" y="162" class="small" text-anchor="middle">地址 0x204</text><text x="410.5" y="180" class="tiny" text-anchor="middle">匹配较老 I7 的地址</text>
  <rect x="560" y="118" width="209" height="70" rx="7" class="wait"/>
  <text x="664.5" y="140" class="small label" text-anchor="middle">内存可见端点</text>
  <text x="664.5" y="162" class="small" text-anchor="middle">M[0x204] = 0</text><text x="664.5" y="180" class="tiny accent" text-anchor="middle">仍是旧值</text>
  <path d="M146 188V207H664.5V188" class="data"/>
  <rect x="289" y="198" width="243" height="19" rx="4" fill="#fafbf8"/>
  <text x="410.5" y="212" class="tiny" text-anchor="middle">Store 请求送出，后续才完成</text>
  <rect x="31" y="227" width="738" height="42" rx="7" class="queue"/>
  <text x="400" y="245" class="small label ftext" text-anchor="middle">E19：I8 由 SB 得到值 7；同一边沿写请求获接收</text>
  <text x="400" y="262" class="tiny" text-anchor="middle">请求的接收不代表该写入已经在可见端点完成</text>

  <rect x="15" y="297" width="770" height="196" rx="10" class="panel"/>
  <text x="31" y="322" class="small label">随后：内部结果、架构结果、内存可见状态分别更新</text>
  <rect x="31" y="334" width="738" height="27" rx="5" class="header"/>
  <text x="76" y="352" class="tiny label" text-anchor="middle">边沿</text>
  <text x="340" y="352" class="tiny label" text-anchor="middle">本线程 I8 与 I7 的事件</text>
  <text x="658" y="352" class="tiny label" text-anchor="middle">M[0x204]</text>

  <g text-anchor="middle">
    <text x="76" y="382" class="small label">E20</text>
    <rect x="132" y="368" width="444" height="27" rx="4" class="queue"/><text x="354" y="387" class="small">I8 写回物理寄存器 p37 = 7</text>
    <rect x="588" y="368" width="165" height="27" rx="4" class="wait"/><text x="670.5" y="387" class="small accent label">0</text>

    <text x="76" y="420" class="small label">E21</text>
    <rect x="132" y="402" width="444" height="27" rx="4" class="ready"/><text x="354" y="421" class="small label">I8 提交：x11 = 7</text>
    <rect x="588" y="402" width="165" height="27" rx="4" class="wait"/><text x="670.5" y="421" class="small accent label">0</text>

    <text x="76" y="454" class="small label">E23</text>
    <rect x="132" y="436" width="444" height="27" rx="4" class="block"/><text x="354" y="455" class="small">I7 的写入到达内存可见端点</text>
    <rect x="588" y="436" width="165" height="27" rx="4" class="ready"/><text x="670.5" y="455" class="small label">7</text>
  </g>
  <text x="31" y="482" class="tiny">蓝色：内部传递；绿色：已提交 / 已可见；黄色：内存端点仍保存旧值。</text>
  <text x="20" y="515" class="note">在这一教学时序中，Load 不必等待较老 Store 到达可见端点之后才获得正确的值。</text>
</svg>
