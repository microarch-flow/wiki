<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 625" width="800" height="625" role="img" aria-labelledby="title desc">
  <title id="title">分支预测错误时只撤销更年轻的指令和物理寄存器版本</title>
  <desc id="desc">E14 沿后，I2 已提交，I5 已发射，ROB 中按序保存 I3、I4、I5、I6、I7。I6 是未选择的方向上的指令，写 p37 值10，RMT 的 x8 指向 p37；I3 的 p35 值9 仍然保留。此时已提交 x5 为 p33 值6，RMT 的 x5 为 p36 值7。C15 执行 I5，比较相等，确认应该跳转。E15 的正确处理为 I3 正常提交，保留 p35 并正常退休旧 p8；I4、I5 留在 ROB；清除年轻的 I6 和第一次取到的 I7，虽然 I7 地址正是正确目标。I8 未登记。重命名映射 x8 恢复 p35，其余映射例如 x5 保留 p36，不重置到 CMT。p37 在确认不再受迟到结果污染后回收。FPC 重定向至 0x11C。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376650"/></marker>
    <marker id="drop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65047"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:17px}
      .heading{font-size:22px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.note{font-size:15px;fill:#4f695a}.accent{fill:#8a5d1c}.faulttext{fill:#99493e}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.reg{fill:#d2e6d7;stroke:#376650;stroke-width:1.5}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.pred{fill:#e0eaed;stroke:#72929b;stroke-width:1.4}.select{fill:#f2e7d1;stroke:#bd9857;stroke-width:1.5}.fault{fill:#f4e0dc;stroke:#bd7c70;stroke-width:1.5}.dropbox{fill:#f4e0dc;stroke:#bd7c70;stroke-width:1.5;stroke-dasharray:5 3}
      .data{stroke:#376650;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.cancel{stroke:#a65047;stroke-width:2;stroke-dasharray:5 3;fill:none;stroke-linejoin:round;marker-end:url(#drop)}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="623" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="20" y="34" class="heading">预测错误：以 I5 为边界，只撤销年轻指令</text>
  <text x="20" y="59" class="note">E14 沿后 I2 已提交；I5 已发射，尚未判定。下图只列相关状态。</text>
  <rect x="15" y="72" width="770" height="231" rx="10" class="panel"/>
  <text x="31" y="98" class="small label">ROB · 从队首到队尾</text>
  <g text-anchor="middle">
    <rect x="31" y="112" width="140" height="75" rx="7" class="block"/><text x="101" y="135" class="label">I3 · ADD</text><text x="101" y="157" class="tiny">p35 = 9</text><text x="101" y="175" class="tiny">已完成</text>
    <rect x="180" y="112" width="140" height="75" rx="7" class="block"/><text x="250" y="135" class="label">I4 · ADD</text><text x="250" y="157" class="tiny">p36 = 7</text><text x="250" y="175" class="tiny">已完成</text>
    <rect x="329" y="112" width="140" height="75" rx="7" class="select"/><text x="399" y="135" class="label accent">I5 · BEQ</text><text x="399" y="157" class="tiny">分支</text><text x="399" y="175" class="tiny">尚未确认</text>
    <rect x="478" y="112" width="140" height="75" rx="7" class="fault"/><text x="548" y="135" class="label faulttext">I6 · ADD</text><text x="548" y="157" class="tiny faulttext">p37 = 10</text><text x="548" y="175" class="tiny">推测结果</text>
    <rect x="627" y="112" width="140" height="75" rx="7" class="fault"/><text x="697" y="135" class="label faulttext">I7 · SW</text><text x="697" y="157" class="tiny">第一次登记</text><text x="697" y="175" class="tiny">尚未提交</text>
  </g>
  <text x="31" y="213" class="tiny">此时的物理寄存器映射</text>
  <rect x="31" y="225" width="353" height="62" rx="7" class="pred"/>
  <text x="44" y="248" class="small label">RMT：当前重命名映射</text>
  <text x="44" y="272" class="small">x5 → p36，<tspan class="faulttext label">x8 → p37</tspan></text>
  <rect x="396" y="225" width="371" height="62" rx="7" class="reg"/>
  <text x="409" y="248" class="small label">CMT：已提交映射</text>
  <text x="409" y="272" class="small">x5 → p33（值 6），x8 → p8</text>

  <rect x="15" y="315" width="770" height="52" rx="9" class="select"/>
  <text x="31" y="336" class="small label accent">C15：I5 比较 p34 与 p36，结果相等，确认应跳转到 0x11C。</text>
  <text x="31" y="355" class="tiny">先前预测继续顺序取指；E15 需同时处理提交、清除和重定向。</text>
  <path d="M399 367V391" class="data"/>
  <rect x="15" y="393" width="770" height="211" rx="10" class="panel"/>
  <text x="31" y="417" class="small label">E15 沿后：较老指令保留，较年轻指令失效</text>
  <g text-anchor="middle">
    <rect x="31" y="431" width="140" height="52" rx="7" class="reg"/><text x="101" y="452" class="small label">I3 正常提交</text><text x="101" y="470" class="tiny">保留 p35</text>
    <rect x="180" y="431" width="140" height="52" rx="7" class="block"/><text x="250" y="452" class="label">I4</text><text x="250" y="470" class="tiny">保留在 ROB</text>
    <rect x="329" y="431" width="140" height="52" rx="7" class="block"/><text x="399" y="452" class="label">I5</text><text x="399" y="470" class="tiny">确认后保留</text>
    <rect x="478" y="431" width="140" height="52" rx="7" class="dropbox"/><text x="548" y="452" class="label faulttext">I6 ×</text><text x="548" y="470" class="tiny faulttext">取消</text>
    <rect x="627" y="431" width="140" height="52" rx="7" class="dropbox"/><text x="697" y="452" class="label faulttext">I7 ×</text><text x="697" y="470" class="tiny faulttext">即使目标正确</text>
  </g>
  <rect x="31" y="496" width="353" height="64" rx="7" class="reg"/>
  <text x="44" y="519" class="small label">RMT：x8 恢复 p35（值 9）</text>
  <text x="44" y="543" class="small">x5 仍指向 p36，不退回 p33</text>
  <rect x="396" y="496" width="371" height="64" rx="7" class="fault"/>
  <text x="409" y="519" class="small label faulttext">p37：清除后待安全回收</text>
  <text x="409" y="543" class="tiny">旧 p8 已由 I3 正常提交释放</text>
  <rect x="31" y="572" width="736" height="22" rx="5" class="block"/>
  <text x="399" y="588" class="small label" text-anchor="middle">I8 未登记；FPC ← 0x11C，重新取得 I7</text>
</svg>
