<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 669" width="800" height="669" role="img" aria-labelledby="title desc">
  <title id="title">两个硬件线程各有独立程序状态，但共享一个核心的执行资源</title>
  <desc id="desc">同一个处理器核心容纳 A 与 B 两个硬件线程。各线程保存自己的 FPC、RMT、CMT 及 ROB 的程序次序、提交与恢复信息。例中 A 的 RMT[x5]为p65，CMT[x5]为p5；B 的 RMT[x5]为p68，CMT[x5]为p37；对应的是本线程初始的已提交版本以及各自的最新重命名版本。已登记的工作及共享资源的返回带有线程标签 A 或 B 和本线程记录编号，返回时更新正确的记录。两个线程共享同一 PRF p0 至 p69、整数 ALU、AGU 和 LSU；共享的内存例中 M[0x200]为6 供线程 A 使用，M[0x300]为10 供 B 使用，选择不重叠地址以便观察。分支或异常恢复按线程处理；不代表两个独立核心，也不意味每种硬件实现都采用独立物理 ROB 或 RMT、电路组织固定。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376650"/></marker>
    <marker id="ret" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7680"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:17px}
      .heading{font-size:22px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.note{font-size:15px;fill:#4f695a}.ftext{fill:#496872}.accent{fill:#8a5d1c}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.a{fill:#d2e6d7;stroke:#376650;stroke-width:1.5}.b{fill:#e0eaed;stroke:#72929b;stroke-width:1.5}.shared{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.ctl{fill:#f2e7d1;stroke:#bd9857;stroke-width:1.5}
      .data{stroke:#376650;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .response{stroke:#5b7680;stroke-width:2;stroke-dasharray:5 4;fill:none;stroke-linejoin:round;marker-end:url(#ret)}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="667" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="20" y="34" class="heading">一个核心内的两个执行上下文</text>
  <text x="20" y="59" class="note">分开保存 A、B 的程序状态，以线程身份区分指令；共享实际执行硬件。</text>
  <rect x="15" y="72" width="770" height="525" rx="10" class="panel"/>
  <text x="31" y="98" class="small label">线程独立的状态与次序（逻辑上分开保存）</text>

  <rect x="31" y="111" width="358" height="145" rx="8" class="a"/>
  <text x="46" y="134" class="label">硬件线程 A</text>
  <text x="46" y="158" class="small">FPC：自己的取指位置</text>
  <text x="46" y="180" class="small">RMT：x5 → p65；CMT：x5 → p5</text>
  <text x="46" y="203" class="small">ROB：A 自己的程序次序与提交</text>
  <text x="46" y="226" class="tiny">独立的分支、异常与恢复状态</text>
  <rect x="411" y="111" width="358" height="145" rx="8" class="b"/>
  <text x="426" y="134" class="label">硬件线程 B</text>
  <text x="426" y="158" class="small">FPC：自己的取指位置</text>
  <text x="426" y="180" class="small">RMT：x5 → p68；CMT：x5 → p37</text>
  <text x="426" y="203" class="small">ROB：B 自己的程序次序与提交</text>
  <text x="426" y="226" class="tiny">独立的分支、异常与恢复状态</text>

  <path d="M210 256V282" class="data"/><path d="M590 256V282" class="data"/>
  <rect x="31" y="282" width="738" height="52" rx="8" class="ctl"/>
  <text x="400" y="303" class="small label accent" text-anchor="middle">候选指令与结果记录：线程标签 A／B + 本线程记录编号</text>
  <text x="400" y="323" class="tiny" text-anchor="middle">共享资源选择可执行的指令；返回信息必须更新正确的线程记录</text>
  <path d="M400 334V351" class="data"/>

  <rect x="31" y="351" width="738" height="210" rx="8" class="shared"/>
  <text x="46" y="375" class="small label">共享的物理寄存器与执行资源（仅一套）</text>
  <rect x="48" y="388" width="704" height="51" rx="6" fill="#fafbf8" stroke="#82a18e" stroke-width="1.4"/>
  <text x="400" y="409" class="label" text-anchor="middle">PRF：p0～p69</text>
  <text x="400" y="429" class="tiny" text-anchor="middle">分配不同物理位置保存各线程的值，不按 x5 这个名字直接读写</text>
  <path d="M165 439V456" class="data"/><path d="M400 439V456" class="data"/><path d="M635 439V456" class="data"/>
  <rect x="48" y="456" width="224" height="54" rx="7" class="shared"/>
  <text x="160" y="478" class="label" text-anchor="middle">ALU</text><text x="160" y="499" class="tiny" text-anchor="middle">整数运算</text>
  <rect x="288" y="456" width="224" height="54" rx="7" class="shared"/>
  <text x="400" y="478" class="label" text-anchor="middle">AGU</text><text x="400" y="499" class="tiny" text-anchor="middle">计算访存地址</text>
  <rect x="528" y="456" width="224" height="54" rx="7" class="shared"/>
  <text x="640" y="478" class="label" text-anchor="middle">LSU</text><text x="640" y="499" class="tiny" text-anchor="middle">访存等待与完成</text>
  <path d="M512 483H528" class="data"/>
  <rect x="48" y="522" width="704" height="27" rx="5" class="b"/>
  <text x="400" y="541" class="tiny ftext" text-anchor="middle">带线程标签和记录编号的返回 → 对应 PRF 位置与本线程的记录</text>
  <path d="M752 535H777V185H769" class="response"/>
  <path d="M48 535H23V185H31" class="response"/>

  <text x="31" y="585" class="tiny">本图只画逻辑分工，省略前端流水线、具体队列与端口组织。</text>
  <path d="M628 561V608" class="data"/><path d="M653 608V561" class="response"/>
  <text x="617" y="585" text-anchor="end" class="tiny">读请求</text><text x="664" y="585" class="tiny ftext">读响应</text>
  <rect x="15" y="609" width="770" height="45" rx="8" class="shared"/>
  <text x="31" y="636" class="small label">共享内存</text>
  <text x="165" y="636" class="small">A 数据：M[0x200] = 6</text>
  <text x="467" y="636" class="small">B 数据：M[0x300] = 10</text>
</svg>
