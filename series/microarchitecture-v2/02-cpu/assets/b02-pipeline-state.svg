<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1004" width="760" height="1004" role="img" aria-labelledby="title desc">
  <title id="title">五级顺序指令流水线保存什么状态？</title>
  <desc id="desc">IF 用取指地址 FPC 读出指令，成功取指时递增 FPC，并将指令和本条指令 PC 保存到 IF/ID。ID 译码和读取两读一写寄存器文件，将源寄存器编号、操作数、目的编号、立即数、PC 和控制字段等保存到 ID/EX。EX 选择正确操作数算出 R 或地址，处理分支比较和目标计算；EX/MEM 保存 R、写内存数据、PC、目标编号和控制字段。MEM 对 Load/Store 访问内存，将读取值 L 或算术结果 R 传到 MEM/WB；WB 选择最终写回值 D，按有效位及写使能写回 RF。每组流水寄存器还有 valid 位表示是否存在有效指令。WB 写回数据还可以在 ID 同一拍旁路；EX/MEM 的已就绪算术结果及 MEM/WB 的最终写回值可以旁路到 EX。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="feedback-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#5b7680"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14.5px}.label{font-weight:700}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.5}
      .block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}.arch{fill:#d2e6d7;stroke:#376650;stroke-width:1.7}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .feedback{stroke:#5b7680;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 4;marker-end:url(#feedback-arrow)}
      .ftext{fill:#496872}.accent{fill:#8a5d1c}.valid{fill:#f2e7d1;stroke:#bd9857;stroke-width:1.3}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="1002" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="34" class="heading">五级流水线：每条指令携带自己的状态</text>
  <rect x="23" y="48" width="20" height="15" rx="3" class="reg"/><text x="50" y="60" class="tiny">内部寄存器</text>
  <rect x="157" y="48" width="20" height="15" rx="3" class="arch"/><text x="184" y="60" class="tiny">程序所见状态</text>
  <path d="M307 55H340" class="data"/><text x="350" y="60" class="tiny">数据推进</text>
  <path d="M440 55H473" class="feedback"/><text x="483" y="60" class="tiny ftext">写回及旁路</text>
  <rect x="600" y="48" width="20" height="15" rx="3" class="valid"/><text x="628" y="60" class="tiny accent">有效位</text>

  <!-- Fetch stage -->
  <rect x="17" y="77" width="726" height="102" rx="10" class="panel"/>
  <text x="32" y="111" class="label">IF</text><text x="32" y="135" class="small">取指</text>
  <rect x="120" y="91" width="136" height="49" rx="7" class="reg"/><text x="188" y="112" text-anchor="middle" class="label">FPC</text><text x="188" y="131" text-anchor="middle" class="tiny">取指地址</text>
  <rect x="306" y="91" width="158" height="49" rx="7" class="block"/><text x="385" y="121" text-anchor="middle" class="label">读取指令</text>
  <path d="M256 116H306" class="data"/>
  <text x="500" y="111" class="small label">取指成功</text><text x="500" y="134" class="small">FPC ← FPC + 4</text>
  <text x="120" y="163" class="tiny">FPC 的值与指令一起保存为本条 PC。</text>
  <text x="500" y="163" class="tiny accent">分支可重定向 FPC</text>
  <path d="M385 179V198" class="data"/>

  <g>
    <rect x="120" y="200" width="542" height="48" rx="7" class="reg"/>
    <text x="134" y="229" class="label">IF/ID</text>
    <rect x="230" y="211" width="61" height="26" rx="5" class="valid"/><text x="260" y="229" text-anchor="middle" class="small accent label">valid</text>
    <text x="310" y="229" class="small">本条 PC、指令 IR</text>
  </g>
  <path d="M385 248V267" class="data"/>

  <!-- Decode stage -->
  <rect x="17" y="269" width="726" height="116" rx="10" class="panel"/>
  <text x="32" y="303" class="label">ID</text><text x="32" y="326" class="small">译码</text><text x="32" y="348" class="small">读数</text>
  <rect x="120" y="283" width="176" height="57" rx="7" class="block"/>
  <text x="208" y="305" text-anchor="middle" class="label">译码</text><text x="208" y="326" text-anchor="middle" class="tiny">编号、立即数、控制</text>
  <path d="M296 312H341" class="data"/>
  <rect x="341" y="283" width="170" height="57" rx="7" class="arch"/>
  <text x="426" y="305" text-anchor="middle" class="label">RF</text><text x="426" y="326" text-anchor="middle" class="tiny">2 个读口、1 个写口</text>
  <path d="M511 312H548" class="data"/>
  <rect x="548" y="283" width="114" height="57" rx="7" class="block"/>
  <text x="605" y="305" text-anchor="middle" class="label">X、W</text><text x="605" y="326" text-anchor="middle" class="tiny">源操作数</text>
  <text x="120" y="365" class="tiny ftext">WB→ID：同拍写回的新值可以直接作为读值。</text>
  <path d="M385 385V404" class="data"/>

  <g>
    <rect x="120" y="406" width="542" height="62" rx="7" class="reg"/>
    <text x="134" y="432" class="label">ID/EX</text>
    <rect x="230" y="415" width="61" height="26" rx="5" class="valid"/><text x="260" y="433" text-anchor="middle" class="small accent label">valid</text>
    <text x="310" y="432" class="small">PC、X/W、rs1/rs2、rd</text>
    <text x="310" y="454" class="tiny">立即数、写使能及执行控制等</text>
  </g>
  <path d="M385 468V487" class="data"/>

  <!-- Execute stage -->
  <rect x="17" y="489" width="726" height="117" rx="10" class="panel"/>
  <text x="32" y="524" class="label">EX</text><text x="32" y="547" class="small">执行</text>
  <rect x="120" y="503" width="180" height="57" rx="7" class="block"/>
  <text x="210" y="525" text-anchor="middle" class="label">操作数选择</text><text x="210" y="546" text-anchor="middle" class="tiny">X / W / 立即数 / 旁路</text>
  <path d="M300 532H345" class="data"/>
  <rect x="345" y="503" width="144" height="57" rx="7" class="block"/>
  <text x="417" y="525" text-anchor="middle" class="label">ALU</text><text x="417" y="546" text-anchor="middle" class="tiny">R 或地址</text>
  <rect x="524" y="503" width="138" height="57" rx="7" class="block"/>
  <text x="593" y="525" text-anchor="middle" class="small label">分支比较</text><text x="593" y="546" text-anchor="middle" class="tiny">PC + 偏移</text>
  <text x="120" y="585" class="tiny ftext">EX/MEM、MEM/WB 的就绪数据可直接送入操作数选择。</text>
  <path d="M385 606V625" class="data"/>

  <g>
    <rect x="120" y="627" width="542" height="62" rx="7" class="reg"/>
    <text x="134" y="652" class="label">EX/MEM</text>
    <rect x="230" y="636" width="61" height="26" rx="5" class="valid"/><text x="260" y="654" text-anchor="middle" class="small accent label">valid</text>
    <text x="310" y="652" class="small">PC、R、Store 数据、rd、控制</text>
    <text x="310" y="675" class="tiny ftext">算术结果 R（就绪时）可旁路至 EX</text>
  </g>
  <path d="M385 689V708" class="data"/>

  <!-- Memory stage -->
  <rect x="17" y="710" width="726" height="88" rx="10" class="panel"/>
  <text x="32" y="745" class="label">MEM</text><text x="32" y="768" class="small">访存</text>
  <rect x="120" y="724" width="130" height="49" rx="7" class="block"/>
  <text x="185" y="744" text-anchor="middle" class="small label">R / W</text><text x="185" y="762" text-anchor="middle" class="tiny">地址 / 写数据</text>
  <path d="M250 749H300" class="data"/>
  <rect x="300" y="724" width="175" height="49" rx="7" class="arch"/>
  <text x="387" y="744" text-anchor="middle" class="label">数据内存</text><text x="387" y="762" text-anchor="middle" class="tiny">Load / Store</text>
  <path d="M475 749H524" class="data"/>
  <rect x="524" y="724" width="138" height="49" rx="7" class="block"/>
  <text x="593" y="744" text-anchor="middle" class="small label">L / R</text><text x="593" y="762" text-anchor="middle" class="tiny">读值 / 算术结果</text>
  <path d="M185 773V784H593V773" class="data"/>
  <rect x="305" y="777" width="165" height="17" rx="3" fill="#fafbf8"/>
  <text x="388" y="791" text-anchor="middle" class="tiny">非访存：直接传 R</text>
  <path d="M385 798V817" class="data"/>

  <g>
    <rect x="120" y="819" width="542" height="62" rx="7" class="reg"/>
    <text x="134" y="845" class="label">MEM/WB</text>
    <rect x="230" y="828" width="61" height="26" rx="5" class="valid"/><text x="260" y="846" text-anchor="middle" class="small accent label">valid</text>
    <text x="310" y="845" class="small">PC、R/L、rd、控制</text>
    <text x="310" y="868" class="tiny ftext">最终写回值可旁路至 EX 和 ID</text>
  </g>
  <path d="M385 881V900" class="data"/>

  <!-- Writeback stage and feedback -->
  <rect x="17" y="902" width="726" height="73" rx="10" class="panel"/>
  <text x="32" y="936" class="label">WB</text><text x="32" y="959" class="small">写回</text>
  <rect x="120" y="915" width="227" height="45" rx="7" class="block"/>
  <text x="234" y="943" text-anchor="middle" class="small label">选择 R 或 L 为写回值</text>
  <path d="M347 938H390" class="data"/>
  <rect x="390" y="915" width="272" height="45" rx="7" class="block"/>
  <text x="526" y="943" text-anchor="middle" class="small label">D、rd、有效写使能 → RF</text>
  <path d="M662 938H708V351H426V340" class="feedback"/>
  <text x="718" y="660" transform="rotate(-90 718 660)" class="tiny ftext" text-anchor="middle">写回 RF</text>
  <text x="380" y="993" text-anchor="middle" class="small">各级可同时处理不同指令；valid=0 表示该位置无有效指令。</text>
</svg>
