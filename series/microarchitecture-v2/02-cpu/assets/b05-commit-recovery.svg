<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 542" width="800" height="542" role="img" aria-labelledby="title desc">
  <title id="title">通过已提交映射恢复精确异常前的寄存器版本</title>
  <desc id="desc">E9 沿后，I0 已提交，I1 至 I5 尚未提交。CMT 的 x6 指向 p32（值5），x5 指向 p5（值0），x7 指向 p7（值0），x8 指向 p8（值0）；RMT 则将 x5 指向 p36（值7），x7 指向 p34（未就绪），x8 指向 p35（值9），x6 仍指向 p32（值5）。E9 返回访存异常，E10 将 I1 的异常记录在 ROB。E11 在队首处理异常，恢复 RMT 为 CMT，取消 I1 至 I5 的记录。未提交目的物理寄存器 p33、p34、p35、p36 在相关指令失效且旧响应不得写入复用槽位后，才可以重新放回空闲池。p5、p7、p8、p32 等已提交映射保留，无须将数据拷回固定编号。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376650"/></marker>
    <marker id="faultarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65047"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:17px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14px}.note{font-size:15px;fill:#4f695a}.label{font-weight:700}.accent{fill:#8a5d1c}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.header{fill:#e0ebe3}.cmt{fill:#d2e6d7;stroke:#376650;stroke-width:1.4}.rmt{fill:#e0eaed;stroke:#72929b;stroke-width:1.4}
      .wait{fill:#f2e7d1;stroke:#bd9857;stroke-width:1.3}.fault{fill:#f4e0dc;stroke:#bd7c70;stroke-width:1.5}.faulttext{fill:#99493e}
      .data{stroke:#376650;stroke-width:2.2;fill:none;stroke-linejoin:round;marker-end:url(#arrow)}
      .drop{stroke:#a65047;stroke-width:2;fill:none;stroke-linejoin:round;marker-end:url(#faultarrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="540" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="20" y="34" class="heading">恢复精确状态，不需要把数据再写回旧编号</text>
  <text x="20" y="59" class="note">E9 沿后，I0 已提交；I1～I5 尚未提交。这里只列有关的四项映射。</text>
  <rect x="15" y="72" width="770" height="193" rx="10" class="panel"/>
  <rect x="31" y="84" width="738" height="35" rx="5" class="header"/>
  <text x="76" y="105" text-anchor="middle" class="tiny label">逻辑编号</text>
  <text x="275" y="106" text-anchor="middle" class="small label">CMT · 已提交映射</text>
  <text x="602" y="106" text-anchor="middle" class="small label">RMT · 当前重命名映射</text>
  <g text-anchor="middle" class="small">
    <text x="76" y="143" class="label">x6</text><rect x="139" y="125" width="272" height="28" rx="5" class="cmt"/><text x="275" y="144">p32 = 5</text><rect x="465" y="125" width="273" height="28" rx="5" class="cmt"/><text x="601.5" y="144">p32 = 5</text>
    <text x="76" y="177" class="label">x5</text><rect x="139" y="159" width="272" height="28" rx="5" class="cmt"/><text x="275" y="178">p5 = 0</text><rect x="465" y="159" width="273" height="28" rx="5" class="rmt"/><text x="601.5" y="178">p36 = 7</text>
    <text x="76" y="211" class="label">x7</text><rect x="139" y="193" width="272" height="28" rx="5" class="cmt"/><text x="275" y="212">p7 = 0</text><rect x="465" y="193" width="273" height="28" rx="5" class="wait"/><text x="601.5" y="212" class="accent">p34 尚未就绪</text>
    <text x="76" y="245" class="label">x8</text><rect x="139" y="227" width="272" height="28" rx="5" class="cmt"/><text x="275" y="246">p8 = 0</text><rect x="465" y="227" width="273" height="28" rx="5" class="rmt"/><text x="601.5" y="246">p35 = 9</text>
  </g>

  <rect x="15" y="277" width="770" height="56" rx="10" class="fault"/>
  <text x="31" y="299" class="small label faulttext">E10：将 E9 返回的访问异常记录在 ROB；p33 仍未就绪。</text>
  <text x="31" y="319" class="tiny faulttext">E11 在队首处理异常：取消 I1～I5，不允许它们提交。</text>
  <path d="M274 333V354" class="data"/>
  <path d="M601.5 333V354" class="drop"/>

  <rect x="15" y="358" width="770" height="143" rx="10" class="panel"/>
  <text x="31" y="381" class="small label">E11 沿后：恢复映射，撤销未提交版本</text>
  <rect x="31" y="393" width="364" height="95" rx="7" class="cmt"/>
  <text x="213" y="417" text-anchor="middle" class="label">RMT ← CMT</text>
  <text x="213" y="440" text-anchor="middle" class="small">x5 → p5，x6 → p32</text>
  <text x="213" y="460" text-anchor="middle" class="small">x7 → p7，x8 → p8</text>
  <text x="213" y="480" text-anchor="middle" class="tiny">已提交的物理位置与内容保持</text>
  <rect x="411" y="393" width="358" height="95" rx="7" class="fault"/>
  <text x="590" y="417" text-anchor="middle" class="label faulttext">撤销 p33、p34、p35、p36</text>
  <text x="590" y="440" text-anchor="middle" class="small">相关指令失效；旧响应不得污染</text>
  <text x="590" y="460" text-anchor="middle" class="small">这些位置被重新分配后的值</text>
  <text x="590" y="480" text-anchor="middle" class="tiny">满足安全条件后，才可归还空闲池</text>
  <text x="20" y="524" class="note">保留 p5、p7、p8、p32。恢复的是逻辑到物理的对应关系，而不是复制数据。</text>
</svg>
