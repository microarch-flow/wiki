  <path d="M700 423V534" class="grid"/>
  <text x="28" y="415" class="label" text-anchor="start">③ 预测不跳转，实际却跳转</text>
  <text x="772" y="415" class="finish" text-anchor="end">I7 E17 重新登记</text>
  <text x="28" y="447" class="rowlabel" text-anchor="start">I6</text>
  <rect x="152" y="426" width="44" height="29" rx="5" class="wrong"/>
  <text x="174" y="446" class="cell waittext" text-anchor="middle">取</text>
  <rect x="202" y="426" width="44" height="29" rx="5" class="wrong"/>
  <text x="224" y="446" class="cell waittext" text-anchor="middle">登</text>
  <rect x="252" y="426" width="44" height="29" rx="5" class="wrong"/>
  <text x="274" y="446" class="cell waittext" text-anchor="middle">发</text>
  <rect x="352" y="426" width="44" height="29" rx="5" class="wrong"/>
  <text x="374" y="446" class="cell waittext" text-anchor="middle">完</text>
  <rect x="552" y="426" width="44" height="29" rx="5" class="discard"/>
  <text x="574" y="446" class="cell error" text-anchor="middle">×</text>
  <text x="28" y="482" class="rowlabel" text-anchor="start">I7（原）</text>
  <rect x="202" y="461" width="44" height="29" rx="5" class="wrong"/>
  <text x="224" y="481" class="cell waittext" text-anchor="middle">取</text>
  <rect x="402" y="461" width="44" height="29" rx="5" class="wrong"/>
  <text x="424" y="481" class="cell waittext" text-anchor="middle">登</text>
  <rect x="552" y="461" width="44" height="29" rx="5" class="discard"/>
  <text x="574" y="481" class="cell error" text-anchor="middle">×</text>
  <text x="28" y="517" class="rowlabel" text-anchor="start">I7（重取）</text>
  <rect x="602" y="496" width="44" height="29" rx="5" class="normal"/>
  <text x="624" y="516" class="cell " text-anchor="middle">取</text>
  <rect x="652" y="496" width="44" height="29" rx="5" class="good"/>
  <text x="674" y="516" class="cell " text-anchor="middle">登</text>
  <rect x="702" y="496" width="44" height="29" rx="5" class="normal"/>
  <text x="724" y="516" class="cell " text-anchor="middle">发</text>
  <text x="20" y="563" class="tiny dim">取：取指接受　登：登记　发：发射　判：判定实际下一地址　完：完成　交：提交　×：取消</text>
  <text x="20" y="584" class="tiny dim">黄框：错误路径相关工作，I6 在 E11 产生 p37=10；E15 同时清除未登记的年轻前端指令。</text>
  <text x="20" y="608" class="note">I5 于 E15 判定、E17 提交；正确路径 I7 于 E16 发射，仅准备访存，不能提前写内存。</text>
</svg>
