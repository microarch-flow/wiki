  <path d="M600 302V377" class="grid"/>
  <path d="M650 302V377" class="grid"/>
  <path d="M700 302V377" class="grid"/>
  <text x="28" y="294" class="label" text-anchor="start">② 预测跳转，且实际目标匹配</text>
  <text x="772" y="294" class="finish" text-anchor="end">I7 E8 有效登记</text>
  <text x="28" y="326" class="rowlabel" text-anchor="start">I7</text>
  <rect x="152" y="305" width="44" height="29" rx="5" class="normal"/>
  <text x="174" y="325" class="cell " text-anchor="middle">取</text>
  <rect x="202" y="305" width="44" height="29" rx="5" class="good"/>
  <text x="224" y="325" class="cell " text-anchor="middle">登</text>
  <rect x="602" y="305" width="44" height="29" rx="5" class="normal"/>
  <text x="624" y="325" class="cell " text-anchor="middle">发</text>
  <text x="28" y="361" class="rowlabel" text-anchor="start">I8</text>
  <rect x="202" y="340" width="44" height="29" rx="5" class="normal"/>
  <text x="224" y="360" class="cell " text-anchor="middle">取</text>
  <rect x="402" y="340" width="44" height="29" rx="5" class="normal"/>
  <text x="424" y="360" class="cell " text-anchor="middle">登</text>
  <rect x="14" y="392" width="772" height="148" rx="9" class="panel"/>
  <rect x="551" y="422" width="46" height="112" rx="5" class="hl"/>
  <path d="M100 423V534" class="grid"/>
  <path d="M150 423V534" class="grid"/>
  <path d="M200 423V534" class="grid"/>
  <path d="M250 423V534" class="grid"/>
  <path d="M300 423V534" class="grid"/>
