<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 437" width="750" height="437" role="img" aria-labelledby="title desc">
<title id="title">两输入两输出结构做和差运算</title>
<desc id="desc">a1=1，a2=2。第一个输出叠加1/√2与2/√2，第二个叠加1/√2与-2/√2，得到场幅3/√2与-1/√2。总功率不变。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376a55"/></marker>
<marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426f89"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.head{font-size:23px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.hint{font-size:16px;fill:#4f695a}.blue{fill:#426f89}.orange{fill:#946924}.accent{fill:#815718;font-weight:700}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.unit{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.phase{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.digital{fill:#e3edf3;stroke:#8aa5b2;stroke-width:1.3}.out{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.3}
.wire,.elec{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.wire{stroke:#376a55}.elec{stroke:#426f89;marker-end:url(#blue-arrow)}.axis{fill:none;stroke:#899a91;stroke-width:1.2}.guide{stroke:#b6c5bb;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>
</defs>
<rect x="1" y="1" width="748" height="435" rx="12" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="23" y="35" class="head" text-anchor="start">同一对输入，同时形成场幅的和与差</text><text x="23" y="62" class="hint" text-anchor="start">理想无损 50:50 耦合结构 · 等效端口相位已对齐</text><rect x="25" y="84" width="142" height="65" rx="8" class="unit"/><text x="96.0" y="111.0" class="label" text-anchor="middle">a₁ = 1</text><text x="96.0" y="134.0" class="small" text-anchor="middle">P = 100 µW</text><rect x="25" y="183" width="142" height="65" rx="8" class="unit"/><text x="96.0" y="210.0" class="label" text-anchor="middle">a₂ = 2</text><text x="96.0" y="233.0" class="small" text-anchor="middle">P = 400 µW</text><rect x="207" y="76" width="321" height="182" rx="8" class="panel"/><text x="367.5" y="102" class="label" text-anchor="middle">耦合与场幅叠加</text><path d="M207 166L528 166" class="guide"/><text x="367.5" y="140" class="label" text-anchor="middle">b₁ = (a₁ + a₂) / √2</text><text x="367.5" y="206" class="label" text-anchor="middle">b₂ = (a₁ − a₂) / √2</text><path d="M167 116H202" class="wire"/><path d="M167 215H202" class="wire"/><path d="M528 132H556" class="wire"/><path d="M528 200H556" class="wire"/><rect x="560" y="101" width="165" height="65" rx="8" class="out"/><text x="642.5" y="128.0" class="label" text-anchor="middle">b₁ = 3/√2</text><text x="642.5" y="151.0" class="small" text-anchor="middle">450 µW</text><rect x="560" y="176" width="165" height="65" rx="8" class="out"/><text x="642.5" y="203.0" class="label" text-anchor="middle">b₂ = −1/√2</text><text x="642.5" y="226.0" class="small" text-anchor="middle">50 µW</text><rect x="16" y="278" width="718" height="117" rx="8" class="panel"/><text x="31" y="306" class="label" text-anchor="start">各输入对输出的场幅贡献</text><text x="252" y="330" class="hint" text-anchor="middle">来自 a₁</text><text x="468" y="330" class="hint" text-anchor="middle">来自 a₂</text><text x="641" y="330" class="hint" text-anchor="middle">叠加结果</text><text x="32" y="352" class="small" text-anchor="start">b₁（和）</text><text x="252" y="352" class="small" text-anchor="middle">+1/√2</text><text x="468" y="352" class="small" text-anchor="middle">+2/√2</text><text x="641" y="352" class="small label" text-anchor="middle">3/√2</text><text x="32" y="380" class="small" text-anchor="start">b₂（差）</text><text x="252" y="380" class="small" text-anchor="middle">+1/√2</text><text x="468" y="380" class="small" text-anchor="middle">−2/√2</text><text x="641" y="380" class="small label" text-anchor="middle">−1/√2</text><text x="24" y="421" class="hint" text-anchor="start">净输入功率 500 µW = 净输出功率 500 µW（理想无损）</text>
</svg>
