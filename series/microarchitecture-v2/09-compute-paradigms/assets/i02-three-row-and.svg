<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 515" width="700" height="515" role="img" aria-labelledby="title desc">
<title id="title">三行激活怎样实现逐列 AND</title><desc id="desc">第0列工作单元值1、0、0，感测低侧得到0；第1列值1、1、0，感测高侧得到1。两个列共享各自独立位线；第三个行恒为0，所以多数判决相当于前两行AND。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
      <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.sub{font-size:16px;fill:#4f695a}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .mem{fill:#edf1df;stroke:#93a184;stroke-width:1.4}
      .logic{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}
      .result{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.5}
      .low{fill:#f5eee2;stroke:#c1a57f;stroke-width:1.3}
      .wire{fill:none;stroke:#376a55;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .line{fill:none;stroke:#376a55;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .boundary{stroke:#7b897f;stroke-width:1.8;stroke-dasharray:7 5}
      </style></defs>
<rect x="1" y="1" width="698" height="513" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="22" y="34" text-anchor="start" class="head">三格同时连到各自列的共享位线</text>
<text x="22" y="58" text-anchor="start" class="sub">位线预充约 VDD/2；第三行准备为全 0。</text>
<text x="309" y="94" text-anchor="middle" class="label">第 0 列</text>
<text x="540" y="94" text-anchor="middle" class="label">第 1 列</text>
<rect x="20" y="112" width="660" height="63" rx="8" class="panel"/>
<text x="36" y="149" text-anchor="start" class="label">工作行：X₁</text>
<rect x="240" y="121" width="70" height="45" rx="6" class="mem"/>
<text x="275" y="148" text-anchor="middle" class="label">1</text>
<path d="M310 143.5H343" class="line"/>
<rect x="471" y="121" width="70" height="45" rx="6" class="mem"/>
<text x="506" y="148" text-anchor="middle" class="label">1</text>
<path d="M541 143.5H574" class="line"/>
<rect x="20" y="187" width="660" height="63" rx="8" class="panel"/>
<text x="36" y="224" text-anchor="start" class="label">工作行：W₀</text>
<rect x="240" y="196" width="70" height="45" rx="6" class="low"/>
<text x="275" y="223" text-anchor="middle" class="label">0</text>
<path d="M310 218.5H343" class="line"/>
<rect x="471" y="196" width="70" height="45" rx="6" class="mem"/>
<text x="506" y="223" text-anchor="middle" class="label">1</text>
<path d="M541 218.5H574" class="line"/>
<rect x="20" y="262" width="660" height="63" rx="8" class="panel"/>
<text x="36" y="299" text-anchor="start" class="label">工作行：全零</text>
<rect x="240" y="271" width="70" height="45" rx="6" class="low"/>
<text x="275" y="298" text-anchor="middle" class="label">0</text>
<path d="M310 293.5H343" class="line"/>
<rect x="471" y="271" width="70" height="45" rx="6" class="low"/>
<text x="506" y="298" text-anchor="middle" class="label">0</text>
<path d="M541 293.5H574" class="line"/>
<path d="M343 107V324" class="line"/>
<circle cx="343" cy="143.5" r="3.5" fill="#376a55"/>
<circle cx="343" cy="218.5" r="3.5" fill="#376a55"/>
<circle cx="343" cy="293.5" r="3.5" fill="#376a55"/>
<path d="M343 324V350" class="wire"/>
<path d="M574 107V324" class="line"/>
<circle cx="574" cy="143.5" r="3.5" fill="#376a55"/>
<circle cx="574" cy="218.5" r="3.5" fill="#376a55"/>
<circle cx="574" cy="293.5" r="3.5" fill="#376a55"/>
<path d="M574 324V350" class="wire"/>
<text x="328" y="340" text-anchor="end" class="small">偏低</text>
<text x="559" y="340" text-anchor="end" class="small">偏高</text>
<rect x="259" y="355" width="168" height="60" rx="8" class="logic"/>
<text x="343.0" y="379.5" text-anchor="middle" class="label">感测放大器</text>
<text x="343.0" y="402.5" text-anchor="middle" class="small">多数值：0</text>
<rect x="490" y="355" width="168" height="60" rx="8" class="logic"/>
<text x="574.0" y="379.5" text-anchor="middle" class="label">感测放大器</text>
<text x="574.0" y="402.5" text-anchor="middle" class="small">多数值：1</text>
<path d="M343 415V440" class="wire"/>
<path d="M574 415V440" class="wire"/>
<rect x="259" y="444" width="168" height="43" rx="8" class="result"/>
<text x="343.0" y="471.5" text-anchor="middle" class="label">1 AND 0 = 0</text>
<rect x="490" y="444" width="168" height="43" rx="8" class="result"/>
<text x="574.0" y="471.5" text-anchor="middle" class="label">1 AND 1 = 1</text>
<text x="22" y="501" text-anchor="start" class="sub">理想示意：已接通的工作单元以方框表示，省略电路细节。</text>
</svg>
