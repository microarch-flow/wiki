<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="title desc">
  <title id="title">将两个支路电流汇成一个点积</title>
  <desc id="desc">输入2与3分别驱动40 mV与60 mV，预置权重4与5对应40 µS和50 µS。两支路流入同一列端，分别贡献1.6和3.0 µA。列端读出电路使列电位接近0 V，接收总电流4.6 µA。按每单位0.2 µA换算为23。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#173d35}
      .head{font-size:22px;font-weight:700}.sub{font-size:16px;fill:#4f695a}.label{font-weight:700}.small{font-size:16px}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.input{fill:#e1edf2;stroke:#7da6b4;stroke-width:1.3}.cell{fill:#edf1df;stroke:#98a784;stroke-width:1.5}.out{fill:#d8eadc;stroke:#82a18e;stroke-width:1.5}.wire{fill:none;stroke:#376a55;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.arrow{marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="678" height="418" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="22" y="33" class="head">两个乘积怎样在一条列线上相加？</text>
  <text x="22" y="58" class="sub">理想读出模型 · 电流方向按正电荷运动定义</text>
  <rect x="16" y="74" width="648" height="322" rx="10" class="panel"/>

  <rect x="36" y="94" width="247" height="46" rx="7" class="input"/>
  <text x="159.5" y="113" text-anchor="middle" class="small label">输入 x₀ = 2</text>
  <text x="159.5" y="133" text-anchor="middle" class="small">行驱动：40 mV</text>
  <rect x="397" y="94" width="247" height="46" rx="7" class="input"/>
  <text x="520.5" y="113" text-anchor="middle" class="small label">输入 x₁ = 3</text>
  <text x="520.5" y="133" text-anchor="middle" class="small">行驱动：60 mV</text>

  <path d="M160 140V161M520 140V161" class="wire"/>
  <rect x="72" y="161" width="176" height="55" rx="6" class="cell"/>
  <text x="160" y="183" text-anchor="middle" class="label">权重 w₀ = 4</text>
  <text x="160" y="204" text-anchor="middle" class="small">G₀ = 40 µS</text>
  <rect x="432" y="161" width="176" height="55" rx="6" class="cell"/>
  <text x="520" y="183" text-anchor="middle" class="label">权重 w₁ = 5</text>
  <text x="520" y="204" text-anchor="middle" class="small">G₁ = 50 µS</text>
  <path d="M160 216V255H327" class="wire arrow"/>
  <path d="M520 216V255H353" class="wire arrow"/>
  <text x="170" y="242" class="small label">I₀ = 1.6 µA</text>
  <text x="511" y="242" text-anchor="end" class="small label">I₁ = 3.0 µA</text>
  <path d="M327 255H353M340 255V289" class="wire arrow"/>
  <circle cx="340" cy="255" r="4.5" fill="#376a55"/>
  <text x="350" y="283" class="small label">I = 4.6 µA</text>
  <text x="30" y="282" class="small sub">公共列线：近似 0 V</text>
  <rect x="206" y="292" width="268" height="45" rx="7" class="out"/>
  <text x="340" y="310" text-anchor="middle" class="label small">列读出电路</text>
  <text x="340" y="329" text-anchor="middle" class="small">保持列电位，并接收电流</text>
  <path d="M340 337V351" class="wire arrow"/>
  <rect x="153" y="354" width="374" height="32" rx="6" class="out"/>
  <text x="340" y="376" text-anchor="middle" class="label">4.6 µA ÷ (0.2 µA/单位) = 23</text>
  <text x="22" y="411" class="sub">省略单元选择、编程路径和外围供电；读出电流已稳定。</text>
</svg>
