<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 505" width="750" height="505" role="img" aria-labelledby="title desc">
<title id="title">MZI 的移相控制怎样改变输出</title>
<desc id="desc">两个50:50耦合器之间一个下臂有移相器。给第一个输入端口场幅2，第二端口0；第一耦合器输出根号2各路。相差0时输出2和0，相差π时输出0和2。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376a55"/></marker>
<marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426f89"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.head{font-size:23px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.hint{font-size:16px;fill:#4f695a}.blue{fill:#426f89}.orange{fill:#946924}.accent{fill:#815718;font-weight:700}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.unit{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.phase{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.digital{fill:#e3edf3;stroke:#8aa5b2;stroke-width:1.3}.out{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.3}
.wire,.elec{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.wire{stroke:#376a55}.elec{stroke:#426f89;marker-end:url(#blue-arrow)}.axis{fill:none;stroke:#899a91;stroke-width:1.2}.guide{stroke:#b6c5bb;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>
</defs>
<rect x="1" y="1" width="748" height="503" rx="12" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="23" y="35" class="head" text-anchor="start">在两次耦合之间加入可调移相器</text><text x="23" y="61" class="hint" text-anchor="start">同一输入 [2, 0]；只改变下臂相位 δ</text><rect x="16" y="77" width="718" height="187" rx="8" class="panel"/><text x="29" y="105" class="label" text-anchor="start">设置 0：同相</text><text x="28" y="151" class="label" text-anchor="start">2</text><text x="28" y="202" class="label" text-anchor="start">0</text><path d="M28 159H111" class="wire"/><path d="M28 210H111" class="wire"/><rect x="115" y="132" width="105" height="98" rx="8" class="unit"/><text x="167.5" y="175.5" class="label" text-anchor="middle">耦合器 1</text><text x="167.5" y="198.5" class="small" text-anchor="middle">50:50</text><path d="M220 159H496" class="wire"/><path d="M220 210H288" class="wire"/><text x="241" y="150" class="label" text-anchor="start">√2</text><text x="241" y="202" class="label" text-anchor="start">√2</text><rect x="292" y="191" width="112" height="40" rx="8" class="phase"/><text x="348.0" y="217.0" class="label" text-anchor="middle">δ = 0</text><path d="M404 210H496" class="wire"/><text x="440" y="201" class="label" text-anchor="middle">√2</text><rect x="500" y="132" width="105" height="98" rx="8" class="unit"/><text x="552.5" y="175.5" class="label" text-anchor="middle">耦合器 2</text><text x="552.5" y="198.5" class="small" text-anchor="middle">和、差</text><path d="M605 159H671" class="wire"/><path d="M605 210H671" class="wire"/><text x="688" y="154" class="label" text-anchor="middle">2</text><text x="688" y="205" class="label" text-anchor="middle">0</text><text x="29" y="253" class="hint" text-anchor="start">各路径标示场幅，输出总光功率保持 400 µW。</text><rect x="16" y="275" width="718" height="187" rx="8" class="panel"/><text x="29" y="303" class="label" text-anchor="start">设置 π：反相</text><text x="28" y="349" class="label" text-anchor="start">2</text><text x="28" y="400" class="label" text-anchor="start">0</text><path d="M28 357H111" class="wire"/><path d="M28 408H111" class="wire"/><rect x="115" y="330" width="105" height="98" rx="8" class="unit"/><text x="167.5" y="373.5" class="label" text-anchor="middle">耦合器 1</text><text x="167.5" y="396.5" class="small" text-anchor="middle">50:50</text><path d="M220 357H496" class="wire"/><path d="M220 408H288" class="wire"/><text x="241" y="348" class="label" text-anchor="start">√2</text><text x="241" y="400" class="label" text-anchor="start">√2</text><rect x="292" y="389" width="112" height="40" rx="8" class="phase"/><text x="348.0" y="415.0" class="label" text-anchor="middle">δ = π</text><path d="M404 408H496" class="wire"/><text x="440" y="399" class="label" text-anchor="middle">−√2</text><rect x="500" y="330" width="105" height="98" rx="8" class="unit"/><text x="552.5" y="373.5" class="label" text-anchor="middle">耦合器 2</text><text x="552.5" y="396.5" class="small" text-anchor="middle">和、差</text><path d="M605 357H671" class="wire"/><path d="M605 408H671" class="wire"/><text x="688" y="352" class="label" text-anchor="middle">0</text><text x="688" y="403" class="label" text-anchor="middle">2</text><text x="29" y="451" class="hint" text-anchor="start">各路径标示场幅，输出总光功率保持 400 µW。</text><text x="24" y="488" class="hint" text-anchor="start">两个输出都依赖两臂的幅度与相位，而不是只有一路机械开关。</text>
</svg>
