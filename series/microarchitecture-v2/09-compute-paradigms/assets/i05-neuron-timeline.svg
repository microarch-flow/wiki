<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 475" width="740" height="475" role="img" aria-labelledby="title desc">
<title id="title">N0 八个模型时间步的输入、状态和输出</title><desc id="desc">A在时刻1、4、6发放，B在时刻2、4、8发放。状态依次为3、4、3、0、0、3、2、3；第4步比较值为7，发放后立即复位为0。</desc>
<defs><marker id="data" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker><marker id="control" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#967333"/></marker><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.head{font-size:22px;font-weight:700}.sub{font-size:16px;fill:#58736a}.small{font-size:16px}.strong{font-weight:700}.accent{fill:#815718}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
.reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.3}.config{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.result{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.3}
.wire,.ctrl,.event{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.2}
.wire{stroke:#376a55;marker-end:url(#data)}.ctrl{stroke:#967333;stroke-dasharray:5 3;marker-end:url(#control)}
.event{stroke:#967333;marker-end:url(#control)}.grid{stroke:#dce3d8;stroke-width:1.2;fill:none}</style></defs>
<rect x="1" y="1" width="738" height="473" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="24" y="34" class="head" text-anchor="start">脉冲的时间关系改变神经元状态</text>
<text x="24" y="58" class="sub" text-anchor="start">每步先衰减、再累加；达到阈值 5 时发放并清零。</text>
