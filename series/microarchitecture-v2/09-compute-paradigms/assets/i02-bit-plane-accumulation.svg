<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-labelledby="title desc">
<title id="title">位平面如何逐组加权累加</title><desc id="desc">X0和X1分别与W0,W1,W2产生三个计数。低位计数为1,0,1乘权重位权1,2,4求和为5。高位计数为1,0,2乘权重位权求和为9，再乘输入位权2为18。最后5加18得到23。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
      <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.sub{font-size:16px;fill:#4f695a}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .mem{fill:#edf1df;stroke:#93a184;stroke-width:1.4}
      .logic{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}
      .result{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.5}
      .low{fill:#f5eee2;stroke:#c1a57f;stroke-width:1.3}
      .wire{fill:none;stroke:#376a55;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .line{fill:none;stroke:#376a55;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .boundary{stroke:#7b897f;stroke-width:1.8;stroke-dasharray:7 5}
      </style></defs>
<rect x="1" y="1" width="698" height="458" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="22" y="33" text-anchor="start" class="head">数出乘积 bit 后，还要恢复位权</text>
<rect x="18" y="54" width="324" height="292" rx="8" class="panel"/>
<text x="180" y="82" text-anchor="middle" class="label">X₀ = (0,1)</text>
<text x="180" y="105" text-anchor="middle" class="small">分别与三个权重位平面 AND</text>
<rect x="30" y="122" width="96" height="63" rx="6" class="mem"/>
<text x="78" y="145" text-anchor="middle" class="small">W₀ · 位权 1</text>
<text x="78" y="170" text-anchor="middle" class="label">计数 1</text>
<path d="M78 185V204" class="wire"/>
<rect x="30" y="208" width="96" height="40" rx="8" class="logic"/>
<text x="78.0" y="234.0" text-anchor="middle" class="label">1×1=1</text>
<path d="M78 248V263H180" class="line"/>
<rect x="132" y="122" width="96" height="63" rx="6" class="mem"/>
<text x="180" y="145" text-anchor="middle" class="small">W₁ · 位权 2</text>
<text x="180" y="170" text-anchor="middle" class="label">计数 0</text>
<path d="M180 185V204" class="wire"/>
<rect x="132" y="208" width="96" height="40" rx="8" class="logic"/>
<text x="180.0" y="234.0" text-anchor="middle" class="label">0×2=0</text>
<path d="M180 248V263H180" class="line"/>
<rect x="234" y="122" width="96" height="63" rx="6" class="mem"/>
<text x="282" y="145" text-anchor="middle" class="small">W₂ · 位权 4</text>
<text x="282" y="170" text-anchor="middle" class="label">计数 1</text>
<path d="M282 185V204" class="wire"/>
<rect x="234" y="208" width="96" height="40" rx="8" class="logic"/>
<text x="282.0" y="234.0" text-anchor="middle" class="label">1×4=4</text>
<path d="M282 248V263H180" class="line"/>
<path d="M180 263V278" class="wire"/>
<rect x="30" y="282" width="300" height="46" rx="8" class="logic"/>
<text x="180.0" y="311.0" text-anchor="middle" class="label">1 + 0 + 4 = 5</text>
<path d="M180 328V355" class="wire"/>
<rect x="30" y="358" width="300" height="40" rx="8" class="result"/>
<text x="180.0" y="384.0" text-anchor="middle" class="label">乘输入位权 1 → 5</text>
<path d="M180 398V412H350" class="line"/>
<rect x="358" y="54" width="324" height="292" rx="8" class="panel"/>
<text x="520" y="82" text-anchor="middle" class="label">X₁ = (1,1)</text>
<text x="520" y="105" text-anchor="middle" class="small">分别与三个权重位平面 AND</text>
<rect x="370" y="122" width="96" height="63" rx="6" class="mem"/>
<text x="418" y="145" text-anchor="middle" class="small">W₀ · 位权 1</text>
<text x="418" y="170" text-anchor="middle" class="label">计数 1</text>
<path d="M418 185V204" class="wire"/>
<rect x="370" y="208" width="96" height="40" rx="8" class="logic"/>
<text x="418.0" y="234.0" text-anchor="middle" class="label">1×1=1</text>
<path d="M418 248V263H520" class="line"/>
<rect x="472" y="122" width="96" height="63" rx="6" class="mem"/>
<text x="520" y="145" text-anchor="middle" class="small">W₁ · 位权 2</text>
<text x="520" y="170" text-anchor="middle" class="label">计数 0</text>
<path d="M520 185V204" class="wire"/>
<rect x="472" y="208" width="96" height="40" rx="8" class="logic"/>
<text x="520.0" y="234.0" text-anchor="middle" class="label">0×2=0</text>
<path d="M520 248V263H520" class="line"/>
<rect x="574" y="122" width="96" height="63" rx="6" class="mem"/>
<text x="622" y="145" text-anchor="middle" class="small">W₂ · 位权 4</text>
<text x="622" y="170" text-anchor="middle" class="label">计数 2</text>
<path d="M622 185V204" class="wire"/>
<rect x="574" y="208" width="96" height="40" rx="8" class="logic"/>
<text x="622.0" y="234.0" text-anchor="middle" class="label">2×4=8</text>
<path d="M622 248V263H520" class="line"/>
<path d="M520 263V278" class="wire"/>
<rect x="370" y="282" width="300" height="46" rx="8" class="logic"/>
<text x="520.0" y="311.0" text-anchor="middle" class="label">1 + 0 + 8 = 9</text>
<path d="M520 328V355" class="wire"/>
<rect x="370" y="358" width="300" height="40" rx="8" class="result"/>
<text x="520.0" y="384.0" text-anchor="middle" class="label">乘输入位权 2 → 18</text>
<path d="M520 398V412H350" class="line"/>
<path d="M350 412V425" class="wire"/>
<rect x="270" y="428" width="160" height="28" rx="8" class="result"/>
<text x="350.0" y="448.0" text-anchor="middle" class="label">5 + 18 = 23</text>
</svg>
