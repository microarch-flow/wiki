<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 634" width="680" height="634" role="img" aria-labelledby="title desc">
  <title id="title">同一组计算单元的两种有效数据通路</title>
  <desc id="desc">两次独立的计算均使用 a=2、b=3、c=4 和同一位置的 P0 加法器、P1 乘法器。配置 A 第 1 拍由 P0 将和 5 保存到结果寄存器，第 2 拍由 P1 接收该值和 c，乘积为 20。配置 B 第 1 拍由 P1 将积 6 保存到结果寄存器，第 2 拍由 P0 接收该值和 c，和为 10。箭头只表示当前选中的路径；物理连线不因配置改变。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#173d35}
      .head{font-size:22px;font-weight:700}.sub{font-size:17px;fill:#4f695a}.label{font-weight:700}.tiny{font-size:16px}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .unit{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}
      .input{fill:#f9faf5;stroke:#b9cabc;stroke-width:1.2}
      .reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.3}
      .out{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.3}
      .wire{fill:none;stroke:#376a55;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
      .text-bg{fill:#fafbf8}
    </style>
  </defs>
  <rect x="1" y="1" width="678" height="632" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="22" y="33" class="head">改变选中的路径，就能改变运算顺序</text>
  <text x="22" y="58" class="sub">相同 P0、P1 和相同输入；两次独立计算。</text>

  <rect x="16" y="74" width="648" height="251" rx="10" class="panel"/>
  <text x="32" y="102" class="label">配置 A：y = (a + b) × c</text>
  <rect x="35" y="116" width="195" height="34" rx="6" class="input"/>
  <text x="132.5" y="139" text-anchor="middle" class="tiny">第 1 拍：a=2，b=3</text>
  <rect x="450" y="116" width="195" height="34" rx="6" class="input"/>
  <text x="547.5" y="139" text-anchor="middle" class="tiny">第 2 拍：c=4</text>
  <path d="M96 150V173" class="wire"/><path d="M168 150V173" class="wire"/><path d="M548 150V173" class="wire"/>
  <rect x="35" y="177" width="195" height="98" rx="8" class="unit"/>
  <rect x="450" y="177" width="195" height="98" rx="8" class="unit"/>
  <text x="132.5" y="201" text-anchor="middle" class="label">P0 · ADD</text>
  <text x="132.5" y="225" text-anchor="middle">2 + 3 = 5</text>
  <rect x="45" y="235" width="175" height="30" rx="5" class="reg"/>
  <text x="132.5" y="256" text-anchor="middle" class="tiny label">第 1 拍末 Q ← 5</text>
  <text x="547.5" y="201" text-anchor="middle" class="label">P1 · MUL</text>
  <text x="547.5" y="225" text-anchor="middle">5 × 4 = 20</text>
  <rect x="460" y="235" width="175" height="30" rx="5" class="reg"/>
  <text x="547.5" y="256" text-anchor="middle" class="tiny label">第 2 拍末 Q ← 20</text>
  <path d="M220 250H250V216H445" class="wire"/>
  <text x="341" y="203" text-anchor="middle" class="tiny label">P0.Q = 5</text>
  <text x="342" y="240" text-anchor="middle" class="tiny sub">供第 2 拍乘法</text>
  <path d="M548 275V286" class="wire"/>
  <rect x="450" y="290" width="195" height="28" rx="5" class="out"/>
  <text x="547.5" y="310" text-anchor="middle" class="tiny label">选中结果 y = 20</text>

  <rect x="16" y="337" width="648" height="251" rx="10" class="panel"/>
  <text x="32" y="365" class="label">配置 B：y = a × b + c</text>
  <rect x="35" y="379" width="195" height="34" rx="6" class="input"/>
  <text x="132.5" y="402" text-anchor="middle" class="tiny">第 2 拍：c=4</text>
  <rect x="450" y="379" width="195" height="34" rx="6" class="input"/>
  <text x="547.5" y="402" text-anchor="middle" class="tiny">第 1 拍：a=2，b=3</text>
  <path d="M132 413V436" class="wire"/><path d="M512 413V436" class="wire"/><path d="M584 413V436" class="wire"/>
  <rect x="35" y="440" width="195" height="98" rx="8" class="unit"/>
  <rect x="450" y="440" width="195" height="98" rx="8" class="unit"/>
  <text x="132.5" y="464" text-anchor="middle" class="label">P0 · ADD</text>
  <text x="132.5" y="488" text-anchor="middle">6 + 4 = 10</text>
  <rect x="45" y="498" width="175" height="30" rx="5" class="reg"/>
  <text x="132.5" y="519" text-anchor="middle" class="tiny label">第 2 拍末 Q ← 10</text>
  <text x="547.5" y="464" text-anchor="middle" class="label">P1 · MUL</text>
  <text x="547.5" y="488" text-anchor="middle">2 × 3 = 6</text>
  <rect x="460" y="498" width="175" height="30" rx="5" class="reg"/>
  <text x="547.5" y="519" text-anchor="middle" class="tiny label">第 1 拍末 Q ← 6</text>
  <path d="M460 513H430V479H235" class="wire"/>
  <text x="341" y="466" text-anchor="middle" class="tiny label">P1.Q = 6</text>
  <text x="342" y="503" text-anchor="middle" class="tiny sub">供第 2 拍加法</text>
  <path d="M132 538V549" class="wire"/>
  <rect x="35" y="553" width="195" height="28" rx="5" class="out"/>
  <text x="132.5" y="573" text-anchor="middle" class="tiny label">选中结果 y = 10</text>
  <text x="22" y="616" class="tiny sub">图中仅画选中的逻辑路径；其余预布线和控制逻辑省略。</text>
</svg>
