<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 525" width="680" height="525" role="img" aria-labelledby="title desc">
  <title id="title">两行两列交叉阵列并行完成两个点积</title>
  <desc id="desc">行0由40 mV驱动，行1由60 mV驱动。权重矩阵两行为4、1和5、2，对应四个电导40、10、50、20 µS。每行向该行两个单元提供电压；各单元的支路电流分别流入自己的列。列0总电流4.6 µA，列1总电流1.6 µA。两列均钳在约0 V，解码输出分别为23与8。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#173d35}
      .head{font-size:22px;font-weight:700}.sub{font-size:16px;fill:#4f695a}.label{font-weight:700}.small{font-size:16px}
      .panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.input{fill:#e1edf2;stroke:#7da6b4;stroke-width:1.3}.cell{fill:#edf1df;stroke:#98a784;stroke-width:1.5}.out{fill:#d8eadc;stroke:#82a18e;stroke-width:1.5}.row{fill:none;stroke:#4c8398;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.col{fill:none;stroke:#376a55;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.arrow{marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="678" height="523" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="22" y="33" class="head">共享行电压，独立汇聚列电流</text>
  <text x="22" y="58" class="sub">四个单元存放 W 的四个权重；读出两个结果</text>
  <rect x="16" y="74" width="648" height="404" rx="10" class="panel"/>
  <text x="277" y="99" text-anchor="middle" class="label">权重列 0</text>
  <text x="523" y="99" text-anchor="middle" class="label">权重列 1</text>

  <rect x="27" y="106" width="130" height="54" rx="6" class="input"/>
  <text x="92" y="129" text-anchor="middle" class="small label">x₀ = 2</text>
  <text x="92" y="150" text-anchor="middle" class="small">40 mV</text>
  <path d="M157 133H492M242 133V147M492 133V147" class="row"/>
  <circle cx="242" cy="133" r="4" fill="#4c8398"/>
  <circle cx="492" cy="133" r="4" fill="#4c8398"/>
  <rect x="166" y="147" width="152" height="49" rx="5" class="cell"/>
  <text x="242" y="166" text-anchor="middle" class="small label">W₀₀ = 4</text>
  <text x="242" y="186" text-anchor="middle" class="small">40 µS</text>
  <rect x="416" y="147" width="152" height="49" rx="5" class="cell"/>
  <text x="492" y="166" text-anchor="middle" class="small label">W₀₁ = 1</text>
  <text x="492" y="186" text-anchor="middle" class="small">10 µS</text>
  <path d="M242 196V218H365" class="col arrow"/>
  <path d="M492 196V218H615" class="col arrow"/>
  <text x="250" y="211" class="small label">1.6 µA</text>
  <text x="500" y="211" class="small label">0.4 µA</text>
  <path d="M365 218V248M365 264V375M615 218V375" class="col"/>
  <circle cx="365" cy="218" r="4" fill="#376a55"/>
  <circle cx="615" cy="218" r="4" fill="#376a55"/>

  <rect x="27" y="229" width="130" height="54" rx="6" class="input"/>
  <text x="92" y="252" text-anchor="middle" class="small label">x₁ = 3</text>
  <text x="92" y="273" text-anchor="middle" class="small">60 mV</text>
  <path d="M157 256H492M242 256V271M492 256V271" class="row"/>
  <circle cx="242" cy="256" r="4" fill="#4c8398"/>
  <circle cx="492" cy="256" r="4" fill="#4c8398"/>
  <rect x="166" y="271" width="152" height="49" rx="5" class="cell"/>
  <text x="242" y="290" text-anchor="middle" class="small label">W₁₀ = 5</text>
  <text x="242" y="310" text-anchor="middle" class="small">50 µS</text>
  <rect x="416" y="271" width="152" height="49" rx="5" class="cell"/>
  <text x="492" y="290" text-anchor="middle" class="small label">W₁₁ = 2</text>
  <text x="492" y="310" text-anchor="middle" class="small">20 µS</text>
  <path d="M242 320V342H365" class="col arrow"/>
  <path d="M492 320V342H615" class="col arrow"/>
  <text x="250" y="335" class="small label">3.0 µA</text>
  <text x="500" y="335" class="small label">1.2 µA</text>
  <circle cx="365" cy="342" r="4" fill="#376a55"/>
  <circle cx="615" cy="342" r="4" fill="#376a55"/>
  <path d="M365 375V386" class="col arrow"/><path d="M615 375V386" class="col arrow"/>
  <text x="359" y="365" text-anchor="end" class="small label">4.6 µA</text>
  <text x="609" y="365" text-anchor="end" class="small label">1.6 µA</text>

  <rect x="188" y="389" width="201" height="54" rx="6" class="out"/>
  <text x="288.5" y="410" text-anchor="middle" class="small label">读出 · 列 0</text>
  <text x="288.5" y="431" text-anchor="middle" class="small">列端 ≈ 0 V</text>
  <rect x="438" y="389" width="201" height="54" rx="6" class="out"/>
  <text x="538.5" y="410" text-anchor="middle" class="small label">读出 · 列 1</text>
  <text x="538.5" y="431" text-anchor="middle" class="small">列端 ≈ 0 V</text>
  <text x="288.5" y="466" text-anchor="middle" class="label">y₀ = 23</text>
  <text x="538.5" y="466" text-anchor="middle" class="label">y₁ = 8</text>
  <path d="M25 493H55" class="row"/><text x="63" y="499" class="small">行电压</text>
  <path d="M160 493H190" class="col"/><text x="198" y="499" class="small">列电流</text>
  <path d="M305 493H335M320 482V488M320 498V504" class="col"/><text x="345" y="499" class="small">交叉处无电气连接</text>
  <text x="22" y="518" class="sub">为展示等效支路，将单元画在行与列之间。省略编程和读出外围细节。</text>
</svg>
