<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 523" width="720" height="523" role="img" aria-labelledby="title desc">
<title id="title">平衡零差探测怎样读出有符号的结果</title>
<desc id="desc">场幅为负1/根号2的信号与正1/根号2本振干涉，和端口为零，差端口幅度负1。两个探测器输入功率分别0与100微瓦，引起光电流0与80微安；相减为负80微安，恢复数值负1。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376a55"/></marker>
<marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426f89"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.head{font-size:23px;font-weight:700}.label{font-weight:700}.small{font-size:16px}.hint{font-size:16px;fill:#4f695a}.blue{fill:#426f89}.orange{fill:#946924}.accent{fill:#815718;font-weight:700}
.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}.unit{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.phase{fill:#f3ebdb;stroke:#c6aa79;stroke-width:1.3}.digital{fill:#e3edf3;stroke:#8aa5b2;stroke-width:1.3}.out{fill:#d2e6d7;stroke:#82a18e;stroke-width:1.3}
.wire,.elec{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.wire{stroke:#376a55}.elec{stroke:#426f89;marker-end:url(#blue-arrow)}.axis{fill:none;stroke:#899a91;stroke-width:1.2}.guide{stroke:#b6c5bb;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>
</defs>
<rect x="1" y="1" width="718" height="521" rx="12" fill="#f5f6ef" stroke="#c4d0c4"/>
<text x="23" y="36" class="head" text-anchor="start">如何从 −1/√2 的光场读出负数？</text><text x="23" y="63" class="hint" text-anchor="start">本振 r = +1/√2，P₀ = 100 µW，响应度 R = 0.8 A/W</text><rect x="16" y="77" width="688" height="205" rx="8" class="panel"/><rect x="29" y="105" width="161" height="56" rx="8" class="unit"/><text x="109.5" y="127.5" class="label" text-anchor="middle">b₂ = −1/√2</text><text x="109.5" y="150.5" class="small" text-anchor="middle">50 µW</text><rect x="29" y="191" width="161" height="56" rx="8" class="phase"/><text x="109.5" y="213.5" class="label" text-anchor="middle">r = +1/√2</text><text x="109.5" y="236.5" class="small" text-anchor="middle">50 µW</text><path d="M190 133H239" class="wire"/><path d="M190 219H239" class="wire"/><rect x="243" y="111" width="139" height="135" rx="8" class="unit"/><text x="312.5" y="173.0" class="label" text-anchor="middle">50:50</text><text x="312.5" y="196.0" class="small" text-anchor="middle">和差耦合</text><path d="M382 133H445" class="wire"/><path d="M382 219H445" class="wire"/><rect x="449" y="104" width="240" height="57" rx="8" class="unit"/><text x="569.0" y="127.0" class="label" text-anchor="middle">(b₂ + r)/√2 = 0</text><text x="569.0" y="150.0" class="small" text-anchor="middle">P₊ = 0</text><rect x="449" y="190" width="240" height="57" rx="8" class="unit"/><text x="569.0" y="213.0" class="label" text-anchor="middle">(b₂ − r)/√2 = −1</text><text x="569.0" y="236.0" class="small" text-anchor="middle">P₋ = 100 µW</text><text x="29" y="268" class="hint" text-anchor="start">光学域：相干场幅叠加，再由探测器测功率。</text><rect x="16" y="300" width="688" height="208" rx="8" class="panel"/><rect x="34" y="327" width="240" height="55" rx="8" class="digital"/><text x="154.0" y="349.0" class="label" text-anchor="middle">探测器 +</text><text x="154.0" y="372.0" class="small" text-anchor="middle">I₊ = 0 µA</text><rect x="34" y="402" width="240" height="55" rx="8" class="digital"/><text x="154.0" y="424.0" class="label" text-anchor="middle">探测器 −</text><text x="154.0" y="447.0" class="small" text-anchor="middle">I₋ = 80 µA</text><path d="M274 354H335" class="elec"/><path d="M274 429H335" class="elec"/><rect x="339" y="337" width="132" height="111" rx="8" class="digital"/><text x="405.0" y="387.0" class="label" text-anchor="middle">电子域</text><text x="405.0" y="410.0" class="small" text-anchor="middle">相减</text><path d="M471 392H513" class="elec"/><rect x="517" y="356" width="170" height="73" rx="8" class="out"/><text x="602.0" y="387.0" class="label" text-anchor="middle">ΔI = −80 µA</text><text x="602.0" y="410.0" class="small" text-anchor="middle">恢复数值 −1</text><text x="29" y="489" class="hint" text-anchor="start">两路探测器分别接收上一幅的 P₊ 和 P₋；单路光功率、电流均非负。</text>
</svg>
