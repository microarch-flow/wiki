<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 446" width="660" height="446" role="img" aria-labelledby="dep-title dep-desc">
  <title id="dep-title">数据依赖与共享读入口的资源竞争</title>
  <desc id="dep-desc">教学寄存器文件的 R0 至 R4 依次为 2、3、1、5、4，R5、R6、R7 旧值均为零。任务 T0 乘法生成新 R5 等于六；T1 加法必须等待这个新值，才可将新 R5 与 R2 的一相加得到七，不可使用 R5 旧值零。T2 加法 R3 加 R4 得九，与 T0、T1 无值依赖。开始时 T0 与 T2 的全部源数据已就绪，但它们共享一个命令及 READ 入口；RF 两个读端口每边沿只能为一个新任务提供一对输入，仲裁只能选择其中一个。</desc>
  <defs>
    <marker id="dep-data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <marker id="dep-ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#967333"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.strong{font-size:19px;font-weight:700}.note{font-size:16px;fill:#4f695a}
      .box{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.wait{fill:#f2e8d3;stroke:#b6a073;stroke-width:1.5}
      .ctrltext{fill:#765a2f;font-weight:700}
      .data{fill:none;stroke:#376a55;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#dep-data-arrow)}
      .ctrl{fill:none;stroke:#967333;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#dep-ctrl-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="444" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="34" class="head">1. 谁的数据已经就绪？</text>
  <text x="22" y="61" class="note">RF 初值：R0…R4 = 2、3、1、5、4；R5…R7 的旧值均为 0。</text>

  <rect x="22" y="78" width="260" height="84" rx="9" class="box"/>
  <text x="36" y="104" class="strong">T0：MUL</text>
  <text x="36" y="129">R5 ← R0 × R1 = 6</text>
  <text x="36" y="151" class="note">两个源操作数均可读</text>

  <rect x="378" y="78" width="260" height="84" rx="9" class="wait"/>
  <text x="392" y="104" class="strong">T1：ADD</text>
  <text x="392" y="129">R6 ← R5 + R2 = 7</text>
  <text x="392" y="151" class="note">必须先等新 R5 写回</text>
  <path class="data" d="M282 119H374"/>
  <text x="330" y="103" text-anchor="middle" class="note">新 R5</text>
  <text x="330" y="142" text-anchor="middle" class="strong">6</text>

  <rect x="22" y="174" width="260" height="84" rx="9" class="box"/>
  <text x="36" y="200" class="strong">T2：ADD</text>
  <text x="36" y="225">R7 ← R3 + R4 = 9</text>
  <text x="36" y="247" class="note">独立于 T0、T1，源数据均就绪</text>
  <text x="303" y="198" class="strong">T1 不能读取 R5 的旧值 0。</text>
  <text x="303" y="222" class="note">7 是等待新值后才能得到的结果，</text>
  <text x="303" y="245" class="note">T1 必须取得新值；本例不猜测。</text>

  <path d="M22 273H638" stroke="#c4d0c4"/>
  <text x="22" y="302" class="head">2. 两项数据都就绪，能否同沿接收？</text>
  <rect x="22" y="315" width="150" height="42" rx="7" class="box"/>
  <text x="97" y="343" text-anchor="middle" class="strong">T0 就绪</text>
  <rect x="22" y="366" width="150" height="42" rx="7" class="box"/>
  <text x="97" y="394" text-anchor="middle" class="strong">T2 就绪</text>
  <path class="ctrl" d="M172 336H200V351H224"/>
  <path class="ctrl" d="M172 387H200V372H224"/>
  <rect x="228" y="332" width="148" height="60" rx="8" class="wait"/>
  <text x="302" y="355" text-anchor="middle" class="strong">仲裁选择</text>
  <text x="302" y="378" text-anchor="middle" class="note">至多一项</text>
  <path class="data" d="M376 362H431"/>
  <rect x="435" y="332" width="203" height="60" rx="8" class="box"/>
  <text x="536.5" y="355" text-anchor="middle" class="strong">唯一 READ 入口</text>
  <text x="536.5" y="378" text-anchor="middle" class="note">2 个读口：每沿至多采一组</text>
  <text x="22" y="432" class="note">数据就绪不保证能立即发射；还需要共享入口有空间。</text>
</svg>
