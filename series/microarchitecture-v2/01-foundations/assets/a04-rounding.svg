<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" width="640" height="327" role="img" aria-labelledby="title desc">
  <title id="title">FP16 舍入到最近值：中点选择偶数末位</title>
  <desc id="desc">在一到二之间，FP16 相邻可表示数的间距为二的负十次方。图示三个连续可表示值，其保留的最低位依次为零、一、零。第一个中点一加二的负十一次方舍入到左侧的一；第二个中点一加三乘二的负十一次方舍入到右侧的一加二乘二的负十次方。这两个精确中点的保护位、舍入位和粘滞位均为一、零、零。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <marker id="dim-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6z" fill="#52735d"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.accent{fill:#8a5d1c}
      .dim{fill:none;stroke:#52735d;stroke-width:1.6;marker-start:url(#dim-arr);marker-end:url(#dim-arr)}
      .choice{fill:none;stroke:#9b6c27;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .point{fill:#376650;stroke:#f5f6ef;stroke-width:2}
      .mid{fill:#f5f6ef;stroke:#a87932;stroke-width:2.3}
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="325" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">离两侧一样近，为什么选偶数末位？</text>
  <text x="20" y="61" class="small">FP16 正规数区间 [1, 2)：每两个相邻可表示数相差 2⁻¹⁰。</text>
  <path d="M43 150H597" stroke="#82998a" stroke-width="2" fill="none"/>
  <path class="dim" d="M70 98H320"/>
  <path class="dim" d="M320 98H570"/>
  <path d="M70 98V143M320 98V143M570 98V143" stroke="#aab9ad" stroke-dasharray="4 4" fill="none"/>
  <text x="195" y="90" text-anchor="middle" class="small">2⁻¹⁰</text>
  <text x="445" y="90" text-anchor="middle" class="small">2⁻¹⁰</text>
  <g text-anchor="middle">
    <circle class="point" cx="70" cy="150" r="6"/>
    <circle class="point" cx="320" cy="150" r="6"/>
    <circle class="point" cx="570" cy="150" r="6"/>
    <text x="70" y="175" font-weight="700">1</text>
    <text x="320" y="175" font-weight="700">1+2⁻¹⁰</text>
    <text x="570" y="175" font-weight="700">1+2×2⁻¹⁰</text>
    <text x="70" y="198" class="small">末位 0（偶）</text>
    <text x="320" y="198" class="small">末位 1（奇）</text>
    <text x="570" y="198" class="small">末位 0（偶）</text>
  </g>
  <circle class="mid" cx="195" cy="150" r="5"/>
  <circle class="mid" cx="445" cy="150" r="5"/>
  <text x="195" y="127" text-anchor="middle" class="small accent">1+2⁻¹¹</text>
  <text x="445" y="127" text-anchor="middle" class="small accent">1+3×2⁻¹¹</text>
  <path d="M190 145C168 112 103 111 75 143" class="choice"/>
  <path d="M450 145C472 112 537 111 565 143" class="choice"/>
  <rect x="18" y="218" width="604" height="92" rx="7" fill="#edf1df"/>
  <text x="32" y="243">两个中点：G=1，R=0，S=0。</text>
  <text x="32" y="267" class="small">左侧中点：较小候选的保留末位为 0，不进位。</text>
  <text x="32" y="290" class="small">右侧中点：较小候选的保留末位为 1，向保留部分加 1。</text>
</svg>
