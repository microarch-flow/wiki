<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 570" width="660" height="570" role="img" aria-labelledby="title desc">
  <title id="title">MAC 的第三个数据来源为何可以放进专用累加寄存器</title>
  <desc id="desc">如果乘法输入 A、B 和旧部分和分别保存在寄存器文件三个不同的地址中，一个有两个读端口的寄存器文件不能在同一个规定的读阶段同时取出三个不同寄存器的数。专用累加寄存器 ACC 保存旧部分和时，两个读端口只读取 A、B，先经 X、W 进入乘法器并把乘积保存到中间寄存器 P；随后用 P 加 ACC 的旧值，将新部分和更新到 ACC。ACC 需要初始化，COPY_ACC 才通过写回路径把值写进寄存器文件。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:15px}.label{font-weight:700}
      .accent{fill:#8a5d1c}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .mismatch{fill:#eee6d5;stroke:#c5a674;stroke-width:1.4}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
      .ctrl{stroke:#9b6c27;stroke-width:1.9;stroke-dasharray:5 4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#ctrl-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="568" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">两个 RF 读口，怎样为 MAC 提供三个值？</text>
  <rect x="16" y="51" width="628" height="193" rx="10" class="panel"/>
  <text x="32" y="77" class="label">情况一：三个值都保存在 RF</text>
  <rect x="32" y="94" width="158" height="89" rx="8" class="reg"/>
  <text x="111" y="121" class="label" text-anchor="middle">RF</text>
  <text x="111" y="147" class="small" text-anchor="middle">A、B、旧部分和</text>
  <text x="111" y="169" class="small" text-anchor="middle">三个不同地址</text>
  <path d="M190 124H305" class="data"/>
  <path d="M190 163H305" class="data"/>
  <text x="246" y="115" text-anchor="middle" class="tiny">读口 A</text>
  <text x="246" y="154" text-anchor="middle" class="tiny">读口 B</text>
  <rect x="305" y="104" width="112" height="38" rx="7" class="block"/>
  <rect x="305" y="150" width="112" height="38" rx="7" class="block"/>
  <text x="361" y="129" text-anchor="middle">A</text><text x="361" y="175" text-anchor="middle">B</text>
  <rect x="436" y="104" width="190" height="84" rx="8" class="mismatch"/>
  <text x="531" y="130" text-anchor="middle" class="accent label">缺少第三个读口</text>
  <text x="531" y="155" text-anchor="middle" class="small accent">同一读阶段无法再读出</text>
  <text x="531" y="175" text-anchor="middle" class="small accent">独立的旧部分和</text>
  <text x="32" y="224" class="small">可以增加读口或增加读取阶段；本例采用另一种办法。</text>

  <rect x="16" y="254" width="628" height="263" rx="10" class="panel"/>
  <text x="32" y="280" class="label">情况二：旧部分和放在专用 ACC 寄存器</text>
  <rect x="32" y="304" width="125" height="85" rx="8" class="reg"/>
  <text x="94.5" y="335" text-anchor="middle" class="label">RF</text>
  <text x="94.5" y="360" text-anchor="middle" class="small">仍是两个读口</text>
  <rect x="208" y="299" width="103" height="39" rx="7" class="reg"/>
  <rect x="208" y="356" width="103" height="39" rx="7" class="reg"/>
  <text x="259.5" y="325" text-anchor="middle" class="label">X</text>
  <text x="259.5" y="382" text-anchor="middle" class="label">W</text>
  <path d="M157 319H208" class="data"/>
  <path d="M157 375H208" class="data"/>
  <text x="178" y="309" text-anchor="middle" class="tiny">A</text>
  <text x="178" y="365" text-anchor="middle" class="tiny">B</text>
  <rect x="362" y="318" width="106" height="58" rx="7" class="block"/>
  <text x="415" y="341" text-anchor="middle" class="label">乘法器</text>
  <text x="415" y="362" text-anchor="middle" class="small">A × B</text>
  <path d="M311 319H337V332H362" class="data"/>
  <path d="M311 375H337V361H362" class="data"/>
  <rect x="514" y="318" width="112" height="58" rx="7" class="reg"/>
  <text x="570" y="341" text-anchor="middle" class="label">P</text>
  <text x="570" y="362" text-anchor="middle" class="small">本次乘积</text>
  <path d="M468 347H514" class="data"/>
  <rect x="362" y="413" width="106" height="55" rx="7" class="block"/>
  <text x="415" y="436" text-anchor="middle" class="label">加法器</text>
  <text x="415" y="458" text-anchor="middle" class="small">P+ACC</text>
  <rect x="514" y="413" width="112" height="55" rx="7" class="reg"/>
  <text x="570" y="436" text-anchor="middle" class="label">ACC</text>
  <text x="570" y="458" text-anchor="middle" class="tiny">部分和</text>
  <path d="M570 376V397H387V413" class="data"/>
  <path d="M570 468V489H442V468" class="data"/>
  <text x="496" y="505" text-anchor="middle" class="tiny">旧 ACC 的 Q 反馈</text>
  <path d="M468 440H514" class="data"/>
  <text x="491" y="430" text-anchor="middle" class="tiny">新值</text>
  <path d="M626 440H637" class="data"/>
  <text x="32" y="430" class="small">ACC 独立供数，</text>
  <text x="32" y="452" class="small">不占第三个 RF 读口。</text>
  <text x="32" y="477" class="small accent">初始化 ACC 后再累加。</text>
  <text x="20" y="541" class="small">COPY_ACC：结束累加后，经写回路径把 ACC 复制到 RF。</text>
  <text x="20" y="561" class="small">图中路径分阶段使用，并非一次读阶段内全部完成。</text>
</svg>
