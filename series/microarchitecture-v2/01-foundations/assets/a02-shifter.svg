<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 504" width="600" height="504" role="img" aria-labelledby="title desc">
  <title id="title">两级选择网络实现四位逻辑右移</title>
  <desc id="desc">四位数据 1101 同时进入第一级的原值路径和固定右移一位路径，第一级的选择信号 s0 决定选哪条，s0 为一时选择右移一位得到 0110。第一级的输出进入第二级的原值路径和固定右移两位路径，s1 为一时选择右移两位得到 0001。两级分别选择移动零或一位和零或两位，所以选择信号 s1s0 表示右移零到三位。逻辑右移从左端补零。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="quiet-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#8b9b90"/></marker>
    <marker id="control-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.accent{fill:#8a5d1c}
      .stage{fill:#fafbf8;stroke:#d3ddd4;stroke-width:1.3}
      .block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.6}
      .unused{fill:#f0f2ed;stroke:#aab7ad;stroke-width:1.5}
      .wire{fill:none;stroke:#376650;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .quiet{fill:none;stroke:#8b9b90;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .control{fill:none;stroke:#9b6c27;stroke-width:2.2;stroke-dasharray:6 4;stroke-linecap:round;stroke-linejoin:round}
      .bits{font-family:"Noto Sans Mono CJK SC",monospace;font-size:20px;font-weight:700}
      .zero{fill:#8a5d1c}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="502" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="33" class="heading">让同一网络实现 0～3 位逻辑右移</text>
  <rect x="15" y="86" width="570" height="143" rx="10" class="stage"/>
  <rect x="15" y="273" width="570" height="143" rx="10" class="stage"/>
  <text x="30" y="107" class="small">第 1 级</text>
  <text x="30" y="294" class="small">第 2 级</text>
  <rect x="236" y="45" width="128" height="31" rx="7" class="block"/>
  <text x="300" y="67" text-anchor="middle" class="bits">1101</text>
  <text x="226" y="67" text-anchor="end" class="small">输入</text>
  <!-- first fixed wiring and bypass -->
  <path class="wire" d="M300 76V90H440V113" marker-end="url(#arrow)"/>
  <path class="quiet" d="M300 90H160V113" marker-end="url(#quiet-arrow)"/>
  <circle cx="300" cy="90" r="3.3" fill="#376650"/>
  <rect x="83" y="113" width="154" height="48" rx="7" class="unused"/>
  <text x="160" y="133" text-anchor="middle" class="small">不移位</text>
  <text x="160" y="153" text-anchor="middle" class="bits">1101</text>
  <rect x="363" y="113" width="154" height="48" rx="7" class="block"/>
  <text x="440" y="133" text-anchor="middle" class="small">固定右移 1 位</text>
  <text x="440" y="153" text-anchor="middle" class="bits"><tspan class="zero">0</tspan>110</text>
  <path class="quiet" d="M160 161V178H260V195" marker-end="url(#quiet-arrow)"/>
  <path class="wire" d="M440 161V178H340V195" marker-end="url(#arrow)"/>
  <rect x="221" y="195" width="158" height="29" rx="6" class="block"/>
  <text x="260" y="216" text-anchor="middle" class="small">0</text>
  <text x="300" y="216" text-anchor="middle">MUX</text>
  <text x="340" y="216" text-anchor="middle" class="small" font-weight="700">1</text>
  <path class="control" d="M454 209H379" marker-end="url(#control-arrow)"/>
  <text x="462" y="215" class="accent">s₀ = 1</text>
  <!-- intermediate bus -->
  <path class="wire" d="M300 224V239" marker-end="url(#arrow)"/>
  <rect x="236" y="239" width="128" height="30" rx="7" class="block"/>
  <text x="300" y="260" text-anchor="middle" class="bits">0110</text>
  <text x="226" y="260" text-anchor="end" class="small">中间结果</text>
  <!-- second fixed wiring and bypass -->
  <path class="wire" d="M300 269V277H440V300" marker-end="url(#arrow)"/>
  <path class="quiet" d="M300 277H160V300" marker-end="url(#quiet-arrow)"/>
  <circle cx="300" cy="277" r="3.3" fill="#376650"/>
  <rect x="83" y="300" width="154" height="48" rx="7" class="unused"/>
  <text x="160" y="320" text-anchor="middle" class="small">不移位</text>
  <text x="160" y="340" text-anchor="middle" class="bits">0110</text>
  <rect x="363" y="300" width="154" height="48" rx="7" class="block"/>
  <text x="440" y="320" text-anchor="middle" class="small">固定右移 2 位</text>
  <text x="440" y="340" text-anchor="middle" class="bits"><tspan class="zero">00</tspan>01</text>
  <path class="quiet" d="M160 348V365H260V382" marker-end="url(#quiet-arrow)"/>
  <path class="wire" d="M440 348V365H340V382" marker-end="url(#arrow)"/>
  <rect x="221" y="382" width="158" height="29" rx="6" class="block"/>
  <text x="260" y="403" text-anchor="middle" class="small">0</text>
  <text x="300" y="403" text-anchor="middle">MUX</text>
  <text x="340" y="403" text-anchor="middle" class="small" font-weight="700">1</text>
  <path class="control" d="M454 396H379" marker-end="url(#control-arrow)"/>
  <text x="462" y="402" class="accent">s₁ = 1</text>
  <path class="wire" d="M300 411V426" marker-end="url(#arrow)"/>
  <rect x="236" y="426" width="128" height="30" rx="7" class="block"/>
  <text x="300" y="447" text-anchor="middle" class="bits">0001</text>
  <text x="226" y="447" text-anchor="end" class="small">输出</text>
  <rect x="18" y="468" width="564" height="26" rx="6" fill="#edf1df"/>
  <text x="300" y="487" text-anchor="middle" class="small">s₁s₀=11：右移 1+2=3 位；棕色比特为本级补入的 0</text>
</svg>
