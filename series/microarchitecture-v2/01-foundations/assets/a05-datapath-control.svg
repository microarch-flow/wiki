<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 875" width="660" height="875" role="img" aria-labelledby="title desc">
  <title id="title">教学计算单元的数据通路与控制通路</title>
  <desc id="desc">八个十六位寄存器组成的寄存器文件有两个读口和一个写口。读地址 RA、RB 决定两路读值，EN_XW 控制操作数寄存器 X 与 W 在 READ 阶段采样。X、W 的输出都连接 ALU、FP16 加法单元 FPU 和整数乘法器；乘法器的结果由 EN_P 控制写入中间寄存器 P。P 与专用累加寄存器 ACC 的旧值相加，结果由 EN_ACC 控制写回 ACC。写回选择器从 ALU 结果、FPU 结果、P 和 ACC 中选择 WD，写地址 WA 和 WE 控制寄存器文件的写口。控制寄存器保存 OP、RA、RB、WA，FSM 根据 OP 与当前阶段产生 EN_XW、EN_P、EN_ACC、WE、运算选择和写回选择等控制信号。相同名称的信号表示连接到同一信号。省略时钟和复位连线，图不表示各运算同时执行。</desc>
  <defs>
    <marker id="data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <marker id="ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#9b6c27"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14.5px}.label{font-weight:700}
      .accent{fill:#8a5d1c}.panel{fill:#fafbf8;stroke:#c7d3c7;stroke-width:1.3}
      .reg{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}.block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .data{stroke:#376650;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#data-arrow)}
      .ctrl{stroke:#9b6c27;stroke-width:1.9;stroke-dasharray:5 4;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#ctrl-arrow)}
      .divider{stroke:#c7d3c7;stroke-width:1.1}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="873" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="heading">同一计算单元中的数据通路与控制通路</text>
  <rect x="16" y="49" width="628" height="563" rx="10" class="panel"/>
  <text x="31" y="76" class="label">数据通路</text>
  <path d="M455 70H479" class="data"/>
  <text x="489" y="76" class="tiny">16 位数据</text>
  <path d="M558 70H579" class="ctrl"/>
  <text x="587" y="76" class="tiny accent">控制</text>

  <!-- register file ports and operand registers -->
  <rect x="96" y="104" width="238" height="120" rx="8" class="reg"/>
  <text x="215" y="126" text-anchor="middle" class="label">寄存器文件 RF</text>
  <text x="215" y="146" text-anchor="middle" class="small">8 × 16 位</text>
  <path d="M96 154H334" class="divider"/>
  <text x="110" y="177" class="small">写口</text>
  <text x="319" y="177" text-anchor="end" class="small">读口 A</text>
  <text x="319" y="207" text-anchor="end" class="small">读口 B</text>
  <path d="M19 164H96" class="data"/><text x="25" y="156" class="small label">WD</text>
  <path d="M19 187H96" class="ctrl"/><text x="25" y="181" class="small accent">WA</text>
  <path d="M19 211H96" class="ctrl"/><text x="25" y="205" class="small accent">WE</text>
  <path d="M149 94V104" class="ctrl"/><text x="149" y="91" text-anchor="middle" class="small accent">RA</text>
  <path d="M281 94V104" class="ctrl"/><text x="281" y="91" text-anchor="middle" class="small accent">RB</text>
  <rect x="410" y="114" width="130" height="45" rx="7" class="reg"/>
  <rect x="410" y="179" width="130" height="45" rx="7" class="reg"/>
  <text x="475" y="142" text-anchor="middle" class="label">X 寄存器</text>
  <text x="475" y="207" text-anchor="middle" class="label">W 寄存器</text>
  <path d="M334 164H373V136H410" class="data"/>
  <path d="M334 194H373V201H410" class="data"/>
  <path d="M540 136H587" class="data"/><text x="598" y="142" class="label">X</text>
  <path d="M540 201H587" class="data"/><text x="598" y="207" class="label">W</text>
  <text x="475" y="101" text-anchor="middle" class="tiny accent">EN_XW</text>
  <path d="M475 104V114" class="ctrl"/>
  <text x="475" y="171" text-anchor="middle" class="tiny accent">EN_XW</text>
  <path d="M475 173V179" class="ctrl"/>

  <path d="M31 241H629" class="divider"/>
  <!-- functional units, using labels for repeated operand nets -->
  <rect x="33" y="277" width="167" height="55" rx="7" class="block"/>
  <rect x="246" y="277" width="167" height="55" rx="7" class="block"/>
  <rect x="459" y="277" width="167" height="55" rx="7" class="block"/>
  <g text-anchor="middle">
    <text x="116.5" y="299" class="label">ALU</text><text x="116.5" y="320" class="small">ADD / SUB</text>
    <text x="329.5" y="299" class="label">FPU</text><text x="329.5" y="320" class="small">FP16 FADD</text>
    <text x="542.5" y="299" class="label">整数乘法器 M</text><text x="542.5" y="320" class="small">MUL / MAC</text>
  </g>
  <g class="small label" text-anchor="middle">
    <text x="73" y="260">X</text><text x="111" y="260">W</text>
    <text x="287" y="260">X</text><text x="325" y="260">W</text>
    <text x="500" y="260">X</text><text x="538" y="260">W</text>
  </g>
  <g class="data">
    <path d="M73 264V277"/><path d="M111 264V277"/>
    <path d="M287 264V277"/><path d="M325 264V277"/>
    <path d="M500 264V277"/><path d="M538 264V277"/>
  </g>
  <path d="M171 261V277" class="ctrl"/><text x="186" y="261" text-anchor="end" class="tiny accent">ADD/SUB</text>
  <path d="M116.5 332V349" class="data"/><text x="116.5" y="366" text-anchor="middle" class="small label">ALU 结果</text>
  <path d="M329.5 332V349" class="data"/><text x="329.5" y="366" text-anchor="middle" class="small label">FPU 结果</text>
  <rect x="476" y="354" width="132" height="39" rx="7" class="reg"/>
  <text x="542" y="379" text-anchor="middle" class="label">P 寄存器</text>
  <path d="M542 332V354" class="data"/>
  <text x="613" y="349" text-anchor="end" class="tiny accent">EN_P</text>
  <path d="M615 371H608" class="ctrl"/>
  <!-- ACC path -->
  <rect x="452" y="420" width="137" height="39" rx="7" class="block"/>
  <text x="520.5" y="445" text-anchor="middle" class="label">MAC 加法器</text>
  <path d="M542 393V412H483V420" class="data"/>
  <text x="462" y="413" text-anchor="end" class="small label">P</text>
  <rect x="452" y="481" width="137" height="39" rx="7" class="reg"/>
  <text x="520.5" y="506" text-anchor="middle" class="label">ACC 寄存器</text>
  <path d="M520.5 459V481" class="data"/>
  <path d="M589 501H614V411H565V420" class="data"/>
  <text x="604" y="473" text-anchor="end" class="tiny label">旧 ACC</text>
  <path d="M420 501H452" class="ctrl"/><text x="411" y="494" text-anchor="end" class="tiny accent">EN_ACC</text>
  <path d="M520.5 520V536" class="data"/>
  <text x="520.5" y="549" text-anchor="middle" class="tiny label">ACC</text>

  <!-- WB select from named net aliases -->
  <text x="33" y="402" class="label">写回选择器</text>
  <rect x="155" y="413" width="190" height="111" rx="8" class="block"/>
  <text x="328" y="435" text-anchor="end" class="small label">WB MUX</text>
  <g class="small">
    <text x="34" y="454">ALU 结果</text><text x="170" y="454" class="accent">ADD / SUB</text>
    <text x="34" y="474">FPU 结果</text><text x="170" y="474" class="accent">FADD</text>
    <text x="34" y="494">P</text><text x="170" y="494" class="accent">MUL</text>
    <text x="34" y="514">ACC</text><text x="170" y="514" class="accent">COPY_ACC</text>
  </g>
  <g class="data">
    <path d="M119 449H155"/><path d="M119 469H155"/><path d="M119 489H155"/><path d="M119 509H155"/>
  </g>
  <path d="M250 524V556" class="data"/>
  <text x="266" y="553" class="label">WD</text>
  <path d="M250 390V413" class="ctrl"/>
  <text x="250" y="385" class="tiny accent" text-anchor="middle">WB 选择</text>
  <text x="32" y="592" class="small">同名信号表示连接到同一信号；WD 回到 RF 的写口。</text>

  <!-- command register and FSM panel -->
  <rect x="16" y="626" width="628" height="197" rx="10" class="panel"/>
  <text x="31" y="651" class="label">控制通路</text>
  <rect x="31" y="674" width="198" height="59" rx="7" class="reg"/>
  <text x="130" y="696" text-anchor="middle" class="label">命令寄存器</text>
  <text x="130" y="718" text-anchor="middle" class="small">OP、RA、RB、WA</text>
  <path d="M229 704H264" class="ctrl"/>
  <text x="245" y="690" text-anchor="middle" class="tiny accent">OP</text>
  <rect x="264" y="674" width="160" height="59" rx="7" class="block"/>
  <text x="344" y="696" text-anchor="middle" class="label">FSM</text>
  <text x="344" y="718" text-anchor="middle" class="small">当前阶段 / OP</text>
  <path d="M424 704H461" class="ctrl"/>
  <rect x="461" y="667" width="166" height="106" rx="7" class="reg"/>
  <text x="544" y="692" text-anchor="middle" class="label accent">控制信号</text>
  <text x="544" y="713" text-anchor="middle" class="tiny">EN_XW / EN_P</text>
  <text x="544" y="731" text-anchor="middle" class="tiny">EN_ACC / WE</text>
  <text x="544" y="749" text-anchor="middle" class="tiny">ALU / WB 选择等</text>
  <path d="M130 733V779" class="ctrl"/>
  <text x="130" y="800" text-anchor="middle" class="small accent">RA、RB、WA → RF 对应端口</text>
  <text x="20" y="847" class="small">数据通路表示可连接的资源，不表示所有运算同时执行。</text>
  <text x="20" y="868" class="small">共同的 CLK 与复位连接已省略。</text>
</svg>
