<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 562" width="660" height="562" role="img" aria-labelledby="title desc">
  <title id="title">任务发射、执行结果就绪、写回及消费者可用的时间区别</title>
  <desc id="desc">乘法任务 T0 在 E0 前已被接纳，已属于在途任务并等待发射，消费者 T1 需要 T0 的 R5。E0 T0 发射握手进入 READ；E1 将操作数采样到 X W 寄存器；E2 中间寄存器 P 得到有效结果 6，生产者侧已准备好写回，但 RF 的 R5 还不可用；E3 写回握手成功，R5 等于六，消费者所需的 R5 在该沿之后才就绪；E4 T1 可发射；E5 T1 将六和一采样到 X W；E6 ALU 结果写回 R6 等于七。图描述教学单元的写回和可用性，不涉及 ISA 的退休或提交。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14.5px}.label{font-weight:700}
      .accent{fill:#8a5d1c}.header{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.3}
      .row{fill:#fafbf8}.edge{fill:#edf1df}.wait{fill:#eee6d5}
      .active{fill:#e0ebe3}.done{fill:#d2e6d7}.output{fill:#dce7e6}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="560" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="heading">结果已经算出来，不等于消费者已经能使用</text>
  <text x="20" y="61" class="small">E₀ 前：T₀ 已接纳（在途），等待发射；T₁ 等待 R5。</text>
  <text x="20" y="84" class="small">各行记载该边沿发生的事件，以及沿后可见的状态。</text>
  <rect x="18" y="99" width="70" height="47" rx="5" class="header"/>
  <rect x="96" y="99" width="278" height="47" rx="5" class="header"/>
  <rect x="382" y="99" width="260" height="47" rx="5" class="header"/>
  <g text-anchor="middle" class="small label">
    <text x="53" y="128">边沿</text>
    <text x="235" y="128">T₀：MUL → R5</text>
    <text x="512" y="128">T₁：R5 + 1 → R6</text>
  </g>
  <!-- E0–E6 -->
  <g>
    <rect x="18" y="154" width="70" height="44" rx="5" class="edge"/><text x="53" y="181" text-anchor="middle">E₀</text>
    <rect x="96" y="154" width="278" height="44" rx="5" class="active"/>
    <text x="108" y="174" class="small label">发射握手，进入 READ</text><text x="108" y="191" class="tiny">进入执行通路</text>
    <rect x="382" y="154" width="260" height="44" rx="5" class="wait"/>
    <text x="395" y="181" class="small accent">等待 R5，不可发射</text>

    <rect x="18" y="202" width="70" height="44" rx="5" class="edge"/><text x="53" y="229" text-anchor="middle">E₁</text>
    <rect x="96" y="202" width="278" height="44" rx="5" class="active"/>
    <text x="108" y="222" class="small label">X/W 采样操作数</text><text x="108" y="239" class="tiny">随后进行乘法</text>
    <rect x="382" y="202" width="260" height="44" rx="5" class="wait"/>
    <text x="395" y="229" class="small accent">等待 R5</text>

    <rect x="18" y="250" width="70" height="44" rx="5" class="edge"/><text x="53" y="277" text-anchor="middle">E₂</text>
    <rect x="96" y="250" width="278" height="44" rx="5" class="output"/>
    <text x="108" y="270" class="small label">P = 6，结果已有效</text><text x="108" y="287" class="tiny">生产者侧已完成运算，尚未写回</text>
    <rect x="382" y="250" width="260" height="44" rx="5" class="wait"/>
    <text x="395" y="277" class="small accent">RF 的 R5 仍未就绪</text>

    <rect x="18" y="298" width="70" height="44" rx="5" class="edge"/><text x="53" y="325" text-anchor="middle">E₃</text>
    <rect x="96" y="298" width="278" height="44" rx="5" class="done"/>
    <text x="108" y="318" class="small label">写回握手，R5 ← 6</text><text x="108" y="335" class="tiny">新值在该沿之后可用</text>
    <rect x="382" y="298" width="260" height="44" rx="5" class="done"/>
    <text x="395" y="318" class="small label">R5 沿后就绪</text><text x="395" y="335" class="tiny">E₃ 同一沿仍不能发射</text>

    <rect x="18" y="346" width="70" height="44" rx="5" class="edge"/><text x="53" y="373" text-anchor="middle">E₄</text>
    <rect x="96" y="346" width="278" height="44" rx="5" class="row"/>
    <text x="108" y="373" class="small">已写回</text>
    <rect x="382" y="346" width="260" height="44" rx="5" class="active"/>
    <text x="395" y="366" class="small label">发射，进入 READ</text><text x="395" y="383" class="tiny">依赖已满足</text>

    <rect x="18" y="394" width="70" height="44" rx="5" class="edge"/><text x="53" y="421" text-anchor="middle">E₅</text>
    <rect x="96" y="394" width="278" height="44" rx="5" class="row"/>
    <text x="108" y="421" class="small">已写回</text>
    <rect x="382" y="394" width="260" height="44" rx="5" class="active"/>
    <text x="395" y="414" class="small label">X/W 采样 (6, 1)</text><text x="395" y="431" class="tiny">随后进行加法</text>

    <rect x="18" y="442" width="70" height="44" rx="5" class="edge"/><text x="53" y="469" text-anchor="middle">E₆</text>
    <rect x="96" y="442" width="278" height="44" rx="5" class="row"/>
    <text x="108" y="469" class="small">已写回</text>
    <rect x="382" y="442" width="260" height="44" rx="5" class="done"/>
    <text x="395" y="462" class="small label">写回 R6 ← 7</text><text x="395" y="479" class="tiny">新值沿后可见</text>
  </g>
  <rect x="18" y="499" width="624" height="46" rx="7" fill="#e0ebe3"/>
  <text x="30" y="519" class="small">本例无旁路，消费者只通过 RF 取得新值。</text>
  <text x="30" y="539" class="small">这里只区分发射、执行结果就绪、写回；不讨论 ISA 退休或提交。</text>
</svg>
