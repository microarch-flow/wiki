<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 692" width="660" height="692" role="img" aria-labelledby="title desc">
  <title id="title">单条累加递推的相邻迭代必须等待旧部分和更新</title>
  <desc id="desc">独立乘积六、五、六、四已准备好，累加从零开始。左列一拍累加器在 E0 后启动第一项，E1 后 ACC 为六并开始第二项，E2 后 ACC 为十一并开始第三项，E3 后 ACC 为十七并开始第四项，E4 后 ACC 为二十一。右列两级累加器在 E0 后启动第一项，E1 后只有中间结果且 ACC 仍为零，E2 后 ACC 更新为六，下一项才可从更新后的 Q 开始在 E2 至 E3 期间传播。E3 中间结果，E4 ACC 为十一；E5 中间结果，E6 ACC 为十七；E7 中间结果，E8 ACC 为二十一。无额外旁路、重新结合或交错等优化时，后一项等到前一项写回，启动间隔至少两拍。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.small{font-size:16px}.tiny{font-size:14.5px}
      .accent{fill:#8a5d1c}.label{font-weight:700}
      .header{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.3}
      .normal{fill:#fafbf8}.alt{fill:#edf1df}
      .wait{fill:#eee6d5}.done{fill:#d2e6d7}
      .line{stroke:#c7d3c7;stroke-width:1.1}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="690" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="35" class="heading">同一份 ACC 的反馈依赖：下一项何时能开始？</text>
  <text x="20" y="61" class="small">ACC 初值为 0；四项乘积 P₀、P₁、P₂、P₃ 已准备好：6、5、6、4。</text>
  <text x="20" y="84" class="small">每项都使用上一项的 ACC；表格列的是边沿后状态及后续一拍动作。</text>
  <rect x="18" y="100" width="70" height="63" rx="6" class="header"/>
  <rect x="96" y="100" width="269" height="63" rx="6" class="header"/>
  <rect x="373" y="100" width="269" height="63" rx="6" class="header"/>
  <g text-anchor="middle" font-weight="700">
    <text x="53" y="137" class="small">时钟沿</text>
    <text x="230.5" y="124">一拍完成累加</text><text x="230.5" y="148" class="small">ACC / 沿后动作</text>
    <text x="507.5" y="124">两级累加流水线</text><text x="507.5" y="148" class="small">ACC / 沿后动作</text>
  </g>
  <!-- Rows generated below, one row per edge; identical edge indices do not assert equal wall-clock time. -->
  <g text-anchor="middle">
    <rect x="18" y="171" width="70" height="43" rx="5" class="alt"/><text x="53" y="198">E₀</text>
    <rect x="96" y="171" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="198">0 / 启动 +6</text>
    <rect x="373" y="171" width="269" height="43" rx="5" class="normal"/><text x="507.5" y="198">0 / 启动 +6（第 1 级）</text>
    <rect x="18" y="217" width="70" height="43" rx="5" class="alt"/><text x="53" y="244">E₁</text>
    <rect x="96" y="217" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="244">6 / 启动 +5</text>
    <rect x="373" y="217" width="269" height="43" rx="5" class="wait"/><text x="507.5" y="244" class="accent">0 / 中间结果（第 2 级）</text>
    <rect x="18" y="263" width="70" height="43" rx="5" class="alt"/><text x="53" y="290">E₂</text>
    <rect x="96" y="263" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="290">11 / 启动 +6</text>
    <rect x="373" y="263" width="269" height="43" rx="5" class="normal"/><text x="507.5" y="290">6 / 启动 +5（第 1 级）</text>
    <rect x="18" y="309" width="70" height="43" rx="5" class="alt"/><text x="53" y="336">E₃</text>
    <rect x="96" y="309" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="336">17 / 启动 +4</text>
    <rect x="373" y="309" width="269" height="43" rx="5" class="wait"/><text x="507.5" y="336" class="accent">6 / 中间结果（第 2 级）</text>
    <rect x="18" y="355" width="70" height="43" rx="5" class="alt"/><text x="53" y="382">E₄</text>
    <rect x="96" y="355" width="269" height="43" rx="5" class="done"/><text x="230.5" y="382" font-weight="700">21 / 完成</text>
    <rect x="373" y="355" width="269" height="43" rx="5" class="normal"/><text x="507.5" y="382">11 / 启动 +6（第 1 级）</text>
    <rect x="18" y="401" width="70" height="43" rx="5" class="alt"/><text x="53" y="428">E₅</text>
    <rect x="96" y="401" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="428" fill="#749184">21 / 保持</text>
    <rect x="373" y="401" width="269" height="43" rx="5" class="wait"/><text x="507.5" y="428" class="accent">11 / 中间结果（第 2 级）</text>
    <rect x="18" y="447" width="70" height="43" rx="5" class="alt"/><text x="53" y="474">E₆</text>
    <rect x="96" y="447" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="474" fill="#749184">21 / 保持</text>
    <rect x="373" y="447" width="269" height="43" rx="5" class="normal"/><text x="507.5" y="474">17 / 启动 +4（第 1 级）</text>
    <rect x="18" y="493" width="70" height="43" rx="5" class="alt"/><text x="53" y="520">E₇</text>
    <rect x="96" y="493" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="520" fill="#749184">21 / 保持</text>
    <rect x="373" y="493" width="269" height="43" rx="5" class="wait"/><text x="507.5" y="520" class="accent">17 / 中间结果（第 2 级）</text>
    <rect x="18" y="539" width="70" height="43" rx="5" class="alt"/><text x="53" y="566">E₈</text>
    <rect x="96" y="539" width="269" height="43" rx="5" class="normal"/><text x="230.5" y="566" fill="#749184">21 / 保持</text>
    <rect x="373" y="539" width="269" height="43" rx="5" class="done"/><text x="507.5" y="566" font-weight="700">21 / 完成</text>
  </g>
  <rect x="18" y="592" width="624" height="84" rx="7" fill="#e0ebe3"/>
  <text x="30" y="614" class="small">两级例：E₂ 后 ACC 的新 Q 才经组合逻辑启动下一项；</text>
  <text x="30" y="635" class="small">不是在 E₂ 同一沿又捕获这个新 Q。未用旁路、重结合或交错。</text>
  <text x="30" y="659" class="small accent">单条递推的 II 至少为 2 拍；只比较拍数，未假设两方案周期相等。</text>
</svg>
