<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 427" width="690" height="427" role="img" aria-labelledby="multi-title multi-desc">
  <title id="multi-title">乘法命令的多周期状态推进和中间结果保存</title>
  <desc id="multi-desc">教学 MULTIPLY 命令 R6 等于 R0 乘 R1。E0 在 IDLE 接收并锁存命令，然后进入 READ。E1 采入 X=2、W=3 并进入 MUL。E2 将乘积 P=6 写入中间寄存器并进入 WB，此时 RF R6 仍为0。E3 之前 WB 写使能有效，E3 将中间寄存器的6写入 R6，回到 IDLE。P 在 E2 后及 E3 写回时保持6。非 IDLE 不接受新的命令。图只给出这个固定阶段教学设计的逻辑边沿行为，不意味着所有乘法都需要相同的拍数。</desc>
  <defs>
    <marker id="multi-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.symbol{font-size:20px;font-weight:700}.note{font-size:16px;fill:#4f695a}.label{font-size:18px;font-weight:600}.ctrl{font-size:15px;font-weight:600;fill:#765a2f}
      .state{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.wire{fill:none;stroke:#376a55;stroke-width:2;marker-end:url(#multi-arrow)}
      .edge{stroke:#849c8c;stroke-width:1.4;stroke-dasharray:4 4;fill:none}.clock{stroke:#376a55;stroke-width:2.3;fill:none;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="688" height="425" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="heading" x="22" y="34">一次 MUL：R6 ← R0 × R1</text>
  <!-- Finite state transitions: an edge advances the state after completing that edge's action. -->
  <g text-anchor="middle">
    <rect class="state" x="24" y="60" width="106" height="39" rx="7"/><text class="symbol" x="77" y="86">IDLE</text>
    <rect class="state" x="158" y="60" width="106" height="39" rx="7"/><text class="symbol" x="211" y="86">READ</text>
    <rect class="state" x="292" y="60" width="106" height="39" rx="7"/><text class="symbol" x="345" y="86">MUL</text>
    <rect class="state" x="426" y="60" width="106" height="39" rx="7"/><text class="symbol" x="479" y="86">WB</text>
    <rect class="state" x="560" y="60" width="106" height="39" rx="7"/><text class="symbol" x="613" y="86">IDLE</text>
    <text class="note" x="144" y="54">E₀</text><text class="note" x="278" y="54">E₁</text><text class="note" x="412" y="54">E₂</text><text class="note" x="546" y="54">E₃</text>
  </g>
  <path class="wire" d="M130 80H154"/><path class="wire" d="M264 80H288"/><path class="wire" d="M398 80H422"/><path class="wire" d="M532 80H556"/>
  <text x="22" y="125" class="note">独立算例，R6 初始为 0；READ、MUL、WB 期间不接收其他命令。</text>
  <g class="note" text-anchor="middle"><text x="154" y="151">E₀</text><text x="283" y="151">E₁</text><text x="412" y="151">E₂</text><text x="541" y="151">E₃</text></g>
  <text class="label" x="22" y="177">CLK</text>
  <path class="clock" d="M132 181H154V159H211V181H283V159H340V181H412V159H469V181H541V159H598V181H662"/>
  <rect x="15" y="190" width="660" height="53" rx="6" fill="#e9e6d5"/>
  <text class="label" x="22" y="213">该沿的动作</text><text class="note" x="22" y="233">沿前使能</text>
  <g text-anchor="middle"><text x="218.5" y="213">接受 MUL</text><text class="note" x="218.5" y="233">存命令</text><text x="347.5" y="213">采入 X/W</text><text class="ctrl" x="347.5" y="233">EN_XW=1</text><text x="476.5" y="213">保存乘积 P</text><text class="ctrl" x="476.5" y="233">EN_P=1</text><text x="605.5" y="213">写回 R6</text><text class="ctrl" x="605.5" y="233">WE=1</text></g>
  <rect x="15" y="246" width="660" height="37" rx="6" fill="#e8eee6"/>
  <text class="label" x="22" y="270">沿后阶段</text>
  <g text-anchor="middle"><text x="218.5" y="270">READ</text><text x="347.5" y="270">MUL</text><text x="476.5" y="270">WB</text><text x="605.5" y="270">IDLE</text></g>
  <rect x="15" y="286" width="660" height="37" rx="6" fill="#fafbf8"/>
  <text class="label" x="22" y="310">X、W 沿后</text>
  <g text-anchor="middle"><text class="note" x="218.5" y="310">未用</text><text x="347.5" y="310">(2, 3)</text><text x="476.5" y="310">(2, 3)</text><text x="605.5" y="310">(2, 3)</text></g>
  <rect x="15" y="326" width="660" height="37" rx="6" fill="#e8eee6"/>
  <text class="label" x="22" y="350">P 沿后</text>
  <rect x="415" y="329" width="123" height="31" rx="5" fill="#e6dcc4"/><g text-anchor="middle"><text class="note" x="218.5" y="350">未用</text><text class="note" x="347.5" y="350">未用</text><text class="symbol" x="476.5" y="350">6</text><text x="605.5" y="350">6</text></g>
  <rect x="15" y="366" width="660" height="37" rx="6" fill="#edf1df"/>
  <text class="label" x="22" y="390">R6 沿后</text>
  <rect x="544" y="369" width="123" height="31" rx="5" fill="#d2e6d7"/><g text-anchor="middle"><text x="218.5" y="390">0</text><text x="347.5" y="390">0</text><text x="476.5" y="390">0</text><text class="symbol" x="605.5" y="390">6</text></g>
  <path class="edge" d="M154 153V405M283 153V405M412 153V405M541 153V405"/>
  <text class="note" x="22" y="420">教学固定阶段及边沿示意（省略传播延迟），不是通用乘法延迟。</text>
</svg>
