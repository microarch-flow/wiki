<svg xmlns="http://www.w3.org/2000/svg" width="660" height="378" viewBox="0 0 660 378" role="img" aria-labelledby="ripple-title ripple-desc">
  <title id="ripple-title">四位串行进位加法器算例：0011 加 0101</title>
  <desc id="ripple-desc">四个全加器从左至右对应第零位至第三位，黄色线表示从低位向高位传递的进位，绿色线表示操作数和本位结果。初始 C0 为 0，第零位 1 加 1 加 0 得 S0=0、C1=1；第一位 1 加 0 加 1 得 S1=0、C2=1；第二位 0 加 1 加 1 得 S2=0、C3=1；第三位 0 加 0 加 1 得 S3=1、C4=0。从高位向低位读出结果 1000。图示逻辑依赖，不表示实际传播时间。</desc>
  <defs>
    <marker id="ripple-data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <marker id="ripple-carry-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#967333"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head{font-size:22px;font-weight:700}
      .note{font-size:16px;fill:#4f695a}
      .number{font-size:18px;font-weight:600}
      .logic{font-size:21px;font-weight:700}
      .box{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.7}
      .data{fill:none;stroke:#376a55;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#ripple-data-arrow)}
      .carry{fill:none;stroke:#967333;stroke-width:3;stroke-linejoin:round;marker-end:url(#ripple-carry-arrow)}
      .carrytext{font-size:17px;font-weight:600;fill:#765a2f}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="376" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="34" class="head">四位加法：0011 + 0101</text>
  <text x="22" y="61" class="note">图中从低位到高位排列；每个全加器计算本位 Aᵢ、Bᵢ、Cᵢ</text>

  <!-- Four columns: i=0 (LSB) on the left and i=3 (MSB) on the right. -->
  <g text-anchor="middle" class="number">
    <text x="108" y="95">i = 0</text><text x="251" y="95">i = 1</text>
    <text x="394" y="95">i = 2</text><text x="537" y="95">i = 3</text>
    <text x="79" y="119">A₀=1</text><text x="137" y="119">B₀=1</text>
    <text x="222" y="119">A₁=1</text><text x="280" y="119">B₁=0</text>
    <text x="365" y="119">A₂=0</text><text x="423" y="119">B₂=1</text>
    <text x="508" y="119">A₃=0</text><text x="566" y="119">B₃=0</text>
  </g>
  <g class="data">
    <path d="M86 127V151"/><path d="M130 127V151"/>
    <path d="M229 127V151"/><path d="M273 127V151"/>
    <path d="M372 127V151"/><path d="M416 127V151"/>
    <path d="M515 127V151"/><path d="M559 127V151"/>
  </g>

  <g text-anchor="middle">
    <rect class="box" x="63" y="155" width="90" height="68" rx="9"/>
    <text x="108" y="182" class="logic">FA₀</text><text x="108" y="204" class="note">全加器</text>
    <rect class="box" x="206" y="155" width="90" height="68" rx="9"/>
    <text x="251" y="182" class="logic">FA₁</text><text x="251" y="204" class="note">全加器</text>
    <rect class="box" x="349" y="155" width="90" height="68" rx="9"/>
    <text x="394" y="182" class="logic">FA₂</text><text x="394" y="204" class="note">全加器</text>
    <rect class="box" x="492" y="155" width="90" height="68" rx="9"/>
    <text x="537" y="182" class="logic">FA₃</text><text x="537" y="204" class="note">全加器</text>
  </g>

  <!-- C0, C1, C2, C3, C4. Each full adder sees the carry from its immediate lower bit. -->
  <g class="carry">
    <path d="M12 189H59"/><path d="M153 189H202"/>
    <path d="M296 189H345"/><path d="M439 189H488"/>
    <path d="M582 189H648"/>
  </g>
  <g text-anchor="middle" class="carrytext">
    <text x="36" y="179">C₀=0</text>
    <text x="179" y="179">C₁=1</text>
    <text x="322" y="179">C₂=1</text>
    <text x="465" y="179">C₃=1</text>
    <text x="615" y="179">C₄=0</text>
  </g>

  <g class="data">
    <path d="M108 223V251"/><path d="M251 223V251"/>
    <path d="M394 223V251"/><path d="M537 223V251"/>
  </g>
  <g text-anchor="middle" class="number">
    <text x="108" y="276">S₀ = 0</text><text x="251" y="276">S₁ = 0</text>
    <text x="394" y="276">S₂ = 0</text><text x="537" y="276">S₃ = 1</text>
  </g>
  <rect x="22" y="291" width="616" height="43" rx="7" fill="#e9edde" stroke="#ced9c7"/>
  <text x="330" y="318" text-anchor="middle" class="number">从高位读到低位：S₃S₂S₁S₀ = 1000</text>
  <path class="carry" d="M22 350H60"/><text x="71" y="356" class="note">进位依赖</text>
  <path class="data" d="M166 350H204"/><text x="215" y="356" class="note">数据与和</text>
  <text x="330" y="356" class="note">逻辑连接示意，不表示实际延迟</text>
</svg>
