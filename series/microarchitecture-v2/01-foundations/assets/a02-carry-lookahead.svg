<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 623" width="640" height="623" role="img" aria-labelledby="cla-title cla-desc">
  <title id="cla-title">四位超前进位：并行求两组的产生和传播条件</title>
  <desc id="cla-desc">例子为 0011 加 0101，输入进位 C0 为零。每位 G 为 A 与 B，P 为 A 异或 B，按位号从高到低依次有 G=0001、P=0110。高位组位 3 至 2 独立算得组 G_H=0、P_H=0，低位组位 1 至 0 独立算得组 G_L=1、P_L=0。合并两组得到 G=G_H 或 P_H 与 G_L 的与等于 0，P=P_H 与 P_L 等于 0。全组进位 C4=G 或 P 与 C0 的与等于 0。低位组独立产生 C2=G_L 或 P_L 与 C0 的与等于 1。位 0 和位 2 的条件分别用 C0 和 C2 得到进位 C1=1、C3=1；各位和为 P_i 异或 C_i，故低四位结果为 1000。箭头表示组合逻辑的依赖关系，不代表时钟周期。</desc>
  <defs>
    <marker id="cla-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#567b69"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.note{font-size:16px;fill:#4f695a}
      .formula{font-size:18px}.key{font-size:20px;font-weight:700}.val{font-weight:700;fill:#245a45}.sub{baseline-shift:sub;font-size:12px}
      .group{fill:#e4eee6;stroke:#94ad9b;stroke-width:1.6}.formula-box{fill:#e9eddd;stroke:#9dad91;stroke-width:1.6}
      .wire{fill:none;stroke:#567b69;stroke-width:2.1;stroke-linejoin:round;marker-end:url(#cla-arrow)}
      .signal{fill:#765a2f;font-size:16px;font-weight:600}
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="621" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="head" x="23" y="34">四位加法：成组预测进位</text>
  <text class="key" x="23" y="63">A = 0011　 B = 0101　 C₀ = 0</text>
  <text class="formula" x="23" y="91">Gᵢ = Aᵢ ∧ Bᵢ，Pᵢ = Aᵢ ⊕ Bᵢ</text>
  <text class="formula" x="23" y="115">Cᵢ₊₁ = Gᵢ ∨ (Pᵢ ∧ Cᵢ)</text>
  <text class="note" x="320" y="139" text-anchor="middle">两组从操作数并行计算 G 与 P，不必等待输入进位。</text>
  <!-- The high and low 2-bit blocks independently derive their group G/P. -->
  <rect class="group" x="23" y="150" width="285" height="135" rx="9"/>
  <rect class="group" x="332" y="150" width="285" height="135" rx="9"/>
  <text class="subhead" x="165.5" y="178" text-anchor="middle">高位组 [3:2]</text>
  <text class="subhead" x="474.5" y="178" text-anchor="middle">低位组 [1:0]</text>
  <g class="formula" text-anchor="middle">
    <text x="165.5" y="205">G₃G₂ = 00，P₃P₂ = 01</text>
    <text x="474.5" y="205">G₁G₀ = 01，P₁P₀ = 10</text>
    <text x="165.5" y="234">G<tspan class="sub">H</tspan> = G₃ ∨ (P₃ ∧ G₂) = <tspan class="val">0</tspan></text>
    <text x="474.5" y="234">G<tspan class="sub">L</tspan> = G₁ ∨ (P₁ ∧ G₀) = <tspan class="val">1</tspan></text>
    <text x="165.5" y="262">P<tspan class="sub">H</tspan> = P₃ ∧ P₂ = <tspan class="val">0</tspan></text>
    <text x="474.5" y="262">P<tspan class="sub">L</tspan> = P₁ ∧ P₀ = <tspan class="val">0</tspan></text>
  </g>
  <!-- Two groups converge into the full group; low group also determines C2. -->
  <path class="wire" d="M165.5 285V320"/>
  <path class="wire" d="M474.5 285V300H269V320"/>
  <path class="wire" d="M474.5 300H511V320"/>
  <circle cx="474.5" cy="300" r="3.5" fill="#567b69"/>
  <rect class="formula-box" x="23" y="323" width="365" height="123" rx="9"/>
  <rect class="formula-box" x="405" y="323" width="212" height="123" rx="9"/>
  <text class="subhead" x="205.5" y="347" text-anchor="middle">全组 [3:0]</text>
  <text class="subhead" x="511" y="347" text-anchor="middle">中间进位</text>
  <text class="formula" x="205.5" y="375" text-anchor="middle">G = G<tspan class="sub">H</tspan> ∨ (P<tspan class="sub">H</tspan> ∧ G<tspan class="sub">L</tspan>) = <tspan class="val">0</tspan></text>
  <text class="formula" x="205.5" y="401" text-anchor="middle">P = P<tspan class="sub">H</tspan> ∧ P<tspan class="sub">L</tspan> = <tspan class="val">0</tspan></text>
  <text class="key" x="205.5" y="430" text-anchor="middle">C₄ = G ∨ (P ∧ C₀) = 0</text>
  <text class="formula" x="511" y="383" text-anchor="middle">C₂ = G<tspan class="sub">L</tspan> ∨ (P<tspan class="sub">L</tspan> ∧ C₀)</text>
  <text class="key" x="511" y="413" text-anchor="middle">= 1</text>
  <!-- C1 and C3 are obtained locally, not by deriving the sums from C4. -->
  <text class="subhead" x="23" y="476">各位还需要自己的输入进位</text>
  <text class="formula" x="23" y="503">C₁ = G₀ ∨ (P₀ ∧ C₀) = 1</text>
  <text class="formula" x="332" y="503">C₃ = G₂ ∨ (P₂ ∧ C₂) = 1</text>
  <text class="formula" x="23" y="532">C₀、C₁、C₂、C₃ 分别为 0、1、1、1；C₄ = 0。</text>
  <rect x="23" y="546" width="594" height="40" rx="8" fill="#dce9db" stroke="#a0b3a0"/>
  <text class="key" x="320" y="573" text-anchor="middle">各位 Sᵢ = Pᵢ ⊕ Cᵢ　→　低四位和 S = 1000</text>
  <text class="note" x="23" y="610">箭头表示组合逻辑依赖，不表示时钟周期或实际延迟。</text>
</svg>
