<text x="395.5" y="262" text-anchor="middle" class="bold">J1</text>
<text x="486.5" y="262" text-anchor="middle" class="">空</text>
<rect x="542" y="243" width="71" height="26" rx="6" fill="#d2e6d7" stroke="#82a18e"/>
<text x="577.5" y="262" text-anchor="middle" class="bold">J0</text>
<text x="687.5" y="262" text-anchor="middle" class="small">—</text>
<rect x="17" y="274" width="734" height="36" fill="#f2e8d3"/>
<text x="46.0" y="298" text-anchor="middle" class="bold">E3</text>
