<text x="486.5" y="370" text-anchor="middle" class="bold">J2</text>
<rect x="542" y="351" width="71" height="26" rx="6" fill="#d2e6d7" stroke="#82a18e"/>
<text x="577.5" y="370" text-anchor="middle" class="bold">J1</text>
<text x="687.5" y="370" text-anchor="middle" class="small">J0→R5=6</text>
