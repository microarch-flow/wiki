<text x="128.0" y="370" text-anchor="middle" class="small">J3 / 接收</text>
<text x="212.5" y="370" text-anchor="middle" class="ready">1</text>
<text x="297.5" y="370" text-anchor="middle" class="ready">1 1 1</text>
