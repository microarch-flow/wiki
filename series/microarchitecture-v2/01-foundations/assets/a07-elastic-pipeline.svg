<text x="22" y="512" class="note">¹ ready 顺序：READ、MUL、WB（不是写回端的 ready）。</text>
<text x="22" y="536" class="strong">E3：MUL 有空位，J1 前进；WB 停住。</text>
<text x="22" y="561" class="strong">E4：三级全满，J3 等待并保持；E5：写回恢复，同时推进。</text>
<text x="22" y="586" class="note">J3：4 × 1 = 4，WA = 5；按序写回，故 E8 有意覆盖 J0 写入的 R5。</text>
<text x="22" y="608" class="note">各 J 包含其数据、WA（J0/J1/J2/J3 分别为 5/6/7/5）及有效状态。</text>
</svg>
