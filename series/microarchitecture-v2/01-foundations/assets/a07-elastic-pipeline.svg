<text x="297.5" y="334" text-anchor="middle" class="notready">0 0 0</text>
<rect x="360" y="315" width="71" height="26" rx="6" fill="#d2e6d7" stroke="#82a18e"/>
<text x="395.5" y="334" text-anchor="middle" class="bold">J2</text>
<rect x="451" y="315" width="71" height="26" rx="6" fill="#d2e6d7" stroke="#82a18e"/>
<text x="486.5" y="334" text-anchor="middle" class="bold">J1</text>
<rect x="542" y="315" width="71" height="26" rx="6" fill="#d2e6d7" stroke="#82a18e"/>
<text x="577.5" y="334" text-anchor="middle" class="bold">J0</text>
<text x="687.5" y="334" text-anchor="middle" class="small">—</text>
