<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 622" width="768" height="622" role="img" aria-labelledby="elastic-title elastic-desc">
<title id="elastic-title">带本地暂停条件的三级弹性流水线</title>
<desc id="elastic-desc">每行表示某个上升沿。沿前记录源提出的新任务、写回端 ready、READ、MUL、WB 三个寄存器的自身 ready；沿后记录三个级中的任务。E0 接收 J0，E1 无新任务，E2 接收 J1，沿后 READ 为 J1、MUL 为空、WB 为 J0。写回端 E3、E4 不可接收。E3 的 ready 从 READ 到 WB 为 1、1、0，J1 可进入空 MUL，同时接收 J2 到 READ，WB 保持 J0。E4 ready 均为零，源保持 J3，三个级不变。E5 写回端 ready 恢复，三个级 ready 均为一，接收之前等待的 J3，J2 进 MUL，J1 进 WB，同时 J0 写回 R5 等于六。E6、E7、E8 分别写回 J1、J2、J3。J3 计算 4 乘 1 得到 4，目标为 R5，按序写回在 J0 之后，因而有意覆盖 R5 中旧结果。WA 是随任务传递的目标编号，不由级的位置决定。</desc>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.head{font-size:22px;font-weight:700}.strong{font-size:19px;font-weight:700}.note{font-size:16px;fill:#4f695a}.bold{font-weight:700}
.small{font-size:16px}.edge{stroke:#c4d0c4;stroke-width:1}.notready{fill:#795a2e;font-weight:700}.ready{fill:#376a55;font-weight:700}
</style>
<rect x="1" y="1" width="766" height="620" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
<text x="22" y="34" class="head">有空位时仍可推进；空位用完才向前反压</text>
<text x="22" y="61" class="note">每一级的 ready 表示其当前寄存器能在本沿采入新任务。</text>
<text x="22" y="87" class="note">数据：READ → MUL → WB → 写回端；ready 沿相反方向返回。</text>

<rect x="16" y="103" width="736" height="387" rx="8" fill="#f9faf5" stroke="#82a18e" stroke-width="1.4"/>
