<text x="213" y="124" text-anchor="middle" class="strong">沿前：输入与接收条件</text>
<text x="486.5" y="124" text-anchor="middle" class="strong">沿后：各级保存的任务</text>
<text x="687.5" y="124" text-anchor="middle" class="strong">本沿写回</text>
