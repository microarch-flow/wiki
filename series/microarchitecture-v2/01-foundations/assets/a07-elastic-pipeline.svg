<text x="486.5" y="298" text-anchor="middle" class="bold">J1</text>
<rect x="542" y="279" width="71" height="26" rx="6" fill="#d2e6d7" stroke="#82a18e"/>
<text x="577.5" y="298" text-anchor="middle" class="bold">J0</text>
<text x="687.5" y="298" text-anchor="middle" class="small">—</text>
