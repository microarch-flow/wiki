<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 590" width="660" height="590" role="img" aria-labelledby="mul-title mul-desc">
  <title id="mul-title">FP16 正规数乘法：分别计算符号、指数与有效数字</title>
  <desc id="mul-desc">两个正数 A、B 均为三，各自解码为符号零、实际指数一、二进制有效数字一点一。符号异或为零，指数相加为二，有效数字相乘为二进制十点零一。规格化将有效数字右移一位，并把指数加一，得到一点零零一乘二的三次方。乘积精确可表示，舍入不改变结果。最终编码符号零、偏置指数十八即一零零一零、尾数零零一零零零零零零零，得到九。本图省略特殊值处理路径，仅展示数值关系而非时钟周期。</desc>
  <defs>
    <marker id="mul-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .heading{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:700}.note{font-size:16px;fill:#4f695a}.bits{font-family:"Noto Sans Mono CJK SC",monospace;font-size:20px;font-weight:700}
      .block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.6}.step{fill:#edf1df;stroke:#82a18e;stroke-width:1.6}.amber{fill:#eee8d5;stroke:#b69a65;stroke-width:1.5}
      .wire{stroke:#376a55;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#mul-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="588" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">FP16 乘法：+3 × +3 = +9</text>
  <rect x="20" y="51" width="620" height="59" rx="8" class="step"/>
  <text x="330" y="76" text-anchor="middle" class="label">两个操作数均为 +3</text>
  <text x="330" y="99" text-anchor="middle">解码得到 1.1₂ × 2¹（S = 0，e = 1）</text>

  <!-- Three parts of the decoded operands. -->
  <path class="wire" d="M95 110V143"/><path class="wire" d="M270 110V143"/><path class="wire" d="M510 110V143"/>
  <rect x="20" y="148" width="150" height="113" rx="8" class="block"/>
  <rect x="190" y="148" width="160" height="113" rx="8" class="block"/>
  <rect x="370" y="148" width="270" height="113" rx="8" class="block"/>
  <g text-anchor="middle">
    <text x="95" y="177" class="label">符号异或</text><text x="95" y="207">0 ⊕ 0</text><text x="95" y="241" class="bits">S = 0</text>
    <text x="270" y="177" class="label">实际指数相加</text><text x="270" y="207">1 + 1</text><text x="270" y="241" class="bits">e = 2</text>
    <text x="505" y="177" class="label">有效数字相乘</text><text x="505" y="207">1.1₂ × 1.1₂</text><text x="505" y="241" class="bits">= 10.01₂</text>
  </g>

  <!-- Sign passes unchanged; normalize exponent and significand together. -->
  <path class="wire" d="M270 261V293"/>
  <path class="wire" d="M505 261V293"/>
  <rect x="190" y="298" width="450" height="87" rx="9" class="amber"/>
  <text x="415" y="325" text-anchor="middle" class="label">规格化（保持数值不变）</text>
  <text x="415" y="349" text-anchor="middle">10.01₂ × 2² = 1.001₂ × 2³</text>
  <text x="415" y="373" text-anchor="middle" class="note">有效数字右移一位，实际指数加一</text>

  <path class="wire" d="M415 385V408"/>
  <rect x="190" y="413" width="450" height="59" rx="8" class="block"/>
  <text x="415" y="436" text-anchor="middle" class="label">舍入</text>
  <text x="415" y="460" text-anchor="middle">精确可表示，仍为 1.001₂ × 2³</text>
  <path class="wire" d="M270 472V490"/>
  <path class="wire" d="M505 472V490"/>
  <path class="wire" d="M95 261V490"/><text x="95" y="365" text-anchor="middle" class="note" transform="rotate(-90 95 365)" dy="-7">符号保持为 0</text>

  <!-- Pack sign, biased exponent, and the explicit fraction field. -->
  <rect x="20" y="495" width="150" height="57" rx="7" class="step"/>
  <rect x="190" y="495" width="160" height="57" rx="7" class="step"/>
  <rect x="370" y="495" width="270" height="57" rx="7" class="step"/>
  <g text-anchor="middle">
    <text x="95" y="516" class="note">符号 S（1 位）</text><text x="95" y="540" class="bits">0</text>
    <text x="270" y="516" class="note">E = 3 + 15 = 18</text><text x="270" y="540" class="bits">10010</text>
    <text x="505" y="516" class="note">小数字段 F（省略隐含的 1）</text><text x="505" y="540" class="bits">0010000000</text>
  </g>
  <text x="20" y="578" class="note">数值流程示意；非时序图，省略零、次正规数及特殊值处理路径。</text>
</svg>
