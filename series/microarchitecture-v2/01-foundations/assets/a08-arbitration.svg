<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 488" width="750" height="488" role="img" aria-labelledby="arb-title arb-desc">
  <title id="arb-title">固定优先级与轮询仲裁：两路请求共享一个结果端口</title>
  <desc id="arb-desc">独立教学算例，请求来源 A、B 均持续有效，外部 READY 始终为一。一个共享结果端口在每个上升沿至多接收一项请求，未成功握手的请求不得丢失。固定优先 A 时，E0 到 E3 连续四次均由 A 成功握手，B 的首项请求一直等待；若条件持续，B 可能饥饿。轮询仲裁初始优先 A，指针仅在成功握手时更新为另一来源。E0 A、E1 B、E2 A、E3 B 依次成功握手，沿后下次优先顺序为 B、A、B、A；两路各传输了两项。若外部 READY 为零且某项有效请求已选作输出，则在有效就绪握手接口下保持其选择和输出负载稳定直到握手。本例的交替服务建立在持续有效、请求符合资格及端口能接收的条件下，不意味着阻塞请求总能得到服务。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:17px}
      .heading{font-size:22px;font-weight:700}.section{font-size:19px;font-weight:700}.note{font-size:15px;fill:#4f695a}.label{font-size:16px;font-weight:600}.value{font-size:19px;font-weight:700}.amber{fill:#765a2f}
      .a{fill:#d5e8d9;stroke:#82a18e;stroke-width:1.4}.b{fill:#eee6d5;stroke:#be9c63;stroke-width:1.4}.row{fill:#fafbf8;stroke:#d4ded1;stroke-width:1.2}.rule{fill:#edf1df;stroke:#c7d4c5;stroke-width:1.2}
    </style>
  </defs>
  <rect x="1" y="1" width="748" height="486" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="heading" x="20" y="34">同一个端口，仲裁规则决定谁先传输</text>
  <text class="note" x="20" y="60">两个独立来源 A、B 持续 VALID=1；结果端口每沿最多接收一项。</text>
  <text class="note" x="20" y="82">以下均假设下游 READY=1，因此被选中的有效请求在当沿握手成功。</text>

  <!-- Fixed priority. -->
  <text x="20" y="115" class="section">固定优先级：A 优先</text>
  <text x="730" y="115" text-anchor="end" class="label">四次传输：A 4 项，B 0 项</text>
  <g class="note" text-anchor="middle">
    <text x="233" y="139">E₀</text><text x="375" y="139">E₁</text><text x="517" y="139">E₂</text><text x="659" y="139">E₃</text>
  </g>
  <text x="20" y="171" class="label">握手成功者</text>
  <rect class="a" x="170" y="148" width="126" height="39" rx="6"/>
  <rect class="a" x="312" y="148" width="126" height="39" rx="6"/>
  <rect class="a" x="454" y="148" width="126" height="39" rx="6"/>
  <rect class="a" x="596" y="148" width="126" height="39" rx="6"/>
  <g class="value" text-anchor="middle"><text x="233" y="174">A</text><text x="375" y="174">A</text><text x="517" y="174">A</text><text x="659" y="174">A</text></g>
  <text class="label" x="20" y="213">未传输者</text>
  <rect x="170" y="192" width="552" height="32" rx="5" fill="#eee6d5" stroke="#be9c63" stroke-width="1.2"/>
  <text x="446" y="214" text-anchor="middle" class="label amber">B 的待处理请求一直保持，未被接收</text>

  <path d="M20 241H730" stroke="#c4d0c4" stroke-width="1.4"/>

  <!-- Round robin. -->
  <text x="20" y="270" class="section">轮询：初始优先 A</text>
  <text x="730" y="270" text-anchor="end" class="label">四次传输：A 2 项，B 2 项</text>
  <g class="note" text-anchor="middle">
    <text x="233" y="295">E₀</text><text x="375" y="295">E₁</text><text x="517" y="295">E₂</text><text x="659" y="295">E₃</text>
  </g>
  <text class="label" x="20" y="327">握手成功者</text>
  <rect class="a" x="170" y="304" width="126" height="39" rx="6"/>
  <rect class="b" x="312" y="304" width="126" height="39" rx="6"/>
  <rect class="a" x="454" y="304" width="126" height="39" rx="6"/>
  <rect class="b" x="596" y="304" width="126" height="39" rx="6"/>
  <g class="value" text-anchor="middle"><text x="233" y="330">A</text><text x="375" y="330" class="amber">B</text><text x="517" y="330">A</text><text x="659" y="330" class="amber">B</text></g>
  <text class="label" x="20" y="370">沿后下次优先</text>
  <rect class="row" x="170" y="349" width="552" height="34" rx="5"/>
  <g class="label" text-anchor="middle"><text x="233" y="371" class="amber">B</text><text x="375" y="371">A</text><text x="517" y="371" class="amber">B</text><text x="659" y="371">A</text></g>
  <path d="M304 350V382M446 350V382M588 350V382" stroke="#d4ded1" stroke-width="1.2"/>
  <text class="note" x="20" y="404">本例指针只在成功握手后更新；若输出阻塞，保持已选请求与输出数据稳定。</text>
  <rect class="rule" x="20" y="416" width="710" height="57" rx="6"/>
  <text class="note" x="32" y="438">每沿最多一个授权，未握手的请求必须保持有效与数据；不能因未被选中而丢失。</text>
  <text class="note" x="32" y="462">固定优先级可能导致 B 一直等待；轮询交替服务依赖请求合格且端口能接收。</text>
</svg>
