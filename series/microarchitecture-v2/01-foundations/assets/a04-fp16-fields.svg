<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-labelledby="fp16-title fp16-desc">
  <title id="fp16-title">IEEE 754 binary16 的三个字段：以十进制 5 为例</title>
  <desc id="fp16-desc">binary16 的第 15 位是符号 S，第 14 至 10 位是五位指数字段 E，第 9 至 0 位是十位小数字段 F。5 的二进制表示为 101，规格化为 1.01 乘以 2 的二次方。S 等于 0，E 等于 10001 即十进制 17，实际指数 e 等于 17 减 15 即 2，F 等于 0100000000。对规格化有限非零数，首位 1 隐含，不写入小数字段，符号位控制正负，负数不取尾数补码。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.note{font-size:16px;fill:#4f695a}
      .strong{font-size:19px;font-weight:700}.bit{font-size:22px;font-weight:700;font-family:"Noto Sans Mono CJK SC",monospace}
      .sign{fill:#f2e8d3;stroke:#b6a073;stroke-width:1.4}.exp{fill:#cddfd2;stroke:#82a18e;stroke-width:1.4}
      .frac{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.4}
      .signtext{fill:#765a2f;font-weight:700}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="418" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="35" class="head">5 如何存入 16 个比特？</text>
  <text x="22" y="64" class="strong">5 = 101₂ = 1.01₂ × 2²</text>
  <text x="22" y="89" class="note">规格化后，分别保存符号、指数字段、小数字段。</text>
  <!-- 16 columns of 38 px, from bit 15 (left) to bit 0 (right). -->
  <g class="note" text-anchor="middle">
    <text x="41" y="125">15</text><text x="79" y="125">14</text><text x="117" y="125">13</text><text x="155" y="125">12</text>
    <text x="193" y="125">11</text><text x="231" y="125">10</text><text x="269" y="125">9</text><text x="307" y="125">8</text>
    <text x="345" y="125">7</text><text x="383" y="125">6</text><text x="421" y="125">5</text><text x="459" y="125">4</text>
    <text x="497" y="125">3</text><text x="535" y="125">2</text><text x="573" y="125">1</text><text x="611" y="125">0</text>
  </g>
  <rect class="sign" x="22" y="135" width="38" height="40"/>
  <g class="exp">
    <rect x="60" y="135" width="38" height="40"/><rect x="98" y="135" width="38" height="40"/>
    <rect x="136" y="135" width="38" height="40"/><rect x="174" y="135" width="38" height="40"/>
    <rect x="212" y="135" width="38" height="40"/>
  </g>
  <g class="frac">
    <rect x="250" y="135" width="38" height="40"/><rect x="288" y="135" width="38" height="40"/>
    <rect x="326" y="135" width="38" height="40"/><rect x="364" y="135" width="38" height="40"/>
    <rect x="402" y="135" width="38" height="40"/><rect x="440" y="135" width="38" height="40"/>
    <rect x="478" y="135" width="38" height="40"/><rect x="516" y="135" width="38" height="40"/>
    <rect x="554" y="135" width="38" height="40"/><rect x="592" y="135" width="38" height="40"/>
  </g>
  <g class="bit" text-anchor="middle">
    <text x="41" y="163">0</text><text x="79" y="163">1</text><text x="117" y="163">0</text><text x="155" y="163">0</text>
    <text x="193" y="163">0</text><text x="231" y="163">1</text><text x="269" y="163">0</text><text x="307" y="163">1</text>
    <text x="345" y="163">0</text><text x="383" y="163">0</text><text x="421" y="163">0</text><text x="459" y="163">0</text>
    <text x="497" y="163">0</text><text x="535" y="163">0</text><text x="573" y="163">0</text><text x="611" y="163">0</text>
  </g>
  <g fill="none" stroke="#82a18e" stroke-width="1.8">
    <path d="M63 180V187H247V180"/><path d="M253 180V187H627V180"/>
  </g>
  <path d="M25 180V187H57V180" fill="none" stroke="#b6a073" stroke-width="1.8"/>
  <g text-anchor="middle" class="strong">
    <text x="41" y="208" class="signtext">S</text>
    <text x="155" y="208">E（5 位）</text>
    <text x="440" y="208">F（10 位）</text>
  </g>

  <rect x="22" y="221" width="608" height="48" rx="7" class="sign"/>
  <text x="35" y="240" class="strong signtext">符号 S（1 位）</text>
  <text x="35" y="260" class="note">S = 0 表示正数；负数由 S = 1 表示，不对 E、F 取补码。</text>
  <rect x="22" y="276" width="608" height="48" rx="7" class="exp"/>
  <text x="35" y="296" class="strong">指数 E = 10001₂ = 17</text>
  <text x="35" y="316" class="note">实际指数 e = E − 15 = 2；15 是 binary16 的指数偏置。</text>
  <rect x="22" y="331" width="608" height="48" rx="7" class="frac"/>
  <text x="35" y="351" class="strong">小数 F = 0100000000</text>
  <text x="35" y="371" class="note">有效数为 1.0100000000₂；规格化数的首位 1 不占存储位。</text>
  <text x="22" y="403" class="note">本图针对规格化数（1 ≤ E ≤ 30），不包括零、次正规数及特殊值。</text>
</svg>
