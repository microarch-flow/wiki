<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 615" width="720" height="615" role="img" aria-labelledby="cdc-title cdc-desc">
  <title id="cdc-title">异步 FIFO：两套本地时钟与安全的状态交接</title>
  <desc id="cdc-desc">写域和读域各有独立时钟，不能假定存在共同采样边沿。写侧在本地 E 的 W 上升沿观察本地 valid_W 与 ready_W，两者均为一才把完整数据字写入异步 FIFO 并推进写指针。读侧独立在 E 的 R 上升沿观察本地 valid_R 与 ready_R，两者均为一才交付并取走完整数据字，推进读指针。FIFO 的存储体保持数据字；常见实现以 Gray 编码的写指针通过读域同步器交给读侧，与本地读指针生成 empty；反向用 Gray 编码的读指针经写域同步器交给写侧，与本地写指针生成 full。读输出有效还须满足本地数据读出约定。同步延迟使本地空满判断可能滞后于对侧操作：实际已经写入时读侧仍可能暂报空，实际已经读出时写侧仍可能暂报满。此图是抽象结构，不把 ready 和 valid 直接跨域连接，也不将普通多位 payload 逐位独立同步；指针同步、存储、复位及时序约束必须按验证过的具体设计实现。</desc>
  <defs>
    <marker id="cdc-data-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#376a55"/></marker>
    <marker id="cdc-state-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8a6c3c"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.symbol{font-size:20px;font-weight:700}.note{font-size:16px;fill:#4f695a}.small{font-size:15px;fill:#4f695a}.ctrl{font-size:16px;fill:#765a2f;font-weight:600}
      .port{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.6}.storage{fill:#edf1df;stroke:#82a18e;stroke-width:1.6}.sync{fill:#e6dcc4;stroke:#bda57a;stroke-width:1.5}
      .clock{stroke:#376a55;stroke-width:2.2;fill:none;stroke-linejoin:round}.data{stroke:#376a55;stroke-width:2.5;fill:none;marker-end:url(#cdc-data-arrow)}.control{stroke:#8a6c3c;stroke-width:2;stroke-dasharray:5 3;fill:none;marker-end:url(#cdc-state-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="613" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="head" x="23" y="33">异步 FIFO：各时钟域只在自己的边沿交接</text>
  <text class="note" x="23" y="58">独立时钟的示意波形；不假设相同频率或共同采样沿。</text>
  <rect x="18" y="73" width="334" height="72" rx="8" fill="#f9faf5" stroke="#c4d0c4"/>
  <rect x="368" y="73" width="334" height="72" rx="8" fill="#f9faf5" stroke="#c4d0c4"/>
  <text class="symbol" x="29" y="100">写域 CLK_W</text><text class="symbol" x="379" y="100">读域 CLK_R</text>
  <path class="clock" d="M29 129H65V111H110V129H155V111H200V129H245V111H290V129H339"/>
  <path class="clock" d="M379 129H430V111H497V129H568V111H635V129H689"/>
  <g class="note" text-anchor="middle"><text x="245" y="108">Eᵂ</text><text x="568" y="108">Eᴿ</text></g>
  <text class="head" x="23" y="174">1. 数据字存入 FIFO，而不是逐位独立跨域同步</text>
  <rect class="port" x="18" y="192" width="216" height="124" rx="9"/>
  <rect class="storage" x="262" y="192" width="196" height="124" rx="9"/>
  <rect class="port" x="486" y="192" width="216" height="124" rx="9"/>
  <g text-anchor="middle">
    <text class="symbol" x="126" y="220">源端 / FIFO 写口</text>
    <text class="small" x="126" y="247">本地 valid_W、ready_W</text>
    <text x="126" y="272">Eᵂ：二者同时为 1</text>
    <text class="note" x="126" y="298">写入整字，推进 W 指针</text>
    <text class="symbol" x="360" y="220">数据存储体</text>
    <rect x="280" y="235" width="47" height="34" rx="5" fill="#e0ebe3" stroke="#82a18e"/><text x="303.5" y="258">字 0</text>
    <rect x="335" y="235" width="47" height="34" rx="5" fill="#e0ebe3" stroke="#82a18e"/><text x="358.5" y="258">字 1</text>
    <rect x="390" y="235" width="50" height="34" rx="5" fill="#f9faf5" stroke="#82a18e"/><text x="415" y="258">⋯</text>
    <text class="note" x="360" y="298">支持安全的两域访问</text>
    <text class="symbol" x="594" y="220">FIFO 读口 / 目的端</text>
    <text class="small" x="594" y="247">本地 valid_R、ready_R</text>
    <text x="594" y="272">Eᴿ：二者同时为 1</text>
    <text class="note" x="594" y="298">交付整字，推进 R 指针</text>
  </g>
  <path class="data" d="M234 254H258"/><path class="data" d="M458 254H482"/>
  <text class="head" x="23" y="350">2. 通过同步器跨域传递指针状态</text>
  <!-- Opposite pointer directions are separated into rows, so no crossing is implied. -->
  <rect class="port" x="18" y="363" width="196" height="59" rx="8"/>
  <rect class="sync" x="262" y="363" width="196" height="59" rx="8"/>
  <rect class="port" x="506" y="363" width="196" height="59" rx="8"/>
  <g text-anchor="middle">
    <text class="symbol" x="116" y="386">写指针 W</text><text class="ctrl" x="116" y="407">Gray 编码</text>
    <text class="symbol" x="360" y="386">读域同步器</text><text class="note" x="360" y="407">由读时钟采样</text>
    <text class="symbol" x="604" y="386">读侧 empty</text><text class="small" x="604" y="407">本地 R 与同步的 W</text>
  </g>
  <path class="control" d="M214 392H258"/><path class="control" d="M458 392H502"/>
  <rect class="port" x="18" y="433" width="196" height="59" rx="8"/>
  <rect class="sync" x="262" y="433" width="196" height="59" rx="8"/>
  <rect class="port" x="506" y="433" width="196" height="59" rx="8"/>
  <g text-anchor="middle">
    <text class="symbol" x="604" y="456">读指针 R</text><text class="ctrl" x="604" y="477">Gray 编码</text>
    <text class="symbol" x="360" y="456">写域同步器</text><text class="note" x="360" y="477">由写时钟采样</text>
    <text class="symbol" x="116" y="456">写侧 full</text><text class="small" x="116" y="477">本地 W 与同步的 R</text>
  </g>
  <path class="control" d="M506 462H462"/><path class="control" d="M262 462H218"/>
  <rect x="18" y="505" width="684" height="70" rx="8" fill="#e9edde" stroke="#ced9c7"/>
  <text class="note" x="29" y="528">写侧根据本地 full 决定能否接收，读侧根据本地 empty 和数据就绪决定输出。</text>
  <text class="note" x="29" y="550">对侧操作的可见性因同步而滞后：写侧可能暂报满，读侧可能暂报空。</text>
  <text class="small" x="29" y="570">本地接口各自握手；没有直接跨域的 ready/valid 连线。</text>
  <text class="small" x="23" y="590">教学抽象：采用常见 Gray 指针机制，具体 CDC 电路、存储读模式、复位与约束省略。</text>
  <text class="small" x="23" y="608">绿色为数据，棕色虚线为经同步传递的状态，不表示实际传递拍数。</text>
</svg>
