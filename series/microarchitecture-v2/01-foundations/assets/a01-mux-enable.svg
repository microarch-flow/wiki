<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 276" width="600" height="276" role="img" aria-labelledby="title desc">
  <title id="title">四位寄存器的写入使能</title>
  <desc id="desc">U 与旧 Q 分别进入四位多路选择器的 1 和 0 输入端，EN 决定 D 的来源。寄存器在时钟上升沿采样 D。EN 为 0 时反馈旧值，EN 为 1 时写入新值。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#376650"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .heading{font-size:23px;font-weight:700}.small{font-size:17px}
      .block{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.6}.wire{fill:none;stroke:#376650;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .control{fill:none;stroke:#9b6c27;stroke-width:2.2;stroke-dasharray:6 4}.accent{fill:#8a5d1c}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="274" rx="13" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="20" y="34" class="heading">选择新数据，还是保留原数据？</text>
  <rect x="175" y="82" width="95" height="102" rx="10" class="block"/>
  <text x="223" y="129" text-anchor="middle">MUX</text><text x="223" y="151" text-anchor="middle" class="small">4 位</text>
  <text x="185" y="102" class="small">1</text><text x="185" y="173" class="small">0</text>
  <rect x="345" y="94" width="131" height="78" rx="8" class="block"/>
  <text x="410" y="124" text-anchor="middle">寄存器 X</text><text x="410" y="149" text-anchor="middle" class="small">4 位</text>
  <text x="24" y="94">新值 U</text>
  <path class="wire" d="M99 101H175" marker-end="url(#arrow)"/>
  <path class="wire" d="M270 133H345" marker-end="url(#arrow)"/>
  <text x="307" y="119" text-anchor="middle" class="small">D</text>
  <path class="wire" d="M476 133H577" marker-end="url(#arrow)"/>
  <text x="552" y="119" text-anchor="middle" class="small">Q</text>
  <circle cx="518" cy="133" r="4" fill="#376650"/>
  <path class="wire" d="M518 133V211H112V164H175" marker-end="url(#arrow)"/>
  <text x="308" y="232" text-anchor="middle" class="small">旧值反馈</text>
  <text x="223" y="60" text-anchor="middle" class="small accent">EN</text><path d="M223 65V82" class="control"/>
  <path d="M410 172V195" stroke="#718079" stroke-width="2.2"/>
  <path d="M403 172L410 163L417 172" fill="none" stroke="#718079" stroke-width="1.5"/>
  <text x="424" y="193" class="small">CLK</text>
  <rect x="18" y="242" width="564" height="25" rx="5" fill="#edf1df"/>
  <text x="300" y="261" text-anchor="middle" class="small">EN=1：写入 U　　EN=0：保持旧 Q</text>
</svg>
