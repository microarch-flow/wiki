<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 462" width="744" height="462" role="img" aria-labelledby="schedule-title schedule-desc">
<title id="schedule-title">同一个时钟下，串行执行与流水执行三个乘法任务的比较</title>
<desc id="schedule-desc">任务 J0 计算 2 乘 3 写 R5 等于 6，J1 计算 1 乘 5 写 R6 等于 5，J2 计算 3 乘 2 写 R7 等于 6。在串行模型中，三个任务分别在 E0、E4、E8 被接收，分别在 E3、E7、E11 写回；每个任务依次经过三个相邻周期的 READ、MUL、WB 阶段。在流水模型中，三个任务分别在 E0、E1、E2 被接收，分别在 E3、E4、E5 写回；READ、MUL、WB 阶段可重叠执行不同任务。图中每格为相邻两个上升沿间的一个周期，两图使用同一时钟周期；色块左端表示所在阶段的起始边沿，写阶段右侧圆点表示结果写回边沿。</desc>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
.head{font-size:22px;font-weight:700}.strong{font-size:19px;font-weight:700}.note{font-size:16px;fill:#4f695a}.cell{font-size:20px;font-weight:700}
.edge{stroke:#c4d0c4;stroke-width:1.3;stroke-dasharray:4 4}
</style>
<rect x="1" y="1" width="742" height="460" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
<text x="22" y="33" class="head">相同的三个任务，采用同一时钟周期</text>
<text x="22" y="59" class="note">J0：2 × 3 → R5 = 6；J1：1 × 5 → R6 = 5；J2：3 × 2 → R7 = 6</text>

<text x="22" y="90" class="strong">1. 串行执行</text>
<text x="408" y="90" class="note">接受 E0、E4、E8；写回 E3、E7、E11</text>
<text x="102" y="115" class="note" text-anchor="middle">E0</text>
<path class="edge" d="M102 120V242"/>
<text x="158" y="115" class="note" text-anchor="middle">E1</text>
