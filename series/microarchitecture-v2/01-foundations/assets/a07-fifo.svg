  <text class="note amber" x="20" y="521">E₂：FIFO 满且无法出队，J₂ 未入队；上游保持 J₂ 与 VALID。</text>
  <text class="note" x="20" y="541">E₃：旧队头 J₀ 被接收，同一沿 J₂ 进入队尾；占用仍为 2。</text>
