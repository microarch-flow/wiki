<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 549" width="750" height="549" role="img" aria-labelledby="fifo-title fifo-desc">
  <title id="fifo-title">两项 FIFO 的入队、出队与满时同时读写</title>
  <desc id="fifo-desc">示意容量为二的同步 FIFO，初始化为空，无空队列旁路，输出是沿前已存的队头。沿前占用数量为 n，输出有效当且仅当 n 大于零，pop 是输出有效与下游 ready 同时为一；输入 ready 当且仅当 n 小于二或者 pop 为一；push 是输入有效与输入 ready 同时为一。沿后占用等于 n 加 push 减 pop。E0 下游不就绪，接收 J0；E1 接收 J1，队列满；E2 输入 J2 被反压并保持，下游仍不就绪；E3 下游就绪，同一沿弹出旧队头 J0 并在队尾写入 J2，沿后队列 J1、J2；E4 弹出 J1 并接受 J3，队列 J2、J3；E5 无新输入，弹出 J2，剩 J3；E6 无新输入，弹出 J3，队列为空。表中已有数据按队头到队尾排列，所有接收与出队均发生在指定的上升沿。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:17px}
      .heading{font-size:22px;font-weight:700}.note{font-size:15px;fill:#4f695a}.label{font-size:15px;font-weight:600}.job{font-size:18px;font-weight:700}.rule{font-size:16px;font-weight:600}.value{font-size:17px;font-weight:700}.amber{fill:#765a2f}
      .grid{fill:none;stroke:#c8d4c9;stroke-width:1}.edge{stroke:#849c8c;stroke-width:1.2;stroke-dasharray:4 4;fill:none}.rulebox{fill:#edf1df;stroke:#c7d4c5;stroke-width:1.2}
    </style>
  </defs>
  <rect x="1" y="1" width="748" height="547" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="heading" x="20" y="34">两项 FIFO：满时也能同沿出队、入队</text>
  <text class="note" x="20" y="59">同步 FIFO：输出取已存队头，无空队列旁路；初始为空，n 为沿前占用。</text>
  <rect class="rulebox" x="20" y="70" width="710" height="70" rx="7"/>
  <text class="rule" x="33" y="93">输出有效 = (n &gt; 0)</text><text class="rule" x="340" y="93">pop = 输出有效 ∧ 下游 READY</text>
  <text class="rule" x="33" y="118">输入 READY = (n &lt; 2) ∨ pop</text><text class="rule" x="340" y="118">push = 输入有效 ∧ 输入 READY</text>
  <text class="note" x="20" y="164">沿后占用：n′ = n + push − pop；队列内从左到右为队头 → 队尾。</text>
