<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 546" width="660" height="546" role="img" aria-labelledby="fpadd-title fpadd-desc">
  <title id="fpadd-title">浮点加法的对阶、有效数相加和规格化</title>
  <desc id="fpadd-desc">示例 5 加 1。输入两数表示为二进制 1.01 乘以 2 的二次方、1.00 乘以 2 的零次方。将较小指数的一方有效数右移两位，表示为 0.01 乘以 2 的二次方，在本例不丢弃非零位，因此数值不变。有效数同阶相加得到 1.10 乘以 2 的二次方，即十进制 6，已规格化。其他例子 3 加 3 得 11.0 乘以 2 的一次方，右移有效数一位并使指数加 1，成为 1.10 乘以 2 的二次方；5 减 4 得 0.01 乘以 2 的二次方，左移有效数两位并使指数减 2，成为 1.0 乘以 2 的零次方。图示教学习题，不表示实际流水级或时延。</desc>
  <defs>
    <marker id="fpadd-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#376a55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:22px;font-weight:700}.note{font-size:16px;fill:#4f695a}.strong{font-size:19px;font-weight:700}
      .bits{font-family:"Noto Sans Mono CJK SC",monospace;font-size:24px;font-weight:700}
      .smallbits{font-family:"Noto Sans Mono CJK SC",monospace;font-size:20px;font-weight:700}
      .step{fill:#edf1df;stroke:#82a18e;stroke-width:1.4}
      .box{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}
      .chosen{fill:#f2e8d3;stroke:#b6a073;stroke-width:1.5}
      .emph{fill:#765a2f;font-weight:700}
      .wire{stroke:#376a55;stroke-width:2.4;fill:none;marker-end:url(#fpadd-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="658" height="544" rx="13" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="22" y="35" class="head">浮点加法：5 + 1</text>
  <rect x="22" y="50" width="290" height="48" rx="8" class="box"/>
  <rect x="348" y="50" width="290" height="48" rx="8" class="chosen"/>
  <text x="167" y="81" text-anchor="middle" class="bits">1.01₂ × 2²</text>
  <text x="493" y="81" text-anchor="middle" class="bits">1.00₂ × 2⁰</text>

  <path class="wire" d="M167 98V138"/>
  <path class="wire" d="M493 98V138"/>
  <text x="507" y="115" class="note emph">右移 2 位</text>
  <text x="507" y="133" class="note emph">指数 +2</text>
  <text x="22" y="127" class="strong">1. 指数对齐</text>
  <rect x="22" y="142" width="290" height="46" rx="8" class="box"/>
  <rect x="348" y="142" width="290" height="46" rx="8" class="chosen"/>
  <text x="167" y="172" text-anchor="middle" class="bits">1.01₂ × 2²</text>
  <text x="493" y="172" text-anchor="middle" class="bits">0.01₂ × 2²</text>
  <text x="22" y="212" class="note">同一指数，位权才一致；此例右移未丢失非零位，数值不变。</text>

  <rect x="22" y="227" width="616" height="126" rx="9" class="step"/>
  <text x="38" y="253" class="strong">2. 相同位权的有效数相加</text>
  <g class="bits" text-anchor="end"><text x="211" y="281">1.01₂</text><text x="211" y="307">0.01₂</text><text x="211" y="341">1.10₂</text></g>
  <text x="92" y="308" class="strong">+</text>
  <path d="M90 317H226" stroke="#82a18e" stroke-width="1.8"/>
  <text x="249" y="281">× 2²</text><text x="249" y="307">× 2²</text><text x="249" y="341" class="strong">× 2² = 6</text>
  <rect x="407" y="278" width="202" height="53" rx="7" class="box"/>
  <text x="508" y="299" text-anchor="middle" class="strong">有效数在 [1, 2)</text>
  <text x="508" y="320" text-anchor="middle" class="note">结果无需再次规格化</text>

  <text x="22" y="383" class="head">3. 如果有效数不在 [1, 2)？</text>
  <rect x="22" y="398" width="616" height="53" rx="8" class="box"/>
  <text x="36" y="420" class="strong">3 + 3：</text><text x="135" y="421" class="smallbits">11.0₂ × 2¹</text>
  <path class="wire" d="M275 423H343"/>
  <text x="361" y="421" class="smallbits">1.10₂ × 2²</text>
  <text x="135" y="442" class="note">有效数右移 1 位，指数 +1</text>
  <rect x="22" y="457" width="616" height="53" rx="8" class="box"/>
  <text x="36" y="479" class="strong">5 − 4：</text><text x="135" y="480" class="smallbits">0.01₂ × 2²</text>
  <path class="wire" d="M275 482H343"/>
  <text x="361" y="480" class="smallbits">1.0₂ × 2⁰</text>
  <text x="135" y="501" class="note">有效数左移 2 位，指数 −2</text>
  <text x="22" y="532" class="note">只画出所需的有效位；本例均可精确表示，不表示流水级或实际延迟。</text>
</svg>
