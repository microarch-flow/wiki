<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 576" width="500" height="576" role="img" aria-labelledby="streams-title streams-desc">
  <title id="streams-title">用 Stream 与 Event 表达依赖</title>
  <desc id="streams-desc">主机向三个逻辑流分别提交任务。按照本图的流顺序及事件语义，搬入流先搬入 A 得到 d_A，再记录 e_A，再搬入 B 得到 d_B，之后记录 e_B。e_B 达到完成状态可覆盖这个流中此前的两项搬入；计算流先等待 e_B，执行 C 即 vec_add，之后记录 e_C。写回流先等待 e_C，执行 W，将 d_Y 写回主机 Y，之后记录 e_Y。主机等待 e_Y 确认成功完成且主机结果可见后，才读取 Y=[5,5,6]。实线箭头表示同流的顺序和依赖，跨流虚线表示事件建立的等待依赖。流是逻辑执行序列，并不代表硬件引擎或物理队列的一一对应关系。</desc>
  <defs>
    <marker id="stream-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <marker id="stream-dep-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c7b42"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head{font-weight:700;font-size:23px}.subhead{font-size:20px;font-weight:700}.label{font-size:17px;fill:#416354}.small{font-size:16px;fill:#416354}.slot{font-size:18px;font-weight:600}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:19px;font-weight:600}
      .lane{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.task{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.event{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.wait{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#stream-arrow)}.dep{fill:none;stroke:#9c7b42;stroke-width:2;stroke-dasharray:5 3;marker-end:url(#stream-dep-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="574" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">让不同 Stream 等待正确的 Event</text>
  <text x="24" y="58" class="label">教学示例：按同流顺序及跨流事件依赖组织</text>

  <rect x="18" y="75" width="464" height="126" rx="10" class="lane"/>
  <text x="32" y="101" class="subhead">搬入 Stream</text>
  <g class="task"><rect x="32" y="118" width="96" height="42" rx="7"/><rect x="258" y="118" width="96" height="42" rx="7"/></g>
  <g class="event"><rect x="145" y="118" width="96" height="42" rx="7"/><rect x="371" y="118" width="96" height="42" rx="7"/></g>
  <g class="slot" text-anchor="middle"><text x="80" y="145">L_A</text><text x="193" y="145">记录 e_A</text><text x="306" y="145">L_B</text><text x="419" y="145">记录 e_B</text></g>
  <g><path d="M128 139H141" class="edge"/><path d="M241 139H254" class="edge"/><path d="M354 139H367" class="edge"/></g>
  <text x="250" y="186" class="small" text-anchor="middle">e_B 成功完成：此前两次搬入均已完成</text>

  <rect x="18" y="244" width="464" height="91" rx="10" class="lane"/>
  <text x="32" y="270" class="subhead">计算 Stream</text>
  <g><rect x="32" y="283" width="96" height="40" rx="7" class="wait"/><rect x="146" y="283" width="207" height="40" rx="7" class="task"/><rect x="371" y="283" width="96" height="40" rx="7" class="event"/></g>
  <g class="slot" text-anchor="middle"><text x="80" y="309">等 e_B</text><text x="249.5" y="309">C · vec_add</text><text x="419" y="309">记录 e_C</text></g>
  <path d="M128 303H142" class="edge"/><path d="M353 303H367" class="edge"/>

  <rect x="18" y="376" width="464" height="91" rx="10" class="lane"/>
  <text x="32" y="402" class="subhead">写回 Stream</text>
  <g><rect x="32" y="415" width="96" height="40" rx="7" class="wait"/><rect x="146" y="415" width="207" height="40" rx="7" class="task"/><rect x="371" y="415" width="96" height="40" rx="7" class="event"/></g>
  <g class="slot" text-anchor="middle"><text x="80" y="441">等 e_C</text><text x="249.5" y="441">W · 写回</text><text x="419" y="441">记录 e_Y</text></g>
  <path d="M128 435H142" class="edge"/><path d="M353 435H367" class="edge"/>

  <rect x="18" y="494" width="464" height="42" rx="8" class="wait"/>
  <text x="32" y="521" class="slot">Host 等待 e_Y 成功</text>
  <text x="466" y="521" class="code" text-anchor="end">读 Y=[5,5,6]</text>
  <path d="M419 160V167H474V219H24V303H29" class="dep"/>
  <path d="M419 323V339H474V352H24V435H29" class="dep"/>
  <path d="M419 455V481H80V491" class="dep"/>
  <text x="250" y="558" class="small" text-anchor="middle">同流顺序 / 虚线事件依赖；Stream 不是物理引擎</text>
</svg>
