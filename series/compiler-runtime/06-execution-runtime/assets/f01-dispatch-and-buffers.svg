<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 868" width="500" height="868" role="img" aria-labelledby="dispatch-title dispatch-desc">
  <title id="dispatch-title">一次内核启动的参数交接与设备数据访问</title>
  <desc id="dispatch-desc">任务 C 引用 vec_add 的入口 K，绑定 A、B、Y 的设备可访问地址 0x1000、0x2000、0x3000 及元素数 3，启动规模是一 Block 四逻辑线程。经驱动或底层提交接口交给执行环境，异步提交接口成功返回不表示结果已经可读。设备推进执行时，内核从 d_A 和 d_B 读取三个 int32 值，得到 5、5、6 并写入 d_Y。第四个逻辑线程不满足 i 小于 n 的条件，跳过。图中的结果是成功执行后的预期值，而非提交时结果。调用返回与设备执行之间没有图示中的固定时序。</desc>
  <defs>
    <marker id="dispatch-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:21px;font-weight:600}.code-small{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:18px;font-weight:500}.selected{font-weight:700;fill:#78591b}
      .task{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.device{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.cell{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.target{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}.kernel{fill:#d1e4d5;stroke:#6f9a80;stroke-width:1.5}.edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#dispatch-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="866" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">一次启动：参数与数据的区别</text>

  <rect x="18" y="52" width="464" height="201" rx="10" class="task"/>
  <text x="32" y="82" class="subhead">运行时组织任务 C</text>
  <text x="32" y="110" class="label">入口 K：</text>
  <text x="120" y="110" class="code-small">vec_add</text>
  <text x="32" y="137" class="small">绑定参数（地址与元素数）</text>
  <g class="cell">
    <rect x="35" y="147" width="208" height="31" rx="5"/><rect x="257" y="147" width="208" height="31" rx="5"/>
    <rect x="35" y="183" width="208" height="31" rx="5"/><rect x="257" y="183" width="208" height="31" rx="5"/>
  </g>
  <g class="code-small" text-anchor="middle">
    <text x="139" y="169">A = 0x1000</text><text x="361" y="169">B = 0x2000</text>
    <text x="139" y="205">Y = 0x3000</text><text x="361" y="205">n = 3</text>
  </g>
  <text x="250" y="240" class="label" text-anchor="middle">启动规模：1 Block × 4 逻辑线程</text>

  <path d="M250 253V290" class="edge"/>
  <text x="263" y="278" class="small">交接调用信息</text>
  <rect x="60" y="295" width="380" height="48" rx="8" class="kernel"/>
  <text x="250" y="326" class="subhead" text-anchor="middle">驱动 / 底层提交接口</text>

  <path d="M131 343V366" class="edge"/>
  <rect x="18" y="371" width="228" height="67" rx="8" class="target"/>
  <text x="132" y="397" class="subhead" text-anchor="middle">异步提交成功返回</text>
  <text x="132" y="422" class="small selected" text-anchor="middle">不表示结果已可读</text>
  <path d="M369 343V356H455V463" class="edge"/>
  <text x="369" y="385" class="label" text-anchor="middle">交给执行环境</text>
  <text x="250" y="457" class="small" text-anchor="middle">返回与设备推进无固定的先后时序</text>

  <rect x="18" y="468" width="464" height="365" rx="10" class="device"/>
  <text x="32" y="497" class="subhead">设备执行：访问 Buffer 中的数据</text>
  <text x="32" y="527" class="code-small">d_A · 0x1000</text>
  <text x="267" y="527" class="code-small">d_B · 0x2000</text>
  <g class="cell">
    <rect x="35" y="538" width="61" height="36" rx="5"/><rect x="101" y="538" width="61" height="36" rx="5"/><rect x="167" y="538" width="61" height="36" rx="5"/>
    <rect x="272" y="538" width="61" height="36" rx="5"/><rect x="338" y="538" width="61" height="36" rx="5"/><rect x="404" y="538" width="61" height="36" rx="5"/>
  </g>
  <g class="code" text-anchor="middle">
    <text x="65.5" y="563">2</text><text x="131.5" y="563">1</text><text x="197.5" y="563">4</text>
    <text x="302.5" y="563">3</text><text x="368.5" y="563">4</text><text x="434.5" y="563">2</text>
  </g>
  <path d="M132 574V600H198V618" class="edge"/>
  <path d="M369 574V600H302V618" class="edge"/>
  <text x="250" y="598" class="small" text-anchor="middle">读取</text>
  <rect x="45" y="623" width="410" height="88" rx="9" class="kernel"/>
  <text x="250" y="650" class="subhead" text-anchor="middle">执行 vec_add</text>
  <text x="250" y="676" class="code-small" text-anchor="middle">Y[i] = A[i] + B[i]</text>
  <text x="250" y="701" class="small" text-anchor="middle">i = 0、1、2 执行；i = 3 跳过</text>
  <path d="M250 711V744" class="edge"/>
  <text x="265" y="735" class="small">写入</text>

  <text x="32" y="775" class="code-small">d_Y · 0x3000</text>
  <g class="target">
    <rect x="237" y="750" width="68" height="38" rx="6"/><rect x="311" y="750" width="68" height="38" rx="6"/><rect x="385" y="750" width="68" height="38" rx="6"/>
  </g>
  <g class="code selected" text-anchor="middle"><text x="271" y="776">5</text><text x="345" y="776">5</text><text x="419" y="776">6</text></g>
  <text x="250" y="815" class="label" text-anchor="middle">内核成功执行后的预期状态</text>
  <text x="250" y="855" class="small" text-anchor="middle">所有地址均为教学构造的设备可访问地址</text>
</svg>
