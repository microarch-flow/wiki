<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 711" width="500" height="711" role="img" aria-labelledby="context-title context-desc">
  <title id="context-title">从目标产物到执行上下文内的引用</title>
  <desc id="context-desc">兼容的目标产物含可执行代码及元数据。模块加载在执行上下文中建立模块 M，应用通过模块取得 vec_add 的入口句柄 K。上下文还关联驱动提供的设备、提交接口和 Buffer 引用。任务 C 引用 K，绑定本次参数。实际的设备执行及存储资源由驱动和设备接口管理，软件引用不代表物理存储位置。</desc>
  <defs>
    <marker id="ctx-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:20px;font-weight:600}
      .artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.module{fill:#f5f6ef;stroke:#9ab69e;stroke-width:1.4}.entry{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.task{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}.resources{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#ctx-arrow)}.ref{fill:none;stroke:#527d64;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#ctx-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="709" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">从目标产物取得一次调用的入口</text>

  <rect x="18" y="54" width="464" height="91" rx="10" class="artifact"/>
  <text x="32" y="83" class="subhead">兼容的目标产物</text>
  <rect x="35" y="98" width="208" height="32" rx="5" class="entry"/>
  <rect x="257" y="98" width="208" height="32" rx="5" class="entry"/>
  <text x="139" y="120" class="label" text-anchor="middle">可执行代码</text>
  <text x="361" y="120" class="label" text-anchor="middle">相关元数据</text>

  <path d="M250 145V187" class="edge"/>
  <text x="263" y="173" class="label">模块加载</text>

  <rect x="18" y="192" width="464" height="352" rx="10" class="context"/>
  <text x="32" y="221" class="subhead">执行上下文（软件状态）</text>
  <rect x="35" y="235" width="430" height="95" rx="8" class="module"/>
  <text x="48" y="263" class="subhead">已加载模块 M</text>
  <rect x="48" y="277" width="211" height="39" rx="6" class="entry"/>
  <text x="154" y="302" class="code" text-anchor="middle">K: vec_add</text>
  <rect x="270" y="277" width="181" height="39" rx="6" class="entry"/>
  <text x="360" y="302" class="label" text-anchor="middle">另一内核入口</text>

  <path d="M154 365V322" class="ref"/>
  <text x="165" y="346" class="small">引用入口 K（句柄）</text>

  <rect x="35" y="365" width="430" height="69" rx="8" class="task"/>
  <text x="48" y="392" class="subhead">任务 C：一次调用</text>
  <text x="48" y="418" class="label">引用 K，绑定本次参数与执行规模</text>

  <rect x="35" y="449" width="430" height="79" rx="8" class="module"/>
  <text x="48" y="475" class="subhead">关联的设备资源引用</text>
  <rect x="48" y="488" width="208" height="30" rx="5" class="entry"/>
  <rect x="268" y="488" width="183" height="30" rx="5" class="entry"/>
  <text x="152" y="509" class="small" text-anchor="middle">设备与提交接口</text>
  <text x="360" y="509" class="small" text-anchor="middle">Buffer 引用</text>

  <path d="M152 518V590" class="ref"/>
  <path d="M360 518V590" class="ref"/>
  <text x="250" y="578" class="small" text-anchor="middle">关联 / 引用</text>

  <rect x="18" y="595" width="464" height="82" rx="10" class="resources"/>
  <text x="32" y="621" class="subhead">驱动与设备环境</text>
  <text x="32" y="648" class="label">执行资源、提交机制与设备可访问存储</text>
  <text x="32" y="668" class="small">实际代码及数据位置取决于实现</text>
  <text x="250" y="700" class="small" text-anchor="middle">软件句柄和 Buffer 引用不等于物理位置</text>
</svg>
