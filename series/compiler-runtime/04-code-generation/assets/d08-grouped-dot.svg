<svg xmlns="http://www.w3.org/2000/svg" width="440" height="631" viewBox="0 0 440 631" role="img" aria-labelledby="title desc">
  <title id="title">不同 Scale 的部分和必须按各组还原</title>
  <desc id="desc">观测 X 首行与 W 第0列点积：整数码 X 为2、1、3、4，s_x 为0.5；W 码为3、5、2、1，每组两项，尺度0.25和0.5。两组整数点积为11和10，分别乘0.125和0.25得到1.375和2.5，合并为3.875。若采用 W4A16，先解包权重并按组还原为0.75、1.25、1、0.5，FP16 激活实际值为1、0.5、1.5、2，按目标FP32累加，教学数值同为3.875。两条路径是可选实现，不是同一内核的顺序阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="#476957"/></marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.25}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .target-text {fill:#78591b;font-weight:700}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="629" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="18" y="30" class="head">同一个点积，两种执行路径</text>
  <text x="18" y="54" class="note">X 第0行 × W 第0列；零点均为 0</text>
  <rect x="13" y="67" width="414" height="337" rx="9" class="panel"/>
  <text x="25" y="94" class="label">整数点积（例如同码的 W8A8）</text>
  <text x="25" y="118" class="note">X 编码 [2,1,3,4]，sₓ = 0.5</text>
  <g text-anchor="middle">
    <rect x="25" y="131" width="190" height="105" rx="7" class="cell"/><rect x="225" y="131" width="190" height="105" rx="7" class="target"/>
    <text x="120" y="154" class="label">第0组 · s_w = 0.25</text>
    <text x="320" y="154" class="label target-text">第1组 · s_w = 0.5</text>
    <text x="120" y="180" class="code">X [2,1]</text><text x="320" y="180" class="code">X [3,4]</text>
    <text x="120" y="203" class="code">W [3,5]</text><text x="320" y="203" class="code">W [2,1]</text>
    <text x="120" y="227" class="code">2×3+1×5=11</text><text x="320" y="227" class="code">3×2+4×1=10</text>
    <path d="M120 237V255" class="wire"/><path d="M320 237V255" class="wire"/>
    <rect x="25" y="259" width="190" height="60" rx="7" class="cell"/><rect x="225" y="259" width="190" height="60" rx="7" class="target"/>
    <text x="120" y="281" class="code">11×0.5×0.25</text><text x="320" y="281" class="code">10×0.5×0.5</text>
    <text x="120" y="307" class="label">1.375</text><text x="320" y="307" class="label target-text">2.5</text>
    <path d="M120 319V335H220V348" class="wire"/><path d="M320 319V335H220" fill="none" stroke="#476957" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="64" y="352" width="312" height="35" rx="6" class="target"/>
    <text x="220" y="375" class="code target-text">1.375 + 2.5 = 3.875</text>
  </g>

  <rect x="13" y="417" width="414" height="201" rx="9" class="panel"/>
  <text x="25" y="444" class="label">W4A16：也可在片上解码权重</text>
  <text x="25" y="470" class="note">FP16 X 实值：</text>
  <text x="415" y="470" class="code" text-anchor="end">[1,0.5,1.5,2]</text>
  <text x="25" y="495" class="note">W 解包 × 组尺度 → FP16：</text>
  <text x="415" y="519" class="code" text-anchor="end">[0.75,1.25,1,0.5]</text>
  <path d="M220 525V541" class="wire"/>
  <rect x="25" y="545" width="390" height="58" rx="7" class="target"/>
  <text x="220" y="568" class="note" text-anchor="middle">FP32 累加（本例）</text>
  <text x="220" y="591" class="code target-text" text-anchor="middle">0.75+0.625+1.5+1=3.875</text>
</svg>
