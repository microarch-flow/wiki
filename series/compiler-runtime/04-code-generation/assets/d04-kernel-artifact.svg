<svg xmlns="http://www.w3.org/2000/svg" width="440" height="493" viewBox="0 0 440 493" role="img" aria-labelledby="title desc">
  <title id="title">Kernel 产物与一次任务的参数</title>
  <desc id="desc">教学设备使用64位地址。生成产物包含兼容的目标代码、vec_add 入口及参数 ABI；A B Y 分别是偏移0、8、16处的64位设备地址，n 是偏移24处的 int32。每次调用的值为 0x1000、0x2000、0x3000 和 3，执行规模是 1 个线程块、4 个线程。这些实际调用参数及执行规模不是代码中的固定值。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px}
      .small {font-size:16px}
      .code-sm {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:15px}
      .target-text {fill:#78591b;font-weight:700}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.3}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .grid {stroke:#cbd6cb;stroke-width:1;fill:none}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}

    </style>
  </defs>
  <rect x="1" y="1" width="438" height="491" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
$  <text x="18" y="30" class="head" text-anchor="start">哪些信息随内核产物交付？</text>
  <text x="18" y="55" class="note" text-anchor="start">64 位地址的教学 ABI，不代表某一真实 GPU。</text>
  <rect x="12" y="70" width="416" height="215" rx="7" class="panel"/>
  <text x="24" y="96" class="head" text-anchor="start">静态产物（可复用）</text>
  <rect x="24" y="107" width="192" height="31" rx="7" class="cell"/>
  <text x="120" y="128" class="small" text-anchor="middle">兼容目标代码</text>
  <rect x="224" y="107" width="192" height="31" rx="7" class="cell"/>
  <text x="320" y="128" class="small" text-anchor="middle">入口 vec_add</text>
  <text x="24" y="163" class="label" text-anchor="start">参数 ABI</text>
  <text x="24" y="187" class="note" text-anchor="start">参数</text>
  <text x="179" y="187" class="note" text-anchor="middle">字节偏移</text>
  <text x="327" y="187" class="note" text-anchor="middle">类型 / 字节数</text>
  <path d="M24 195H416" class="grid"/>
  <text x="24" y="215" class="code-sm" text-anchor="start">A / B / Y</text>
  <text x="179" y="215" class="code-sm" text-anchor="middle">0 / 8 / 16</text>
  <text x="327" y="215" class="small" text-anchor="middle">设备地址 / 各 8 B</text>
  <text x="24" y="241" class="code-sm" text-anchor="start">n</text>
  <text x="179" y="241" class="code-sm" text-anchor="middle">24</text>
  <text x="327" y="241" class="small" text-anchor="middle">int32 / 4 B</text>
  <text x="24" y="270" class="note" text-anchor="start">实际地址、n 和启动规模留待调用时确定。</text>
  <path d="M220 287V311" class="wire"/>
  <rect x="12" y="315" width="416" height="163" rx="7" class="target"/>
  <text x="24" y="342" class="head" text-anchor="start">一次调用（本次实际绑定）</text>
  <text x="24" y="371" class="code" text-anchor="start">A</text>
  <text x="95" y="371" class="code-sm" text-anchor="start">0x1000</text>
  <text x="238" y="371" class="code" text-anchor="start">B</text>
  <text x="305" y="371" class="code-sm" text-anchor="start">0x2000</text>
  <text x="24" y="398" class="code" text-anchor="start">Y</text>
  <text x="95" y="398" class="code-sm" text-anchor="start">0x3000</text>
  <text x="238" y="398" class="code" text-anchor="start">n</text>
  <text x="305" y="398" class="code" text-anchor="start">3</text>
  <path d="M24 408H416" class="grid"/>
  <text x="24" y="433" class="small" text-anchor="start">启动规模：1 个线程块，每块 4 个线程</text>
  <text x="24" y="459" class="note" text-anchor="start">调用数据和执行规模不固定在目标代码中。</text>
</svg>
