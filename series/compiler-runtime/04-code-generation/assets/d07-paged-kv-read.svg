<svg xmlns="http://www.w3.org/2000/svg" width="440" height="543" viewBox="0 0 440 543" role="img" aria-labelledby="title desc">
  <title id="title">Attention 内核按块表读取跨页的 KV Tile</title>
  <desc id="desc">软件缓存块每块可容纳两个位置，有效序列长度为5，逻辑位置为0至4。逻辑块0映射池块5，逻辑块1映射池块2，逻辑块2映射池块9。计算 tile 处理逻辑位置1、2、3，跨过前两个软件缓存块。位置1对应池块5偏移1，位置2对应池块2偏移0，位置3对应池块2偏移1。虽然池块9拥有两个槽，但逻辑位置5无效，不得读取。池块排列只表示逻辑块表的映射次序，不代表物理地址连续。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="#476957"/></marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .small {font-size:15px;fill:#416354}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.25}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .target-text {fill:#78591b;font-weight:700}
      .tail {fill:#e0e2df;stroke:#9a9f98;stroke-width:1.2;stroke-dasharray:3 2}
      .tail-text {fill:#636b64;font-weight:700}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bracket {fill:none;stroke:#aa9163;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="541" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="18" y="30" class="head">按块表读取一个跨页 Tile</text>
  <text x="18" y="54" class="note">页大小＝2 个位置；有效长度＝5</text>

  <rect x="13" y="68" width="414" height="296" rx="9" class="panel"/>
  <text x="25" y="94" class="label">逻辑位置（按顺序）</text>
  <path d="M90 121V110H282V121" class="bracket"/>
  <text x="415" y="94" class="small target-text" text-anchor="end">计算 Tile：j=1…3</text>
  <g text-anchor="middle">
    <rect x="25" y="125" width="59" height="37" rx="4" class="cell"/><text x="54.5" y="149" class="label">0</text>
    <rect x="90" y="125" width="59" height="37" rx="4" class="target"/><text x="119.5" y="149" class="label target-text">1</text>
    <rect x="158" y="125" width="59" height="37" rx="4" class="target"/><text x="187.5" y="149" class="label target-text">2</text>
    <rect x="223" y="125" width="59" height="37" rx="4" class="target"/><text x="252.5" y="149" class="label target-text">3</text>
    <rect x="291" y="125" width="59" height="37" rx="4" class="cell"/><text x="320.5" y="149" class="label">4</text>
    <rect x="356" y="125" width="59" height="37" rx="4" class="tail"/><text x="385.5" y="149" class="label tail-text">5*</text>
  </g>
  <rect x="25" y="174" width="124" height="36" rx="5" class="node"/><rect x="158" y="174" width="124" height="36" rx="5" class="node"/><rect x="291" y="174" width="124" height="36" rx="5" class="node"/>
  <text x="87" y="198" class="label" text-anchor="middle">逻辑块 0</text><text x="220" y="198" class="label" text-anchor="middle">逻辑块 1</text><text x="353" y="198" class="label" text-anchor="middle">逻辑块 2</text>
  <path d="M87 210V258" class="wire"/><path d="M220 210V258" class="wire"/><path d="M353 210V258" class="wire"/>
  <rect x="25" y="262" width="124" height="68" rx="5" class="node"/>
  <rect x="158" y="262" width="124" height="68" rx="5" class="node"/>
  <rect x="291" y="262" width="124" height="68" rx="5" class="node"/>
  <g text-anchor="middle">
    <text x="87" y="285" class="label">池块 5</text><text x="220" y="285" class="label">池块 2</text><text x="353" y="285" class="label">池块 9</text>
    <rect x="30" y="295" width="54" height="29" rx="3" class="cell"/><rect x="90" y="295" width="54" height="29" rx="3" class="target"/>
    <rect x="163" y="295" width="54" height="29" rx="3" class="target"/><rect x="223" y="295" width="54" height="29" rx="3" class="target"/>
    <rect x="296" y="295" width="54" height="29" rx="3" class="cell"/><rect x="356" y="295" width="54" height="29" rx="3" class="tail"/>
    <text x="57" y="315" class="small">偏移 0</text><text x="117" y="315" class="small target-text">偏移 1</text>
    <text x="190" y="315" class="small target-text">偏移 0</text><text x="250" y="315" class="small target-text">偏移 1</text>
    <text x="323" y="315" class="small">偏移 0</text><text x="383" y="315" class="small tail-text">偏移 1</text>
  </g>
  <text x="25" y="349" class="small">块表 [5, 2, 9]；池块地址不必相邻。</text>

  <path d="M220 365V383" class="wire"/>
  <rect x="13" y="387" width="414" height="100" rx="9" class="target"/>
  <text x="25" y="411" class="label target-text">读取 K/V：按 Tile 中的 j 查找</text>
  <g text-anchor="middle">
    <text x="87" y="440" class="label">j=1</text><text x="220" y="440" class="label">j=2</text><text x="353" y="440" class="label">j=3</text>
    <text x="87" y="467" class="note target-text">池块5 / 偏移1</text><text x="220" y="467" class="note target-text">池块2 / 偏移0</text><text x="353" y="467" class="note target-text">池块2 / 偏移1</text>
  </g>
  <text x="18" y="510" class="note">* j=5 超过有效长度，不得读取。</text>
  <text x="18" y="532" class="note">软件页大小与计算 Tile 大小可以不同。</text>
</svg>
