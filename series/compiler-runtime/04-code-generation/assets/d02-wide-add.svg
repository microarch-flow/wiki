<svg xmlns="http://www.w3.org/2000/svg" width="440" height="556" viewBox="0 0 440 556" role="img" aria-labelledby="title desc">
  <title id="title">在 RV32 上拆分并计算 64 位加法</title>
  <desc id="desc">把两个 64 位操作数 0x00000000_FFFFFFFF 和 0x00000000_00000001 各拆成高低 32 位。低位 ADD 得到 00000000，SLTU 按无符号整数比较低位和与原低位 aL，因 00000000 小于 FFFFFFFF，得到进位 1。高位 ADD 两个高半部并加进位，得到 00000001。由两个 32 位结果组成 64 位结果 0x00000001_00000000。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:18px}
      .code-sm {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:16px}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.3}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.6}
      .target-text {fill:#78591b;font-weight:700}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="554" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <rect x="13" y="13" width="414" height="176" rx="9" class="panel"/>
  <text x="25" y="41" class="head">① 拆成两组 32 位值</text>
  <text x="25" y="64" class="note">每格 8 个十六进制数字，即 32 位</text>
  <text x="156" y="88" class="note" text-anchor="middle">高 32 位</text>
  <text x="321" y="88" class="note" text-anchor="middle">低 32 位</text>
  <text x="29" y="120" class="code">A</text>
  <text x="29" y="158" class="code">B</text>
  <rect x="79" y="97" width="154" height="31" rx="6" class="cell"/>
  <rect x="244" y="97" width="154" height="31" rx="6" class="target"/>
  <rect x="79" y="135" width="154" height="31" rx="6" class="cell"/>
  <rect x="244" y="135" width="154" height="31" rx="6" class="target"/>
  <text x="156" y="119" class="code" text-anchor="middle">00000000</text>
  <text x="321" y="119" class="code target-text" text-anchor="middle">FFFFFFFF</text>
  <text x="156" y="157" class="code" text-anchor="middle">00000000</text>
  <text x="321" y="157" class="code target-text" text-anchor="middle">00000001</text>
  <text x="25" y="180" class="note">每个 64 位值各用两个 32 位寄存器。</text>
  <path d="M321 192V214" class="wire"/>
  <rect x="13" y="217" width="414" height="161" rx="9" class="panel"/>
  <text x="25" y="245" class="head">② 低位加法与进位</text>
  <text x="25" y="268" class="code-sm">lo = ADD(aL,bL)</text>
  <rect x="25" y="280" width="390" height="30" rx="6" class="target"/>
  <text x="220" y="301" class="code-sm target-text" text-anchor="middle">FFFFFFFF + 00000001 → 00000000</text>
  <text x="25" y="332" class="code-sm">carry = SLTU(lo,aL)</text>
  <text x="25" y="355" class="note">无符号比较：</text>
  <text x="162" y="355" class="code-sm">00000000 &lt; FFFFFFFF</text>
  <path d="M220 381V400" class="wire"/>
  <rect x="237" y="381" width="126" height="25" rx="5" class="target"/>
  <text x="300" y="399" text-anchor="middle" class="code-sm target-text">carry = 1</text>
  <rect x="13" y="410" width="414" height="132" rx="9" class="panel"/>
  <text x="25" y="437" class="head">③ 高位加法加入进位</text>
  <text x="25" y="461" class="code-sm">h = ADD(aH,bH); hi = ADD(h,carry)</text>
  <text x="25" y="484" class="code-sm">00000000 + 00000000 + 1</text>
  <text x="31" y="520" class="note">结果</text>
  <rect x="79" y="497" width="154" height="31" rx="6" class="cell"/>
  <rect x="244" y="497" width="154" height="31" rx="6" class="target"/>
  <text x="156" y="519" class="code" text-anchor="middle">00000001</text>
  <text x="321" y="519" class="code target-text" text-anchor="middle">00000000</text>
</svg>
