<svg xmlns="http://www.w3.org/2000/svg" width="440" height="588" viewBox="0 0 440 588" role="img" aria-labelledby="title desc">
  <title id="title">重定位如何补上跳转目标</title>
  <desc id="desc">RV32I 无链接松弛示例：目标文件 .text 偏移 0、4、8、12 是 add、mv、auipc t1,0、jalr x0,0(t1)，偏移 8 有 R_RISCV_CALL_PLT 重定位。布局后 evaluate 在 0x1000，AUIPC 位于 P=0x1008，__mulsi3 位于 S=0x1120。差值 0x118，AUIPC 高位为 0，JALR 低位为 0x118，JALR 指令字从 00030067 变为 11830067。AUIPC 使用自己的 PC 0x1008，JALR 在 0x100c 执行时使用 t1 和立即数，不直接使用 JALR 的 PC。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px}
      .small {font-size:16px}
      .code-sm {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:15px}
      .target-text {fill:#78591b;font-weight:700}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.3}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .grid {stroke:#cbd6cb;stroke-width:1;fill:none}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}

    </style>
  </defs>
  <rect x="1" y="1" width="438" height="586" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
$  <text x="18" y="30" class="head" text-anchor="start">谁来补上尚未确定的跳转目标？</text>
  <text x="18" y="55" class="note" text-anchor="start">RV32I 示例：不启用链接松弛。</text>
  <rect x="12" y="67" width="416" height="188" rx="7" class="panel"/>
  <text x="24" y="92" class="head" text-anchor="start">输入 evaluate.o 的 .text</text>
  <text x="43" y="119" class="note" text-anchor="middle">偏移</text>
  <text x="95" y="119" class="note" text-anchor="start">指令</text>
  <text x="320" y="119" class="note" text-anchor="middle">指令字（十六进制）</text>
  <path d="M24 126H416" class="grid"/>
  <text x="43" y="147" class="code-sm" text-anchor="middle">0</text>
  <text x="95" y="147" class="code-sm" text-anchor="start">add a0,a0,a1</text>
  <text x="320" y="147" class="code-sm" text-anchor="middle">00b50533</text>
  <text x="43" y="170" class="code-sm" text-anchor="middle">4</text>
  <text x="95" y="170" class="code-sm" text-anchor="start">mv a1,a2</text>
  <text x="320" y="170" class="code-sm" text-anchor="middle">00060593</text>
  <rect x="24" y="176" width="392" height="24" rx="4" class="target"/>
  <text x="43" y="193" class="code-sm" text-anchor="middle">8</text>
  <text x="95" y="193" class="code-sm" text-anchor="start">auipc t1,0</text>
  <text x="320" y="193" class="code-sm" text-anchor="middle">00000317</text>
  <rect x="24" y="202" width="392" height="24" rx="4" class="cell"/>
  <text x="43" y="219" class="code-sm" text-anchor="middle">12</text>
  <text x="95" y="219" class="code-sm" text-anchor="start">jalr x0,0(t1)</text>
  <text x="320" y="219" class="code-sm" text-anchor="middle">00030067</text>
  <text x="24" y="244" class="code-sm" text-anchor="start">偏移 8：R_RISCV_CALL_PLT → __mulsi3</text>
  <path d="M220 257V275" class="wire"/>
  <rect x="12" y="279" width="416" height="128" rx="7" class="target"/>
  <text x="24" y="304" class="head" text-anchor="start">链接器确定代码布局</text>
  <text x="24" y="330" class="code-sm" text-anchor="start">evaluate</text>
  <text x="225" y="330" class="code-sm" text-anchor="start">0x1000</text>
  <text x="24" y="353" class="small" text-anchor="start">AUIPC 的地址 P</text>
  <text x="225" y="353" class="code-sm" text-anchor="start">0x1008</text>
  <text x="24" y="376" class="small" text-anchor="start">__mulsi3 的地址 S</text>
  <text x="225" y="376" class="code-sm" text-anchor="start">0x1120</text>
  <text x="24" y="398" class="code-sm" text-anchor="start">Δ = S − P = 0x118（280 B）</text>
  <path d="M220 409V427" class="wire"/>
  <rect x="12" y="431" width="416" height="142" rx="7" class="panel"/>
  <text x="24" y="456" class="head" text-anchor="start">重定位后的两条指令</text>
  <text x="24" y="484" class="code-sm" text-anchor="start">0x1008</text>
  <text x="113" y="484" class="code-sm" text-anchor="start">auipc t1,0</text>
  <text x="320" y="484" class="code-sm" text-anchor="middle">00000317</text>
  <rect x="23" y="491" width="394" height="24" rx="7" class="target"/>
  <text x="24" y="508" class="code-sm" text-anchor="start">0x100c</text>
  <text x="113" y="508" class="code-sm" text-anchor="start">jalr x0,280(t1)</text>
  <text x="320" y="508" class="code-sm" text-anchor="middle">11830067</text>
  <text x="24" y="538" class="code-sm" text-anchor="start">AUIPC：t1 ← 0x1008 + 0</text>
  <text x="24" y="560" class="code-sm" text-anchor="start">JALR：跳到 t1 + 0x118 = 0x1120</text>
</svg>
