<svg xmlns="http://www.w3.org/2000/svg" width="440" height="643" viewBox="0 0 440 643" role="img" aria-labelledby="title desc">
  <title id="title">矩阵乘法和 BiasRelu 融合前后的中间数据搬运</title>
  <desc id="desc">矩阵乘结果 P 为两行两列的 uint16，行主序依次为 21、29、17、16。偏置为 int32 的负20、负15。未融合时，第一个内核写出整个 P（8 字节），第二个内核读入 P（8 字节），逐项按列加偏置再 ReLU 后写出 Y，依次为 1、14、0、1。融合时，将每个完成归约的累加器直接转换成 P 的约定类型，保留该值，执行有符号加法和 ReLU，再写出 Y。例中 P[1,0] 是 17，加负20 得负3，ReLU 得0。中间 P 不再物化到设备外层存储，少了 16 字节逻辑读写。两方案均读取 X、W 和偏置；图不统计其流量，也不是性能实测。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.25}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .target-text {fill:#78591b;font-weight:700}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="641" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="18" y="30" class="head">同一语义，不同内存路径</text>
  <text x="18" y="54" class="note">矩阵乘法 → BiasRelu；偏置 b = (−20, −15)</text>

  <rect x="13" y="66" width="414" height="270" rx="9" class="panel"/>
  <text x="25" y="92" class="label">未融合：两个内核</text>
  <rect x="25" y="104" width="390" height="41" rx="7" class="node"/>
  <text x="220" y="130" class="label" text-anchor="middle">内核 1 · 完成矩阵乘法</text>
  <path d="M220 145V166" class="wire"/>
  <text x="236" y="160" class="note target-text">写 8 B</text>
  <rect x="25" y="170" width="390" height="63" rx="7" class="target"/>
  <text x="36" y="190" class="note target-text">外层存储 P · uint16 行主序</text>
  <rect x="39" y="196" width="86" height="29" rx="4" class="cell"/>
  <rect x="131" y="196" width="86" height="29" rx="4" class="cell"/>
  <rect x="223" y="196" width="86" height="29" rx="4" class="target"/>
  <rect x="315" y="196" width="86" height="29" rx="4" class="cell"/>
  <text x="82" y="216" class="code" text-anchor="middle">21</text>
  <text x="174" y="216" class="code" text-anchor="middle">29</text>
  <text x="266" y="216" class="code target-text" text-anchor="middle">17</text>
  <text x="358" y="216" class="code" text-anchor="middle">16</text>
  <path d="M220 233V254" class="wire"/>
  <text x="236" y="249" class="note target-text">读 8 B</text>
  <rect x="25" y="258" width="390" height="40" rx="7" class="node"/>
  <text x="220" y="284" class="label" text-anchor="middle">内核 2 · 加偏置 → ReLU</text>
  <text x="30" y="322" class="note">写 Y（8 B）；中间 P 额外读写 16 B</text>

  <rect x="13" y="348" width="414" height="213" rx="9" class="panel"/>
  <text x="25" y="375" class="label">融合：同一内核中的局部值</text>
  <text x="25" y="399" class="note">例：i=1，j=0，四项乘积已经累加完成</text>
  <rect x="25" y="410" width="390" height="38" rx="6" class="node"/>
  <text x="220" y="435" class="code" text-anchor="middle">acc = 17 → uint16 P 值 17</text>
  <path d="M220 448V458" class="wire"/>
  <rect x="25" y="462" width="390" height="37" rx="6" class="target"/>
  <text x="220" y="486" class="label target-text" text-anchor="middle">有符号加法：17 − 20 = −3</text>
  <path d="M220 499V509" class="wire"/>
  <rect x="25" y="513" width="390" height="38" rx="6" class="node"/>
  <text x="220" y="538" class="label" text-anchor="middle">ReLU：−3 → 0；写 Y[1,0]</text>

  <rect x="13" y="572" width="414" height="59" rx="9" class="node"/>
  <text x="25" y="596" class="label">两方案最终均写入 Y（行主序）</text>
  <text x="25" y="618" class="code">Y = [1, 14, 0, 1]   8 B</text>
</svg>
