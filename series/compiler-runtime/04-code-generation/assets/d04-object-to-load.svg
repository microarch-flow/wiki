<svg xmlns="http://www.w3.org/2000/svg" width="440" height="568" viewBox="0 0 440 568" role="img" aria-labelledby="title desc">
  <title id="title">从目标文件到可加载的程序</title>
  <desc id="desc">两个可重定位目标文件：evaluate.o 有 evaluate 的定义、尚未解析的 __mulsi3 引用和偏移 8 处的重定位；helper.o 定义 __mulsi3。链接器决定输出布局、解析符号及修正引用，生成含 PT_LOAD 段和程序入口 e_entry 的 ELF。加载器按段映射所需字节到内存，处理器从启动入口开始，入口不一定是 evaluate。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px}
      .small {font-size:16px}
      .code-sm {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:15px}
      .target-text {fill:#78591b;font-weight:700}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.3}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .grid {stroke:#cbd6cb;stroke-width:1;fill:none}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}

    </style>
  </defs>
  <rect x="1" y="1" width="438" height="566" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
$  <text x="18" y="30" class="head" text-anchor="start">两个目标文件，怎样组成一个程序？</text>
  <text x="18" y="55" class="note" text-anchor="start">以静态链接的 ELF 产物为例。</text>
  <rect x="12" y="70" width="200" height="172" rx="7" class="panel"/>
  <rect x="228" y="70" width="200" height="172" rx="7" class="panel"/>
  <text x="23" y="96" class="code" text-anchor="start">evaluate.o</text>
  <text x="239" y="96" class="code" text-anchor="start">helper.o</text>
  <rect x="23" y="109" width="178" height="32" rx="7" class="cell"/>
  <rect x="239" y="109" width="178" height="32" rx="7" class="cell"/>
  <text x="34" y="131" class="small" text-anchor="start">.text 指令字节</text>
  <text x="250" y="131" class="small" text-anchor="start">.text 指令字节</text>
  <text x="23" y="165" class="small" text-anchor="start">evaluate 已定义</text>
  <text x="23" y="190" class="code-sm" text-anchor="start">__mulsi3 未定义</text>
  <text x="239" y="165" class="small" text-anchor="start">__mulsi3 已定义</text>
  <rect x="23" y="203" width="178" height="29" rx="7" class="target"/>
  <text x="112" y="223" class="small" text-anchor="middle">重定位：偏移 8</text>
  <path d="M112 244V265H220V283" class="wire"/>
  <path d="M328 244V265H220" class="wire"/>
  <rect x="59" y="286" width="322" height="81" rx="7" class="target"/>
  <text x="220" y="310" class="head" text-anchor="middle">链接器（Linker）</text>
  <text x="220" y="334" class="small" text-anchor="middle">合并布局、解析符号、修正引用</text>
  <text x="220" y="356" class="note" text-anchor="middle">生成可加载的静态 ELF</text>
  <path d="M220 370V389" class="wire"/>
  <rect x="12" y="392" width="416" height="79" rx="7" class="panel"/>
  <text x="23" y="417" class="head" text-anchor="start">ELF</text>
  <rect x="96" y="404" width="147" height="27" rx="7" class="cell"/>
  <text x="169.5" y="423" class="small" text-anchor="middle">输出 .text</text>
  <rect x="255" y="404" width="160" height="27" rx="7" class="node"/>
  <text x="335" y="423" class="small" text-anchor="middle">PT_LOAD 段信息</text>
  <text x="23" y="452" class="note" text-anchor="start">e_entry：指定程序启动入口</text>
  <path d="M220 473V492" class="wire"/>
  <rect x="16" y="495" width="408" height="59" rx="7" class="cell"/>
  <text x="220" y="518" class="label" text-anchor="middle">加载器按段映射所需字节到内存</text>
  <text x="220" y="541" class="note" text-anchor="middle">从 e_entry 启动；未必是 evaluate</text>
</svg>
