<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" role="img" aria-labelledby="title desc">
  <title id="title">同一列的两个累加器跨归约分块的更新与写回</title>
  <desc id="desc">选择 j=0，两执行位置 P0、P1 分别处理输入的第零行和第一行。累加器在开始一列时清零。第一段 k0=0 包含 k=0、1: 权重为3、5，两个累加器先得6、3，再得11、13。第二段 k0=2 不清零，依次累加 k=2、3 权重2、1，先得17、15，再得21、17。Y 为 2×2 行主序 uint16，按字节计算偏移 2(2i+j)，两个结果分别写入 y+0 B 和 y+4 B，同一列的输出不连续。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .label {font-size:18px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:18px}
      .code-sm {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:16px}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.3}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .target-text {fill:#78591b;font-weight:700}
      .grid {stroke:#cbd6cb;stroke-width:1;fill:none}
      .wire {fill:none;stroke:#476957;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="638" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="19" y="31" class="head">跟踪第一列 j = 0</text>
  <text x="19" y="57" class="note">P0 对应 i=0，P1 对应 i=1；每段两个 k。</text>
  <rect x="14" y="72" width="412" height="52" rx="8" class="target"/>
  <text x="27" y="96" class="label target-text">初始部分和</text>
  <text x="254" y="102" class="code target-text" text-anchor="middle">ACC0 = 0</text>
  <text x="362" y="102" class="code target-text" text-anchor="middle">ACC1 = 0</text>
  <path d="M220 124V140" class="wire"/>

  <rect x="14" y="143" width="412" height="141" rx="8" class="panel"/>
  <text x="26" y="169" class="label">第一段：k0 = 0</text>
  <text x="40" y="196" class="code-sm" text-anchor="middle">k</text>
  <text x="92" y="196" class="code-sm" text-anchor="middle">W</text>
  <text x="155" y="196" class="code-sm" text-anchor="middle">X0</text>
  <text x="213" y="196" class="code-sm" text-anchor="middle">X1</text>
  <text x="301" y="196" class="code-sm" text-anchor="middle">ACC0</text>
  <text x="379" y="196" class="code-sm" text-anchor="middle">ACC1</text>
  <path d="M26 204H414M263 183V273" class="grid"/>
  <text x="40" y="228" class="code" text-anchor="middle">0</text>
  <text x="92" y="228" class="code" text-anchor="middle">3</text>
  <text x="155" y="228" class="code" text-anchor="middle">2</text>
  <text x="213" y="228" class="code" text-anchor="middle">1</text>
  <text x="301" y="228" class="code" text-anchor="middle">6</text>
  <text x="379" y="228" class="code" text-anchor="middle">3</text>
  <path d="M26 236H414" class="grid"/>
  <rect x="269" y="240" width="64" height="31" rx="5" class="target"/>
  <rect x="347" y="240" width="64" height="31" rx="5" class="target"/>
  <text x="40" y="262" class="code" text-anchor="middle">1</text>
  <text x="92" y="262" class="code" text-anchor="middle">5</text>
  <text x="155" y="262" class="code" text-anchor="middle">1</text>
  <text x="213" y="262" class="code" text-anchor="middle">2</text>
  <text x="301" y="262" class="code target-text" text-anchor="middle">11</text>
  <text x="379" y="262" class="code target-text" text-anchor="middle">13</text>

  <path d="M220 284V317" class="wire"/>
  <text x="230" y="305" class="note target-text">保留 11、13，不清零</text>
  <rect x="14" y="321" width="412" height="141" rx="8" class="panel"/>
  <text x="26" y="347" class="label">第二段：k0 = 2</text>
  <text x="40" y="374" class="code-sm" text-anchor="middle">k</text>
  <text x="92" y="374" class="code-sm" text-anchor="middle">W</text>
  <text x="155" y="374" class="code-sm" text-anchor="middle">X0</text>
  <text x="213" y="374" class="code-sm" text-anchor="middle">X1</text>
  <text x="301" y="374" class="code-sm" text-anchor="middle">ACC0</text>
  <text x="379" y="374" class="code-sm" text-anchor="middle">ACC1</text>
  <path d="M26 382H414M263 361V451" class="grid"/>
  <text x="40" y="406" class="code" text-anchor="middle">2</text>
  <text x="92" y="406" class="code" text-anchor="middle">2</text>
  <text x="155" y="406" class="code" text-anchor="middle">3</text>
  <text x="213" y="406" class="code" text-anchor="middle">1</text>
  <text x="301" y="406" class="code" text-anchor="middle">17</text>
  <text x="379" y="406" class="code" text-anchor="middle">15</text>
  <path d="M26 414H414" class="grid"/>
  <rect x="269" y="418" width="64" height="31" rx="5" class="target"/>
  <rect x="347" y="418" width="64" height="31" rx="5" class="target"/>
  <text x="40" y="440" class="code" text-anchor="middle">3</text>
  <text x="92" y="440" class="code" text-anchor="middle">1</text>
  <text x="155" y="440" class="code" text-anchor="middle">4</text>
  <text x="213" y="440" class="code" text-anchor="middle">2</text>
  <text x="301" y="440" class="code target-text" text-anchor="middle">21</text>
  <text x="379" y="440" class="code target-text" text-anchor="middle">17</text>
  <path d="M220 462V480" class="wire"/>

  <rect x="14" y="484" width="412" height="142" rx="8" class="panel"/>
  <text x="26" y="510" class="label">全部 k 完成后才写回 Y</text>
  <text x="26" y="535" class="note">行主序 uint16，偏移 = 2(2i + j) 字节</text>
  <text x="77" y="558" class="code-sm" text-anchor="middle">y+0 B</text>
  <text x="171" y="558" class="code-sm" text-anchor="middle">y+2 B</text>
  <text x="265" y="558" class="code-sm" text-anchor="middle">y+4 B</text>
  <text x="359" y="558" class="code-sm" text-anchor="middle">y+6 B</text>
  <rect x="31" y="566" width="92" height="47" rx="5" class="target"/>
  <rect x="125" y="566" width="92" height="47" rx="5" class="cell"/>
  <rect x="219" y="566" width="92" height="47" rx="5" class="target"/>
  <rect x="313" y="566" width="92" height="47" rx="5" class="cell"/>
  <text x="77" y="584" class="code-sm" text-anchor="middle">Y[0,0]</text>
  <text x="171" y="584" class="code-sm" text-anchor="middle">Y[0,1]</text>
  <text x="265" y="584" class="code-sm" text-anchor="middle">Y[1,0]</text>
  <text x="359" y="584" class="code-sm" text-anchor="middle">Y[1,1]</text>
  <text x="77" y="605" class="code target-text" text-anchor="middle">21</text>
  <text x="171" y="605" class="note" text-anchor="middle">未写</text>
  <text x="265" y="605" class="code target-text" text-anchor="middle">17</text>
  <text x="359" y="605" class="note" text-anchor="middle">未写</text>
</svg>
