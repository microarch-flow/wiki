  <text x="256" y="206" class="code" text-anchor="middle">t</text>
  <rect x="334" y="186" width="24" height="25" rx="4" class="target"/>
  <text x="346" y="206" class="code" text-anchor="middle">y</text>
  <text x="23" y="235" class="note warn" text-anchor="start">峰值 3 个寄存器，时刻 9 结果可用。</text>
  <rect x="12" y="253" width="416" height="147" rx="7" class="panel"/>
  <text x="23" y="279" class="head" text-anchor="start">② 推迟读取 c</text>
  <text x="22" y="306" class="note" text-anchor="start">时刻</text>
  <text x="22" y="336" class="note" text-anchor="start">发射</text>
  <text x="22" y="364" class="note" text-anchor="start">就绪</text>
