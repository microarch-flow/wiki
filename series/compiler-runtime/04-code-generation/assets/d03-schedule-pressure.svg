<svg xmlns="http://www.w3.org/2000/svg" width="440" height="432" viewBox="0 0 440 432" role="img" aria-labelledby="title desc">
  <title id="title">提前或推迟加载 c 的调度与寄存器压力</title>
  <desc id="desc">教学时序模型：每拍最多发射一条指令，LW 从发射到结果可用需三拍，ADD 一拍，MUL 三拍。不同访问可重叠，不另计冲突、函数进出或真实存储等待。早加载顺序：a 在时刻 0 发射、c 在时刻 1、b 在时刻 2、t 的 ADD 在时刻 5、y 的 MUL 在时刻 6，时刻 9 结果可用，三个值重叠活跃。晚加载：a 在 0、b 在 1、t 在 4、c 在 5、y 在 8，时刻 11 结果可用，峰值两个寄存器。</desc>
  <defs>
    <style>
      text {font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head {font-size:21px;font-weight:700}
      .note {font-size:16px;fill:#416354}
      .code {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:17px}
      .small {font-size:16px}
      .code-sm {font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:15px}
      .cell {fill:#d9e9dc;stroke:#729582;stroke-width:1.3}
      .target {fill:#f2e4c9;stroke:#aa9163;stroke-width:1.5}
      .target-text {fill:#78591b;font-weight:700}
      .panel {fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}
      .node {fill:#e9eee4;stroke:#97ad9a;stroke-width:1.25}
      .grid {stroke:#cbd6cb;stroke-width:1;fill:none}
      .warn {fill:#875b35;font-weight:700}
      .muted {fill:#e9ebe7;stroke:#bac4b9;stroke-width:1.1}
      .stale {fill:#faf9f3;stroke:#b6b9a8;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="430" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text x="18" y="30" class="head" text-anchor="start">什么时候发射读取 c 的指令？</text>
  <text x="18" y="55" class="note" text-anchor="start">a、b、c：LW（3 拍）；t：ADD（1 拍）</text>
  <text x="18" y="78" class="note" text-anchor="start">y：MUL（3 拍）；每拍最多发射一条。</text>
  <rect x="12" y="96" width="416" height="147" rx="7" class="panel"/>
  <text x="23" y="122" class="head" text-anchor="start">① 提前读取 c</text>
  <text x="22" y="149" class="note" text-anchor="start">时刻</text>
  <text x="22" y="179" class="note" text-anchor="start">发射</text>
  <text x="22" y="207" class="note" text-anchor="start">就绪</text>
  <text x="76" y="149" class="code-sm" text-anchor="middle">0</text>
