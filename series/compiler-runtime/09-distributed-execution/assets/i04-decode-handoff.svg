<svg xmlns="http://www.w3.org/2000/svg" width="500" height="523" viewBox="0 0 500 523" role="img" aria-labelledby="title desc">
  <title id="title">新查询发送给分布式历史状态，再归并局部结果</title>
  <desc id="desc">沿用连续位置切分的布局，下一位置 p9=y1 由 Rank 0 产生。在一层的教学算例中，Rank 0 保存 p1 至 p4 的历史以及刚生成的 p9 KV，共 5 个有效位置；Rank 1 保存 p5 至 p8 的历史，共 4 个有效位置。Rank 0 产生完整四个查询头的 Q，每头 16 个 FP16 元素，总计 128 B，送给 Rank 1。两端分别计算各自位置的局部 Attention 统计与向量。Rank 1 将四个查询头各自的局部 m、ℓ、16 维 z（全部 FP32），共 4×18×4 B=288 B 返回 Rank 0。Rank 0 以相同的 Softmax 基准合并本地和远端统计，得到完整 O。此例仅统计 Q 与局部统计传输的有效载荷，共 416 B，不含其他通信。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#527d64"/></marker>
    <marker id="arrowback" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6 0L0 3L6 6Z" fill="#527d64"/></marker>
  </defs>

  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .r2 { fill: #dce8e9; stroke: #7a969b; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr { fill: none; stroke: #527d64; stroke-width: 1.8; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #527d64; stroke-width: 1.7; marker-start: url(#arrowback); marker-end: url(#arrow); }
    .candidate { fill: none; stroke: #527d64; stroke-width: 2; stroke-dasharray: 3 2; marker-end: url(#arrow); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="521" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">Decode：发送查询，返回局部统计</text>
  <text x="24" y="58" class="label">单层 · 新位置 p9 = y1，由 Rank 0 产生</text>
  <rect x="18" y="75" width="224" height="123" rx="10" class="panel"/>
  <text x="30" y="103" class="subhead">Rank 0 · 本地 KV</text>
  <rect x="30" y="115" width="37" height="29" rx="4" class="r0"/>
  <text x="48.5" y="135.5" class="num">p1</text>
  <rect x="70" y="115" width="37" height="29" rx="4" class="r0"/>
  <text x="88.5" y="135.5" class="num">p2</text>
  <rect x="110" y="115" width="37" height="29" rx="4" class="r0"/>
  <text x="128.5" y="135.5" class="num">p3</text>
  <rect x="150" y="115" width="37" height="29" rx="4" class="r0"/>
  <text x="168.5" y="135.5" class="num">p4</text>
  <rect x="190" y="115" width="37" height="29" rx="4" class="r0"/>
  <text x="208.5" y="135.5" class="num">p9</text>
  <text x="30" y="164" class="label">5 个有效位置</text>
  <text x="30" y="187" class="small">p9 为当前 KV</text>
  <rect x="258" y="75" width="224" height="123" rx="10" class="panel"/>
  <text x="270" y="103" class="subhead">Rank 1 · 本地 KV</text>
  <rect x="270" y="115" width="37" height="29" rx="4" class="r1"/>
  <text x="288.5" y="135.5" class="num">p5</text>
  <rect x="310" y="115" width="37" height="29" rx="4" class="r1"/>
  <text x="328.5" y="135.5" class="num">p6</text>
  <rect x="350" y="115" width="37" height="29" rx="4" class="r1"/>
  <text x="368.5" y="135.5" class="num">p7</text>
  <rect x="390" y="115" width="37" height="29" rx="4" class="r1"/>
  <text x="408.5" y="135.5" class="num">p8</text>
  <text x="270" y="164" class="label">4 个有效位置</text>
  <text x="270" y="187" class="small">只有历史 KV</text>
  <rect x="18" y="209" width="464" height="106" rx="10" class="card"/>
  <text x="30" y="234" class="subhead">Rank 0</text>
  <text x="470" y="234" class="subhead" text-anchor="end">Rank 1</text>
  <text x="250" y="260" class="label" text-anchor="middle">Q：4 头 × 16 × 2 B = 128 B</text>
  <path d="M38 270H462" class="arr"/>
  <text x="250" y="292" class="label" text-anchor="middle">各自用本地 KV 计算 m、ℓ、z</text>
  <text x="250" y="308" class="tick" text-anchor="middle">四个 Q 头分别统计</text>
  <rect x="18" y="326" width="464" height="87" rx="10" class="card"/>
  <text x="250" y="350" class="label" text-anchor="middle">返回每个 Q 头的 FP32(m, ℓ, z₁₆)</text>
  <text x="250" y="373" class="label" text-anchor="middle">4 × (1 + 1 + 16) × 4 B = 288 B</text>
  <path d="M462 393H38" class="arr"/>
  <rect x="18" y="424" width="464" height="47" rx="7" class="r0"/>
  <text x="250" y="454" class="label" text-anchor="middle">Rank 0：本地与远端统计合并，得到完整 O</text>
  <text x="24" y="495" class="label">跨 Rank 有效载荷：128 + 288 = 416 B。</text>
  <text x="24" y="516" class="small">仅计本例 Q 与局部统计，不含其它通信。</text>
</svg>
