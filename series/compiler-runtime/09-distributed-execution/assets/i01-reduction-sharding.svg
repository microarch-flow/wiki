<svg xmlns="http://www.w3.org/2000/svg" width="500" height="675" viewBox="0 0 500 675" role="img" aria-labelledby="title desc">
  <title id="title">沿归约维 K 切分：两张卡各自产生一份部分和</title>
  <desc id="desc">Rank 0 负责 k=0,1，持有 X 左两列和 W 上两行，计算 Z0=[[11,4],[13,5]]；Rank 1 负责 k=2,3，持有 X 右两列和 W 下两行，计算 Z1=[[10,25],[4,11]]。每份 Z 均为 2×2 的部分和，不能独立作为最终值。直接互发部分和，每 Rank 发送 8 B；两端逐元素相加，得到完整 Y=[[21,29],[17,16]]。实际集合通信算法可能使用其他轮次或分块方式。</desc>
  <defs>
    <marker id="arrow0" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <marker id="arrow1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c7b42"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr0 { fill: none; stroke: #527d64; stroke-width: 2; marker-end: url(#arrow0); }
    .arr1 { fill: none; stroke: #9c7b42; stroke-width: 2; marker-end: url(#arrow1); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .dashed { fill: none; stroke: #9c7b42; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .comm { fill: #c1dac6; stroke: #6f9a80; stroke-width: 1.4; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="673" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">按归约维 K 切分</text>
  <text x="24" y="58" class="label">X/W 每元素 1 B；部分和/Y 每元素 2 B</text>
  <rect x="18" y="80" width="224" height="309" rx="10" class="panel"/>
  <text x="30" y="107" class="subhead">Rank 0 · k=0,1</text>
  <text x="30" y="134" class="label">X 列分片</text>
  <text x="137" y="134" class="label">W 行分片</text>
  <rect x="34" y="147" width="34" height="28" rx="3" class="r0"/>
  <text x="51.0" y="167.0" class="num">2</text>
  <rect x="70" y="147" width="34" height="28" rx="3" class="r0"/>
  <text x="87.0" y="167.0" class="num">1</text>
  <rect x="34" y="177" width="34" height="28" rx="3" class="r0"/>
  <text x="51.0" y="197.0" class="num">1</text>
  <rect x="70" y="177" width="34" height="28" rx="3" class="r0"/>
  <text x="87.0" y="197.0" class="num">2</text>
  <rect x="154" y="147" width="34" height="28" rx="3" class="r0"/>
  <text x="171.0" y="167.0" class="num">3</text>
  <rect x="190" y="147" width="34" height="28" rx="3" class="r0"/>
  <text x="207.0" y="167.0" class="num">1</text>
  <rect x="154" y="177" width="34" height="28" rx="3" class="r0"/>
  <text x="171.0" y="197.0" class="num">5</text>
  <rect x="190" y="177" width="34" height="28" rx="3" class="r0"/>
  <text x="207.0" y="197.0" class="num">2</text>
  <text x="69" y="227" class="small" text-anchor="middle">4 B</text>
  <text x="189" y="227" class="small" text-anchor="middle">4 B</text>
  <text x="128" y="186" class="subhead" text-anchor="middle">×</text>
  <path d="M130 221V259" class="arr0"/>
  <text x="130" y="279" class="label" text-anchor="middle">Z0 · 局部部分和</text>
  <rect x="94" y="290" width="34" height="28" rx="3" class="r0"/>
  <text x="111.0" y="310.0" class="num">11</text>
  <rect x="130" y="290" width="34" height="28" rx="3" class="r0"/>
  <text x="147.0" y="310.0" class="num">4</text>
  <rect x="94" y="320" width="34" height="28" rx="3" class="r0"/>
  <text x="111.0" y="340.0" class="num">13</text>
  <rect x="130" y="320" width="34" height="28" rx="3" class="r0"/>
  <text x="147.0" y="340.0" class="num">5</text>
  <text x="130" y="369" class="small" text-anchor="middle">8 B · 8 MAC</text>
  <rect x="258" y="80" width="224" height="309" rx="10" class="panel"/>
  <text x="270" y="107" class="subhead">Rank 1 · k=2,3</text>
  <text x="270" y="134" class="label">X 列分片</text>
  <text x="377" y="134" class="label">W 行分片</text>
  <rect x="274" y="147" width="34" height="28" rx="3" class="r1"/>
  <text x="291.0" y="167.0" class="num">3</text>
  <rect x="310" y="147" width="34" height="28" rx="3" class="r1"/>
  <text x="327.0" y="167.0" class="num">4</text>
  <rect x="274" y="177" width="34" height="28" rx="3" class="r1"/>
  <text x="291.0" y="197.0" class="num">1</text>
  <rect x="310" y="177" width="34" height="28" rx="3" class="r1"/>
  <text x="327.0" y="197.0" class="num">2</text>
  <rect x="394" y="147" width="34" height="28" rx="3" class="r1"/>
  <text x="411.0" y="167.0" class="num">2</text>
  <rect x="430" y="147" width="34" height="28" rx="3" class="r1"/>
  <text x="447.0" y="167.0" class="num">3</text>
  <rect x="394" y="177" width="34" height="28" rx="3" class="r1"/>
  <text x="411.0" y="197.0" class="num">1</text>
  <rect x="430" y="177" width="34" height="28" rx="3" class="r1"/>
  <text x="447.0" y="197.0" class="num">4</text>
  <text x="309" y="227" class="small" text-anchor="middle">4 B</text>
  <text x="429" y="227" class="small" text-anchor="middle">4 B</text>
  <text x="368" y="186" class="subhead" text-anchor="middle">×</text>
  <path d="M370 221V259" class="arr1"/>
  <text x="370" y="279" class="label" text-anchor="middle">Z1 · 局部部分和</text>
  <rect x="334" y="290" width="34" height="28" rx="3" class="r1"/>
  <text x="351.0" y="310.0" class="num">10</text>
  <rect x="370" y="290" width="34" height="28" rx="3" class="r1"/>
  <text x="387.0" y="310.0" class="num">25</text>
  <rect x="334" y="320" width="34" height="28" rx="3" class="r1"/>
  <text x="351.0" y="340.0" class="num">4</text>
  <rect x="370" y="320" width="34" height="28" rx="3" class="r1"/>
  <text x="387.0" y="340.0" class="num">11</text>
  <text x="370" y="369" class="small" text-anchor="middle">8 B · 8 MAC</text>
  <text x="250" y="411" class="subhead" text-anchor="middle">若两端都需完整 Y，则合并对应元素</text>
  <rect x="18" y="422" width="464" height="115" rx="10" class="card"/>
  <text x="32" y="450" class="label">Rank 0</text>
  <text x="468" y="450" class="label" text-anchor="end">Rank 1</text>
  <text x="250" y="458" class="small" text-anchor="middle">Z0 · 8 B</text>
  <path d="M55 468H445" class="arr0"/>
  <text x="250" y="500" class="small" text-anchor="middle">Z1 · 8 B</text>
  <path d="M445 510H55" class="arr1"/>
  <text x="250" y="561" class="subhead" text-anchor="middle">AllReduce 后：两端均得到 Y = Z0 + Z1</text>
  <rect x="214" y="575" width="34" height="28" rx="3" class="full"/>
  <text x="231.0" y="595.0" class="num">21</text>
  <rect x="250" y="575" width="34" height="28" rx="3" class="full"/>
  <text x="267.0" y="595.0" class="num">29</text>
  <rect x="214" y="605" width="34" height="28" rx="3" class="full"/>
  <text x="231.0" y="625.0" class="num">17</text>
  <rect x="250" y="605" width="34" height="28" rx="3" class="full"/>
  <text x="267.0" y="625.0" class="num">16</text>
  <text x="250" y="660" class="small" text-anchor="middle">直接互发示意；两端合计发送 16 B</text>
</svg>
