<svg xmlns="http://www.w3.org/2000/svg" width="500" height="486" viewBox="0 0 500 486" role="img" aria-labelledby="title desc">
  <title id="title">源端按头切，目的端按位置切：同一份 KV 的布局转换</title>
  <desc id="desc">P 池的 Rank P0 保存头 0 的 p1 至 p8，P1 保存头 1 的 p1 至 p8，分别 512 B。D 池新布局中 D0 保存两个头的 p1 至 p4，D1 保存两个头的 p5 至 p8，分别 512 B。P0→D0 传头 0 的 p1 至 p4，P0→D1 传头 0 的 p5 至 p8，P1→D0 和 P1→D1 类似，各 256 B，合计 1024 B。若 D0 已有相容且就绪的前四位置 KV，则本例只需要把后四位置、两个头交给 D1，共 512 B。只计有效 KV 载荷，不含通信开销。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#527d64"/></marker>
    <marker id="arrowback" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6 0L0 3L6 6Z" fill="#527d64"/></marker>
  </defs>

  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .r2 { fill: #dce8e9; stroke: #7a969b; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr { fill: none; stroke: #527d64; stroke-width: 1.8; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #527d64; stroke-width: 1.7; marker-start: url(#arrowback); marker-end: url(#arrow); }
    .candidate { fill: none; stroke: #527d64; stroke-width: 2; stroke-dasharray: 3 2; marker-end: url(#arrow); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="484" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">KV 的切分方式改变，怎样交接？</text>
  <text x="24" y="57" class="label">单层 · 2 个 KV 头 · 每头每位置 64 B</text>
  <rect x="18" y="70" width="224" height="80" rx="8" class="panel"/>
  <text x="30" y="96" class="subhead">P0 · KV 头 0</text>
  <rect x="30" y="107" width="200" height="30" rx="4" class="r0"/>
  <text x="130.0" y="128.0" class="num">p1–p8 · 512 B</text>
  <rect x="258" y="70" width="224" height="80" rx="8" class="panel"/>
  <text x="270" y="96" class="subhead">P1 · KV 头 1</text>
  <rect x="270" y="107" width="200" height="30" rx="4" class="r1"/>
  <text x="370.0" y="128.0" class="num">p1–p8 · 512 B</text>
  <text x="24" y="179" class="subhead">四条路径：每格是一份不重复的 KV</text>
  <text x="229" y="204" class="label" text-anchor="middle">目的 D0</text>
  <text x="394" y="204" class="label" text-anchor="middle">目的 D1</text>
  <text x="30" y="247" class="label">源 P0</text>
  <rect x="151" y="213" width="155" height="58" rx="6" class="r0"/>
  <text x="228.5" y="235" class="small" text-anchor="middle">头0 · p1–p4</text>
  <text x="228.5" y="259" class="num">256 B</text>
  <rect x="316" y="213" width="155" height="58" rx="6" class="r0"/>
  <text x="393.5" y="235" class="small" text-anchor="middle">头0 · p5–p8</text>
  <text x="393.5" y="259" class="num">256 B</text>
  <text x="30" y="315" class="label">源 P1</text>
  <rect x="151" y="281" width="155" height="58" rx="6" class="r1"/>
  <text x="228.5" y="303" class="small" text-anchor="middle">头1 · p1–p4</text>
  <text x="228.5" y="327" class="num">256 B</text>
  <rect x="316" y="281" width="155" height="58" rx="6" class="r1"/>
  <text x="393.5" y="303" class="small" text-anchor="middle">头1 · p5–p8</text>
  <text x="393.5" y="327" class="num">256 B</text>
  <text x="24" y="367" class="subhead">目标状态（D 池）：</text>
  <rect x="18" y="380" width="224" height="63" rx="8" class="panel"/>
  <text x="30" y="403" class="label">D0 · p1–p4 · 512 B</text>
  <rect x="30" y="410" width="95" height="25" rx="4" class="r0"/>
  <text x="77.5" y="428.5" class="num">头 0</text>
  <rect x="150" y="410" width="80" height="25" rx="4" class="r1"/>
  <text x="190.0" y="428.5" class="num">头 1</text>
  <rect x="258" y="380" width="224" height="63" rx="8" class="panel"/>
  <text x="270" y="403" class="label">D1 · p5–p8 · 512 B</text>
  <rect x="270" y="410" width="95" height="25" rx="4" class="r0"/>
  <text x="317.5" y="428.5" class="num">头 0</text>
  <rect x="390" y="410" width="80" height="25" rx="4" class="r1"/>
  <text x="430.0" y="428.5" class="num">头 1</text>
  <text x="24" y="462" class="small">总载荷 1,024 B；若 D0 已有相容且就绪的 KV，</text>
  <text x="24" y="481" class="small">只传向 D1 的两份，共 512 B。</text>
</svg>
