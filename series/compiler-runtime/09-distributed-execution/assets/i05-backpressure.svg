<svg xmlns="http://www.w3.org/2000/svg" width="500" height="449" viewBox="0 0 500 449" role="img" aria-labelledby="title desc">
  <title id="title">接收安装受限时，待交接状态需要容量限制</title>
  <desc id="desc">以 10 ms 为一个槽。每槽开始时 D 池从先前积压中接收安装最多 1 份；槽末 P 池最多产生 2 份完成 Prefill、待交接的状态。初始未交接量 q=0。不限制积压时三个槽末 q 为 2、3、4，P 产出 2、2、2，D 接收 0、1、1。若待交接容量上限为 2，P 实际产出限制为 2、1、1，D 接收仍为 0、1、1，三个槽末 q 皆为 2。该例只描述未交接请求状态数量，接收安装速率不等于 D 的 Token 生成速度，也不表示真实性能。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#527d64"/></marker>
    <marker id="arrowback" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6 0L0 3L6 6Z" fill="#527d64"/></marker>
  </defs>

  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .r2 { fill: #dce8e9; stroke: #7a969b; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr { fill: none; stroke: #527d64; stroke-width: 1.8; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #527d64; stroke-width: 1.7; marker-start: url(#arrowback); marker-end: url(#arrow); }
    .candidate { fill: none; stroke: #527d64; stroke-width: 2; stroke-dasharray: 3 2; marker-end: url(#arrow); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="447" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">D 接收安装跟不上，P 应何时减速？</text>
  <text x="24" y="58" class="label">每 10 ms 一槽；D 先接收旧积压，P 槽末产出</text>
  <text x="24" y="80" class="small">D 最多接收 1 份/槽；P 最多产出 2 份/槽</text>
  <rect x="18" y="95" width="464" height="165" rx="10" class="panel"/>
  <text x="32" y="119" class="label">槽末未交接量 q（份）</text>
  <path d="M158 237H455" class="guide"/>
  <text x="146" y="242" class="tick" text-anchor="end">0</text>
  <path d="M158 212H455" class="guide"/>
  <text x="146" y="217" class="tick" text-anchor="end">1</text>
  <path d="M158 187H455" class="guide"/>
  <text x="146" y="192" class="tick" text-anchor="end">2</text>
  <path d="M158 162H455" class="guide"/>
  <text x="146" y="167" class="tick" text-anchor="end">3</text>
  <path d="M158 137H455" class="guide"/>
  <text x="146" y="142" class="tick" text-anchor="end">4</text>
  <text x="158" y="253" class="tick" text-anchor="middle">0</text>
  <text x="257" y="253" class="tick" text-anchor="middle">10</text>
  <text x="356" y="253" class="tick" text-anchor="middle">20</text>
  <text x="455" y="253" class="tick" text-anchor="middle">30</text>
  <text x="30" y="253" class="tick">时刻/ms</text>
  <path d="M158 237 L257 187 L356 162 L455 137" fill="none" stroke="#9c7b42" stroke-width="2.7"/>
  <circle cx="158" cy="237" r="4.6" fill="#9c7b42"/>
  <circle cx="257" cy="187" r="4.6" fill="#9c7b42"/>
  <circle cx="356" cy="162" r="4.6" fill="#9c7b42"/>
  <circle cx="455" cy="137" r="4.6" fill="#9c7b42"/>
  <path d="M158 237 L257 187 L356 187 L455 187" fill="none" stroke="#527d64" stroke-width="2.7"/>
  <circle cx="158" cy="237" r="4.6" fill="#527d64"/>
  <circle cx="257" cy="187" r="4.6" fill="#527d64"/>
  <circle cx="356" cy="187" r="4.6" fill="#527d64"/>
  <circle cx="455" cy="187" r="4.6" fill="#527d64"/>
  <rect x="24" y="269" width="30" height="10" rx="2" class="r1"/>
  <text x="62" y="283" class="label">无上限：</text>
  <text x="170" y="283" class="label">q = 0 → 2 → 3 → 4</text>
  <rect x="24" y="295" width="30" height="10" rx="2" class="r0"/>
  <text x="62" y="309" class="label">容量 2：</text>
  <text x="170" y="309" class="label">q = 0 → 2 → 2 → 2</text>
  <rect x="18" y="326" width="464" height="80" rx="8" class="card"/>
  <text x="30" y="346" class="small">每槽实际份数</text>
  <text x="306" y="346" class="small">第 1 / 2 / 3 槽</text>
  <text x="30" y="365" class="small">D 接收（两种情况相同）</text>
  <text x="350" y="365" class="small">0 / 1 / 1</text>
  <text x="30" y="383" class="small">P 产出（无上限）</text>
  <text x="350" y="383" class="small">2 / 2 / 2</text>
  <text x="30" y="400" class="small">P 产出（限制容量 2）</text>
  <text x="350" y="400" class="small">2 / 1 / 1</text>
  <text x="24" y="429" class="small">D 接收/安装速度不等于生成速度；仅为教学例。</text>
</svg>
