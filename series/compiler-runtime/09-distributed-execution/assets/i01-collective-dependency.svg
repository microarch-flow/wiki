<svg xmlns="http://www.w3.org/2000/svg" width="500" height="389" viewBox="0 0 500 389" role="img" aria-labelledby="title desc">
  <title id="title">同一次集合通信依赖两个 Rank 的本地结果</title>
  <desc id="desc">教学时间线，时间单位为任意拍，不是设备测量性能。主机在开始时异步提交带依赖的任务，函数返回不说明设备通信完成。Rank 0 在第 4 拍产生 Z0，Rank 1 因输入较晚就绪，在第 2 拍开始计算、第 6 拍产生 Z1。假设对整个张量执行一次组内 AllReduce 且不做分块重叠，在第 6 至第 9 拍完成归约并交付 Y，两端依赖 Y 的后续计算从第 9 拍开始，在第 10 拍完成。若资源允许，不依赖 Y 和通信缓冲区的其他工作可能在第 6 至第 9 拍与通信重叠。此图是简化日程示意，实际分块通信可更早启动，完成时刻也未必在两端完全一致。</desc>
  <defs>
    <marker id="arrow0" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <marker id="arrow1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c7b42"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr0 { fill: none; stroke: #527d64; stroke-width: 2; marker-end: url(#arrow0); }
    .arr1 { fill: none; stroke: #9c7b42; stroke-width: 2; marker-end: url(#arrow1); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .dashed { fill: none; stroke: #9c7b42; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .comm { fill: #c1dac6; stroke: #6f9a80; stroke-width: 1.4; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="387" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">异步提交之后，哪些工作必须等待？</text>
  <text x="24" y="58" class="label">同一通信组 {0,1}，同一次 AllReduce</text>
  <rect x="18" y="74" width="464" height="232" rx="10" class="panel"/>
  <text x="126" y="101" class="tick" text-anchor="middle">0</text>
  <path d="M126 108V280" class="guide"/>
  <text x="160" y="101" class="tick" text-anchor="middle">1</text>
  <path d="M160 108V280" class="guide"/>
  <text x="194" y="101" class="tick" text-anchor="middle">2</text>
  <path d="M194 108V280" class="guide"/>
  <text x="228" y="101" class="tick" text-anchor="middle">3</text>
  <path d="M228 108V280" class="guide"/>
  <text x="262" y="101" class="tick" text-anchor="middle">4</text>
  <path d="M262 108V280" class="guide"/>
  <text x="296" y="101" class="tick" text-anchor="middle">5</text>
  <path d="M296 108V280" class="guide"/>
  <text x="330" y="101" class="tick" text-anchor="middle">6</text>
  <path d="M330 108V280" class="guide"/>
  <text x="364" y="101" class="tick" text-anchor="middle">7</text>
  <path d="M364 108V280" class="guide"/>
  <text x="398" y="101" class="tick" text-anchor="middle">8</text>
  <path d="M398 108V280" class="guide"/>
  <text x="432" y="101" class="tick" text-anchor="middle">9</text>
  <path d="M432 108V280" class="guide"/>
  <text x="466" y="101" class="tick" text-anchor="middle">10</text>
  <path d="M466 108V280" class="guide"/>
  <text x="117" y="101" class="tick" text-anchor="end">时间/拍</text>
  <text x="117" y="146" class="label" text-anchor="end">主机提交</text>
  <text x="117" y="187" class="label" text-anchor="end">Rank 0</text>
  <text x="117" y="228" class="label" text-anchor="end">Rank 1</text>
  <text x="117" y="269" class="label" text-anchor="end">独立工作</text>
  <rect x="126" y="123" width="340" height="32" rx="6" class="full"/>
  <text x="296" y="145" class="small" text-anchor="middle">提前提交后可继续工作</text>
  <rect x="126" y="164" width="136" height="32" rx="6" class="r0"/>
  <text x="194" y="186" class="small" text-anchor="middle">计算 Z0</text>
  <rect x="262" y="164" width="68" height="32" rx="6" class="wait"/>
  <text x="296" y="186" class="small" text-anchor="middle">等 Z1</text>
  <rect x="330" y="164" width="102" height="32" rx="6" class="comm"/>
  <text x="381" y="186" class="small" text-anchor="middle">归约 #1</text>
  <rect x="432" y="164" width="34" height="32" rx="6" class="r0"/>
  <text x="449" y="186" class="small" text-anchor="middle">读 Y</text>
  <rect x="126" y="205" width="68" height="32" rx="6" class="wait"/>
  <text x="160" y="227" class="small" text-anchor="middle">等输入</text>
  <rect x="194" y="205" width="136" height="32" rx="6" class="r1"/>
  <text x="262" y="227" class="small" text-anchor="middle">计算 Z1</text>
  <rect x="330" y="205" width="102" height="32" rx="6" class="comm"/>
  <text x="381" y="227" class="small" text-anchor="middle">归约 #1</text>
  <rect x="432" y="205" width="34" height="32" rx="6" class="r1"/>
  <text x="449" y="227" class="small" text-anchor="middle">读 Y</text>
  <rect x="330" y="246" width="102" height="32" rx="6" class="dashed"/>
  <text x="381" y="268" class="small" text-anchor="middle">可重叠</text>
  <path d="M330 157V241" class="dashed"/>
  <path d="M432 157V241" class="dashed"/>
  <text x="250" y="296" class="small" text-anchor="middle">本例不分块通信，最慢 Rank 决定何时归约</text>
  <text x="24" y="333" class="label">提交返回 ≠ Y 可读；消费须满足通信完成依赖。</text>
  <text x="24" y="357" class="small">独立工作若无数据/资源冲突，才可能重叠。</text>
  <text x="24" y="378" class="small">时间仅为教学假设，实际算法可提前分块通信。</text>
</svg>
