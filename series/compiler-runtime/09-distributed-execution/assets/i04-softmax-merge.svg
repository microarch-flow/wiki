<svg xmlns="http://www.w3.org/2000/svg" width="500" height="509" viewBox="0 0 500 509" role="img" aria-labelledby="title desc">
  <title id="title">局部 Softmax 统计需要换到共同基准才能归并</title>
  <desc id="desc">一个查询、两个有效 Key，分别位于两张卡。Rank 0 的 score=0，V 的一个分量为 0，局部 m0=0、ℓ0=1、z0=0。Rank 1 的 score=ln3，V 对应分量为 4，局部 m1=ln3、ℓ1=1、z1=4。如果直接平均两个局部归一化输出，得到 2，不是正确结果。选择共同最大值 M=ln3。各局部统计分别乘上 exp(m_i−M)，缩放因子是 1/3 与 1。全局分子为 0×1/3+4×1=4，分母为 1×1/3+1×1=4/3，全局输出为 4÷(4/3)=3。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#527d64"/></marker>
    <marker id="arrowback" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6 0L0 3L6 6Z" fill="#527d64"/></marker>
  </defs>

  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .r2 { fill: #dce8e9; stroke: #7a969b; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr { fill: none; stroke: #527d64; stroke-width: 1.8; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #527d64; stroke-width: 1.7; marker-start: url(#arrowback); marker-end: url(#arrow); }
    .candidate { fill: none; stroke: #527d64; stroke-width: 2; stroke-dasharray: 3 2; marker-end: url(#arrow); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="507" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">为什么不能直接平均局部 Attention？</text>
  <text x="24" y="58" class="label">最小例：一个查询、两个 Key，只看 V 的一维</text>
  <rect x="18" y="73" width="224" height="115" rx="10" class="panel"/>
  <text x="30" y="100" class="subhead">Rank 0</text>
  <text x="30" y="126" class="label">score = 0；v = 0</text>
  <rect x="30" y="136" width="200" height="37" rx="5" class="r0"/>
  <text x="130" y="161" class="small" text-anchor="middle">m=0，ℓ=1，z=0</text>
  <rect x="258" y="73" width="224" height="115" rx="10" class="panel"/>
  <text x="270" y="100" class="subhead">Rank 1</text>
  <text x="270" y="126" class="label">score = ln 3；v = 4</text>
  <rect x="270" y="136" width="200" height="37" rx="5" class="r1"/>
  <text x="370" y="161" class="small" text-anchor="middle">m=ln 3，ℓ=1，z=4</text>
  <rect x="18" y="199" width="464" height="46" rx="8" class="wait"/>
  <text x="250" y="228" class="label" text-anchor="middle">直接平均局部输出：(0 + 4) / 2 = 2（错误）</text>
  <text x="250" y="272" class="subhead" text-anchor="middle">统一基准 M = max(0, ln 3) = ln 3</text>
  <rect x="18" y="287" width="224" height="92" rx="7" class="r0"/>
  <text x="130" y="312" class="label" text-anchor="middle">缩放因子：1/3</text>
  <text x="130" y="335" class="label" text-anchor="middle">分子贡献：0</text>
  <text x="130" y="360" class="label" text-anchor="middle">分母贡献：1/3</text>
  <rect x="258" y="287" width="224" height="92" rx="7" class="r1"/>
  <text x="370" y="312" class="label" text-anchor="middle">缩放因子：1</text>
  <text x="370" y="335" class="label" text-anchor="middle">分子贡献：4</text>
  <text x="370" y="360" class="label" text-anchor="middle">分母贡献：1</text>
  <path d="M130 382L210 403" class="arr"/>
  <path d="M370 382L290 403" class="arr"/>
  <rect x="42" y="407" width="416" height="61" rx="8" class="panel"/>
  <text x="250" y="430" class="small" text-anchor="middle">分子 = 0 + 4 = 4；分母 = 1/3 + 1 = 4/3</text>
  <text x="250" y="455" class="subhead" text-anchor="middle">全局输出：4 ÷ (4/3) = 3</text>
  <text x="24" y="493" class="small">先缩放已统计的分子和分母，再求归一化输出。</text>
</svg>
