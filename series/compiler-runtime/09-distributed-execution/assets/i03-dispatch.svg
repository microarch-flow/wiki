<svg xmlns="http://www.w3.org/2000/svg" width="500" height="552" viewBox="0 0 500 552" role="img" aria-labelledby="title desc">
  <title id="title">四个 Token 分别派发给三个专家</title>
  <desc id="desc">例子包含四个 Token，每个激活向量有 8 个 FP16 元素，占用 16 B。Rank 0 持有 t0、t1 及专家 E0、E1；Rank 1 持有 t2、t3 及专家 E2。Top-2 分别选择 t0→E0,E1，t1→E0,E2，t2→E0,E1，t3→E1,E2。以每个 Token 与专家的分配分别派发一份向量为假设，Rank 0 向 Rank 1 传 t1 的 E2 份额，16 B；Rank 1 向 Rank 0 传 t2 的 E0、E1 份额及 t3 的 E1 份额，共 48 B。派发后 E0 处理 t0,t1,t2，E1 处理 t0,t2,t3，E2 处理 t1,t3。含本地分配共 8 份、128 B；远端传输 64 B，不计元数据、填充及协议开销。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#527d64"/></marker>
    <marker id="arrowback" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6 0L0 3L6 6Z" fill="#527d64"/></marker>
  </defs>

  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .r2 { fill: #dce8e9; stroke: #7a969b; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr { fill: none; stroke: #527d64; stroke-width: 1.8; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #527d64; stroke-width: 1.7; marker-start: url(#arrowback); marker-end: url(#arrow); }
    .candidate { fill: none; stroke: #527d64; stroke-width: 2; stroke-dasharray: 3 2; marker-end: url(#arrow); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="550" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">每个 Token 怎样找到选中的专家？</text>
  <text x="24" y="58" class="label">Top-2 · 8 个 FP16 元素 = 16 B/向量</text>
  <rect x="18" y="75" width="224" height="119" rx="10" class="panel"/>
  <text x="30" y="100" class="subhead">Rank 0 · 原输入</text>
  <rect x="30" y="111" width="54" height="30" rx="4" class="r0"/>
  <text x="57.0" y="132.0" class="num">t0</text>
  <path d="M87 126H109" class="arr"/>
  <text x="116" y="133" class="label">E0 / E1</text>
  <rect x="30" y="149" width="54" height="30" rx="4" class="r0"/>
  <text x="57.0" y="170.0" class="num">t1</text>
  <path d="M87 164H109" class="arr"/>
  <text x="116" y="171" class="label">E0 / E2</text>
  <rect x="258" y="75" width="224" height="119" rx="10" class="panel"/>
  <text x="270" y="100" class="subhead">Rank 1 · 原输入</text>
  <rect x="270" y="111" width="54" height="30" rx="4" class="r1"/>
  <text x="297.0" y="132.0" class="num">t2</text>
  <path d="M327 126H349" class="arr"/>
  <text x="356" y="133" class="label">E0 / E1</text>
  <rect x="270" y="149" width="54" height="30" rx="4" class="r1"/>
  <text x="297.0" y="170.0" class="num">t3</text>
  <path d="M327 164H349" class="arr"/>
  <text x="356" y="171" class="label">E1 / E2</text>
  <rect x="18" y="206" width="464" height="144" rx="10" class="card"/>
  <text x="30" y="232" class="subhead">Rank 0</text>
  <text x="470" y="232" class="subhead" text-anchor="end">Rank 1</text>
  <text x="250" y="254" class="label" text-anchor="middle">t1 → E2 · 1 份 = 16 B</text>
  <path d="M42 265H458" class="arr"/>
  <text x="250" y="291" class="label" text-anchor="middle">t2 → E0、E1；t3 → E1</text>
  <text x="250" y="313" class="label" text-anchor="middle">3 份 = 48 B</text>
  <path d="M458 324H42" class="arr"/>
  <text x="250" y="343" class="small" text-anchor="middle">本例远端派发共 64 B</text>
  <rect x="18" y="362" width="224" height="124" rx="10" class="panel"/>
  <text x="30" y="389" class="subhead">Rank 0 · 专家输入</text>
  <text x="31" y="422" class="label">E0</text>
  <rect x="72" y="400" width="43" height="29" rx="4" class="r0"/>
  <text x="93.5" y="420.5" class="num">t0</text>
  <rect x="121" y="400" width="43" height="29" rx="4" class="r0"/>
  <text x="142.5" y="420.5" class="num">t1</text>
  <rect x="170" y="400" width="43" height="29" rx="4" class="r1"/>
  <text x="191.5" y="420.5" class="num">t2</text>
  <text x="31" y="459" class="label">E1</text>
  <rect x="72" y="437" width="43" height="29" rx="4" class="r0"/>
  <text x="93.5" y="457.5" class="num">t0</text>
  <rect x="121" y="437" width="43" height="29" rx="4" class="r1"/>
  <text x="142.5" y="457.5" class="num">t2</text>
  <rect x="170" y="437" width="43" height="29" rx="4" class="r1"/>
  <text x="191.5" y="457.5" class="num">t3</text>
  <rect x="258" y="362" width="224" height="124" rx="10" class="panel"/>
  <text x="270" y="389" class="subhead">Rank 1 · 专家输入</text>
  <text x="271" y="422" class="label">E2</text>
  <rect x="312" y="400" width="43" height="29" rx="4" class="r0"/>
  <text x="333.5" y="420.5" class="num">t1</text>
  <rect x="361" y="400" width="43" height="29" rx="4" class="r1"/>
  <text x="382.5" y="420.5" class="num">t3</text>
  <text x="24" y="515" class="label">全批 8 份（含本地）= 128 B；远端 64 B。</text>
  <text x="24" y="539" class="small">每次专家分配单独传向量，不计元数据与填充。</text>
</svg>
