  <path d="M102 295H151" class="arr0"/>
  <text x="126" y="285" class="small" text-anchor="middle">乘加</text>
  <text x="74" y="369" class="small" text-anchor="middle">4 B</text>
  <text x="178" y="342" class="small" text-anchor="middle">4 B</text>
  <text x="178" y="366" class="small" text-anchor="middle">8 MAC</text>
  <rect x="258" y="80" width="224" height="309" rx="10" class="panel"/>
  <text x="270" y="107" class="subhead">Rank 1 · 卡 1</text>
  <text x="270" y="132" class="label">X 完整 · 8 B</text>
  <rect x="298" y="143" width="34" height="28" rx="3" class="full"/>
  <text x="315.0" y="163.0" class="num">2</text>
  <rect x="334" y="143" width="34" height="28" rx="3" class="full"/>
  <text x="351.0" y="163.0" class="num">1</text>
  <rect x="370" y="143" width="34" height="28" rx="3" class="full"/>
