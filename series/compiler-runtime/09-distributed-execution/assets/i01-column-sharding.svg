  <rect x="296" y="324" width="36" height="26" rx="3" class="r1"/>
  <text x="314.0" y="343.0" class="num">4</text>
  <rect x="400" y="268" width="36" height="26" rx="3" class="r1"/>
  <text x="418.0" y="287.0" class="num">29</text>
  <rect x="400" y="296" width="36" height="26" rx="3" class="r1"/>
  <text x="418.0" y="315.0" class="num">16</text>
  <path d="M342 295H391" class="arr1"/>
  <text x="366" y="285" class="small" text-anchor="middle">乘加</text>
  <text x="314" y="369" class="small" text-anchor="middle">4 B</text>
  <text x="418" y="342" class="small" text-anchor="middle">4 B</text>
  <text x="418" y="366" class="small" text-anchor="middle">8 MAC</text>
  <text x="250" y="411" class="subhead" text-anchor="middle">若下个算子要求两端都有完整 Y</text>
  <rect x="18" y="422" width="464" height="115" rx="10" class="card"/>
  <text x="32" y="450" class="label">Rank 0</text>
  <text x="468" y="450" class="label" text-anchor="end">Rank 1</text>
  <text x="250" y="458" class="small" text-anchor="middle">第 0 列 · 4 B</text>
  <path d="M55 468H445" class="arr0"/>
