<svg xmlns="http://www.w3.org/2000/svg" width="500" height="675" viewBox="0 0 500 675" role="img" aria-labelledby="title desc">
  <title id="title">W 按输出列切分：两张卡各自产生完整的一列</title>
  <desc id="desc">两张卡都持有完整 X（两行四列），Rank 0 只持有 W 的第 0 列，Rank 1 只持有 W 的第 1 列。计算分别得到 Y 的第 0 列 [21,17] 和第 1 列 [29,16]，局部计算不需要跨卡通信。如果后续两张卡都需要完整 Y，可以用直接的双向 AllGather 互发自己的一列，每 Rank 发送 4 B；按列号重组为两行两列的 Y。图中 1 B 的输入元素、2 B 的输出元素均为有效载荷，不含协议开销。</desc>
  <defs>
    <marker id="arrow0" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <marker id="arrow1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c7b42"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr0 { fill: none; stroke: #527d64; stroke-width: 2; marker-end: url(#arrow0); }
    .arr1 { fill: none; stroke: #9c7b42; stroke-width: 2; marker-end: url(#arrow1); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .dashed { fill: none; stroke: #9c7b42; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .comm { fill: #c1dac6; stroke: #6f9a80; stroke-width: 1.4; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="673" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">按输出列切分 W</text>
  <text x="24" y="58" class="label">X/W 每元素 1 B；Y 每元素 2 B</text>
  <rect x="18" y="80" width="224" height="309" rx="10" class="panel"/>
  <text x="30" y="107" class="subhead">Rank 0 · 卡 0</text>
  <text x="30" y="132" class="label">X 完整 · 8 B</text>
  <rect x="58" y="143" width="34" height="28" rx="3" class="full"/>
  <text x="75.0" y="163.0" class="num">2</text>
  <rect x="94" y="143" width="34" height="28" rx="3" class="full"/>
  <text x="111.0" y="163.0" class="num">1</text>
