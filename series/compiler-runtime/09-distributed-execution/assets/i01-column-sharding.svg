  <path d="M445 510H55" class="arr1"/>
  <text x="250" y="561" class="subhead" text-anchor="middle">AllGather 后：两端均得到完整 Y</text>
  <rect x="214" y="575" width="34" height="28" rx="3" class="r0"/>
  <text x="231.0" y="595.0" class="num">21</text>
