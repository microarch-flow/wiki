<svg xmlns="http://www.w3.org/2000/svg" width="500" height="413" viewBox="0 0 500 413" role="img" aria-labelledby="title desc">
  <title id="title">相同总分配次数，不均匀的专家负载</title>
  <desc id="desc">八个 Token，四个专家，Top-2，每 Rank 持有一个专家。所有 Token t0 至 t7 都选 E0；t0 至 t3 再选 E1；t4 至 t6 再选 E2；t7 再选 E3。专家分配数为 8、4、3、1，合计 16 次，平均 4 次。在所有输入就绪、各 Rank 可并行、每个专家每拍依次处理一个向量、忽略通信和其他开销的教学模型中，Rank 0 需 8 拍，其他 Rank 分别需要 4、3、1 拍，其余时间空闲；等待全部专家结果的关键路径为 8 拍，并非实测。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#527d64"/></marker>
    <marker id="arrowback" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6 0L0 3L6 6Z" fill="#527d64"/></marker>
  </defs>

  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; font-size: 18px; }
    .head { font-size: 23px; font-weight: 700; } .subhead { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; fill: #416354; } .small { font-size: 16px; fill: #416354; }
    .num { font-size: 18px; text-anchor: middle; font-weight: 600; }
    .panel { fill: #edf2e8; stroke: #9ab69e; stroke-width: 1.4; }
    .card { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; }
    .r0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25; }
    .r1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25; }
    .r2 { fill: #dce8e9; stroke: #7a969b; stroke-width: 1.25; }
    .full { fill: #eaeedf; stroke: #9ab69e; stroke-width: 1.25; }
    .arr { fill: none; stroke: #527d64; stroke-width: 1.8; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #527d64; stroke-width: 1.7; marker-start: url(#arrowback); marker-end: url(#arrow); }
    .candidate { fill: none; stroke: #527d64; stroke-width: 2; stroke-dasharray: 3 2; marker-end: url(#arrow); }
    .guide { stroke: #c4d0c4; stroke-width: 1; stroke-dasharray: 3 3; }
    .wait { fill: #f9f8ef; stroke: #b8ba9e; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tick { font-size: 15px; fill: #416354; }
  </style>
  <rect x="1" y="1" width="498" height="411" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">平均每个专家 4 份，哪张卡最慢？</text>
  <text x="24" y="58" class="label">8 个 Token · Top-2 · 4 Rank 各持 1 个专家</text>
  <rect x="18" y="76" width="464" height="254" rx="10" class="panel"/>
  <text x="30" y="102" class="small">时隙/拍</text>
  <text x="166.5" y="102" class="tick" text-anchor="middle">1</text>
  <text x="206.5" y="102" class="tick" text-anchor="middle">2</text>
  <text x="246.5" y="102" class="tick" text-anchor="middle">3</text>
  <text x="286.5" y="102" class="tick" text-anchor="middle">4</text>
  <text x="326.5" y="102" class="tick" text-anchor="middle">5</text>
  <text x="366.5" y="102" class="tick" text-anchor="middle">6</text>
  <text x="406.5" y="102" class="tick" text-anchor="middle">7</text>
  <text x="446.5" y="102" class="tick" text-anchor="middle">8</text>
  <text x="30" y="128" class="small">Rank 0 · E0</text>
  <text x="30" y="149" class="label">8 份</text>
  <rect x="147" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="165.5" y="138.0" class="num">t0</text>
  <rect x="187" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="205.5" y="138.0" class="num">t1</text>
  <rect x="227" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="245.5" y="138.0" class="num">t2</text>
  <rect x="267" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="285.5" y="138.0" class="num">t3</text>
  <rect x="307" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="325.5" y="138.0" class="num">t4</text>
  <rect x="347" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="365.5" y="138.0" class="num">t5</text>
  <rect x="387" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="405.5" y="138.0" class="num">t6</text>
  <rect x="427" y="113" width="37" height="38" rx="4" class="r0"/>
  <text x="445.5" y="138.0" class="num">t7</text>
  <text x="30" y="175" class="small">Rank 1 · E1</text>
  <text x="30" y="196" class="label">4 份</text>
  <rect x="147" y="160" width="37" height="38" rx="4" class="r0"/>
  <text x="165.5" y="185.0" class="num">t0</text>
  <rect x="187" y="160" width="37" height="38" rx="4" class="r0"/>
  <text x="205.5" y="185.0" class="num">t1</text>
  <rect x="227" y="160" width="37" height="38" rx="4" class="r0"/>
  <text x="245.5" y="185.0" class="num">t2</text>
  <rect x="267" y="160" width="37" height="38" rx="4" class="r0"/>
  <text x="285.5" y="185.0" class="num">t3</text>
  <rect x="307" y="160" width="157" height="38" rx="4" class="wait"/>
  <text x="385.5" y="185" class="small" text-anchor="middle">空闲</text>
  <text x="30" y="222" class="small">Rank 2 · E2</text>
  <text x="30" y="243" class="label">3 份</text>
  <rect x="147" y="207" width="37" height="38" rx="4" class="r0"/>
  <text x="165.5" y="232.0" class="num">t4</text>
  <rect x="187" y="207" width="37" height="38" rx="4" class="r0"/>
  <text x="205.5" y="232.0" class="num">t5</text>
  <rect x="227" y="207" width="37" height="38" rx="4" class="r0"/>
  <text x="245.5" y="232.0" class="num">t6</text>
  <rect x="267" y="207" width="197" height="38" rx="4" class="wait"/>
  <text x="365.5" y="232" class="small" text-anchor="middle">空闲</text>
  <text x="30" y="269" class="small">Rank 3 · E3</text>
  <text x="30" y="290" class="label">1 份</text>
  <rect x="147" y="254" width="37" height="38" rx="4" class="r0"/>
  <text x="165.5" y="279.0" class="num">t7</text>
  <rect x="187" y="254" width="277" height="38" rx="4" class="wait"/>
  <text x="325.5" y="279" class="small" text-anchor="middle">空闲</text>
  <text x="250" y="318" class="small" text-anchor="middle">每格 1 次专家计算；所有输入已就绪</text>
  <text x="24" y="355" class="label">分配总数 16 次，平均 4 次，最长路径 8 拍。</text>
  <text x="24" y="379" class="small">假设每向量等成本、每专家依次处理。</text>
  <text x="24" y="402" class="small">不计通信与其它开销，只是教学时间线。</text>
</svg>
