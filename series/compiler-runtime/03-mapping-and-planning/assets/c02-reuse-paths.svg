<svg xmlns="http://www.w3.org/2000/svg" width="420" height="542" viewBox="0 0 420 542" role="img" aria-labelledby="title desc">
  <title id="title">按行分工时，一个元素怎样被使用两次</title>
  <desc id="desc">两图都只画 k=0。上图中，第一轮从共享 SRAM 读出 W[0,0]=3 一次，分发路径分别向 P0、P1 交付一份。P0 把 2×3 加进 Y[0,0]，P1 把 1×3 加进 Y[1,0]。下图中，X[0,0]=2 预先从共享 SRAM 进入 P0 的本地槽。第一轮 P0 用它乘以 W[0,0]=3，第二轮仍用槽中的 2 乘以 W[0,1]=1，分别更新 Y[0,0] 和 Y[0,1]。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#476957"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35 }
      .heading { font-size: 21px; font-weight: 700 }
      .sub { font-size: 16px; fill: #416354 }
      .name { font-size: 17px; font-weight: 700; text-anchor: middle }
      .value { font-size: 16px; text-anchor: middle }
      .node { fill: #e9eee4; stroke: #97ad9a; stroke-width: 1.25 }
      .p0 { fill: #d9e9dc; stroke: #729582; stroke-width: 1.25 }
      .p1 { fill: #f2e4c9; stroke: #aa9163; stroke-width: 1.25 }
      .wire { fill: none; stroke: #476957; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
    </style>
  </defs>
  <rect x="1" y="1" width="418" height="540" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <g aria-label="同一轮向两个单元交付权重">
    <text x="18" y="32" class="heading">第一轮，同一个权重送给两个单元</text>
    <text x="18" y="58" class="sub">只看 k = 0，目标支持一次读取后分发。</text>
    <rect x="118" y="73" width="184" height="57" rx="6" class="node"/>
    <text x="210" y="96" class="name">共享 SRAM</text>
    <text x="210" y="118" class="value">W[0,0] = 3</text>
    <path d="M210 130V155" class="wire"/>
    <text x="220" y="149" class="sub">读取 1 次</text>
    <circle cx="210" cy="155" r="3" fill="#476957"/>
    <path d="M210 155H110V186" class="wire" marker-end="url(#arrow)"/>
    <path d="M210 155H310V186" class="wire" marker-end="url(#arrow)"/>
    <text x="120" y="178" class="sub">交付 1 份</text>
    <text x="320" y="178" class="sub">交付 1 份</text>
    <rect x="18" y="189" width="184" height="58" rx="6" class="p0"/>
    <rect x="218" y="189" width="184" height="58" rx="6" class="p1"/>
    <text x="110" y="212" class="name">P0</text>
    <text x="110" y="234" class="value">2 × 3 加进 Y[0,0]</text>
    <text x="310" y="212" class="name">P1</text>
    <text x="310" y="234" class="value">1 × 3 加进 Y[1,0]</text>
  </g>
  <path d="M18 268H402" stroke="#c4d0c4"/>
  <g aria-label="同一单元在先后两轮读取保留在本地的数据">
    <text x="18" y="301" class="heading">两轮之间，P0 留住同一个输入</text>
    <text x="18" y="328" class="sub">仍只看 k = 0，X[0,0] 从共享 SRAM 搬入一次。</text>
    <rect x="18" y="349" width="384" height="175" rx="9" fill="#eaf2e9" stroke="#9bb4a0" stroke-width="1.25"/>
    <text x="32" y="376" class="sub">P0</text>
    <rect x="32" y="402" width="114" height="81" rx="6" class="node"/>
    <text x="89" y="427" class="name">本地槽</text>
    <text x="89" y="454" class="value">X[0,0] = 2</text>
    <text x="89" y="475" class="value">两轮间保留</text>
    <path d="M146 442H166M166 442V408H187M166 442V485H187" class="wire"/>
    <path d="M180 408H190" class="wire" marker-end="url(#arrow)"/>
    <path d="M180 485H190" class="wire" marker-end="url(#arrow)"/>
    <rect x="193" y="379" width="193" height="61" rx="6" class="p0"/>
    <rect x="193" y="454" width="193" height="61" rx="6" class="p0"/>
    <text x="289.5" y="403" class="name">第一轮</text>
    <text x="289.5" y="426" class="value">2 × 3 加进 Y[0,0]</text>
    <text x="289.5" y="478" class="name">第二轮</text>
    <text x="289.5" y="501" class="value">2 × 1 加进 Y[0,1]</text>
  </g>
</svg>
