  <rect x="18" y="544" width="464" height="68" rx="9" class="warn-panel"/>
  <text x="32" y="568" class="warn">停止：y4 已生成，但没有 y4 的有效 KV。</text>
  <text x="32" y="592" class="small">请求资源按依赖安全归还，可保留可复用缓存。</text>
  <text x="250" y="627" class="small" text-anchor="middle">逻辑状态计数，不是物理缓存占用或客户端收取时刻。</text>
</svg>
