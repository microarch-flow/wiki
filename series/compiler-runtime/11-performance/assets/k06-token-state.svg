<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 636" width="500" height="636" role="img" aria-labelledby="title desc">
  <title id="title">同一请求 A 的四次模型前向与 KV 有效状态</title>
  <desc id="desc">沿 G02 普通全因果 decoder-only 生成：8个输入 token p1到p8，4个输出 token y1到y4。不启用前缀命中、分块或投机、不提前停止。初始8个输入已知但未计算，KV有效位置0。Prefill 输入p1到p8并在完成相关层状态写入和采样后得到 y1，已知9，KV8。第一次Decode 将 y1 当输入，采样 y2，已知10，KV9。第二次Decode 输入 y2，采样 y3，已知11，KV10。第三次Decode 输入 y3，采样 y4，已知12，KV11。y4已经生成，未作为后续模型输入，因此没有对应有效KV。结束后请求持有的资源在依赖已满足后归还，缓存可按机制保留可复用内容，逻辑有效位置不等于物理占用或已送达客户端的token。两种框架均沿同一逻辑语义观察；图不表示实际执行时间或某框架必然采用相同分配粒度。</desc>
  <defs><style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:17px;fill:#416354}.tick{font-size:16px;fill:#416354}
      .panel{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.grid{stroke:#c4d0c4;stroke-width:1;stroke-dasharray:3 3}.axis{stroke:#8b9c8e;stroke-width:1.3;fill:none}
      .idle{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1}.warn{fill:#765820;font-weight:600}.warn-panel{fill:#f6efe0;stroke:#b9914e;stroke-width:1.5}
      .done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.3;stroke-dasharray:3 3}.token{font-size:17px;font-weight:600}.line{stroke:#c4d0c4;stroke-width:1.2;fill:none}.edge{fill:none;stroke:#527d64;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
  </defs>
  <rect x="1" y="1" width="498" height="634" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">沿同一 A 观察 Token 与 KV 状态</text>
  <text x="24" y="60" class="small">8 输入、4 输出；完整 Prefill，无前缀复用。</text>
  <rect x="24" y="76" width="20" height="18" rx="4" class="done"/>
  <text x="52" y="91" class="small">已计算，KV 有效</text>
  <rect x="254" y="76" width="20" height="18" rx="4" class="known"/>
  <text x="282" y="91" class="small">已知但未计算</text>
  <rect x="24" y="99" width="20" height="18" rx="4" class="unknown"/>
  <text x="52" y="114" class="small">尚未选出的 Token 位置</text>
  <text x="171" y="146" class="label" text-anchor="middle">输入 p1–p8</text>
  <text x="402" y="146" class="label" text-anchor="middle">生成 y1–y4</text>
  <path d="M24 151L318 151" class="line"/>
  <path d="M329 151L475 151" class="line"/>
