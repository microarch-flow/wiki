  <rect x="440" y="202" width="34" height="26" rx="4" class="unknown"/>
  <text x="457" y="221" class="token" text-anchor="middle">y4</text>
  <text x="24" y="252" class="subhead">Prefill</text>
  <text x="475" y="252" class="label" text-anchor="end">已知 9 · 有效 KV 8</text>
  <text x="24" y="274" class="small">本轮输入 p1–p8 → 采样 y1</text>
  <rect x="24" y="278" width="34" height="26" rx="4" class="done"/>
  <text x="41" y="297" class="token" text-anchor="middle">p1</text>
  <rect x="61" y="278" width="34" height="26" rx="4" class="done"/>
  <text x="78" y="297" class="token" text-anchor="middle">p2</text>
  <rect x="98" y="278" width="34" height="26" rx="4" class="done"/>
