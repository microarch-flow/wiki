  <rect x="366" y="278" width="34" height="26" rx="4" class="unknown"/>
  <text x="383" y="297" class="token" text-anchor="middle">y2</text>
  <rect x="403" y="278" width="34" height="26" rx="4" class="unknown"/>
  <text x="420" y="297" class="token" text-anchor="middle">y3</text>
  <rect x="440" y="278" width="34" height="26" rx="4" class="unknown"/>
  <text x="457" y="297" class="token" text-anchor="middle">y4</text>
  <text x="24" y="328" class="subhead">Decode 1</text>
  <text x="475" y="328" class="label" text-anchor="end">已知 10 · 有效 KV 9</text>
  <text x="24" y="350" class="small">本轮输入 y1 → 采样 y2</text>
  <rect x="24" y="354" width="34" height="26" rx="4" class="done"/>
