  <rect x="61" y="354" width="34" height="26" rx="4" class="done"/>
  <text x="78" y="373" class="token" text-anchor="middle">p2</text>
  <rect x="98" y="354" width="34" height="26" rx="4" class="done"/>
  <text x="115" y="373" class="token" text-anchor="middle">p3</text>
  <rect x="135" y="354" width="34" height="26" rx="4" class="done"/>
