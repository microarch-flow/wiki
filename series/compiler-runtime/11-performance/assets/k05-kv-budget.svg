<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 638" width="500" height="638" role="img" aria-labelledby="title desc">
  <title id="title">固定预分配 KV 块池：当前容量与下一轮可推进数量不是同一问题</title>
  <desc id="desc">原始 Llama 3 70B 四张 H100 SXM 80 GB，TP=4，圆整参数量和均衡切分的教学假设：每 rank 标称80 GB，构造可用72 GB，权重35 GB、其他2 GB、KV预分配池35 GB；另8 GB不计入假设的可用预算。聚合权重140 GB、其他8 GB、固定KV池140 GB。每个16位置逻辑块跨四卡5.24288 MB，单rank1.31072 MB；固定池提供26702个完整逻辑块。104条每条4096个历史位置，每条256整块，共26624个已用块，78块空闲。下一轮每条都需新的块，共需104个，至少差26个。上图预算与块池概览按比例绘制，底图78和104块为局部放大比较，非池容量增长。GB和MB使用十进制；不是实测。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:17px;fill:#416354}.tick{font-size:16px;fill:#416354}
      .panel{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.grid{stroke:#c4d0c4;stroke-width:1;stroke-dasharray:3 3}.axis{stroke:#8b9c8e;stroke-width:1.3;fill:none}
      .idle{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1}.warn{fill:#765820;font-weight:600}.warn-panel{fill:#f6efe0;stroke:#b9914e;stroke-width:1.5}
      .weights{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.2}.other{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.2}.pool{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.2}.reserve{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.2}.used{fill:#c1dac6;stroke:#6f9a80;stroke-width:.75}.free{fill:#91b6d0;stroke:none}.need{fill:#f9f8ef;stroke:#7d9eb1;stroke-width:1.2}.lack{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.2}.marker{fill:none;stroke:#51675a;stroke-width:1.4}.num{font-size:17px;font-weight:600}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
  </defs>
  <rect x="1" y="1" width="498" height="636" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24.0000" y="34.0000" class="head">104 条历史放得下，下一轮呢？</text>
  <text x="24.0000" y="60.0000" class="small">Llama 3 70B，4 × H100 80 GB，TP=4。</text>
  <text x="24.0000" y="84.0000" class="small">圆整模型与均衡切分假设；GB/MB 为十进制。</text>
  <rect x="18.0000" y="100.0000" width="464.0000" height="182.0000" rx="10" class="panel"/>
  <text x="32.0000" y="126.0000" class="subhead">每个 rank 的预算（4 个均相同）</text>
  <path d="M32.0000 147.0000L424.4000 147.0000" class="marker"/>
  <path d="M32.0000 147.0000L32.0000 151.0000" class="marker"/>
  <path d="M424.4000 147.0000L424.4000 151.0000" class="marker"/>
  <text x="228.2000" y="143.0000" class="small" text-anchor="middle">构造可用 72 GB</text>
  <rect x="32.0000" y="158.0000" width="190.7500" height="34.0000" rx="0" class="weights"/>
  <text x="127.3750" y="181.0000" class="num" text-anchor="middle">权重 35</text>
  <rect x="222.7500" y="158.0000" width="10.9000" height="34.0000" rx="0" class="other"/>
  <rect x="233.6500" y="158.0000" width="190.7500" height="34.0000" rx="0" class="pool"/>
  <text x="329.0250" y="181.0000" class="num" text-anchor="middle">KV 池 35</text>
  <rect x="424.4000" y="158.0000" width="43.6000" height="34.0000" rx="0" class="reserve"/>
  <text x="446.2000" y="181.0000" class="num" text-anchor="middle">8</text>
  <rect x="32.0000" y="206.0000" width="15.0000" height="15.0000" rx="2" class="other"/>
  <text x="54.0000" y="219.0000" class="small">其他 2 GB/rank</text>
  <rect x="249.0000" y="206.0000" width="15.0000" height="15.0000" rx="2" class="reserve"/>
  <text x="271.0000" y="219.0000" class="small">8 GB/rank 不计入预算</text>
  <text x="32.0000" y="248.0000" class="small">聚合：权重 140 GB，其他 8 GB</text>
  <text x="32.0000" y="272.0000" class="label">固定预分配 KV 池：140 GB</text>
  <rect x="18.0000" y="294.0000" width="464.0000" height="168.0000" rx="10" class="panel"/>
  <text x="32.0000" y="319.0000" class="subhead">KV 池内的逻辑块划分</text>
  <text x="32.0000" y="344.0000" class="small">每块 16 位置：四卡 5.24288 MB</text>
  <text x="32.0000" y="367.0000" class="small">单 rank 1.31072 MB；共 26,702 个整块。</text>
  <text x="32.0000" y="390.0000" class="small">每条历史 4,096 位置 → 256 个整块。</text>
  <rect x="32.0000" y="399.0000" width="436.0000" height="20.0000" rx="0" class="need"/>
  <rect x="32.0000" y="399.0000" width="434.7264" height="20.0000" rx="0" class="used"/>
  <rect x="466.7264" y="399.0000" width="1.2736" height="20.0000" rx="0" class="free"/>
  <text x="32.0000" y="445.0000" class="label">104 × 256 = 26,624 已用；78 块空闲。</text>
  <rect x="18.0000" y="474.0000" width="464.0000" height="137.0000" rx="10" class="warn-panel"/>
  <text x="32.0000" y="499.0000" class="subhead">下一轮：比较所需空闲块（局部放大）</text>
  <text x="139.0000" y="533.0000" class="label" text-anchor="end">现有空闲</text>
  <rect x="151.0000" y="512.0000" width="159.9000" height="29.0000" rx="3" class="pool"/>
  <text x="318.9000" y="533.0000" class="label">78 块</text>
  <text x="139.0000" y="567.0000" class="label" text-anchor="end">下一轮所需</text>
  <rect x="151.0000" y="546.0000" width="213.2000" height="29.0000" rx="3" class="need"/>
  <rect x="310.9000" y="546.0000" width="53.3000" height="29.0000" rx="2" class="lack"/>
  <text x="372.2000" y="567.0000" class="label">104 块</text>
  <text x="32.0000" y="599.0000" class="warn">还缺至少 26 块；不能同时推进全部 104 条。</text>
  <text x="250.0000" y="627.0000" class="small" text-anchor="middle">块在固定池内改变归属，池显存未增长；非实测。</text>
</svg>
