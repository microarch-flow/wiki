  <rect x="277.0" y="195" width="15.5" height="29" rx="2" class="device"/>
  <path d="M154.0 227L183.0 227" class="gap"/>
  <path d="M200.5 227L229.5 227" class="gap"/>
  <path d="M247.0 227L276.0 227" class="gap"/>
  <text x="32" y="252" class="warn">设备在等下一项提交，存在空闲间隔。</text>
  <text x="32" y="275" class="label">100 个：总耗时 301 μs，GPU 忙碌 100 μs。</text>
  <text x="32" y="294" class="small">Host 提交累计 300 μs。</text>
  <rect x="18" y="314" width="464" height="199" rx="10" class="panel"/>
  <text x="32" y="341" class="subhead">内核服务时间：5 μs</text>
  <text x="464" y="340" class="tick" text-anchor="end">时间（μs）</text>
  <path d="M91.0 367L463.0 367" class="axis"/>
