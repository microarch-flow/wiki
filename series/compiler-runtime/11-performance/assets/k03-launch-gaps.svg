  <text x="80" y="216" class="label" text-anchor="end">设备</text>
  <rect x="91.0" y="195" width="372.0" height="29" rx="3" class="idle"/>
  <rect x="137.5" y="195" width="15.5" height="29" rx="2" class="device"/>
  <rect x="184.0" y="195" width="15.5" height="29" rx="2" class="device"/>
