  <text x="463.0" y="359" class="tick" text-anchor="middle">24</text>
  <path d="M463.0 367L463.0 438" class="grid"/>
  <text x="80" y="394" class="label" text-anchor="end">Host</text>
  <rect x="91.0" y="373" width="372.0" height="29" rx="3" class="idle"/>
  <rect x="91.0" y="373" width="46.5" height="29" rx="2" class="host"/>
  <text x="114.25" y="394" class="slot" text-anchor="middle">1</text>
  <rect x="137.5" y="373" width="46.5" height="29" rx="2" class="host"/>
  <text x="160.75" y="394" class="slot" text-anchor="middle">2</text>
  <rect x="184.0" y="373" width="46.5" height="29" rx="2" class="host"/>
  <text x="207.25" y="394" class="slot" text-anchor="middle">3</text>
  <rect x="230.5" y="373" width="46.5" height="29" rx="2" class="host"/>
  <text x="253.75" y="394" class="slot" text-anchor="middle">4</text>
  <text x="80" y="429" class="label" text-anchor="end">设备</text>
  <rect x="91.0" y="408" width="372.0" height="29" rx="3" class="idle"/>
  <rect x="137.5" y="408" width="77.5" height="29" rx="2" class="device"/>
  <text x="176.25" y="429" class="slot" text-anchor="middle">1</text>
