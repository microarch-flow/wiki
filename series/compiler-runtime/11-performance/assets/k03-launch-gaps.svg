  <text x="32" y="465" class="label">首项开始后，设备连续执行，无任务间空隙。</text>
  <text x="32" y="488" class="label">100 个：总耗时 503 μs，GPU 忙碌 500 μs。</text>
  <text x="32" y="507" class="small">Host 提交累计 300 μs。</text>
  <text x="250" y="537" class="small" text-anchor="middle">教学时间模型；忽略其他开销，非实测。</text>
</svg>
