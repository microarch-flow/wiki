<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 548" width="500" height="548" role="img" aria-labelledby="title desc">
  <title id="title">主机提交固定，短内核的设备执行可能有空隙</title>
  <desc id="desc">沿 F04 的教学模型，同一个有序流，主机每3微秒提交一个内核，在该次提交结束后设备任务可执行。前四个主机提交分别为0–3、3–6、6–9、9–12 微秒。若每个内核服务时间1微秒，设备分别执行 3–4、6–7、9–10、12–13 微秒，任务之间有空隙。100个内核总时间301微秒，CPU提交累计300微秒，GPU忙碌100微秒。若内核服务5微秒，设备分别执行3–8、8–13、13–18、18–23 微秒，100个内核总时间503微秒，CPU提交累计300微秒，GPU忙碌500微秒。第一排和第二排使用同一时间尺度，只显示前4个任务，100个任务的数据由同样假设推得，不是实测。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:17px;fill:#416354}.tick{font-size:16px;fill:#416354}
      .panel{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.grid{stroke:#c4d0c4;stroke-width:1;stroke-dasharray:3 3}.axis{stroke:#8b9c8e;stroke-width:1.3;fill:none}
      .idle{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1}.warn{fill:#765820;font-weight:600}.warn-panel{fill:#f6efe0;stroke:#b9914e;stroke-width:1.5}
      .host{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.2}.device{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.2}.slot{font-size:17px;font-weight:600}.gap{stroke:#9c7b42;stroke-width:2;stroke-dasharray:3 2;fill:none}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
  </defs>
  <rect x="1" y="1" width="498" height="546" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">是内核慢，还是任务送不进去？</text>
  <text x="24" y="61" class="small">每次 Host 提交耗时 3 μs；结束后设备可启动。</text>
  <text x="24" y="86" class="small">图示前四个内核，100 个的数据另行汇总。</text>
  <rect x="18" y="101" width="464" height="199" rx="10" class="panel"/>
  <text x="32" y="128" class="subhead">内核服务时间：1 μs</text>
  <text x="464" y="127" class="tick" text-anchor="end">时间（μs）</text>
  <path d="M91.0 154L463.0 154" class="axis"/>
  <text x="91.0" y="146" class="tick" text-anchor="middle">0</text>
  <path d="M91.0 154L91.0 225" class="grid"/>
