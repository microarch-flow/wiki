<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 564" width="500" height="564" role="img" aria-labelledby="title desc">
  <title id="title">到达时间相差一微秒，为什么离散事件模型可能多出一轮</title>
  <desc id="desc">固定预算 5 及相同的成本、KV假设；局部时间轴起点为5.720毫秒。同刻到达时，C在5.720到达，可与 A 的最后一次Decode合成 R5，即 AD1+CP4 在5.720–7.330，然后 CP2至8.530输出 C1、CD1至9.736输出 C2、CD1至10.943输出 C3。若 C 晚到1微秒即5.721，不能参与已开始的 R5；A 的 AD1在5.720–6.930结束，随后 CP5 至8.430、CP1至9.530输出 C1、CD1至10.736输出 C2、CD1至11.943输出 C3。两种情况的 C 首输出相差1ms、结束相差1ms，差别来自工作分组，多出一次轮次固定开销；不是实测。1微秒的到达点间距过小，用文本注明而不夸大时间比例。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:18px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:17px;fill:#416354}.tick{font-size:16px;fill:#416354}
      .panel{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.grid{stroke:#c4d0c4;stroke-width:1;stroke-dasharray:3 3}.axis{stroke:#8b9c8e;stroke-width:1.3;fill:none}
      .idle{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1}.warn{fill:#765820;font-weight:600}.warn-panel{fill:#f6efe0;stroke:#b9914e;stroke-width:1.5}
      .a{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.2}.c{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.2}.mix{fill:#e2e9d5;stroke:#8aa36d;stroke-width:1.4}.slot{font-size:16px;font-weight:600}.out{fill:#426e90;stroke:#f5f6ef;stroke-width:1.2}.arrival{fill:#f5f6ef;stroke:#51675a;stroke-width:2}.mark{stroke:#9c7b42;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
  </defs>
  <rect x="1" y="1" width="498" height="562" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24.000" y="34.000" class="head">仅晚 1 μs，就错过一轮调度？</text>
  <text x="24.000" y="60.000" class="small">预算 5，沿用相同的成本模型与 KV 假设。</text>
  <text x="24.000" y="84.000" class="small">P：Prefill 输入；D：Decode 输入。</text>
  <rect x="18.000" y="99.000" width="464.000" height="195.000" rx="10" class="panel"/>
  <text x="32.000" y="126.000" class="subhead">C 同刻到达</text>
  <text x="32.000" y="154.000" class="label">C 到达 5.720 ms，可以参与 R5。</text>
  <text x="462.000" y="177.000" class="tick" text-anchor="end">时间（ms）</text>
  <path d="M70.000 209.000L453.080 209.000" class="axis"/>
  <text x="70.000" y="200.000" class="tick" text-anchor="middle">5.720</text>
  <path d="M70.000 209.000L70.000 255.000" class="grid"/>
  <text x="168.210" y="200.000" class="tick" text-anchor="middle">7.330</text>
  <path d="M168.210 209.000L168.210 255.000" class="grid"/>
  <text x="241.410" y="200.000" class="tick" text-anchor="middle">8.530</text>
  <path d="M241.410 209.000L241.410 255.000" class="grid"/>
  <text x="314.976" y="200.000" class="tick" text-anchor="middle">9.736</text>
  <path d="M314.976 209.000L314.976 255.000" class="grid"/>
  <text x="388.603" y="200.000" class="tick" text-anchor="middle">10.943</text>
  <path d="M388.603 209.000L388.603 255.000" class="grid"/>
  <rect x="70.000" y="214.000" width="98.210" height="30.000" rx="3" class="mix"/>
  <text x="119.105" y="235.000" class="slot" text-anchor="middle">AD1+CP4</text>
  <rect x="168.210" y="214.000" width="73.200" height="30.000" rx="3" class="c"/>
  <text x="204.810" y="235.000" class="slot" text-anchor="middle">CP2</text>
  <rect x="241.410" y="214.000" width="73.566" height="30.000" rx="3" class="c"/>
  <text x="278.193" y="235.000" class="slot" text-anchor="middle">CD1</text>
  <rect x="314.976" y="214.000" width="73.627" height="30.000" rx="3" class="c"/>
  <text x="351.790" y="235.000" class="slot" text-anchor="middle">CD1</text>
  <circle cx="241.410" cy="245.000" r="5" class="out"/>
  <text x="241.410" y="264.000" class="tick" text-anchor="middle">C1</text>
  <circle cx="314.976" cy="245.000" r="5" class="out"/>
  <text x="314.976" y="264.000" class="tick" text-anchor="middle">C2</text>
  <circle cx="388.603" cy="245.000" r="5" class="out"/>
  <text x="388.603" y="264.000" class="tick" text-anchor="middle">C3</text>
  <text x="32.000" y="284.000" class="label">首输出：8.530；C 完成：10.943 ms。</text>
  <rect x="18.000" y="307.000" width="464.000" height="195.000" rx="10" class="panel"/>
  <text x="32.000" y="334.000" class="subhead">C 晚到 1 μs</text>
  <text x="32.000" y="362.000" class="label">C 到达 5.721 ms，R5 已开始。</text>
  <text x="462.000" y="385.000" class="tick" text-anchor="end">时间（ms）</text>
  <path d="M70.000 417.000L453.080 417.000" class="axis"/>
  <text x="70.000" y="408.000" class="tick" text-anchor="middle">5.720</text>
  <path d="M70.000 417.000L70.000 463.000" class="grid"/>
  <text x="143.810" y="408.000" class="tick" text-anchor="middle">6.930</text>
  <path d="M143.810 417.000L143.810 463.000" class="grid"/>
  <text x="235.310" y="408.000" class="tick" text-anchor="middle">8.430</text>
  <path d="M235.310 417.000L235.310 463.000" class="grid"/>
  <text x="302.410" y="408.000" class="tick" text-anchor="middle">9.530</text>
  <path d="M302.410 417.000L302.410 463.000" class="grid"/>
  <text x="375.976" y="408.000" class="tick" text-anchor="middle">10.736</text>
  <path d="M375.976 417.000L375.976 463.000" class="grid"/>
  <text x="449.603" y="408.000" class="tick" text-anchor="middle">11.943</text>
  <path d="M449.603 417.000L449.603 463.000" class="grid"/>
  <rect x="70.000" y="422.000" width="73.810" height="30.000" rx="3" class="a"/>
  <text x="106.905" y="443.000" class="slot" text-anchor="middle">AD1</text>
  <rect x="143.810" y="422.000" width="91.500" height="30.000" rx="3" class="c"/>
  <text x="189.560" y="443.000" class="slot" text-anchor="middle">CP5</text>
  <rect x="235.310" y="422.000" width="67.100" height="30.000" rx="3" class="c"/>
  <text x="268.860" y="443.000" class="slot" text-anchor="middle">CP1</text>
  <rect x="302.410" y="422.000" width="73.566" height="30.000" rx="3" class="c"/>
  <text x="339.193" y="443.000" class="slot" text-anchor="middle">CD1</text>
  <rect x="375.976" y="422.000" width="73.627" height="30.000" rx="3" class="c"/>
  <text x="412.790" y="443.000" class="slot" text-anchor="middle">CD1</text>
  <circle cx="302.410" cy="453.000" r="5" class="out"/>
  <text x="302.410" y="472.000" class="tick" text-anchor="middle">C1</text>
  <circle cx="375.976" cy="453.000" r="5" class="out"/>
  <text x="375.976" y="472.000" class="tick" text-anchor="middle">C2</text>
  <circle cx="449.603" cy="453.000" r="5" class="out"/>
  <text x="449.603" y="472.000" class="tick" text-anchor="middle">C3</text>
  <text x="32.000" y="492.000" class="label">首输出：9.530；C 完成：11.943 ms。</text>
  <text x="24.000" y="526.000" class="small">到达点相差仅 1 μs，不放大画出间距。</text>
  <text x="250.000" y="552.000" class="small" text-anchor="middle">教学时间模型；图示轮次改变，非实测。</text>
</svg>
