  <path d="M463 385L463 457" class="grid"/>
  <text x="91" y="414" class="label" text-anchor="end">搬运</text>
  <rect x="103" y="392" width="260" height="29" rx="3" class="idle"/>
  <rect x="103" y="392" width="40" height="29" rx="3" class="g1"/>
  <text x="123.0" y="412" class="slot" text-anchor="middle">A₁</text>
  <rect x="143" y="392" width="40" height="29" rx="3" class="g1"/>
  <text x="163.0" y="412" class="slot" text-anchor="middle">B₁</text>
  <rect x="183" y="392" width="40" height="29" rx="3" class="g2"/>
  <text x="203.0" y="412" class="slot" text-anchor="middle">A₂</text>
  <rect x="223" y="392" width="40" height="29" rx="3" class="g2"/>
  <text x="243.0" y="412" class="slot" text-anchor="middle">B₂</text>
  <rect x="263" y="392" width="40" height="29" rx="3" class="g1"/>
  <text x="283.0" y="412" class="slot" text-anchor="middle">W₁</text>
  <rect x="323" y="392" width="40" height="29" rx="3" class="g2"/>
  <text x="343.0" y="412" class="slot" text-anchor="middle">W₂</text>
  <text x="91" y="450" class="label" text-anchor="end">计算</text>
  <rect x="103" y="428" width="260" height="29" rx="3" class="idle"/>
  <rect x="183" y="428" width="60" height="29" rx="3" class="g1"/>
  <text x="213.0" y="448" class="slot" text-anchor="middle">C₁</text>
  <rect x="263" y="428" width="60" height="29" rx="3" class="g2"/>
  <text x="293.0" y="448" class="slot" text-anchor="middle">C₂</text>
  <path d="M303 385V391M303 457V465" class="finish1"/>
  <path d="M363 385V391M363 457V465" class="finishall"/>
  <text x="32" y="486" class="label">第一组完成：10 拍；全部完成：13 拍</text>
  <text x="32" y="512" class="small">窗口内：搬运忙碌 12/13；计算忙碌 6/13</text>
  <text x="250" y="550" class="small" text-anchor="middle">两种日程的时间均为教学假设，非实测。</text>
</svg>
