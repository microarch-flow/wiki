<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 651" width="500" height="651" role="img" aria-labelledby="title desc">
  <title id="title">长 Prefill 完整安排与分块安排的构造时间线</title>
  <desc id="desc">两种安排从 t=16 ms 的共同状态开始；C 在 t=14 ms 到达，A 已生成第 2 个 Token，B 完成。时间按 13 像素每毫秒绘制。整段安排：R3 16–34 ms，A D1，C P12，轮末 A 产生 y3、C 产生 y1；R4 34–38，A D1，C D1，A 完成、C 产生 y2；R5 38–41，C D1，C 完成。A 的第 2 到第 3 个输出间隔 18 ms、下一间隔 4 ms；C TTFT 为 20 ms。分块安排：R3 16–23，A D1、C P4，A 产生 y3；R4 23–31，A D1、C P4，A 产生 y4 完成；R5 31–40，C P4，C 产生 y1；R6 40–43，C D1，C 产生 y2；R7 43–46，C D1，C 产生 y3 完成。A 的两次间隔为 7、8 ms；C TTFT 为 26 ms。示意耗时均为构造值而非实测。</desc>
  <defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
.head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}.token{font-size:18px;font-weight:600}.tiny{font-size:16px;fill:#416354}
.a{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.b{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.c{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.4}.pad{fill:#f5f6ef;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}.outline{stroke:#8b9c8e;stroke-width:1.4;fill:none}.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.axis{stroke:#8b9c8e;stroke-width:1.2;fill:none}.a-mark{fill:#427a5a;stroke:#f5f6ef;stroke-width:1.1}.c-mark{fill:#426e90;stroke:#f5f6ef;stroke-width:1.1}.history{fill:#b7d1e1;stroke:#86a4b7;stroke-width:0.8}.current{fill:#dfe8ef;stroke:#86a4b7;stroke-width:0.8}.masked{fill:#f1f3ec;stroke:#d1dbd0;stroke-width:0.8}</style></defs>
  <rect x="1" y="1" width="498" height="649" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="35" class="head">长提示词怎样影响生成间隔？</text>
  <text x="24" y="61" class="small">14 ms：C 到达；16 ms：A 已生成 y2，B 完成</text>
  <text x="24" y="84" class="small">同一时间尺度；圆点表示轮末新增输出。</text>
  <rect x="24" y="99" width="22" height="18" rx="4" class="a"/>
  <text x="52" y="114" class="small">A：Decode</text>
  <rect x="216" y="99" width="22" height="18" rx="4" class="c"/>
  <text x="244" y="114" class="small">C：Prefill / Decode</text>
  <text x="24" y="147" class="subhead">完整混合：C 的 12 个位置一次安排</text>
  <path d="M52 181H468" class="axis"/>
  <path d="M78 176V186" class="axis"/>
  <text x="78" y="172" class="tiny" text-anchor="middle">16</text>
  <path d="M312 176V186" class="axis"/>
  <text x="312" y="172" class="tiny" text-anchor="middle">34</text>
  <path d="M364 176V186" class="axis"/>
  <text x="364" y="172" class="tiny" text-anchor="middle">38</text>
  <path d="M403 176V186" class="axis"/>
  <text x="403" y="172" class="tiny" text-anchor="middle">41</text>
  <text x="478" y="198" class="tiny" text-anchor="end">ms</text>
  <path d="M52 179V293" class="axis" stroke-dasharray="4 3"/>
  <text x="26" y="219" class="token">A</text>
  <rect x="78" y="199" width="234" height="28" rx="3" class="a"/>
  <text x="195.0" y="219" class="tiny" text-anchor="middle">D1</text>
  <rect x="312" y="199" width="52" height="28" rx="3" class="a"/>
  <text x="338.0" y="219" class="tiny" text-anchor="middle">D1</text>
  <circle cx="78" cy="227" r="4.2" class="a-mark"/>
  <text x="78" y="246" class="small" text-anchor="middle">y2</text>
  <circle cx="312" cy="227" r="4.2" class="a-mark"/>
  <text x="312" y="246" class="small" text-anchor="middle">y3</text>
  <circle cx="364" cy="227" r="4.2" class="a-mark"/>
  <text x="364" y="246" class="small" text-anchor="middle">y4</text>
  <text x="26" y="275" class="token">C</text>
  <path d="M52 269H78" class="axis" stroke-dasharray="4 3"/>
  <rect x="78" y="255" width="234" height="28" rx="3" class="c"/>
  <text x="195.0" y="275" class="tiny" text-anchor="middle">P12</text>
  <rect x="312" y="255" width="52" height="28" rx="3" class="c"/>
  <text x="338.0" y="275" class="tiny" text-anchor="middle">D1</text>
  <rect x="364" y="255" width="39" height="28" rx="3" class="c"/>
  <text x="383.5" y="275" class="tiny" text-anchor="middle">D1</text>
  <circle cx="312" cy="283" r="4.2" class="c-mark"/>
  <text x="312" y="302" class="small" text-anchor="middle">y1</text>
  <circle cx="364" cy="283" r="4.2" class="c-mark"/>
  <text x="364" y="302" class="small" text-anchor="middle">y2</text>
  <circle cx="403" cy="283" r="4.2" class="c-mark"/>
  <text x="403" y="302" class="small" text-anchor="middle">y3</text>
  <text x="24" y="338" class="token">A 的两次 ITL：18 ms、4 ms</text>
  <text x="24" y="363" class="label">C 的 TTFT：34 − 14 = 20 ms</text>
  <path d="M24 374H476" class="line"/>
  <text x="24" y="406" class="subhead">分块混合：C 的提示分三轮推进</text>
  <path d="M52 440H468" class="axis"/>
  <path d="M78 435V445" class="axis"/>
  <text x="78" y="431" class="tiny" text-anchor="middle">16</text>
  <path d="M169 435V445" class="axis"/>
  <text x="169" y="431" class="tiny" text-anchor="middle">23</text>
  <path d="M273 435V445" class="axis"/>
  <text x="273" y="431" class="tiny" text-anchor="middle">31</text>
  <path d="M390 435V445" class="axis"/>
  <text x="390" y="431" class="tiny" text-anchor="middle">40</text>
  <path d="M429 435V445" class="axis"/>
  <text x="429" y="431" class="tiny" text-anchor="middle">43</text>
  <path d="M468 435V445" class="axis"/>
  <text x="468" y="431" class="tiny" text-anchor="middle">46</text>
  <text x="478" y="457" class="tiny" text-anchor="end">ms</text>
  <path d="M52 438V552" class="axis" stroke-dasharray="4 3"/>
  <text x="26" y="478" class="token">A</text>
  <rect x="78" y="458" width="91" height="28" rx="3" class="a"/>
  <text x="123.5" y="478" class="tiny" text-anchor="middle">D1</text>
  <rect x="169" y="458" width="104" height="28" rx="3" class="a"/>
  <text x="221.0" y="478" class="tiny" text-anchor="middle">D1</text>
  <circle cx="78" cy="486" r="4.2" class="a-mark"/>
  <text x="78" y="505" class="small" text-anchor="middle">y2</text>
  <circle cx="169" cy="486" r="4.2" class="a-mark"/>
  <text x="169" y="505" class="small" text-anchor="middle">y3</text>
  <circle cx="273" cy="486" r="4.2" class="a-mark"/>
  <text x="273" y="505" class="small" text-anchor="middle">y4</text>
  <text x="26" y="534" class="token">C</text>
  <path d="M52 528H78" class="axis" stroke-dasharray="4 3"/>
  <rect x="78" y="514" width="91" height="28" rx="3" class="c"/>
  <text x="123.5" y="534" class="tiny" text-anchor="middle">P4</text>
  <rect x="169" y="514" width="104" height="28" rx="3" class="c"/>
  <text x="221.0" y="534" class="tiny" text-anchor="middle">P4</text>
  <rect x="273" y="514" width="117" height="28" rx="3" class="c"/>
  <text x="331.5" y="534" class="tiny" text-anchor="middle">P4</text>
  <rect x="390" y="514" width="39" height="28" rx="3" class="c"/>
  <text x="409.5" y="534" class="tiny" text-anchor="middle">D1</text>
  <rect x="429" y="514" width="39" height="28" rx="3" class="c"/>
  <text x="448.5" y="534" class="tiny" text-anchor="middle">D1</text>
  <circle cx="390" cy="542" r="4.2" class="c-mark"/>
  <text x="390" y="561" class="small" text-anchor="middle">y1</text>
  <circle cx="429" cy="542" r="4.2" class="c-mark"/>
  <text x="429" y="561" class="small" text-anchor="middle">y2</text>
  <circle cx="468" cy="542" r="4.2" class="c-mark"/>
  <text x="468" y="561" class="small" text-anchor="middle">y3</text>
  <text x="24" y="597" class="token">A 的两次 ITL：7 ms、8 ms</text>
  <text x="24" y="622" class="label">C 的 TTFT：40 − 14 = 26 ms</text>
  <text x="250" y="641" class="small" text-anchor="middle">时间为构造示例，并非硬件实测。</text>
</svg>
