<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 789" width="500" height="789" role="img" aria-labelledby="title desc">
  <title id="title">连续批处理的第三轮从工作清单到请求状态更新</title>
  <desc id="desc">连续批处理 R3 开始前，A 已生成 2 个 Token，有效 KV 覆盖 9 个位置，待计算输入为 A 的 y2，位置 10；C 未计算，待处理完整提示 p1 到 p6。工作清单为 A 计算 1 个输入位置、访问 9 个历史 KV，C 计算 6 个输入位置、访问零个历史 KV。打包后有 7 个输入位置，查询边界 [0,1,7]，分别映射到 A 原序列位置 10 以及 C 原序列位置 1 至 6；Attention 不跨请求。该轮完成并选出 Token 后，A 已生成 3 个 Token，有效 KV 10；C 已生成 1 个 Token，有效 KV 6。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}.token{font-size:18px;font-weight:600}.tiny{font-size:16px;fill:#416354}
.a{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.b{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.c{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.4}.pad{fill:#f5f6ef;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}.outline{stroke:#8b9c8e;stroke-width:1.4;fill:none}.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="1" y="1" width="498" height="787" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">连续批的 R3：两条请求，七个新位置</text>
  <text x="24" y="62" class="label">不同请求可在同一轮安排不同阶段的工作</text>
  <rect x="18" y="78" width="464" height="132" rx="10" class="context"/>
  <text x="33" y="107" class="subhead">调度前的请求状态</text>
  <rect x="33" y="121" width="210" height="77" rx="7" class="a"/>
  <rect x="256" y="121" width="210" height="77" rx="7" class="c"/>
  <text x="44" y="146" class="token">A：Decode</text>
  <text x="267" y="146" class="token">C：Prefill</text>
  <text x="44" y="170" class="small">有效 KV：9 个位置</text>
  <text x="267" y="170" class="small">有效 KV：0 个位置</text>
  <text x="44" y="191" class="small">已生成：2 个 Token</text>
  <text x="267" y="191" class="small">已生成：0 个 Token</text>
  <path d="M250 213V231" class="arrow"/>
  <rect x="18" y="239" width="464" height="172" rx="10" class="artifact"/>
  <text x="33" y="269" class="subhead">本轮工作清单</text>
  <text x="58" y="298" class="small" text-anchor="middle">请求</text>
  <text x="132" y="298" class="small" text-anchor="middle">新位置数</text>
  <text x="227" y="298" class="small" text-anchor="middle">旧 KV 数</text>
  <text x="361" y="298" class="small" text-anchor="middle">原序列位置</text>
  <path d="M33 306H466" class="line"/>
  <rect x="35" y="315" width="43" height="32" rx="4" class="a"/>
  <text x="56.5" y="338" class="token" text-anchor="middle">A</text>
  <text x="132" y="338" class="token" text-anchor="middle">1</text>
  <text x="227" y="338" class="token" text-anchor="middle">9</text>
  <text x="361" y="338" class="small" text-anchor="middle">10（y2）</text>
  <rect x="35" y="356" width="43" height="32" rx="4" class="c"/>
  <text x="56.5" y="379" class="token" text-anchor="middle">C</text>
  <text x="132" y="379" class="token" text-anchor="middle">6</text>
  <text x="227" y="379" class="token" text-anchor="middle">0</text>
  <text x="361" y="379" class="small" text-anchor="middle">1–6（p1–p6）</text>
  <path d="M250 416V435" class="arrow"/>
  <rect x="18" y="442" width="464" height="180" rx="10" class="context"/>
  <text x="33" y="471" class="subhead">执行输入：按查询位置打包</text>
  <text x="33" y="496" class="small">原序列位置：</text>
  <rect x="33" y="529" width="58" height="32" rx="4" class="a"/>
  <text x="62" y="551" class="token" text-anchor="middle">y2</text>
  <text x="62" y="521" class="small" text-anchor="middle">10</text>
  <rect x="95" y="529" width="58" height="32" rx="4" class="c"/>
  <text x="124" y="551" class="token" text-anchor="middle">p1</text>
  <text x="124" y="521" class="small" text-anchor="middle">1</text>
  <rect x="157" y="529" width="58" height="32" rx="4" class="c"/>
  <text x="186" y="551" class="token" text-anchor="middle">p2</text>
  <text x="186" y="521" class="small" text-anchor="middle">2</text>
  <rect x="219" y="529" width="58" height="32" rx="4" class="c"/>
  <text x="248" y="551" class="token" text-anchor="middle">p3</text>
  <text x="248" y="521" class="small" text-anchor="middle">3</text>
  <rect x="281" y="529" width="58" height="32" rx="4" class="c"/>
  <text x="310" y="551" class="token" text-anchor="middle">p4</text>
  <text x="310" y="521" class="small" text-anchor="middle">4</text>
  <rect x="343" y="529" width="58" height="32" rx="4" class="c"/>
  <text x="372" y="551" class="token" text-anchor="middle">p5</text>
  <text x="372" y="521" class="small" text-anchor="middle">5</text>
  <rect x="405" y="529" width="58" height="32" rx="4" class="c"/>
  <text x="434" y="551" class="token" text-anchor="middle">p6</text>
  <text x="434" y="521" class="small" text-anchor="middle">6</text>
  <path d="M33 566V572H93V566" class="outline"/>
  <path d="M95 566V572H463V566" class="outline"/>
  <path d="M33 573V579" class="outline"/>
  <text x="33" y="598" class="token" text-anchor="middle">0</text>
  <path d="M95 573V579" class="outline"/>
  <text x="95" y="598" class="token" text-anchor="middle">1</text>
  <path d="M465 573V579" class="outline"/>
  <text x="465" y="598" class="token" text-anchor="middle">7</text>
  <text x="250" y="615" class="small" text-anchor="middle">边界 [0,1,7]，Attention 不跨请求</text>
  <path d="M250 627V645" class="arrow"/>
  <rect x="18" y="653" width="464" height="108" rx="10" class="artifact"/>
  <text x="33" y="681" class="subhead">完成计算并提交生成结果后</text>
  <rect x="33" y="693" width="210" height="56" rx="7" class="a"/>
  <rect x="256" y="693" width="210" height="56" rx="7" class="c"/>
  <text x="44" y="717" class="token">A：已生成 3</text>
  <text x="267" y="717" class="token">C：已生成 1</text>
  <text x="44" y="740" class="small">有效 KV：10 个位置</text>
  <text x="267" y="740" class="small">有效 KV：6 个位置</text>
  <text x="250" y="782" class="small" text-anchor="middle">色块表示请求归属；边界为逻辑偏移。</text>

</svg>
