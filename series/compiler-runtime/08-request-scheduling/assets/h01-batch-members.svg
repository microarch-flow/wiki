<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 779" width="500" height="779" role="img" aria-labelledby="title desc">
  <title id="title">固定成员批与连续批的槽位变化</title>
  <desc id="desc">A、B 同时到达，C 在第 2 轮执行中到达；每轮最多为两个请求安排工作。P 后的数字为该轮 Prefill 处理位置数，D 后为 Decode 处理位置数。固定成员批的七轮为 A P8、B P3；A D1、B D1（B 完成）；A D1；A D1（A 完成）；C P6；C D1；C D1（C 完成）。连续批前两轮相同，第三轮 A D1、C P6，第四轮 A D1（A 完成）、C D1，第五轮 C D1（C 完成）。空框表示没有有效的请求工作，轮次不表示等时执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}.token{font-size:18px;font-weight:600}.tiny{font-size:16px;fill:#416354}
.a{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.b{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.c{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.4}.pad{fill:#f5f6ef;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}.outline{stroke:#8b9c8e;stroke-width:1.4;fill:none}.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="1" y="1" width="498" height="777" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">短请求退出后，能否补入新请求？</text>
  <text x="24" y="62" class="label">每轮最多两个请求；P = Prefill，D = Decode</text>
  <text x="24" y="85" class="small">数字表示本轮新计算位置数，空框表示无工作</text>
  <rect x="25" y="99" width="22" height="18" rx="4" class="a"/>
  <text x="54" y="114" class="small">请求 A</text>
  <rect x="163" y="99" width="22" height="18" rx="4" class="b"/>
  <text x="192" y="114" class="small">请求 B</text>
  <rect x="301" y="99" width="22" height="18" rx="4" class="c"/>
  <text x="330" y="114" class="small">请求 C</text>
  <text x="24" y="154" class="subhead">固定成员批：整批完成才接纳 C</text>
  <text x="42" y="180" class="small" text-anchor="middle">轮</text>
  <text x="134" y="180" class="small" text-anchor="middle">槽位 1</text>
  <text x="244" y="180" class="small" text-anchor="middle">槽位 2</text>
  <text x="313" y="180" class="small">本轮事件</text>
  <text x="42" y="213" class="token" text-anchor="middle">R1</text>
  <rect x="83" y="189" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="212" class="token" text-anchor="middle">A P8</text>
  <rect x="193" y="189" width="102" height="32" rx="4" class="b"/>
  <text x="244" y="212" class="token" text-anchor="middle">B P3</text>
  <text x="42" y="252" class="token" text-anchor="middle">R2</text>
  <rect x="83" y="228" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="251" class="token" text-anchor="middle">A D1</text>
  <rect x="193" y="228" width="102" height="32" rx="4" class="b"/>
  <text x="244" y="251" class="token" text-anchor="middle">B D1</text>
  <text x="313" y="251" class="small">C 到达；B 完成</text>
  <text x="42" y="291" class="token" text-anchor="middle">R3</text>
  <rect x="83" y="267" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="290" class="token" text-anchor="middle">A D1</text>
  <rect x="193" y="267" width="102" height="32" rx="4" class="pad"/>
  <text x="244" y="290" class="small" text-anchor="middle">空</text>
  <text x="313" y="290" class="small">C 等待</text>
  <text x="42" y="330" class="token" text-anchor="middle">R4</text>
  <rect x="83" y="306" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="329" class="token" text-anchor="middle">A D1</text>
  <rect x="193" y="306" width="102" height="32" rx="4" class="pad"/>
  <text x="244" y="329" class="small" text-anchor="middle">空</text>
  <text x="313" y="329" class="small">A 完成</text>
  <text x="42" y="369" class="token" text-anchor="middle">R5</text>
  <rect x="83" y="345" width="102" height="32" rx="4" class="c"/>
  <text x="134" y="368" class="token" text-anchor="middle">C P6</text>
  <rect x="193" y="345" width="102" height="32" rx="4" class="pad"/>
  <text x="244" y="368" class="small" text-anchor="middle">空</text>
  <text x="313" y="368" class="small">C 加入</text>
  <text x="42" y="408" class="token" text-anchor="middle">R6</text>
  <rect x="83" y="384" width="102" height="32" rx="4" class="c"/>
  <text x="134" y="407" class="token" text-anchor="middle">C D1</text>
  <rect x="193" y="384" width="102" height="32" rx="4" class="pad"/>
  <text x="244" y="407" class="small" text-anchor="middle">空</text>
  <text x="42" y="447" class="token" text-anchor="middle">R7</text>
  <rect x="83" y="423" width="102" height="32" rx="4" class="c"/>
  <text x="134" y="446" class="token" text-anchor="middle">C D1</text>
  <rect x="193" y="423" width="102" height="32" rx="4" class="pad"/>
  <text x="244" y="446" class="small" text-anchor="middle">空</text>
  <text x="313" y="446" class="small">C 完成</text>
  <path d="M24 466H476" class="line"/>
  <text x="24" y="498" class="subhead">连续批：空出的槽位下一轮可补入 C</text>
  <text x="42" y="524" class="small" text-anchor="middle">轮</text>
  <text x="134" y="524" class="small" text-anchor="middle">槽位 1</text>
  <text x="244" y="524" class="small" text-anchor="middle">槽位 2</text>
  <text x="313" y="524" class="small">本轮事件</text>
  <text x="42" y="557" class="token" text-anchor="middle">R1</text>
  <rect x="83" y="533" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="556" class="token" text-anchor="middle">A P8</text>
  <rect x="193" y="533" width="102" height="32" rx="4" class="b"/>
  <text x="244" y="556" class="token" text-anchor="middle">B P3</text>
  <text x="42" y="596" class="token" text-anchor="middle">R2</text>
  <rect x="83" y="572" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="595" class="token" text-anchor="middle">A D1</text>
  <rect x="193" y="572" width="102" height="32" rx="4" class="b"/>
  <text x="244" y="595" class="token" text-anchor="middle">B D1</text>
  <text x="313" y="595" class="small">C 到达；B 完成</text>
  <text x="42" y="635" class="token" text-anchor="middle">R3</text>
  <rect x="83" y="611" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="634" class="token" text-anchor="middle">A D1</text>
  <rect x="193" y="611" width="102" height="32" rx="4" class="c"/>
  <text x="244" y="634" class="token" text-anchor="middle">C P6</text>
  <text x="313" y="634" class="small">C 加入</text>
  <text x="42" y="674" class="token" text-anchor="middle">R4</text>
  <rect x="83" y="650" width="102" height="32" rx="4" class="a"/>
  <text x="134" y="673" class="token" text-anchor="middle">A D1</text>
  <rect x="193" y="650" width="102" height="32" rx="4" class="c"/>
  <text x="244" y="673" class="token" text-anchor="middle">C D1</text>
  <text x="313" y="673" class="small">A 完成</text>
  <text x="42" y="713" class="token" text-anchor="middle">R5</text>
  <rect x="83" y="689" width="102" height="32" rx="4" class="pad"/>
  <text x="134" y="712" class="small" text-anchor="middle">空</text>
  <rect x="193" y="689" width="102" height="32" rx="4" class="c"/>
  <text x="244" y="712" class="token" text-anchor="middle">C D1</text>
  <text x="313" y="712" class="small">C 完成</text>
  <text x="24" y="745" class="label">C 等到轮次边界再参与后续计算。</text>
  <text x="24" y="768" class="small">图按轮次排列，每轮不代表等长执行时间。</text>

</svg>
