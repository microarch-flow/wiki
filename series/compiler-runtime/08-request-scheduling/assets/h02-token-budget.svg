<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 702" width="500" height="702" role="img" aria-labelledby="title desc">
  <title id="title">每轮 Token 预算与分块 Prefill 的进度</title>
  <desc id="desc">从 R3 开始每轮最多计算 5 个新位置，优先安排 A 的 Decode。R3 安排 A 的输入 y2 和 C 的提示 p1、p2、p3、p4，轮末 A 已生成 3 个 Token、有效 KV10，C 已生成 0、有效 KV4；R4 安排 A 的输入 y3 及 C 的提示 p5 至 p8，轮末 A 已生成 4、有效 KV11 并完成，C 已生成 0、有效 KV8；R5 安排 C 的提示 p9 至 p12，1 个预算位置不使用，轮末 C 才产生第一个输出、有效 KV12。A 已完成不再调度。</desc>
  <defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
.head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}.token{font-size:18px;font-weight:600}.tiny{font-size:16px;fill:#416354}
.a{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.b{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.c{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.4}.pad{fill:#f5f6ef;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}.outline{stroke:#8b9c8e;stroke-width:1.4;fill:none}.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.axis{stroke:#8b9c8e;stroke-width:1.2;fill:none}.a-mark{fill:#427a5a;stroke:#f5f6ef;stroke-width:1.1}.c-mark{fill:#426e90;stroke:#f5f6ef;stroke-width:1.1}.history{fill:#b7d1e1;stroke:#86a4b7;stroke-width:0.8}.current{fill:#dfe8ef;stroke:#86a4b7;stroke-width:0.8}.masked{fill:#f1f3ec;stroke:#d1dbd0;stroke-width:0.8}</style></defs>
  <rect x="1" y="1" width="498" height="700" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="35" class="head">从 R3 起，每轮最多计算 5 个新位置</text>
  <text x="24" y="62" class="label">先安排 A 的 Decode，剩余预算用于 C。</text>
  <text x="24" y="85" class="small">每个色块 = 一个新计算位置；空框不执行。</text>
  <rect x="18" y="101" width="464" height="171" rx="9" class="artifact"/>
  <text x="32" y="130" class="subhead">R3：16–23 ms</text>
  <text x="472" y="130" class="small" text-anchor="end">预算：5</text>
  <rect x="31" y="143" width="86" height="34" rx="4" class="a"/>
  <text x="74" y="166" class="token" text-anchor="middle">A y2</text>
  <rect x="120" y="143" width="86" height="34" rx="4" class="c"/>
  <text x="163" y="166" class="token" text-anchor="middle">C p1</text>
  <rect x="209" y="143" width="86" height="34" rx="4" class="c"/>
  <text x="252" y="166" class="token" text-anchor="middle">C p2</text>
  <rect x="298" y="143" width="86" height="34" rx="4" class="c"/>
  <text x="341" y="166" class="token" text-anchor="middle">C p3</text>
  <rect x="387" y="143" width="86" height="34" rx="4" class="c"/>
  <text x="430" y="166" class="token" text-anchor="middle">C p4</text>
  <text x="32" y="200" class="small">轮末生成状态 / 有效 KV</text>
  <rect x="31" y="211" width="212" height="49" rx="6" class="a"/>
  <text x="41" y="231" class="tiny">A：已生成 3</text>
  <text x="41" y="252" class="tiny">有效 KV：10</text>
  <rect x="253" y="211" width="215" height="49" rx="6" class="c"/>
  <text x="263" y="231" class="tiny">C：已生成 0</text>
  <text x="263" y="252" class="tiny">有效 KV：4</text>
  <rect x="18" y="288" width="464" height="171" rx="9" class="artifact"/>
  <text x="32" y="317" class="subhead">R4：23–31 ms</text>
  <text x="472" y="317" class="small" text-anchor="end">预算：5</text>
  <rect x="31" y="330" width="86" height="34" rx="4" class="a"/>
  <text x="74" y="353" class="token" text-anchor="middle">A y3</text>
  <rect x="120" y="330" width="86" height="34" rx="4" class="c"/>
  <text x="163" y="353" class="token" text-anchor="middle">C p5</text>
  <rect x="209" y="330" width="86" height="34" rx="4" class="c"/>
  <text x="252" y="353" class="token" text-anchor="middle">C p6</text>
  <rect x="298" y="330" width="86" height="34" rx="4" class="c"/>
  <text x="341" y="353" class="token" text-anchor="middle">C p7</text>
  <rect x="387" y="330" width="86" height="34" rx="4" class="c"/>
  <text x="430" y="353" class="token" text-anchor="middle">C p8</text>
  <text x="32" y="387" class="small">轮末生成状态 / 有效 KV</text>
  <rect x="31" y="398" width="212" height="49" rx="6" class="a"/>
  <text x="41" y="418" class="tiny">A：已生成 4（完成）</text>
  <text x="41" y="439" class="tiny">有效 KV：11</text>
  <rect x="253" y="398" width="215" height="49" rx="6" class="c"/>
  <text x="263" y="418" class="tiny">C：已生成 0</text>
  <text x="263" y="439" class="tiny">有效 KV：8</text>
  <rect x="18" y="475" width="464" height="171" rx="9" class="artifact"/>
  <text x="32" y="504" class="subhead">R5：31–40 ms</text>
  <text x="472" y="504" class="small" text-anchor="end">预算：5</text>
  <rect x="31" y="517" width="86" height="34" rx="4" class="c"/>
  <text x="74" y="540" class="token" text-anchor="middle">C p9</text>
  <rect x="120" y="517" width="86" height="34" rx="4" class="c"/>
  <text x="163" y="540" class="token" text-anchor="middle">C p10</text>
  <rect x="209" y="517" width="86" height="34" rx="4" class="c"/>
  <text x="252" y="540" class="token" text-anchor="middle">C p11</text>
  <rect x="298" y="517" width="86" height="34" rx="4" class="c"/>
  <text x="341" y="540" class="token" text-anchor="middle">C p12</text>
  <rect x="387" y="517" width="86" height="34" rx="4" class="pad"/>
  <text x="430" y="540" class="token" text-anchor="middle">空</text>
  <text x="32" y="574" class="small">轮末生成状态 / 有效 KV</text>
  <rect x="31" y="585" width="212" height="49" rx="6" class="pad"/>
  <text x="41" y="605" class="tiny">A：此前已完成</text>
  <text x="41" y="626" class="tiny">不再调度</text>
  <rect x="253" y="585" width="215" height="49" rx="6" class="c"/>
  <text x="263" y="605" class="tiny">C：已生成 1（首个）</text>
  <text x="263" y="626" class="tiny">有效 KV：12</text>
  <text x="24" y="684" class="tiny">状态在轮末提交；完成请求的 KV 数为回收前计数。</text>
</svg>
