<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 724" width="500" height="724" role="img" aria-labelledby="title desc">
  <title id="title">分块 Prefill 仍覆盖整段提示的因果可见关系</title>
  <desc id="desc">C 有 12 个提示位置，分三轮计算，每轮 4 个查询位置。因果掩码允许第 i 个查询看到位置 1 至 i。第 1 块 h=0、q=4，访问 10 个有效位置对；第 2 块 h=4、q=4，访问 16 个历史位置对与 10 个块内位置对，共 26 个；第 3 块 h=8、q=4，访问 32 个历史位置对与 10 个块内位置对，共 42 个。总数 78，与完整一次 Prefill 相同。浅蓝表示块内可见位置对，深蓝表示跨块历史位置对，灰白表示屏蔽位置。</desc>
