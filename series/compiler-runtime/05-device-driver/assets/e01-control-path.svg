<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 704" width="500" height="704" role="img" aria-labelledby="control-title control-desc">
  <title id="control-title">应用程序取得设备使用权的控制路径</title>
  <desc id="control-desc">本教学系统中，用户态的进程 P 准备输入 A 和 B，希望执行 vec_add。用户态运行时或驱动库选择设备，并通过操作系统提供的受控接口向内核态驱动申请使用权。驱动检查权限，记录授权，为使用者分配所需资源，并根据设备需要完成初始化。驱动使用设备的控制接口进行管理。设备可含固件和硬件控制器，以及 DMA 引擎、计算引擎和设备存储。箭头表示控制请求或控制关系，而不是输入向量的搬运路径。</desc>
  <defs>
    <marker id="ctrl-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:16px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:20px;font-weight:600}
      .user{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.driver{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}.device{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.inner{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.app{fill:#fffdf6;stroke:#b8ba9e;stroke-width:1.3}
      .edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#ctrl-arrow)}.control{fill:none;stroke:#527d64;stroke-width:2}.boundary{stroke:#9c7b42;stroke-width:1.7;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="702" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">取得设备使用权</text>
  <text x="24" y="57" class="small">教学示例：主机侧控制设备，尚未提交向量加法</text>

  <rect x="18" y="72" width="464" height="211" rx="11" class="user"/>
  <text x="32" y="99" class="subhead">主机 · 用户态</text>
  <rect x="38" y="112" width="424" height="83" rx="8" class="app"/>
  <text x="250" y="138" class="subhead" text-anchor="middle">应用程序 P</text>
  <text x="250" y="161" class="code" text-anchor="middle">A=[2,1,4]  B=[3,4,2]</text>
  <text x="250" y="184" class="small" text-anchor="middle">希望执行 vec_add</text>
  <path d="M250 195V214" class="edge"/>
  <rect x="38" y="218" width="424" height="52" rx="8" class="app"/>
  <text x="250" y="239" class="subhead" text-anchor="middle">用户态运行时／驱动库</text>
  <text x="250" y="259" class="small" text-anchor="middle">选择设备，提出使用申请</text>
  <text x="477" y="304" class="small" text-anchor="end">受控接口</text>
  <path d="M250 270V327" class="edge"/>
  <line x1="20" y1="312" x2="231" y2="312" class="boundary"/>
  <line x1="269" y1="312" x2="480" y2="312" class="boundary"/>
  <text x="24" y="304" class="small">用户／内核保护边界</text>

  <rect x="18" y="331" width="464" height="123" rx="11" class="driver"/>
  <text x="32" y="358" class="subhead">主机 · 内核态设备驱动</text>
  <text x="250" y="387" class="label" text-anchor="middle">检查权限，记录授权</text>
  <text x="250" y="411" class="label" text-anchor="middle">管理设备全局初始化</text>
  <text x="250" y="435" class="label" text-anchor="middle">分配底层资源</text>
  <path d="M250 454V492" class="edge"/>
  <text x="265" y="479" class="small">设备控制接口</text>

  <rect x="18" y="496" width="464" height="168" rx="11" class="device"/>
  <text x="32" y="522" class="subhead">计算设备</text>
  <rect x="38" y="536" width="424" height="46" rx="8" class="inner"/>
  <text x="250" y="565" class="subhead" text-anchor="middle">硬件控制器／可选固件</text>
  <path d="M250 582V592H98V601" class="edge"/>
  <path d="M250 592V601" class="edge"/>
  <path d="M250 592H402V601" class="edge"/>
  <rect x="30" y="605" width="136" height="43" rx="7" class="inner"/>
  <rect x="182" y="605" width="136" height="43" rx="7" class="inner"/>
  <rect x="334" y="605" width="136" height="43" rx="7" class="inner"/>
  <g text-anchor="middle" class="label"><text x="98" y="632">DMA 引擎</text><text x="250" y="632">计算引擎</text><text x="402" y="632">设备存储</text></g>
  <text x="250" y="687" class="small" text-anchor="middle">箭头表示控制请求或控制关系，不表示数据搬运</text>
</svg>
