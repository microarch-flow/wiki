<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 640" width="500" height="640" role="img" aria-labelledby="title description">
  <title id="title">四槽完成队列的发布、消费和归还</title>
  <desc id="description">本教学模型的主机一致性 DMA 内存 CQ 有四个槽，p 是设备单调增加的完成记录生产计数，c 是驱动消费并归还槽的计数，逻辑槽号对四取余。初始 p=c=0；设备发布 L_A 和 L_B 的成功记录后 p=2、c=0；驱动读取并保存任务状态，归还槽后 p=c=2，队列再次为空，槽内旧内容不是新完成。中断可提示状态变化，但不是完成记录本身。CQ 槽归还不等于数据资源释放。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}.small{font-size:16px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:19px;font-weight:600}.muted{font-size:16px;fill:#657568}.warntext{font-size:18px;fill:#82483d}
      .host{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.driver{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.device{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.alloc{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.empty{fill:#f5f6ef;stroke:#a5afa2;stroke-width:1.3;stroke-dasharray:5 3}.error{fill:#f6e6dd;stroke:#b68979;stroke-width:1.4}.card{fill:#fffdf6;stroke:#b8ba9e;stroke-width:1.3}
      .edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#arrow)}.dashed-edge{fill:none;stroke:#527d64;stroke-width:2;stroke-dasharray:5 3;marker-end:url(#arrow)}.line{fill:none;stroke:#b8ba9e;stroke-width:1.2}.dash{fill:none;stroke:#b8ba9e;stroke-width:1.2;stroke-dasharray:5 3}.num{font-size:18px;font-weight:700;fill:#fffdf6}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="638" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">完成队列：谁发布，谁消费？</text>
  <text x="24" y="58" class="small">CQ 位于一致性 DMA 内存；槽号 = 计数 mod 4</text>
  <rect x="18" y="78" width="464" height="130" rx="10" class="host"/>
  <text x="32" y="105" class="subhead">① 初始：没有新完成记录</text>
  <text x="32" y="130" class="code">p=0, c=0</text>
  <text x="84" y="154" class="small" text-anchor="middle">槽 0</text>
  <rect x="34" y="160" width="100" height="38" rx="5" class="empty"/>
  <text x="84" y="177" class="label" text-anchor="middle">空闲</text>
  <text x="84" y="193" class="muted" text-anchor="middle"></text>
  <text x="194" y="154" class="small" text-anchor="middle">槽 1</text>
  <rect x="144" y="160" width="100" height="38" rx="5" class="empty"/>
  <text x="194" y="177" class="label" text-anchor="middle">空闲</text>
  <text x="194" y="193" class="muted" text-anchor="middle"></text>
  <text x="304" y="154" class="small" text-anchor="middle">槽 2</text>
  <rect x="254" y="160" width="100" height="38" rx="5" class="empty"/>
  <text x="304" y="177" class="label" text-anchor="middle">空闲</text>
  <text x="304" y="193" class="muted" text-anchor="middle"></text>
  <text x="414" y="154" class="small" text-anchor="middle">槽 3</text>
  <rect x="364" y="160" width="100" height="38" rx="5" class="empty"/>
  <text x="414" y="177" class="label" text-anchor="middle">空闲</text>
  <text x="414" y="193" class="muted" text-anchor="middle"></text>
  <path d="M250 208V225" class="edge"/>
  <rect x="18" y="230" width="464" height="130" rx="10" class="host"/>
  <text x="32" y="257" class="subhead">② 设备发布两条成功记录</text>
  <text x="32" y="282" class="code">p=2, c=0</text>
  <text x="84" y="306" class="small" text-anchor="middle">槽 0</text>
  <rect x="34" y="312" width="100" height="38" rx="5" class="device"/>
  <text x="84" y="329" class="code" text-anchor="middle">L_A</text>
  <text x="84" y="345" class="small" text-anchor="middle">成功</text>
  <text x="194" y="306" class="small" text-anchor="middle">槽 1</text>
  <rect x="144" y="312" width="100" height="38" rx="5" class="device"/>
  <text x="194" y="329" class="code" text-anchor="middle">L_B</text>
  <text x="194" y="345" class="small" text-anchor="middle">成功</text>
  <text x="304" y="306" class="small" text-anchor="middle">槽 2</text>
  <rect x="254" y="312" width="100" height="38" rx="5" class="empty"/>
  <text x="304" y="329" class="label" text-anchor="middle">空闲</text>
  <text x="304" y="345" class="muted" text-anchor="middle"></text>
  <text x="414" y="306" class="small" text-anchor="middle">槽 3</text>
  <rect x="364" y="312" width="100" height="38" rx="5" class="empty"/>
  <text x="414" y="329" class="label" text-anchor="middle">空闲</text>
  <text x="414" y="345" class="muted" text-anchor="middle"></text>
  <path d="M250 360V377" class="edge"/>
  <rect x="18" y="382" width="464" height="130" rx="10" class="host"/>
  <text x="32" y="409" class="subhead">③ 驱动读出记录，归还两个槽</text>
  <text x="32" y="434" class="code">p=2, c=2</text>
  <text x="84" y="458" class="small" text-anchor="middle">槽 0</text>
  <rect x="34" y="464" width="100" height="38" rx="5" class="empty"/>
  <text x="84" y="481" class="label" text-anchor="middle">L_A</text>
  <text x="84" y="497" class="muted" text-anchor="middle">旧内容</text>
  <text x="194" y="458" class="small" text-anchor="middle">槽 1</text>
  <rect x="144" y="464" width="100" height="38" rx="5" class="empty"/>
  <text x="194" y="481" class="label" text-anchor="middle">L_B</text>
  <text x="194" y="497" class="muted" text-anchor="middle">旧内容</text>
  <text x="304" y="458" class="small" text-anchor="middle">槽 2</text>
  <rect x="254" y="464" width="100" height="38" rx="5" class="empty"/>
  <text x="304" y="481" class="label" text-anchor="middle">空闲</text>
  <text x="304" y="497" class="muted" text-anchor="middle"></text>
  <text x="414" y="458" class="small" text-anchor="middle">槽 3</text>
  <rect x="364" y="464" width="100" height="38" rx="5" class="empty"/>
  <text x="414" y="481" class="label" text-anchor="middle">空闲</text>
  <text x="414" y="497" class="muted" text-anchor="middle"></text>
  <rect x="18" y="526" width="464" height="44" rx="10" class="alloc"/>
  <text x="250" y="546" class="label" text-anchor="middle">p=c：无新记录，旧内容不表示新完成</text>
  <text x="250" y="564" class="small" text-anchor="middle">CQ 槽归还 ≠ 数据缓冲区可释放</text>
  <text x="24" y="595" class="small">p：设备发布数　c：驱动消费并归还数</text>
  <text x="24" y="620" class="small">中断可提示有新记录，不替代 CQ 状态检查。</text>
</svg>
