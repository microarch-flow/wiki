<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 610" width="500" height="610" role="img" aria-labelledby="buffer-title buffer-desc">
  <title id="buffer-title">向量加法所需的主机与设备缓冲区已准备</title>
  <desc id="buffer-desc">进程 P 的上下文 ctx_P 已记录此次计算所需的主机缓冲区和设备缓冲区。主机内存中，A 有值 2、1、4，B 有值 3、4、2，主机输出 Y 还没有本次结果，每个缓冲区是三个 int32 元素，共 12 B。驱动对本例的主机页进行持有或 Pin 并建立适当方向的 DMA 映射，从而获得主机侧可供 D0 DMA 引擎使用的地址；另一侧的设备本地内存已分配 d_A、d_B、d_Y，每段 12 B，分别具有设备可访问地址，但都还没有本次数据。设备本地地址与主机 DMA 地址空间不同。此时尚未提交任务，亦未执行任何数据搬运。</desc>
  <defs>
    <marker id="prep-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}.small{font-size:16px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:19px;font-weight:600}
      .host{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.driver{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}.device{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.alloc{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.data{fill:#fffdf6;stroke:#b8ba9e;stroke-width:1.3}.empty{fill:#f5f6ef;stroke:#a5afa2;stroke-width:1.3;stroke-dasharray:5 3}
      .edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#prep-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="608" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">存储资源已经准备好</text>
  <text x="24" y="58" class="small">对应 E01 中 P 的设备上下文 ctx_P</text>
  <rect x="18" y="75" width="464" height="42" rx="8" class="driver"/>
  <text x="250" y="103" class="subhead" text-anchor="middle">ctx_P 记录本次资源与访问权</text>

  <rect x="18" y="132" width="225" height="384" rx="11" class="host"/>
  <rect x="257" y="132" width="225" height="384" rx="11" class="device"/>
  <g text-anchor="middle">
    <text x="130.5" y="159" class="subhead">主机内存</text>
    <text x="369.5" y="159" class="subhead">D0 设备内存</text>
    <text x="130.5" y="180" class="small">CPU 地址视角（VA）</text>
    <text x="369.5" y="180" class="small">设备自身的地址空间</text>
  </g>
  <rect x="30" y="192" width="201" height="66" rx="7" class="data"/>
  <rect x="269" y="192" width="201" height="66" rx="7" class="empty"/>
  <rect x="30" y="268" width="201" height="66" rx="7" class="data"/>
  <rect x="269" y="268" width="201" height="66" rx="7" class="empty"/>
  <rect x="30" y="344" width="201" height="66" rx="7" class="empty"/>
  <rect x="269" y="344" width="201" height="66" rx="7" class="empty"/>
  <g text-anchor="middle">
    <text x="130.5" y="218" class="code">A · 12 B</text>
    <text x="130.5" y="244" class="code">[2, 1, 4]</text>
    <text x="130.5" y="294" class="code">B · 12 B</text>
    <text x="130.5" y="320" class="code">[3, 4, 2]</text>
    <text x="130.5" y="370" class="code">Y · 12 B</text>
    <text x="130.5" y="396" class="label">本次结果未产生</text>
    <text x="369.5" y="218" class="code">d_A · 12 B</text>
    <text x="369.5" y="244" class="label">待搬入 A</text>
    <text x="369.5" y="294" class="code">d_B · 12 B</text>
    <text x="369.5" y="320" class="label">待搬入 B</text>
    <text x="369.5" y="370" class="code">d_Y · 12 B</text>
    <text x="369.5" y="396" class="label">本次结果未产生</text>
  </g>

  <rect x="30" y="432" width="201" height="70" rx="8" class="driver"/>
  <rect x="269" y="432" width="201" height="70" rx="8" class="alloc"/>
  <g text-anchor="middle">
    <text x="130.5" y="454" class="label">主机页已固定 / Pin</text>
    <text x="130.5" y="476" class="label">已建立 DMA 映射</text>
    <text x="130.5" y="495" class="small">各自获得 DMA 地址</text>
    <text x="369.5" y="458" class="subhead">已分配存储区</text>
    <text x="369.5" y="483" class="small">各自获得设备可访问地址</text>
  </g>
  <rect x="18" y="531" width="464" height="49" rx="8" class="host"/>
  <text x="250" y="562" class="subhead" text-anchor="middle">尚未提交命令，也尚未搬运数据</text>
  <text x="250" y="598" class="small" text-anchor="middle">虚线框：尚无本次数据，仅表示缓冲区状态</text>
</svg>
