<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 862" width="500" height="862" role="img" aria-labelledby="title desc">
  <title id="title">草稿提议与目标模型的批量验证</title>
  <desc id="desc">请求 A 的输入是 p1 至 p8，已经在目标模型 M 中建立八个有效 KV 位置；y1 已提交但尚未作为目标模型输入。草稿模型 D 使用自己的权重与缓存，从已提交前缀顺序提议 d2、d3。目标模型 M 利用已有 KV，在一次 Verify 前向中以 y1、d2、d3 为输入，根据因果掩码产生三个对应的条件分布 P2（来自 y1）、P3（来自 d2）、P4（来自 d3）。这些分布分别用于验证 d2、d3，以及前两者均接受且允许继续时选择 bonus y4。目标模型本轮计算出三个位置的临时 KV，共计算十一处位置，但此刻还需要根据验证结果决定正式状态。金色实线指已知但未计算的 Token，金色虚线为草稿候选，绿色虚线为本轮新产生但尚待决定是否保留的 KV。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#527d64;stroke-width:2;fill:none}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
.cut{fill:#e9ece5;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.match{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}

.candidate{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5;stroke-dasharray:4 3}
.provisional{fill:#d9e9dc;stroke:#6f9a80;stroke-width:2;stroke-dasharray:4 3}
.reject{fill:#e3e8de;stroke:#8b9c8e;stroke-width:1.5;stroke-dasharray:4 3}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="860" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">把候选一次交给目标模型验证</text>
  <text x="24" y="61" class="label">请求 A：8 个输入、输出上限 4；已提交 y1</text>
  <rect x="18" y="78" width="464" height="123" rx="10" class="context"/>
  <text x="32" y="108" class="subhead">初始状态：目标模型 M</text>
  <rect x="32" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="54" y="145" text-anchor="middle" class="token">p1</text>
  <rect x="81" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="103" y="145" text-anchor="middle" class="token">p2</text>
  <rect x="130" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="152" y="145" text-anchor="middle" class="token">p3</text>
  <rect x="179" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="201" y="145" text-anchor="middle" class="token">p4</text>
  <rect x="228" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="250" y="145" text-anchor="middle" class="token">p5</text>
  <rect x="277" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="299" y="145" text-anchor="middle" class="token">p6</text>
  <rect x="326" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="348" y="145" text-anchor="middle" class="token">p7</text>
  <rect x="375" y="121" width="44" height="35" rx="4" class="done"/>
  <text x="397" y="145" text-anchor="middle" class="token">p8</text>
  <rect x="424" y="121" width="44" height="35" rx="4" class="known"/>
  <text x="446" y="145" text-anchor="middle" class="token">y1</text>

  <text x="32" y="185" class="label">绿色：有效 KV 8；金色 y1：已提交、未计算</text>
  <path d="M250 206V224" class="arrow"/>
  <rect x="18" y="230" width="464" height="120" rx="10" class="artifact"/>
  <text x="32" y="260" class="subhead">草稿模型 D：顺序提出两个候选</text>
  <text x="32" y="287" class="label">自己的权重与缓存；从已提交前缀出发。</text>
  <rect x="48" y="303" width="147" height="33" rx="5" class="candidate"/>
  <text x="121.5" y="326" text-anchor="middle" class="token">候选 d2</text>
  <path d="M200 320H300" class="arrow"/>
  <rect x="305" y="303" width="147" height="33" rx="5" class="candidate"/>
  <text x="378.5" y="326" text-anchor="middle" class="token">候选 d3</text>
  <path d="M250 355V373" class="arrow"/>
  <rect x="18" y="379" width="464" height="264" rx="10" class="context"/>
  <text x="32" y="409" class="subhead">Verify：M 一次执行三个输入位置</text>
  <text x="32" y="436" class="small">复用 p1–p8 的目标 KV，并输入：</text>
  <rect x="32" y="451" width="142" height="38" rx="4" class="known"/>
  <text x="103" y="476" text-anchor="middle" class="token">y1</text>
  <path d="M103 493V510" class="arrow"/>
  <rect x="32" y="516" width="142" height="42" rx="4" class="done"/>
  <text x="103" y="543" text-anchor="middle" class="subhead">P2</text>
  <rect x="179" y="451" width="142" height="38" rx="4" class="candidate"/>
  <text x="250" y="476" text-anchor="middle" class="token">d2</text>
  <path d="M250 493V510" class="arrow"/>
  <rect x="179" y="516" width="142" height="42" rx="4" class="done"/>
  <text x="250" y="543" text-anchor="middle" class="subhead">P3</text>
  <rect x="326" y="451" width="142" height="38" rx="4" class="candidate"/>
  <text x="397" y="476" text-anchor="middle" class="token">d3</text>
  <path d="M397 493V510" class="arrow"/>
  <rect x="326" y="516" width="142" height="42" rx="4" class="done"/>
  <text x="397" y="543" text-anchor="middle" class="subhead">P4</text>

  <text x="103" y="580" text-anchor="middle" class="small">验证 d2</text>
  <text x="250" y="580" text-anchor="middle" class="small">验证 d3</text>
  <text x="397" y="580" text-anchor="middle" class="small">全接受时再选 y4</text>
  <text x="32" y="611" class="label">P2、P3、P4 是沿候选链的条件分布。</text>
  <text x="32" y="633" class="tiny">候选已知，可按因果掩码计算多位置，不是无依赖。</text>
  <path d="M250 648V665" class="arrow"/>
  <rect x="18" y="672" width="464" height="149" rx="10" class="artifact"/>
  <text x="32" y="702" class="subhead">目标模型本轮产生 3 个新位置的 KV</text>
  <rect x="32" y="715" width="190" height="42" rx="4" class="done"/>
  <text x="127" y="742" text-anchor="middle" class="token">p1–p8 · 旧有效 8</text>
  <rect x="228" y="715" width="77" height="42" rx="4" class="provisional"/>
  <text x="266.5" y="742" text-anchor="middle" class="token">y1</text>
  <rect x="309" y="715" width="77" height="42" rx="4" class="provisional"/>
  <text x="347.5" y="742" text-anchor="middle" class="token">d2</text>
  <rect x="390" y="715" width="77" height="42" rx="4" class="provisional"/>
  <text x="428.5" y="742" text-anchor="middle" class="token">d3</text>

  <text x="32" y="785" class="label">已有 8 + 新算 3；新 KV 仍待提交或丢弃。</text>
  <text x="32" y="807" class="tiny">虚线绿框：本轮算出、尚未确定正式保留的状态。</text>
  <text x="250" y="846" text-anchor="middle" class="small">虚线金框是草稿候选；验证结果需按位置顺序判断。</text>

</svg>
