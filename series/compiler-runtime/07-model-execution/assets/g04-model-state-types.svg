  <text x="32" y="460" class="small">以 DeepSeek-V2 论文中的单位置表示为例：</text>
  <rect x="32" y="475" width="267" height="62" rx="5" class="done"/>
  <text x="165.5" y="499" text-anchor="middle" class="token">联合潜在表示 cᴷⱽ</text>
  <text x="165.5" y="522" text-anchor="middle" class="label">512 元素，各头共享</text>
  <rect x="307" y="475" width="161" height="62" rx="5" class="known"/>
  <text x="387.5" y="499" text-anchor="middle" class="token">解耦位置 Key kᴿ</text>
  <text x="387.5" y="522" text-anchor="middle" class="label">64 元素，各头共享</text>
  <text x="32" y="559" class="subhead">BF16：(512 + 64) × 2 B = 1,152 B</text>
  <text x="32" y="582" class="small">每层每位置；不再乘查询头数或因子 2。</text>
  <rect x="18" y="607" width="464" height="240" rx="10" class="context"/>
  <text x="32" y="637" class="subhead">纯 SSM：更新固定大小的状态</text>
  <text x="32" y="665" class="label">例如处理 A 的第 11 个位置时：</text>
  <rect x="32" y="680" width="129" height="44" rx="5" class="done"/>
  <text x="96.5" y="708" text-anchor="middle" class="token">旧递推状态</text>
  <rect x="190" y="680" width="120" height="44" rx="5" class="known"/>
  <text x="250" y="708" text-anchor="middle" class="token">当前输入</text>
  <path d="M96.5 728V744H137V755" class="arrow"/>
  <path d="M250 728V744H137V755" class="arrow"/>
  <rect x="54" y="761" width="166" height="48" rx="5" class="done"/>
  <text x="137" y="790" text-anchor="middle" class="token">更新后的递推状态</text>
  <rect x="242" y="761" width="226" height="48" rx="5" class="artifact"/>
  <text x="355" y="790" text-anchor="middle" class="token">有限短卷积历史（如需）</text>
  <text x="32" y="834" class="small">固定结构时，状态载荷不随位置数线性增长。</text>
  <text x="250" y="875" text-anchor="middle" class="small">图中框不按字节比例；只对比状态组织机制。</text>
  <text x="250" y="900" text-anchor="middle" class="small">不代表展开 K、V 后的计算。</text>
  <text x="250" y="925" text-anchor="middle" class="small">不比较不同模型的容量或执行性能。</text>

</svg>
