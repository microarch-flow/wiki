  <text x="450" y="220" text-anchor="middle" class="tiny">V</text>

  <text x="32" y="254" class="small">每格代表该位置、该层的各 KV 头的数据。</text>
  <rect x="18" y="284" width="464" height="310" rx="10" class="artifact"/>
  <text x="32" y="315" class="subhead">MLA：按位置保存紧凑表示</text>
  <text x="32" y="343" class="label">仍按位置增加，但保存的数据不同。</text>
  <text x="50" y="370" text-anchor="middle" class="tiny">p1</text>
  <rect x="32" y="378" width="36" height="26" rx="3" class="done"/>
  <text x="50" y="397" text-anchor="middle" class="tiny">c</text>
  <rect x="32" y="407" width="36" height="26" rx="3" class="known"/>
  <text x="50" y="426" text-anchor="middle" class="tiny">kᴿ</text>
  <text x="90" y="370" text-anchor="middle" class="tiny">p2</text>
  <rect x="72" y="378" width="36" height="26" rx="3" class="done"/>
  <text x="90" y="397" text-anchor="middle" class="tiny">c</text>
