  <text x="330" y="220" text-anchor="middle" class="tiny">V</text>
  <text x="370" y="164" text-anchor="middle" class="tiny">y1</text>
  <rect x="352" y="172" width="36" height="26" rx="3" class="done"/>
  <text x="370" y="191" text-anchor="middle" class="tiny">K</text>
  <rect x="352" y="201" width="36" height="26" rx="3" class="done"/>
  <text x="370" y="220" text-anchor="middle" class="tiny">V</text>
  <text x="410" y="164" text-anchor="middle" class="tiny">y2</text>
