<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 816" width="500" height="816" role="img" aria-labelledby="title desc">
  <title id="title">前缀共享块的活跃、闲置与淘汰</title>
  <desc id="desc">以共享池块七为例，A 与 C 同时引用它，活跃序列引用数为二；A 结束并解除序列引用后降为一；C 也结束并解除引用后降为零。引用数为零不保证所有在途设备访问已经结束。只有最后访问安全完成，并满足必要引用与使用权条件后，才可以将块视为闲置并可淘汰。索引和旧前缀 KV 可以暂时保留；随后具有相同前缀和相容身份的请求再次命中时，先建立新引用，再使用旧状态，引用数由零变为一。若容量压力导致淘汰，先撤销对应旧身份的索引映射，再把该块分配给新数据；旧身份不再命中。图中的引用数仅统计活跃序列，而不是在途设备使用权，流程不表示执行时间。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#527d64;stroke-width:2;fill:none}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
.cut{fill:#e9ece5;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.match{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}

.highlight{fill:#d9e9dc;stroke:#9c7b42;stroke-width:2.5}
.empty{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}

.idle{fill:#e8eee6;stroke:#78937f;stroke-dasharray:5 3;stroke-width:1.7}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="814" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">共享块的引用归零以后会怎样？</text>
  <text x="24" y="61" class="label">池块 7：此前已确认可复用的共同前缀</text>
  <rect x="18" y="79" width="464" height="273" rx="10" class="context"/>
  <text x="32" y="109" class="subhead">从活跃共享，到可安全闲置</text>
  <rect x="32" y="123" width="436" height="52" rx="6" class="done"/>
  <text x="44" y="145" class="token">A 和 C 均在使用</text>
  <text x="454" y="145" text-anchor="end" class="token">引用数 2</text>
  <text x="44" y="165" class="tiny">前缀索引仍指向块 7</text>
  <path d="M250 179V193" class="arrow"/>
  <rect x="32" y="199" width="436" height="52" rx="6" class="done"/>
  <text x="44" y="221" class="token">A 结束并解除序列引用</text>
  <text x="454" y="221" text-anchor="end" class="token">引用数 1</text>
  <text x="44" y="241" class="tiny">C 仍引用块 7，不可覆盖</text>
  <path d="M250 255V269" class="arrow"/>
  <rect x="32" y="275" width="436" height="62" rx="6" class="known"/>
  <text x="44" y="297" class="token">C 也结束并解除序列引用</text>
  <text x="454" y="297" text-anchor="end" class="token">引用数 0</text>
  <text x="44" y="321" class="small">仍须等待最后访问结束，才可覆盖。</text>
  <path d="M250 357V375" class="arrow"/>
  <rect x="18" y="382" width="464" height="121" rx="10" class="artifact"/>
  <text x="32" y="412" class="subhead">最后在途访问已安全完成</text>
  <rect x="32" y="427" width="436" height="60" rx="6" class="idle"/>
  <text x="250" y="451" text-anchor="middle" class="token">块 7：闲置缓存，可淘汰</text>
  <text x="250" y="476" text-anchor="middle" class="small">序列引用数 0；KV 与前缀索引均可保留</text>
  <path d="M250 507V524H136V543" class="arrow"/>
  <path d="M250 524H364V543" class="arrow"/>
  <rect x="18" y="550" width="225" height="197" rx="10" class="context"/>
  <rect x="257" y="550" width="225" height="197" rx="10" class="artifact"/>
  <text x="130.5" y="580" text-anchor="middle" class="subhead">后来请求再次命中</text>
  <text x="369.5" y="580" text-anchor="middle" class="subhead">池容量需要腾空间</text>
  <text x="130.5" y="610" text-anchor="middle" class="small">查到旧身份及块 7</text>
  <text x="369.5" y="610" text-anchor="middle" class="small">按策略选中块 7</text>
  <path d="M130.5 620V639" class="arrow"/>
  <path d="M369.5 620V639" class="arrow"/>
  <text x="130.5" y="660" text-anchor="middle" class="token">建立新引用后复用</text>
  <text x="369.5" y="660" text-anchor="middle" class="token">先撤销旧索引映射</text>
  <text x="130.5" y="692" text-anchor="middle" class="small">引用数 0 → 1</text>
  <text x="369.5" y="692" text-anchor="middle" class="small">再分配给新数据</text>
  <text x="130.5" y="722" text-anchor="middle" class="small">恢复活跃，不可覆盖</text>
  <text x="369.5" y="722" text-anchor="middle" class="small">旧身份不再命中</text>
  <text x="250" y="775" text-anchor="middle" class="small">引用归零不自动保证设备安全，也不保证永久保留。</text>
  <text x="250" y="799" text-anchor="middle" class="small">引用数只计活跃序列；箭头不代表实际耗时。</text>

</svg>
