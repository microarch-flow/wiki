<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 906" width="500" height="906" role="img" aria-labelledby="title desc">
  <title id="title">通过逻辑块表找到缓存位置</title>
  <desc id="desc">假设 A 在 Decode 2 后有十个有效 KV 位置，逻辑位置 j 从零开始。p1 至 p8 对应 j0 到 j7，y1 对应 j8，y2 对应 j9；y3 已知但 j10 尚无有效 KV。块大小为四，逻辑块 0、1、2 通过块表映射到池块 ID 7、2、11。物理块 ID 2 保存 p5 至 p8，ID 7 保存 p1 至 p4，ID 11 的偏移零、偏移一保存 y1、y2，偏移二、三为空。要找到 j9 对应的 y2，向下整除得到逻辑块号二，表项 table[2] 为 11，取余得到偏移一。池块 ID 不要求连续，图中物理块是软件分配单元，不是硬件虚拟内存的物理页；槽位大小不是实际字节比例。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#527d64;stroke-width:2;fill:none}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
.cut{fill:#e9ece5;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.match{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}

.highlight{fill:#d9e9dc;stroke:#9c7b42;stroke-width:2.5}
.empty{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="904" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">逻辑位置如何映射到缓存池？</text>
  <text x="24" y="61" class="label">A：Decode 2 后有 10 个有效 KV 位置</text>
  <rect x="18" y="78" width="464" height="162" rx="10" class="context"/>
  <text x="32" y="108" class="subhead">逻辑序列（位置 j 从 0 开始编号）</text>
  <text x="50" y="135" text-anchor="middle" class="tiny">0</text>
  <rect x="32" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="50" y="165" text-anchor="middle" class="small">p1</text>
  <text x="90" y="135" text-anchor="middle" class="tiny">1</text>
  <rect x="72" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="90" y="165" text-anchor="middle" class="small">p2</text>
  <text x="130" y="135" text-anchor="middle" class="tiny">2</text>
  <rect x="112" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="130" y="165" text-anchor="middle" class="small">p3</text>
  <text x="170" y="135" text-anchor="middle" class="tiny">3</text>
  <rect x="152" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="170" y="165" text-anchor="middle" class="small">p4</text>
  <text x="210" y="135" text-anchor="middle" class="tiny">4</text>
  <rect x="192" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="210" y="165" text-anchor="middle" class="small">p5</text>
  <text x="250" y="135" text-anchor="middle" class="tiny">5</text>
  <rect x="232" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="250" y="165" text-anchor="middle" class="small">p6</text>
  <text x="290" y="135" text-anchor="middle" class="tiny">6</text>
  <rect x="272" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="290" y="165" text-anchor="middle" class="small">p7</text>
  <text x="330" y="135" text-anchor="middle" class="tiny">7</text>
  <rect x="312" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="330" y="165" text-anchor="middle" class="small">p8</text>
  <text x="370" y="135" text-anchor="middle" class="tiny">8</text>
  <rect x="352" y="143" width="36" height="34" rx="4" class="done"/>
  <text x="370" y="165" text-anchor="middle" class="small">y1</text>
  <text x="410" y="135" text-anchor="middle" class="tiny">9</text>
  <rect x="392" y="143" width="36" height="34" rx="4" class="highlight"/>
  <text x="410" y="165" text-anchor="middle" class="small">y2</text>
  <text x="450" y="135" text-anchor="middle" class="tiny">10</text>
  <rect x="432" y="143" width="36" height="34" rx="4" class="known"/>
  <text x="450" y="165" text-anchor="middle" class="small">y3</text>

  <path d="M32 183V192H188V183 M192 183V192H348V183 M352 183V192H468V183" class="line"/>
  <text x="110" y="210" text-anchor="middle" class="small">逻辑块 0</text>
  <text x="270" y="210" text-anchor="middle" class="small">逻辑块 1</text>
  <text x="410" y="210" text-anchor="middle" class="small">逻辑块 2</text>
  <text x="32" y="231" class="tiny">y3 已选出（j=10），但尚未建立对应 KV。</text>
  <path d="M250 244V262" class="arrow"/>
  <rect x="18" y="268" width="464" height="183" rx="10" class="artifact"/>
  <text x="32" y="298" class="subhead">块表：块大小 = 4 个 Token 位置</text>
  <text x="34" y="328" class="label">逻辑块号</text>
  <text x="235" y="328" text-anchor="middle" class="label">池中物理块 ID</text>
  <text x="468" y="328" text-anchor="end" class="label">映射</text>
  <rect x="41" y="342" width="84" height="25" rx="4" class="done"/>
  <text x="83" y="361" text-anchor="middle" class="small">0</text>
  <path d="M129 355H205" class="arrow"/>
  <rect x="211" y="342" width="77" height="25" rx="4" class="done"/>
  <text x="249.5" y="361" text-anchor="middle" class="small">7</text>
  <text x="468" y="361" text-anchor="end" class="small">table[0] = 7</text>
  <rect x="41" y="373" width="84" height="25" rx="4" class="done"/>
  <text x="83" y="392" text-anchor="middle" class="small">1</text>
  <path d="M129 386H205" class="arrow"/>
  <rect x="211" y="373" width="77" height="25" rx="4" class="done"/>
  <text x="249.5" y="392" text-anchor="middle" class="small">2</text>
  <text x="468" y="392" text-anchor="end" class="small">table[1] = 2</text>
  <rect x="41" y="404" width="84" height="25" rx="4" class="known"/>
  <text x="83" y="423" text-anchor="middle" class="small">2</text>
  <path d="M129 417H205" class="arrow"/>
  <rect x="211" y="404" width="77" height="25" rx="4" class="highlight"/>
  <text x="249.5" y="423" text-anchor="middle" class="small">11</text>
  <text x="468" y="423" text-anchor="end" class="small">table[2] = 11</text>

  <path d="M250 456V474" class="arrow"/>
  <rect x="18" y="480" width="464" height="249" rx="10" class="context"/>
  <text x="32" y="510" class="subhead">池：三个块 ID 不要求连续</text>
  <text x="32" y="537" class="small">按池中 ID 列出（其余块省略）</text>
  <text x="34" y="569" class="label">块 ID</text>
  <text x="162" y="569" text-anchor="middle" class="small">偏移 0</text>
  <text x="241" y="569" text-anchor="middle" class="small">偏移 1</text>
  <text x="320" y="569" text-anchor="middle" class="small">偏移 2</text>
  <text x="399" y="569" text-anchor="middle" class="small">偏移 3</text>
  <text x="66" y="604" text-anchor="middle" class="subhead">2</text>
  <rect x="125" y="579" width="74" height="36" rx="4" class="done"/>
  <text x="162.0" y="603.0" text-anchor="middle" class="token">p5</text>
  <rect x="204" y="579" width="74" height="36" rx="4" class="done"/>
  <text x="241.0" y="603.0" text-anchor="middle" class="token">p6</text>
  <rect x="283" y="579" width="74" height="36" rx="4" class="done"/>
  <text x="320.0" y="603.0" text-anchor="middle" class="token">p7</text>
  <rect x="362" y="579" width="74" height="36" rx="4" class="done"/>
  <text x="399.0" y="603.0" text-anchor="middle" class="token">p8</text>
  <text x="66" y="647" text-anchor="middle" class="subhead">7</text>
  <rect x="125" y="622" width="74" height="36" rx="4" class="done"/>
  <text x="162.0" y="646.0" text-anchor="middle" class="token">p1</text>
  <rect x="204" y="622" width="74" height="36" rx="4" class="done"/>
  <text x="241.0" y="646.0" text-anchor="middle" class="token">p2</text>
  <rect x="283" y="622" width="74" height="36" rx="4" class="done"/>
  <text x="320.0" y="646.0" text-anchor="middle" class="token">p3</text>
  <rect x="362" y="622" width="74" height="36" rx="4" class="done"/>
  <text x="399.0" y="646.0" text-anchor="middle" class="token">p4</text>
  <text x="66" y="690" text-anchor="middle" class="subhead">11</text>
  <rect x="125" y="665" width="74" height="36" rx="4" class="done"/>
  <text x="162.0" y="689.0" text-anchor="middle" class="token">y1</text>
  <rect x="204" y="665" width="74" height="36" rx="4" class="highlight"/>
  <text x="241.0" y="689.0" text-anchor="middle" class="token">y2</text>
  <rect x="283" y="665" width="74" height="36" rx="4" class="empty"/>
  <text x="320.0" y="689.0" text-anchor="middle" class="small">—</text>
  <rect x="362" y="665" width="74" height="36" rx="4" class="empty"/>
  <text x="399.0" y="689.0" text-anchor="middle" class="small">—</text>

  <text x="34" y="718" class="tiny">虚线空槽已分配，但其中没有有效 KV。</text>
  <rect x="18" y="737" width="464" height="103" rx="10" class="artifact"/>
  <text x="32" y="767" class="subhead">查找第 10 个 Token（y2，j=9）</text>
  <text x="32" y="795" class="label">⌊9 / 4⌋ = 2；table[2] = 11；9 mod 4 = 1</text>
  <text x="32" y="823" class="subhead">→ 池块 11 的偏移 1</text>
  <text x="250" y="865" text-anchor="middle" class="small">逻辑 KV 分块，不等同硬件虚拟内存页。</text>
  <text x="250" y="889" text-anchor="middle" class="small">图中方框表示槽位，不按实际内存大小绘制。</text>

</svg>
