<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 688" width="500" height="688" role="img" aria-labelledby="title desc">
  <title id="title">请求 A 中模型权重、临时数据和历史状态的生命周期</title>
  <desc id="desc">请求 A 有八个输入并恰好生成四个输出，在无复用、无提前停止的教学条件下。共享模型权重 W 在整个请求生命周期内常驻，其他请求也可以共享。每轮 Activation 和 Workspace 仅在本轮有效使用期间需要，分配空间可能由资源池保留。有效 KV 位置数从零经完整 Prefill 和三轮 Decode 依次变为八、九、十、十一。停止生成时 y4 已被选择但没有计算其对应位置。只有最后使用完成且相关引用清理后，私有 KV 才能安全回收；逻辑回收并不等于归还物理内存。图中的阶段宽度不表示真实时间或容量比例。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="686" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">请求 A 中，不同数据存活多久？</text>
  <text x="24" y="61" class="label">8 个输入，恰好生成 4 个输出；无前缀复用</text>
  <rect x="18" y="79" width="464" height="327" rx="10" class="context"/>
  <text x="32" y="108" class="subhead">按执行阶段观察对象的使用</text>
  <text x="32" y="138" class="small">P＝Prefill，D1–D3＝三轮 Decode</text>
  <text x="125" y="168" text-anchor="middle" class="small">开始</text>
  <text x="184" y="168" text-anchor="middle" class="small">P</text>
  <text x="243" y="168" text-anchor="middle" class="small">D1</text>
  <text x="302" y="168" text-anchor="middle" class="small">D2</text>
  <text x="361" y="168" text-anchor="middle" class="small">D3</text>
  <text x="440" y="168" text-anchor="middle" class="small">结束</text>
  <path d="M32 181H470" class="line"/>
  <text x="32" y="209" class="subhead">权重 W</text>
  <rect x="118" y="190" width="348" height="33" rx="4" class="done"/>
  <text x="292" y="212" text-anchor="middle" class="token">常驻共享，A 结束不释放</text>
  <path d="M32 236H470" class="line"/>
  <text x="32" y="261" class="label">激活</text>
  <text x="32" y="285" class="label">工作区</text>
  <rect x="160" y="247" width="48" height="45" rx="4" class="known"/>
  <text x="184" y="276" text-anchor="middle" class="tiny">本轮</text>
  <rect x="219" y="247" width="48" height="45" rx="4" class="known"/>
  <text x="243" y="276" text-anchor="middle" class="tiny">本轮</text>
  <rect x="278" y="247" width="48" height="45" rx="4" class="known"/>
  <text x="302" y="276" text-anchor="middle" class="tiny">本轮</text>
  <rect x="337" y="247" width="48" height="45" rx="4" class="known"/>
  <text x="361" y="276" text-anchor="middle" class="tiny">本轮</text>

  <text x="126" y="312" class="small">有效使用可结束，分配的空间可保留</text>
  <path d="M32 324H470" class="line"/>
  <text x="32" y="351" class="label">有效 KV</text>
  <text x="32" y="374" class="small">位置数</text>
  <rect x="102" y="338" width="46" height="37" rx="4" class="unknown"/>
  <text x="125" y="363" text-anchor="middle" class="token">0</text>
  <rect x="161" y="338" width="46" height="37" rx="4" class="done"/>
  <text x="184" y="363" text-anchor="middle" class="token">8</text>
  <rect x="220" y="338" width="46" height="37" rx="4" class="done"/>
  <text x="243" y="363" text-anchor="middle" class="token">9</text>
  <rect x="279" y="338" width="46" height="37" rx="4" class="done"/>
  <text x="302" y="363" text-anchor="middle" class="token">10</text>
  <rect x="338" y="338" width="46" height="37" rx="4" class="done"/>
  <text x="361" y="363" text-anchor="middle" class="token">11</text>

  <path d="M388 357H403" class="arrow"/>
  <text x="440" y="350" text-anchor="middle" class="tiny">待安全</text>
  <text x="440" y="371" text-anchor="middle" class="tiny">回收</text>
  <text x="32" y="395" class="small">KV 位置数是各轮完成后的有效状态计数。</text>
  <rect x="18" y="421" width="464" height="200" rx="10" class="artifact"/>
  <text x="32" y="451" class="subhead">停止生成时，要区分两件事</text>
  <rect x="32" y="467" width="436" height="52" rx="6" class="known"/>
  <text x="45" y="490" class="token">已生成 y4，停止安排前向</text>
  <text x="45" y="510" class="tiny">最后一个 Token 无对应有效 KV</text>
  <path d="M250 522V538" class="arrow"/>
  <rect x="32" y="544" width="436" height="62" rx="6" class="done"/>
  <text x="45" y="570" class="token">最后使用结束，相关引用已清理</text>
  <text x="45" y="592" class="small">此后请求的私有 KV 才能安全回收。</text>
  <text x="250" y="648" text-anchor="middle" class="small">示意生命周期，长度不代表真实时间或占用比例。</text>
  <text x="250" y="672" text-anchor="middle" class="small">逻辑回收不等于将物理内存归还设备。</text>

</svg>
