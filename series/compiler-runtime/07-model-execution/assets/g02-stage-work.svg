<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 688" width="500" height="688" role="img" aria-labelledby="title desc">
    <title id="title">Prefill 和 Decode 的计算规模</title>
    <desc id="desc">每层每个查询头的逻辑因果 Attention 位置配对对比：Prefill 处理八个新位置、没有旧历史，共三十六个允许的 Query-Key 位置对；Decode 第一轮处理一个新位置，使用八个已有历史位置并关注自身，共九对；Decode 第二轮、第三轮分别已有九、十个历史位置，共十、十一对。条长只表示配对数，所有条以三十六为相同的满格。新位置是当前模型前向实际计算的位置，不是本轮生成的输出。逻辑配对数与位置信息不等于硬件读显存次数或运行时间。</desc>
    <defs>
      <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
      <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
      .small{font-size:17px;fill:#416354}.token{font-size:18px;font-weight:600}
      .context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
      .done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
      .unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
      .future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
      .arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .bar{fill:#82af91;stroke:#527d64;stroke-width:1}
</style>
    </defs>
    <rect x="1" y="1" width="498" height="686" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">Prefill 与 Decode 的逻辑工作量</text>
  <text x="24" y="63" class="label">每层、每个查询头的因果 Attention 配对</text>
  <rect x="18" y="80" width="464" height="300" rx="10" class="context" />
  <text x="32" y="109" class="subhead">阶段</text>
  <text x="182" y="109" text-anchor="middle" class="label">新位置</text>
  <text x="284" y="109" text-anchor="middle" class="label">已有历史</text>
  <text x="420" y="109" text-anchor="middle" class="label">Q–K 对数</text>
  <path d="M30 120H470" class="line"/>
  <text x="32" y="149" class="label">Prefill</text>
  <text x="182" y="149" text-anchor="middle" class="subhead">8</text>
  <text x="284" y="149" text-anchor="middle" class="subhead">0</text>
  <text x="420" y="149" text-anchor="middle" class="subhead">36</text>
  <rect x="349" y="159" width="122" height="11" rx="3" class="future" />
  <rect x="349" y="159" width="122.0" height="11" rx="3" class="bar" />
  <path d="M30 180H470" class="line"/>
  <text x="32" y="208" class="label">Decode 1</text>
  <text x="182" y="208" text-anchor="middle" class="subhead">1</text>
  <text x="284" y="208" text-anchor="middle" class="subhead">8</text>
  <text x="420" y="208" text-anchor="middle" class="subhead">9</text>
  <rect x="349" y="218" width="122" height="11" rx="3" class="future" />
  <rect x="349" y="218" width="30.5" height="11" rx="3" class="bar" />
  <path d="M30 239H470" class="line"/>
  <text x="32" y="267" class="label">Decode 2</text>
  <text x="182" y="267" text-anchor="middle" class="subhead">1</text>
  <text x="284" y="267" text-anchor="middle" class="subhead">9</text>
  <text x="420" y="267" text-anchor="middle" class="subhead">10</text>
  <rect x="349" y="277" width="122" height="11" rx="3" class="future" />
  <rect x="349" y="277" width="33.888888888888886" height="11" rx="3" class="bar" />
  <path d="M30 298H470" class="line"/>
  <text x="32" y="326" class="label">Decode 3</text>
  <text x="182" y="326" text-anchor="middle" class="subhead">1</text>
  <text x="284" y="326" text-anchor="middle" class="subhead">10</text>
  <text x="420" y="326" text-anchor="middle" class="subhead">11</text>
  <rect x="349" y="336" width="122" height="11" rx="3" class="future" />
  <rect x="349" y="336" width="37.27777777777778" height="11" rx="3" class="bar" />
  <text x="34" y="365" class="small">条长仅表示 Q–K 对数，统一以 36 对为满格。</text>
  <rect x="18" y="393" width="464" height="119" rx="10" class="artifact" />
  <text x="32" y="420" class="subhead">Prefill：8 个位置一起作为输入</text>
  <text x="32" y="448" class="label">各 Query 的允许 Key 数：1、2、…、8</text>
  <text x="32" y="474" class="label">1 + 2 + … + 8 = 36；不存在旧 KV。</text>
  <rect x="18" y="523" width="464" height="123" rx="10" class="artifact" />
  <text x="32" y="550" class="subhead">首轮 Decode：y1 是唯一新位置</text>
  <rect x="32" y="565" width="45" height="33" rx="4" class="done" />
  <text x="54.5" y="587.5" text-anchor="middle" class="token">p1</text>
  <rect x="81" y="565" width="45" height="33" rx="4" class="done" />
  <text x="103.5" y="587.5" text-anchor="middle" class="token">p2</text>
  <rect x="130" y="565" width="45" height="33" rx="4" class="done" />
  <text x="152.5" y="587.5" text-anchor="middle" class="token">p3</text>
  <rect x="179" y="565" width="45" height="33" rx="4" class="done" />
  <text x="201.5" y="587.5" text-anchor="middle" class="token">p4</text>
  <rect x="228" y="565" width="45" height="33" rx="4" class="done" />
  <text x="250.5" y="587.5" text-anchor="middle" class="token">p5</text>
  <rect x="277" y="565" width="45" height="33" rx="4" class="done" />
  <text x="299.5" y="587.5" text-anchor="middle" class="token">p6</text>
  <rect x="326" y="565" width="45" height="33" rx="4" class="done" />
  <text x="348.5" y="587.5" text-anchor="middle" class="token">p7</text>
  <rect x="375" y="565" width="45" height="33" rx="4" class="done" />
  <text x="397.5" y="587.5" text-anchor="middle" class="token">p8</text>
  <rect x="424" y="565" width="45" height="33" rx="4" class="known" />
  <text x="446.5" y="587.5" text-anchor="middle" class="token">y1</text>
  <text x="228" y="621" text-anchor="middle" class="label">8 个历史位置 + 自身 1 个位置 = 9 对</text>
  <text x="250" y="674" text-anchor="middle" class="small">示意逻辑访问关系，不是运行时间或实测流量。</text>
</svg>
