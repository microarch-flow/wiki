<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 862" width="500" height="862" role="img" aria-labelledby="title desc">
  <title id="title">一次 Token 选择推进请求状态</title>
  <desc id="desc">请求 A 完成 Prefill 后有效 KV 覆盖 p1 到 p8，尚未生成 Token。使用 p8 的 Logits 完成处理和抽样，得到 y1=t_b，并提交到序列、更新生成数、随机状态与历史统计；此时已生成 1 但有效 KV 仍为 8。文本输出另有增量解码、停止串匹配、输出缓冲。检查停止条件，若继续则安排 y1 作为位置 9 的前向输入；若停止则不再安排新前向，资源回收仍须等待在途任务结束。仅示意逻辑依赖，不限定设备或具体提交和执行时间。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#527d64;stroke-width:2;fill:none}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
.cut{fill:#e9ece5;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.match{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="860" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">一次选择怎样推进请求状态</text>
  <text x="24" y="61" class="label">请求 A：8 个输入，最多生成 4 个输出</text>
  <rect x="25" y="77" width="23" height="18" rx="3" class="done"/>
  <text x="55" y="92" class="small">已计算、KV 有效</text>
  <rect x="252" y="77" width="23" height="18" rx="3" class="known"/>
  <text x="282" y="92" class="small">Token 已知、未计算</text>
  <rect x="18" y="109" width="464" height="159" rx="10" class="context"/>
  <text x="32" y="140" class="subhead">Prefill 结果就绪</text>
  <rect x="32" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="51.5" y="178" text-anchor="middle" class="token">p1</text>
  <rect x="75" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="94.5" y="178" text-anchor="middle" class="token">p2</text>
  <rect x="118" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="137.5" y="178" text-anchor="middle" class="token">p3</text>
  <rect x="161" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="180.5" y="178" text-anchor="middle" class="token">p4</text>
  <rect x="204" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="223.5" y="178" text-anchor="middle" class="token">p5</text>
  <rect x="247" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="266.5" y="178" text-anchor="middle" class="token">p6</text>
  <rect x="290" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="309.5" y="178" text-anchor="middle" class="token">p7</text>
  <rect x="333" y="154" width="39" height="35" rx="4" class="done"/>
  <text x="352.5" y="178" text-anchor="middle" class="token">p8</text>
  <rect x="382" y="154" width="87" height="35" rx="4" class="unknown"/>
  <text x="425.5" y="178" text-anchor="middle" class="token">y1 未选</text>

  <text x="32" y="217" class="label">有效 KV：8 个位置  ·  已生成：0</text>
  <text x="32" y="247" class="label">输入位置 p8 的 Logits → 待选择 y1</text>
  <path d="M250 272V291" class="arrow"/>
  <rect x="18" y="297" width="464" height="180" rx="10" class="artifact"/>
  <text x="32" y="329" class="subhead">处理 Logits，抽样并提交 y1 = t_b</text>
  <rect x="32" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="51.5" y="367" text-anchor="middle" class="token">p1</text>
  <rect x="75" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="94.5" y="367" text-anchor="middle" class="token">p2</text>
  <rect x="118" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="137.5" y="367" text-anchor="middle" class="token">p3</text>
  <rect x="161" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="180.5" y="367" text-anchor="middle" class="token">p4</text>
  <rect x="204" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="223.5" y="367" text-anchor="middle" class="token">p5</text>
  <rect x="247" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="266.5" y="367" text-anchor="middle" class="token">p6</text>
  <rect x="290" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="309.5" y="367" text-anchor="middle" class="token">p7</text>
  <rect x="333" y="343" width="39" height="35" rx="4" class="done"/>
  <text x="352.5" y="367" text-anchor="middle" class="token">p8</text>
  <rect x="382" y="343" width="87" height="35" rx="4" class="known"/>
  <text x="425.5" y="367" text-anchor="middle" class="token">y1 = t_b</text>

  <text x="32" y="405" class="label">追加 Token，更新随机状态与历史统计</text>
  <text x="32" y="439" class="subhead">已生成：1  ·  有效 KV 仍为 8</text>
  <text x="32" y="466" class="small">y1 已知，但尚未作为模型前向的输入。</text>
  <path d="M250 482V501" class="arrow"/>
  <rect x="18" y="508" width="464" height="78" rx="10" class="context"/>
  <text x="32" y="537" class="subhead">按需检查文本停止串</text>
  <text x="32" y="567" class="label">增量解码与匹配；文本另经输出缓冲发送</text>
  <path d="M250 590V609" class="arrow"/>
  <rect x="148" y="615" width="204" height="43" rx="8" class="known"/>
  <text x="250" y="643" text-anchor="middle" class="subhead">检查停止条件</text>
  <path d="M250 662V675H130V696" class="arrow"/>
  <path d="M250 675H370V696" class="arrow"/>
  <rect x="18" y="704" width="224" height="112" rx="10" class="context"/>
  <rect x="258" y="704" width="224" height="112" rx="10" class="artifact"/>
  <text x="130" y="737" text-anchor="middle" class="subhead">继续</text>
  <text x="130" y="768" text-anchor="middle" class="label">下一轮输入 y1</text>
  <text x="130" y="794" text-anchor="middle" class="label">位置 9（建立其 KV）</text>
  <text x="370" y="737" text-anchor="middle" class="subhead">停止</text>
  <text x="370" y="768" text-anchor="middle" class="label">不再安排前向</text>
  <text x="370" y="794" text-anchor="middle" class="label">回收另等在途任务完成</text>
  <text x="250" y="845" text-anchor="middle" class="small">仅示意逻辑依赖，不限定实际设备或执行时序。</text>

</svg>
