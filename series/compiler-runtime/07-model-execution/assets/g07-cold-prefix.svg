<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 871" width="500" height="871" role="img" aria-labelledby="title desc">
  <title id="title">主机中的冷前缀命中与设备恢复</title>
  <desc id="desc">独立场景：A 结束后，对应公共前缀 p1 到 p4 的设备端旧块七已被淘汰，但主机 H0 仍有有效备份，前缀索引保留对主机备份的记录。C 后来输入 p1 到 p4、c5、c6，按身份与前缀查到 H0，但命中不是设备状态已就绪。若选择复用，先固定主机源的访问权并分配新的设备块九，复制成功且设备可读后，将 C 的设备块表建立为 [9,5]，新后缀槽使用块五，只计算 c5、c6。若备份缺失、失效或等待恢复不划算，可跳过其命中并完整执行六个输入的普通 Prefill。图只表示逻辑依赖，不代表特定框架的实现或实际硬件传输路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#527d64;stroke-width:2;fill:none}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
.cut{fill:#e9ece5;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.match{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}

.highlight{fill:#d9e9dc;stroke:#9c7b42;stroke-width:2.5}
.empty{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}

.idle{fill:#e8eee6;stroke:#78937f;stroke-dasharray:5 3;stroke-width:1.7}

.host{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.device{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}
.wait{fill:#f9f8ef;stroke:#9c7b42;stroke-dasharray:5 4;stroke-width:1.4}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="869" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">主机上命中了冷前缀，怎样复用？</text>
  <text x="24" y="61" class="label">独立场景：A 已结束，C 此时尚未到达</text>
  <rect x="18" y="78" width="464" height="164" rx="10" class="context"/>
  <text x="32" y="108" class="subhead">设备端旧块已被淘汰</text>
  <rect x="32" y="123" width="205" height="68" rx="5" class="cut"/>
  <text x="134.5" y="149" text-anchor="middle" class="token">设备块 7</text>
  <text x="134.5" y="173" text-anchor="middle" class="small">已淘汰</text>
  <rect x="263" y="123" width="205" height="68" rx="5" class="host"/>
  <text x="365.5" y="149" text-anchor="middle" class="token">主机 H0</text>
  <text x="365.5" y="173" text-anchor="middle" class="small">p1–p4 有效备份</text>
  <text x="32" y="220" class="label">索引仍记录相同身份的主机端副本。</text>
  <path d="M250 247V264" class="arrow"/>
  <rect x="18" y="271" width="464" height="141" rx="10" class="artifact"/>
  <text x="32" y="301" class="subhead">C 到达：先查找相同前缀</text>
  <text x="32" y="330" class="label">输入 p1、p2、p3、p4、c5、c6</text>
  <rect x="32" y="345" width="436" height="48" rx="5" class="known"/>
  <text x="250" y="365" text-anchor="middle" class="token">身份和前缀匹配 → 命中 H0</text>
  <text x="250" y="386" text-anchor="middle" class="small">此刻设备计算尚未就绪</text>
  <path d="M250 416V433" class="arrow"/>
  <rect x="18" y="440" width="464" height="236" rx="10" class="context"/>
  <text x="32" y="470" class="subhead">选择复用：恢复到设备</text>
  <text x="32" y="499" class="label">固定源 H0，并申请新的设备块 9。</text>
  <rect x="32" y="513" width="154" height="41" rx="5" class="host"/>
  <text x="109" y="540" text-anchor="middle" class="token">主机 H0</text>
  <path d="M192 533H309" class="arrow"/>
  <text x="250" y="525" text-anchor="middle" class="tiny">复制</text>
  <rect x="315" y="513" width="153" height="41" rx="5" class="device"/>
  <text x="391.5" y="540" text-anchor="middle" class="token">设备块 9</text>
  <text x="32" y="580" class="label">设备块 9 写入成功并就绪，才可供计算引用。</text>
  <rect x="32" y="594" width="436" height="40" rx="5" class="done"/>
  <text x="250" y="620" text-anchor="middle" class="token">C 块表 [9, 5]；块 5 用于新后缀</text>
  <text x="32" y="658" class="small">复用 p1–p4 的 KV，仅计算 c5、c6。</text>
  <rect x="18" y="690" width="464" height="112" rx="10" class="artifact"/>
  <text x="32" y="720" class="subhead">另一种选择：跳过这次复用</text>
  <text x="32" y="749" class="label">备份失效、缺失或恢复等待不划算时，</text>
  <text x="32" y="778" class="label">按普通 Prefill 完整计算 6 个输入。</text>
  <text x="250" y="830" text-anchor="middle" class="small">索引命中 ≠ KV 已驻留设备 ≠ 计算已就绪。</text>
  <text x="250" y="854" text-anchor="middle" class="small">示意逻辑依赖，不表示设备实际传输路径。</text>

</svg>
