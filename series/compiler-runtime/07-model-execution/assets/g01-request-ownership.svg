<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 645" width="500" height="645" role="img" aria-labelledby="ownership-title ownership-desc">
  <title id="ownership-title">模型实例与请求实例的状态归属</title>
  <desc id="ownership-desc">模型实例 M 提供可复用的只读权重 W 和执行实现。执行系统提供可复用的资源池；池中已预留存储不代表任何请求的有效 KV 已经建立。请求 A 输入八个 Token、输出上限四个；独立的后续请求 B 输入三个、输出上限两个。两者都在未执行时具有独立的输入、生成和已计算位置记录，已生成和已计算位置数为零，没有有效 KV。虚线表示对共享模型及资源的引用，只比较状态归属，不表示并行调度。相关任务结束并解除使用权后才允许回收仍被引用的资源。</desc>
  <defs>
    <marker id="g01-own-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}
      .artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.inner{fill:#f5f6ef;stroke:#9ab69e;stroke-width:1.4}.entry{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.request{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
      .ref{fill:none;stroke:#527d64;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#g01-own-arrow)}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="643" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="34" class="head">哪些状态可以跨请求复用？</text>
  <rect x="18" y="54" width="464" height="142" rx="10" class="context"/>
  <text x="32" y="81" class="subhead">模型实例 M</text>
  <rect x="34" y="94" width="432" height="38" rx="6" class="entry"/>
  <text x="250" y="119" class="label" text-anchor="middle">只读权重 W</text>
  <rect x="34" y="140" width="432" height="38" rx="6" class="entry"/>
  <text x="250" y="165" class="label" text-anchor="middle">可复用的执行实现</text>
  <path d="M250 196V217" class="line"/>
  <rect x="18" y="222" width="464" height="104" rx="10" class="artifact"/>
  <text x="32" y="249" class="subhead">关联的共享资源池</text>
  <rect x="34" y="263" width="432" height="37" rx="6" class="inner"/>
  <text x="250" y="287" class="label" text-anchor="middle">可分配的预留空间</text>
  <text x="250" y="317" class="small" text-anchor="middle">预留容量 ≠ 已建立有效 KV</text>

  <path d="M130 377V331" class="ref"/>
  <path d="M370 377V331" class="ref"/>
  <path d="M18 390H9V111H18" class="ref"/>
  <path d="M482 390H491V111H482" class="ref"/>
  <text x="250" y="352" class="small" text-anchor="middle">使用同一模型及其关联资源</text>

  <rect x="18" y="377" width="224" height="171" rx="10" class="request"/>
  <text x="130" y="404" class="subhead" text-anchor="middle">请求 A</text>
  <text x="130" y="430" class="label" text-anchor="middle">输入：8 Token</text>
  <text x="130" y="456" class="label" text-anchor="middle">输出上限：4</text>
  <text x="130" y="482" class="label" text-anchor="middle">已生成数：0</text>
  <text x="130" y="508" class="label" text-anchor="middle">已计算位置数：0</text>
  <text x="130" y="534" class="small" text-anchor="middle">尚无有效 KV</text>
  <rect x="258" y="377" width="224" height="171" rx="10" class="request"/>
  <text x="370" y="404" class="subhead" text-anchor="middle">后续请求 B</text>
  <text x="370" y="430" class="label" text-anchor="middle">输入：3 Token</text>
  <text x="370" y="456" class="label" text-anchor="middle">输出上限：2</text>
  <text x="370" y="482" class="label" text-anchor="middle">已生成数：0</text>
  <text x="370" y="508" class="label" text-anchor="middle">已计算位置数：0</text>
  <text x="370" y="534" class="small" text-anchor="middle">尚无有效 KV</text>

  <text x="250" y="573" class="small" text-anchor="middle">两份请求状态分别记录，仅比较归属</text>
  <text x="250" y="596" class="small" text-anchor="middle">在途任务仍有使用权时，不得回收资源</text>
  <text x="250" y="629" class="small" text-anchor="middle">虚线：引用关系；不表示两个请求并发执行</text>
</svg>
