<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 770" width="500" height="770" role="img" aria-labelledby="title desc">
  <title id="title">计算标准全注意力中逐层、逐位置的 KV 有效载荷</title>
  <desc id="desc">沿用 G02 教学层，FP16，每元素 2 字节，4 个查询头、2 个 KV 头且每头 16 维。每个位置在一层中分别保存 K、V，各 2×16×2 字节即 64 字节，共 128 字节。固定四个查询头及其他条件，MHA 使用四个 KV 头为 256 字节，GQA 使用两个为 128 字节，MQA 一个为 64 字节。A 四轮模型前向完成后有效位置数为八、九、十、十一，对应这一层 1024、1152、1280、1408 字节的有效载荷。以上不含元数据、对齐和预留空间，不代表实际分配容量。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
