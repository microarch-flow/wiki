<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 877" width="500" height="877" role="img" aria-labelledby="title desc">
  <title id="title">请求 C 通过前缀缓存复用请求 A 的历史状态</title>
  <desc id="desc">假设启用前缀缓存且已确认 A 与 C 具有相容的缓存身份，每块四个位置。A 已完成八个输入 p1 至 p8 的 Prefill，暂不继续执行，块表 [7,2]，有效 KV 八个位置。后来 C 输入 p1 至 p4、c5、c6，输出上限三。C 命中包含共同前缀 p1 至 p4 的池块七，直接引用它；只计算 c5、c6 两个新位置，并将新的 KV 保存在池块五的前两个槽，末槽二、三为空。C 完成 Prefill 后块表为 [7,5]，共六个有效 KV 位置；块七被 A 与 C 引用，序列引用数二，块二和五分别只有一个活跃序列引用。图不规定 A、C 的实际调度顺序或计算时间，缓存索引与在途访问权也不计入这里的活跃序列引用数。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:20px}
.head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}
.small{font-size:17px;fill:#416354}.tiny{font-size:16px;fill:#416354}.token{font-size:18px;font-weight:600}
.context{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.artifact{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}
.done{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.4}.known{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}
.unknown{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}
.future{fill:#f5f6ef;stroke:#c4d0c4;stroke-width:1}.line{stroke:#c4d0c4;stroke-width:1.3;fill:none}
.arrow{stroke:#527d64;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#527d64;stroke-width:2;fill:none}
.bar{fill:#82af91;stroke:#527d64;stroke-width:1}.goldbar{fill:#d5b16e;stroke:#9c7b42;stroke-width:1}
.cut{fill:#e9ece5;stroke:#9cae9e;stroke-width:1.4;stroke-dasharray:4 3}.match{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}

.highlight{fill:#d9e9dc;stroke:#9c7b42;stroke-width:2.5}
.empty{fill:#f5f6ef;stroke:#8b9c8e;stroke-width:1.4;stroke-dasharray:3 3}

.idle{fill:#e8eee6;stroke:#78937f;stroke-dasharray:5 3;stroke-width:1.7}
</style>
  </defs>
  <rect x="1" y="1" width="498" height="875" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>

  <text x="24" y="34" class="head">C 怎样复用 A 的前四个位置？</text>
  <text x="24" y="61" class="label">本例开启前缀缓存 · 每块 4 个 Token 位置</text>
  <rect x="18" y="79" width="464" height="159" rx="10" class="context"/>
  <text x="32" y="109" class="subhead">A：已完成 Prefill，暂不推进</text>
  <text x="32" y="137" class="label">8 个输入 · 块表 [7, 2] · 有效 KV 8</text>
  <rect x="32" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="57.5" y="172" text-anchor="middle" class="token">p1</text>
  <rect x="87" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="112.5" y="172" text-anchor="middle" class="token">p2</text>
  <rect x="142" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="167.5" y="172" text-anchor="middle" class="token">p3</text>
  <rect x="197" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="222.5" y="172" text-anchor="middle" class="token">p4</text>
  <rect x="252" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="277.5" y="172" text-anchor="middle" class="token">p5</text>
  <rect x="307" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="332.5" y="172" text-anchor="middle" class="token">p6</text>
  <rect x="362" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="387.5" y="172" text-anchor="middle" class="token">p7</text>
  <rect x="417" y="149" width="51" height="34" rx="4" class="done"/>
  <text x="442.5" y="172" text-anchor="middle" class="token">p8</text>

  <path d="M32 189V197H248V189 M252 189V197H468V189" class="line"/>
  <text x="140" y="220" text-anchor="middle" class="small">池块 7</text>
  <text x="360" y="220" text-anchor="middle" class="small">池块 2</text>
  <path d="M250 243V260" class="arrow"/>
  <rect x="18" y="267" width="464" height="179" rx="10" class="artifact"/>
  <text x="32" y="297" class="subhead">后到的 C：6 个输入，最多生成 3 个</text>
  <text x="32" y="325" class="label">相同缓存身份；前 4 个位置与 A 相同。</text>
  <rect x="32" y="337" width="68" height="34" rx="4" class="done"/>
  <text x="66.0" y="360" text-anchor="middle" class="token">p1</text>
  <rect x="105" y="337" width="68" height="34" rx="4" class="done"/>
  <text x="139.0" y="360" text-anchor="middle" class="token">p2</text>
  <rect x="178" y="337" width="68" height="34" rx="4" class="done"/>
  <text x="212.0" y="360" text-anchor="middle" class="token">p3</text>
  <rect x="251" y="337" width="68" height="34" rx="4" class="done"/>
  <text x="285.0" y="360" text-anchor="middle" class="token">p4</text>
  <rect x="324" y="337" width="68" height="34" rx="4" class="known"/>
  <text x="358.0" y="360" text-anchor="middle" class="token">c5</text>
  <rect x="397" y="337" width="68" height="34" rx="4" class="known"/>
  <text x="431.0" y="360" text-anchor="middle" class="token">c6</text>

  <path d="M32 377V385H319V377 M324 377V385H465V377" class="line"/>
  <text x="175.5" y="409" text-anchor="middle" class="subhead">命中池块 7，直接引用</text>
  <text x="394.5" y="409" text-anchor="middle" class="label">仅计算 c5、c6</text>
  <text x="32" y="433" class="small">跳过共同前缀的重算；后缀仍读取所需历史。</text>
  <path d="M250 451V468" class="arrow"/>
  <rect x="18" y="475" width="464" height="232" rx="10" class="context"/>
  <text x="32" y="505" class="subhead">C 完成 Prefill 后</text>
  <text x="32" y="535" class="label">A 的块表 [7, 2]；C 的块表 [7, 5]</text>
  <text x="32" y="565" class="small">池块</text>
  <text x="399" y="565" text-anchor="middle" class="small">序列引用数</text>
  <text x="49" y="600" text-anchor="middle" class="subhead">7</text>
  <rect x="83" y="576" width="60" height="34" rx="4" class="done"/>
  <text x="113.0" y="599" text-anchor="middle" class="token">p1</text>
  <rect x="148" y="576" width="60" height="34" rx="4" class="done"/>
  <text x="178.0" y="599" text-anchor="middle" class="token">p2</text>
  <rect x="213" y="576" width="60" height="34" rx="4" class="done"/>
  <text x="243.0" y="599" text-anchor="middle" class="token">p3</text>
  <rect x="278" y="576" width="60" height="34" rx="4" class="done"/>
  <text x="308.0" y="599" text-anchor="middle" class="token">p4</text>
  <text x="399" y="600" text-anchor="middle" class="subhead">2</text>
  <text x="49" y="642" text-anchor="middle" class="subhead">2</text>
  <rect x="83" y="618" width="60" height="34" rx="4" class="done"/>
  <text x="113.0" y="641" text-anchor="middle" class="token">p5</text>
  <rect x="148" y="618" width="60" height="34" rx="4" class="done"/>
  <text x="178.0" y="641" text-anchor="middle" class="token">p6</text>
  <rect x="213" y="618" width="60" height="34" rx="4" class="done"/>
  <text x="243.0" y="641" text-anchor="middle" class="token">p7</text>
  <rect x="278" y="618" width="60" height="34" rx="4" class="done"/>
  <text x="308.0" y="641" text-anchor="middle" class="token">p8</text>
  <text x="399" y="642" text-anchor="middle" class="subhead">1</text>
  <text x="49" y="684" text-anchor="middle" class="subhead">5</text>
  <rect x="83" y="660" width="60" height="34" rx="4" class="done"/>
  <text x="113.0" y="683" text-anchor="middle" class="token">c5</text>
  <rect x="148" y="660" width="60" height="34" rx="4" class="done"/>
  <text x="178.0" y="683" text-anchor="middle" class="token">c6</text>
  <rect x="213" y="660" width="60" height="34" rx="4" class="empty"/>
  <text x="243.0" y="683" text-anchor="middle" class="token">—</text>
  <rect x="278" y="660" width="60" height="34" rx="4" class="empty"/>
  <text x="308.0" y="683" text-anchor="middle" class="token">—</text>
  <text x="399" y="684" text-anchor="middle" class="subhead">1</text>

  <rect x="18" y="721" width="464" height="88" rx="10" class="artifact"/>
  <text x="32" y="751" class="subhead">C 的 6 个有效 KV 位置</text>
  <text x="32" y="780" class="label">复用 4 个 + 本轮计算 2 个；新占用 1 块。</text>
  <text x="250" y="837" text-anchor="middle" class="small">本图是状态对照，不规定 A、C 的调度或时间。</text>
  <text x="250" y="860" text-anchor="middle" class="small">引用数只计活跃序列；缓存索引与访问权另计。</text>

</svg>
