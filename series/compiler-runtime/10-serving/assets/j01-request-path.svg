<svg xmlns="http://www.w3.org/2000/svg" width="500" height="735" viewBox="0 0 500 735" role="img" aria-labelledby="title desc">
  <title id="title">请求 C 从服务入口到模型副本，再返回原请求连接</title>
  <desc id="desc">用户 C 通过原请求连接发送请求。服务入口识别请求与模型版本，准备输入并作出服务级接纳决定。路由选择副本 0，将 C 交给其引擎等待队列。引擎内部作出资源准入和执行选择，执行器及生成控制产生输出，经服务入口返回 C 的原请求连接。副本 0 和副本 1 各有自己的完整模型、独立 KV 池及引擎，已有请求 A、B 分别在两副本中推进。此次未向副本 1 派发 C。绿色实线表示本次请求与执行路径，蓝色虚线表示输出路径，灰色点线表示未选中的候选路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <marker id="output-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#426e90"/></marker>
    <marker id="candidate-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#88958c"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}
      .panel{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.5}.other{fill:#eef0e9;stroke:#b0b9ab;stroke-width:1.4}.input{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.4}
      .chosen{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.5}.box{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.output{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.4}
      .arr{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#426e90;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#output-arrow)}
      .candidate{fill:none;stroke:#88958c;stroke-width:1.8;stroke-dasharray:2 4;marker-end:url(#candidate-arrow)}
      .line{fill:none;stroke:#c4d0c4;stroke-width:1.3}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="733" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="35" class="head">从请求入口到模型副本</text>
  <rect x="72" y="51" width="356" height="56" rx="8" class="input"/>
  <text x="250" y="76" text-anchor="middle" class="subhead">用户 C · 原请求连接</text>
  <text x="250" y="96" text-anchor="middle" class="small">模型、输入及生成参数</text>
  <path d="M250 107V128" class="arr"/>

  <rect x="72" y="131" width="356" height="102" rx="8" class="panel"/>
  <text x="250" y="158" text-anchor="middle" class="subhead">服务入口</text>
  <text x="250" y="182" text-anchor="middle" class="label">识别请求、校验模型身份、准备输入</text>
  <text x="250" y="208" text-anchor="middle" class="label">服务级接纳 · 本次通过</text>
  <path d="M250 233V253" class="arr"/>
  <rect x="72" y="256" width="356" height="57" rx="8" class="chosen"/>
  <text x="250" y="280" text-anchor="middle" class="subhead">副本路由</text>
  <text x="250" y="302" text-anchor="middle" class="small">比较候选 · 本次选择副本 0</text>

  <path d="M232 313V330H139V344" class="arr"/>
  <path d="M268 313V330H367V344" class="candidate"/>
  <rect x="34" y="347" width="210" height="299" rx="9" class="panel"/>
  <rect x="256" y="347" width="216" height="299" rx="9" class="other"/>
  <text x="139" y="374" text-anchor="middle" class="subhead">副本 0 · 已选</text>
  <text x="364" y="374" text-anchor="middle" class="subhead">副本 1 · 候选</text>
  <rect x="46" y="386" width="186" height="61" rx="6" class="box"/>
  <rect x="268" y="386" width="192" height="61" rx="6" class="box"/>
  <text x="139" y="409" text-anchor="middle" class="label">完整模型 M</text>
  <text x="139" y="432" text-anchor="middle" class="label">独立 KV 池 0</text>
  <text x="364" y="409" text-anchor="middle" class="label">完整模型 M</text>
  <text x="364" y="432" text-anchor="middle" class="label">独立 KV 池 1</text>
  <rect x="46" y="458" width="186" height="46" rx="6" class="chosen"/>
  <text x="139" y="487" text-anchor="middle" class="label">引擎队列：C</text>
  <path d="M139 504V519" class="arr"/>
  <rect x="46" y="522" width="186" height="44" rx="6" class="chosen"/>
  <text x="139" y="550" text-anchor="middle" class="label">引擎准入、执行选择</text>
  <path d="M139 566V581" class="arr"/>
  <rect x="46" y="584" width="186" height="48" rx="6" class="output"/>
  <text x="139" y="604" text-anchor="middle" class="label">执行器及生成控制</text>
  <text x="139" y="624" text-anchor="middle" class="small">A 与 C 的工作可入批</text>

  <rect x="268" y="458" width="192" height="46" rx="6" class="box"/>
  <text x="364" y="487" text-anchor="middle" class="label">本次不接收 C</text>
  <rect x="268" y="522" width="192" height="110" rx="6" class="box"/>
  <text x="364" y="566" text-anchor="middle" class="label">自身引擎及执行器</text>
  <text x="364" y="594" text-anchor="middle" class="small">继续处理已有请求 B</text>

  <path d="M46 608H17V183H69" class="return"/>
  <path d="M72 150H33V78H69" class="return"/>
  <path d="M24 661H54" class="arr"/>
  <text x="62" y="667" class="small">请求及执行</text>
  <path d="M174 661H204" class="return"/>
  <text x="212" y="667" class="small">返回输出</text>
  <path d="M318 661H348" class="candidate"/>
  <text x="356" y="667" class="small">未选候选</text>
  <path d="M24 680H476" class="line"/>
  <text x="250" y="705" text-anchor="middle" class="small">两副本独立；图示一次路由的选择。</text>
  <text x="250" y="724" text-anchor="middle" class="small">服务级接纳 ≠ 引擎内部资源准入。</text>
</svg>
