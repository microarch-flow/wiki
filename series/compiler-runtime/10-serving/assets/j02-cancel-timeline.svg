<svg xmlns="http://www.w3.org/2000/svg" width="500" height="728" viewBox="0 0 500 728" role="img" aria-labelledby="title desc">
  <title id="title">C 的取消传播与一次已提交轮的结束</title>
  <desc id="desc">在副本 0，C 的首个输出已经发送。t1：混合轮提交，计算 A 的第 10 个位置与 C 的第 7 个位置。t2：服务受理 C 的取消，不再向其输出通道提交新内容。t3：引擎观察到取消，停止 C 的新增工作，解除 C 的逻辑块引用；新请求 D 尝试申请块，但池中没有可重新分配的块。t4：本轮对相关资源的最后访问已经结束，A 继续生成第 3 个输出，C 的迟到生成结果被丢弃。满足回收条件后归还 C 的私有块，D 可以重新申请。事件序号表示本例顺序而非等比例时间。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:19px}
      .head{font-size:23px;font-weight:700}.subhead{font-size:20px;font-weight:700}.label{font-size:18px;fill:#416354}.small{font-size:17px;fill:#416354}
      .panel{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.wait{fill:#f2e4c9;stroke:#aa9163;stroke-width:1.4}.exec{fill:#dfe8ef;stroke:#7d9eb1;stroke-width:1.4}
      .event{fill:#f5f6ef;stroke:#527d64;stroke-width:2}.axis{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#arrow)}.boundary{fill:none;stroke:#c4d0c4;stroke-width:1.3}
      .taskspan{stroke:#426e90;stroke-width:2;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="726" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="35" class="head">取消请求与结束设备访问</text>
  <text x="24" y="60" class="label">副本 0：A 与 C 同时推进</text>

  <path d="M37 101V640" class="axis"/>
  <circle cx="37" cy="110" r="7" class="event"/>
  <rect x="76" y="79" width="400" height="64" rx="8" class="panel"/>
  <text x="91" y="104" class="subhead">起点 · C 首个输出已发送</text>
  <text x="91" y="128" class="label">A 已计算 9 位置，C 已计算 6 位置</text>

  <circle cx="37" cy="180" r="7" class="event"/>
  <text x="16" y="186" class="small" text-anchor="middle">t1</text>
  <rect x="76" y="154" width="384" height="89" rx="8" class="exec"/>
  <text x="91" y="180" class="subhead">执行 · 混合轮已提交</text>
  <text x="91" y="205" class="label">A 计算位置 10；C 计算位置 7</text>
  <text x="91" y="229" class="label">已提交，尚未确认相关访问结束</text>

  <circle cx="37" cy="291" r="7" class="event"/>
  <text x="16" y="297" class="small" text-anchor="middle">t2</text>
  <rect x="76" y="260" width="384" height="81" rx="8" class="wait"/>
  <text x="91" y="286" class="subhead">服务 · 受理 C 的取消</text>
  <text x="91" y="309" class="label">停止提交 C 的新输出</text>
  <text x="91" y="331" class="label">向目标引擎传播取消信号</text>

  <circle cx="37" cy="403" r="7" class="event"/>
  <text x="16" y="409" class="small" text-anchor="middle">t3</text>
  <rect x="76" y="359" width="384" height="112" rx="8" class="wait"/>
  <text x="91" y="385" class="subhead">引擎 · 观察到取消</text>
  <text x="91" y="410" class="label">停止 C 的新增工作，解除逻辑引用</text>
  <text x="91" y="435" class="label">D 申请一个块，但仍无可用块</text>
  <text x="91" y="458" class="small">此前提交的轮仍可能访问旧资源</text>

  <path d="M472 154V477" class="taskspan"/>
  <path d="M466 154H478M466 477H478" class="taskspan"/>

  <circle cx="37" cy="540" r="7" class="event"/>
  <text x="16" y="546" class="small" text-anchor="middle">t4</text>
  <rect x="76" y="489" width="400" height="142" rx="8" class="panel"/>
  <text x="91" y="516" class="subhead">确认本轮最后访问结束</text>
  <text x="91" y="541" class="label">A 继续生成第 3 个输出</text>
  <text x="91" y="566" class="label">C 的迟到结果被丢弃</text>
  <text x="91" y="591" class="label">C 的私有块可归还，D 可以重申请</text>
  <text x="91" y="615" class="small">若另有相关在途传输，也必须结束</text>

  <path d="M24 651H476" class="boundary"/>
  <text x="24" y="674" class="small">蓝色虚线：本轮尚未确认访问结束。</text>
  <text x="24" y="696" class="small">图示事件先后关系，不是实测耗时；</text>
  <text x="24" y="716" class="small">已发送的输出不能保证被撤回。</text>
</svg>
