<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 424" width="500" height="424" role="img" aria-labelledby="behavior-title behavior-desc">
  <title id="behavior-title">返回值相同，调用者观察到的状态可能不同</title>
  <desc id="behavior-desc">在两次独立的函数调用中，输入都是 a 等于 2、b 等于 3、c 等于 4，调用者提供的 history 列表初始均为 [7]。左侧函数只计算并返回 20，不修改 history，调用结束后列表仍为 [7]。右侧函数计算同一结果，并调用 history.append(20)，也返回 20，但调用者的列表已变为 [7,20]。</desc>
  <defs>
    <marker id="b-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#396b55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.label{font-size:18px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:20px;font-weight:600}
      .step{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.plain{fill:#eef0e6;stroke:#9aa89a;stroke-width:1.4}.changed{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.5}.changedText{fill:#674f27}.value{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.5}
      .edge{fill:none;stroke:#396b55;stroke-width:2;marker-end:url(#b-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="422" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="head" x="250" y="34" text-anchor="middle">两次独立调用，起始状态相同</text>
  <rect class="step" x="24" y="49" width="452" height="78" rx="10"/>
  <text class="code" x="250" y="78" text-anchor="middle">a = 2, b = 3, c = 4</text>
  <text class="label" x="38" y="108">调用者持有的列表</text>
  <text class="code" x="276" y="108" text-anchor="middle">history = [7]</text>
  <path class="edge" d="M250 127V145H133V164"/>
  <path class="edge" d="M250 145H367V164"/>
  <g text-anchor="middle">
    <rect class="plain" x="24" y="170" width="218" height="132" rx="10"/>
    <text class="head" x="133" y="200">只计算</text>
    <text class="code" x="133" y="230">(2 + 3) * 4</text>
    <text class="label" x="133" y="259">不修改 history</text>
    <text class="code" x="133" y="286">return 20</text>
    <rect class="step" x="258" y="170" width="218" height="132" rx="10"/>
    <text class="head" x="367" y="200">计算并记录</text>
    <text class="code" x="367" y="230">(2 + 3) * 4</text>
    <text class="code changedText" x="367" y="259" style="font-size:19px">history.append(20)</text>
    <text class="code" x="367" y="286">return 20</text>
  </g>
  <path class="edge" d="M133 302V324"/><path class="edge" d="M367 302V324"/>
  <g text-anchor="middle">
    <rect class="value" x="24" y="330" width="218" height="35" rx="7"/>
    <text x="133" y="354">返回值 20</text>
    <rect class="value" x="258" y="330" width="218" height="35" rx="7"/>
    <text x="367" y="354">返回值 20</text>
    <rect class="plain" x="24" y="373" width="218" height="36" rx="7"/>
    <text class="code" x="133" y="397">history = [7]</text>
    <rect class="changed" x="258" y="373" width="218" height="36" rx="7"/>
    <text class="code changedText" x="367" y="397">history = [7, 20]</text>
  </g>
</svg>
