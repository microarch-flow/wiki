<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 694" width="500" height="694" role="img" aria-labelledby="task-title task-desc">
  <title id="task-title">向量加法任务：一种主机与设备分离的教学示例</title>
  <desc id="task-desc">本例假设主机与设备存储分离，需要显式搬入输入和写回输出。主机内存中的 A 为 2、1、4，B 为 3、4、2，搬入设备可访问的输入缓冲区 d_A 和 d_B。任务引用 vec_add，绑定 d_A、d_B、d_Y 三个设备可访问地址与长度 3。内核执行逐元素加法，写入设备输出缓冲区 d_Y，结果为 5、5、6，随后写回主机内存。箭头只表示本例需要的数据交接和先后关系，不表示实际时刻或所有设备都要求复制。</desc>
  <defs>
    <marker id="task-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#527d64"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:20px}.label{font-size:18px;fill:#416354}.small{font-size:16px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:21px;font-weight:600}.code-small{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:18px;font-weight:500}.selected{font-weight:700;fill:#78591b}
      .host{fill:#f9f8ef;stroke:#b8ba9e;stroke-width:1.4}.device{fill:#edf2e8;stroke:#9ab69e;stroke-width:1.4}.cell{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.target{fill:#f2e4c9;stroke:#9c7b42;stroke-width:1.6}.kernel{fill:#d1e4d5;stroke:#6f9a80;stroke-width:1.5}.edge{fill:none;stroke:#527d64;stroke-width:2;marker-end:url(#task-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="692" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="33" class="head">一次向量加法：从主机到设备</text>
  <text x="24" y="57" class="small">教学假设：主机存储与设备存储分离</text>

  <rect x="18" y="71" width="464" height="106" rx="10" class="host"/>
  <text x="32" y="99" class="subhead">Host 主机存储</text>
  <text x="33" y="144" class="code-small">A</text>
  <text x="267" y="144" class="code-small">B</text>
  <g class="cell">
    <rect x="59" y="117" width="49" height="40" rx="5"/><rect x="110" y="117" width="49" height="40" rx="5"/><rect x="161" y="117" width="49" height="40" rx="5"/>
    <rect x="293" y="117" width="49" height="40" rx="5"/><rect x="344" y="117" width="49" height="40" rx="5"/><rect x="395" y="117" width="49" height="40" rx="5"/>
  </g>
  <g class="code" text-anchor="middle"><text x="83.5" y="144">2</text><text x="134.5" y="144">1</text><text x="185.5" y="144">4</text><text x="317.5" y="144">3</text><text x="368.5" y="144">4</text><text x="419.5" y="144">2</text></g>

  <path d="M250 177V222" class="edge"/>
  <text x="263" y="205" class="label">本例显式搬入</text>

  <rect x="18" y="229" width="464" height="318" rx="10" class="device"/>
  <text x="32" y="258" class="subhead">Device 设备端</text>
  <text x="33" y="294" class="code-small">d_A</text>
  <text x="267" y="294" class="code-small">d_B</text>
  <g class="cell">
    <rect x="78" y="270" width="44" height="36" rx="5"/><rect x="124" y="270" width="44" height="36" rx="5"/><rect x="170" y="270" width="44" height="36" rx="5"/>
    <rect x="312" y="270" width="44" height="36" rx="5"/><rect x="358" y="270" width="44" height="36" rx="5"/><rect x="404" y="270" width="44" height="36" rx="5"/>
  </g>
  <g class="code-small" text-anchor="middle"><text x="100" y="294">2</text><text x="146" y="294">1</text><text x="192" y="294">4</text><text x="334" y="294">3</text><text x="380" y="294">4</text><text x="426" y="294">2</text></g>
  <path d="M146 307V320H225V333" class="edge"/>
  <path d="M380 307V320H275V333" class="edge"/>
  <rect x="45" y="337" width="410" height="103" class="kernel" rx="9"/>
  <text x="250" y="367" class="subhead" text-anchor="middle">执行加法内核</text>
  <text x="250" y="397" class="code-small" text-anchor="middle">vec_add(d_A, d_B, d_Y, 3)</text>
  <text x="250" y="425" class="small" text-anchor="middle">d_A、d_B、d_Y 为设备可访问地址</text>
  <path d="M250 440V464" class="edge"/>
  <text x="78" y="491" class="code-small">d_Y</text>
  <g class="target"><rect x="140" y="469" width="68" height="40" rx="6"/><rect x="216" y="469" width="68" height="40" rx="6"/><rect x="292" y="469" width="68" height="40" rx="6"/></g>
  <g class="code selected" text-anchor="middle"><text x="174" y="496">5</text><text x="250" y="496">5</text><text x="326" y="496">6</text></g>
  <text x="250" y="533" class="label" text-anchor="middle">设备输出缓冲区</text>

  <path d="M250 547V589" class="edge"/>
  <text x="263" y="574" class="label">本例显式写回</text>

  <rect x="18" y="595" width="464" height="64" rx="10" class="host"/>
  <text x="34" y="634" class="subhead">Host 结果 Y</text>
  <g class="target"><rect x="249" y="607" width="55" height="40" rx="6"/><rect x="310" y="607" width="55" height="40" rx="6"/><rect x="371" y="607" width="55" height="40" rx="6"/></g>
  <g class="code selected" text-anchor="middle"><text x="276.5" y="634">5</text><text x="337.5" y="634">5</text><text x="398.5" y="634">6</text></g>
  <text x="250" y="682" class="small" text-anchor="middle">箭头表示本例的数据交接与先后关系，不代表时刻</text>
</svg>
