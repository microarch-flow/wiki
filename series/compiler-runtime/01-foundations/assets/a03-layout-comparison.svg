<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 558" width="500" height="558" role="img" aria-labelledby="layout-title layout-desc">
  <title id="layout-title">相同逻辑张量，不同内存排列</title>
  <desc id="layout-desc">形状为 2×3 的 int32 张量 A，各元素占 4 字节。逻辑矩阵为 [[2,1,4],[3,5,6]]。按行连续排列，内存元素依次为 2、1、4、3、5、6，A[1,0]=3 对应字节偏移 12，地址 1012；按列连续排列，依次为 2、3、1、5、4、6，A[1,0]=3 对应字节偏移 4，地址 1004。两个示例都以 1000 为假定存储基址。</desc>
  <defs>
    <marker id="pointer" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c7b42"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:21px}.label{font-size:18px;fill:#416354}.small{font-size:16px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:21px;font-weight:600}.code-small{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:16px;font-weight:500}.selected{font-weight:700;fill:#78591b}
      .cell{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.target{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}.panel{fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}.edge{fill:none;stroke:#9c7b42;stroke-width:2;marker-end:url(#pointer)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="556" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="32" class="head">同一逻辑坐标，不同存储位置</text>
  <text x="24" y="61" class="label">A 的形状为 2 × 3，int32 每元素占 4 字节</text>
  <text x="24" y="102" class="subhead">逻辑坐标</text>
  <text x="24" y="129" class="small">行 i / 列 j</text>
  <text x="182.0" y="96" class="code-small" text-anchor="middle">0</text>
  <text x="248.0" y="96" class="code-small" text-anchor="middle">1</text>
  <text x="314.0" y="96" class="code-small" text-anchor="middle">2</text>
  <text x="136" y="131.0" class="code-small" text-anchor="middle">0</text>
  <rect class="cell" x="151" y="104" width="62" height="42" rx="6"/>
  <text x="182.0" y="132.0" class="code" text-anchor="middle">2</text>
  <rect class="cell" x="217" y="104" width="62" height="42" rx="6"/>
  <text x="248.0" y="132.0" class="code" text-anchor="middle">1</text>
  <rect class="cell" x="283" y="104" width="62" height="42" rx="6"/>
  <text x="314.0" y="132.0" class="code" text-anchor="middle">4</text>
  <text x="136" y="177.0" class="code-small" text-anchor="middle">1</text>
  <rect class="target" x="151" y="150" width="62" height="42" rx="6"/>
  <text x="182.0" y="178.0" class="code selected" text-anchor="middle">3</text>
  <rect class="cell" x="217" y="150" width="62" height="42" rx="6"/>
  <text x="248.0" y="178.0" class="code" text-anchor="middle">5</text>
  <rect class="cell" x="283" y="150" width="62" height="42" rx="6"/>
  <text x="314.0" y="178.0" class="code" text-anchor="middle">6</text>
  <text x="369" y="165" class="code-small selected">A[1,0]</text>
  <text x="369" y="191" class="code selected">= 3</text>
  <text x="24" y="216" class="label">下列两种排列分别假定基址均为 1000。</text>
  <rect class="panel" x="16" y="235" width="468" height="142" rx="10"/>
  <text x="24" y="263" class="subhead">按行连续排列（row-major）</text>
  <rect class="cell" x="98" y="276" width="61" height="42" rx="6"/>
  <text x="128.5" y="304" class="code" text-anchor="middle">2</text>
  <text x="128.5" y="338" class="code-small" text-anchor="middle">0</text>
  <rect class="cell" x="161" y="276" width="61" height="42" rx="6"/>
  <text x="191.5" y="304" class="code" text-anchor="middle">1</text>
  <text x="191.5" y="338" class="code-small" text-anchor="middle">4</text>
  <rect class="cell" x="224" y="276" width="61" height="42" rx="6"/>
  <text x="254.5" y="304" class="code" text-anchor="middle">4</text>
  <text x="254.5" y="338" class="code-small" text-anchor="middle">8</text>
  <rect class="target" x="287" y="276" width="61" height="42" rx="6"/>
  <text x="317.5" y="304" class="code selected" text-anchor="middle">3</text>
  <text x="317.5" y="338" class="code-small selected" text-anchor="middle">12</text>
  <rect class="cell" x="350" y="276" width="61" height="42" rx="6"/>
  <text x="380.5" y="304" class="code" text-anchor="middle">5</text>
  <text x="380.5" y="338" class="code-small" text-anchor="middle">16</text>
  <rect class="cell" x="413" y="276" width="61" height="42" rx="6"/>
  <text x="443.5" y="304" class="code" text-anchor="middle">6</text>
  <text x="443.5" y="338" class="code-small" text-anchor="middle">20</text>
  <text x="24" y="338" class="small">字节偏移</text>
  <text x="98" y="363" class="code selected">A[1,0]：1000 + 12 = 1012</text>
  <rect class="panel" x="16" y="393" width="468" height="148" rx="10"/>
  <text x="24" y="421" class="subhead">按列连续排列（column-major）</text>
  <rect class="cell" x="98" y="434" width="61" height="42" rx="6"/>
  <text x="128.5" y="462" class="code" text-anchor="middle">2</text>
  <text x="128.5" y="496" class="code-small" text-anchor="middle">0</text>
  <rect class="target" x="161" y="434" width="61" height="42" rx="6"/>
  <text x="191.5" y="462" class="code selected" text-anchor="middle">3</text>
  <text x="191.5" y="496" class="code-small selected" text-anchor="middle">4</text>
  <rect class="cell" x="224" y="434" width="61" height="42" rx="6"/>
  <text x="254.5" y="462" class="code" text-anchor="middle">1</text>
  <text x="254.5" y="496" class="code-small" text-anchor="middle">8</text>
  <rect class="cell" x="287" y="434" width="61" height="42" rx="6"/>
  <text x="317.5" y="462" class="code" text-anchor="middle">5</text>
  <text x="317.5" y="496" class="code-small" text-anchor="middle">12</text>
  <rect class="cell" x="350" y="434" width="61" height="42" rx="6"/>
  <text x="380.5" y="462" class="code" text-anchor="middle">4</text>
  <text x="380.5" y="496" class="code-small" text-anchor="middle">16</text>
  <rect class="cell" x="413" y="434" width="61" height="42" rx="6"/>
  <text x="443.5" y="462" class="code" text-anchor="middle">6</text>
  <text x="443.5" y="496" class="code-small" text-anchor="middle">20</text>
  <text x="24" y="496" class="small">字节偏移</text>
  <text x="98" y="521" class="code selected">A[1,0]：1000 + 4 = 1004</text>
</svg>
