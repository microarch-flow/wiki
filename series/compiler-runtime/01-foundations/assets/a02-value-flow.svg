<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 422" width="500" height="422" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">计算中的值依赖关系</title>
  <desc id="flow-desc">输入 a 等于 2、b 等于 3，提供给加法操作，得到中间值 v1 等于 5。v1 和输入 c 等于 4 提供给乘法操作，得到结果 v2 等于 20。箭头表示值从提供者传递给使用者，不表示物理电路连接或时钟。</desc>
  <defs>
    <marker id="a02-data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#396b55"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.label{font-size:18px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:21px;font-weight:600}
      .input{fill:#e8e9df;stroke:#9aa89a;stroke-width:1.5}.op{fill:#e0ebe3;stroke:#82a18e;stroke-width:1.5}.value{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.5}
      .edge{fill:none;stroke:#396b55;stroke-width:2;marker-end:url(#a02-data-arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="420" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text class="head" x="24" y="33">一个值由谁提供，又被谁使用？</text>
  <g text-anchor="middle">
    <rect class="input" x="48" y="53" width="120" height="40" rx="8"/>
    <text class="code" x="108" y="79">a = 2</text>
    <rect class="input" x="182" y="53" width="120" height="40" rx="8"/>
    <text class="code" x="242" y="79">b = 3</text>
    <rect class="op" x="110" y="127" width="130" height="42" rx="9"/>
    <text x="175" y="155">加法 +</text>
    <rect class="value" x="110" y="205" width="130" height="42" rx="8"/>
    <text class="code" x="175" y="233">v1 = 5</text>
    <rect class="input" x="322" y="205" width="126" height="42" rx="8"/>
    <text class="code" x="385" y="233">c = 4</text>
    <rect class="op" x="185" y="281" width="130" height="42" rx="9"/>
    <text x="250" y="309">乘法 ×</text>
    <rect class="value" x="185" y="358" width="130" height="42" rx="8"/>
    <text class="code" x="250" y="386">v2 = 20</text>
  </g>
  <path class="edge" d="M108 93L146 123"/>
  <path class="edge" d="M242 93L204 123"/>
  <path class="edge" d="M175 169V201"/>
  <path class="edge" d="M175 247L218 277"/>
  <path class="edge" d="M385 247L282 277"/>
  <path class="edge" d="M250 323V354"/>
  <text class="label" x="332" y="107">输入值</text>
  <text class="label" x="256" y="151">操作</text>
  <text class="label" x="26" y="232">中间值</text>
  <text class="label" x="329" y="385">结果值</text>
</svg>
