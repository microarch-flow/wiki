<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 524" width="500" height="524" role="img" aria-labelledby="transpose-title transpose-desc">
  <title id="transpose-title">转置视图：不同逻辑索引，共享同一存储</title>
  <desc id="transpose-desc">原张量 A 的形状为 (2,3)，以元素为单位的步长为 (3,1)。转置视图 T=A^T 的形状为 (3,2)，步长为 (1,3)。两个张量视图共享同一段按行排列的内存 [2,1,4,3,5,6]，没有搬运元素。A[1,0] 与 T[0,1] 都引用值 3，对应元素偏移 3、字节偏移 12，以 1000 为基址时，地址为 1012。</desc>
  <defs>
    <marker id="pointer" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9c7b42"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#173d35;font-size:21px}
      .head{font-weight:700;font-size:23px}.subhead{font-weight:700;font-size:21px}.label{font-size:18px;fill:#416354}.small{font-size:16px;fill:#416354}.code{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:21px;font-weight:600}.code-small{font-family:"Noto Sans Mono CJK SC","Consolas",monospace;font-size:16px;font-weight:500}.selected{font-weight:700;fill:#78591b}
      .cell{fill:#d9e9dc;stroke:#6f9a80;stroke-width:1.3}.target{fill:#f2e4c9;stroke:#9c7b42;stroke-width:2}.panel{fill:#edf2e8;stroke:#cad8cb;stroke-width:1.2}.edge{fill:none;stroke:#9c7b42;stroke-width:2;marker-end:url(#pointer)}
    </style>
  </defs>
  <rect x="1" y="1" width="498" height="522" rx="14" fill="#f5f6ef" stroke="#c4d0c4" stroke-width="1.3"/>
  <text x="24" y="32" class="head">转置视图：不同索引，同一份存储</text>
  <rect class="panel" x="16" y="48" width="228" height="246" rx="10"/>
  <rect class="panel" x="256" y="48" width="228" height="246" rx="10"/>
  <text x="130" y="77" class="subhead" text-anchor="middle">原张量 A</text>
  <text x="370" y="77" class="subhead" text-anchor="middle">转置视图 T = Aᵀ</text>
  <text x="130" y="103" class="small" text-anchor="middle">形状 (2,3)</text>
  <text x="370" y="103" class="small" text-anchor="middle">形状 (3,2)</text>
  <text x="130" y="128" class="small" text-anchor="middle">元素步长 (3,1)</text>
  <text x="370" y="128" class="small" text-anchor="middle">元素步长 (1,3)</text>
  <text x="79.5" y="147" class="code-small" text-anchor="middle">0</text>
  <text x="139.5" y="147" class="code-small" text-anchor="middle">1</text>
  <text x="199.5" y="147" class="code-small" text-anchor="middle">2</text>
  <text x="36" y="177.0" class="code-small" text-anchor="middle">0</text>
  <rect class="cell" x="51" y="155" width="57" height="32" rx="6"/>
  <text x="79.5" y="178.0" class="code" text-anchor="middle">2</text>
  <rect class="cell" x="111" y="155" width="57" height="32" rx="6"/>
  <text x="139.5" y="178.0" class="code" text-anchor="middle">1</text>
  <rect class="cell" x="171" y="155" width="57" height="32" rx="6"/>
  <text x="199.5" y="178.0" class="code" text-anchor="middle">4</text>
  <text x="36" y="212.0" class="code-small" text-anchor="middle">1</text>
  <rect class="target" x="51" y="190" width="57" height="32" rx="6"/>
  <text x="79.5" y="213.0" class="code selected" text-anchor="middle">3</text>
  <rect class="cell" x="111" y="190" width="57" height="32" rx="6"/>
  <text x="139.5" y="213.0" class="code" text-anchor="middle">5</text>
  <rect class="cell" x="171" y="190" width="57" height="32" rx="6"/>
  <text x="199.5" y="213.0" class="code" text-anchor="middle">6</text>
  <text x="341.5" y="147" class="code-small" text-anchor="middle">0</text>
  <text x="401.5" y="147" class="code-small" text-anchor="middle">1</text>
  <text x="298" y="177.0" class="code-small" text-anchor="middle">0</text>
  <rect class="cell" x="313" y="155" width="57" height="32" rx="6"/>
  <text x="341.5" y="178.0" class="code" text-anchor="middle">2</text>
  <rect class="target" x="373" y="155" width="57" height="32" rx="6"/>
  <text x="401.5" y="178.0" class="code selected" text-anchor="middle">3</text>
  <text x="298" y="212.0" class="code-small" text-anchor="middle">1</text>
  <rect class="cell" x="313" y="190" width="57" height="32" rx="6"/>
  <text x="341.5" y="213.0" class="code" text-anchor="middle">1</text>
  <rect class="cell" x="373" y="190" width="57" height="32" rx="6"/>
  <text x="401.5" y="213.0" class="code" text-anchor="middle">5</text>
  <text x="298" y="247.0" class="code-small" text-anchor="middle">2</text>
  <rect class="cell" x="313" y="225" width="57" height="32" rx="6"/>
  <text x="341.5" y="248.0" class="code" text-anchor="middle">4</text>
  <rect class="cell" x="373" y="225" width="57" height="32" rx="6"/>
  <text x="401.5" y="248.0" class="code" text-anchor="middle">6</text>
  <text x="130" y="281" class="code-small selected" text-anchor="middle">A[1,0] = 3</text>
  <text x="370" y="281" class="code-small selected" text-anchor="middle">T[0,1] = 3</text>
  <text x="250" y="326" class="label" text-anchor="middle">两个逻辑索引引用存储中同一个元素</text>
  <rect class="panel" x="16" y="343" width="468" height="126" rx="10"/>
  <text x="24" y="371" class="label">共享存储（不移动数据，基址 1000）</text>
  <rect class="cell" x="98" y="383" width="61" height="42" rx="6"/>
  <text x="128.5" y="411" class="code" text-anchor="middle">2</text>
  <text x="128.5" y="445" class="code-small" text-anchor="middle">0</text>
  <rect class="cell" x="161" y="383" width="61" height="42" rx="6"/>
  <text x="191.5" y="411" class="code" text-anchor="middle">1</text>
  <text x="191.5" y="445" class="code-small" text-anchor="middle">4</text>
  <rect class="cell" x="224" y="383" width="61" height="42" rx="6"/>
  <text x="254.5" y="411" class="code" text-anchor="middle">4</text>
  <text x="254.5" y="445" class="code-small" text-anchor="middle">8</text>
  <rect class="target" x="287" y="383" width="61" height="42" rx="6"/>
  <text x="317.5" y="411" class="code selected" text-anchor="middle">3</text>
  <text x="317.5" y="445" class="code-small selected" text-anchor="middle">12</text>
  <rect class="cell" x="350" y="383" width="61" height="42" rx="6"/>
  <text x="380.5" y="411" class="code" text-anchor="middle">5</text>
  <text x="380.5" y="445" class="code-small" text-anchor="middle">16</text>
  <rect class="cell" x="413" y="383" width="61" height="42" rx="6"/>
  <text x="443.5" y="411" class="code" text-anchor="middle">6</text>
  <text x="443.5" y="445" class="code-small" text-anchor="middle">20</text>
  <text x="24" y="445" class="small">字节偏移</text>
  <text x="250" y="490" class="code-small selected" text-anchor="middle">元素偏移 3 = 字节偏移 12</text>
  <text x="250" y="513" class="code selected" text-anchor="middle">地址：1000 + 12 = 1012</text>
</svg>
