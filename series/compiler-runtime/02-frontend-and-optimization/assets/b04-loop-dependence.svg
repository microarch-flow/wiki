<svg xmlns="http://www.w3.org/2000/svg" width="442" height="423" viewBox="0 0 442 423" role="img" aria-labelledby="carried-title carried-desc">
  <title id="carried-title">后一轮怎样读到前一轮写入的值？</title>
  <desc id="carried-desc">数组 a 的初值为 [5, 0, 0, 0]。第 1 轮读 a[0] 的 5，写 a[1] 为 6。第 2 轮读 a[1] 的 6，写 a[2] 为 7。第 3 轮读 a[2] 的 7，写 a[3] 为 8。每条斜箭头把上一轮的写连到下一轮的读，并标出跨轮传递的元素和值。</desc>
  <defs>
    <marker id="across-tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2c6a72"/>
    </marker>
    <marker id="step-tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#396b55"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; text-anchor: middle; font-size: 20px }
    .heading { font-size: 21px; font-weight: 700 }
    .iter, .code, .add, .carry { font-family: "DejaVu Sans Mono", Consolas, monospace }
    .iter { font-size: 18px }
    .code { font-size: 22px }
    .add { font-size: 18px }
    .carry { fill: #265e65; font-size: 19px }
    .note { font-size: 18px; fill: #416354 }
    .read { fill: #e4edec; stroke: #759696; stroke-width: 1.5 }
    .write { fill: #d9e9dc; stroke: #6f9a80; stroke-width: 1.5 }
    .step { fill: none; stroke: #396b55; stroke-width: 2; marker-end: url(#step-tip) }
    .across { fill: none; stroke: #2c6a72; stroke-width: 2.4; marker-end: url(#across-tip) }
  </style>
  <rect x="1" y="1" width="440" height="421" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>
  <text class="heading" x="221" y="34">a 的初值为 [5, 0, 0, 0]</text>

  <g transform="translate(0 54)">
    <text class="iter" x="41" y="39">i = 1</text>
    <rect class="read" x="80" y="0" width="128" height="66" rx="9"/>
    <text x="144" y="26">读 a[0]</text>
    <text class="code" x="144" y="54">5</text>
    <text class="add" x="245" y="28">+1</text>
    <path class="step" d="M213 38H276"/>
    <rect class="write" x="281" y="0" width="137" height="66" rx="9"/>
    <text x="349.5" y="26">写 a[1]</text>
    <text class="code" x="349.5" y="54">6</text>
  </g>
  <path class="across" d="M350 120L148 179"/>
  <text class="carry" x="304" y="164">a[1] = 6</text>

  <g transform="translate(0 182)">
    <text class="iter" x="41" y="39">i = 2</text>
    <rect class="read" x="80" y="0" width="128" height="66" rx="9"/>
    <text x="144" y="26">读 a[1]</text>
    <text class="code" x="144" y="54">6</text>
    <text class="add" x="245" y="28">+1</text>
    <path class="step" d="M213 38H276"/>
    <rect class="write" x="281" y="0" width="137" height="66" rx="9"/>
    <text x="349.5" y="26">写 a[2]</text>
    <text class="code" x="349.5" y="54">7</text>
  </g>
  <path class="across" d="M350 248L148 307"/>
  <text class="carry" x="304" y="292">a[2] = 7</text>

  <g transform="translate(0 310)">
    <text class="iter" x="41" y="39">i = 3</text>
    <rect class="read" x="80" y="0" width="128" height="66" rx="9"/>
    <text x="144" y="26">读 a[2]</text>
    <text class="code" x="144" y="54">7</text>
    <text class="add" x="245" y="28">+1</text>
    <path class="step" d="M213 38H276"/>
    <rect class="write" x="281" y="0" width="137" height="66" rx="9"/>
    <text x="349.5" y="26">写 a[3]</text>
    <text class="code" x="349.5" y="54">8</text>
  </g>
  <text class="note" x="221" y="405">斜箭头标出下一轮需要读取的值。</text>
</svg>
