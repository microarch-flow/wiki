<svg xmlns="http://www.w3.org/2000/svg" width="456" height="487" viewBox="0 0 456 487" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">循环头每次从来路取得 i 和 t</title>
  <desc id="loop-desc">start 计算 t0 等于 a 加 b，首次进入 head 时传入零和 t0。head 接收块参数 i、t，检查 i 是否小于 n。若为假，走到 exit 返回 t。若为真，body 计算 i_next 等于 i 加一，t_next 等于 t 加 c，经回边将二者传给 head，作为下一次的 i 和 t。所有箭头表示控制转移，虚线是回边。</desc>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#396b55"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2c6a72"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173d35; text-anchor: middle; font-size: 20px }
    .name, .code { font-family: "DejaVu Sans Mono", Consolas, monospace }
    .name { font-size: 22px; font-weight: bold }
    .code { font-size: 20px }
    .legend { font-size: 18px; fill: #416354 }
    .block { fill: #e0ebe3; stroke: #82a18e; stroke-width: 1.5 }
    .head { fill: #d9e9dc; stroke: #6f9a80; stroke-width: 1.5 }
    .edge { fill: none; stroke: #396b55; stroke-width: 2; marker-end: url(#loop-arrow) }
    .back { fill: none; stroke: #2c6a72; stroke-width: 2.4; stroke-dasharray: 7 4; marker-end: url(#return-arrow) }
    .arrival { text-anchor: start }
    .next { fill: #265e65; text-anchor: start }
  </style>
  <rect x="1" y="1" width="454" height="485" rx="14" fill="#f5f6ef" stroke="#c4d0c4"/>

  <path class="edge" d="M178 85V143"/>
  <text class="arrival" x="193" y="121">首次传入 (0, t0)</text>
  <path class="edge" d="M286 185H336"/>
  <text x="312" y="174">假</text>
  <path class="edge" d="M178 227V277"/>
  <text x="199" y="260">真</text>
  <path class="back" d="M178 370V401H27V185H70"/>
  <text class="next" x="26" y="431">回边传入 (i_next, t_next)</text>

  <rect class="block" x="72" y="16" width="214" height="69" rx="11"/>
  <text class="name" x="179" y="43">start</text>
  <text class="code" x="179" y="71">t0 = a + b</text>

  <rect class="head" x="72" y="145" width="214" height="82" rx="11"/>
  <text class="name" x="179" y="177">head(i, t)</text>
  <text class="code" x="179" y="210">i &lt; n ?</text>

  <rect class="block" x="338" y="150" width="107" height="70" rx="11"/>
  <text class="name" x="391.5" y="177">exit</text>
  <text class="code" x="391.5" y="205">return t</text>

  <rect class="block" x="72" y="279" width="214" height="91" rx="11"/>
  <text class="name" x="179" y="305">body</text>
  <text class="code" x="179" y="332">i_next = i + 1</text>
  <text class="code" x="179" y="358">t_next = t + c</text>

  <path d="M18 447H438" stroke="#b9c9b9"/>
  <text class="legend" x="228" y="473">箭头表示控制转移，虚线标出返回循环头的路径。</text>
</svg>
